<script>
// Ajoute un secret partage sur tous les appels au proxy Airtable, pour
// empecher un acces direct a l'API sans passer par cette page (voir
// api/airtable-proxy.js pour le detail et les limites de cette protection).
(function() {
  var APP_SECRET = "97960bb3f41d75c71ba3e831a7acb90ab324549734e27d6a";
  var _fetch = window.fetch;
  window.fetch = function(url, opts) {
    if (typeof url === "string" && url.indexOf("/api/airtable") === 0) {
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers || {}, { "X-App-Secret": APP_SECRET });
    }
    return _fetch(url, opts);
  };
})();

// Contexte multi-client + authentification (Auth #003). Verifie d'abord la
// session (api/verif-securite?action=session) :
//  - Pas de session -> redirection vers auth-login.html.
//  - Role TENANT_ADMIN -> tenantId de la session est la SEULE autorite pour
//    determiner le client charge. ?client=slug n'a plus aucun pouvoir
//    d'autorisation pour ce role (protection contre la manipulation du
//    parametre d'URL pour voir les donnees d'un autre tenant).
//  - Role SUPER_ADMIN_IKO -> ?client=slug reste une simple commodite de
//    navigation (choisir quel client regarder), le role est deja verifie
//    par la session, donc cet usage reste legitime.
//  - Autre role -> acces refuse (voir composant Login plus bas).
window.IKO_CLIENT_ID = null;
window.IKO_CLIENT_INFO = null;
window.IKO_ROLE = null;
window.IKO_ACCES_REFUSE = false;
window.IKO_CLIENT_READY = (async function () {
  try {
    var resSession = await fetch('/api/verif-securite?action=session');
    if (resSession.status === 401) {
      window.location.href = "/auth-login.html?retour=" + encodeURIComponent("/dashboard.html");
      return null;
    }
    var session = await resSession.json();
    window.IKO_ROLE = session.role;
    if (session.role !== "SUPER_ADMIN_IKO" && session.role !== "TENANT_ADMIN") {
      window.IKO_ACCES_REFUSE = true;
      return null;
    }

    if (session.role === "TENANT_ADMIN") {
      if (!session.tenantId) { window.IKO_ACCES_REFUSE = true; return null; }
      var rTenant = await fetch('/api/airtable/Clients/' + session.tenantId, {});
      if (!rTenant.ok) { window.IKO_ACCES_REFUSE = true; return null; }
      var recTenant = await rTenant.json();
      window.IKO_CLIENT_ID = recTenant.id;
      window.IKO_CLIENT_INFO = recTenant.fields || {};
      return recTenant.id;
    }

    // SUPER_ADMIN_IKO : ?client=slug = confort de navigation uniquement.
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('client');
    if (slug) { localStorage.setItem('iko_client_slug', slug); }
    else { slug = localStorage.getItem('iko_client_slug'); }
    if (!slug) return null;
    var formule = encodeURIComponent('{Slug}="' + slug + '"');
    var r = await fetch('/api/airtable/Clients?filterByFormula=' + formule + '&maxRecords=1', {});
    var json = await r.json();
    var rec = (json.records || [])[0];
    if (!rec) return null;
    window.IKO_CLIENT_ID = rec.id;
    window.IKO_CLIENT_INFO = rec.fields || {};
    return rec.id;
  } catch (e) { return null; }
})();
</script>

let AGENCES = ["Agence 1", "Agence 2", "Agence 3", "Agence 4"];

// Agences generiques et paramétrables (1 à 10), configurables par mode concepteur.
// Les valeurs stockees dans Airtable sont directement "Agence 1".."Agence N" —
// pas de nom d'entreprise/ville en dur, pour que ce soit reutilisable tel quel

let AGENCE_VERS_AIRTABLE = { "Agence 1": "Agence 1", "Agence 2": "Agence 2", "Agence 3": "Agence 3", "Agence 4": "Agence 4" };

function appliquerNombreAgences(n) {
  const nb = Math.max(1, Math.min(10, n || 4));
  AGENCES.length = 0;
  Object.keys(AGENCE_VERS_AIRTABLE).forEach(k => delete AGENCE_VERS_AIRTABLE[k]);
  for (let i = 1; i <= nb; i++) {
    const label = "Agence " + i;
    AGENCES.push(label);
    AGENCE_VERS_AIRTABLE[label] = label;
  }
}

// ---- Agences dynamiques (1 a 10) : lecture seule ----
// Agences du client courant (?client=slug) : table Agences (Actif=1) filtree sur
// ce client, plafonnee par Clients."Nombre agences" (max 10) ; a defaut de lignes,
// "Agence 1..N" selon "Nombre agences". null = pas de client -> repli demo inchange.
async function chargerNomsAgencesClient() {
  const info = window.IKO_CLIENT_INFO;
  const clientId = window.IKO_CLIENT_ID;
  if (!info || !clientId) return null;
  const nbBrut = parseInt(info["Nombre agences"], 10);
  const plafond = Math.max(1, Math.min(10, nbBrut || 10));
  let noms = [];
  try {
    if (info["Nom client"]) {
      const f = 'AND(FIND("' + String(info["Nom client"]).replace(/"/g, '') + '", ARRAYJOIN({Client})), {Actif}=1)';
      const r = await fetch('/api/airtable/Agences?filterByFormula=' + encodeURIComponent(f) + '&maxRecords=50');
      const j = await r.json();
      noms = (j.records || [])
        .filter(a => Array.isArray(a.fields["Client"]) && a.fields["Client"].includes(clientId) && a.fields["Nom agence"])
        .map(a => a.fields["Nom agence"]);
    }
  } catch (e) {}
  if (!noms.length && nbBrut) noms = Array.from({ length: plafond }, (_, i) => "Agence " + (i + 1));
  return noms.length ? noms.slice(0, plafond) : null;
}

function appliquerNomsAgences(noms) {
  AGENCES.length = 0;
  Object.keys(AGENCE_VERS_AIRTABLE).forEach(k => delete AGENCE_VERS_AIRTABLE[k]);
  noms.slice(0, 10).forEach(n => { AGENCES.push(n); AGENCE_VERS_AIRTABLE[n] = n; });
}

  const h = (hex || "var(--iko-primary)").replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

// Combine une formule Airtable existante avec le filtre "appartient au
// client courant" (si un client est charge via ?client=slug). Retourne la
// formule brute (non encodee), a passer ensuite a encodeURIComponent.
//
// IMPORTANT : ARRAYJOIN() sur un champ lien renvoie le nom affiche (champ
// primaire) des enregistrements lies, jamais leur record ID — confirme en
// prod (requete 200 OK, 0 resultat avec un filtre par ID). Le filtre doit
// donc porter sur le NOM du client, pas sur window.IKO_CLIENT_ID.
// Verifie par IDENTIFIANT que l'enregistrement appartient au client charge (ARRAYJOIN ne renvoie que
// le nom). Sans client charge (demo) : seuls les enregistrements sans "Compte client" sont acceptes.
function appartientAuClient(rec) {
  const liens = (rec && rec.fields && rec.fields["Compte client"]) || [];
  return window.IKO_CLIENT_ID ? (Array.isArray(liens) && liens.includes(window.IKO_CLIENT_ID)) : liens.length === 0;
}

function filtreAvecClient(baseFormula) {
  var nom = window.IKO_CLIENT_INFO && window.IKO_CLIENT_INFO["Nom client"];
  if (!nom) return baseFormula;
  var clause = 'FIND("' + String(nom).replace(/"/g, '\\"') + '", ARRAYJOIN({Compte client}))';
  if (!baseFormula) return clause;
  return 'AND(' + baseFormula + ',' + clause + ')';
}

// ---- TRI PAR DATE ----
const MOIS = {janvier:1,février:2,mars:3,avril:4,mai:5,juin:6,juillet:7,août:8,septembre:9,octobre:10,novembre:11,décembre:12};
const parseDateCreneau = (creneau) => {
  if (!creneau) return new Date(9999,0,1);
  // Correctif : \w+ ne matche pas les caractères accentués en JS (février,
  // août, décembre tombaient silencieusement sur janvier). \p{L}+ (avec le
  // flag u) matche toute lettre Unicode, accentuée ou non.
  const match = creneau.match(/(\d+)\s+(\p{L}+)(?:\s+(\d{4}))?/gu);
  if (!match) return new Date(9999,0,1);
  const last = match[match.length-1];
  const parts = last.match(/(\d+)\s+(\p{L}+)(?:\s+(\d{4}))?/u);
  if (!parts) return new Date(9999,0,1);
  const day = parseInt(parts[1]);
  const month = MOIS[parts[2].toLowerCase()] || 1;
  const year = parts[3] ? parseInt(parts[3]) : new Date().getFullYear();
  return new Date(year, month-1, day);
};

// ---- STATUTS "CLOS" (Terminé / Annulé) ----
const isStatutClos = (statut) => statut === "Terminé" || statut === "Annulé" || statut === "Supprimé";

// ==================== Bloc 5 : Suivi intelligent IKO (sans Toise) ====================
// Fonction pure, 100% déterministe, aucun appel Anthropic/Airtable : évalue
// un ticket déjà chargé et propose une priorité + les raisons (jamais une
// exécution automatique — juste une lecture des données déjà présentes).
// Priorités : "urgent" > "a_traiter" > "en_attente" > "termine".
const SEUIL_ANCIENNETE_JOURS = 5; // ticket ouvert plus longtemps -> signalé
const SEUIL_RDV_MODIFIE_JOURS = 2; // RDV modifié : acquittement attendu plus vite (impacte la tournée du technicien)
const SEUIL_NOTE_FAIBLE = 2; // note sur 5, à ce niveau ou en dessous -> client insatisfait
const SEUIL_NOTE_RECENTE_JOURS = 14; // au-delà, l'avis "vieillit" et sort de la liste (pas de champ "suivi effectué" disponible)
function evaluerPrioriteIKO(t) {
  const statut = t.fields?.Statut || "Nouveau";
  // Ancienneté : réutilise createdTime (champ natif Airtable, déjà présent
  // sur chaque enregistrement, déjà exploité ailleurs — ligne "Date création"
  // de l'export). Zéro nouveau champ, zéro appel supplémentaire. Limite
  // assumée : c'est la date de CRÉATION du ticket, pas la date exacte du
  // dernier changement de statut/flag — proxy raisonnable en l'absence de
  // tout champ de date dédié côté Airtable.
  const ageJours = t.createdTime ? Math.floor((Date.now() - new Date(t.createdTime).getTime()) / 86400000) : null;
  // Avis client faible : un SAV clos avec une mauvaise note reste un risque
  // commercial réel (client mécontent), invisible hors du panneau "Avis"
  // dédié. Fenêtre de 14 jours (pas de champ "suivi effectué" côté Airtable)
  // pour éviter qu'un vieil avis reste signalé indéfiniment.
  const noteFaibleRecente = typeof t.fields?.Note === "number" && t.fields.Note <= SEUIL_NOTE_FAIBLE &&
    ageJours !== null && ageJours <= SEUIL_NOTE_RECENTE_JOURS;
  const raisonNote = "Client insatisfait (" + t.fields?.Note + "/5) — un rappel peut être utile";

  if (isStatutClos(statut)) {
    if (noteFaibleRecente) return { priorite: "a_traiter", raisons: [raisonNote] };
    return { priorite: "termine", raisons: [] };
  }

  const urgent = t.fields?.Qualification === "Oui";
  const raisons = [];

  const dateCreneau = parseDateCreneau(t.fields?.Créneau);
  const aujourdhui = new Date(); aujourdhui.setHours(0, 0, 0, 0);
  const enRetard = t.fields?.Créneau && dateCreneau.getFullYear() < 9999 && dateCreneau < aujourdhui;

  if (!t.fields?.Créneau && (statut === "Nouveau" || !t.fields?.Statut)) raisons.push("Aucun créneau planifié");
  if (enRetard && (statut === "Nouveau" || statut === "En cours")) raisons.push("Créneau dépassé, ticket toujours ouvert");
  if (t.fields?.["Message client non lu"]) raisons.push("Message client en attente de réponse");
  if (t.fields?.["RDV modifié - notif technicien"]) {
    if (ageJours !== null && ageJours >= SEUIL_RDV_MODIFIE_JOURS) {
      raisons.push("RDV modifié non acquitté depuis " + ageJours + " jour" + (ageJours > 1 ? "s" : ""));
    } else {
      raisons.push("RDV modifié à vérifier");
    }
  }
  if (statut === "Devis à faire") raisons.push("Devis à établir");
  if (statut === "Devis refusé") raisons.push("Devis refusé, décision à prendre");
  if (t.fields?.["IKO Utilisé"] && (statut === "Nouveau" || statut === "En cours")) raisons.push("Diagnostic Max disponible, à exploiter pour clôturer");
  if (noteFaibleRecente) raisons.push(raisonNote);
  if (ageJours !== null && ageJours >= SEUIL_ANCIENNETE_JOURS) raisons.push("Ouvert depuis " + ageJours + " jours sans clôture");

  if (urgent) return { priorite: "urgent", raisons: raisons.length ? raisons : ["Ticket qualifié urgent"] };
  if (raisons.length) return { priorite: "a_traiter", raisons };
  if (["Devis envoyé", "Devis - Suivi", "Devis - Attente fournisseur"].includes(statut)) {
    return { priorite: "en_attente", raisons: ["En attente de retour (client ou fournisseur)"] };
  }
  return { priorite: "en_attente", raisons: [] };
}

// ==================== Notifications intelligentes IKO V1 ====================
// Lecture seule, purement déterministe (aucun LLM, aucun nouvel appel
// Airtable) : combine des données déjà en mémoire au niveau du Dashboard
// (tickets + ticketsATraiterIKO, déjà calculés ci-dessus par
// evaluerPrioriteIKO) avec les signaux prédictifs déjà livrés dans
// analytics-sav.js (genererSignauxPredictifsSAV, Mission "Détection
// prédictive SAV V1") — calculés uniquement à partir de
// calculerAnalyticsSAV(tickets), qui ne nécessite QUE les tickets déjà
// chargés (pas les interventions SAV, chargées à la demande ailleurs :
// aucun nouvel appel réseau introduit ici). Les signaux "agence"/
// "technicien" de genererSignauxPredictifsSAV (qui nécessitent les
// interventions) sont donc absents de ce bloc — limite assumée, pas une
// donnée inventée.
//
// N'affiche jamais le détail ticket par ticket déjà présent dans le bloc
// "🎯 À traiter" juste au-dessus (pour éviter un doublon évident) : une
// seule notification agrégée y renvoie.
const LABELS_NIVEAU_NOTIF_IKO = { faible: "Niveau faible", moyen: "Niveau moyen", fort: "Niveau fort" };
const COULEURS_NIVEAU_NOTIF_IKO = { faible: "#8a8a8a", moyen: "var(--iko-primary)", fort: "var(--iko-erreur)" };

function genererNotificationsIKO(tickets, ticketsATraiterIKO) {
  const notifications = [];

  // ---- Résumé agrégé du suivi ticket-level déjà existant (🎯 À traiter).
  if (ticketsATraiterIKO.length > 0) {
    const nbUrgent = ticketsATraiterIKO.filter(x => x.info.priorite === "urgent").length;
    notifications.push({
      type: nbUrgent > 0 ? "urgent" : "action",
      titre: nbUrgent > 0 ? "SAV urgent nécessitant une action" : "Interventions nécessitant une action",
      information: ticketsATraiterIKO.length + " ticket(s) signalé(s) par le suivi IKO" + (nbUrgent > 0 ? ", dont " + nbUrgent + " urgent(s)" : "") + ".",
      niveau: nbUrgent >= 3 ? "fort" : (nbUrgent > 0 || ticketsATraiterIKO.length >= 3) ? "moyen" : "faible",
      contexte: ticketsATraiterIKO.slice(0, 5).map(x => x.t.fields?.Name).filter(Boolean).join(", ") || "Plusieurs tickets",
      action: "Voir le bloc « 🎯 À traiter » ci-dessus pour le détail par ticket.",
    });
  }

  // ---- Message(s) client en attente (champ déjà chargé sur chaque
  // ticket, cf. stats.messagesNonLus) : agrégé en une seule notification.
  const messagesNonLus = tickets.filter(t => t.fields?.["Message client non lu"] && !isStatutClos(t.fields?.Statut));
  if (messagesNonLus.length > 0) {
    notifications.push({
      type: "confirmation",
      titre: "Message(s) client en attente de réponse",
      information: messagesNonLus.length + " ticket(s) avec un message client non lu.",
      niveau: messagesNonLus.length >= 3 ? "moyen" : "faible",
      contexte: messagesNonLus.slice(0, 5).map(t => t.fields?.Name).filter(Boolean).join(", "),
      action: "Lire et répondre au client depuis le ticket concerné.",
    });
  }

  // ---- Signaux prédictifs SAV : réutilisation stricte de
  // window.AnalyticsSAV.genererSignauxPredictifsSAV (déjà livré, mêmes
  // seuils et garde-fous anti faux-positif — aucun nouveau calcul de fond).
  try {
    const analytics = window.AnalyticsSAV.calculerAnalyticsSAV(tickets);
    const signaux = window.AnalyticsSAV.genererSignauxPredictifsSAV({
      tauxUrgents: analytics.tauxUrgents,
      topCauses: analytics.topCauses,
      topProduitsDetail: analytics.topProduitsDetail,
    });
    signaux.forEach(s => {
      notifications.push({
        type: "predictif",
        titre: s.probleme,
        information: s.donneeObservee,
        niveau: s.niveau,
        contexte: [s.produit, s.agence, s.technicien].filter(Boolean).join(" / ") || "Ensemble des tickets chargés",
        action: s.action,
      });
    });
  } catch (e) {
    // Défensif : une erreur de calcul ne doit jamais faire planter le
    // dashboard ni afficher une notification inventée.
  }

  const ORDRE_NIVEAU = { fort: 0, moyen: 1, faible: 2 };
  notifications.sort((a, b) => (ORDRE_NIVEAU[a.niveau] ?? 3) - (ORDRE_NIVEAU[b.niveau] ?? 3));
  return notifications;
}

const COULEURS_CONFIANCE_DASH = { "Confiance faible": "var(--iko-erreur)", "Confiance moyenne": "var(--iko-primary)", "Confiance élevée": "var(--iko-primary)" };
function extraireConfianceDiagnosticMax(texte) {

function parseMessageEntries(raw, sender) {
  if (!raw) return [];
  const parts = raw.split(/\n\n(?=\[\d{2}\/\d{2}\/\d{4} \d{2}:\d{2}\])/);
  return parts.map(part => {
    const m = part.match(/^\[(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})\]\n([\s\S]*)$/);
    if (!m) return { sender, dateLabel: '', text: part.trim(), sortKey: 0 };
    const [, dd, mm, yyyy, hh, min, text] = m;
    const sortKey = new Date(+yyyy, +mm - 1, +dd, +hh, +min).getTime();
    return { sender, dateLabel: dd + '/' + mm + ' ' + hh + ':' + min, text: text.trim(), sortKey };
  });
}

function PhoneChatModal({ clientName, entries, texteReponse, onChangeTexte, onEnvoyer, envoiReponse, nonLu, onMarquerLu, onClose }) {
  const scrollRef = React.useRef(null);
  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [entries.length]);

  // Fenêtre déplaçable : on suit le pointeur depuis la barre d'en-tête
  // (comme une fenêtre d'app de bureau) et on applique le décalage en plus
  // du centrage initial via un translate() additif.
  const [pos, setPos] = React.useState({ x: 0, y: 0 });
  const [dragging, setDragging] = React.useState(false);

  const onDragStart = (e) => {
    dragRef.current = { startX: e.clientX, startY: e.clientY, origX: pos.x, origY: pos.y };
    setDragging(true);
    e.currentTarget.setPointerCapture(e.pointerId);
  };

    if (!dragRef.current) return;
    setPos({ x: dragRef.current.origX + (e.clientX - dragRef.current.startX), y: dragRef.current.origY + (e.clientY - dragRef.current.startY) });
  };

function TicketRow({ t, onStatusChange, onAnnuler, onSupprimer, onSupprimerDefinitivement, onRenvoyerMail, onRenvoyerMailClient, onDevis, onRepondreClient, onMarquerLu, isMessagePanelOpen, onToggleMessagePanel, onCloseMessagePanel, onRefreshTicket }) {

  // toutes les ~8-10s (élargi depuis ~3s pour économiser le quota Airtable
  // du plan Free). Délai légèrement aléatoire pour désynchroniser les
  // postes ouverts en simultané.
  React.useEffect(() => {
    if (!isMessagePanelOpen) return;
    let timeoutId;
    const tick = () => {
      onRefreshTicket(t.id);
      timeoutId = setTimeout(tick, 8000 + Math.random() * 2000);
    };
    timeoutId = setTimeout(tick, 8000 + Math.random() * 2000);
    return () => clearTimeout(timeoutId);
  }, [isMessagePanelOpen, t.id]);

  const envoyerReponse = async () => {
    if (!texteReponse.trim()) return;
    setEnvoiReponse('sending');
    try {
      await onRepondreClient(t, texteReponse.trim());
      setTexteReponse("");
      setEnvoiReponse('ok');
      setTimeout(() => { setEnvoiReponse(null); }, 1200);
    } catch (e) {
      setEnvoiReponse(null);
    }
  };

  const urgent = t.fields?.Qualification === "Oui";
  const rdvModifie = !!t.fields?.["RDV modifié - notif technicien"];
  // Bloc 5 (extension) : durée d'attente d'acquittement, même proxy
  // createdTime que le signal d'ancienneté général (aucune date dédiée
  // n'existe côté Airtable pour ce flag).
  const ageJoursRdv = rdvModifie && t.createdTime ? Math.floor((Date.now() - new Date(t.createdTime).getTime()) / 86400000) : null;
  const diagnosticMaxUtilise = !!t.fields?.["IKO Utilisé"]; // Bloc 3 - axe C : traçabilité diagnostic Max
  // Extension Bloc 5 : avis client faible et récent (même fenêtre que evaluerPrioriteIKO).
  const ageJoursTicket = t.createdTime ? Math.floor((Date.now() - new Date(t.createdTime).getTime()) / 86400000) : null;
  const noteFaibleRecente = typeof t.fields?.Note === "number" && t.fields.Note <= SEUIL_NOTE_FAIBLE &&
    ageJoursTicket !== null && ageJoursTicket <= SEUIL_NOTE_RECENTE_JOURS;
  const statut = t.fields?.Statut || "Nouveau";
  const statusColors = {
    "Nouveau": { color: C.bleu, bg: C.bleuDim },
    "En cours": { color: C.jaune, bg: C.jauneDim },
    "Devis à faire": { color: "var(--iko-bg-sombre)", bg: "rgba(var(--iko-dark-rgb),0.08)" },
    "Devis envoyé": { color: "var(--iko-bg-sombre)", bg: "rgba(var(--iko-dark-rgb),0.08)" },
    "Devis refusé": { color: C.rouge, bg: C.rougeDim },
    "Terminé": { color: C.vert, bg: C.vertDim },
    "Annulé": { color: C.muted, bg: "#F3F4F6" },
    "Supprimé": { color: C.muted, bg: "#F3F4F6" },
  };
  const sc = statusColors[statut] || statusColors["Nouveau"];
  const clos = isStatutClos(statut);
  const pasDeContact = !!t.fields?.["Pas de contact client"];
  return (
    <>
    <div id={"ticket-"+t.id} style={{background:C.card,border:"1px solid "+(urgent?"rgba(var(--iko-erreur-rgb),0.3)":C.border),borderRadius:"10px",padding:"12px 16px",display:"flex",gap:"12px",alignItems:"flex-start",opacity:clos?0.6:1}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap",marginBottom:"6px"}}>
          <span style={{fontSize:"12px",fontWeight:"900",color:C.or,fontFamily:"monospace"}}>{t.fields?.Name||"—"}</span>
          {urgent && <Badge label="URGENT" color={C.rouge} bg={C.rougeDim} style={{animation:"clignoteUrgent 1.1s ease-in-out infinite"}}/>}
          {rdvModifie && <Badge label={"🔄 RDV modifié" + (ageJoursRdv !== null && ageJoursRdv >= SEUIL_RDV_MODIFIE_JOURS ? " · " + ageJoursRdv + "j sans acquittement" : "")} color={C.bleu} bg={C.bleuDim}/>}
          {diagnosticMaxUtilise && <Badge label="🧠 Diagnostic Max" color={C.vert} bg={C.vertDim}/>}
          {noteFaibleRecente && <Badge label={"⚠️ Avis " + t.fields.Note + "/5"} color={C.rouge} bg={C.rougeDim}/>}
          <Badge label={statut} color={sc.color} bg={sc.bg}/>
          {t.fields?.["Source"] === "telephone" && <Badge label="📞 Tél." color={C.jaune} bg={C.jauneDim}/>}
          <span style={{fontSize:"10px",color:C.muted,marginLeft:"auto"}}>{t.fields?.Agence}</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 16px"}}>
          <div style={{display:"flex",flexDirection:"column",gap:"4px"}}>
            {[["👤",t.fields?.Client],["📍",t.fields?.Adresse],["📞",t.fields?.Téléphone]].map(([icon,val],i) => val?(
              <div key={i} style={{fontSize:"11px",color:C.muted,display:"flex",gap:"5px",alignItems:"flex-start"}}>
                <span style={{flexShrink:0}}>{icon}</span>
                <span style={{color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{val}</span>
              </div>
            ):null)}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:"4px"}}>
            {[["📦",t.fields?.Produit],["🔧",t.fields?.Problème],["📅",t.fields?.Créneau]].map(([icon,val],i) => val?(
              <div key={i} style={{fontSize:"11px",color:C.muted,display:"flex",gap:"5px",alignItems:"flex-start"}}>
                <span style={{flexShrink:0}}>{icon}</span>
                <span style={{color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{val}</span>
              </div>
            ):null)}
          </div>
        </div>
        {t.fields?.Photos && (
          <a href={t.fields.Photos.split(',')[0].trim()} target="_blank" style={{fontSize:"11px",color:C.or,fontWeight:"700",textDecoration:"none",display:"flex",alignItems:"center",gap:"5px",marginTop:"6px"}}>
            📎 Voir la/les photo(s)
          </a>
        )}
        {t.fields?.Commentaire && (
          <div style={{marginTop:"8px",background:"#F3F4F6",border:"1px solid "+C.border,borderRadius:"8px",padding:"7px 10px",fontSize:"11px",color:C.muted,fontStyle:"italic"}}>
            💬 {t.fields.Commentaire}
          </div>
        )}
        {t.fields?.Diagnostic && (
          <div style={{marginTop:"8px",background:"rgba(var(--iko-dark-rgb),0.04)",border:"1px solid rgba(var(--iko-dark-rgb),0.15)",borderRadius:"8px",padding:"7px 10px",fontSize:"11px",color:"var(--iko-bg-sombre)"}}>
            📋 {t.fields.Diagnostic}
          </div>
        )}
        {t.fields?.["IKO Diagnostic"] && (
          <div style={{marginTop:"8px",background:"rgba(var(--iko-primary-rgb),0.06)",border:"1px solid rgba(var(--iko-primary-rgb),0.25)",borderRadius:"8px",padding:"7px 10px",fontSize:"11px",color:C.text,whiteSpace:"pre-line"}}>
            🧠 <strong>Diagnostic Max</strong>{t.fields?.["IKO Diagnostic Date"] ? " · " + new Date(t.fields["IKO Diagnostic Date"]).toLocaleString('fr-FR') : ""}
            {(() => {
              const { confiance, corps } = extraireConfianceDiagnosticMax(t.fields["IKO Diagnostic"]);
              return (
                <>
                  {confiance && (
                    <span style={{display:"inline-block",marginLeft:"6px",padding:"1px 7px",borderRadius:"10px",fontSize:"9px",fontWeight:"800",color:"#fff",background:COULEURS_CONFIANCE_DASH[confiance]}}>
                      {confiance}
                    </span>
                  )}
                  <div style={{marginTop:"3px"}}>{corps}</div>
                </>
              );
            })()}
          </div>
        )}
        {t.fields?.["Montant devis"] && (statut === "Devis envoyé" || statut === "Devis refusé") && (
          <div style={{marginTop:"8px",fontSize:"12px",color:C.text}}>💶 Devis envoyé : <strong>{t.fields["Montant devis"]} € TTC</strong></div>
        )}
        {statut === "Devis à faire" && (
          <button onClick={() => onDevis(t)} style={{marginTop:"10px",width:"100%",background:"var(--iko-bg-sombre)",color:"#fff",border:"none",borderRadius:"8px",padding:"10px",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
            💶 Établir et envoyer le devis
          </button>
        )}
        <div style={{marginTop:"10px",paddingTop:"8px",borderTop:"1px solid "+C.border}}>
          <div style={{fontSize:"9px",fontWeight:"700",color:C.muted,letterSpacing:"1px",marginBottom:"6px"}}>📤 RENVOI TICKET</div>
          <div style={{display:"flex",gap:"8px"}}>
            <button onClick={() => onRenvoyerMail(t.fields?.Name)} style={{flex:1,background:"var(--iko-primary)",color:"var(--iko-dark)",border:"none",borderRadius:"8px",padding:"8px 10px",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
              📧 Technicien
            </button>
            {pasDeContact ? (
              <button disabled title="Pas de contact possible : client sans email ni téléphone exploitable (RDV pris par téléphone)."
                style={{flex:1,background:"#E5E7EB",color:"#9CA3AF",border:"none",borderRadius:"8px",padding:"8px 10px",fontWeight:"700",fontSize:"12px",cursor:"not-allowed"}}>
                🚫 Client
              </button>
            ) : (
              <button onClick={() => onRenvoyerMailClient(t.fields?.Name)} style={{flex:1,background:"var(--iko-primary)",color:"var(--iko-dark)",border:"none",borderRadius:"8px",padding:"8px 10px",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
                📧 Client
              </button>
            )}
            {t.fields?.["Message client"] && (
              <button onClick={onToggleMessagePanel}
                className={nonLu ? "alert-blink" : ""}
                style={{flex:1,background:nonLu?"var(--iko-erreur)":"var(--iko-primary)",color:nonLu?"#fff":"var(--iko-dark)",border:"none",borderRadius:"8px",padding:"8px 10px",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
                💬 Message du client
              </button>
            )}
          </div>
        </div>
      </div>
      <div style={{flexShrink:0,display:"flex",flexDirection:"column",gap:"6px",alignItems:"stretch"}}>
        <select value={statut} onChange={e => e.target.value === "Annulé" ? onAnnuler(t) : onStatusChange(t.id, e.target.value)}
          style={{background:"#FFFFFF",border:"1px solid "+C.border,color:C.text,borderRadius:"8px",padding:"5px 8px",fontSize:"11px",cursor:"pointer"}}>
          <option>Nouveau</option><option>En cours</option><option>Devis à faire</option><option>Devis envoyé</option><option>Devis - Suivi</option><option>Devis - Attente fournisseur</option><option>Devis refusé</option><option>Terminé</option><option>Annulé</option>
        </select>
        <button onClick={() => (statut === "Annulé" || statut === "Supprimé") ? onSupprimerDefinitivement(t) : onSupprimer(t)}
          title={(statut === "Annulé" || statut === "Supprimé") ? "Supprimer définitivement" : "Archiver (déplace vers l'onglet Archives)"}
          style={{background:"transparent",border:"1px solid rgba(var(--iko-erreur-rgb),0.3)",color:C.rouge,borderRadius:"8px",padding:"4px 8px",fontSize:"10px",cursor:"pointer"}}>
          {(statut === "Annulé" || statut === "Supprimé") ? "🗑️ Définitivement" : "🗑️ Archiver"}
        </button>
      </div>
    </div>
    {isMessagePanelOpen && t.fields?.["Message client"] && (
      <PhoneChatModal
        clientName={t.fields?.Client}
        entries={[
          ...parseMessageEntries(t.fields?.["Message client"], 'client'),
          ...parseMessageEntries(t.fields?.["Réponse agence"], 'agence'),
        ].sort((a, b) => a.sortKey - b.sortKey)}
        texteReponse={texteReponse}
        onChangeTexte={setTexteReponse}
        onEnvoyer={envoyerReponse}
        envoiReponse={envoiReponse}
        nonLu={nonLu}
        onMarquerLu={() => onMarquerLu(t)}
        onClose={onCloseMessagePanel}
      />
    )}
    </>
  );
}

// ---- MODAL AJOUT RDV ----
function ModalRdv({ agenceAccess, onClose, onSuccess, initialAgence }) {
  const today = new Date().toISOString().split('T')[0];
  const [form, setForm] = React.useState({
    agence: agenceAccess !== "global" ? agenceAccess : (initialAgence || AGENCES[0]),
    nom: "", tel: "", email: "", sansEmail: false, adresse: "", codePostal: "", ville: "",
    produit: "Fenêtre", probleme: PROBLEMES["Fenêtre"][0].l,
    date: today, creneau: "Matin (8h30 — 12h00)",
    garantie: false, facture: "", notes: ""
  });
  const [saving, setSaving] = React.useState(false);
  const [error, setError] = React.useState("");

  const set = (k, v) => setForm(prev => ({...prev, [k]: v}));

  const handleProduit = (p) => {
    set("produit", p);
    set("probleme", PROBLEMES[p]?.[0]?.l || "Autre");
  };

  const sauvegarder = async () => {
    if (!form.nom.trim() || !form.tel.trim() || !form.date) {
      setError("Nom, téléphone et date sont obligatoires."); return;
    }
    if (form.adresse.trim() && (!form.codePostal.trim() || !/^\d{5}$/.test(form.codePostal.trim()) || !form.ville.trim())) {
      setError("Code postal (5 chiffres) et ville sont obligatoires si une adresse est renseignée."); return;
    }
    setSaving(true); setError("");
    try {
      await window.IKO_CLIENT_READY;
      const emailFinal = form.sansEmail ? "" : form.email;
      const adresseComplete = form.adresse.trim() + (form.codePostal || form.ville ? ', ' + form.codePostal + ' ' + form.ville : '');
      const num = 'SAV-' + new Date().getFullYear() + '-' + (Math.floor(Math.random()*9000)+1000);
      const dateLabel = form.creneau === "Matin (8h30 — 12h00)" ? "Matin (8h30 — 12h00)" : "Après-midi (13h00 — 17h00)";
      // Creneau libre du bon client ET de la bonne agence (route serveur /api/airtable/creneaux).
      const dispoRdv = await IKO_creneaux.charger({ agence: AGENCE_VERS_AIRTABLE[form.agence], creneau: dateLabel, date: form.date, admin: 1, clientId: window.IKO_CLIENT_ID });
      const planJson = { records: dispoRdv.map(c => ({ id: c.id })) };
      let planningId = '';
      if (planJson.records?.length > 0) {
        planningId = planJson.records[0].id;
        await fetch('/api/airtable/Planning/' + planningId, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: { Statut: 'Pris' } })
        });
      }
      const urgentTexte = isUrgentProbleme(form.produit, form.probleme) ? "Oui" : "Non";
      const garantieTexte = form.garantie ? "Oui - Facture " + (form.facture || "") : "Non / Hors garantie";
      await fetch(WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          marque: 'iko',
          ticket: num, agence: AGENCE_VERS_AIRTABLE[form.agence] || form.agence, nom: form.nom, tel: form.tel,
          "e-mail": emailFinal || "aucun@rsia.fr",
          adresse: adresseComplete, produit: form.produit, probleme: form.probleme,
          creneau: dateLabel + ' — ' + new Date(form.date + 'T12:00:00').toLocaleDateString('fr-FR', {weekday:'long',day:'numeric',month:'long'}),
          garantie: garantieTexte, facture: form.facture, urgent: urgentTexte, photos: '', planningId
        })
      });
      try {
        await fetch('/api/airtable/push', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'send', agence: AGENCE_VERS_AIRTABLE[form.agence] || form.agence,
            title: '📞 Nouveau RDV — ' + num,
            body: form.nom + ' — ' + form.produit + ' — ' + dateLabel,
          })
        });
      } catch (pushErr) { /* non bloquant */ }
      onSuccess(num);
    } catch(e) {
      setError("Erreur lors de l'enregistrement. Vérifiez la connexion.");
    }
    setSaving(false);
  };

  const labelStyle = { fontSize:"11px", fontWeight:"700", color:C.muted, display:"block", marginBottom:"4px" };
  const groupStyle = { marginBottom:"14px" };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}}>
          <div>
            <div style={{fontSize:"16px",fontWeight:"900",color:C.white}}>📞 Nouveau RDV téléphone</div>
            <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>Prise de rendez-vous manuelle</div>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.05)",border:"1px solid "+C.border,color:C.muted,borderRadius:"8px",width:"30px",height:"30px",cursor:"pointer",fontSize:"16px"}}>✕</button>
        </div>
        <div style={groupStyle}>
          <label style={labelStyle}>Agence *</label>
          <select value={form.agence} onChange={e => set("agence", e.target.value)} disabled={agenceAccess !== "global" || AGENCES.length === 1}>
            {AGENCES.map(a => <option key={a}>{a}</option>)}
          </select>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}}>
          <div><label style={labelStyle}>Nom et prénom *</label><input placeholder="Jean Dupont" value={form.nom} onChange={e => set("nom",e.target.value)}/></div>
          <div><label style={labelStyle}>Téléphone *</label><input placeholder="06 12 34 56 78" value={form.tel} onChange={e => set("tel",e.target.value)}/></div>
        </div>
        <div style={{marginBottom:"10px",display:"flex",alignItems:"center",gap:"8px"}}>
          <input type="checkbox" id="sansEmail" checked={form.sansEmail} onChange={e => set("sansEmail", e.target.checked)} style={{width:"16px",height:"16px",cursor:"pointer"}}/>
          <label htmlFor="sansEmail" style={{fontSize:"12px",color:C.muted,cursor:"pointer"}}>Client sans email / internet (RDV téléphone uniquement)</label>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}}>
          <div>
            <label style={labelStyle}>Email</label>
            {form.sansEmail
              ? <div style={{fontSize:"12px",color:C.muted,padding:"10px 0"}}>— Aucun email (le ticket sera confirmé par téléphone) —</div>
              : <input placeholder="jean@gmail.com" value={form.email} onChange={e => set("email",e.target.value)}/>
            }
          </div>
          <div><label style={labelStyle}>Adresse (n° et rue) *</label><input placeholder="12 rue des Lilas" value={form.adresse} onChange={e => set("adresse",e.target.value)}/></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:"10px",marginBottom:"14px"}}>
          <div><label style={labelStyle}>Code postal *</label><input placeholder="75000" inputMode="numeric" maxLength={5} value={form.codePostal} onChange={e => set("codePostal",e.target.value.replace(/\D/g,''))}/></div>
          <div><label style={labelStyle}>Ville *</label><input placeholder="Tarbes" value={form.ville} onChange={e => set("ville",e.target.value)}/></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}}>
          <div>
            <label style={labelStyle}>Produit *</label>
            <select value={form.produit} onChange={e => handleProduit(e.target.value)}>{PRODUITS.map(p => <option key={p}>{p}</option>)}</select>
          </div>
          <div>
            <label style={labelStyle}>Problème *</label>
            <select value={form.probleme} onChange={e => set("probleme",e.target.value)}>{(PROBLEMES[form.produit]||[{l:"Autre"}]).map(p => <option key={p.l} value={p.l}>{p.l}{p.u?" ⚠️":""}</option>)}</select>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}}>
          <div><label style={labelStyle}>Date d'intervention *</label><input type="date" value={form.date} min={today} onChange={e => set("date",e.target.value)}/></div>
          <div>
            <label style={labelStyle}>Créneau *</label>
            <select value={form.creneau} onChange={e => set("creneau",e.target.value)}>
              <option value="Matin (8h30 — 12h00)">🌅 Matin (8h30 — 12h00)</option>
              <option value="Après-midi (13h00 — 17h00)">🌇 Après-midi (13h00 — 17h00)</option>
            </select>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px",background:"#F3F4F6",borderRadius:"8px",padding:"10px 14px"}}>
          <input type="checkbox" id="garantie" checked={form.garantie} onChange={e => set("garantie",e.target.checked)} style={{width:"16px",cursor:"pointer"}}/>
          <label htmlFor="garantie" style={{fontSize:"12px",color:C.text,cursor:"pointer"}}>Produit sous garantie</label>
          {form.garantie && <input placeholder="N° facture" value={form.facture} onChange={e => set("facture",e.target.value)} style={{flex:1,marginLeft:"8px"}}/>}
        </div>
        {error && <div style={{background:C.rougeDim,border:"1px solid rgba(var(--iko-erreur-rgb),0.3)",borderRadius:"8px",padding:"8px 12px",fontSize:"11px",color:C.rouge,marginBottom:"14px"}}>{error}</div>}
        <div style={{display:"flex",gap:"10px"}}>
          <button onClick={onClose} style={{flex:1,padding:"11px",background:"transparent",color:C.muted,border:"1px solid "+C.border,borderRadius:"10px",fontSize:"12px",cursor:"pointer"}}>Annuler</button>
          <button onClick={sauvegarder} disabled={saving} style={{flex:2,padding:"11px",background:saving?"#D1D5DB":C.or,color:saving?C.muted:"var(--iko-dark)",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:saving?"not-allowed":"pointer"}}>
            {saving ? "⏳ Enregistrement..." : "✓ Confirmer le RDV"}
          </button>
        </div>
      </div>
    </div>
  );
}

const TOUTES = "__toutes__";
const fmtDateFR = (s) => { try { return s.split("-").reverse().join("/"); } catch(e) { return s; } };
const MOTIFS_BLOCAGE = ["Congés", "Long week-end", "Jour férié", "Fermeture exceptionnelle", "Autre (à préciser)"];

// ---- MODAL BLOCAGE DATES (congés / absences techniciens par agence) ----
function ModalBlocage({ agenceAccess, onClose, onSuccess, initialAgence, initialDateDebut, initialDateFin, initialMotif }) {
  const today = new Date().toISOString().split('T')[0];
  const [agence, setAgence] = React.useState(agenceAccess !== "global" ? agenceAccess : (initialAgence || AGENCES[0]));
  const [dateDebut, setDateDebut] = React.useState(initialDateDebut || today);
  const [dateFin, setDateFin] = React.useState(initialDateFin || today);
  const [motif, setMotif] = React.useState(initialMotif && MOTIFS_BLOCAGE.includes(initialMotif) ? initialMotif : MOTIFS_BLOCAGE[0]);
  const [motifLibre, setMotifLibre] = React.useState(initialMotif && !MOTIFS_BLOCAGE.includes(initialMotif) ? initialMotif : "");
  const [saving, setSaving] = React.useState(false);
  const [error, setError] = React.useState("");
  const [fait, setFait] = React.useState(null);

  const labelStyle = { fontSize:"11px", fontWeight:"700", color:C.muted, display:"block", marginBottom:"4px" };
  const groupStyle = { marginBottom:"14px" };
  const inputStyle = { width:"100%", padding:"9px 11px", border:"1px solid "+C.border, borderRadius:"8px", fontSize:"13px", boxSizing:"border-box" };

  const bloquer = async () => {
    if (dateFin < dateDebut) { setError("La date de fin doit être après la date de début."); return; }
    const motifFinal = motif.startsWith("Autre") ? motifLibre.trim() : motif;
    if (!motifFinal) { setError("Précisez le motif de la fermeture."); return; }
    setSaving(true); setError("");
    try {
      await window.IKO_CLIENT_READY;
      const listeAgences = agence === TOUTES ? AGENCES : [agence];
      // Le champ Date est du texte au format AAAA-MM-JJ : la comparaison
      // lexicographique >= / <= fonctionne car le format est trié naturellement.
      let creneaux = [];
      for (const ag of listeAgences) {
        const agenceReelle = AGENCE_VERS_AIRTABLE[ag] || ag;
        const l = await IKO_creneaux.charger({ agence: agenceReelle, du: dateDebut, au: dateFin, admin: 1, clientId: window.IKO_CLIENT_ID });
        creneaux = creneaux.concat(l);
      }
      if (creneaux.length === 0) {
        setError("Aucun créneau libre à bloquer sur cette période (déjà pris, déjà bloqué, ou hors planning existant).");
        setSaving(false); return;
      }
      // Les week-ends ne sont jamais générés dans le Planning : rien à bloquer
      // en plus pour eux, ils sont déjà absents des créneaux disponibles.
      for (const c of creneaux) {
        await fetch('/api/airtable/Planning/' + c.id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: { Statut: 'Bloqué - ' + motifFinal } })
        });
      }
      setFait({ n: creneaux.length, motifFinal, agencesTxt: listeAgences.join(', ') });
    } catch(e) {
      setError("Erreur lors du blocage. Vérifiez la connexion.");
    }
    setSaving(false);
  };

  if (fait) {
    const periode = dateDebut === dateFin ? "le " + fmtDateFR(dateDebut) : "du " + fmtDateFR(dateDebut) + " au " + fmtDateFR(dateFin);
    const m = fait.motifFinal.toLowerCase();
    const raison = m.includes("férié") ? "du jour férié" : m.includes("week") ? "du long week-end" : m.includes("congé") ? "des congés de la direction" : "d'une fermeture exceptionnelle (" + fait.motifFinal + ")";
    const sujet = "Fermeture " + periode + " — " + fait.motifFinal;
    const corps = "Bonjour,\n\nEn raison " + raison + ", " + (agence === TOUTES ? "toutes les agences seront fermées" : "l'" + fait.agencesTxt.toLowerCase() + " sera fermée") + " " + periode + ".\n\nAucun rendez-vous SAV ne sera planifié sur cette période : les créneaux ont été bloqués dans le planning. Merci d'en informer vos équipes et de prévenir les clients déjà concernés si besoin.\n\nCordialement,\nLa direction";
    const lien = "mailto:?subject=" + encodeURIComponent(sujet) + "&body=" + encodeURIComponent(corps);
    return (
      <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onSuccess(fait.n)}>
        <div className="modal-box">
          <div style={{fontSize:"16px",fontWeight:"900",color:C.white,marginBottom:"10px"}}>✅ {fait.n} créneau(x) bloqué(s)</div>
          <div style={{fontSize:"12px",color:C.muted,marginBottom:"14px"}}>{fait.agencesTxt} · {periode} · {fait.motifFinal}</div>
          <div style={{fontSize:"12px",color:C.text,marginBottom:"14px"}}>Prévenir les agences ? L'e-mail est pré-rempli selon le motif, tu ajoutes seulement les destinataires.</div>
          <div style={{display:"flex",gap:"10px"}}>
            <button onClick={() => onSuccess(fait.n)} style={{flex:1,padding:"11px",background:"transparent",color:C.muted,border:"1px solid "+C.border,borderRadius:"10px",fontSize:"12px",cursor:"pointer"}}>Fermer</button>
            <a href={lien} style={{flex:2,padding:"11px",background:C.or,color:"#fff",borderRadius:"10px",fontSize:"13px",fontWeight:"900",textAlign:"center",textDecoration:"none"}}>✉️ Ouvrir l'e-mail pré-rempli</a>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}}>
          <div style={{fontSize:"16px",fontWeight:"900",color:C.white}}>🔒 Bloquer des dates</div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:"18px",cursor:"pointer",color:C.muted}}>✕</button>
        </div>

        <div style={groupStyle}>
          <label style={labelStyle}>Agence</label>
          <select value={agence} onChange={e => setAgence(e.target.value)} disabled={agenceAccess !== "global" || AGENCES.length === 1} style={inputStyle}>
            {agenceAccess === "global" && AGENCES.length > 1 && <option value={TOUTES}>🏢 Toutes les agences</option>}
            {AGENCES.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
        </div>

        <div style={{display:"flex",gap:"10px"}}>
          <div style={{...groupStyle, flex:1}}>
            <label style={labelStyle}>Du</label>
            <input type="date" value={dateDebut} onChange={e => setDateDebut(e.target.value)} style={inputStyle}/>
          </div>
          <div style={{...groupStyle, flex:1}}>
            <label style={labelStyle}>Au</label>
            <input type="date" value={dateFin} onChange={e => setDateFin(e.target.value)} style={inputStyle}/>
          </div>
        </div>

        <div style={groupStyle}>
          <label style={labelStyle}>Motif</label>
          <select value={motif} onChange={e => setMotif(e.target.value)} style={inputStyle}>
            {MOTIFS_BLOCAGE.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
          {motif.startsWith("Autre") && (
            <input value={motifLibre} onChange={e => setMotifLibre(e.target.value)} placeholder="Expliquez la raison de la fermeture…" style={{...inputStyle,marginTop:"8px"}}/>
          )}
        </div>

        <div style={{fontSize:"11px",color:C.muted,marginBottom:"14px"}}>
          Bloque tous les créneaux "Libre" de cette agence sur la période choisie. Les week-ends ne sont jamais dans le planning, rien à faire pour eux. Un créneau déjà pris par un client n'est jamais touché.
        </div>

        {error && <div style={{background:"var(--iko-erreur-clair)",color:"var(--iko-erreur)",padding:"9px 12px",borderRadius:"8px",fontSize:"12px",marginBottom:"14px"}}>{error}</div>}

        <div style={{display:"flex",gap:"10px"}}>
          <button onClick={onClose} style={{flex:1,padding:"11px",background:"transparent",color:C.muted,border:"1px solid "+C.border,borderRadius:"10px",fontSize:"12px",cursor:"pointer"}}>Annuler</button>
          <button onClick={bloquer} disabled={saving} style={{flex:2,padding:"11px",background:saving?"#D1D5DB":C.or,color:saving?C.muted:"var(--iko-dark)",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:saving?"not-allowed":"pointer"}}>
            {saving ? "⏳ Blocage..." : "🔒 Bloquer les créneaux"}
          </button>
        </div>
      </div>
    </div>
  );
}

async function resoudreClientDepuisAgence(agenceLabel) {

async function chargerCatalogueDevis(clientNom) {
  // ARRAYJOIN() sur un lien renvoie le nom affiche, jamais l'ID (confirme en prod).
  const nomEchappe = String(clientNom).replace(/"/g, '\\"');
  const formule = 'FIND("' + nomEchappe + '", ARRAYJOIN({Client}))';
  const [rProd, rMo, rMep] = await Promise.all([
    fetch('/api/airtable/Catalogue%20Produits?filterByFormula=' + encodeURIComponent(formule)),
    fetch('/api/airtable/Grille%20Main%20d%27%C5%93uvre?filterByFormula=' + encodeURIComponent(formule)),
    fetch('/api/airtable/Mise%20en%20page%20Devis?filterByFormula=' + encodeURIComponent(formule)),
  ]);
  const [jProd, jMo, jMep] = await Promise.all([rProd.json(), rMo.json(), rMep.json()]);
  const mepRec = (jMep.records || [])[0];
  let identite = {}, assurance = {}, marges = {}, elementsGraphiques = [];
  try { identite = JSON.parse(mepRec?.fields?.["Identité entreprise (JSON)"] || "{}"); } catch(e){}
  try { assurance = JSON.parse(mepRec?.fields?.["Assurance décennale (JSON)"] || "{}"); } catch(e){}
  try { marges = JSON.parse(mepRec?.fields?.["Marges"] || "{}"); } catch(e){}
  try {
    const els = JSON.parse(mepRec?.fields?.["Éléments graphiques (JSON)"] || "[]");
    if (Array.isArray(els)) elementsGraphiques = els;
  } catch(e){}
  return {
    produits: jProd.records || [],
    mo: jMo.records || [],
    mep: {
      couleur: mepRec?.fields?.["Couleur primaire"] || "#FF6B00",
      piedPage: mepRec?.fields?.["Texte pied de page"] || "",
      dureeValidite: mepRec?.fields?.["Durée validité devis (jours)"] || 30,
      logoUrl: (mepRec?.fields?.["Logo"]?.[0]?.url) || identite.logoUrl || "",
      logoX: identite.logoX != null ? identite.logoX : 18,
      logoY: identite.logoY != null ? identite.logoY : 14,
      logoW: identite.logoW != null ? identite.logoW : 30,
      margeHaut: marges.haut != null ? marges.haut : 20,
      margeBas: marges.bas != null ? marges.bas : 20,
      margeGauche: marges.gauche != null ? marges.gauche : 18,
      margeDroite: marges.droite != null ? marges.droite : 18,
      identite, assurance, elements: elementsGraphiques,
    }
  };
}

/* ---- Génération PDF itemisée (logo, catalogue, mentions légales) ---- */
async function chargerImageEnDataUrl(url) {
  if (!url) return null;
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    const dataUrl = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
    if (!dataUrl) return null;
    const ratio = await new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : null);
      img.onerror = () => resolve(null);
      img.src = dataUrl;
    });
    return { url: dataUrl, ratio };
  } catch(e) { return null; }
}

function rendrePiedPageRiche(html) {
  if (!html) return null;
  const gras = /<(b|strong)[ >]/i.test(html);
  const italique = /<(i|em)[ >]/i.test(html);
  let align = 'center';
  if (/text-align:\s*right/i.test(html)) align = 'right';
  else if (/text-align:\s*left/i.test(html)) align = 'left';
  const texte = html.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/gi, ' ').replace(/\s+/g, ' ').trim();
  if (!texte) return null;
  return { texte, gras, italique, align };
}

/* ---- Éléments graphiques du configurateur (formes/traits/images) — identique à l'aperçu admin.html ---- */
function hexVersRgb(hex, secours) {
  hex = String(hex || secours || '#111111').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex, 16);
  if (isNaN(num)) return [17, 17, 17];
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
}

async function dessinerElementsGraphiques(doc, elements) {
  if (!Array.isArray(elements) || !elements.length) return;
  const tries = elements.filter(el => el && el.visible !== false).sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));
  for (const el of tries) {
    try {
      if (el.type === 'rect' || el.type === 'circle') {
        const [dr, dg, db] = hexVersRgb(el.stroke);
        doc.setDrawColor(dr, dg, db);
        doc.setLineWidth(el.strokeWidth != null ? el.strokeWidth : 1);
        const aRemplir = el.fill && el.fill !== 'none';
        if (aRemplir) { const [fr, fg, fb] = hexVersRgb(el.fill); doc.setFillColor(fr, fg, fb); }
        const style = aRemplir ? 'FD' : 'S';
        if (el.type === 'rect') {
          doc.rect(el.x, el.y, el.w, el.h, style);
        } else {
          doc.ellipse(el.x + el.w / 2, el.y + el.h / 2, el.w / 2, el.h / 2, style);
        }
      } else if (el.type === 'line') {
        const [dr, dg, db] = hexVersRgb(el.stroke);
        doc.setDrawColor(dr, dg, db);
        doc.setLineWidth(el.strokeWidth != null ? el.strokeWidth : 2);
        doc.line(el.x1, el.y1, el.x2, el.y2);
        if (el.arrowEnd) {
          const angle = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
          const taille = 3;
          const p1x = el.x2 - taille * Math.cos(angle - Math.PI / 7), p1y = el.y2 - taille * Math.sin(angle - Math.PI / 7);
          const p2x = el.x2 - taille * Math.cos(angle + Math.PI / 7), p2y = el.y2 - taille * Math.sin(angle + Math.PI / 7);
          doc.setFillColor(dr, dg, db);
          doc.triangle(el.x2, el.y2, p1x, p1y, p2x, p2y, 'F');
        }
      } else if (el.type === 'image' && el.url) {
        const info = await chargerImageEnDataUrl(el.url);
        if (info && info.url) {
          try { doc.addImage(info.url, 'JPEG', el.x, el.y, el.w, el.h, undefined, 'FAST'); }
          catch (e) { try { doc.addImage(info.url, 'PNG', el.x, el.y, el.w, el.h, undefined, 'FAST'); } catch (e2) {} }
        }
      }
    } catch (e) { /* un élément mal formé ne doit pas bloquer le reste du PDF */ }
  }
}


async function genererPdfDevis({ numero, ticket, client, lignes, montantHT, montantTTC, mep, facture }) {

    try { doc.addImage(logoInfo.url, 'PNG', mep.logoX != null ? mep.logoX : mL, mep.logoY != null ? mep.logoY : (y - 6), logoW, logoW / ratio, undefined, 'FAST'); } catch(e){}
  }
  await dessinerElementsGraphiques(doc, (mep.elements || []).filter(function(el){ return !(el.page > 0); }));
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.setTextColor(20, 20, 20);

  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(100, 100, 100);
  doc.text('N° ' + (facture ? facture.numero : numero), 210 - mR, y + 5, { align: 'right' });
  if (facture) {
    const fr = (s) => String(s || '').split('-').reverse().join('/');
    doc.setFontSize(8);
    doc.text('Date : ' + fr(facture.date) + '  ·  Échéance : ' + fr(facture.echeance), 210 - mR, y + 10, { align: 'right' });
    doc.text('Réf. devis ' + numero, 210 - mR, y + 14, { align: 'right' });
  }
  y += 18;
  if (logoInfo && logoInfo.url) {
    const lw = mep.logoW || 30;
    const bas = (mep.logoY != null ? mep.logoY : (mHaut - 6)) + lw / (logoInfo.ratio || (30 / 16)) + 4;
    if (bas > y) y = bas;
  }

  doc.setDrawColor(220, 220, 220); doc.setLineWidth(0.3);
  doc.line(mL, y, 210 - mR, y); y += 7;

  doc.setFontSize(8); doc.setTextColor(80, 80, 80);

  doc.text([
    (identite.raisonSociale || 'Raison sociale') + (identite.formeJuridique ? ' — ' + identite.formeJuridique : ''),
    identite.adresse || '',
  ], mL, y);
  y += 12;

  doc.setFillColor(245, 245, 245);
  doc.rect(mL, y, largeurUtile * 0.55, 16, 'F');
  doc.setFontSize(7); doc.setTextColor(140, 140, 140);
  doc.text('CLIENT', mL + 4, y + 5);
  doc.setFontSize(9); doc.setTextColor(20, 20, 20);
  doc.text(client.nom || ticket.fields?.Client || '—', mL + 4, y + 10);
  doc.setFontSize(8); doc.setTextColor(80, 80, 80);
  doc.text(client.adresse || ticket.fields?.Adresse || '', mL + 4, y + 14.5);
  y += 24;

  // Tableau des lignes (dessiné manuellement, pas de plugin autoTable chargé)
  const colX = [mL, mL + largeurUtile * 0.46, mL + largeurUtile * 0.63, mL + largeurUtile * 0.75, mL + largeurUtile * 0.88];
  doc.setFillColor(20, 20, 20);
  doc.rect(mL, y, largeurUtile, 7, 'F');
  doc.setFontSize(7.5); doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold');
  doc.text('DÉSIGNATION', colX[0] + 2, y + 4.8);
  doc.text('QTÉ', colX[1] + 2, y + 4.8);
  doc.text('PU HT', colX[2] + 2, y + 4.8);
  doc.text('TVA', colX[3] + 2, y + 4.8);
  doc.text('TOTAL HT', colX[4] + 2, y + 4.8);
  y += 7;

  doc.setFont('helvetica', 'normal'); doc.setTextColor(30, 30, 30);

    y += hauteur;
    if (y > yLimite) { doc.addPage(); y = mHaut; }
  });
  y += 4;
  doc.setDrawColor(220, 220, 220);
  doc.line(mL, y, 210 - mR, y); y += 8;

  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(80, 80, 80);
  doc.text('Total HT : ' + montantHT.toFixed(2) + ' €', 210 - mR, y, { align: 'right' }); y += 5.5;
  doc.text('Total TVA : ' + (montantTTC - montantHT).toFixed(2) + ' €', 210 - mR, y, { align: 'right' }); y += 5.5;

  doc.text('Total TTC : ' + montantTTC.toFixed(2) + ' €', 210 - mR, y, { align: 'right' }); y += 10;

  // Conditions de règlement (bloc visible, avec montant de l'acompte quand il y en a un)
  if (y > 297 - mBas - 60) { doc.addPage(); y = mHaut; }
  const condTxt = mep.conditionsPaiement || 'Acompte de 30 % à la commande, solde à la fin des travaux';
  const pctM = condTxt.match(/(\d+)\s*%/);
  const lignesCond = [condTxt + '.'];
  if (pctM) {
    const ac = montantTTC * Number(pctM[1]) / 100;
    lignesCond.push('Acompte à la commande : ' + ac.toFixed(2) + ' € TTC  ·  Solde : ' + (montantTTC - ac).toFixed(2) + ' € TTC');
  }
  if (facture) lignesCond.push(facture.statutPaiement === 'Payé' ? ('Facture acquittée' + (facture.datePaiement ? ' le ' + String(facture.datePaiement).split('-').reverse().join('/') : '') + '.') : 'Règlement attendu avant le ' + String(facture.echeance || '').split('-').reverse().join('/') + '.');
  const hCond = 8 + lignesCond.length * 4.5;
  doc.setFillColor(255, 243, 235); doc.rect(mL, y, largeurUtile, hCond, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(194, 65, 12);
  doc.text('CONDITIONS DE RÈGLEMENT', mL + 4, y + 5);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(40, 40, 40);
  lignesCond.forEach((t, i) => doc.text(t, mL + 4, y + 10 + i * 4.5, { maxWidth: largeurUtile - 8 }));
  y += hCond + 6;

  doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(130, 130, 130);
  const assurance = mep.assurance || {};
  const mentions = [
    'SIRET ' + (identite.siret || '—') + '  ·  RCS ' + (identite.rcs || '—') + '  ·  TVA intracom. ' + (identite.tva || '—'),
    'Assurance décennale : ' + (assurance.assureur || '—') + (assurance.numPolice ? ' — police n° ' + assurance.numPolice : '') + (assurance.zone ? ' — zone : ' + assurance.zone : ''),
    facture ? 'En cas de retard de paiement : pénalité de 3 fois le taux d\'intérêt légal et indemnité forfaitaire de recouvrement de 40 €. Pas d\'escompte pour paiement anticipé.' : 'Devis valable ' + (mep.dureeValidite || 30) + ' jours à compter de sa date d\'émission. Bon pour accord — signature électronique ci-après.',
  ];
  doc.text(mentions, mL, 297 - mBas - 15);
  const pied = rendrePiedPageRiche(mep.piedPage);
  if (pied) {
    doc.setFontSize(6.5); doc.setTextColor(160, 160, 160);
    doc.setFont('helvetica', pied.gras && pied.italique ? 'bolditalic' : pied.gras ? 'bold' : pied.italique ? 'italic' : 'normal');
    const xPied = pied.align === 'left' ? mL : pied.align === 'right' ? 210 - mR : 105;
    doc.text(pied.texte, xPied, 297 - mBas, { align: pied.align });
    doc.setFont('helvetica', 'normal');
  }

  // Pages annexes (Phase 3 configurateur) : schémas/photos placés sur page > 0 dans l'éditeur
  const pagesAnnexes = {};
  (mep.elements || []).forEach(function(el){
    const p = el.page || 0;
    if (p > 0) { (pagesAnnexes[p] = pagesAnnexes[p] || []).push(el); }
  });
  const numerosAnnexes = Object.keys(pagesAnnexes).map(Number).sort((a, b) => a - b);
  for (const p of numerosAnnexes) {
    doc.addPage();
    await dessinerElementsGraphiques(doc, pagesAnnexes[p]);
  }

  return doc.output('blob');
}

async function creerDemandeSignatureYousign(pdfBlob, nomFichier, personneNom, email, telephone) {
  const reqRes = await fetch('/api/yousign/signature_requests', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: nomFichier, delivery_mode: 'none', timezone: 'Europe/Paris' })
  });
  if (!reqRes.ok) {
    const detail = await reqRes.text().catch(() => '');
    throw new Error('Yousign: création de la demande échouée (HTTP ' + reqRes.status + ') ' + detail.slice(0, 300));
  }
  const signatureRequest = await reqRes.json();
  const srId = signatureRequest.id;

  const form = new FormData();
  form.append('file', pdfBlob, nomFichier + '.pdf');
  form.append('nature', 'signable_document');
  form.append('parse_anchors', 'false');
  const docRes = await fetch('/api/yousign/signature_requests/' + srId + '/documents', { method: 'POST', body: form });
  if (!docRes.ok) {
    const detail = await docRes.text().catch(() => '');
    throw new Error('Yousign: envoi du document échoué (HTTP ' + docRes.status + ') ' + detail.slice(0, 300));
  }
  const document = await docRes.json();

  const nomParts = (personneNom || 'Client Iko Suite').trim().split(/\s+/);
  const firstName = nomParts.length > 1 ? nomParts.slice(0, -1).join(' ') : 'Client';
  const lastName = nomParts.length > 1 ? nomParts[nomParts.length - 1] : nomParts[0];
  const telValide = telephone && /^(\+33|0)[1-9](\d{2}){4}$/.test(String(telephone).replace(/[\s.-]/g, ''));

  const signerRes = await fetch('/api/yousign/signature_requests/' + srId + '/signers', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      info: { first_name: firstName, last_name: lastName, email, phone_number: telValide ? String(telephone).replace(/[\s.-]/g, '') : undefined, locale: 'fr' },
      signature_level: 'electronic_signature',
      signature_authentication_mode: 'no_otp',
      fields: [{ document_id: document.id, type: 'signature', page: 1, x: 60, y: 700 }]
    })
  });
  if (!signerRes.ok) {
    const detail = await signerRes.text().catch(() => '');
    throw new Error('Yousign: ajout du signataire échoué (HTTP ' + signerRes.status + ') ' + detail.slice(0, 300));
  }
  const signer = await signerRes.json();
  const signerId = signer.id;

  await fetch('/api/yousign/signature_requests/' + srId + '/activate', { method: 'POST' });

  // signature_link peut mettre un instant a etre genere cote Yousign. On
  // tente une seule fois rapidement ici (ne bloque pas l'envoi du devis) ;
  // si absent, devis.html le recuperera lui-meme a l'ouverture (via
  // Yousign Request ID + Yousign Signer ID stockes sur le devis), quel
  // que soit le delai reel de Yousign.
  let lienSignature = '';
  try {
    const signerFraisRes = await fetch('/api/yousign/signature_requests/' + srId + '/signers/' + signerId);
    if (signerFraisRes.ok) {
      const signerFrais = await signerFraisRes.json();
      lienSignature = signerFrais.signature_link || '';
    }
  } catch(e) {}

  return { signatureRequestId: srId, signerId, lienSignature };
}
