function tauxTvaVersDecimal(label) {
  if (!label) return 0.20;
  const m = String(label).match(/([\d.,]+)/);
  return m ? parseFloat(m[1].replace(',', '.')) / 100 : 0.20;
}

function LigneDevisEditeur({ produits, mo, lignes, ticket, onAjouter, onSupprimer, demo }) {
  const [choix, setChoix] = React.useState("");
  const [qte, setQte] = React.useState(1);
  const refListe = React.useRef(null);
  const [dernierAjout, setDernierAjout] = React.useState("");
  const onAjouterVisible = (l) => {
    onAjouter(l);
    setDernierAjout("✓ Ajouté : " + l.designation + " ×" + l.qte);
    setTimeout(() => { try { refListe.current && refListe.current.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch(e){} }, 80);
    setTimeout(() => setDernierAjout(""), 3500);
  };
  const [libreOuvert, setLibreOuvert] = React.useState(false);
  const [libre, setLibre] = React.useState({ designation: "", prix: "", qte: 1, tva: "0.2" });
  const ajouterLibre = () => {
    const pu = Number(String(libre.prix).replace(",", "."));
    const q = Number(libre.qte) || 1;
    if (!libre.designation.trim() || !(pu >= 0) || libre.prix === "") return;
    const taux = Number(libre.tva);
    const totalHT = q * pu;
    onAjouterVisible({ designation: libre.designation.trim(), qte: q, puHT: pu, tauxTva: taux, totalHT, totalTTC: totalHT * (1 + taux) });
    setLibre({ designation: "", prix: "", qte: 1, tva: libre.tva });
  };

  // ---- Suggestion IA (mode "devis_suggestion") ----
  // Meme principe que le Bloc 2C deja livre cote technicien/Max
  // (technicien.html / api/chat-technicien.js) : le catalogue reel deja
  // charge (produits/mo) est envoye au serveur qui revalide chaque
  // catalogue_id renvoye par l'IA. Ajout ligne par ligne apres validation
  // manuelle, jamais d'ecriture automatique.
  const [suggestionsDevis, setSuggestionsDevis] = React.useState(null);
  const [elementsSansCorrespondance, setElementsSansCorrespondance] = React.useState([]);
  const [chargementSuggestions, setChargementSuggestions] = React.useState(false);
  const [erreurSuggestion, setErreurSuggestion] = React.useState("");
  // Devis assisté depuis SAV V1 : quantité "à confirmer" (l.quantite === null,
  // jamais inventée côté serveur) saisie ici par le responsable avant de
  // pouvoir ajouter la ligne — jamais de valeur par défaut silencieuse.
  const [qteAConfirmer, setQteAConfirmer] = React.useState({});

  const demanderSuggestionsDevis = async () => {
    if (!produits.length && !mo.length) return;
    setChargementSuggestions(true);
    setErreurSuggestion("");
    setSuggestionsDevis(null);
    setElementsSansCorrespondance([]);
    setQteAConfirmer({});
    try {
      const catalogueEnvoye = [
        ...produits.map(p => ({ id: p.id, type: 'produit', designation: p.fields?.["Désignation"] || '', prix: p.fields?.["Prix unitaire HT"] || 0 })),
        ...mo.map(m => ({ id: m.id, type: 'mo', designation: m.fields?.["Type d'action"] || '', prix: m.fields?.["Prix forfait HT"] || m.fields?.["Taux horaire HT"] || 0 })),
      ];
      const r = await fetch('/api/chat-dashboard', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'devis_suggestion',
          // Diagnostic technicien déjà enregistré sur le ticket (si présent) :
          // réutilisé tel quel, aucun nouvel appel Airtable.
          ticket: { produit: ticket?.fields?.Produit || '', probleme: ticket?.fields?.Problème || '', diagnostic: ticket?.fields?.Diagnostic || '' },
          catalogue: catalogueEnvoye,
        }),
      });
      const data = await r.json();
      if (r.ok && !data.erreur) {
        setSuggestionsDevis(data.lignes || []);
        setElementsSansCorrespondance(data.elements_sans_correspondance || []);
      } else {
        setErreurSuggestion((data && data.erreur) || ("IKO n'a pas pu répondre (code " + r.status + "). Réessaie dans un instant."));
      }
    } catch (e) { setErreurSuggestion("IKO est injoignable pour le moment. Réessaie, ou ajoute les lignes à la main."); }
    setChargementSuggestions(false);
  };

  const ajouterLigneSuggeree = (l) => {
    // Quantité connue (fournie par IKO à partir du contexte) OU confirmée
    // manuellement ci-dessous par le responsable : jamais une valeur
    // par défaut inventée si elle n'a jamais été renseignée.
    const quantiteFinale = l.quantite != null ? l.quantite : Number(qteAConfirmer[l.catalogue_id]);
    if (!quantiteFinale || quantiteFinale <= 0) return;
    const produitSource = produits.find(p => p.id === l.catalogue_id);
    const tauxTva = l.type === 'produit' ? tauxTvaVersDecimal(produitSource?.fields?.["Taux TVA"]) : 0.20;
    const totalHT = quantiteFinale * l.prix;
    onAjouterVisible({ designation: l.designation, qte: quantiteFinale, puHT: l.prix, tauxTva, totalHT, totalTTC: totalHT * (1 + tauxTva) });
    setSuggestionsDevis(prev => (prev || []).filter(x => x.catalogue_id !== l.catalogue_id));
  };

  const ajouter = () => {
    if (!choix) return;
    const [type, id] = choix.split('|');
    const source = type === 'produit' ? produits.find(p => p.id === id) : mo.find(m => m.id === id);
    if (!source) return;
    const f = source.fields || {};
    const designation = type === 'produit' ? (f["Désignation"] || '—') : (f["Type d'action"] || '—');
    const puHT = type === 'produit' ? (f["Prix unitaire HT"] || 0) : (f["Prix forfait HT"] || f["Taux horaire HT"] || 0);
    const tauxTva = type === 'produit' ? tauxTvaVersDecimal(f["Taux TVA"]) : 0.20;
    const totalHT = (Number(qte) || 1) * puHT;
    onAjouterVisible({ designation, qte: Number(qte) || 1, puHT, tauxTva, totalHT, totalTTC: totalHT * (1 + tauxTva) });
    setChoix(""); setQte(1);
  };

  const total = lignes.reduce((s, l) => s + (l.totalHT || 0), 0);

  return (
    <div style={{marginBottom:"14px"}}>
      <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Lignes du devis {demo ? "(catalogue démo)" : "(catalogue du client)"}</label>
      {lignes.length === 0 && (
        <div style={{border:"1px dashed "+C.border,borderRadius:"8px",padding:"12px",textAlign:"center",fontSize:"12px",color:C.muted,marginBottom:"10px"}}>Aucune ligne pour le moment — ajoute une prestation ci-dessous.</div>
      )}
      <div ref={refListe}/>
      {lignes.length > 0 && (
        <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden",marginBottom:"6px"}}>
          {lignes.map((l, i) => (
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderBottom:i<lignes.length-1?"1px solid "+C.border:"none",fontSize:"12px"}}>
              <span>{l.designation} <span style={{color:C.muted}}>×{l.qte}</span></span>
              <span style={{display:"flex",alignItems:"center",gap:"10px"}}>
                <b>{l.totalHT.toFixed(2)} €</b>
                <span onClick={() => onSupprimer(i)} style={{cursor:"pointer",color:C.muted}}>✕</span>
              </span>
            </div>
          ))}
        </div>
      )}
      <div style={{textAlign:"right",fontSize:"12px",color:C.muted}}>Total HT : {total.toFixed(2)} € · TVA : {(lignes.reduce((s,l)=>s+((l.totalTTC!=null?l.totalTTC:l.totalHT*1.2)-l.totalHT),0)).toFixed(2)} €</div>
      <div style={{textAlign:"right",fontSize:"14px",fontWeight:"900",color:C.white}}>Total TTC : {(lignes.reduce((s,l)=>s+(l.totalTTC!=null?l.totalTTC:l.totalHT*1.2),0)).toFixed(2)} €</div>
      <div style={{position:"sticky",bottom:0,zIndex:5,margin:"10px 0 0",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"8px",background:"#FEFEFE",border:"1px solid "+C.orBord,borderRadius:"10px",padding:"8px 12px",fontSize:"12px",fontWeight:"800",color:C.white}}>
        <span>🧾 {lignes.length} ligne{lignes.length>1?"s":""} dans le devis</span>
        {dernierAjout ? <span style={{color:"#15803D"}}>{dernierAjout}</span> : <span>Total TTC : {(lignes.reduce((s,l)=>s+(l.totalTTC!=null?l.totalTTC:l.totalHT*1.2),0)).toFixed(2)} €</span>}
      </div>
      <div style={{fontSize:"11px",fontWeight:"700",color:C.muted,margin:"14px 0 6px"}}>➕ Ajouter une prestation</div>
      <div style={{background:"rgba(0,0,0,0.03)",border:"1px solid "+C.border,borderRadius:"10px",padding:"10px"}}>
      {(produits.length > 0 || mo.length > 0) && (
        <>
          <button type="button" onClick={demanderSuggestionsDevis} disabled={chargementSuggestions}
            style={{width:"100%",padding:"8px",marginBottom:"8px",borderRadius:"8px",background:"rgba(var(--iko-primary-rgb),0.1)",border:"1px solid var(--iko-primary)",color:"var(--iko-primary)",fontSize:"11px",fontWeight:"700",cursor:chargementSuggestions?"not-allowed":"pointer"}}>
            {chargementSuggestions ? "⏳ IKO prépare la proposition..." : "🧾 Laisser IKO proposer des lignes (selon le problème du ticket)"}
          </button>
          {erreurSuggestion && <div style={{fontSize:"11px",color:C.rouge,marginBottom:"8px"}}>⚠️ {erreurSuggestion}</div>}
          {suggestionsDevis && (
            <div style={{marginBottom:"8px",fontSize:"10px",color:C.muted}}>
              🔎 Éléments identifiés : {ticket?.fields?.Produit || "produit non précisé"} — {ticket?.fields?.Problème || "problème non précisé"}
              {ticket?.fields?.Diagnostic && " — diagnostic déjà enregistré"}
            </div>
          )}
          {suggestionsDevis && suggestionsDevis.length === 0 && elementsSansCorrespondance.length === 0 && (
            <div style={{fontSize:"10px",color:C.muted,marginBottom:"8px",fontStyle:"italic"}}>Informations insuffisantes pour proposer une ligne de devis sur ce ticket.</div>
          )}
          {suggestionsDevis && suggestionsDevis.length > 0 && (
            <div style={{marginBottom:"8px",display:"flex",flexDirection:"column",gap:"5px"}}>
              <div style={{fontSize:"10px",fontWeight:"700",color:C.muted}}>Lignes proposées :</div>
              {suggestionsDevis.map(l => {
                const quantiteInconnue = l.quantite == null;
                const quantiteSaisie = Number(qteAConfirmer[l.catalogue_id]);
                const ajoutPossible = !quantiteInconnue || quantiteSaisie > 0;
                return (
                  <div key={l.catalogue_id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"6px",fontSize:"10px",background:"rgba(var(--iko-primary-rgb),0.06)",borderRadius:"6px",padding:"6px 8px"}}>
                    <div>
                      <b>{l.designation}</b> ×{quantiteInconnue ? (
                        <input type="number" min="1" placeholder="?" value={qteAConfirmer[l.catalogue_id] || ""}
                          onChange={e => setQteAConfirmer(prev => ({...prev, [l.catalogue_id]: e.target.value}))}
                          style={{width:"46px",fontSize:"10px",padding:"2px 4px",marginLeft:"2px"}}/>
                      ) : l.quantite} — {Number(l.prix).toFixed(2)} €
                      {quantiteInconnue && <span style={{color:"var(--iko-primary)",fontWeight:"700",marginLeft:"4px"}}>Quantité à confirmer</span>}
                      {l.justification && <div style={{color:C.muted,fontStyle:"italic",marginTop:"2px"}}>{l.justification}</div>}
                    </div>
                    <button type="button" onClick={() => ajouterLigneSuggeree(l)} disabled={!ajoutPossible}
                      style={{flexShrink:0,padding:"5px 10px",borderRadius:"6px",background:ajoutPossible?"var(--iko-primary)":"#D1D5DB",color:"var(--iko-dark)",border:"none",fontWeight:"800",cursor:ajoutPossible?"pointer":"not-allowed",fontSize:"10px"}}>
                      + Ajouter au devis
                    </button>
                  </div>
                );
              })}
            </div>
          )}
          {elementsSansCorrespondance.length > 0 && (
            <div style={{marginBottom:"8px",background:"rgba(var(--iko-primary-rgb),0.1)",border:"1px solid var(--iko-primary)",borderRadius:"6px",padding:"6px 8px"}}>
              <div style={{fontSize:"10px",fontWeight:"700",color:"var(--iko-primary-fonce)",marginBottom:"3px"}}>⚠️ Éléments à confirmer (hors catalogue)</div>
              {elementsSansCorrespondance.map((e, i) => (
                <div key={i} style={{fontSize:"10px",color:"var(--iko-primary-fonce)"}}>· {e}</div>
              ))}
            </div>
          )}
        </>
      )}
      <div style={{display:"flex",gap:"8px",marginBottom:"10px"}}>
        <select value={choix} onChange={e => setChoix(e.target.value)} style={{flex:1}}>
          <option value="">— Ajouter une ligne —</option>
          {produits.length > 0 && <optgroup label="Produits">
            {produits.map(p => <option key={p.id} value={"produit|"+p.id}>{p.fields?.["Désignation"]} — {(p.fields?.["Prix unitaire HT"]||0).toFixed(2)} € HT</option>)}
          </optgroup>}
          {mo.length > 0 && <optgroup label="Main d'œuvre">
            {mo.map(m => <option key={m.id} value={"mo|"+m.id}>{m.fields?.["Type d'action"]} — {(m.fields?.["Prix forfait HT"]||m.fields?.["Taux horaire HT"]||0).toFixed(2)} € HT</option>)}
          </optgroup>}
        </select>
        <input type="number" min="1" value={qte} onChange={e => setQte(e.target.value)} style={{width:"60px"}}/>
        <button type="button" onClick={ajouter} style={{padding:"0 14px",background:"#F3F4F6",border:"1px solid "+C.border,borderRadius:"8px",cursor:"pointer",fontSize:"13px",fontWeight:"700"}}>+</button>
      </div>
      {demo && (
        <div style={{fontSize:"11px",color:C.muted,marginBottom:"8px"}}>ℹ️ Catalogue de démonstration IKO (menuiserie). Pour un vrai client, le catalogue vient de sa fiche (Poste de pilotage → Devis &amp; Facturation).</div>
      )}
      {(produits.length === 0 && mo.length === 0) && (
        <div style={{fontSize:"11px",color:C.rouge,marginBottom:"8px"}}>⚠️ Aucun catalogue pour ce client : utilise « Ligne libre » ou configure-le dans le Poste de pilotage.</div>
      )}
      <div style={{marginBottom:"10px"}}>
        <button type="button" onClick={() => setLibreOuvert(!libreOuvert)} style={{background:"none",border:"none",color:C.or,fontSize:"12px",fontWeight:"800",cursor:"pointer",padding:0}}>
          ✏️ Ligne libre {libreOuvert ? "▴" : "▾"}
        </button>
        {libreOuvert && (
          <div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginTop:"8px",alignItems:"center"}}>
            <input placeholder="Désignation" value={libre.designation} onChange={e => setLibre({...libre, designation:e.target.value})} style={{flex:"2 1 160px"}}/>
            <input placeholder="Prix HT" inputMode="decimal" value={libre.prix} onChange={e => setLibre({...libre, prix:e.target.value})} style={{width:"80px"}}/>
            <input type="number" min="1" value={libre.qte} onChange={e => setLibre({...libre, qte:e.target.value})} style={{width:"56px"}}/>
            <select value={libre.tva} onChange={e => setLibre({...libre, tva:e.target.value})} style={{width:"84px"}}>
              <option value="0.2">TVA 20 %</option><option value="0.1">TVA 10 %</option><option value="0.055">TVA 5,5 %</option>
            </select>
            <button type="button" onClick={ajouterLibre} style={{padding:"8px 14px",background:C.or,color:"#fff",border:"none",borderRadius:"8px",fontWeight:"800",cursor:"pointer",fontSize:"12px"}}>Ajouter</button>
          </div>
        )}
      </div>
      </div>
    </div>
  );
}

function ModalDevis({ ticket, onClose, onSent }) {
  const [chargement, setChargement] = React.useState(true);
  const [catalogue, setCatalogue] = React.useState({ produits: [], mo: [], mep: null });
  const [clientInfo, setClientInfo] = React.useState(null);
  const [demoCat, setDemoCat] = React.useState(false);
  const [etape, setEtape] = React.useState("edition");
  const [apercuUrl, setApercuUrl] = React.useState(null);
  const [conditions, setConditions] = React.useState("Acompte de 30 % à la commande, solde à la fin des travaux");
  const [validite, setValidite] = React.useState(30);
  const [numeroDevis] = React.useState(() => "DEV-" + new Date().getFullYear() + "-" + Math.floor(1000 + Math.random() * 9000));
  const [lignes, setLignes] = React.useState([]);
  const [email, setEmail] = React.useState(ticket.fields?.Email || "");
  const [message, setMessage] = React.useState("");
  const [saving, setSaving] = React.useState(false);
  const [error, setError] = React.useState("");
  const [envoye, setEnvoye] = React.useState(false);
  const [debugEnvoi, setDebugEnvoi] = React.useState(null);

  React.useEffect(() => {
    (async () => {
      let cat = { produits: [], mo: [], mep: null };
      try {
        const resolu = await resoudreClientDepuisAgence(ticket.fields?.Agence);
        if (resolu) {
          setClientInfo(resolu);
          cat = await chargerCatalogueDevis(resolu.clientNom);
        }
      } catch(e) { console.error(e); }
      // IKO DEMO (pas de ?client=) : catalogue menuiserie de démonstration si rien n'est configuré.
      const estDemo = !new URLSearchParams(window.location.search).get('client');
      if (estDemo && !cat.produits.length && !cat.mo.length) {
        cat = { ...cat, ...CATALOGUE_DEMO_IKO };
        setDemoCat(true);
      }
      setCatalogue(cat);
      setChargement(false);
    })();
  }, []);

  const mepEffectif = () => mepAvecDefauts({ ...(catalogue.mep || {}), conditionsPaiement: conditions, dureeValidite: validite }, demoCat);
  const clientPdf = () => {
    const cpMatch = (ticket.fields?.Adresse || "").match(/\b\d{5}\b/);
    return { nom: ticket.fields?.Client, adresse: ticket.fields?.Adresse || "", cp: cpMatch ? cpMatch[0] : "" };
  };
  const voirApercu = async () => {
    setError("");
    if (!lignes.length) { setError("Ajoute au moins une ligne au devis."); return; }
    setSaving(true);
    try {
      const blob = await genererPdfDevis({ numero: numeroDevis, ticket, client: clientPdf(), lignes, montantHT, montantTTC, mep: mepEffectif() });
      if (apercuUrl) URL.revokeObjectURL(apercuUrl);
      setApercuUrl(URL.createObjectURL(blob));
      setEtape("apercu");
    } catch(e) { console.error(e); setError("Impossible de générer l'aperçu : " + (e && e.message || e)); }
    setSaving(false);
  };

  const genererToken = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
  const emailValide = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  const montantHT = lignes.reduce((s, l) => s + (l.totalHT || 0), 0);
  const montantTTC = lignes.reduce((s, l) => s + (l.totalTTC != null ? l.totalTTC : l.totalHT * 1.2), 0);

  const envoyer = async () => {
    if (!lignes.length) { setError("Ajoute au moins une ligne au devis."); return; }
    if (!emailValide) { setError("Indique un email client valide."); return; }
    if (!clientInfo && !demoCat) { setError("Impossible de résoudre le client de cette agence — vérifie la configuration."); return; }
    setSaving(true); setError("");
    const diag = { devisId: null, pdfGenere: false, yousignOk: false, yousignErreur: null, ticketMisAJour: false, webhookStatut: null, webhookErreur: null, lienDevis: null };
    try {
      const numero = numeroDevis;
      const mep = mepEffectif();
      const client = clientPdf();

      const devisRes = await fetch('/api/airtable/Devis', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ records: [{ fields: (() => {
          const champs = {
            "N° devis": numero, "Ticket lié": [ticket.id],
            "Nom client": client.nom, "Adresse client": client.adresse, "CP client": client.cp,
            "Lignes devis (JSON)": JSON.stringify(lignes), "Montant HT": montantHT, "Montant TTC": montantTTC,
            "Statut": "Envoyé", "Mode": "Manuel", "Conditions paiement": conditions,
            "Date validité": new Date(Date.now() + validite * 86400000).toISOString().slice(0, 10),
          };
          if (clientInfo?.clientId) champs["Client"] = [clientInfo.clientId];
          if (clientInfo?.agenceId) champs["Agence"] = [clientInfo.agenceId];
          return champs;
        })() }] })
      });
      const devisJson = await devisRes.json();
      const devisRec = devisJson.records?.[0];
      if (!devisRec) throw new Error("Création du devis échouée : " + JSON.stringify(devisJson));
      diag.devisId = devisRec.id;

      const pdfBlob = await genererPdfDevis({ numero, ticket, client, lignes, montantHT, montantTTC, mep });
      diag.pdfGenere = !!(pdfBlob && pdfBlob.size);

      let yousignFields = {};
      try {
        const { signatureRequestId, signerId, lienSignature } = await creerDemandeSignatureYousign(pdfBlob, numero, client.nom, email.trim(), ticket.fields?.Téléphone);
        yousignFields = { "Yousign Request ID": signatureRequestId, "Yousign Signer ID": signerId, "Yousign Signer Link": lienSignature };
        diag.yousignOk = true;
        diag.lienSignature = lienSignature || "(pas encore prêt — devis.html le récupérera à l'ouverture)";
      } catch (yousignErr) {
        console.error('Yousign indisponible, devis envoyé sans signature électronique :', yousignErr);
        diag.yousignErreur = String(yousignErr && yousignErr.message || yousignErr);
      }
      await fetch('/api/airtable/Devis/' + devisRec.id, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: yousignFields })
      });

      // Compatibilité avec le pipeline existant (ModalGestionDevis, badges, filtres par Statut de ticket).
      const ticketPatchRes = await fetch('/api/airtable/tenant/Tickets%20SAV/' + ticket.id, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Statut: 'Devis envoyé', "Montant devis": Math.round(montantTTC * 100) / 100, Email: email.trim() } })
      });
      diag.ticketMisAJour = ticketPatchRes.ok;
      if (!ticketPatchRes.ok) {
        diag.ticketErreur = await ticketPatchRes.text().catch(() => '(corps illisible)');
      }

      const lienDevis = window.location.origin + '/devis.html?devisId=' + devisRec.id;
      diag.lienDevis = lienDevis;
      try {
        const webhookRes = await fetch(WEBHOOK, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            marque: 'iko', action: 'devis_envoye',
            ticket: ticket.fields?.Name, nom: ticket.fields?.Client, "e-mail": email.trim(),
            agence: ticket.fields?.Agence, produit: ticket.fields?.Produit, probleme: ticket.fields?.Problème,
            diagnostic: ticket.fields?.Diagnostic || '', montant: montantTTC.toFixed(2) + ' €', message, lien: lienDevis
          })
        });
        diag.webhookStatut = webhookRes.status;
      } catch (webhookErr) {
        diag.webhookErreur = String(webhookErr && webhookErr.message || webhookErr);
      }

      setDebugEnvoi(diag);
      setEnvoye(true);
    } catch(e) {
      console.error(e);
      diag.erreurFatale = String(e && e.message || e);
      setDebugEnvoi(diag);
      setError("Erreur lors de l'envoi — détail dans le diagnostic ci-dessous.");
    }
    setSaving(false);
  };

  if (envoye) {
    return (
      <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
        <div className="modal-box" style={{maxWidth:"520px"}}>
          <div style={{fontSize:"16px",fontWeight:"900",color:C.white,marginBottom:"10px"}}>✓ Devis créé — diagnostic</div>
          <div style={{background:"var(--iko-dark)",color:"var(--iko-primary)",borderRadius:"8px",padding:"12px",fontFamily:"monospace",fontSize:"10.5px",whiteSpace:"pre-wrap",wordBreak:"break-all",marginBottom:"14px",maxHeight:"320px",overflow:"auto"}}>
            {JSON.stringify(debugEnvoi, null, 2)}
          </div>
          {!debugEnvoi?.yousignOk && (
            <div style={{background:C.rougeDim,border:"1px solid rgba(var(--iko-erreur-rgb),0.3)",borderRadius:"8px",padding:"8px 12px",fontSize:"11px",color:C.rouge,marginBottom:"14px"}}>
              ⚠️ Yousign a échoué ({debugEnvoi?.yousignErreur}) — le devis est créé mais sans lien de signature.
            </div>
          )}
          {debugEnvoi?.webhookStatut && debugEnvoi.webhookStatut >= 300 && (
            <div style={{background:C.rougeDim,border:"1px solid rgba(var(--iko-erreur-rgb),0.3)",borderRadius:"8px",padding:"8px 12px",fontSize:"11px",color:C.rouge,marginBottom:"14px"}}>
              ⚠️ Le webhook Make a répondu avec le statut {debugEnvoi.webhookStatut} — l'email n'a probablement pas été envoyé.
            </div>
          )}
          {debugEnvoi?.webhookStatut && debugEnvoi.webhookStatut < 300 && (
            <div style={{background:"#F3F4F6",border:"1px solid "+C.border,borderRadius:"8px",padding:"8px 12px",fontSize:"11px",color:C.muted,marginBottom:"14px"}}>
              Le webhook Make a bien été accepté (statut {debugEnvoi.webhookStatut}). Si aucun email n'arrive, le souci est dans le scénario Make lui-même (pas dans le code de l'app) — vérifie son historique d'exécution.
            </div>
          )}
          <button onClick={() => { onSent(); }} style={{width:"100%",padding:"11px",background:"var(--iko-bg-sombre)",color:"#fff",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:"pointer"}}>
            Fermer
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box" style={{maxWidth:etape==="apercu"?"820px":"600px",width:"95%"}}>
        <div style={{display:"flex",gap:"6px",marginBottom:"10px",fontSize:"11px",fontWeight:"800"}}>
          <span style={{padding:"3px 10px",borderRadius:"12px",background:etape==="edition"?C.or:"rgba(0,0,0,0.06)",color:etape==="edition"?"#fff":C.muted}}>1 · Lignes</span>
          <span style={{padding:"3px 10px",borderRadius:"12px",background:etape==="apercu"?C.or:"rgba(0,0,0,0.06)",color:etape==="apercu"?"#fff":C.muted}}>2 · Aperçu & envoi</span>
        </div>
        <div style={{fontSize:"16px",fontWeight:"900",color:C.white,marginBottom:"4px"}}>💶 Établir le devis</div>
        <div style={{fontSize:"12px",color:C.or,fontFamily:"monospace",marginBottom:"14px"}}>{ticket.fields?.Name} — {ticket.fields?.Client}</div>
        {ticket.fields?.Diagnostic && (
          <div style={{background:"rgba(var(--iko-dark-rgb),0.05)",border:"1px solid rgba(var(--iko-dark-rgb),0.2)",borderRadius:"10px",padding:"10px 14px",marginBottom:"14px",fontSize:"12px",color:"var(--iko-bg-sombre)"}}>
            📋 Diagnostic technicien : {ticket.fields.Diagnostic}
          </div>
        )}

        {etape === "edition" && (<>
        {chargement && <div style={{textAlign:"center",padding:"20px 0",color:C.muted,fontSize:"12px"}}>⏳ Chargement du catalogue client...</div>}

        {!chargement && (
          <LigneDevisEditeur demo={demoCat} produits={catalogue.produits} mo={catalogue.mo} lignes={lignes} ticket={ticket}
            onAjouter={l => setLignes([...lignes, l])} onSupprimer={i => setLignes(lignes.filter((_,idx) => idx!==i))}/>
        )}

        <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Email client *</label>
        <input type="email" placeholder="client@exemple.fr" value={email} onChange={e => setEmail(e.target.value)}
          style={{marginBottom:"14px",border:"1.5px solid "+(email && !emailValide ? C.rouge : "#D1D5DB")}}/>
        <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Message complémentaire (facultatif)</label>
        <textarea rows={2} placeholder="Ex : délai de livraison estimé..." value={message} onChange={e => setMessage(e.target.value)} style={{resize:"none",marginBottom:"14px"}}/>

        <div style={{display:"flex",gap:"10px",marginBottom:"14px",flexWrap:"wrap"}}>
          <div style={{flex:"2 1 220px"}}>
            <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Conditions de paiement</label>
            <select value={conditions} onChange={e => setConditions(e.target.value)}>
              <option>Acompte de 30 % à la commande, solde à la fin des travaux</option>
              <option>Acompte de 50 % à la commande, solde à la livraison</option>
              <option>Paiement comptant à la réception de la facture</option>
              <option>Paiement à 30 jours</option>
            </select>
          </div>
          <div style={{flex:"1 1 120px"}}>
            <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Validité du devis</label>
            <select value={validite} onChange={e => setValidite(Number(e.target.value))}>
              <option value={15}>15 jours</option><option value={30}>30 jours</option><option value={60}>60 jours</option><option value={90}>90 jours</option>
            </select>
          </div>
        </div>
        <div style={{background:"#F3F4F6",border:"1px solid "+C.border,borderRadius:"8px",padding:"9px 12px",fontSize:"11px",color:C.muted,marginBottom:"14px"}}>
          Le PDF reprend le logo, l'identité de l'entreprise et les mentions légales (SIRET, TVA, décennale, validité, paiement). Tu le vérifies à l'étape suivante avant l'envoi.
        </div>
        </>)}
        {etape === "apercu" && (
          <div style={{marginBottom:"12px"}}>
            <div style={{fontSize:"12px",color:C.muted,marginBottom:"8px"}}>Aperçu du PDF tel que le client le recevra · {numeroDevis} · à {email}</div>
            {apercuUrl && <iframe title="Aperçu devis" src={apercuUrl} style={{width:"100%",height:"58vh",border:"1px solid "+C.border,borderRadius:"10px",background:"#fff"}}/>}
            {message && <div style={{fontSize:"11px",color:C.muted,marginTop:"8px"}}>Message joint : {message}</div>}
          </div>
        )}

        const formule = encodeURIComponent('{Statut}="Envoyé"');

// Chargement à la demande des interventions SAV brutes (route tenant
// dédiée, AUTH #008) : appelé uniquement à l'ouverture d'un panneau
// Analytics/Dirigeant, jamais au chargement initial du dashboard —
// économie de quota Airtable.
// A6 : pagination complète via le curseur "offset" renvoyé par Airtable
// tant qu'il y en a un — n'est plus plafonné à 200 enregistrements.
// Garde-fou de sécurité à 20 pages (2000 enregistrements) pour éviter un
// appel incontrôlé en cas d'anomalie de données, sans changer le
// comportement pour un volume normal.
// A7 : retourne désormais un résultat explicite {ok, records|erreur} au
// lieu d'un simple tableau, pour que l'appelant distingue "aucune
// donnée" (ok:true, records:[]) d'une "erreur de chargement" (ok:false).
async function chargerInterventionsSAV() {
  const MAX_PAGES = 20;
  let tousLesRecords = [];
  let offset = undefined;
  try {
    for (let page = 0; page < MAX_PAGES; page++) {
      const url = '/api/airtable/tenant/Interventions%20SAV?maxRecords=100' + (offset ? '&offset=' + encodeURIComponent(offset) : '');
      const r = await fetch(url);
      if (!r.ok) {
        return { ok: false, erreur: "Erreur serveur (" + r.status + ") lors du chargement des interventions SAV." };
      }
      const data = await r.json();
      tousLesRecords = tousLesRecords.concat(data.records || []);
      offset = data.offset;
      if (!offset) break;
    }
    return { ok: true, records: tousLesRecords };
  } catch (e) {
    return { ok: false, erreur: "Connexion impossible lors du chargement des interventions SAV." };
  }
}

// Intelligence Commerciale V1 — mission #1 (taux de conversion des devis).
// Même architecture que chargerInterventionsSAV ci-dessus : pagination par
// offset, plafond de sécurité à 20 pages (2000 devis), route Airtable
// existante (/api/airtable/Devis, déjà utilisée par ModalGestionDevis) —
// le filtrage tenant est déjà appliqué automatiquement côté serveur pour
// cette table (api/airtable-proxy.js, TABLES_TENANT_CONFIRME.Devis,
// filtrageListeFiable:true), aucun filtre à ajouter ici.
// Cache mémoire : une seule récupération globale par session, jamais au
// montage du dashboard — appelé uniquement à l'ouverture du panneau
// Intelligence Commerciale (ModalIntelligenceCommerciale ci-dessous).
let _devisAnalyticsCache = null;
async function chargerDevisPourAnalytics() {
  if (_devisAnalyticsCache) return _devisAnalyticsCache;
  const MAX_PAGES = 20;
  let tousLesRecords = [];
  let offset = undefined;
  try {
    for (let page = 0; page < MAX_PAGES; page++) {
      const url = '/api/airtable/Devis?maxRecords=100' + (offset ? '&offset=' + encodeURIComponent(offset) : '');
      const r = await fetch(url);
      if (!r.ok) {
        return { ok: false, erreur: "Erreur serveur (" + r.status + ") lors du chargement des devis." };
      }
      const data = await r.json();
      tousLesRecords = tousLesRecords.concat(data.records || []);
      offset = data.offset;
      if (!offset) break;
    }
    const resultat = { ok: true, records: tousLesRecords };
    _devisAnalyticsCache = resultat; // jamais mis en cache en cas d'erreur, pour permettre un nouvel essai
    return resultat;
  } catch (e) {
    return { ok: false, erreur: "Connexion impossible lors du chargement des devis." };
  }
}

// Intelligence Commerciale V1 — mission #7B (note client vs résultat du
// devis lié). Chargement CIBLÉ par ID, sur le même modèle que
// resoudreNomsAgences ci-dessous : jamais un listing global de la table
// Tickets SAV, seulement les fiches correspondant aux IDs réellement
// présents dans Devis["Ticket lié"] des devis déjà chargés par
// chargerDevisPourAnalytics(). Aucun helper générique "get record by ID"
// n'existe ailleurs dans le projet (le seul mécanisme comparable est déjà
// resoudreNomsAgences, spécifique à Agences) — ce loader en reprend
// exactement le principe. Cache mémoire persistant entre les ouvertures
// du panneau, jamais rafraîchi en cas d'échec pour permettre un nouvel essai.
let _ticketsAnalyticsCache = {};
async function chargerTicketsPourAnalytics(idsDistincts) {
  const manquants = idsDistincts.filter(id => !(id in _ticketsAnalyticsCache));
  if (manquants.length > 0) {
    await Promise.all(manquants.map(async id => {
      try {
        const r = await fetch('/api/airtable/Tickets%20SAV/' + id);
        _ticketsAnalyticsCache[id] = r.ok ? await r.json() : null;
      } catch (e) {
        _ticketsAnalyticsCache[id] = null;
      }
    }));
  }
  return idsDistincts.map(id => _ticketsAnalyticsCache[id]).filter(Boolean);
}

// Résolution des noms d'agence pour les devis (champ Airtable "Agence" =
// lien vers la table Agences, jamais résolu en nom nulle part ailleurs
// dans le code existant). Résout uniquement les IDs distincts passés en
// argument (jamais un listing global de la table Agences, qui n'est pas
// filtrée de façon fiable par tenant côté serveur), via une lecture par
// enregistrement précis (/api/airtable/Agences/<id>, même route que
// resoudreClientDepuisAgence) — bénéficie donc du contrôle de propriété
// tenant déjà appliqué par le proxy sur cette route. Cache mémoire
// persistant entre les ouvertures du panneau.
let _agencesNomsCache = {};
async function resoudreNomsAgences(idsDistincts) {
  const manquants = idsDistincts.filter(id => !(id in _agencesNomsCache));
  if (manquants.length > 0) {
    await Promise.all(manquants.map(async id => {
      try {
        const r = await fetch('/api/airtable/Agences/' + id);
        if (r.ok) {
          const j = await r.json();
          _agencesNomsCache[id] = (j.fields && j.fields["Nom agence"]) || null;
        } else {
          _agencesNomsCache[id] = null;
        }
      } catch (e) {
        _agencesNomsCache[id] = null;
      }
    }));
  }
  const resultatMap = {};
  idsDistincts.forEach(id => { resultatMap[id] = _agencesNomsCache[id] || null; });
  return resultatMap;
}

  // Mission #13 — Causes récurrentes SAV : réutilise EXACTEMENT le même

  const causesRecurrentesSAV = window.AnalyticsSAV.calculerCausesRecurrentesSAVV1(tickets);

  // Mission #14 — Produits/services associés au SAV : réutilise EXACTEMENT

  // fetch).
  const produitsServicesSAV = window.AnalyticsSAV.calculerProduitsServicesSAVV1(tickets);

  // Mission #15 — Intelligence de résolution SAV : réutilise EXACTEMENT les
  // mêmes `interventions` (déjà chargées par le useEffect existant
  // ci-dessus) et `tickets` déjà chargés par ce panneau (aucun nouvel appel
  // Airtable, aucun nouveau useEffect de chargement, aucun nouveau fetch).
  // null tant que `interventions` n'est pas encore chargé.
  const intelligenceResolutionSAV = interventions ? window.AnalyticsSAV.calculerIntelligenceResolutionSAVV1(interventions, tickets) : null;

  // Pack missions #16, #17, #18 — mêmes `interventions`/`tickets` déjà
  // chargés ci-dessus (aucun nouvel appel Airtable, aucun nouveau
  // useEffect de chargement, aucun nouveau fetch). null tant que
  // `interventions` n'est pas encore chargé (sauf mission #17, qui ne
  // dépend que des interventions et suit la même règle de garde).
  const produitsResolutionSAV = interventions ? window.AnalyticsSAV.calculerProduitsResolutionSAVV1(interventions, tickets) : null;
  const dureeInterventionSAV = interventions ? window.AnalyticsSAV.calculerIntelligenceDureeInterventionSAVV1(interventions) : null;
  const coutSAVParResolution = interventions ? window.AnalyticsSAV.calculerCoutSAVParResolutionV1(interventions, tickets) : null;

  // Pack missions #19, #20, #21 — mêmes `interventions`/`tickets` déjà
  // chargés ci-dessus (aucun nouvel appel Airtable, aucun nouveau
  // useEffect de chargement, aucun nouveau fetch). Mission #21 ne
  // recalcule rien : elle reçoit uniquement les résultats déjà calculés
  // ci-dessus (#17, #18, #15) ainsi que #19/#20.
  const profilsProduitsSAV = interventions ? window.AnalyticsSAV.calculerProfilSAVParProduitV1(interventions, tickets) : null;
  const intelligenceTechniciensSAV = interventions ? window.AnalyticsSAV.calculerIntelligenceTechniciensSAVV1(interventions, tickets) : null;
  const signauxMultiIndicateursSAV = (profilsProduitsSAV && intelligenceTechniciensSAV && dureeInterventionSAV && coutSAVParResolution && intelligenceResolutionSAV)
    ? window.AnalyticsSAV.genererSignauxMultiIndicateursSAVV1(profilsProduitsSAV, intelligenceTechniciensSAV, dureeInterventionSAV, coutSAVParResolution, intelligenceResolutionSAV)
    : null;

  // ---- Détection prédictive SAV V1 : "Signaux prédictifs SAV" ----
  // Reutilise EXACTEMENT les memes agregats deja calcules ci-dessus (aucun
  // nouveau calcul de fond, aucun nouvel appel Airtable) : fonction separee
  // de detecterAlertesSAV, qui reste inchangee (section "Alertes SAV"
  // ci-dessus non modifiee). Purement statistique/deterministe, jamais une
  // prediction presentee comme certaine (voir analytics-sav.js).
  const signauxPredictifsSAV = window.AnalyticsSAV.genererSignauxPredictifsSAV({
    tauxUrgents, topCauses, topProduitsDetail,
    resolutionParAgence: perfEtResolution ? perfEtResolution.resolutionParAgence : [],
    performanceTechniciens: perfEtResolution ? perfEtResolution.performanceTechniciens : [],
  });
  const NIVEAU_SIGNAL_STYLE = {
    fort: { couleur: "var(--iko-erreur)", fond: "rgba(var(--iko-erreur-rgb),0.08)", label: "Signal fort" },
    moyen: { couleur: "var(--iko-statut-attention)", fond: "rgba(var(--iko-statut-attention-rgb),0.08)", label: "Signal moyen" },
    faible: { couleur: "var(--iko-texte-clair)", fond: "rgba(var(--iko-statut-neutre-rgb),0.08)", label: "Signal faible" },
  };

  // ---- Socle IA : synthèse direction (mode "synthese_direction") ----
  // Reutilise l'architecture existante (api/chat-dashboard.js, meme
  // principe que devis_suggestion) : le serveur ne recoit QUE les chiffres
  // deja calcules ci-dessus, jamais les tickets bruts. Le prompt interdit
  // explicitement d'inventer un chiffre ou une cause absente de ces
  // chiffres. Aucune ecriture, generation a la demande uniquement.
  const [syntheseIA, setSyntheseIA] = React.useState(null);
  const [chargementSynthese, setChargementSynthese] = React.useState(false);

  const genererSynthese = async () => {
    setChargementSynthese(true);
    setSyntheseIA(null);
    try {
      const r = await fetch('/api/chat-dashboard', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'synthese_direction',
          stats: {
            total_tickets: tickets.length,
            top_produits: topProduits.map(([p, n]) => ({ produit: p, nb: n })),
            repartition_agences: repartitionAgences.map(([a, n]) => ({ agence: a, nb: n })),
            repartition_statuts: repartitionStatuts.map(([s, n]) => ({ statut: s, nb: n })),
            taux_urgents_pct: tauxUrgents,
            tendance_mensuelle: tendance,
            estimation_mois_suivant: estimationMoisSuivant,
            top_causes_sav: topCauses.map(([c, n]) => ({ cause: c, nb: n })),
            cout_sav_global: coutSAVGlobal,
            taux_resolution_premier_passage: perfEtResolution ? perfEtResolution.tauxResolutionPremierPassage : null,
          },
        }),
      });
      const data = await r.json();
      if (r.ok && !data.erreur) setSyntheseIA(data);
    } catch (e) {}
    setChargementSynthese(false);
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box" style={{maxWidth:"560px"}}>
        <div style={{fontSize:"16px",fontWeight:"900",color:C.white,marginBottom:"4px"}}>📊 Analytics SAV</div>
        <div style={{fontSize:"11px",color:C.muted,marginBottom:"16px"}}>{tickets.length} ticket(s) chargé(s) — lecture seule</div>

        {alertesSAV.length > 0 && (
          <div style={{marginBottom:"18px",border:"1px solid rgba(var(--iko-erreur-rgb),0.3)",background:"rgba(var(--iko-erreur-rgb),0.06)",borderRadius:"8px",padding:"10px 12px"}}>
            <div style={{fontSize:"12px",fontWeight:"700",color:C.rouge,marginBottom:"6px"}}>🔔 Alertes SAV</div>
            {alertesSAV.map((a, i) => (
              <div key={i} style={{fontSize:"11.5px",color:C.text,marginBottom:i<alertesSAV.length-1?"4px":0}}>• {a.texte}</div>
            ))}
          </div>

        {signauxPredictifsSAV.length > 0 && (
          <div style={{marginBottom:"18px",border:"1px solid "+C.border,borderRadius:"8px",padding:"10px 12px"}}>
            <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"2px"}}>🔮 Signaux prédictifs SAV</div>
            <div style={{fontSize:"10px",color:C.muted,marginBottom:"8px"}}>Détection statistique, pas une certitude — chaque signal reste à vérifier sur le terrain.</div>
            {signauxPredictifsSAV.map((s, i) => {
              const style = NIVEAU_SIGNAL_STYLE[s.niveau] || NIVEAU_SIGNAL_STYLE.faible;
              return (
                <div key={i} style={{background:style.fond,border:"1px solid "+style.couleur,borderRadius:"8px",padding:"8px 10px",marginBottom:i<signauxPredictifsSAV.length-1?"8px":0}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"8px",marginBottom:"4px"}}>
                    <span style={{fontSize:"11.5px",fontWeight:"700",color:C.white}}>{s.probleme}</span>
                    <span style={{fontSize:"9px",fontWeight:"700",color:style.couleur,border:"1px solid "+style.couleur,borderRadius:"10px",padding:"1px 7px",whiteSpace:"nowrap"}}>{style.label}</span>
                  </div>
                  <div style={{fontSize:"10.5px",color:C.text,marginBottom:"3px"}}><b>Donnée observée</b> · {s.donneeObservee}</div>
                  <div style={{fontSize:"10.5px",color:C.muted,fontStyle:"italic",marginBottom:"3px"}}><b>Hypothèse (non confirmée)</b> · {s.hypothese}</div>
                  <div style={{fontSize:"10.5px",color:C.text}}><b>À vérifier</b> · {s.action}</div>
                </div>
              );
            })}
          </div>
        )}

        <div style={{marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"8px"}}>Produits générant le plus de SAV</div>
          {erreurTopProduitsDetail && (
            <div style={{fontSize:"11px",color:"var(--iko-erreur)",fontWeight:"700"}}>⚠️ {erreurTopProduitsDetail}</div>
          )}
          {!erreurTopProduitsDetail && topProduitsDetail.length === 0 && (
            <div style={{fontSize:"11px",color:C.muted,fontStyle:"italic"}}>Aucun produit renseigné sur les tickets chargés.</div>
          )}
          {!erreurTopProduitsDetail && topProduitsDetail.length > 0 && (
            <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden"}}>
              <div style={{display:"flex",padding:"6px 12px",fontSize:"9.5px",fontWeight:"700",color:C.muted,borderBottom:"1px solid "+C.border,textTransform:"uppercase"}}>
                <span style={{flex:2}}>Produit</span>
                <span style={{flex:1,textAlign:"right"}}>Tickets</span>
                <span style={{flex:1,textAlign:"right"}}>Clients</span>
                <span style={{flex:1,textAlign:"right"}}>Causes</span>
              </div>
              {topProduitsDetail.map((p, i) => (
                <div key={p.produit} style={{display:"flex",alignItems:"center",padding:"7px 12px",borderBottom:i<topProduitsDetail.length-1?"1px solid "+C.border:"none",fontSize:"12px"}}>
                  <span style={{flex:2}}>
                    {p.produit}
                    {p.evolution && (
                      <span title={"Tendance 6 mois : "+p.evolution}
                        style={{marginLeft:"6px",fontSize:"10px",color:p.evolution==="hausse"?C.rouge:(p.evolution==="baisse"?"var(--iko-primary)":C.muted)}}>
                        {p.evolution==="hausse"?"↑":p.evolution==="baisse"?"↓":"→"}
                      </span>
                    )}
                  </span>
                  <b style={{flex:1,textAlign:"right",color:C.or}}>{p.total}</b>
                  <span style={{flex:1,textAlign:"right"}}>{p.nbClients}</span>
                  <span style={{flex:1,textAlign:"right"}}>{p.nbCauses}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={{marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"8px"}}>Répartition par agence</div>
          {repartitionAgences.length === 0 && <div style={{fontSize:"11px",color:C.muted,fontStyle:"italic"}}>Aucune agence renseignée sur les tickets chargés.</div>}
          {repartitionAgences.length > 0 && (
            <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden"}}>
              {repartitionAgences.map(([agence, n], i) => (
                <div key={agence} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 12px",borderBottom:i<repartitionAgences.length-1?"1px solid "+C.border:"none",fontSize:"12px"}}>
                  <span>{agence}</span>
                  <span><b>{n}</b> <span style={{color:C.muted}}>({totalAvecAgence ? Math.round(n / totalAvecAgence * 100) : 0}%)</span></span>
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={{marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"8px"}}>Répartition par statut</div>
          <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden"}}>
            {repartitionStatuts.map(([statut, n], i) => (
              <div key={statut} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 12px",borderBottom:i<repartitionStatuts.length-1?"1px solid "+C.border:"none",fontSize:"12px"}}>

        <div style={{marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"2px"}}>Tendance mensuelle (6 derniers mois)</div>

          <div style={{display:"flex",alignItems:"flex-end",gap:"6px",height:"70px"}}>
            {tendance.map(m => (
              <div key={m.label} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"4px"}}>
                <div style={{width:"100%",height:Math.max(3,Math.round(m.valeur/maxTendance*54))+"px",background:C.or,borderRadius:"3px"}} title={m.valeur+" ticket(s)"}/>
                <div style={{fontSize:"9px",color:C.muted}}>{m.label}</div>
              </div>
            ))}
          </div>
          {estimationMoisSuivant !== null && (
            <div style={{fontSize:"11px",color:C.muted,marginTop:"8px",fontStyle:"italic"}}>
              Estimation du mois suivant (moyenne des 3 derniers mois) : ≈ {estimationMoisSuivant} ticket(s). Simple tendance statistique, pas une prédiction causale.
            </div>
          )}
        </div>

        <div style={{marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"8px"}}>Top causes SAV</div>
          {topCauses.length === 0 && <div style={{fontSize:"11px",color:C.muted,fontStyle:"italic"}}>Aucune cause renseignée pour l'instant (champ Cause SAV facultatif, à remplir au fil des tickets).</div>}
          {topCauses.length > 0 && (
            <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden"}}>
              {topCauses.map(([cause, n], i) => (
                <div key={cause} style={{display:"flex",justifyContent:"space-between",padding:"7px 12px",borderBottom:i<topCauses.length-1?"1px solid "+C.border:"none",fontSize:"12px"}}>
                  <span>{cause}</span><b style={{color:C.or}}>{n}</b>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Mission #13 — Causes récurrentes SAV V1 : analyse descriptive
            dédiée, distincte du "Top causes SAV" ci-dessus (qui reste
            inchangé). Se rabat sur un message explicite si aucune donnée
            structurée exploitable n'est disponible, sans jamais inventer
            de valeur. */}
        <div style={{marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"2px"}}>Causes récurrentes SAV</div>
          <div style={{fontSize:"11px",color:C.muted,marginBottom:"8px"}}>Occurrences observées dans les tickets SAV exploitables — analyse descriptive.</div>
          {causesRecurrentesSAV.totalTicketsExploitables === 0 ? (
            <div style={{fontSize:"11.5px",color:C.muted,fontStyle:"italic"}}>Analyse non disponible : aucune donnée structurée exploitable pour identifier les causes récurrentes.</div>
          ) : (
            <>
              <div style={{display:"flex",flexWrap:"wrap",gap:"14px",marginBottom:"8px"}}>
                <div style={{fontSize:"11.5px",color:C.text}}>Tickets analysés : <b style={{color:C.white}}>{causesRecurrentesSAV.totalTicketsAnalyses}</b></div>
                <div style={{fontSize:"11.5px",color:C.text}}>Tickets exploitables : <b style={{color:C.white}}>{causesRecurrentesSAV.totalTicketsExploitables}</b></div>
              </div>
              <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden"}}>
                <div style={{display:"flex",padding:"6px 12px",fontSize:"9.5px",fontWeight:"700",color:C.muted,borderBottom:"1px solid "+C.border,textTransform:"uppercase"}}>
                  <span style={{flex:2}}>Cause</span>
                  <span style={{flex:1,textAlign:"right"}}>Tickets</span>
                </div>
                {causesRecurrentesSAV.causes.slice(0, 10).map((c, i) => (
                  <div key={c.cause} style={{display:"flex",alignItems:"center",padding:"7px 12px",borderBottom:i<Math.min(10,causesRecurrentesSAV.causes.length)-1?"1px solid "+C.border:"none",fontSize:"12px"}}>
                    <span style={{flex:2}}>{c.cause}</span>
                    <b style={{flex:1,textAlign:"right",color:C.or}}>{c.nombreTickets}</b>
                  </div>
                ))}
              </div>
              <div style={{fontSize:"10.5px",color:C.muted,marginTop:"6px"}}>{causesRecurrentesSAV.causes.length} cause(s) distincte(s) au total.</div>
            </>
          )}
        </div>

        {/* Mission #14 — Produits/services associés au SAV V1 : analyse
            descriptive dédiée. Se rabat sur un message explicite si aucune
            donnée structurée exploitable n'est disponible, sans jamais
            inventer de valeur. La section croisée avec les causes SAV ne
            s'affiche que si `associationsParCause` a été construite (voir
            calculerProduitsServicesSAVV1). */}
        <div style={{marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"2px"}}>Produits / services associés au SAV</div>
          <div style={{fontSize:"11px",color:C.muted,marginBottom:"8px"}}>Occurrences observées dans les tickets SAV exploitables — analyse descriptive.</div>
          {produitsServicesSAV.totalTicketsExploitables === 0 ? (
            <div style={{fontSize:"11.5px",color:C.muted,fontStyle:"italic"}}>Analyse non disponible : aucune donnée structurée exploitable pour identifier les produits/services associés aux tickets SAV.</div>
          ) : (
            <>
              <div style={{display:"flex",flexWrap:"wrap",gap:"14px",marginBottom:"8px"}}>
                <div style={{fontSize:"11.5px",color:C.text}}>Tickets analysés : <b style={{color:C.white}}>{produitsServicesSAV.totalTicketsAnalyses}</b></div>
                <div style={{fontSize:"11.5px",color:C.text}}>Tickets exploitables : <b style={{color:C.white}}>{produitsServicesSAV.totalTicketsExploitables}</b></div>
              </div>
              <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden"}}>
                <div style={{display:"flex",padding:"6px 12px",fontSize:"9.5px",fontWeight:"700",color:C.muted,borderBottom:"1px solid "+C.border,textTransform:"uppercase"}}>
                  <span style={{flex:2}}>Produit / service</span>
                  <span style={{flex:1,textAlign:"right"}}>Tickets</span>
                </div>
                {produitsServicesSAV.produits.slice(0, 10).map((p, i) => (
                  <div key={p.produitService} style={{display:"flex",alignItems:"center",padding:"7px 12px",borderBottom:i<Math.min(10,produitsServicesSAV.produits.length)-1?"1px solid "+C.border:"none",fontSize:"12px"}}>
                    <span style={{flex:2}}>{p.produitService}</span>
                    <b style={{flex:1,textAlign:"right",color:C.or}}>{p.nombreTickets}</b>
                  </div>
                ))}
              </div>
              <div style={{fontSize:"10.5px",color:C.muted,marginTop:"6px"}}>{produitsServicesSAV.produits.length} produit(s)/service(s) distinct(s) au total.</div>

              {produitsServicesSAV.associationsParCause && produitsServicesSAV.associationsParCause.length > 0 && (

                      <div style={{padding:"6px 12px",fontSize:"11px",fontWeight:"700",color:C.white,borderBottom:"1px solid "+C.border}}>{ac.cause}</div>
                      {ac.produits.slice(0, 10).map((p, i) => (
                        <div key={p.produitService} style={{display:"flex",alignItems:"center",padding:"6px 12px",borderBottom:i<Math.min(10,ac.produits.length)-1?"1px solid "+C.border:"none",fontSize:"11.5px"}}>
                          <span style={{flex:2}}>{p.produitService}</span>
                          <b style={{flex:1,textAlign:"right",color:C.or}}>{p.nombreTickets}</b>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              )}
            </>
          )}
        </div>

        {/* Mission #15 — Intelligence de résolution SAV V1 : analyse
            purement descriptive du nombre d'interventions par ticket.
            "Résolution première intervention" signifie ICI uniquement
            "ticket avec une seule intervention exploitable" — aucune
            lecture du statut de l'intervention, aucune interprétation de
            qualité. `intelligenceResolutionSAV` reste null tant que les
            interventions n'ont pas fini de charger (même useEffect que
            "Performance et résolution" ci-dessus, aucun nouveau chargement). */}
        <div style={{marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"2px"}}>Résolution SAV</div>
          <div style={{fontSize:"11px",color:C.muted,marginBottom:"8px"}}>Analyse descriptive du nombre d'interventions nécessaires par ticket. Une seule intervention indique ici l'absence de réintervention observée dans les données disponibles.</div>
          {!intelligenceResolutionSAV ? (
            <div style={{fontSize:"11.5px",color:C.muted,fontStyle:"italic"}}>Chargement des interventions en cours…</div>
          ) : intelligenceResolutionSAV.ticketsAvecInterventionExploitable === 0 ? (
            <div style={{fontSize:"11.5px",color:C.muted,fontStyle:"italic"}}>Analyse non disponible : aucune intervention exploitable reliée aux tickets SAV chargés.</div>
          ) : (
            <>
              <div style={{display:"flex",flexWrap:"wrap",gap:"14px",marginBottom:"8px"}}>

                <div style={{fontSize:"11.5px",color:C.text}}>Taux de réintervention : <b style={{color:C.white}}>{intelligenceResolutionSAV.tauxReintervention === null ? "N/A" : intelligenceResolutionSAV.tauxReintervention + " %"}</b></div>

/* ---- Intelligence Commerciale V1 — Taux de conversion des devis ----

  // Résolution des noms d'agence : uniquement les IDs distincts réellement

/* ---- Tableau de bord dirigeant : vue consolidée pour la direction,
   réutilise calculerAnalyticsSAV (même source de vérité que le panneau
   Analytics opérationnel) et le socle IA synthese_direction déjà validé.
   Aucune donnée inventée : tout indicateur sans champ Airtable fiable
   est affiché "non disponible" plutôt qu'estimé. ---- */
// ---- FACTURATION & COMPTABILITÉ (Central) : devis validé -> facture, suivi des règlements, exports comptables ----
const telechargerContenu = (contenu, nom, mime) => {
  const blob = contenu instanceof Blob ? contenu : new Blob([contenu], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
const num2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const fr2 = (n) => num2(n).toFixed(2).replace('.', ',');
const aujourdhuiISO = () => new Date().toISOString().slice(0, 10);
const ajouterJoursISO = (iso, j) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + j); return d.toISOString().slice(0, 10); };
const echeanceDepuisConditions = (cond, dateFact) => {
  const m = String(cond || "").match(/(\d+)\s*jours/i);
  return m ? ajouterJoursISO(dateFact, Number(m[1])) : dateFact;
};
function lignesDuDevis(f) { try { const l = JSON.parse(f?.["Lignes devis (JSON)"] || "[]"); return Array.isArray(l) ? l : []; } catch(e) { return []; } }
// TVA ventilée par taux, arrondie pour que base + TVA = TTC du devis.
function ventilationTva(f) {
  const lignes = lignesDuDevis(f);
  const ht = num2(f?.["Montant HT"]); const ttc = num2(f?.["Montant TTC"]);
  const parTaux = {};
  lignes.forEach(l => { const t = l.tauxTva != null ? l.tauxTva : 0.2; parTaux[t] = (parTaux[t] || 0) + (Number(l.totalHT) || 0); });
  const taux = Object.keys(parTaux).sort();
  let reste = num2(ttc - ht);
  const out = taux.map((t, i) => {
    const base = num2(parTaux[t]);
    let tva = i === taux.length - 1 ? reste : num2(parTaux[t] * Number(t));
    reste = num2(reste - (i === taux.length - 1 ? 0 : tva));
    return { taux: Number(t), base, tva };
  });
  if (!out.length) out.push({ taux: 0.2, base: ht, tva: num2(ttc - ht) });
  return out;
}
function ligneFacture(rec) {
  const f = rec.fields || {};
  const dateFact = f["Date facture"] || "";
  return {
    id: rec.id, facture: f["N° facture"] || "", dateFacture: dateFact, devis: f["N° devis"] || "",
    client: f["Nom client"] || "", adresse: f["Adresse client"] || "", cp: f["CP client"] || "",
    ht: num2(f["Montant HT"]), ttc: num2(f["Montant TTC"]), tva: num2((f["Montant TTC"] || 0) - (f["Montant HT"] || 0)),
    conditions: f["Conditions paiement"] || "", echeance: dateFact ? echeanceDepuisConditions(f["Conditions paiement"], dateFact) : "",
    statutPaiement: f["Statut paiement"] || (f["N° facture"] ? "À payer" : ""), datePaiement: f["Date paiement"] || "",
    mode: f["Mode règlement"] || "", ventilation: ventilationTva(rec.fields || {}),
  };
}
function construireFEC(lignes) {
  const entetes = ["JournalCode","JournalLib","EcritureNum","EcritureDate","CompteNum","CompteLib","CompAuxNum","CompAuxLib","PieceRef","PieceDate","EcritureLib","Debit","Credit","EcritureLet","DateLet","ValidDate","Montantdevise","Idevise"];
  const d8 = (iso) => String(iso || "").replace(/-/g, "");
  const aux = (nom) => "C" + String(nom || "CLIENT").normalize("NFD").replace(/[^A-Za-z0-9]/g, "").toUpperCase().slice(0, 10);
  const out = [entetes.join("\t")]; let n = 0;
  const ecr = (j, jl, date, compte, cl, auxNum, auxLib, piece, lib, deb, cred) => {
    out.push([j, jl, n, d8(date), compte, cl, auxNum, auxLib, piece, d8(date), lib, fr2(deb), fr2(cred), "", "", d8(date), "", ""].join("\t"));
  };
  lignes.filter(l => l.facture).forEach(l => {
    n += 1;
    const lib = "Facture " + l.facture + " " + l.client;
    ecr("VT", "Journal des ventes", l.dateFacture, "411000", "Clients", aux(l.client), l.client, l.facture, lib, l.ttc, 0);
    ecr("VT", "Journal des ventes", l.dateFacture, "706000", "Prestations de services", "", "", l.facture, lib, 0, l.ht);
    l.ventilation.forEach(v => { if (v.tva) ecr("VT", "Journal des ventes", l.dateFacture, "445710", "TVA collectée " + Math.round(v.taux * 1000) / 10 + " %", "", "", l.facture, lib, 0, v.tva); });
    if (l.statutPaiement === "Payé" && l.datePaiement) {
      n += 1;
      const libP = "Règlement facture " + l.facture + " " + l.client + (l.mode ? " (" + l.mode + ")" : "");
      ecr("BQ", "Journal de banque", l.datePaiement, "512000", "Banque", "", "", l.facture, libP, l.ttc, 0);
      ecr("BQ", "Journal de banque", l.datePaiement, "411000", "Clients", aux(l.client), l.client, l.facture, libP, 0, l.ttc);
    }
  });
  return out.join("\r\n");
}
const csvCell = (v) => { const s = String(v == null ? "" : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function construireCSV(lignes) {
  const ent = ["N° facture","Date facture","N° devis","Client","Adresse","CP","Total HT","TVA","Total TTC","Conditions de paiement","Échéance","Statut paiement","Date paiement","Mode de règlement"];
  const rows = lignes.filter(l => l.facture).map(l => [l.facture, l.dateFacture, l.devis, l.client, l.adresse, l.cp, fr2(l.ht), fr2(l.tva), fr2(l.ttc), l.conditions, l.echeance, l.statutPaiement, l.datePaiement, l.mode]);
  return "﻿" + [ent, ...rows].map(r => r.map(csvCell).join(";")).join("\r\n");
}
function construireJournalCSV(lignes) {
  const rows = [["Journal","Date","Pièce","Compte","Libellé","Débit","Crédit"]];
  construireFEC(lignes).split("\r\n").slice(1).forEach(l => { const c = l.split("\t"); rows.push([c[0], c[3], c[8], c[4] + (c[6] ? " / " + c[6] : ""), c[10], c[11], c[12]]); });
  return "﻿" + rows.map(r => r.map(csvCell).join(";")).join("\r\n");
}
