  const updateStatus = async (id, newStatus) => {
    setTickets(prev => prev.map(t => t.id===id?{...t,fields:{...t.fields,Statut:newStatus}}:t));
    await fetch('/api/airtable/tenant/Tickets SAV/'+id, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fields:{Statut:newStatus}})
    });
  };

  // ---- Amandine vocale : ecoute, comprend, agit directement sur le dashboard ----
  // iOS Safari bloque silencieusement speechSynthesis.speak() si l'appel
  // n'est pas synchrone avec le geste de l'utilisateur (clic/tap). Comme
  // notre reponse vocale arrive apres un appel reseau (asynchrone), on
  // "debloque" l'audio des le clic avec un utterance quasi silencieux.
  const ikoAudioRef = React.useRef(null);
  const VOICE_ID_IKO = "pNInz6obpgDQGcFmaJgB";
  const SILENCE_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";

  const debloquerVoixIOS = () => {
    try {
      const a = ikoAudioRef.current;
      if (a) { a.src = SILENCE_WAV; a.play().catch(() => {}); }
    } catch (e) {}
    try {
      // window.speechSynthesis est une API distincte de <audio> : iOS exige
      // aussi un premier appel synchrone avec le geste utilisateur, sinon
      // les speak() suivants (déclenchés après un await fetch, donc de
      // façon asynchrone) sont silencieusement ignorés. On "amorce" donc
      // le moteur ici avec une syllabe quasi inaudible.
      if ('speechSynthesis' in window) {
        const amorce = new SpeechSynthesisUtterance(' ');
        amorce.volume = 0.01;
        amorce.lang = 'fr-FR';
        window.speechSynthesis.speak(amorce);
      }
    } catch (e) {}
  };

  // Repli local si l'API ElevenLabs échoue (quota/crédits épuisés, réseau...) :
  // on utilise la synthèse vocale native du navigateur, gratuite et sans API.
  // Qualité moindre, mais IKO reste audible dans tous les cas.
  const parlerNavigateurNatif = (texte) => {
    try {
      if (!('speechSynthesis' in window) || !texte) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = 'fr-FR';
      window.speechSynthesis.speak(u);
    } catch (e) {}
  };

  const parlerAmandine = async (texte) => {
    try {
      if (!texte) return;
      const r = await fetch('/api/tts', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texte, voice_id: VOICE_ID_IKO }),
      });
      if (!r.ok) { parlerNavigateurNatif(texte); return; }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = ikoAudioRef.current;
      if (a) { a.volume = 1.0; a.src = url; a.play().catch(() => parlerNavigateurNatif(texte)); }
    } catch (e) { parlerNavigateurNatif(texte); }
  };

  const executerActionsAmandine = (actions) => {
    (actions || []).forEach(a => {
      if (a.name === 'filtrer_agence') {
        setAgenceFilter(a.input.agence === 'toutes' ? 'global' : a.input.agence);
      } else if (a.name === 'rechercher') {
        setSearch(a.input.requete || '');
        setStatutFilter('tous'); setUrgentOnly(false); setMessagesOnly(false); setRdvModifieOnly(false);
      } else if (a.name === 'changer_statut' && a.input.ticket_id) {
        updateStatus(a.input.ticket_id, a.input.nouveau_statut);
      } else if (a.name === 'filtrer_statut') {
        setStatutFilter(a.input.statut); setUrgentOnly(false); setMessagesOnly(false); setRdvModifieOnly(false);
      } else if (a.name === 'ouvrir_ticket') {
        ouvrirTicket(a.input.ticket_id || a.input.numero);
      } else if (a.name === 'renvoyer_ticket') {
        const cible = tickets.find(x => x.id === a.input.ticket_id || x.fields?.Name === a.input.numero);
        if (!cible) return;
        if (a.input.destinataire === 'technicien') {
          renvoyerMailTechnicien(cible.fields?.Name);
        } else if (cible.fields?.["Pas de contact client"]) {
          setAmandineErreur("Impossible : ce client n'a pas de contact email/téléphone exploitable.");
        } else {
          renvoyerMailClient(cible.fields?.Name);
        }
      } else if (a.name === 'marquer_message_lu') {
        const cible = tickets.find(x => x.id === a.input.ticket_id || x.fields?.Name === a.input.numero);
        if (cible) marquerMessageLu(cible);
      } else if (a.name === 'repondre_client') {
        const cible = tickets.find(x => x.id === a.input.ticket_id || x.fields?.Name === a.input.numero);
        if (cible && a.input.message) repondreClient(cible, a.input.message);
      } else if (a.name === 'preparer_blocage_dates') {
        // Action multi-champs sur potentiellement de nombreux créneaux :
        // on ouvre le formulaire pré-rempli, la confirmation reste manuelle.
        setBlocagePrefill({
          agence: a.input.agence || null,
          dateDebut: a.input.date_debut || null,
          dateFin: a.input.date_fin || null,
          motif: a.input.motif || null,
        });
        setShowModalBlocage(true);
      } else if (a.name === 'ouvrir_nouveau_rdv') {
        setRdvPrefillAgence(a.input.agence || null);
        setShowModalRdv(true);
      } else if (a.name === 'preparer_annulation_ticket') {
        // Action irréversible : on ouvre la confirmation avec motif pré-rempli,
        // le clic de validation reste manuel.
        const cible = tickets.find(x => x.id === a.input.ticket_id || x.fields?.Name === a.input.numero);
        if (cible) { setAnnulationMotifPrefill(a.input.motif || ""); setModalAnnulation(cible); }
      } else if (a.name === 'preparer_suppression_ticket') {
        const cible = tickets.find(x => x.id === a.input.ticket_id || x.fields?.Name === a.input.numero);
        if (cible) setModalSuppression(cible);
      } else if (a.name === 'afficher_analytics_sav') {
        setShowModalAnalytics(true);
      }
    });
  };

  const envoyerAmandine = async (transcript) => {
    setAmandineEnCours(true);
    setAmandineErreur("");
    try {
      const contexteTickets = tickets.slice(0, 150).map(t => ({
        id: t.id,
        numero: t.fields?.Name || "",
        client: t.fields?.Client || "",
        agence: t.fields?.Agence || "",
        statut: t.fields?.Statut || "Nouveau",
        produit: t.fields?.Produit || "",
      }));
      const r = await fetch('/api/chat-dashboard', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ message: transcript, tickets: contexteTickets, agenceActuelle: agenceFilter, historique: ikoHistorique.slice(-6), connaissance: connaissanceEntrepriseLocale(), metier: metierEntrepriseLocal(), analyticsSAV: window.AnalyticsSAV.resumerAnalyticsSAV(window.AnalyticsSAV.calculerAnalyticsSAV(tickets), tickets.length, window.AnalyticsSAV.calculerCroisementsSAV(tickets)) })
      });
      const data = await r.json();
      if (data.erreur) { setAmandineErreur(data.erreur); setAmandineEnCours(false); return; }
      executerActionsAmandine(data.actions || []);
      const texte = data.reponse || "C'est fait.";
      setAmandineDernier(texte);
      setIkoHistorique(prev => [...prev, { role: 'user', texte: transcript }, { role: 'assistant', texte }].slice(-8));
      parlerAmandine(texte);
    } catch (e) {
      setAmandineErreur("Connexion impossible. Réessayez.");
    }
    setAmandineEnCours(false);
  };

  // Enregistrement + transcription serveur (Whisper), en remplacement de
  // webkitSpeechRecognition (peu fiable sur WebKit iOS après le 1er usage,
  // marche/arrête au tap plutôt que sur détection de silence, pour rester
  // prévisible sur tous les navigateurs).
  const mediaRecorderRef = React.useRef(null);
  const audioChunksRef = React.useRef([]);

  const lancerEcouteAmandine = async () => {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      // Environnement trop ancien : on retombe sur la dictée clavier iOS.
      const champ = document.getElementById('ikoChampTexte');
      if (champ) champ.focus();
      return;
    }
    setAmandineErreur("");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
        : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      const recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      audioChunksRef.current = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        setAmandineEcoute(false);
        const blob = new Blob(audioChunksRef.current, { type: recorder.mimeType || mimeType || 'audio/webm' });
        if (blob.size < 800) {
          setAmandineErreur("Aucune voix détectée. Réessayez en parlant juste après avoir appuyé sur le micro.");
          return;
        }
        setAmandineEnCours(true);
        try {
          const r = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': blob.type || 'audio/webm' },
            body: blob,
          });
          const data = await r.json();
          if (!r.ok || data.erreur || !data.texte) {
            setAmandineErreur(data.erreur || "Je n'ai rien compris. Réessayez.");
            setAmandineEnCours(false);
            return;
          }
          setAmandineDernier(data.texte);
          envoyerAmandine(data.texte);
        } catch (e) {
          setAmandineErreur("Transcription impossible. Réessayez.");
          setAmandineEnCours(false);
        }
      };
      mediaRecorderRef.current = recorder;
      recorder.start();
      setAmandineEcoute(true);
      // Coupure de sécurité si l'utilisateur oublie de retaper sur le micro.
      setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 15000);
    } catch (e) {
      setAmandineEcoute(false);
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError') {
        setAmandineErreur("Micro refusé par le navigateur. Appuyez sur l'icône micro barrée à côté de l'adresse du site pour l'autoriser, puis réessayez.");
      } else if (e.name === 'NotFoundError') {
        setAmandineErreur("Aucun micro détecté sur cet appareil.");
      } else {
        setAmandineErreur("Problème micro (" + e.name + "). Utilisez le champ texte en attendant.");
      }
    }
  };

  const arreterEcouteAmandine = () => {
    if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
      mediaRecorderRef.current.stop();
    }
  };

  const confirmerAnnulation = async (ticket, motif) => {
    const fields = { Statut: "Annulé", Commentaire: "Annulé : " + motif.trim() };
    const planningId = ticket?.fields?.PlanningID;
    if (planningId) {
      try {
        await fetch('/api/airtable/Planning/'+planningId, {
          method:'PATCH', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({fields:{Statut:'Libre'}})
        });
      } catch(e) { console.error(e); }
    }
    setTickets(prev => prev.map(t => t.id===ticket.id?{...t,fields:{...t.fields,...fields}}:t));
    await fetch('/api/airtable/tenant/Tickets SAV/'+ticket.id, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fields})
    });
    setModalAnnulation(null);
  };

  const confirmerSuppression = async (ticket) => {
    const planningId = ticket?.fields?.PlanningID;
    if (planningId) {
      try {
        await fetch('/api/airtable/Planning/'+planningId, {
          method:'PATCH', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({fields:{Statut:'Libre'}})
        });
      } catch(e) { console.error(e); }
    }
    const fields = { Statut: "Supprimé" };
    setTickets(prev => prev.map(t => t.id===ticket.id?{...t,fields:{...t.fields,...fields}}:t));
    try {
      await fetch('/api/airtable/tenant/Tickets SAV/'+ticket.id, {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({fields})
      });
    } catch(e) { console.error(e); }
    setModalSuppression(null);
  };

  const confirmerSuppressionDefinitive = async (ticket) => {
    const planningId = ticket?.fields?.PlanningID;
    if (planningId) {
      try {
        await fetch('/api/airtable/Planning/'+planningId, {
          method:'PATCH', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({fields:{Statut:'Libre'}})
        });
      } catch(e) { console.error(e); }
    }
    try {
      await fetch('/api/airtable/tenant/Tickets SAV/'+ticket.id, { method:'DELETE' });
    } catch(e) { console.error(e); }
    setTickets(prev => prev.filter(t => t.id !== ticket.id));
    setModalSuppressionDefinitive(null);
  };

  const filtered = tickets.filter(t => {
    const matchAgence = agenceFilter==="global" || t.fields?.Agence===AGENCE_VERS_AIRTABLE[agenceFilter];
    const matchStatut = statutFilter==="tous" ? (t.fields?.Statut !== "Terminé" && t.fields?.Statut !== "Annulé" && t.fields?.Statut !== "Supprimé") : statutFilter==="archives" ? (t.fields?.Statut === "Annulé" || t.fields?.Statut === "Supprimé") : (statutFilter==="devis" ? ["Devis à faire","Devis envoyé","Devis - Suivi","Devis - Attente fournisseur","Devis refusé"].includes(t.fields?.Statut) : t.fields?.Statut===statutFilter) || (!t.fields?.Statut&&statutFilter==="Nouveau");
    const matchUrgent = !urgentOnly || (t.fields?.Qualification === "Oui" && !isStatutClos(t.fields?.Statut));
    const matchMessages = !messagesOnly || t.fields?.["Message client non lu"] || t.id === openMessageTicketId;
    const matchRdvModifie = !rdvModifieOnly || t.fields?.["RDV modifié - notif technicien"];
    const q = search.toLowerCase();
    // Recherche globale : tous les champs textuels utiles déjà chargés
    // côté client, pas seulement Client/Numéro/Produit. Aucun nouvel
    // appel Airtable (les tickets sont déjà en mémoire) et aucune IA
    // nécessaire ici : simple recherche multi-champs déterministe. La
    // recherche vocale (outil "rechercher" de chat-dashboard.js) appelle
    // ce même filtre via setSearch, elle en bénéficie automatiquement.
    const matchSearch = !q || [
      t.fields?.Client, t.fields?.Name, t.fields?.Produit, t.fields?.Adresse,
      t.fields?.Email, t.fields?.Téléphone, t.fields?.Problème,
      t.fields?.Diagnostic, t.fields?.Commentaire,
    ].some(v => (v || "").toString().toLowerCase().includes(q));
    return matchAgence && matchStatut && matchUrgent && matchMessages && matchRdvModifie && matchSearch;
  });

  const sortFn = (a,b) => {
    if (sortBy === "date") return parseDateCreneau(a.fields?.Créneau) - parseDateCreneau(b.fields?.Créneau);
    if (sortBy === "ticket") return (b.fields?.Name||"").localeCompare(a.fields?.Name||"");
    return 0;
  };

  // Vue "Tous" : actifs triés en haut, terminés/annulés triés séparément en bas
  let sorted;
  if (statutFilter === "tous") {
    const actifs = filtered.filter(t => !isStatutClos(t.fields?.Statut));
    const clos = filtered.filter(t => isStatutClos(t.fields?.Statut));
    sorted = [...actifs.sort(sortFn), ...clos.sort(sortFn)];
  } else {
    sorted = [...filtered].sort(sortFn);
  }

  const stats = {
    total: tickets.filter(t => t.fields?.Statut !== "Terminé" && t.fields?.Statut !== "Annulé" && t.fields?.Statut !== "Supprimé").length,
    urgent: tickets.filter(t => t.fields?.Qualification === "Oui" && !isStatutClos(t.fields?.Statut)).length,
    nouveau: tickets.filter(t => !t.fields?.Statut||t.fields?.Statut==="Nouveau").length,
    encours: tickets.filter(t => t.fields?.Statut==="En cours").length,
    termine: tickets.filter(t => t.fields?.Statut==="Terminé").length,
    annule: tickets.filter(t => t.fields?.Statut==="Annulé").length,
    supprime: tickets.filter(t => t.fields?.Statut==="Supprimé").length,
    devisEnAttente: tickets.filter(t => ["Devis à faire","Devis envoyé","Devis - Suivi","Devis - Attente fournisseur"].includes(t.fields?.Statut)).length,
    messagesNonLus: tickets.filter(t => t.fields?.["Message client non lu"]).length,
    rdvModifies: tickets.filter(t => t.fields?.["RDV modifié - notif technicien"] && !isStatutClos(t.fields?.Statut)).length,
    diagnosticsMax: tickets.filter(t => t.fields?.["IKO Utilisé"] && !isStatutClos(t.fields?.Statut)).length,
  };
  stats.archives = stats.annule + stats.supprime;
  const ticketsNotes = tickets.filter(t => typeof t.fields?.Note === "number");
  stats.noteMoyenne = ticketsNotes.length ? (ticketsNotes.reduce((s,t) => s + t.fields.Note, 0) / ticketsNotes.length) : null;
  stats.nbNotes = ticketsNotes.length;

  const byAgence = {};
  AGENCES.forEach(a => { byAgence[a] = tickets.filter(t => t.fields?.Agence===AGENCE_VERS_AIRTABLE[a] && !["Terminé","Annulé","Supprimé"].includes(t.fields?.Statut)).length; });

  // Bloc 5 : Suivi intelligent IKO — dérivé de `tickets` (déjà chargé, aucun
  // appel supplémentaire), respecte l'agence sélectionnée comme byAgence,
  // indépendant des filtres de la liste principale (statutFilter, etc.) :
  // c'est une vue de synthèse, pas un filtre de plus.
  const ticketsPourAgence = tickets.filter(t => agenceFilter==="global" || t.fields?.Agence===AGENCE_VERS_AIRTABLE[agenceFilter]);
  const ticketsATraiterIKO = ticketsPourAgence
    .map(t => ({ t, info: evaluerPrioriteIKO(t) }))
    .filter(x => x.info.priorite === "urgent" || x.info.priorite === "a_traiter")
    .sort((a, b) => {
      if (a.info.priorite !== b.info.priorite) return a.info.priorite === "urgent" ? -1 : 1;
      return parseDateCreneau(a.t.fields?.Créneau) - parseDateCreneau(b.t.fields?.Créneau);
    });

  const notificationsIKO = genererNotificationsIKO(ticketsPourAgence, ticketsATraiterIKO);

  const allerAuTicketIKO = (id, statutTicket) => {
    // Un ticket clos (avis client faible) n'apparaît pas sous le filtre
    // "tous" (qui exclut Terminé/Annulé/Supprimé) : cibler son statut réel
    // pour qu'il soit effectivement visible dans la liste avant le scroll.
    setStatutFilter(isStatutClos(statutTicket) ? statutTicket : "tous");
    setUrgentOnly(false); setMessagesOnly(false); setRdvModifieOnly(false);
    setTimeout(() => document.getElementById("ticket-"+id)?.scrollIntoView({ behavior: "smooth", block: "center" }), 50);
  };

  if (vueMode === "vocal") {
    return (
      <div style={{position:"fixed",inset:0,background:"var(--iko-bg-sombre)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:100}}>
        <audio ref={ikoAudioRef} style={{display:"none"}}/>
        <div style={{position:"absolute",top:"20px",left:"50%",transform:"translateX(-50%)",color:"#8a8a8a",fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase"}}>
          {agenceFilter === "global" ? "Toutes agences" : agenceFilter}
        </div>
        <div style={{width:"220px",height:"220px",borderRadius:"50%",
          background:"radial-gradient(circle at 35% 30%, var(--iko-primary-pale), var(--iko-primary) 55%, var(--iko-primary-fonce) 100%)",
          boxShadow:"0 0 90px rgba(var(--iko-primary-rgb),0.45)",
          animation: amandineEcoute ? "ikoPulseRapide 1s ease-in-out infinite" : "ikoRespire 3.2s ease-in-out infinite"}}/>
        <div style={{marginTop:"32px",color:"#b8b8b8",fontSize:"14px",maxWidth:"320px",textAlign:"center",minHeight:"40px",lineHeight:"1.5"}}>
          {amandineEcoute ? "Je vous écoute... (relâchez le micro pour terminer)" : amandineEnCours ? "..." : amandineDernier ? amandineDernier : "Dites une commande à IKO : \"Filtre sur Agence 2\", \"Combien de tickets urgents ?\"..."}
        </div>
        {amandineErreur && <div style={{color:"var(--iko-erreur)",fontSize:"12px",marginTop:"10px"}}>{amandineErreur}</div>}

        <div style={{marginTop:"26px",width:"90%",maxWidth:"380px",display:"flex",gap:"8px"}}>
          <input id="ikoChampTexte" type="text" value={amandineTexte}
            onChange={e => setAmandineTexte(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && amandineTexte.trim()) { debloquerVoixIOS(); envoyerAmandine(amandineTexte.trim()); setAmandineTexte(""); } }}
            placeholder="Tapez ou dictez (🎤 sur le clavier)"
            style={{flex:1,padding:"12px 14px",borderRadius:"10px",background:"#1a1a1a",border:"1px solid rgba(var(--iko-primary-rgb),0.3)",color:"#fff",fontSize:"14px"}}/>
          <button onClick={() => { if (amandineTexte.trim()) { debloquerVoixIOS(); envoyerAmandine(amandineTexte.trim()); setAmandineTexte(""); } }}
            style={{padding:"12px 16px",borderRadius:"10px",background:"var(--iko-primary)",border:"none",color:"var(--iko-dark)",fontWeight:"800",cursor:"pointer"}}>
            →
          </button>
        </div>

        <div style={{position:"fixed",bottom:"36px",left:"36px"}}>
          <button
            onPointerDown={() => { debloquerVoixIOS(); lancerEcouteAmandine(); }}
            onPointerUp={arreterEcouteAmandine}
            onPointerLeave={arreterEcouteAmandine}
            onPointerCancel={arreterEcouteAmandine}
            style={{width:"64px",height:"64px",borderRadius:"50%",background:amandineEcoute?"var(--iko-erreur)":"var(--iko-primary)",border:"none",color:"var(--iko-dark)",cursor:"pointer",fontSize:"26px",boxShadow:"0 6px 24px rgba(var(--iko-primary-rgb),0.4)",touchAction:"none",userSelect:"none"}}>
            🎙️
          </button>
        </div>
        <div style={{position:"fixed",bottom:"36px",right:"36px"}}>
          <button onClick={() => setVueMode("tableau")}
            style={{padding:"16px 22px",borderRadius:"30px",background:"#1a1a1a",border:"1px solid rgba(var(--iko-primary-rgb),0.35)",color:"#fff",cursor:"pointer",fontSize:"13px",fontWeight:"700"}}>
            📊 Voir le tableau
          </button>
        </div>
        <style>{`
          @keyframes ikoRespire{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
          @keyframes ikoPulseRapide{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
        `}</style>
      </div>
    );
  }

  return (
    <div style={{minHeight:"100vh",background:C.bg}}>
      {showModalRdv && (
        <ModalRdv
          agenceAccess={agenceFilter !== "global" ? agenceFilter : agenceAccess}
          initialAgence={rdvPrefillAgence}
          onClose={() => { setShowModalRdv(false); setRdvPrefillAgence(null); }}
          onSuccess={(num) => { setShowModalRdv(false); setRdvPrefillAgence(null); setSuccessTicket(num); charger(); }}
        />
      )}
      {showModalFacturation && <ModalFacturation onClose={() => setShowModalFacturation(false)}/>}
      {showModalBlocage && (
        <ModalBlocage
          agenceAccess={agenceFilter !== "global" ? agenceFilter : agenceAccess}
          initialAgence={blocagePrefill?.agence}
          initialDateDebut={blocagePrefill?.dateDebut}
          initialDateFin={blocagePrefill?.dateFin}
          initialMotif={blocagePrefill?.motif}
          onClose={() => { setShowModalBlocage(false); setBlocagePrefill(null); }}
          onSuccess={(n) => { setShowModalBlocage(false); setBlocagePrefill(null); charger(); }}
        />
      )}
      {showModalConcepteur && (
        <ModalConcepteur
          onClose={() => setShowModalConcepteur(false)}
          onSuccess={() => { setShowModalConcepteur(false); forcerRender(x => x + 1); }}
        />
      )}
      {showModalAnalytics && (
        <ModalAnalyticsSAV
          tickets={tickets}
          onClose={() => setShowModalAnalytics(false)}
        />
      )}
      {showModalIntelligenceCommerciale && (
        <ModalIntelligenceCommerciale
          onClose={() => setShowModalIntelligenceCommerciale(false)}
        />
      )}
      {showModalDirigeant && (
        <ModalTableauBordDirigeant
          tickets={tickets}
          stats={stats}
          onClose={() => setShowModalDirigeant(false)}
          onOpenAnalytics={() => { setShowModalDirigeant(false); setShowModalAnalytics(true); }}
          onOpenIntelCom={() => { setShowModalDirigeant(false); setShowModalIntelligenceCommerciale(true); }}
          onOpenBlocage={() => { setShowModalDirigeant(false); setShowModalBlocage(true); }}
          onOpenFacturation={() => { setShowModalDirigeant(false); setShowModalFacturation(true); }}
        />
      )}
      {showModalGestionDevis && (
        <ModalGestionDevis
          tickets={tickets}
          onClose={() => setShowModalGestionDevis(false)}
          onRefresh={charger}
        />
      )}
      {showModalNotes && (
        <ModalNotes
          tickets={tickets}
          onClose={() => setShowModalNotes(false)}
        />
      )}
      {successTicket && <ModalSuccess ticket={successTicket} onClose={() => setSuccessTicket(null)} />}
      {modalAnnulation && (
        <ModalAnnulation
          ticket={modalAnnulation}
          motifInitial={annulationMotifPrefill}
          onClose={() => { setModalAnnulation(null); setAnnulationMotifPrefill(""); }}
          onConfirm={confirmerAnnulation}
        />
      )}
      {modalSuppression && (
        <ModalSuppression
          ticket={modalSuppression}
          onClose={() => setModalSuppression(null)}
          onConfirm={confirmerSuppression}
        />
      )}
      {modalSuppressionDefinitive && (
        <ModalSuppressionDefinitive
          ticket={modalSuppressionDefinitive}
          onClose={() => setModalSuppressionDefinitive(null)}
          onConfirm={confirmerSuppressionDefinitive}
        />
      )}
      {modalDevis && (
        <ModalDevis
          ticket={modalDevis}
          onClose={() => setModalDevis(null)}
          onSent={() => { setModalDevis(null); charger(); }}
        />
      )}
      <div style={{position:"fixed",top:"16px",right:"16px",zIndex:2000,display:"flex",flexDirection:"column",gap:"8px",maxWidth:"320px"}}>
        {notifs.map(n => (
          <div key={n.id} style={{background:C.card,border:"1px solid "+C.orBord,borderLeft:"4px solid "+C.or,borderRadius:"10px",padding:"12px 14px",boxShadow:"0 8px 24px rgba(0,0,0,0.12)",color:C.white,fontSize:"12px",fontWeight:"600"}}>
            {n.texte}
          </div>
        ))}
      </div>

      <div style={{background:C.card,borderBottom:"1px solid "+C.border,padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
          <div style={{width:"96px",height:"46px",background:"#FFFFFF",borderRadius:"8px",display:"flex",alignItems:"center",justifyContent:"center",padding:"3px",boxSizing:"border-box"}}>
            <img data-iko-logo src={CONFIG_ENTREPRISE.logoUrl || IKO_LOGO} alt="Iko" style={{width:"100%",height:"100%",objectFit:"contain"}}/>
          </div>
          <button title="Maintenir pour parler à IKO"
            onPointerDown={() => { debloquerVoixIOS(); setAmandineOuverte(true); lancerEcouteAmandine(); }}
            onPointerUp={arreterEcouteAmandine}
            onPointerLeave={arreterEcouteAmandine}
            onPointerCancel={arreterEcouteAmandine}
            style={{width:"40px",height:"40px",borderRadius:"50%",background:amandineEcoute?C.rouge:"radial-gradient(circle at 35% 30%, var(--iko-primary-pale), var(--iko-primary) 55%, var(--iko-primary-fonce) 100%)",border:"none",color:"var(--iko-dark)",cursor:"pointer",fontSize:"18px",boxShadow:"0 0 26px rgba(var(--iko-primary-rgb),0.4)",animation:amandineEcoute?"pulse 1.2s infinite":"none",touchAction:"none",userSelect:"none"}}>
            🎙️
          </button>
          <div>
            <div style={{fontSize:"13px",fontWeight:"700",color:C.muted}}>Dashboard SAV</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
          {lastRefresh && <span style={{fontSize:"10px",color:C.muted,display:"flex",alignItems:"center",gap:"4px"}}><span style={{width:"6px",height:"6px",background:"var(--iko-primary)",borderRadius:"50%",display:"inline-block"}}/>MAJ {lastRefresh}</span>}
          {stats.messagesNonLus > 0 && (
            <button onClick={() => { setMessagesOnly(!messagesOnly); setStatutFilter("tous"); setUrgentOnly(false); setRdvModifieOnly(false); }}
              className={messagesOnly ? "" : "alert-blink"}
              title="Tickets avec un message client non lu"
              style={{background:"var(--iko-erreur)",border:messagesOnly?"2px solid #fff":"none",boxShadow:messagesOnly?"0 0 0 2px var(--iko-erreur)":"none",color:"#fff",borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"900",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>
              🔴 Messages clients <span style={{background:"#fff",color:"var(--iko-erreur)",borderRadius:"10px",padding:"1px 7px",fontSize:"10px"}}>{stats.messagesNonLus}</span>
            </button>
          )}
          {stats.rdvModifies > 0 && (
            <button onClick={() => { setRdvModifieOnly(!rdvModifieOnly); setStatutFilter("tous"); setUrgentOnly(false); setMessagesOnly(false); }}
              className={rdvModifieOnly ? "" : "alert-blink"}
              title="Tickets avec un RDV modifié par le client ou le technicien"
              style={{background:C.bleu,border:rdvModifieOnly?"2px solid #fff":"none",boxShadow:rdvModifieOnly?"0 0 0 2px "+C.bleu:"none",color:"#fff",borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"900",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>
              🔄 RDV modifiés <span style={{background:"#fff",color:C.bleu,borderRadius:"10px",padding:"1px 7px",fontSize:"10px"}}>{stats.rdvModifies}</span>
            </button>
          )}
          <button onClick={() => setShowModalGestionDevis(true)}
            style={{background:C.or,border:"none",color:"var(--iko-dark)",borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"900",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>
            📋 Devis {stats.devisEnAttente > 0 && <span style={{background:"var(--iko-bg-sombre)",color:"#fff",borderRadius:"10px",padding:"1px 6px",fontSize:"10px"}}>{stats.devisEnAttente}</span>}
          </button>
          {/* TODO (plus tard, décision du patron) : mot de passe propre au bouton Central. */}
          {agenceAccess === "global" && (
          <button onClick={() => setShowModalDirigeant(true)} title="Réservé à la direction : analytics, intelligence commerciale, vue toutes agences"
            style={{background:"#fff",border:"1px solid "+C.border,color:"#111",borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"900",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>
            🧭 Central
          </button>
          )}
          <button onClick={() => setShowModalRdv(true)} style={{background:C.or,border:"none",color:"var(--iko-dark)",borderRadius:"8px",padding:"8px 16px",fontSize:"12px",fontWeight:"900",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>📞 + Nouveau RDV</button>
          {/* Concepteur / Pilotage / Métreur retirés du bandeau : accès centralisé uniquement via le Module Contrôle (admin.html). */}
          <button onClick={charger} style={{background:C.orDim,border:"1px solid "+C.orBord,color:C.or,borderRadius:"8px",padding:"6px 14px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>↺</button>
          <div style={{width:"1px",height:"24px",background:C.border,margin:"0 4px"}}/>
          <button onClick={onClose} title="Fermer la session" style={{background:"rgba(var(--iko-erreur-rgb),0.08)",border:"1px solid rgba(var(--iko-erreur-rgb),0.25)",color:"rgba(var(--iko-erreur-rgb),0.85)",borderRadius:"8px",width:"30px",height:"30px",cursor:"pointer",fontSize:"14px",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>✕</button>
        </div>
      </div>

      <div style={{padding:"24px",maxWidth:"1200px",margin:"0 auto"}}>
        <div style={{position:"sticky",top:"73px",zIndex:60,background:C.bg,paddingBottom:"14px",boxShadow:"0 8px 12px -8px rgba(0,0,0,0.08)"}}>
        {agenceAccess === "global" && (
          <div style={{display:"flex",gap:"8px",marginBottom:"20px",flexWrap:"wrap"}}>
            {(AGENCES.length > 1 ? ["global",...AGENCES] : []).map(a => (
              <button key={a} onClick={() => setAgenceFilter(a)}
                style={{padding:"7px 16px",borderRadius:"20px",border:"1px solid "+(agenceFilter===a?C.or:C.border),background:agenceFilter===a?C.or:"transparent",color:agenceFilter===a?"var(--iko-dark)":C.muted,fontSize:"12px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>
                {a==="global"?"🌐 Toutes agences":a}
                <span style={{background:"var(--iko-statut-info)",color:"#fff",borderRadius:"10px",padding:"1px 7px",fontSize:"10px",fontWeight:"900"}}>
                  {a==="global"?stats.total:byAgence[a]}
                </span>
              </button>
            ))}
          </div>
        )}

        {/* Bloc 5 : Suivi intelligent IKO — zone "À traiter", lecture seule,
            ne modifie jamais un ticket automatiquement. Un clic ouvre le
            ticket dans la liste principale (aucune action déclenchée ici). */}
        {ticketsATraiterIKO.length > 0 && (
          <div style={{background:"#fff",border:"2px solid "+C.rouge,borderRadius:"12px",marginBottom:"20px",overflow:"hidden"}}>
            <div onClick={() => setSuiviIKOOuvert(!suiviIKOOuvert)}
              style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",cursor:"pointer",background:C.rougeDim}}>
              <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                <span style={{fontSize:"13px",fontWeight:"900",color:C.rouge}}>🎯 À traiter</span>
                <span style={{background:C.rouge,color:"#fff",borderRadius:"10px",padding:"1px 8px",fontSize:"11px",fontWeight:"900"}}>{ticketsATraiterIKO.length}</span>
              </div>
              <span style={{fontSize:"12px",color:C.muted}}>{suiviIKOOuvert ? "▲ réduire" : "▼ afficher"}</span>
            </div>
            {suiviIKOOuvert && (
              <div style={{padding:"10px 16px 14px",display:"flex",flexDirection:"column",gap:"8px"}}>
                {ticketsATraiterIKO.map(({ t, info }) => (
                  <div key={t.id} onClick={() => allerAuTicketIKO(t.id, t.fields?.Statut)}
                    style={{display:"flex",alignItems:"flex-start",gap:"10px",padding:"8px 10px",borderRadius:"8px",border:"1px solid "+(info.priorite==="urgent"?"rgba(var(--iko-erreur-rgb),0.3)":C.border),background:info.priorite==="urgent"?C.rougeDim:"#F9FAFB",cursor:"pointer"}}>
                    <span style={{fontSize:"10px",fontWeight:"900",color:"#fff",background:info.priorite==="urgent"?C.rouge:C.jaune,borderRadius:"6px",padding:"2px 6px",flexShrink:0,marginTop:"1px"}}>
                      {info.priorite==="urgent"?"URGENT":"À TRAITER"}
                    </span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:"12px",fontWeight:"700",color:C.white}}>
                        {t.fields?.Name||"—"} · {t.fields?.Client||"Client inconnu"} <span style={{color:C.muted,fontWeight:"400"}}>({t.fields?.Agence||""})</span>
                      </div>
                      <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{info.raisons.join(" · ")}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Notifications intelligentes IKO V1 — lecture seule, purement
            déterministe, jamais d'action automatique. Distinct du bloc
            "🎯 À traiter" ci-dessus (détail ticket par ticket) : ici, des
            notifications agrégées/typées avec niveau et action suggérée,
            incluant les signaux prédictifs SAV (absents du bloc "À
            traiter"). */}
        <div style={{background:"#fff",border:"1px solid "+C.border,borderRadius:"12px",marginBottom:"20px",padding:"14px 16px"}}>
          <div onClick={() => setNotifOuvert(!notifOuvert)} style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:notifOuvert?"12px":0,cursor:"pointer"}}>
            <span style={{fontSize:"13px",fontWeight:"900",color:C.white}}>🔔 Notifications IKO</span>
            {notificationsIKO.length > 0 && (
              <span style={{background:C.or,color:"var(--iko-dark)",borderRadius:"10px",padding:"1px 8px",fontSize:"11px",fontWeight:"900"}}>{notificationsIKO.length}</span>
            )}
            <span style={{marginLeft:"auto",fontSize:"12px",color:C.muted}}>{notifOuvert ? "▲ réduire" : "▼ afficher"}</span>
          </div>
          {notifOuvert && notificationsIKO.length === 0 && (
            <div style={{fontSize:"12px",color:C.muted,fontStyle:"italic"}}>Aucune notification importante actuellement.</div>
          )}
          {notifOuvert && notificationsIKO.length > 0 && (
            <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
              {notificationsIKO.map((n, i) => (
                <div key={i} style={{border:"1px solid "+C.border,borderRadius:"8px",padding:"9px 12px",background:"#FAFAFA"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"8px",marginBottom:"3px"}}>
                    <span style={{fontSize:"12px",fontWeight:"700",color:C.white}}>{n.titre}</span>
                    <span style={{fontSize:"9px",fontWeight:"700",color:COULEURS_NIVEAU_NOTIF_IKO[n.niveau]||C.muted,whiteSpace:"nowrap"}}>
                      {LABELS_NIVEAU_NOTIF_IKO[n.niveau] || "Niveau faible"}
                    </span>
                  </div>
                  <div style={{fontSize:"11px",color:C.text}}>{n.information}</div>
                  {n.contexte && <div style={{fontSize:"10px",color:C.muted,marginTop:"2px"}}>Contexte : {n.contexte}</div>}
                  {n.action && <div style={{fontSize:"10px",color:"var(--iko-primary-fonce)",fontStyle:"italic",marginTop:"3px"}}>À vérifier : {n.action}</div>}
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={{display:"flex",gap:"10px",marginBottom:"12px",flexWrap:"wrap"}}>
          <StatCard label="Total tickets" value={stats.total} accent
            active={statutFilter==="tous" && !urgentOnly && !messagesOnly && !rdvModifieOnly}
            onClick={() => { setStatutFilter("tous"); setUrgentOnly(false); setMessagesOnly(false); setRdvModifieOnly(false); }}/>
          <StatCard label="À traiter" value={ticketsATraiterIKO.length} sub="urgent + signalé par IKO" alert
            active={suiviIKOOuvert && ticketsATraiterIKO.length > 0}
            onClick={() => { setSuiviIKOOuvert(true); window.scrollTo({ top: 0, behavior: "smooth" }); }}/>
          <StatCard label="Nouveaux" value={stats.nouveau}
            active={statutFilter==="Nouveau"}
            onClick={() => { setStatutFilter("Nouveau"); setUrgentOnly(false); setMessagesOnly(false); setRdvModifieOnly(false); }}/>
          <StatCard label="RDV modifiés" value={stats.rdvModifies} sub="changés par client/technicien"
            active={rdvModifieOnly}
            onClick={() => { setRdvModifieOnly(!rdvModifieOnly); setStatutFilter("tous"); setUrgentOnly(false); setMessagesOnly(false); }}/>
          <StatCard label="En cours" value={stats.encours}
            active={statutFilter==="En cours"}
            onClick={() => { setStatutFilter("En cours"); setUrgentOnly(false); setMessagesOnly(false); setRdvModifieOnly(false); }}/>
          <StatCard label="Terminés" value={stats.termine}
            active={statutFilter==="Terminé"}
            onClick={() => { setStatutFilter("Terminé"); setUrgentOnly(false); setMessagesOnly(false); setRdvModifieOnly(false); }}/>
          <StatCard label="Archives" value={stats.archives} sub="annulés + supprimés"
            active={statutFilter==="archives"}
            onClick={() => { setStatutFilter("archives"); setUrgentOnly(false); setMessagesOnly(false); setRdvModifieOnly(false); }}/>
          <StatCard label="Note client" value={stats.noteMoyenne ? "⭐ "+stats.noteMoyenne.toFixed(1) : "—"} sub={stats.nbNotes+" avis"} onClick={() => setShowModalNotes(true)}/>
        </div>

        <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center",background:C.card,border:"1px solid "+C.border,borderRadius:"12px",padding:"8px 12px",marginBottom:"8px",position:"relative"}}>
          <div style={{display:"flex",gap:"4px",background:"rgba(0,0,0,0.05)",borderRadius:"9px",padding:"3px"}}>
            {[["tickets","🎫 Tickets"],["planning","📅 Planning"]].map(([v,l]) => (
              <button key={v} onClick={() => setVue(v)}
                style={{padding:"6px 16px",borderRadius:"7px",border:"none",background:vue===v?C.or:"transparent",color:vue===v?"#fff":C.muted,fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>
                {l}
              </button>
            ))}
          </div>
          {vue === "tickets" && (
            <>
              <input placeholder="🔍 Rechercher (client, ticket, produit, adresse, tél...)" value={search} onChange={e => setSearch(e.target.value)} style={{flex:"1 1 240px",minWidth:"200px",maxWidth:"380px"}}/>
              <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
                {[["date","📅 Date"],["ticket","🔢 N° Ticket"]].map(([v,l]) => (
                  <button key={v} onClick={() => setSortBy(v)} title="Trier"
                    style={{padding:"6px 12px",borderRadius:"20px",border:"1px solid "+(sortBy===v?C.or:C.border),background:sortBy===v?C.orDim:"transparent",color:sortBy===v?C.or:C.muted,fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>
                    {l}
                  </button>
                ))}
                <button onClick={() => { setUrgentOnly(!urgentOnly); setStatutFilter("tous"); setMessagesOnly(false); setRdvModifieOnly(false); }} title="Afficher seulement les urgents"
                  style={{padding:"6px 12px",borderRadius:"20px",border:"1px solid "+(urgentOnly?"var(--iko-erreur)":C.border),background:urgentOnly?"var(--iko-erreur)":"transparent",color:urgentOnly?"#fff":C.muted,fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>
                  🔴 Urgents {stats.urgent}
                </button>
              </div>
              <span style={{fontSize:"11px",color:C.muted,marginLeft:"auto"}}>{sorted.length} ticket{sorted.length>1?"s":""}</span>
            </>
          )}
          <button onClick={() => setExportOuvert(v => !v)} style={{marginLeft:vue==="tickets"?0:"auto",padding:"7px 14px",borderRadius:"9px",border:"1px solid "+C.orBord,background:C.orDim,color:C.or,fontSize:"12px",fontWeight:"800",cursor:"pointer"}}>
            📤 Exporter {exportOuvert ? "▴" : "▾"}
          </button>
          {exportOuvert && (
            <div style={{position:"absolute",right:"12px",top:"calc(100% + 6px)",zIndex:80,background:"#FEFEFE",border:"1px solid "+C.border,borderRadius:"12px",padding:"14px",boxShadow:"0 14px 40px rgba(0,0,0,0.25)",display:"flex",flexDirection:"column",gap:"10px",minWidth:"340px"}}>
              <div style={{fontSize:"11px",color:C.muted}}>Respecte les filtres agence, statut et recherche.</div>
              <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
                <span style={{fontSize:"11px",color:C.muted}}>Du</span>
                <input type="date" value={exportDebut} onChange={e => setExportDebut(e.target.value)} style={{width:"140px"}}/>
                <span style={{fontSize:"11px",color:C.muted}}>au</span>
                <input type="date" value={exportFin} onChange={e => setExportFin(e.target.value)} style={{width:"140px"}}/>
              </div>
              <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
                <button onClick={exportExcel} style={{background:C.or,border:"none",color:"#fff",borderRadius:"8px",padding:"8px 16px",fontSize:"12px",fontWeight:"800",cursor:"pointer"}}>📊 Excel</button>
                <button onClick={exportPDF} style={{background:C.or,border:"none",color:"#fff",borderRadius:"8px",padding:"8px 16px",fontSize:"12px",fontWeight:"800",cursor:"pointer"}}>🖨️ PDF</button>
                {(exportDebut||exportFin) && (
                  <button onClick={() => { setExportDebut(""); setExportFin(""); }} style={{background:"none",border:"none",color:C.muted,fontSize:"11px",cursor:"pointer",textDecoration:"underline",marginLeft:"auto"}}>Effacer les dates</button>
                )}
              </div>
            </div>
          )}
        </div>
        </div>

        {vue === "tickets" && (
          <div style={{marginTop:"16px"}}>
            {loading && sorted.length===0 && <div style={{textAlign:"center",padding:"60px",color:C.muted}}>Chargement...</div>}
            {!loading && sorted.length===0 && (
              <div style={{textAlign:"center",padding:"60px",color:C.muted,border:"1px dashed "+C.border,borderRadius:"12px"}}>Aucun ticket trouvé</div>
            )}
            <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
              {sorted.map(t => <TicketRow key={t.id} t={t} onStatusChange={updateStatus} onAnnuler={setModalAnnulation} onSupprimer={setModalSuppression} onSupprimerDefinitivement={setModalSuppressionDefinitive} onRenvoyerMail={renvoyerMailTechnicien} onRenvoyerMailClient={renvoyerMailClient} onDevis={setModalDevis} onRepondreClient={repondreClient} onMarquerLu={marquerMessageLu} isMessagePanelOpen={openMessageTicketId===t.id} onToggleMessagePanel={() => setOpenMessageTicketId(prev => prev===t.id ? null : t.id)} onCloseMessagePanel={() => setOpenMessageTicketId(null)} onRefreshTicket={rafraichirTicketMessage}/>)}
            </div>
          </div>
        )}

        {vue === "planning" && <PlanningView agenceFilter={agenceFilter} onOpenTicket={ouvrirTicket}/>}
      </div>

      {/* Widget vocal IKO */}
      <audio ref={ikoAudioRef} style={{display:"none"}}/>
      <div style={{position:"fixed",top:"76px",left:"24px",zIndex:200,display:"flex",flexDirection:"column",alignItems:"flex-start",gap:"10px"}}>
        {amandineOuverte && (
          <div style={{width:"280px",background:C.card,border:"1px solid "+C.orBord,borderRadius:"14px",padding:"16px",boxShadow:"0 10px 40px rgba(0,0,0,0.35)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}><div style={{fontSize:"12px",fontWeight:"800",color:C.or,letterSpacing:"1px"}} data-iko-nom>IKO</div><button onClick={() => setAmandineOuverte(false)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:"14px"}}>✕</button></div>
            <div style={{fontSize:"12px",color:C.muted,minHeight:"36px"}}>
              {amandineEcoute ? "Je vous écoute... (relâchez le micro pour terminer)" : amandineEnCours ? "..." : amandineDernier ? amandineDernier : "Dites par exemple : \"Filtre sur Agence 2\" ou \"Passe le ticket SAV-2026-1552 en terminé\"."}
            </div>
            {amandineErreur && <div style={{fontSize:"11px",color:C.rouge,marginTop:"6px"}}>{amandineErreur}</div>}
            <div style={{display:"flex",gap:"6px",marginTop:"10px"}}>
              <input type="text" value={amandineTexte}
                onChange={e => setAmandineTexte(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter" && amandineTexte.trim()) { debloquerVoixIOS(); envoyerAmandine(amandineTexte.trim()); setAmandineTexte(""); } }}
                placeholder="Tapez ou dictez (🎤 clavier)"
                style={{flex:1,padding:"8px 10px",borderRadius:"8px",background:"#1a1a1a",border:"1px solid "+C.orBord,color:"#fff",fontSize:"12px"}}/>
              <button onClick={() => { if (amandineTexte.trim()) { debloquerVoixIOS(); envoyerAmandine(amandineTexte.trim()); setAmandineTexte(""); } }}
                style={{padding:"8px 12px",borderRadius:"8px",background:C.or,border:"none",color:"var(--iko-dark)",fontWeight:"800",cursor:"pointer"}}>→</button>
            </div>
          </div>
        )}
      </div>
      <style>{`@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
@keyframes clignoteUrgent{0%,100%{opacity:1;}50%{opacity:0.35;}}`}</style>

    </div>
  );
}

function Login({ onLogin }) {
  const [etat, setEtat] = React.useState("verification"); // verification | refuse
  React.useEffect(() => {
    window.IKO_CLIENT_READY.then(() => {
      if (window.IKO_ACCES_REFUSE) { setEtat("refuse"); return; }
      onLogin("global"); // SUPER_ADMIN_IKO et TENANT_ADMIN voient toutes les agences de leur perimetre
    });
  }, []);

  if (etat === "refuse") {
    return (
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
        <div style={{textAlign:"center",maxWidth:"320px"}}>
          <div style={{fontSize:"13px",color:C.rouge,marginBottom:"8px",fontWeight:"700"}}>Accès refusé</div>
          <div style={{fontSize:"12px",color:C.muted}}>Votre compte n'a pas les droits nécessaires pour accéder au Dashboard.</div>
        </div>
      </div>
    );
  }

  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
      <div style={{fontSize:"13px",color:C.muted}}>Vérification de la session…</div>
    </div>
  );
}

function BlocageAcces() {
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'14px',padding:'24px',textAlign:'center',background:'#0A0A0A',color:'var(--iko-bg-clair)',fontFamily:'-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif'}}>
      <div style={{fontSize:'40px'}}>🔒</div>
      <div style={{fontSize:'18px',fontWeight:700}}>Accès suspendu</div>
      <div style={{fontSize:'14px',opacity:0.75,maxWidth:'380px'}}>L'accès à cet espace est temporairement suspendu. Merci de contacter votre interlocuteur RSIA Conseil pour régulariser la situation.</div>
    </div>
  );
}

function App() {
  const [access, setAccess] = React.useState(null);
  const [bloque, setBloque] = React.useState(false);
  React.useEffect(() => {
    window.IKO_CLIENT_READY.then(() => {
      if (window.IKO_CLIENT_INFO && window.IKO_CLIENT_INFO["Accès bloqué"] === true) setBloque(true);
    });
  }, []);
  if (bloque) return <BlocageAcces/>;
  return access ? <Dashboard agenceAccess={access} onClose={() => setAccess(null)}/> : <Login onLogin={setAccess}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  // Enregistrement du service worker : rend la page installable
  // (icône écran d'accueil, plein écran) sur Android et iOS.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
