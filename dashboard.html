// empecher un acces direct a l'API sans passer par cette page (voir
// api/airtable-proxy.js pour le detail et les limites de cette protection).
(function() {
  var APP_SECRET = "97960bb3f41d75c71ba3e831a7acb90ab324549734e27d6a";
  var _fetch = window.fetch;
  window.fetch = function(url, opts) {
    if (typeof url === "string" && url.indexOf("/api/airtable") === 0) {
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers || {}, { "X-App-Secret": APP_SECRET });
    }
    return _fetch(url, opts);
  };
})();

// Contexte multi-client : lit ?client=slug dans l'URL (ou le slug memorise
// localement), va chercher sa fiche dans la table Clients, et expose son
// id/ses champs globalement. Si aucun ?client= n'est present, se comporte
// exactement comme avant (retro-compatible, aucune regression).
window.IKO_CLIENT_ID = null;
window.IKO_CLIENT_INFO = null;
window.IKO_CLIENT_READY = (async function () {
  try {
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('client');
    if (slug) { localStorage.setItem('iko_client_slug', slug); }
    else { slug = localStorage.getItem('iko_client_slug'); }
    if (!slug) return null;
    var formule = encodeURIComponent('{Slug}="' + slug + '"');
    var r = await fetch('/api/airtable/Clients?filterByFormula=' + formule + '&maxRecords=1', {});
    var json = await r.json();
    var rec = (json.records || [])[0];
    if (!rec) return null;
    window.IKO_CLIENT_ID = rec.id;
    window.IKO_CLIENT_INFO = rec.fields || {};
    return rec.id;
  } catch (e) { return null; }
})();
</script>

function hexVersRgba(hex, alpha) {
  const h = (hex || "#22C55E").replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function appliquerConfigEntreprise(cfg) {

// Combine une formule Airtable existante avec le filtre "appartient au
// client courant" (si un client est charge via ?client=slug). Retourne la
// formule brute (non encodee), a passer ensuite a encodeURIComponent.
//
// IMPORTANT : ARRAYJOIN() sur un champ lien renvoie le nom affiche (champ
// primaire) des enregistrements lies, jamais leur record ID — confirme en
// prod (requete 200 OK, 0 resultat avec un filtre par ID). Le filtre doit
// donc porter sur le NOM du client, pas sur window.IKO_CLIENT_ID.
function filtreAvecClient(baseFormula) {
  var nom = window.IKO_CLIENT_INFO && window.IKO_CLIENT_INFO["Nom client"];
  if (!nom) return baseFormula;
  var clause = 'FIND("' + String(nom).replace(/"/g, '\\"') + '", ARRAYJOIN({Compte client}))';
  if (!baseFormula) return clause;
  return 'AND(' + baseFormula + ',' + clause + ')';
}

// ---- TRI PAR DATE ----
const MOIS = {janvier:1,février:2,mars:3,avril:4,mai:5,juin:6,juillet:7,août:8,septembre:9,octobre:10,novembre:11,décembre:12};
const parseDateCreneau = (creneau) => {
  if (!creneau) return new Date(9999,0,1);
  const match = creneau.match(/(\d+)\s+(\w+)(?:\s+(\d{4}))?/g);
  if (!match) return new Date(9999,0,1);
  const last = match[match.length-1];
  const parts = last.match(/(\d+)\s+(\w+)(?:\s+(\d{4}))?/);
  if (!parts) return new Date(9999,0,1);
  const day = parseInt(parts[1]);
  const month = MOIS[parts[2].toLowerCase()] || 1;
  const year = parts[3] ? parseInt(parts[3]) : new Date().getFullYear();
  return new Date(year, month-1, day);
};

function parseMessageEntries(raw, sender) {
  if (!raw) return [];
  const parts = raw.split(/\n\n(?=\[\d{2}\/\d{2}\/\d{4} \d{2}:\d{2}\])/);
  return parts.map(part => {
    const m = part.match(/^\[(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})\]\n([\s\S]*)$/);
    if (!m) return { sender, dateLabel: '', text: part.trim(), sortKey: 0 };
    const [, dd, mm, yyyy, hh, min, text] = m;
    const sortKey = new Date(+yyyy, +mm - 1, +dd, +hh, +min).getTime();
    return { sender, dateLabel: dd + '/' + mm + ' ' + hh + ':' + min, text: text.trim(), sortKey };
  });
}

}

function PhoneChatModal({ clientName, entries, texteReponse, onChangeTexte, onEnvoyer, envoiReponse, nonLu, onMarquerLu, onClose }) {

  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [entries.length]);

  // Fenêtre déplaçable : on suit le pointeur depuis la barre d'en-tête
  // (comme une fenêtre d'app de bureau) et on applique le décalage en plus
  // du centrage initial via un translate() additif.
  const [pos, setPos] = React.useState({ x: 0, y: 0 });
  const [dragging, setDragging] = React.useState(false);
  const dragRef = React.useRef(null);
  const onDragStart = (e) => {
    dragRef.current = { startX: e.clientX, startY: e.clientY, origX: pos.x, origY: pos.y };
    setDragging(true);
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onDragMove = (e) => {
    if (!dragRef.current) return;
    setPos({ x: dragRef.current.origX + (e.clientX - dragRef.current.startX), y: dragRef.current.origY + (e.clientY - dragRef.current.startY) });
  };
  const onDragEnd = () => { dragRef.current = null; setDragging(false); };

    <div style={{position:"fixed",inset:0,zIndex:3000,background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}

            </div>
            <div style={{color:"rgba(255,255,255,0.35)",fontSize:"14px",letterSpacing:"1px",flexShrink:0}} title="Glisser pour déplacer">⠿⠿</div>
          </div>
          <div ref={scrollRef} style={{flex:1,overflowY:"auto",padding:"14px 12px",display:"flex",flexDirection:"column",gap:"8px"}}>

            )}

              </div>

          {nonLu && (

function ModalRdv({ agenceAccess, onClose, onSuccess, initialAgence }) {
  const today = new Date().toISOString().split('T')[0];
  const [form, setForm] = React.useState({
    agence: agenceAccess !== "global" ? agenceAccess : (initialAgence || AGENCES[0]),

    date: today, creneau: "Matin (8h30 — 12h00)",
    garantie: false, facture: "", notes: ""
  });
  const [saving, setSaving] = React.useState(false);
  const [error, setError] = React.useState("");

  const set = (k, v) => setForm(prev => ({...prev, [k]: v}));

  const handleProduit = (p) => {
    set("produit", p);
    set("probleme", PROBLEMES[p]?.[0]?.l || "Autre");

  const sauvegarder = async () => {
    if (!form.nom.trim() || !form.tel.trim() || !form.date) {
      setError("Nom, téléphone et date sont obligatoires."); return;
    }
    if (form.adresse.trim() && (!form.codePostal.trim() || !/^\d{5}$/.test(form.codePostal.trim()) || !form.ville.trim())) {
      setError("Code postal (5 chiffres) et ville sont obligatoires si une adresse est renseignée."); return;
    }
    setSaving(true); setError("");
    try {
      await window.IKO_CLIENT_READY;
      const emailFinal = form.sansEmail ? "" : form.email;
      const adresseComplete = form.adresse.trim() + (form.codePostal || form.ville ? ', ' + form.codePostal + ' ' + form.ville : '');
      const num = 'SAV-' + new Date().getFullYear() + '-' + (Math.floor(Math.random()*9000)+1000);
      const dateLabel = form.creneau === "Matin (8h30 — 12h00)" ? "Matin (8h30 — 12h00)" : "Après-midi (13h00 — 17h00)";
      const filterPlanning = encodeURIComponent(filtreAvecClient('AND({Agence}="'+AGENCE_VERS_AIRTABLE[form.agence]+'",{Créneau}="'+dateLabel+'",{Date}="'+form.date+'",{Statut}="Libre")'));
      const planResp = await fetch('/api/airtable/Planning?filterByFormula=' + filterPlanning + '&maxRecords=1', {});
      const planJson = await planResp.json();
      let planningId = '';
      if (planJson.records?.length > 0) {
        planningId = planJson.records[0].id;
        await fetch('/api/airtable/Planning/' + planningId, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: { Statut: 'Pris' } })
        });
      }
      const urgentTexte = isUrgentProbleme(form.produit, form.probleme) ? "Oui" : "Non";
      const garantieTexte = form.garantie ? "Oui - Facture " + (form.facture || "") : "Non / Hors garantie";
      await fetch(WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          marque: 'iko',
          ticket: num, agence: AGENCE_VERS_AIRTABLE[form.agence] || form.agence, nom: form.nom, tel: form.tel,
          "e-mail": emailFinal || "aucun@rsia.fr",
          adresse: adresseComplete, produit: form.produit, probleme: form.probleme,
          creneau: dateLabel + ' — ' + new Date(form.date + 'T12:00:00').toLocaleDateString('fr-FR', {weekday:'long',day:'numeric',month:'long'}),
          garantie: garantieTexte, facture: form.facture, urgent: urgentTexte, photos: '', planningId
        })
      });
      try {
        await fetch('/api/airtable/push', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'send', agence: AGENCE_VERS_AIRTABLE[form.agence] || form.agence,
            title: '📞 Nouveau RDV — ' + num,
            body: form.nom + ' — ' + form.produit + ' — ' + dateLabel,
          })
        });
      } catch (pushErr) { /* non bloquant */ }
      onSuccess(num);
    } catch(e) {
      setError("Erreur lors de l'enregistrement. Vérifiez la connexion.");
    }
    setSaving(false);
  };

  const labelStyle = { fontSize:"11px", fontWeight:"700", color:C.muted, display:"block", marginBottom:"4px" };
  const groupStyle = { marginBottom:"14px" };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}}>
          <div>
            <div style={{fontSize:"16px",fontWeight:"900",color:C.white}}>📞 Nouveau RDV téléphone</div>
            <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>Prise de rendez-vous manuelle</div>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.05)",border:"1px solid "+C.border,color:C.muted,borderRadius:"8px",width:"30px",height:"30px",cursor:"pointer",fontSize:"16px"}}>✕</button>
        </div>
        <div style={groupStyle}>
          <label style={labelStyle}>Agence *</label>
          <select value={form.agence} onChange={e => set("agence", e.target.value)} disabled={agenceAccess !== "global"}>
            {AGENCES.map(a => <option key={a}>{a}</option>)}
          </select>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}}>
          <div><label style={labelStyle}>Nom et prénom *</label><input placeholder="Jean Dupont" value={form.nom} onChange={e => set("nom",e.target.value)}/></div>
          <div><label style={labelStyle}>Téléphone *</label><input placeholder="06 12 34 56 78" value={form.tel} onChange={e => set("tel",e.target.value)}/></div>
        </div>
        <div style={{marginBottom:"10px",display:"flex",alignItems:"center",gap:"8px"}}>
          <input type="checkbox" id="sansEmail" checked={form.sansEmail} onChange={e => set("sansEmail", e.target.checked)} style={{width:"16px",height:"16px",cursor:"pointer"}}/>
          <label htmlFor="sansEmail" style={{fontSize:"12px",color:C.muted,cursor:"pointer"}}>Client sans email / internet (RDV téléphone uniquement)</label>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}}>
          <div>
            <label style={labelStyle}>Email</label>
            {form.sansEmail
              ? <div style={{fontSize:"12px",color:C.muted,padding:"10px 0"}}>— Aucun email (le ticket sera confirmé par téléphone) —</div>
              : <input placeholder="jean@gmail.com" value={form.email} onChange={e => set("email",e.target.value)}/>
            }
          </div>
          <div><label style={labelStyle}>Adresse (n° et rue) *</label><input placeholder="12 rue des Lilas" value={form.adresse} onChange={e => set("adresse",e.target.value)}/></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:"10px",marginBottom:"14px"}}>
          <div><label style={labelStyle}>Code postal *</label><input placeholder="75000" inputMode="numeric" maxLength={5} value={form.codePostal} onChange={e => set("codePostal",e.target.value.replace(/\D/g,''))}/></div>
          <div><label style={labelStyle}>Ville *</label><input placeholder="Tarbes" value={form.ville} onChange={e => set("ville",e.target.value)}/></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}}>
          <div>
            <label style={labelStyle}>Produit *</label>
            <select value={form.produit} onChange={e => handleProduit(e.target.value)}>{PRODUITS.map(p => <option key={p}>{p}</option>)}</select>
          </div>
          <div>
            <label style={labelStyle}>Problème *</label>
            <select value={form.probleme} onChange={e => set("probleme",e.target.value)}>{(PROBLEMES[form.produit]||[{l:"Autre"}]).map(p => <option key={p.l} value={p.l}>{p.l}{p.u?" ⚠️":""}</option>)}</select>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}}>
          <div><label style={labelStyle}>Date d'intervention *</label><input type="date" value={form.date} min={today} onChange={e => set("date",e.target.value)}/></div>
          <div>
            <label style={labelStyle}>Créneau *</label>
            <select value={form.creneau} onChange={e => set("creneau",e.target.value)}>
              <option value="Matin (8h30 — 12h00)">🌅 Matin (8h30 — 12h00)</option>
              <option value="Après-midi (13h00 — 17h00)">🌇 Après-midi (13h00 — 17h00)</option>
            </select>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px",background:"#F3F4F6",borderRadius:"8px",padding:"10px 14px"}}>

          <label htmlFor="garantie" style={{fontSize:"12px",color:C.text,cursor:"pointer"}}>Produit sous garantie</label>
          {form.garantie && <input placeholder="N° facture" value={form.facture} onChange={e => set("facture",e.target.value)} style={{flex:1,marginLeft:"8px"}}/>}
        </div>
        {error && <div style={{background:C.rougeDim,border:"1px solid rgba(220,38,38,0.3)",borderRadius:"8px",padding:"8px 12px",fontSize:"11px",color:C.rouge,marginBottom:"14px"}}>{error}</div>}
        <div style={{display:"flex",gap:"10px"}}>
          <button onClick={onClose} style={{flex:1,padding:"11px",background:"transparent",color:C.muted,border:"1px solid "+C.border,borderRadius:"10px",fontSize:"12px",cursor:"pointer"}}>Annuler</button>
          <button onClick={sauvegarder} disabled={saving} style={{flex:2,padding:"11px",background:saving?"#D1D5DB":C.or,color:saving?C.muted:"#111",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:saving?"not-allowed":"pointer"}}>
            {saving ? "⏳ Enregistrement..." : "✅ Confirmer le RDV"}
          </button>
        </div>
      </div>
    </div>
  );
}

const MOTIFS_BLOCAGE = ["Congé", "Congé payé", "Maladie", "Autre"];

// ---- MODAL BLOCAGE DATES (congés / absences techniciens par agence) ----
function ModalBlocage({ agenceAccess, onClose, onSuccess, initialAgence, initialDateDebut, initialDateFin, initialMotif }) {
  const today = new Date().toISOString().split('T')[0];
  const [agence, setAgence] = React.useState(agenceAccess !== "global" ? agenceAccess : (initialAgence || AGENCES[0]));
  const [dateDebut, setDateDebut] = React.useState(initialDateDebut || today);
  const [dateFin, setDateFin] = React.useState(initialDateFin || today);
  const [motif, setMotif] = React.useState(initialMotif || MOTIFS_BLOCAGE[0]);
  const [saving, setSaving] = React.useState(false);
  const [error, setError] = React.useState("");

  const labelStyle = { fontSize:"11px", fontWeight:"700", color:C.muted, display:"block", marginBottom:"4px" };
  const groupStyle = { marginBottom:"14px" };
  const inputStyle = { width:"100%", padding:"9px 11px", border:"1px solid "+C.border, borderRadius:"8px", fontSize:"13px", boxSizing:"border-box" };

  const bloquer = async () => {
    if (dateFin < dateDebut) { setError("La date de fin doit être après la date de début."); return; }
    setSaving(true); setError("");
    try {
      await window.IKO_CLIENT_READY;
      const agenceReelle = AGENCE_VERS_AIRTABLE[agence] || agence;
      // Le champ Date est du texte au format AAAA-MM-JJ : la comparaison
      // lexicographique >= / <= fonctionne car le format est trié naturellement.
      const formule = filtreAvecClient('AND({Agence}="'+agenceReelle+'",{Date}>="'+dateDebut+'",{Date}<="'+dateFin+'",{Statut}="Libre")');
      const r = await fetch('/api/airtable/Planning?filterByFormula=' + encodeURIComponent(formule) + '&maxRecords=500');
      const json = await r.json();
      const creneaux = json.records || [];
      if (creneaux.length === 0) {
        setError("Aucun créneau libre à bloquer sur cette période (déjà pris, déjà bloqué, ou hors planning existant).");
        setSaving(false); return;
      }
      // Les week-ends ne sont jamais générés dans le Planning : rien à bloquer
      // en plus pour eux, ils sont déjà absents des créneaux disponibles.
      for (const c of creneaux) {
        await fetch('/api/airtable/Planning/' + c.id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: { Statut: 'Bloqué - ' + motif } })
        });
      }
      onSuccess(creneaux.length);
    } catch(e) {
      setError("Erreur lors du blocage. Vérifiez la connexion.");
    }
    setSaving(false);
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}}>
          <div style={{fontSize:"16px",fontWeight:"900",color:C.white}}>🔒 Bloquer des dates</div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:"18px",cursor:"pointer",color:C.muted}}>✕</button>
        </div>

        <div style={groupStyle}>
          <label style={labelStyle}>Agence</label>
          <select value={agence} onChange={e => setAgence(e.target.value)} disabled={agenceAccess !== "global"} style={inputStyle}>
            {AGENCES.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
        </div>

        <div style={{display:"flex",gap:"10px"}}>
          <div style={{...groupStyle, flex:1}}>
            <label style={labelStyle}>Du</label>
            <input type="date" value={dateDebut} onChange={e => setDateDebut(e.target.value)} style={inputStyle}/>
          </div>
          <div style={{...groupStyle, flex:1}}>
            <label style={labelStyle}>Au</label>
            <input type="date" value={dateFin} onChange={e => setDateFin(e.target.value)} style={inputStyle}/>
          </div>
        </div>

        <div style={groupStyle}>
          <label style={labelStyle}>Motif</label>
          <select value={motif} onChange={e => setMotif(e.target.value)} style={inputStyle}>
            {MOTIFS_BLOCAGE.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        </div>

        <div style={{fontSize:"11px",color:C.muted,marginBottom:"14px"}}>
          Bloque tous les créneaux "Libre" de cette agence sur la période choisie. Les week-ends ne sont jamais dans le planning, rien à faire pour eux. Un créneau déjà pris par un client n'est jamais touché.
        </div>

        {error && <div style={{background:"#FEF2F2",color:"#DC2626",padding:"9px 12px",borderRadius:"8px",fontSize:"12px",marginBottom:"14px"}}>{error}</div>}

        <div style={{display:"flex",gap:"10px"}}>
          <button onClick={onClose} style={{flex:1,padding:"11px",background:"transparent",color:C.muted,border:"1px solid "+C.border,borderRadius:"10px",fontSize:"12px",cursor:"pointer"}}>Annuler</button>
          <button onClick={bloquer} disabled={saving} style={{flex:2,padding:"11px",background:saving?"#D1D5DB":C.or,color:saving?C.muted:"#111",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:saving?"not-allowed":"pointer"}}>
            {saving ? "⏳ Blocage..." : "🔒 Bloquer les créneaux"}
          </button>
        </div>
      </div>
    </div>
  );
}

function ModalConcepteur({ onClose, onSuccess }) {
  const [nombre, setNombre] = React.useState(AGENCES.length);
  const [emails, setEmails] = React.useState({...CONFIG_ENTREPRISE.emailsTechnicien});
  const [couleur, setCouleur] = React.useState(CONFIG_ENTREPRISE.couleurAccent);
  const [logoUrl, setLogoUrl] = React.useState(CONFIG_ENTREPRISE.logoUrl);
  const [techniciens, setTechniciens] = React.useState({...CONFIG_ENTREPRISE.techniciens});
  const [saving, setSaving] = React.useState(false);
  const [error, setError] = React.useState("");
  const [agenceOuverte, setAgenceOuverte] = React.useState(0);

  const setEmail = (agence, val) => setEmails(prev => ({...prev, [agence]: val}));
  const setTech = (agence, champ, val) => setTechniciens(prev => ({...prev, [agence]: {...(prev[agence]||{}), [champ]: val}}));
  const inputStyle = { width:"100%", padding:"9px 11px", border:"1px solid "+C.border, borderRadius:"8px", fontSize:"13px", boxSizing:"border-box" };
  const labelStyle = { fontSize:"11px", fontWeight:"700", color:C.muted, display:"block", marginBottom:"4px" };

  const enregistrer = async () => {
    setSaving(true); setError("");
    try {
      const agencesResultantes = Array.from({length:nombre}, (_,i) => "Agence "+(i+1));
      const emailsUtiles = {};
      agencesResultantes.forEach(a => { if (emails[a]) emailsUtiles[a] = emails[a]; });
      const cfg = { emailsTechnicien: emailsUtiles, couleurAccent: couleur, logoUrl: logoUrl.trim(), techniciens };

      if (window.IKO_CLIENT_ID) {
        // Un client precis est charge (?client=slug) : ses reglages
        // s'enregistrent sur SA PROPRE fiche (table Clients), jamais sur
        // la config globale partagee - sinon un client modifierait
        // l'identite visuelle de tous les autres clients.
        const fieldsClient = { "Couleur principale": couleur };
        if (logoUrl.trim()) fieldsClient["Logo"] = [{ url: logoUrl.trim() }];
        await fetch('/api/airtable/Clients/' + window.IKO_CLIENT_ID, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: fieldsClient })
        });
      } else {
        // Pas de client charge (usage demo historique) : comportement
        // inchange, ecriture sur la config globale.
        await fetch('/api/airtable/Planning/' + CONFIG_RECORD_ID, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: { "Nombre agences": nombre, "Config JSON": JSON.stringify(cfg) } })
        });
      }
      appliquerNombreAgences(nombre);
      appliquerConfigEntreprise(cfg);
      onSuccess();
    } catch(e) {
      setError("Erreur lors de l'enregistrement. Vérifiez la connexion.");
    }
    setSaving(false);
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box" style={{maxHeight:"85vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}}>
          <div style={{fontSize:"16px",fontWeight:"900",color:C.white}}>⚙️ Mode concepteur</div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:"18px",cursor:"pointer",color:C.muted}}>✕</button>
        </div>
        <div style={{fontSize:"11px",color:C.muted,marginBottom:"16px"}}>
          Paramétrage libre pour l'entreprise cliente : nombre d'agences, couleur de marque, logo, et email technicien par agence (destinataire des notifications SAV).
        </div>

        <div style={{marginBottom:"16px"}}>
          <label style={labelStyle}>Nombre d'agences actives</label>
          <input type="number" min="1" max="10" value={nombre}
            onChange={e => setNombre(Math.max(1, Math.min(10, parseInt(e.target.value) || 1)))}
            style={inputStyle}/>
        </div>

        <div style={{display:"flex",gap:"10px",marginBottom:"16px"}}>
          <div style={{flex:1}}>
            <label style={labelStyle}>Couleur de marque</label>
            <input type="color" value={couleur} onChange={e => setCouleur(e.target.value)} style={{width:"100%",height:"38px",border:"1px solid "+C.border,borderRadius:"8px",padding:"2px",boxSizing:"border-box"}}/>
          </div>
          <div style={{flex:2}}>
            <label style={labelStyle}>URL du logo</label>
            <input type="text" value={logoUrl} onChange={e => setLogoUrl(e.target.value)} placeholder="https://…/logo.png" style={inputStyle}/>
          </div>
        </div>

        <div style={{fontSize:"12px",fontWeight:"800",color:C.white,marginTop:"4px",marginBottom:"4px"}}>Configuration par agence</div>
        <div style={{fontSize:"10px",color:C.muted,margin:"0 0 10px"}}>
          Un email et/ou un compte technicien non renseigné garde le comportement historique par défaut pour cette agence.
        </div>
        {Array.from({length:nombre}, (_,i) => "Agence "+(i+1)).map((a, i) => {
          const ouverte = agenceOuverte === i;
          const t = techniciens[a] || {};
          const emailRempli = !!(emails[a] || "").trim();
          const compteRempli = !!((t.prenom||"").trim() || (t.nom||"").trim() || (t.motDePasse||"").trim());
          return (
            <div key={a} style={{border:"1px solid "+C.border,borderRadius:"10px",marginBottom:"8px",overflow:"hidden"}}>
              <button type="button" onClick={() => setAgenceOuverte(ouverte ? -1 : i)}
                style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 13px",background:ouverte?C.orDim:"#FAFAFA",border:"none",cursor:"pointer",textAlign:"left"}}>
                <span style={{display:"flex",alignItems:"center",gap:"8px"}}>
                  <span style={{fontSize:"12px",fontWeight:"800",color:C.white}}>{a}</span>
                  <span title={emailRempli ? "Email renseigné" : "Email non renseigné"} style={{width:"6px",height:"6px",borderRadius:"50%",background:emailRempli?C.vert:C.border,display:"inline-block"}}/>
                  <span title={compteRempli ? "Compte technicien renseigné" : "Compte technicien non renseigné"} style={{width:"6px",height:"6px",borderRadius:"50%",background:compteRempli?C.vert:C.border,display:"inline-block"}}/>
                </span>
                <span style={{fontSize:"11px",color:C.muted,transform:ouverte?"rotate(90deg)":"none",transition:"transform 0.15s"}}>▸</span>
              </button>
              {ouverte && (
                <div style={{padding:"12px 13px",borderTop:"1px solid "+C.border}}>
                  <label style={labelStyle}>Email technicien (notifications SAV)</label>
                  <input type="email" value={emails[a] || ""} onChange={e => setEmail(a, e.target.value)} placeholder={a + " — email@exemple.fr"} style={{...inputStyle,marginBottom:"12px"}}/>

                  <label style={labelStyle}>Compte technicien (accès à technicien.html)</label>
                  <div style={{display:"flex",gap:"8px",marginBottom:"6px"}}>
                    <input type="text" value={t.prenom || ""} onChange={e => setTech(a, "prenom", e.target.value)} placeholder="Prénom" style={{...inputStyle,flex:1}}/>
                    <input type="text" value={t.nom || ""} onChange={e => setTech(a, "nom", e.target.value)} placeholder="Nom" style={{...inputStyle,flex:1}}/>
                  </div>
                  <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
                    <input type="text" value={t.motDePasse || ""} onChange={e => setTech(a, "motDePasse", e.target.value)} placeholder="Mot de passe d'accès" style={{...inputStyle,flex:1}}/>
                    <label style={{display:"flex",alignItems:"center",gap:"5px",fontSize:"11px",color:C.muted,whiteSpace:"nowrap"}}>
                      <input type="checkbox" checked={!!t.bloque} onChange={e => setTech(a, "bloque", e.target.checked)}/>
                      Bloqué
                    </label>
                    <button type="button" onClick={() => setTechniciens(prev => { const cp = {...prev}; delete cp[a]; return cp; })}
                      title="Supprimer ce compte technicien" style={{background:"none",border:"none",color:C.rouge,cursor:"pointer",fontSize:"14px"}}>🗑️</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}

        {error && <div style={{background:"#FEF2F2",color:"#DC2626",padding:"9px 12px",borderRadius:"8px",fontSize:"12px",marginBottom:"14px"}}>{error}</div>}
        <div style={{display:"flex",gap:"10px"}}>
          <button onClick={onClose} style={{flex:1,padding:"11px",background:"transparent",color:C.muted,border:"1px solid "+C.border,borderRadius:"10px",fontSize:"12px",cursor:"pointer"}}>Annuler</button>
          <button onClick={enregistrer} disabled={saving} style={{flex:2,padding:"11px",background:saving?"#D1D5DB":C.or,color:saving?C.muted:"#111",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:saving?"not-allowed":"pointer"}}>
            {saving ? "⏳ Enregistrement..." : "✅ Enregistrer"}
          </button>
        </div>
      </div>
    </div>
  );
}

function ModalSuccess({ ticket, onClose }) {

        <div style={{fontSize:"48px",marginBottom:"16px"}}>✅</div>
        <div style={{fontSize:"18px",fontWeight:"900",color:C.white,marginBottom:"8px"}}>RDV enregistré !</div>
        <div style={{background:C.card,border:"1px solid "+C.orBord,borderRadius:"12px",padding:"16px",margin:"16px 0"}}>
          <div style={{fontSize:"10px",color:C.muted,marginBottom:"6px",letterSpacing:"2px"}}>NUMÉRO DE TICKET</div>

        </div>
        <div style={{fontSize:"11px",color:C.muted,marginBottom:"20px"}}>Créneau bloqué · Notification agence envoyée</div>

}

async function chargerCatalogueDevis(clientNom) {
  // ARRAYJOIN() sur un lien renvoie le nom affiche, jamais l'ID (confirme en prod).
  const nomEchappe = String(clientNom).replace(/"/g, '\\"');
  const formule = 'FIND("' + nomEchappe + '", ARRAYJOIN({Client}))';
  const [rProd, rMo, rMep] = await Promise.all([
    fetch('/api/airtable/Catalogue%20Produits?filterByFormula=' + encodeURIComponent(formule)),
    fetch('/api/airtable/Grille%20Main%20d%27%C5%93uvre?filterByFormula=' + encodeURIComponent(formule)),
    fetch('/api/airtable/Mise%20en%20page%20Devis?filterByFormula=' + encodeURIComponent(formule)),
  ]);
  const [jProd, jMo, jMep] = await Promise.all([rProd.json(), rMo.json(), rMep.json()]);
  const mepRec = (jMep.records || [])[0];
  let identite = {}, assurance = {}, marges = {}, elementsGraphiques = [];
  try { identite = JSON.parse(mepRec?.fields?.["Identité entreprise (JSON)"] || "{}"); } catch(e){}
  try { assurance = JSON.parse(mepRec?.fields?.["Assurance décennale (JSON)"] || "{}"); } catch(e){}
  try { marges = JSON.parse(mepRec?.fields?.["Marges"] || "{}"); } catch(e){}
  try {
    const els = JSON.parse(mepRec?.fields?.["Éléments graphiques (JSON)"] || "[]");
    if (Array.isArray(els)) elementsGraphiques = els;
  } catch(e){}
  return {
    produits: jProd.records || [],
    mo: jMo.records || [],
    mep: {
      couleur: mepRec?.fields?.["Couleur primaire"] || "#22C55E",
      piedPage: mepRec?.fields?.["Texte pied de page"] || "",
      dureeValidite: mepRec?.fields?.["Durée validité devis (jours)"] || 30,
      logoUrl: (mepRec?.fields?.["Logo"]?.[0]?.url) || identite.logoUrl || "",
      logoX: identite.logoX != null ? identite.logoX : 18,
      logoY: identite.logoY != null ? identite.logoY : 14,

      margeHaut: marges.haut != null ? marges.haut : 20,
      margeBas: marges.bas != null ? marges.bas : 20,

      margeDroite: marges.droite != null ? marges.droite : 18,
      identite, assurance, elements: elementsGraphiques,
    }
  };
}

/* ---- Génération PDF itemisée (logo, catalogue, mentions légales) ---- */
async function chargerImageEnDataUrl(url) {
  if (!url) return null;
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    const dataUrl = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
    if (!dataUrl) return null;
    const ratio = await new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : null);
      img.onerror = () => resolve(null);
      img.src = dataUrl;
    });
    return { url: dataUrl, ratio };
  } catch(e) { return null; }
}

function rendrePiedPageRiche(html) {
  if (!html) return null;
  const gras = /<(b|strong)[ >]/i.test(html);
  const italique = /<(i|em)[ >]/i.test(html);
  let align = 'center';
  if (/text-align:\s*right/i.test(html)) align = 'right';
  else if (/text-align:\s*left/i.test(html)) align = 'left';
  const texte = html.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/gi, ' ').replace(/\s+/g, ' ').trim();
  if (!texte) return null;
  return { texte, gras, italique, align };
}

/* ---- Éléments graphiques du configurateur (formes/traits/images) — identique à l'aperçu admin.html ---- */
function hexVersRgb(hex, secours) {
  hex = String(hex || secours || '#111111').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex, 16);
  if (isNaN(num)) return [17, 17, 17];
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
}

async function dessinerElementsGraphiques(doc, elements) {
  if (!Array.isArray(elements) || !elements.length) return;
  const tries = elements.filter(el => el && el.visible !== false).sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));
  for (const el of tries) {
    try {
      if (el.type === 'rect' || el.type === 'circle') {
        const [dr, dg, db] = hexVersRgb(el.stroke);
        doc.setDrawColor(dr, dg, db);
        doc.setLineWidth(el.strokeWidth != null ? el.strokeWidth : 1);
        const aRemplir = el.fill && el.fill !== 'none';
        if (aRemplir) { const [fr, fg, fb] = hexVersRgb(el.fill); doc.setFillColor(fr, fg, fb); }
        const style = aRemplir ? 'FD' : 'S';
        if (el.type === 'rect') {
          doc.rect(el.x, el.y, el.w, el.h, style);
        } else {
          doc.ellipse(el.x + el.w / 2, el.y + el.h / 2, el.w / 2, el.h / 2, style);
        }
      } else if (el.type === 'line') {
        const [dr, dg, db] = hexVersRgb(el.stroke);
        doc.setDrawColor(dr, dg, db);
        doc.setLineWidth(el.strokeWidth != null ? el.strokeWidth : 2);
        doc.line(el.x1, el.y1, el.x2, el.y2);
        if (el.arrowEnd) {
          const angle = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
          const taille = 3;
          const p1x = el.x2 - taille * Math.cos(angle - Math.PI / 7), p1y = el.y2 - taille * Math.sin(angle - Math.PI / 7);
          const p2x = el.x2 - taille * Math.cos(angle + Math.PI / 7), p2y = el.y2 - taille * Math.sin(angle + Math.PI / 7);
          doc.setFillColor(dr, dg, db);
          doc.triangle(el.x2, el.y2, p1x, p1y, p2x, p2y, 'F');
        }
      } else if (el.type === 'image' && el.url) {
        const info = await chargerImageEnDataUrl(el.url);
        if (info && info.url) {
          try { doc.addImage(info.url, 'JPEG', el.x, el.y, el.w, el.h, undefined, 'FAST'); }
          catch (e) { try { doc.addImage(info.url, 'PNG', el.x, el.y, el.w, el.h, undefined, 'FAST'); } catch (e2) {} }
        }
      }
    } catch (e) { /* un élément mal formé ne doit pas bloquer le reste du PDF */ }
  }
}

    doc.text(pied.texte, xPied, 297 - mBas, { align: pied.align });
    doc.setFont('helvetica', 'normal');
  }

  // Pages annexes (Phase 3 configurateur) : schémas/photos placés sur page > 0 dans l'éditeur
  const pagesAnnexes = {};
  (mep.elements || []).forEach(function(el){
    const p = el.page || 0;
    if (p > 0) { (pagesAnnexes[p] = pagesAnnexes[p] || []).push(el); }
  });
  const numerosAnnexes = Object.keys(pagesAnnexes).map(Number).sort((a, b) => a - b);
  for (const p of numerosAnnexes) {
    doc.addPage();
    await dessinerElementsGraphiques(doc, pagesAnnexes[p]);
  }

  return doc.output('blob');
}

async function creerDemandeSignatureYousign(pdfBlob, nomFichier, personneNom, email, telephone) {
  const reqRes = await fetch('/api/yousign/signature_requests', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: nomFichier, delivery_mode: 'none', timezone: 'Europe/Paris' })
  });
  if (!reqRes.ok) {
    const detail = await reqRes.text().catch(() => '');
    throw new Error('Yousign: création de la demande échouée (HTTP ' + reqRes.status + ') ' + detail.slice(0, 300));
  }
  const signatureRequest = await reqRes.json();
  const srId = signatureRequest.id;

  const form = new FormData();
  form.append('file', pdfBlob, nomFichier + '.pdf');
  form.append('nature', 'signable_document');
  form.append('parse_anchors', 'false');
  const docRes = await fetch('/api/yousign/signature_requests/' + srId + '/documents', { method: 'POST', body: form });
  if (!docRes.ok) {
    const detail = await docRes.text().catch(() => '');
    throw new Error('Yousign: envoi du document échoué (HTTP ' + docRes.status + ') ' + detail.slice(0, 300));
  }
  const document = await docRes.json();

  const nomParts = (personneNom || 'Client Iko Suite').trim().split(/\s+/);
  const firstName = nomParts.length > 1 ? nomParts.slice(0, -1).join(' ') : 'Client';
  const lastName = nomParts.length > 1 ? nomParts[nomParts.length - 1] : nomParts[0];
  const telValide = telephone && /^(\+33|0)[1-9](\d{2}){4}$/.test(String(telephone).replace(/[\s.-]/g, ''));

  const signerRes = await fetch('/api/yousign/signature_requests/' + srId + '/signers', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      info: { first_name: firstName, last_name: lastName, email, phone_number: telValide ? String(telephone).replace(/[\s.-]/g, '') : undefined, locale: 'fr' },
      signature_level: 'electronic_signature',
      signature_authentication_mode: 'no_otp',
      fields: [{ document_id: document.id, type: 'signature', page: 1, x: 60, y: 700 }]
    })
  });
  if (!signerRes.ok) {
    const detail = await signerRes.text().catch(() => '');
    throw new Error('Yousign: ajout du signataire échoué (HTTP ' + signerRes.status + ') ' + detail.slice(0, 300));
  }
  const signer = await signerRes.json();
  const signerId = signer.id;

  await fetch('/api/yousign/signature_requests/' + srId + '/activate', { method: 'POST' });

  // signature_link peut mettre un instant a etre genere cote Yousign. On
  // tente une seule fois rapidement ici (ne bloque pas l'envoi du devis) ;
  // si absent, devis.html le recuperera lui-meme a l'ouverture (via
  // Yousign Request ID + Yousign Signer ID stockes sur le devis), quel
  // que soit le delai reel de Yousign.
  let lienSignature = '';
  try {
    const signerFraisRes = await fetch('/api/yousign/signature_requests/' + srId + '/signers/' + signerId);
    if (signerFraisRes.ok) {
      const signerFrais = await signerFraisRes.json();
      lienSignature = signerFrais.signature_link || '';
    }
  } catch(e) {}

  return { signatureRequestId: srId, signerId, lienSignature };
}

function tauxTvaVersDecimal(label) {
  if (!label) return 0.20;
  const m = String(label).match(/([\d.,]+)/);
  return m ? parseFloat(m[1].replace(',', '.')) / 100 : 0.20;
}

function LigneDevisEditeur({ produits, mo, lignes, onAjouter, onSupprimer }) {
  const [choix, setChoix] = React.useState("");
  const [qte, setQte] = React.useState(1);

  const ajouter = () => {
    if (!choix) return;
    const [type, id] = choix.split('|');
    const source = type === 'produit' ? produits.find(p => p.id === id) : mo.find(m => m.id === id);
    if (!source) return;
    const f = source.fields || {};
    const designation = type === 'produit' ? (f["Désignation"] || '—') : (f["Type d'action"] || '—');
    const puHT = type === 'produit' ? (f["Prix unitaire HT"] || 0) : (f["Prix forfait HT"] || f["Taux horaire HT"] || 0);
    const tauxTva = type === 'produit' ? tauxTvaVersDecimal(f["Taux TVA"]) : 0.20;
    const totalHT = (Number(qte) || 1) * puHT;
    onAjouter({ designation, qte: Number(qte) || 1, puHT, tauxTva, totalHT, totalTTC: totalHT * (1 + tauxTva) });
    setChoix(""); setQte(1);
  };

  const total = lignes.reduce((s, l) => s + (l.totalHT || 0), 0);

  return (
    <div style={{marginBottom:"14px"}}>
      <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Lignes du devis (catalogue du client)</label>
      <div style={{display:"flex",gap:"8px",marginBottom:"10px"}}>
        <select value={choix} onChange={e => setChoix(e.target.value)} style={{flex:1}}>
          <option value="">— Ajouter une ligne —</option>
          {produits.length > 0 && <optgroup label="Produits">
            {produits.map(p => <option key={p.id} value={"produit|"+p.id}>{p.fields?.["Désignation"]} — {(p.fields?.["Prix unitaire HT"]||0).toFixed(2)} € HT</option>)}
          </optgroup>}
          {mo.length > 0 && <optgroup label="Main d'œuvre">
            {mo.map(m => <option key={m.id} value={"mo|"+m.id}>{m.fields?.["Type d'action"]} — {(m.fields?.["Prix forfait HT"]||m.fields?.["Taux horaire HT"]||0).toFixed(2)} € HT</option>)}
          </optgroup>}
        </select>
        <input type="number" min="1" value={qte} onChange={e => setQte(e.target.value)} style={{width:"60px"}}/>
        <button type="button" onClick={ajouter} style={{padding:"0 14px",background:"#F3F4F6",border:"1px solid "+C.border,borderRadius:"8px",cursor:"pointer",fontSize:"13px",fontWeight:"700"}}>+</button>
      </div>
      {(produits.length === 0 && mo.length === 0) && (
        <div style={{fontSize:"11px",color:C.rouge,marginBottom:"10px"}}>⚠️ Aucun catalogue configuré pour ce client — configure-le dans le Poste de pilotage (fiche client → Devis &amp; Facturation).</div>
      )}
      {lignes.length > 0 && (
        <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden",marginBottom:"6px"}}>
          {lignes.map((l, i) => (
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderBottom:i<lignes.length-1?"1px solid "+C.border:"none",fontSize:"12px"}}>
              <span>{l.designation} <span style={{color:C.muted}}>×{l.qte}</span></span>
              <span style={{display:"flex",alignItems:"center",gap:"10px"}}>
                <b>{l.totalHT.toFixed(2)} €</b>
                <span onClick={() => onSupprimer(i)} style={{cursor:"pointer",color:C.muted}}>✕</span>
              </span>
            </div>
          ))}
        </div>
      )}
      <div style={{textAlign:"right",fontSize:"13px",fontWeight:"900",color:C.white}}>Total HT : {total.toFixed(2)} €</div>
    </div>
  );
}

  const montantTTC = lignes.reduce((s, l) => s + (l.totalTTC != null ? l.totalTTC : l.totalHT * 1.2), 0);

  const envoyer = async () => {
    if (!lignes.length) { setError("Ajoute au moins une ligne au devis."); return; }
    if (!emailValide) { setError("Indique un email client valide."); return; }
    if (!clientInfo) { setError("Impossible de résoudre le client de cette agence — vérifie la configuration."); return; }
    setSaving(true); setError("");
    const diag = { devisId: null, pdfGenere: false, yousignOk: false, yousignErreur: null, ticketMisAJour: false, webhookStatut: null, webhookErreur: null, lienDevis: null };
    try {
      const numero = "DEV-" + new Date().getFullYear() + "-" + Math.floor(1000 + Math.random() * 9000);
      const mep = catalogue.mep || { identite: {}, assurance: {}, piedPage: "", dureeValidite: 30 };
      const cpMatch = (ticket.fields?.Adresse || "").match(/\b\d{5}\b/);
      const client = { nom: ticket.fields?.Client, adresse: ticket.fields?.Adresse || "", cp: cpMatch ? cpMatch[0] : "" };

      const devisRes = await fetch('/api/airtable/Devis', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ records: [{ fields: (() => {
          const champs = {
            "N° devis": numero, "Ticket lié": [ticket.id], "Client": [clientInfo.clientId],
            "Nom client": client.nom, "Adresse client": client.adresse, "CP client": client.cp,
            "Lignes devis (JSON)": JSON.stringify(lignes), "Montant HT": montantHT, "Montant TTC": montantTTC,
            "Statut": "Envoyé", "Mode": "Manuel",
          };
          if (clientInfo.agenceId) champs["Agence"] = [clientInfo.agenceId];
          return champs;
        })() }] })
      });
      const devisJson = await devisRes.json();
      const devisRec = devisJson.records?.[0];
      if (!devisRec) throw new Error("Création du devis échouée : " + JSON.stringify(devisJson));
      diag.devisId = devisRec.id;

      const pdfBlob = await genererPdfDevis({ numero, ticket, client, lignes, montantHT, montantTTC, mep });
      diag.pdfGenere = !!(pdfBlob && pdfBlob.size);

      let yousignFields = {};
      try {
        const { signatureRequestId, signerId, lienSignature } = await creerDemandeSignatureYousign(pdfBlob, numero, client.nom, email.trim(), ticket.fields?.Téléphone);
        yousignFields = { "Yousign Request ID": signatureRequestId, "Yousign Signer ID": signerId, "Yousign Signer Link": lienSignature };
        diag.yousignOk = true;
        diag.lienSignature = lienSignature || "(pas encore prêt — devis.html le récupérera à l'ouverture)";
      } catch (yousignErr) {
        console.error('Yousign indisponible, devis envoyé sans signature électronique :', yousignErr);
        diag.yousignErreur = String(yousignErr && yousignErr.message || yousignErr);
      }
      await fetch('/api/airtable/Devis/' + devisRec.id, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: yousignFields })
      });

      // Compatibilité avec le pipeline existant (ModalGestionDevis, badges, filtres par Statut de ticket).
      const ticketPatchRes = await fetch('/api/airtable/Tickets%20SAV/' + ticket.id, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Statut: 'Devis envoyé', "Montant devis": Math.round(montantTTC * 100) / 100, Email: email.trim() } })
      });
      diag.ticketMisAJour = ticketPatchRes.ok;
      if (!ticketPatchRes.ok) {
        diag.ticketErreur = await ticketPatchRes.text().catch(() => '(corps illisible)');
      }

      const lienDevis = window.location.origin + '/devis.html?devisId=' + devisRec.id;
      diag.lienDevis = lienDevis;
      try {
        const webhookRes = await fetch(WEBHOOK, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            marque: 'iko', action: 'devis_envoye',
            ticket: ticket.fields?.Name, nom: ticket.fields?.Client, "e-mail": email.trim(),
            agence: ticket.fields?.Agence, produit: ticket.fields?.Produit, probleme: ticket.fields?.Problème,
            diagnostic: ticket.fields?.Diagnostic || '', montant: montantTTC.toFixed(2) + ' €', message, lien: lienDevis
          })
        });
        diag.webhookStatut = webhookRes.status;
      } catch (webhookErr) {
        diag.webhookErreur = String(webhookErr && webhookErr.message || webhookErr);
      }

      setDebugEnvoi(diag);
      setEnvoye(true);
    } catch(e) {
      console.error(e);
      diag.erreurFatale = String(e && e.message || e);
      setDebugEnvoi(diag);
      setError("Erreur lors de l'envoi — détail dans le diagnostic ci-dessous.");
    }
    setSaving(false);
  };

  if (envoye) {
    return (
      <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
        <div className="modal-box" style={{maxWidth:"520px"}}>
          <div style={{fontSize:"16px",fontWeight:"900",color:C.white,marginBottom:"10px"}}>✅ Devis créé — diagnostic</div>
          <div style={{background:"#111",color:"#0f0",borderRadius:"8px",padding:"12px",fontFamily:"monospace",fontSize:"10.5px",whiteSpace:"pre-wrap",wordBreak:"break-all",marginBottom:"14px",maxHeight:"320px",overflow:"auto"}}>
            {JSON.stringify(debugEnvoi, null, 2)}
          </div>
          {!debugEnvoi?.yousignOk && (
            <div style={{background:C.rougeDim,border:"1px solid rgba(220,38,38,0.3)",borderRadius:"8px",padding:"8px 12px",fontSize:"11px",color:C.rouge,marginBottom:"14px"}}>
              ⚠️ Yousign a échoué ({debugEnvoi?.yousignErreur}) — le devis est créé mais sans lien de signature.
            </div>
          )}
          {debugEnvoi?.webhookStatut && debugEnvoi.webhookStatut >= 300 && (
            <div style={{background:C.rougeDim,border:"1px solid rgba(220,38,38,0.3)",borderRadius:"8px",padding:"8px 12px",fontSize:"11px",color:C.rouge,marginBottom:"14px"}}>
              ⚠️ Le webhook Make a répondu avec le statut {debugEnvoi.webhookStatut} — l'email n'a probablement pas été envoyé.
            </div>
          )}
          {debugEnvoi?.webhookStatut && debugEnvoi.webhookStatut < 300 && (
            <div style={{background:"#F3F4F6",border:"1px solid "+C.border,borderRadius:"8px",padding:"8px 12px",fontSize:"11px",color:C.muted,marginBottom:"14px"}}>
              Le webhook Make a bien été accepté (statut {debugEnvoi.webhookStatut}). Si aucun email n'arrive, le souci est dans le scénario Make lui-même (pas dans le code de l'app) — vérifie son historique d'exécution.
            </div>
          )}
          <button onClick={() => { onSent(); }} style={{width:"100%",padding:"11px",background:"#0D0D0D",color:"#fff",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:"pointer"}}>
            Fermer
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box" style={{maxWidth:"520px"}}>
        <div style={{fontSize:"16px",fontWeight:"900",color:C.white,marginBottom:"4px"}}>💶 Établir le devis</div>
        <div style={{fontSize:"12px",color:C.or,fontFamily:"monospace",marginBottom:"14px"}}>{ticket.fields?.Name} — {ticket.fields?.Client}</div>
        {ticket.fields?.Diagnostic && (
          <div style={{background:"rgba(0,26,66,0.05)",border:"1px solid rgba(0,26,66,0.2)",borderRadius:"10px",padding:"10px 14px",marginBottom:"14px",fontSize:"12px",color:"#0D0D0D"}}>
            📋 Diagnostic technicien : {ticket.fields.Diagnostic}
          </div>
        )}

        {chargement && <div style={{textAlign:"center",padding:"20px 0",color:C.muted,fontSize:"12px"}}>⏳ Chargement du catalogue client...</div>}

        {!chargement && (
          <LigneDevisEditeur produits={catalogue.produits} mo={catalogue.mo} lignes={lignes}
            onAjouter={l => setLignes([...lignes, l])} onSupprimer={i => setLignes(lignes.filter((_,idx) => idx!==i))}/>
        )}

        <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Email client *</label>
        <input type="email" placeholder="client@exemple.fr" value={email} onChange={e => setEmail(e.target.value)}
          style={{marginBottom:"14px",border:"1.5px solid "+(email && !emailValide ? C.rouge : "#D1D5DB")}}/>
        <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Message complémentaire (facultatif)</label>
        <textarea rows={2} placeholder="Ex : délai de livraison estimé..." value={message} onChange={e => setMessage(e.target.value)} style={{resize:"none",marginBottom:"14px"}}/>

        <div style={{background:"#F3F4F6",border:"1px solid "+C.border,borderRadius:"8px",padding:"9px 12px",fontSize:"11px",color:C.muted,marginBottom:"14px"}}>
          PDF itemisé généré avec le catalogue et la mise en page du client, signature électronique Yousign. Le client recevra un lien pour consulter, signer et valider.
        </div>
        {error && <div style={{background:C.rougeDim,border:"1px solid rgba(220,38,38,0.3)",borderRadius:"8px",padding:"8px 12px",fontSize:"11px",color:C.rouge,marginBottom:"14px"}}>{error}</div>}
        <div style={{display:"flex",gap:"10px"}}>
          <button onClick={onClose} style={{flex:1,padding:"11px",background:"transparent",color:C.muted,border:"1px solid "+C.border,borderRadius:"10px",fontSize:"12px",cursor:"pointer"}}>Annuler</button>
          <button onClick={envoyer} disabled={saving||!lignes.length||!emailValide}
            style={{flex:2,padding:"11px",background:saving||!lignes.length||!emailValide?"#D1D5DB":"#0D0D0D",color:"#fff",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:saving||!lignes.length||!emailValide?"not-allowed":"pointer"}}>
            {saving ? "⏳ Envoi..." : "📧 Envoyer le devis au client"}
          </button>
        </div>
      </div>
    </div>
  );
}

function ModalGestionDevis({ tickets, onClose, onRefresh }) {
  const [sousOnglet, setSousOnglet] = React.useState("a_faire");
  const [agenceFiltreDevis, setAgenceFiltreDevis] = React.useState("global");
  const [ticketDevisActif, setTicketDevisActif] = React.useState(null);
  const [changing, setChanging] = React.useState(null);
  const [devisSignes, setDevisSignes] = React.useState([]);
  const [chargementSignes, setChargementSignes] = React.useState(false);

  const STATUTS_DEVIS = [
    { id: "a_faire", label: "À faire", statut: "Devis à faire", couleur: "#22C55E" },
    { id: "envoye", label: "Envoyé", statut: "Devis envoyé", couleur: "#2563eb" },
    { id: "suivi", label: "Suivi", statut: "Devis - Suivi", couleur: "#22C55E" },
    { id: "fournisseur", label: "Attente fournisseur", statut: "Devis - Attente fournisseur", couleur: "#7c3aed" },
    { id: "refuse", label: "Refusé", statut: "Devis refusé", couleur: "#DC2626" },
    { id: "signe", label: "Signés", statut: null, couleur: "#16A34A" },
  ];

  // Onglet "Signés" : les tickets liés repassent en statut "Nouveau" après
  // signature (planification auto), donc invisibles ailleurs dans ce modal.
  // On interroge directement la table Devis (Statut = "Validé").
  React.useEffect(() => {
    if (sousOnglet !== "signe") return;
    setChargementSignes(true);
    const formule = encodeURIComponent('{Statut}="Validé"');
    fetch('/api/airtable/Devis?filterByFormula=' + formule + '&sort[0][field]=Date%20validation%20client&sort[0][direction]=desc&maxRecords=50')
      .then(r => r.json())
      .then(j => setDevisSignes(j.records || []))
      .catch(e => console.error(e))
      .finally(() => setChargementSignes(false));
  }, [sousOnglet]);

  // Note : la table Devis n'a pas de champ Agence propre — le filtre agence
  // du modal ne s'applique donc pas à l'onglet Signés (comptage global).
  const compteur = (id) => {
    if (id === "signe") return devisSignes.length;
    const statut = STATUTS_DEVIS.find(s => s.id === id)?.statut;
    return tickets.filter(t => t.fields?.Statut === statut && (agenceFiltreDevis==="global" || t.fields?.Agence===AGENCE_VERS_AIRTABLE[agenceFiltreDevis])).length;
  };
  const listeActuelle = sousOnglet === "signe" ? [] : tickets.filter(t => t.fields?.Statut === STATUTS_DEVIS.find(s => s.id === sousOnglet)?.statut && (agenceFiltreDevis==="global" || t.fields?.Agence===AGENCE_VERS_AIRTABLE[agenceFiltreDevis]));

  const changerStatut = async (ticketId, nouveauStatut) => {
    setChanging(ticketId);
    try {
      await fetch('/api/airtable/Tickets%20SAV/'+ticketId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Statut: nouveauStatut } })
      });
      onRefresh();
    } catch(e) { console.error(e); }
    setChanging(null);
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box" style={{maxWidth:"760px",width:"95%"}}>
        {ticketDevisActif && (
          <ModalDevis ticket={ticketDevisActif} onClose={() => setTicketDevisActif(null)}
            onSent={() => { setTicketDevisActif(null); onRefresh(); }}/>
        )}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"18px"}}>
          <div>
            <div style={{fontSize:"17px",fontWeight:"900",color:C.white}}>📋 Gestion des devis</div>
            <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>Suivi de tous les dossiers en devis, toutes agences</div>
          </div>
          <button onClick={onClose} style={{background:"#F3F4F6",border:"1px solid "+C.border,color:C.muted,borderRadius:"8px",width:"32px",height:"32px",cursor:"pointer",fontSize:"16px"}}>✕</button>
        </div>

        <div style={{display:"flex",gap:"6px",marginBottom:"14px",flexWrap:"wrap"}}>
          {["global",...AGENCES].map(a => (
            <button key={a} onClick={() => setAgenceFiltreDevis(a)}
              style={{padding:"6px 14px",borderRadius:"20px",border:"1px solid "+(agenceFiltreDevis===a?C.or:C.border),background:agenceFiltreDevis===a?C.or:"transparent",color:agenceFiltreDevis===a?"#111":C.muted,fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>
              {a==="global"?"🌐 Toutes agences":a}
            </button>
          ))}
        </div>

        <div style={{display:"flex",gap:"6px",marginBottom:"18px",flexWrap:"wrap"}}>
          {STATUTS_DEVIS.map(s => (
            <button key={s.id} onClick={() => setSousOnglet(s.id)}
              style={{padding:"8px 14px",borderRadius:"20px",border:"2px solid "+(sousOnglet===s.id?s.couleur:C.border),background:sousOnglet===s.id?s.couleur+"22":"transparent",color:sousOnglet===s.id?s.couleur:C.muted,fontSize:"12px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>
              {s.label}
              <span style={{background:sousOnglet===s.id?s.couleur:C.border,color:sousOnglet===s.id?"#fff":C.muted,borderRadius:"10px",padding:"1px 7px",fontSize:"10px"}}>{compteur(s.id)}</span>
            </button>
          ))}
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:"10px",maxHeight:"420px",overflowY:"auto"}}>
          {sousOnglet === "signe" && chargementSignes && (
            <div style={{textAlign:"center",padding:"40px",color:C.muted}}>Chargement...</div>
          )}
          {sousOnglet === "signe" && !chargementSignes && devisSignes.length === 0 && (
            <div style={{textAlign:"center",padding:"40px",color:C.muted,border:"1px dashed "+C.border,borderRadius:"12px"}}>Aucun devis signé pour le moment</div>
          )}
          {sousOnglet === "signe" && devisSignes.map(d => (
            <div key={d.id} style={{background:C.card,border:"1px solid "+C.border,borderRadius:"10px",padding:"14px 16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}}>
                <span style={{fontSize:"11px",fontWeight:"900",color:"#16A34A",fontFamily:"monospace"}}>{d.fields?.["N° devis"]}</span>
                <span style={{fontSize:"13px",fontWeight:"900",color:C.white}}>{d.fields?.["Montant TTC"]} € TTC</span>
              </div>
              <div style={{fontSize:"11px",color:C.muted,marginBottom:"10px"}}>
                Signé le {d.fields?.["Date validation client"] ? new Date(d.fields["Date validation client"]).toLocaleDateString('fr-FR') : "—"}
                {d.fields?.["Date intervention proposée"] && " · Intervention prévue le " + new Date(d.fields["Date intervention proposée"]+'T12:00:00').toLocaleDateString('fr-FR')}
              </div>
              {d.fields?.["Yousign Request ID"] && (
                <a href={"/api/yousign-webhook?download=" + encodeURIComponent(d.fields["Yousign Request ID"])} target="_blank" rel="noreferrer"
                  style={{display:"inline-block",fontSize:"12px",fontWeight:"700",color:"#16A34A",textDecoration:"none",border:"1px solid rgba(22,163,74,0.4)",borderRadius:"8px",padding:"6px 12px"}}>
                  📄 Voir le PDF signé
                </a>
              )}
            </div>
          ))}
          {sousOnglet !== "signe" && listeActuelle.length === 0 && (
            <div style={{textAlign:"center",padding:"40px",color:C.muted,border:"1px dashed "+C.border,borderRadius:"12px"}}>Aucun dossier dans cette catégorie</div>
          )}
          {sousOnglet !== "signe" && listeActuelle.map(t => (
            <div key={t.id} style={{background:C.card,border:"1px solid "+C.border,borderRadius:"10px",padding:"14px 16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}}>
                <div>
                  <span style={{fontSize:"11px",fontWeight:"900",color:C.or,fontFamily:"monospace"}}>{t.fields?.Name}</span>
                  <span style={{fontSize:"11px",color:C.muted,marginLeft:"10px"}}>{t.fields?.Agence}</span>
                </div>
                {t.fields?.["Montant devis"] && <span style={{fontSize:"13px",fontWeight:"900",color:C.white}}>{t.fields["Montant devis"]} € TTC</span>}
              </div>
              <div style={{fontSize:"13px",fontWeight:"700",color:C.white,marginBottom:"4px"}}>{t.fields?.Client}</div>
              <div style={{fontSize:"11px",color:C.muted,marginBottom:"10px"}}>{t.fields?.Produit} — {t.fields?.Problème}</div>
              {t.fields?.Diagnostic && (
                <div style={{background:"#F3F4F6",borderRadius:"8px",padding:"8px 10px",marginBottom:"10px",fontSize:"11px",color:"#374151"}}>📋 {t.fields.Diagnostic}</div>
              )}
              <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
                {sousOnglet === "a_faire" && (
                  <button onClick={() => setTicketDevisActif(t)}
                    style={{background:"#22C55E",color:"#111",border:"none",borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"900",cursor:"pointer"}}>
                    💶 Établir le devis
                  </button>
                )}
                {sousOnglet === "envoye" && (
                  <>
                    <button disabled={changing===t.id} onClick={() => changerStatut(t.id, "Devis - Suivi")}
                      style={{background:"rgba(217,119,6,0.12)",color:"#22C55E",border:"1px solid rgba(217,119,6,0.4)",borderRadius:"8px",padding:"7px 12px",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>
                      → Marquer en suivi
                    </button>
                    <button disabled={changing===t.id} onClick={() => changerStatut(t.id, "Devis - Attente fournisseur")}
                      style={{background:"rgba(124,58,237,0.12)",color:"#7c3aed",border:"1px solid rgba(124,58,237,0.4)",borderRadius:"8px",padding:"7px 12px",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>
                      → Attente fournisseur
                    </button>
                  </>
                )}
                {(sousOnglet === "suivi" || sousOnglet === "fournisseur") && (
                  <button disabled={changing===t.id} onClick={() => changerStatut(t.id, "Devis envoyé")}
                    style={{background:"rgba(37,99,235,0.12)",color:"#2563eb",border:"1px solid rgba(37,99,235,0.4)",borderRadius:"8px",padding:"7px 12px",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>
                    ← Revenir à "Envoyé"
                  </button>
                )}
                {sousOnglet === "refuse" && (
                  <span style={{fontSize:"11px",color:C.muted,fontStyle:"italic"}}>Dossier clos, aucune action nécessaire</span>
                )}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ModalNotes({ tickets, onClose }) {
  const [agenceFiltreNotes, setAgenceFiltreNotes] = React.useState("global");
  const [exportDebutNotes, setExportDebutNotes] = React.useState("");
  const [exportFinNotes, setExportFinNotes] = React.useState("");

  const notes = tickets
    .filter(t => typeof t.fields?.Note === "number" && (agenceFiltreNotes==="global" || t.fields?.Agence===AGENCE_VERS_AIRTABLE[agenceFiltreNotes]))
    .filter(t => {
      const d = parseDateCreneau(t.fields?.Créneau);
      const matchDebut = !exportDebutNotes || d >= new Date(exportDebutNotes+'T00:00:00');
      const matchFin = !exportFinNotes || d <= new Date(exportFinNotes+'T23:59:59');
      return matchDebut && matchFin;
    })
    .sort((a,b) => (b.fields?.Name||"").localeCompare(a.fields?.Name||""));

  const moyenne = notes.length ? (notes.reduce((s,t) => s + t.fields.Note, 0) / notes.length) : null;

  const nomFichierNotes = (ext) => {
    const ag = agenceFiltreNotes==="global" ? "Toutes-agences" : agenceFiltreNotes.replace(/[^\w]+/g,"-");
    const periode = (exportDebutNotes||exportFinNotes) ? (exportDebutNotes||"...")+"_"+(exportFinNotes||"...") : "complet";
    return "IkoSuite_Avis_"+ag+"_"+periode+"."+ext;
  };

  const exportExcelNotes = () => {
    if (notes.length === 0) { alert("Aucun avis ne correspond aux filtres sélectionnés."); return; }
    const rows = notes.map(t => ({
      "N° Ticket": t.fields?.Name || "",
      "Agence": t.fields?.Agence || "",
      "Client": t.fields?.Client || "",
      "Produit": t.fields?.Produit || "",
      "Problème": t.fields?.Problème || "",
      "Note": t.fields?.Note || "",
      "Commentaire": t.fields?.["Note Commentaire"] || "",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.max(k.length, 14) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Avis clients");
    XLSX.writeFile(wb, nomFichierNotes("xlsx"));
  };

  const exportPDFNotes = () => {
    if (notes.length === 0) { alert("Aucun avis ne correspond aux filtres sélectionnés."); return; }
    const ag = agenceFiltreNotes==="global" ? "Toutes agences" : agenceFiltreNotes;
    const periode = (exportDebutNotes||exportFinNotes) ? "Du "+(exportDebutNotes||"...")+" au "+(exportFinNotes||"...") : "Toutes dates";
    const lignes = notes.map(t => `
      <tr>
        <td>${t.fields?.Name||""}</td>
        <td>${t.fields?.Agence||""}</td>
        <td>${t.fields?.Client||""}</td>
        <td>${t.fields?.Produit||""} — ${t.fields?.Problème||""}</td>
        <td>${"★".repeat(t.fields.Note)}${"☆".repeat(5-t.fields.Note)}</td>
        <td>${t.fields?.["Note Commentaire"]||""}</td>
      </tr>`).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Avis clients Iko Suite</title>
      <style>
        body{font-family:Arial,sans-serif;padding:24px;color:#111;}
        h1{color:#111;font-size:18px;margin-bottom:2px;}
        .sub{color:#666;font-size:11px;margin-bottom:16px;}
        table{width:100%;border-collapse:collapse;font-size:10px;}
        th{background:#111;color:#fff;text-align:left;padding:6px 8px;}
        td{border-bottom:1px solid #ddd;padding:6px 8px;}
        tr:nth-child(even){background:#f7f7f7;}
        .footer{margin-top:16px;font-size:9px;color:#999;}
        @media print { @page { size: landscape; margin: 12mm; } }
      </style></head><body>
      <h1>Iko Suite — Export avis clients</h1>
      <div class="sub">${ag} — ${periode} — ${notes.length} avis — note moyenne ${moyenne?moyenne.toFixed(1):"—"}/5 — généré le ${new Date().toLocaleDateString('fr-FR')}</div>
      <table><thead><tr>
        <th>N° Ticket</th><th>Agence</th><th>Client</th><th>Produit / Problème</th><th>Note</th><th>Commentaire</th>
      </tr></thead><tbody>${lignes}</tbody></table>
      <div class="footer">Iko Suite — Document généré automatiquement</div>
      </body></html>`;
    const w = window.open('', '_blank');
    w.document.write(html);
    w.document.close();
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box" style={{maxWidth:"760px",width:"95%"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"18px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
            <button onClick={onClose} style={{background:"#F3F4F6",border:"1px solid "+C.border,color:C.text,borderRadius:"8px",padding:"7px 14px",fontSize:"12px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>← Retour</button>
            <div>
              <div style={{fontSize:"17px",fontWeight:"900",color:C.white}}>⭐ Avis clients</div>
              <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{moyenne ? moyenne.toFixed(1)+" / 5 — " : ""}{notes.length} avis{agenceFiltreNotes==="global"?" — toutes agences":" — "+agenceFiltreNotes}</div>
            </div>
          </div>
          <button onClick={onClose} style={{background:"#F3F4F6",border:"1px solid "+C.border,color:C.muted,borderRadius:"8px",width:"32px",height:"32px",cursor:"pointer",fontSize:"16px"}}>✕</button>
        </div>

        <div style={{display:"flex",gap:"8px",marginBottom:"16px",flexWrap:"wrap"}}>
          {["global",...AGENCES].map(a => (
            <button key={a} onClick={() => setAgenceFiltreNotes(a)}
              style={{padding:"7px 16px",borderRadius:"20px",border:"1px solid "+(agenceFiltreNotes===a?C.or:C.border),background:agenceFiltreNotes===a?C.or:"transparent",color:agenceFiltreNotes===a?"#111":C.muted,fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>
              {a==="global"?"🌐 Toutes agences":a}
            </button>
          ))}
        </div>

        <div style={{background:"#F3F4F6",border:"1px solid "+C.border,borderRadius:"12px",padding:"14px 16px",marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"10px"}}>📤 Export (respecte le filtre agence ci-dessus)</div>
          <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
            <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
              <span style={{fontSize:"11px",color:C.muted}}>Du</span>
              <input type="date" value={exportDebutNotes} onChange={e => setExportDebutNotes(e.target.value)} style={{width:"140px"}}/>
              <span style={{fontSize:"11px",color:C.muted}}>au</span>
              <input type="date" value={exportFinNotes} onChange={e => setExportFinNotes(e.target.value)} style={{width:"140px"}}/>
              {(exportDebutNotes||exportFinNotes) && (
                <button onClick={() => { setExportDebutNotes(""); setExportFinNotes(""); }} style={{background:"none",border:"none",color:C.muted,fontSize:"11px",cursor:"pointer",textDecoration:"underline"}}>Effacer</button>
              )}
            </div>
            <div style={{display:"flex",gap:"8px",marginLeft:"auto"}}>
              <button onClick={exportExcelNotes} style={{background:C.vertDim,border:"1px solid rgba(22,163,74,0.4)",color:C.vert,borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>📊 Excel</button>
              <button onClick={exportPDFNotes} style={{background:C.orDim,border:"1px solid "+C.orBord,color:C.or,borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>🖨️ PDF</button>
            </div>
          </div>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:"10px",maxHeight:"420px",overflowY:"auto"}}>
          {notes.length === 0 && (
            <div style={{textAlign:"center",padding:"40px",color:C.muted,border:"1px dashed "+C.border,borderRadius:"12px"}}>Aucun avis pour cette sélection</div>
          )}
          {notes.map(t => (
            <div key={t.id} style={{background:C.card,border:"1px solid "+C.border,borderRadius:"10px",padding:"14px 16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6px"}}>
                <div>
                  <span style={{fontSize:"11px",fontWeight:"900",color:C.or,fontFamily:"monospace"}}>{t.fields?.Name}</span>
                  <span style={{fontSize:"11px",color:C.muted,marginLeft:"10px"}}>{t.fields?.Agence}</span>
                </div>
                <div style={{color:"#22C55E",fontSize:"14px"}}>{"⭐".repeat(t.fields.Note)}{"☆".repeat(5-t.fields.Note)}</div>
              </div>
              <div style={{fontSize:"13px",fontWeight:"700",color:C.white,marginBottom:"4px"}}>{t.fields?.Client}</div>
              <div style={{fontSize:"11px",color:C.muted,marginBottom:"8px"}}>{t.fields?.Produit} — {t.fields?.Problème}</div>
              {t.fields?.["Note Commentaire"] && (
                <div style={{background:"#F3F4F6",borderRadius:"8px",padding:"8px 10px",fontSize:"11px",color:"#374151",fontStyle:"italic"}}>💬 {t.fields["Note Commentaire"]}</div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
