  const [syntheseErreur, setSyntheseErreur] = React.useState("");

  const genererSynthese = async () => {
    setChargementSynthese(true);
    setSyntheseIA(null);
    setSyntheseErreur("");
    try {
      const r = await fetch('/api/chat-dashboard', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'synthese_direction',
          stats: {
            total_tickets: tickets.length,
            top_produits: topProduits.map(([p, n]) => ({ produit: p, nb: n })),
            repartition_agences: repartitionAgences.map(([a, n]) => ({ agence: a, nb: n })),
            repartition_statuts: repartitionStatuts.map(([s, n]) => ({ statut: s, nb: n })),
            taux_urgents_pct: tauxUrgents,
            tendance_mensuelle: tendance,
            estimation_mois_suivant: estimationMoisSuivant,
            top_causes_sav: topCauses.map(([c, n]) => ({ cause: c, nb: n })),
            cout_sav_global: coutSAVGlobal,
          },
        }),
      });
      const data = await r.json();
      if (r.ok && !data.erreur) setSyntheseIA(data);
      else setSyntheseErreur(data.erreur || "Synthèse indisponible pour le moment.");
    } catch (e) {
      setSyntheseErreur("Synthèse indisponible pour le moment.");
    }
    setChargementSynthese(false);
  };

  // Génération automatique à l'ouverture : vue dirigeant pensée pour être
  // consultée d'un coup d'œil, pas pour cliquer un bouton supplémentaire.
  React.useEffect(() => { genererSynthese(); }, []);

  const KpiCard = ({ label, value, sub, accent }) => (
    <div style={{background:C.card,border:"1px solid "+(accent?C.orBord:C.border),borderRadius:"12px",padding:"14px 18px",flex:1,minWidth:"140px"}}>
      <div style={{fontSize:"24px",fontWeight:"900",color:accent?C.or:C.white,fontFamily:"monospace"}}>{value}</div>
      <div style={{fontSize:"11px",fontWeight:"700",color:C.text,marginTop:"3px"}}>{label}</div>
      {sub && <div style={{fontSize:"10px",color:C.muted,marginTop:"2px"}}>{sub}</div>}
    </div>
  );

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box" style={{maxWidth:"720px",maxHeight:"88vh",overflow:"auto"}}>
        <div style={{fontSize:"18px",fontWeight:"900",color:C.white,marginBottom:"2px"}}>🧭 Central — direction</div>
        <div style={{fontSize:"11px",color:C.muted,marginBottom:"12px"}}>Vue consolidée toutes agences — {tickets.length} ticket(s) chargé(s), lecture seule</div>
        <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"18px"}}>
          {onOpenAnalytics && <button onClick={onOpenAnalytics} style={{background:C.or,border:"none",color:"#fff",borderRadius:"10px",padding:"9px 16px",fontSize:"12px",fontWeight:"800",cursor:"pointer"}}>📊 Analytics SAV</button>}
          {onOpenFacturation && <button onClick={onOpenFacturation} style={{background:C.or,border:"none",color:"#fff",borderRadius:"10px",padding:"9px 16px",fontSize:"12px",fontWeight:"800",cursor:"pointer"}}>💶 Facturation & compta</button>}
          {onOpenBlocage && <button onClick={onOpenBlocage} style={{background:C.or,border:"none",color:"#fff",borderRadius:"10px",padding:"9px 16px",fontSize:"12px",fontWeight:"800",cursor:"pointer"}}>🔒 Bloquer des dates (fermeture)</button>}
          {onOpenIntelCom && <button onClick={onOpenIntelCom} style={{background:C.or,border:"none",color:"#fff",borderRadius:"10px",padding:"9px 16px",fontSize:"12px",fontWeight:"800",cursor:"pointer"}}>💼 Intelligence commerciale</button>}
        </div>

        <div style={{display:"flex",gap:"10px",flexWrap:"wrap",marginBottom:"20px"}}>
          <KpiCard label="Tickets actifs" value={stats.total} accent/>
          <KpiCard label="Urgents" value={stats.urgent} sub={tauxUrgents + "% du volume total"}/>
          <KpiCard label="Devis en attente" value={ticketsDevisPipeline.length}/>
          <KpiCard label="Montant devis envoyés" value={montantDevisEnCours.toFixed(0) + " €"} sub="TTC, statut Devis envoyé"/>
          <KpiCard label="Note client moyenne" value={stats.noteMoyenne ? stats.noteMoyenne.toFixed(1) + " / 5" : "—"} sub={stats.nbNotes + " avis"}/>
          <KpiCard label="Coût SAV réel" value={coutSAVGlobal.toFixed(0) + " €"} sub="interventions chiffrées"/>
          <KpiCard label="Résolution 1er passage" value={!erreurInterventions && interventions && perfEtResolution.tauxResolutionPremierPassage !== null ? perfEtResolution.tauxResolutionPremierPassage + "%" : "—"} sub={erreurInterventions ? "erreur de chargement" : (interventions ? (perfEtResolution.tauxResolutionPremierPassage === null ? "aucune donnée" : "") : "chargement...")}/>
        </div>

        {erreurInterventions && (
          <div style={{background:"rgba(var(--iko-erreur-rgb),0.08)",border:"1px solid var(--iko-erreur)",borderRadius:"8px",padding:"9px 12px",fontSize:"10.5px",color:"var(--iko-erreur)",fontWeight:"700",marginBottom:"18px"}}>
            ⚠️ Erreur de chargement des interventions SAV — {erreurInterventions} Résolution 1er passage, performance techniciens et socle prédictif indisponibles pour l'instant (à ne pas confondre avec une absence réelle de données).
          </div>
        )}

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"16px",marginBottom:"18px"}}>
          <div>
            <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"8px"}}>Produits générant le plus de SAV</div>
            {topProduits.length === 0 && <div style={{fontSize:"11px",color:C.muted,fontStyle:"italic"}}>Aucun produit renseigné.</div>}
            {topProduits.length > 0 && (
              <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden"}}>
                {topProduits.slice(0, 5).map(([produit, n], i) => (
                  <div key={produit} style={{display:"flex",justifyContent:"space-between",padding:"6px 10px",borderBottom:i<4?"1px solid "+C.border:"none",fontSize:"11.5px"}}>
                    <span>{produit}</span><b style={{color:C.or}}>{n}</b>
                  </div>
                ))}
              </div>
            )}
          </div>
          <div>
            <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"8px"}}>Répartition par agence</div>
            {repartitionAgences.length === 0 && <div style={{fontSize:"11px",color:C.muted,fontStyle:"italic"}}>Aucune agence renseignée.</div>}
            {repartitionAgences.length > 0 && (
              <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden"}}>
                {repartitionAgences.map(([agence, n], i) => (
                  <div key={agence} style={{display:"flex",justifyContent:"space-between",padding:"6px 10px",borderBottom:i<repartitionAgences.length-1?"1px solid "+C.border:"none",fontSize:"11.5px"}}>
                    <span>{agence}</span><span><b>{n}</b> <span style={{color:C.muted}}>({totalAvecAgence?Math.round(n/totalAvecAgence*100):0}%)</span></span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        <div style={{marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"2px"}}>Tendance mensuelle (6 derniers mois)</div>
          <div style={{display:"flex",alignItems:"flex-end",gap:"6px",height:"64px",marginTop:"8px"}}>
            {tendance.map(m => (
              <div key={m.label} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"4px"}}>
                <div style={{width:"100%",height:Math.max(3,Math.round(m.valeur/maxTendance*48))+"px",background:C.or,borderRadius:"3px"}} title={m.valeur+" ticket(s)"}/>
                <div style={{fontSize:"9px",color:C.muted}}>{m.label}</div>
              </div>
            ))}
          </div>
          {estimationMoisSuivant !== null && (
            <div style={{fontSize:"11px",color:C.muted,marginTop:"6px",fontStyle:"italic"}}>Estimation mois suivant : ≈ {estimationMoisSuivant} ticket(s) (moyenne des 3 derniers mois — tendance, pas une prédiction causale).</div>
          )}
        </div>

        <div style={{marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"2px"}}>Produits à risque — tendance de volume</div>
          <div style={{fontSize:"10.5px",color:C.muted,marginBottom:"8px"}}>3 derniers mois vs 3 mois précédents (signal statistique, pas une cause identifiée).</div>
          {produitsRisque.length === 0 && <div style={{fontSize:"11px",color:C.muted,fontStyle:"italic"}}>Pas assez de données pour établir une tendance produit.</div>}
          {produitsRisque.length > 0 && (
            <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden"}}>
              {produitsRisque.map((p, i) => (
                <div key={p.produit} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 10px",borderBottom:i<produitsRisque.length-1?"1px solid "+C.border:"none",fontSize:"11.5px"}}>
                  <span>{p.produit}</span>
                  <span style={{display:"flex",alignItems:"center",gap:"6px"}}>
                    <span style={{color:C.muted}}>{p.precedent} → {p.recent}</span>
                    <span style={{fontSize:"10px",fontWeight:"800",padding:"2px 7px",borderRadius:"10px",color:"#fff",background:p.tendanceProduit==="hausse"?C.rouge:p.tendanceProduit==="baisse"?"var(--iko-primary)":C.muted}}>
                      {p.tendanceProduit==="hausse"?"▲ hausse":p.tendanceProduit==="baisse"?"▼ baisse":"= stable"}
                    </span>
                  </span>
                </div>
              ))}
            </div>
          )}
        </div>

        <div style={{marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"8px"}}>Top causes SAV</div>
          {topCauses.length === 0 && <div style={{fontSize:"11px",color:C.muted,fontStyle:"italic"}}>Aucune cause renseignée pour l'instant.</div>}
          {topCauses.length > 0 && (
            <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden"}}>
              {topCauses.slice(0, 5).map(([cause, n], i) => (
                <div key={cause} style={{display:"flex",justifyContent:"space-between",padding:"6px 10px",borderBottom:i<4?"1px solid "+C.border:"none",fontSize:"11.5px"}}>
                  <span>{cause}</span><b style={{color:C.or}}>{n}</b>
                </div>
              ))}
            </div>
          )}
        </div>

        {agregatsPredictifs && (
          <div style={{background:"#F3F4F6",border:"1px solid "+C.border,borderRadius:"8px",padding:"9px 12px",fontSize:"10.5px",color:C.muted,marginBottom:"18px"}}>
            📈 Socle prédictif : {agregatsPredictifs.nbEchantillonsDuree > 0
              ? "durée moyenne d'intervention ≈ " + agregatsPredictifs.dureeMoyenneMin + " min (sur " + agregatsPredictifs.nbEchantillonsDuree + " intervention(s) chronométrée(s))"
              : "durée moyenne d'intervention non disponible — aucune intervention chronométrée pour l'instant (prêt à se remplir dès qu'un suivi de durée sera saisi)."}
            {" "}Évolution du coût SAV sur {agregatsPredictifs.evolutionCoutSAVMensuel.filter(m => m.valeur > 0).length} des 6 derniers mois — historique en cours de constitution.
          </div>
        )}

        <div style={{borderTop:"1px solid "+C.border,paddingTop:"14px",marginBottom:"14px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"8px"}}>Synthèse IA &amp; recommandations</div>
          {chargementSynthese && <div style={{fontSize:"11px",color:C.muted,fontStyle:"italic"}}>⏳ IKO rédige la synthèse...</div>}
          {syntheseErreur && !chargementSynthese && (
            <div style={{fontSize:"11px",color:C.rouge,marginBottom:"8px"}}>{syntheseErreur} <span onClick={genererSynthese} style={{textDecoration:"underline",cursor:"pointer"}}>Réessayer</span></div>
          )}
          {syntheseIA && !chargementSynthese && (
            <div style={{background:"rgba(var(--iko-dark-rgb),0.05)",border:"1px solid rgba(var(--iko-dark-rgb),0.15)",borderRadius:"10px",padding:"12px 14px"}}>
              <div style={{fontSize:"12px",color:"var(--iko-bg-sombre)",marginBottom:"10px",whiteSpace:"pre-wrap"}}>{syntheseIA.synthese}</div>
              {Array.isArray(syntheseIA.recommandations) && syntheseIA.recommandations.length > 0 && (
                <ul style={{margin:0,paddingLeft:"18px",fontSize:"11.5px",color:"var(--iko-bg-sombre)"}}>
                  {syntheseIA.recommandations.map((r, i) => <li key={i} style={{marginBottom:"4px"}}>{r}</li>)}
                </ul>
              )}
              <div style={{fontSize:"9.5px",color:C.muted,marginTop:"8px",fontStyle:"italic"}}>Générée à partir des chiffres ci-dessus uniquement — à valider par la direction.</div>
            </div>
          )}
        </div>

        <button onClick={onClose} style={{width:"100%",padding:"11px",background:"var(--iko-bg-sombre)",color:"#fff",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:"pointer"}}>Fermer</button>
      </div>
    </div>
  );
}

function ModalNotes({ tickets, onClose }) {
  const [agenceFiltreNotes, setAgenceFiltreNotes] = React.useState("global");
  const [exportDebutNotes, setExportDebutNotes] = React.useState("");
  const [exportFinNotes, setExportFinNotes] = React.useState("");

  const notes = tickets
    .filter(t => typeof t.fields?.Note === "number" && (agenceFiltreNotes==="global" || t.fields?.Agence===AGENCE_VERS_AIRTABLE[agenceFiltreNotes]))
    .filter(t => {
      const d = parseDateCreneau(t.fields?.Créneau);
      const matchDebut = !exportDebutNotes || d >= new Date(exportDebutNotes+'T00:00:00');
      const matchFin = !exportFinNotes || d <= new Date(exportFinNotes+'T23:59:59');
      return matchDebut && matchFin;
    })
    .sort((a,b) => (b.fields?.Name||"").localeCompare(a.fields?.Name||""));

  const moyenne = notes.length ? (notes.reduce((s,t) => s + t.fields.Note, 0) / notes.length) : null;

  const nomFichierNotes = (ext) => {
    const ag = agenceFiltreNotes==="global" ? "Toutes-agences" : agenceFiltreNotes.replace(/[^\w]+/g,"-");
    const periode = (exportDebutNotes||exportFinNotes) ? (exportDebutNotes||"...")+"_"+(exportFinNotes||"...") : "complet";
    return "IkoSuite_Avis_"+ag+"_"+periode+"."+ext;
  };

  const exportExcelNotes = () => {
    if (notes.length === 0) { alert("Aucun avis ne correspond aux filtres sélectionnés."); return; }
    const rows = notes.map(t => ({
      "N° Ticket": t.fields?.Name || "",
      "Agence": t.fields?.Agence || "",
      "Client": t.fields?.Client || "",
      "Produit": t.fields?.Produit || "",
      "Problème": t.fields?.Problème || "",
      "Note": t.fields?.Note || "",
      "Commentaire": t.fields?.["Note Commentaire"] || "",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.max(k.length, 14) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Avis clients");
    XLSX.writeFile(wb, nomFichierNotes("xlsx"));
  };

  const exportPDFNotes = () => {
    if (notes.length === 0) { alert("Aucun avis ne correspond aux filtres sélectionnés."); return; }
    const ag = agenceFiltreNotes==="global" ? "Toutes agences" : agenceFiltreNotes;
    const periode = (exportDebutNotes||exportFinNotes) ? "Du "+(exportDebutNotes||"...")+" au "+(exportFinNotes||"...") : "Toutes dates";
    const lignes = notes.map(t => `
      <tr>
        <td>${t.fields?.Name||""}</td>
        <td>${t.fields?.Agence||""}</td>
        <td>${t.fields?.Client||""}</td>
        <td>${t.fields?.Produit||""} — ${t.fields?.Problème||""}</td>
        <td>${"★".repeat(t.fields.Note)}${"☆".repeat(5-t.fields.Note)}</td>
        <td>${t.fields?.["Note Commentaire"]||""}</td>
      </tr>`).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Avis clients Iko Suite</title>
      <style>
        body{font-family:Arial,sans-serif;padding:24px;color:#111;}
        h1{color:#111;font-size:18px;margin-bottom:2px;}
        .sub{color:#666;font-size:11px;margin-bottom:16px;}
        table{width:100%;border-collapse:collapse;font-size:10px;}
        th{background:#111;color:#fff;text-align:left;padding:6px 8px;}
        td{border-bottom:1px solid #ddd;padding:6px 8px;}
        tr:nth-child(even){background:#f7f7f7;}
        .footer{margin-top:16px;font-size:9px;color:#999;}
        @media print { @page { size: landscape; margin: 12mm; } }
      </style></head><body>
      <h1>Iko Suite — Export avis clients</h1>
      <div class="sub">${ag} — ${periode} — ${notes.length} avis — note moyenne ${moyenne?moyenne.toFixed(1):"—"}/5 — généré le ${new Date().toLocaleDateString('fr-FR')}</div>
      <table><thead><tr>
        <th>N° Ticket</th><th>Agence</th><th>Client</th><th>Produit / Problème</th><th>Note</th><th>Commentaire</th>
      </tr></thead><tbody>${lignes}</tbody></table>
      <div class="footer">Iko Suite — Document généré automatiquement</div>
      </body></html>`;
    const w = window.open('', '_blank');
    w.document.write(html);
    w.document.close();
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box" style={{maxWidth:"760px",width:"95%"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"18px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
            <button onClick={onClose} style={{background:"#F3F4F6",border:"1px solid "+C.border,color:C.text,borderRadius:"8px",padding:"7px 14px",fontSize:"12px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>← Retour</button>
            <div>
              <div style={{fontSize:"17px",fontWeight:"900",color:C.white}}>⭐ Avis clients</div>
              <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{moyenne ? moyenne.toFixed(1)+" / 5 — " : ""}{notes.length} avis{agenceFiltreNotes==="global"?" — toutes agences":" — "+agenceFiltreNotes}</div>
            </div>
          </div>
          <button onClick={onClose} style={{background:"#F3F4F6",border:"1px solid "+C.border,color:C.muted,borderRadius:"8px",width:"32px",height:"32px",cursor:"pointer",fontSize:"16px"}}>✕</button>
        </div>

        <div style={{display:"flex",gap:"8px",marginBottom:"16px",flexWrap:"wrap"}}>
          {(AGENCES.length > 1 ? ["global",...AGENCES] : []).map(a => (
            <button key={a} onClick={() => setAgenceFiltreNotes(a)}
              style={{padding:"7px 16px",borderRadius:"20px",border:"1px solid "+(agenceFiltreNotes===a?C.or:C.border),background:agenceFiltreNotes===a?C.or:"transparent",color:agenceFiltreNotes===a?"var(--iko-dark)":C.muted,fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>
              {a==="global"?"🌐 Toutes agences":a}
            </button>
          ))}
        </div>

        <div style={{background:"#F3F4F6",border:"1px solid "+C.border,borderRadius:"12px",padding:"14px 16px",marginBottom:"18px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"10px"}}>📤 Export (respecte le filtre agence ci-dessus)</div>
          <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
            <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
              <span style={{fontSize:"11px",color:C.muted}}>Du</span>
              <input type="date" value={exportDebutNotes} onChange={e => setExportDebutNotes(e.target.value)} style={{width:"140px"}}/>
              <span style={{fontSize:"11px",color:C.muted}}>au</span>
              <input type="date" value={exportFinNotes} onChange={e => setExportFinNotes(e.target.value)} style={{width:"140px"}}/>
              {(exportDebutNotes||exportFinNotes) && (
                <button onClick={() => { setExportDebutNotes(""); setExportFinNotes(""); }} style={{background:"none",border:"none",color:C.muted,fontSize:"11px",cursor:"pointer",textDecoration:"underline"}}>Effacer</button>
              )}
            </div>
            <div style={{display:"flex",gap:"8px",marginLeft:"auto"}}>
              <button onClick={exportExcelNotes} style={{background:C.vertDim,border:"1px solid rgba(var(--iko-primary-rgb),0.4)",color:C.vert,borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>📊 Excel</button>
              <button onClick={exportPDFNotes} style={{background:C.orDim,border:"1px solid "+C.orBord,color:C.or,borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>🖨️ PDF</button>
            </div>
          </div>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:"10px",maxHeight:"420px",overflowY:"auto"}}>
          {notes.length === 0 && (
            <div style={{textAlign:"center",padding:"40px",color:C.muted,border:"1px dashed "+C.border,borderRadius:"12px"}}>Aucun avis pour cette sélection</div>
          )}
          {notes.map(t => (
            <div key={t.id} style={{background:C.card,border:"1px solid "+C.border,borderRadius:"10px",padding:"14px 16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6px"}}>
                <div>
                  <span style={{fontSize:"11px",fontWeight:"900",color:C.or,fontFamily:"monospace"}}>{t.fields?.Name}</span>
                  <span style={{fontSize:"11px",color:C.muted,marginLeft:"10px"}}>{t.fields?.Agence}</span>
                </div>
                <div style={{color:"var(--iko-primary)",fontSize:"14px"}}>{"⭐".repeat(t.fields.Note)}{"☆".repeat(5-t.fields.Note)}</div>
              </div>
              <div style={{fontSize:"13px",fontWeight:"700",color:C.white,marginBottom:"4px"}}>{t.fields?.Client}</div>
              <div style={{fontSize:"11px",color:C.muted,marginBottom:"8px"}}>{t.fields?.Produit} — {t.fields?.Problème}</div>
              {t.fields?.["Note Commentaire"] && (
                <div style={{background:"#F3F4F6",borderRadius:"8px",padding:"8px 10px",fontSize:"11px",color:"#374151",fontStyle:"italic"}}>💬 {t.fields["Note Commentaire"]}</div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ModalAnnulation({ ticket, onConfirm, onClose, motifInitial }) {
  const [motif, setMotif] = React.useState(motifInitial || "");
  const [saving, setSaving] = React.useState(false);

  const valider = async () => {
    if (!motif.trim()) return;
    setSaving(true);
    await onConfirm(ticket, motif);
    setSaving(false);
  };

  return (

// ==================== Planification intelligente techniciens V1 ====================
// Lecture seule, purement déterministe (aucun appel réseau, aucun LLM) :
// propose un ordre de tournée à partir des créneaux et tickets déjà chargés
// par PlanningView (byDate / ticketsByPlanning) et de la config techniciens
// déjà chargée côté client (CONFIG_ENTREPRISE.techniciens, par agence — un
// seul technicien par agence dans ce système, cf. ModalConcepteur). Ne
// modifie jamais un créneau, n'invente jamais une localisation/durée/
// disponibilité absente des données.
const ORDRE_CRENEAU_IKO = { "Matin (8h30 — 12h00)": 0, "Après-midi (13h00 — 17h00)": 1 };

function extraireCodePostalIKO(adresse) {
  const m = String(adresse || "").match(/\b\d{5}\b/);
  return m ? m[0] : null;
}

function nomTechnicienAgenceIKO(agenceLabel) {
  const t = (CONFIG_ENTREPRISE.techniciens || {})[agenceLabel];
  if (t && (t.prenom || t.nom)) return (t.prenom || "") + " " + (t.nom || "");
  return agenceLabel || "Technicien non identifié";
}

function genererPropositionsPlanningIKO(slotsJour, ticketsByPlanning) {
  const parAgence = {};
  slotsJour.forEach(s => {
    const agence = s.fields?.Agence || "—";
    if (!parAgence[agence]) parAgence[agence] = [];
    parAgence[agence].push(s);
  });

  return Object.keys(parAgence).map(agence => {
    const items = parAgence[agence].map(s => {
      const ticket = ticketsByPlanning[s.id] || null;
      return {
        slotId: s.id,
        creneau: s.fields?.Créneau || "",
        ticket,
        urgent: ticket?.Qualification === "Oui",
        cp: ticket ? extraireCodePostalIKO(ticket.Adresse) : null,
      };
    });

    const items_avec_ticket = items.filter(it => it.ticket);
    const sansTicket = items.length - items_avec_ticket.length;

    // Tri : créneau (Matin avant Après-midi, seule donnée d'horaire fiable
    // déjà présente), puis urgence, puis regroupement par code postal quand
    // identifiable — jamais une distance calculée ou une localisation
    // inventée.
    const ordre = [...items_avec_ticket].sort((a, b) => {
      const ca = ORDRE_CRENEAU_IKO[a.creneau] ?? 0.5;
      const cb = ORDRE_CRENEAU_IKO[b.creneau] ?? 0.5;
      if (ca !== cb) return ca - cb;
      if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;
      if (a.cp && b.cp && a.cp !== b.cp) return a.cp.localeCompare(b.cp);
      return 0;
    });

    const contraintes = [];
    if (sansTicket > 0) contraintes.push(sansTicket + " créneau(x) sans ticket lié (exclu de l'ordre proposé, à vérifier manuellement).");
    const cpManquants = items_avec_ticket.filter(it => !it.cp).length;
    if (cpManquants > 0) contraintes.push(cpManquants + " adresse(s) sans code postal identifiable (proximité non déductible).");

    let confiance = "faible";
    let justification;
    if (items_avec_ticket.length === 0) {
      justification = "Aucun ticket lié aux créneaux de cette agence ce jour : données insuffisantes pour une proposition.";
    } else if (items_avec_ticket.length === 1) {
      justification = "Une seule intervention ce jour pour cette agence : aucun ordre à proposer, donnée insuffisante pour une tournée.";
    } else {
      const parties = [items_avec_ticket.length + " intervention(s) ce jour pour cette agence, ordonnées par créneau (Matin avant Après-midi)"];
      if (items_avec_ticket.some(it => it.urgent)) parties.push("en priorisant les interventions urgentes (Qualification = Oui)");
      const cpDistincts = new Set(items_avec_ticket.filter(it => it.cp).map(it => it.cp));
      if (cpDistincts.size && cpDistincts.size < items_avec_ticket.length) parties.push("en regroupant les adresses de même code postal quand identifiable");
      justification = parties.join(", ") + ".";
      confiance = cpManquants === 0 ? "fort" : "moyen";
    }

    return {
      agence,
      technicien: nomTechnicienAgenceIKO(agence),
      interventions: ordre.map((it, i) => ({
        ordre: i + 1,
        ticket: it.ticket.Name || "",
        client: it.ticket.Client || "",
        creneau: it.creneau,
        urgent: it.urgent,
        cp: it.cp,
      })),
      justification,
      contraintes,
      confiance,
    };
  }).filter(p => p.interventions.length > 0 || p.contraintes.length > 0);
}

const LABELS_CONFIANCE_PLANNING_IKO = { faible: "Confiance faible", moyen: "Confiance moyenne", fort: "Confiance forte" };
const COULEURS_CONFIANCE_PLANNING_IKO = { faible: "#8a8a8a", moyen: "var(--iko-primary)", fort: "var(--iko-primary)" };

function PropositionPlanningIKO({ date, slotsJour, ticketsByPlanning }) {
  const propositions = React.useMemo(

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"6px",marginBottom:"4px"}}>
              <span style={{fontSize:"11px",fontWeight:"700",color:C.white}}>👤 {p.technicien}</span>

              </span>
            </div>
            {p.interventions.length > 0 && (
              <div style={{display:"flex",flexDirection:"column",gap:"2px",marginBottom:"4px"}}>
                {p.interventions.map(iv => (
                  <div key={iv.ordre} style={{fontSize:"10px",color:C.text}}>

                  </div>

            <div style={{fontSize:"10px",color:C.muted}}>{p.justification}</div>

    </div>
  );
}

function PlanningView({ agenceFilter, onOpenTicket }) {
  const [sousVue, setSousVue] = React.useState("calendrier"); // "calendrier" | "liste"
  const [annee, setAnnee] = React.useState(new Date().getFullYear());
  const [slots, setSlots] = React.useState([]);
  const [ticketsByPlanning, setTicketsByPlanning] = React.useState({});
  const [loading, setLoading] = React.useState(true);
  const [jourSelectionne, setJourSelectionne] = React.useState(null);

  const charger = async () => {
    setLoading(true);
    try {
      await window.IKO_CLIENT_READY;
      const condAgence = agenceFilter !== "global" ? ',{Agence}="'+AGENCE_VERS_AIRTABLE[agenceFilter]+'"' : '';
      const rawFilter = 'AND({Statut}="Pris",DATETIME_FORMAT({Date},"YYYY")="'+annee+'"'+condAgence+')';
      const filter = encodeURIComponent(filtreAvecClient(rawFilter));
      const r = await fetch('/api/airtable/Planning?filterByFormula='+filter+'&sort[0][field]=Date&sort[0][direction]=asc&maxRecords=1000', {});
      const json = await r.json();
      const slotsData = (json.records||[]).filter(appartientAuClient);
      setSlots(slotsData);

      // Charger les tickets SAV liés à un créneau (champ PlanningID = ID du record Planning)
      const filterTickets = encodeURIComponent('NOT({PlanningID}="")');
      const rt = await fetch('/api/airtable/tenant/Tickets SAV?filterByFormula='+filterTickets+'&maxRecords=1000', {});
      const jt = await rt.json();
      const map = {};
      (jt.records||[]).forEach(t => {
        if (t.fields?.PlanningID) map[t.fields.PlanningID] = t.fields;
      });
      setTicketsByPlanning(map);
    } catch(e) { console.error(e); }
    setLoading(false);
  };
  React.useEffect(() => { charger(); }, [agenceFilter, annee]);

  const byDate = {};
  slots.forEach(s => { const d = s.fields?.Date; if (!byDate[d]) byDate[d] = []; byDate[d].push(s); });
  const today = new Date().toISOString().split('T')[0];
  const MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const JOURS = ["L","M","M","J","V","S","D"];

    if (n <= 0) return null;

    return { bg: C.or, color: "var(--iko-dark)" };
  };

  // Ouvre directement le ticket si un seul RDV ce jour-là, sinon propose
  // une petite liste à choisir (cas rare : 2 créneaux le même jour).
  const ouvrirJour = (dateStr) => {
    const s = byDate[dateStr] || [];

                      <div style={{fontSize:"11px",color:C.muted,display:"flex",gap:"5px",gridColumn:"1 / -1"}}><span>🔧</span><span style={{color:C.text}}>{ticket.Problème||"—"}</span></div>
                      {ticket.Name && <div style={{fontSize:"10px",color:C.or,fontFamily:"monospace",gridColumn:"1 / -1",marginTop:"2px"}}>{ticket.Name}</div>}
                    </div>
                  ) : (
                    <div style={{marginTop:"6px",fontSize:"10px",color:C.muted,fontStyle:"italic"}}>Aucun ticket lié à ce créneau</div>
                  )}
                </div>
              );})}
            </div>
            <PropositionPlanningIKO date={date} slotsJour={byDate[date]} ticketsByPlanning={ticketsByPlanning}/>
          </div>
        );
      })}

      {jourSelectionne && (
        <div className="modal-overlay" onClick={() => setJourSelectionne(null)}>
          <div className="modal-box" onClick={e => e.stopPropagation()} style={{maxWidth:"420px"}}>
            <div style={{fontSize:"14px",fontWeight:"700",color:"var(--iko-dark)",marginBottom:"12px"}}>
              📅 RDV du {new Date(jourSelectionne+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
              {(byDate[jourSelectionne]||[]).map((s,i) => {
                const ticket = ticketsByPlanning[s.id];
                return (
                  <div key={i} style={{border:"1px solid #E5E7EB",borderRadius:"8px",padding:"10px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"8px"}}>
                    <div>
                      <div style={{fontSize:"12px",fontWeight:"700",color:"var(--iko-dark)"}}>{s.fields?.Créneau?.replace("Matin (8h30 — 12h00)","🌅 Matin").replace("Après-midi (13h00 — 17h00)","🌇 Après-midi")}</div>
                      <div style={{fontSize:"11px",color:"var(--iko-texte-clair)"}}>{ticket?.Client || "Client inconnu"} · {s.fields?.Agence}</div>
                    </div>
                    {ticket?.Name ? (
                      <button onClick={() => { onOpenTicket(ticket.Name); setJourSelectionne(null); }}
                        style={{background:"var(--iko-primary)",color:"var(--iko-dark)",border:"none",borderRadius:"6px",padding:"6px 10px",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>
                        Ouvrir
                      </button>
                    ) : (
                      <span style={{fontSize:"10px",color:"#9CA3AF"}}>Sans ticket lié</span>
                    )}
                  </div>
                );
              })}
            </div>
            <button onClick={() => setJourSelectionne(null)} style={{marginTop:"14px",width:"100%",background:"#F3F4F6",border:"1px solid #E5E7EB",color:"#374151",borderRadius:"8px",padding:"8px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>Fermer</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Dashboard({ agenceAccess, onClose }) {
  const [tickets, setTickets] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [agenceFilter, setAgenceFilter] = React.useState(agenceAccess === "global" ? "global" : agenceAccess);
  const [vue, setVue] = React.useState("tickets");
  const [search, setSearch] = React.useState("");
  const [statutFilter, setStatutFilter] = React.useState("tous");
  const [urgentOnly, setUrgentOnly] = React.useState(false);
  const [messagesOnly, setMessagesOnly] = React.useState(false);
  const [rdvModifieOnly, setRdvModifieOnly] = React.useState(false);
  const [notifOuvert, setNotifOuvert] = React.useState(false);
  const [suiviIKOOuvert, setSuiviIKOOuvert] = React.useState(false); // Bloc 5 : zone "À traiter", ouverte par défaut
  const [openMessageTicketId, setOpenMessageTicketId] = React.useState(null);
  const [amandineOuverte, setAmandineOuverte] = React.useState(false);
  const [amandineEcoute, setAmandineEcoute] = React.useState(false);
  const [amandineEnCours, setAmandineEnCours] = React.useState(false);
  const [amandineDernier, setAmandineDernier] = React.useState("");
  const [ikoHistorique, setIkoHistorique] = React.useState([]);
  const [amandineErreur, setAmandineErreur] = React.useState("");
  const [vueMode, setVueMode] = React.useState("vocal");
  const [amandineTexte, setAmandineTexte] = React.useState("");
  const [sortBy, setSortBy] = React.useState("date");
  const [lastRefresh, setLastRefresh] = React.useState(null);
  const [showModalRdv, setShowModalRdv] = React.useState(false);
  const [rdvPrefillAgence, setRdvPrefillAgence] = React.useState(null);
  const [blocagePrefill, setBlocagePrefill] = React.useState(null); // {agence, dateDebut, dateFin, motif}
  const [annulationMotifPrefill, setAnnulationMotifPrefill] = React.useState("");
  const [showModalBlocage, setShowModalBlocage] = React.useState(false);
  const [showModalFacturation, setShowModalFacturation] = React.useState(false);
  const [showModalConcepteur, setShowModalConcepteur] = React.useState(false);
  const [showModalAnalytics, setShowModalAnalytics] = React.useState(false);
  const [showModalIntelligenceCommerciale, setShowModalIntelligenceCommerciale] = React.useState(false);
  const [showModalDirigeant, setShowModalDirigeant] = React.useState(false);
  const [debugInfo, setDebugInfo] = React.useState(null);
  const [debugOuvert, setDebugOuvert] = React.useState(false);
  const [exportOuvert, setExportOuvert] = React.useState(false);
  const [, forcerRender] = React.useState(0);

  React.useEffect(() => {
    fetch('/api/airtable/Planning/' + CONFIG_RECORD_ID)
      .then(r => r.json())
      .then(json => {
        const n = json.fields?.["Nombre agences"];
        if (n) appliquerNombreAgences(n);
        const brut = json.fields?.["Config JSON"];
        if (brut) { try { appliquerConfigEntreprise(JSON.parse(brut)); } catch(e) {} }
        forcerRender(x => x + 1);
      })
      .catch(() => {});
    // Si un client est charge (?client=slug), ses couleurs/logo prennent
    // le pas sur la config demo generique ci-dessus.
    window.IKO_CLIENT_READY.then(() => {
      const info = window.IKO_CLIENT_INFO;
      if (!info) return;
      if (info["Nombre agences"]) appliquerNombreAgences(info["Nombre agences"]);
      chargerNomsAgencesClient().then(noms => { if (noms) { appliquerNomsAgences(noms); forcerRender(x => x + 1); } });
      appliquerConfigEntreprise({
        couleurAccent: info["Couleur principale"] || CONFIG_ENTREPRISE.couleurAccent,
        logoUrl: (info["Logo"] && info["Logo"][0] && info["Logo"][0].url) || CONFIG_ENTREPRISE.logoUrl,
        emailsTechnicien: CONFIG_ENTREPRISE.emailsTechnicien,
        techniciens: CONFIG_ENTREPRISE.techniciens,
      });
      forcerRender(x => x + 1);
    });
  }, []);
  const [showModalGestionDevis, setShowModalGestionDevis] = React.useState(false);
  const [showModalNotes, setShowModalNotes] = React.useState(false);
  const [successTicket, setSuccessTicket] = React.useState(null);
  const [modalAnnulation, setModalAnnulation] = React.useState(null);
  const [modalSuppression, setModalSuppression] = React.useState(null);
  const [modalSuppressionDefinitive, setModalSuppressionDefinitive] = React.useState(null);
  const [modalDevis, setModalDevis] = React.useState(null);
  const [exportDebut, setExportDebut] = React.useState("");
  const [exportFin, setExportFin] = React.useState("");
  const [notifs, setNotifs] = React.useState([]);
  const idsConnusRef = React.useRef(null);
  // Suivi séparé de l'état du flag "RDV modifié - notif technicien" par ticket,
  // pour détecter une TRANSITION false->true sur un ticket déjà connu (donc une
  // modification), distincte de l'apparition d'un ticket tout neuf (checkNouveaux
  // ci-dessous). Le Dashboard ne consomme JAMAIS ce flag (ne le remet pas à false) :
  // seul technicien.html le fait, pour éviter toute course entre les deux pages.
  const rdvFlagsConnusRef = React.useRef(null);
  // Bloc 4 - point 2 : même principe que rdvFlagsConnusRef ci-dessus, mais
  // pour détecter la transition false/absent -> true du flag "IKO Utilisé"
  // (diagnostic Max gardé/fusionné à la clôture). Dashboard ne remet jamais
  // ce flag à false — seul technicien.html l'écrit.
  const diagFlagsConnusRef = React.useRef(null);
  const audioCtxRef = React.useRef(null);
  const isFetchingRef = React.useRef(false);

  const jouerSon = () => {
    try {
      if (!audioCtxRef.current) {
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = audioCtxRef.current;
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(740, ctx.currentTime);
      o.frequency.setValueAtTime(988, ctx.currentTime + 0.12);
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      o.start(); o.stop(ctx.currentTime + 0.5);
      o.onended = () => { o.disconnect(); g.disconnect(); };
    } catch(e) {}
  };

  const charger = async () => {
    if (isFetchingRef.current) return;
    isFetchingRef.current = true;
    setLoading(true);
    try {
      await window.IKO_CLIENT_READY;
      let rawFilter = agenceFilter !== "global" ? '{Agence}="'+AGENCE_VERS_AIRTABLE[agenceFilter]+'"' : "";
      rawFilter = filtreAvecClient(rawFilter);
      let filter = rawFilter ? encodeURIComponent(rawFilter) : "";
      const url = '/api/airtable/tenant/Tickets SAV?'+(filter?'filterByFormula='+filter+'&':'')+'sort[0][field]=Name&sort[0][direction]=desc&maxRecords=200';
      const r = await fetch(url, {});
      const json = await r.json();
      const records = json.records||[];
      setTickets(records);
      setLastRefresh(new Date().toLocaleTimeString('fr-FR'));
      setDebugInfo({
        url, statut: r.status, nbResultats: records.length,
        rawFilter, agenceFilter, agenceMappee: AGENCE_VERS_AIRTABLE[agenceFilter],
        clientId: window.IKO_CLIENT_ID || "(aucun — ?client= non détecté)",
        erreurApi: json.error ? JSON.stringify(json.error) : null,
      });
    } catch(e) {
      console.error(e);
      setDebugInfo({ erreurJs: String(e) });
    }
    setLoading(false);
    isFetchingRef.current = false;
  };

  // Detection des nouveaux tickets (notifications en haut a droite) :
  // volontairement INDEPENDANTE du filtre agence choisi a l'ecran. Avant,
  // cette detection utilisait la liste deja filtree par agence : changer de
  // filtre (ex: Agence 1 -> Toutes agences) faisait passer plein de tickets
  // "jamais vus SOUS CE FILTRE" pour des tickets "nouveaux", declenchant une
  // avalanche de fausses notifications en haut a droite. On fait donc
  // toujours cette verification sur la liste COMPLETE, non filtree.
  const isCheckingNouveauxRef = React.useRef(false);
  const checkNouveaux = async () => {
    if (isCheckingNouveauxRef.current) return;
    isCheckingNouveauxRef.current = true;
    try {
      await window.IKO_CLIENT_READY;
      const cf = filtreAvecClient("");
      const fp = cf ? 'filterByFormula='+encodeURIComponent(cf)+'&' : '';
      const r = await fetch('/api/airtable/tenant/Tickets SAV?'+fp+'sort[0][field]=Name&sort[0][direction]=desc&maxRecords=200', {});
      const json = await r.json();
      const records = json.records||[];
      const idsActuels = new Set(records.map(t => t.id));
      const flagsActuels = new Map(records.map(t => [t.id, !!t.fields?.["RDV modifié - notif technicien"]]));
      const diagFlagsActuels = new Map(records.map(t => [t.id, !!t.fields?.["IKO Utilisé"]]));
      if (idsConnusRef.current) {
        const nouveaux = records.filter(t => !idsConnusRef.current.has(t.id));
        if (nouveaux.length > 0) {
          jouerSon();
          const toasts = nouveaux.map(t => ({
            id: t.id + '-' + Date.now(),
            texte: '🆕 ' + (t.fields?.Name||'Nouveau ticket') + ' — ' + (t.fields?.Client||'Client inconnu') + ' (' + (t.fields?.Agence||'') + ')'
          }));
          setNotifs(prev => [...prev, ...toasts]);
          toasts.forEach(t => setTimeout(() => setNotifs(prev => prev.filter(n => n.id !== t.id)), 7000));
        }
        // RDV modifiés : uniquement sur des tickets DÉJÀ connus (jamais les nouveaux
        // ci-dessus, pour ne jamais mélanger les deux notifications) dont le flag
        // passe de false/absent à true entre deux vérifications.
        if (rdvFlagsConnusRef.current) {
          const rdvModifies = records.filter(t =>
            idsConnusRef.current.has(t.id) &&
            flagsActuels.get(t.id) === true &&
            rdvFlagsConnusRef.current.get(t.id) !== true
          );
          if (rdvModifies.length > 0) {
            jouerSon();
            const toastsRdv = rdvModifies.map(t => ({
              id: t.id + '-rdv-' + Date.now(),
              texte: '🔄 RDV modifié — ' + (t.fields?.Name||'Ticket') + ' — ' + (t.fields?.Client||'Client inconnu') + ' (' + (t.fields?.Agence||'') + ')'
            }));
            setNotifs(prev => [...prev, ...toastsRdv]);
            toastsRdv.forEach(t => setTimeout(() => setNotifs(prev => prev.filter(n => n.id !== t.id)), 7000));
          }
        }
        // Bloc 4 - point 2 : même logique de transition, sur "IKO Utilisé"
        // (diagnostic Max gardé ou fusionné à la clôture). Même garde-fou
        // anti-doublon (uniquement sur tickets déjà connus, transition stricte).
        if (diagFlagsConnusRef.current) {
          const diagnosticsMax = records.filter(t =>
            idsConnusRef.current.has(t.id) &&
            diagFlagsActuels.get(t.id) === true &&
            diagFlagsConnusRef.current.get(t.id) !== true
          );
          if (diagnosticsMax.length > 0) {
            jouerSon();
            const toastsDiag = diagnosticsMax.map(t => ({
              id: t.id + '-diag-' + Date.now(),
              texte: '🧠 Diagnostic Max disponible — ' + (t.fields?.Name||'Ticket') + ' — ' + (t.fields?.Client||'Client inconnu') + ' (' + (t.fields?.Agence||'') + ')'
            }));
            setNotifs(prev => [...prev, ...toastsDiag]);
            toastsDiag.forEach(t => setTimeout(() => setNotifs(prev => prev.filter(n => n.id !== t.id)), 7000));
          }
        }
      }
      idsConnusRef.current = idsActuels;
      rdvFlagsConnusRef.current = flagsActuels;
      diagFlagsConnusRef.current = diagFlagsActuels;
    } catch(e) { console.error(e); }
    isCheckingNouveauxRef.current = false;
  };

  React.useEffect(() => { charger(); }, [agenceFilter]);
  // Plus d'auto-rafraîchissement en tâche de fond (c'était toutes les ~3s,
  // ce qui épuise en quelques heures le quota Airtable du plan Free —
  // 1000 appels/mois). La liste se recharge au chargement de la page, au
  // changement de filtre agence, et via le bouton ↺ manuel. Les actions
  // (changer un statut, etc.) mettent déjà à jour l'affichage localement
  // sans requête supplémentaire.
  //
  // La détection de nouveaux tickets (notifications 🆕) reste en tâche de
  // fond mais à un intervalle bien plus large (~90-100s au lieu de ~3s) :
  // c'est la seule chose qui a vraiment besoin de tourner sans action de
  // l'utilisateur. Fermer l'onglet quand le dashboard n'est pas activement
  // utilisé reste le meilleur moyen d'économiser le quota.
  React.useEffect(() => {
    checkNouveaux();
    let timeoutId;
    const tick = () => {
      checkNouveaux();
      timeoutId = setTimeout(tick, 90000 + Math.random() * 10000);
    };
    timeoutId = setTimeout(tick, 90000 + Math.random() * 10000);
    return () => clearTimeout(timeoutId);
  }, []);

  // ── Canular Pascal ───────────────────────────────────────────────────
  // Bouton discret "●" dans le bandeau (à côté du ✕ fermer) : enchaîne les
  // 10 fichiers audio ElevenLabs. Fichiers :
  // /audio/canular-pascal/pascal-01.mp3 … pascal-10.mp3
  const canularEnCoursRef = React.useRef(false);

  const jouerCanularPascal = () => {
    if (canularEnCoursRef.current) return;
    canularEnCoursRef.current = true;
    // Pause (ms) après le fichier i, avant le suivant — calées sur le script :
    // 1 "Bonjour Stéphane, comment vas-tu ?"        → Stéphane répond en direct
    // 2 "Très bien merci... Comment allez-vous ?"    → Pascal réagit en direct
    // 3 "Alors, venu donner un coup de main..."      → Pascal réagit en direct
    // 4 "Attendez un peu... Caloune..."              → s'enchaîne direct sur 5
    // 5 "Bon, Stéphane, active ton déménagement..."  → Stéphane répond en direct
    // 6 "Ok ok, mais n'oublie pas..."                → s'enchaîne direct sur 7
    // 7 "Pascal ?"                                    → Pascal répond en direct
    // 8 "Un sacré petit frère..."                     → Pascal réagit en direct
    // 9 "Remarquez, ça n'a rien d'étonnant..."        → Stéphane rit
    // 10 "Bon allez, je vous laisse en famille..."    → fin
    const CANULAR_PAUSES_MS = [2500, 4000, 4000, 0, 3000, 0, 2500, 4000, 3000, 0];
    const jouerFichier = (i) => {
      if (i > 10) { canularEnCoursRef.current = false; return; }
      const n = String(i).padStart(2, "0");
      const audio = new Audio(`/audio/canular-pascal/pascal-${n}.mp3`);
      audio.onended = () => setTimeout(() => jouerFichier(i + 1), CANULAR_PAUSES_MS[i - 1] || 0);
      audio.onerror = () => { canularEnCoursRef.current = false; };
      audio.play().catch(() => { canularEnCoursRef.current = false; });
    };
    jouerFichier(1);
  };

  const renvoyerMailTechnicien = (ticketId) => {
    if (!confirm('Renvoyer le mail au technicien pour le ticket ' + ticketId + ' ?')) return;
    fetch(WEBHOOK + '?action=renvoi_technicien&ticket=' + encodeURIComponent(ticketId))
      .then(() => alert('✓ Mail renvoyé au technicien !'))
      .catch(() => alert('❌ Erreur lors de l\'envoi'));
  };

  const renvoyerMailClient = (ticketId) => {
    if (!confirm('Renvoyer le mail de confirmation au client pour le ticket ' + ticketId + ' ?')) return;
    fetch(WEBHOOK + '?action=renvoi_client&ticket=' + encodeURIComponent(ticketId))
      .then(() => alert('✓ Mail renvoyé au client !'))
      .catch(() => alert('❌ Erreur lors de l\'envoi'));
  };

  const marquerMessageLu = async (ticket) => {
    setTickets(prev => prev.map(t => t.id===ticket.id?{...t,fields:{...t.fields,"Message client non lu":false}}:t));
    try {
      await fetch('/api/airtable/tenant/Tickets%20SAV/'+ticket.id, {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({fields:{"Message client non lu": false}})
      });
    } catch(e) { console.error(e); }
  };

  // Rafraîchit uniquement les champs d'un ticket (utilisé pour le polling 3s
  // de la fenêtre SMS ouverte, sans recharger toute la liste).
  const rafraichirTicketMessage = async (ticketId) => {
    try {
      const resp = await fetch('/api/airtable/tenant/Tickets%20SAV/' + ticketId);
      const data = await resp.json();
      if (data && data.fields) {
        setTickets(prev => prev.map(t => t.id === ticketId ? { ...t, fields: { ...t.fields, ...data.fields } } : t));
      }
    } catch (e) {}
  };

  const repondreClient = async (ticket, texteReponse) => {
    const horodatage = new Date().toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const existant = ticket.fields?.["Réponse agence"] || "";
    const nouveauTexte = existant ? existant + '\n\n[' + horodatage + ']\n' + texteReponse : '[' + horodatage + ']\n' + texteReponse;
    setTickets(prev => prev.map(t => t.id===ticket.id?{...t,fields:{...t.fields,"Réponse agence":nouveauTexte,"Message client non lu":false}}:t));
    await fetch('/api/airtable/tenant/Tickets%20SAV/'+ticket.id, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fields:{"Réponse agence": nouveauTexte, "Message client non lu": false}})
    });
    fetch(WEBHOOK, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'reponse_agence', ticket: ticket.fields?.Name, message: texteReponse })
    }).catch(() => {});
  };

  // Jeu de données pour l'export : respecte agence + statut + recherche + plage de dates
  const getExportData = () => {
    return tickets.filter(t => {
      const matchAgence = agenceFilter==="global" || t.fields?.Agence===AGENCE_VERS_AIRTABLE[agenceFilter];
      const matchStatut = statutFilter==="tous" || (statutFilter==="devis" ? ["Devis à faire","Devis envoyé","Devis - Suivi","Devis - Attente fournisseur","Devis refusé"].includes(t.fields?.Statut) : t.fields?.Statut===statutFilter) || (!t.fields?.Statut&&statutFilter==="Nouveau");
      const matchUrgent = !urgentOnly || (t.fields?.Qualification === "Oui" && !isStatutClos(t.fields?.Statut));
      const q = search.toLowerCase();
      const matchSearch = !q || (t.fields?.Client||"").toLowerCase().includes(q) || (t.fields?.Name||"").toLowerCase().includes(q) || (t.fields?.Produit||"").toLowerCase().includes(q);
      const dateTicket = parseDateCreneau(t.fields?.Créneau);
      const matchDebut = !exportDebut || dateTicket >= new Date(exportDebut+'T00:00:00');
      const matchFin = !exportFin || dateTicket <= new Date(exportFin+'T23:59:59');
      return matchAgence && matchStatut && matchUrgent && matchSearch && matchDebut && matchFin;
    }).sort((a,b) => parseDateCreneau(a.fields?.Créneau) - parseDateCreneau(b.fields?.Créneau));
  };

  const nomFichierExport = (ext) => {
    const ag = agenceFilter==="global" ? "Toutes-agences" : agenceFilter.replace(/[^\w]+/g,"-");
    const periode = (exportDebut||exportFin) ? (exportDebut||"...")+"_"+(exportFin||"...") : "complet";
    return "IkoSuite_Export_"+ag+"_"+periode+"."+ext;
  };

  const exportExcel = () => {
    const data = getExportData();
    if (data.length === 0) { alert("Aucun ticket ne correspond aux filtres sélectionnés."); return; }
    const rows = data.map(t => ({
      "N° Ticket": t.fields?.Name || "",
      "Date création": t.createdTime ? new Date(t.createdTime).toLocaleDateString('fr-FR') : "",
      "Date intervention": t.fields?.Créneau || "",
      "Statut": t.fields?.Statut || "Nouveau",
      "Urgent": t.fields?.Qualification === "Oui" ? "Oui" : "Non",
      "Agence": t.fields?.Agence || "",
      "Client": t.fields?.Client || "",
      "Téléphone": t.fields?.Téléphone || "",
      "Email": t.fields?.Email || "",
      "Adresse": t.fields?.Adresse || "",

        .btn-close{background:#F3F4F6;color:#374151;border:1px solid #E2E2E2 !important;}

        @media print { @page { size: landscape; margin: 12mm; } .toolbar{display:none;} }
      </style></head><body>

      <table><thead><tr>
        <th>N° Ticket</th><th>Date création</th><th>Date intervention</th><th>Statut</th><th>Agence</th><th>Client</th><th>Téléphone</th><th>Produit</th><th>Problème</th><th>Note</th>
      </tr></thead><tbody>${lignes}</tbody></table>

  // Ouvre un ticket précis (par id Airtable ou par numéro "SAV-2026-XXXX") :
  // bascule sur l'onglet Tickets, isole le ticket via la recherche, puis
  // scroll + surligne sa carte. Utilisé par le pilotage vocal (action
  // "ouvrir_ticket") et par le calendrier annuel du Planning.
  const ouvrirTicket = (ref) => {
    const cible = tickets.find(x => x.id === ref || x.fields?.Name === ref);
    if (!cible) return;
    setVue('tickets');
    setStatutFilter('tous'); setUrgentOnly(false); setMessagesOnly(false); setRdvModifieOnly(false);
    setSearch(cible.fields?.Name || '');
    setTimeout(() => {
      const el = document.getElementById('ticket-'+cible.id);
      if (el) {
        el.scrollIntoView({behavior:'smooth', block:'center'});
        el.classList.add('ticket-highlight');
