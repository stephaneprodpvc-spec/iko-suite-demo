function PlanningView({ agenceFilter, onOpenTicket }) {
  const [sousVue, setSousVue] = React.useState("calendrier"); // "calendrier" | "liste"
  const [annee, setAnnee] = React.useState(new Date().getFullYear());
  const [slots, setSlots] = React.useState([]);
  const [ticketsByPlanning, setTicketsByPlanning] = React.useState({});
  const [loading, setLoading] = React.useState(true);
  const [jourSelectionne, setJourSelectionne] = React.useState(null);

  const charger = async () => {
    setLoading(true);
    try {
      await window.IKO_CLIENT_READY;
      const condAgence = agenceFilter !== "global" ? ',{Agence}="'+AGENCE_VERS_AIRTABLE[agenceFilter]+'"' : '';
      const rawFilter = 'AND({Statut}="Pris",DATETIME_FORMAT({Date},"YYYY")="'+annee+'"'+condAgence+')';
      const filter = encodeURIComponent(filtreAvecClient(rawFilter));
      const r = await fetch('/api/airtable/Planning?filterByFormula='+filter+'&sort[0][field]=Date&sort[0][direction]=asc&maxRecords=1000', {});
      const json = await r.json();
      const slotsData = json.records||[];
      setSlots(slotsData);

      // Charger les tickets SAV liés à un créneau (champ PlanningID = ID du record Planning)
      const filterTickets = encodeURIComponent('NOT({PlanningID}="")');
      const rt = await fetch('/api/airtable/Tickets SAV?filterByFormula='+filterTickets+'&maxRecords=1000', {});
      const jt = await rt.json();
      const map = {};
      (jt.records||[]).forEach(t => {
        if (t.fields?.PlanningID) map[t.fields.PlanningID] = t.fields;
      });
      setTicketsByPlanning(map);
    } catch(e) { console.error(e); }
    setLoading(false);
  };
  React.useEffect(() => { charger(); }, [agenceFilter, annee]);

  const byDate = {};
  slots.forEach(s => { const d = s.fields?.Date; if (!byDate[d]) byDate[d] = []; byDate[d].push(s); });
  const today = new Date().toISOString().split('T')[0];
  const MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const JOURS = ["L","M","M","J","V","S","D"];

  const densite = (n) => {
    if (n <= 0) return null;
    if (n === 1) return { bg: C.orDim, color: C.or };
    if (n === 2) return { bg: "rgba(34,197,94,0.4)", color: "#111" };
    return { bg: C.or, color: "#111" };
  };

  // Ouvre directement le ticket si un seul RDV ce jour-là, sinon propose
  // une petite liste à choisir (cas rare : 2 créneaux le même jour).
  const ouvrirJour = (dateStr) => {
    const s = byDate[dateStr] || [];
    if (s.length === 0) return;
    if (s.length === 1) {
      const ticket = ticketsByPlanning[s[0].id];
      if (ticket?.Name) onOpenTicket(ticket.Name); else setJourSelectionne(dateStr);
    } else {
      setJourSelectionne(dateStr);
    }
  };

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px",flexWrap:"wrap",gap:"10px"}}>
        <h2 style={{fontSize:"16px",fontWeight:"700",color:C.white}}>📅 Planning interventions</h2>
        <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
          {sousVue==="calendrier" && (
            <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
              <button onClick={() => setAnnee(a=>a-1)} style={{background:"transparent",border:"1px solid "+C.border,color:C.muted,borderRadius:"6px",padding:"4px 9px",cursor:"pointer",fontSize:"12px"}}>‹</button>
              <span style={{fontSize:"13px",fontWeight:"700",color:C.white,minWidth:"42px",textAlign:"center"}}>{annee}</span>
              <button onClick={() => setAnnee(a=>a+1)} style={{background:"transparent",border:"1px solid "+C.border,color:C.muted,borderRadius:"6px",padding:"4px 9px",cursor:"pointer",fontSize:"12px"}}>›</button>
            </div>
          )}
          <div style={{display:"flex",gap:"4px",background:C.card,borderRadius:"8px",padding:"3px",border:"1px solid "+C.border}}>
            {[["calendrier","🗓️ Calendrier"],["liste","📋 Liste"]].map(([v,l]) => (
              <button key={v} onClick={() => setSousVue(v)} style={{padding:"5px 12px",borderRadius:"6px",border:"none",background:sousVue===v?C.or:"transparent",color:sousVue===v?"#111":C.muted,fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>{l}</button>
            ))}
          </div>
          <button onClick={charger} style={{background:C.orDim,border:"1px solid "+C.orBord,color:C.or,borderRadius:"8px",padding:"5px 12px",fontSize:"11px",cursor:"pointer"}}>↺ Rafraîchir</button>
        </div>
      </div>

      {loading && <div style={{textAlign:"center",padding:"40px",color:C.muted}}>Chargement...</div>}

      {!loading && sousVue === "calendrier" && (
        <>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:"14px"}}>
          {MOIS.map((nomMois, m) => {
            const premierJour = new Date(annee, m, 1);
            const nbJours = new Date(annee, m+1, 0).getDate();
            const decalage = (premierJour.getDay()+6)%7; // lundi = première colonne
            const cases = [];
            for (let i=0;i<decalage;i++) cases.push(null);
            for (let j=1;j<=nbJours;j++) cases.push(j);
            return (
              <div key={m} style={{background:C.card,border:"1px solid "+C.border,borderRadius:"10px",padding:"10px"}}>
                <div style={{fontSize:"11px",fontWeight:"700",color:C.white,marginBottom:"8px"}}>{nomMois}</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"2px",marginBottom:"3px"}}>
                  {JOURS.map((j,i) => <div key={i} style={{fontSize:"8px",color:C.muted,textAlign:"center",fontWeight:"700"}}>{j}</div>)}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"2px"}}>
                  {cases.map((jour, i) => {
                    if (jour === null) return <div key={i}/>;
                    const dateStr = annee+"-"+String(m+1).padStart(2,"0")+"-"+String(jour).padStart(2,"0");
                    const n = (byDate[dateStr]||[]).length;
                    const d = densite(n);
                    const isToday = dateStr === today;
                    return (
                      <button key={i} onClick={() => d && ouvrirJour(dateStr)}
                        title={n>0 ? n+" RDV le "+dateStr : ""}
                        disabled={!d}
                        style={{
                          aspectRatio:"1",fontSize:"9px",borderRadius:"5px",cursor:d?"pointer":"default",
                          border:isToday?"1px solid "+C.or:"1px solid transparent",
                          background:d?d.bg:"transparent",color:d?d.color:C.muted,fontWeight:d?"800":"400",
                          display:"flex",alignItems:"center",justifyContent:"center"
                        }}>
                        {jour}
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:"14px",marginTop:"14px",fontSize:"10px",color:C.muted,alignItems:"center"}}>
          <span>Densité :</span>
          <span style={{display:"flex",alignItems:"center",gap:"4px"}}><span style={{width:"10px",height:"10px",borderRadius:"3px",background:C.orDim,display:"inline-block"}}/>1 RDV</span>
          <span style={{display:"flex",alignItems:"center",gap:"4px"}}><span style={{width:"10px",height:"10px",borderRadius:"3px",background:"rgba(34,197,94,0.4)",display:"inline-block"}}/>2 RDV</span>
          <span style={{display:"flex",alignItems:"center",gap:"4px"}}><span style={{width:"10px",height:"10px",borderRadius:"3px",background:C.or,display:"inline-block"}}/>3+ RDV</span>
        </div>
        </>
      )}

      {!loading && sousVue === "liste" && Object.keys(byDate).length === 0 && (
        <div style={{textAlign:"center",padding:"40px",color:C.muted,border:"1px dashed "+C.border,borderRadius:"12px"}}>Aucune intervention planifiée sur {annee}</div>
      )}

      {!loading && sousVue === "liste" && Object.keys(byDate).sort().map(date => {
        const dateObj = new Date(date+'T12:00:00');
        const label = dateObj.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
        const isPast = date < today;
        const isToday = date === today;
        return (
          <div key={date} style={{marginBottom:"16px",opacity:isPast?0.5:1}}>
            <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px"}}>
              <div style={{height:"1px",flex:1,background:C.border}}/>
              <span style={{fontSize:"12px",fontWeight:"700",color:isToday?C.or:C.muted,textTransform:"capitalize",whiteSpace:"nowrap"}}>{isToday?"⚡ Aujourd'hui — ":""}{label}</span>
              <div style={{height:"1px",flex:1,background:C.border}}/>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
              {byDate[date].map((s,i) => {
                const ticket = ticketsByPlanning[s.id];
                return (
                <div key={i} style={{background:C.card,border:"1px solid "+C.border,borderRadius:"8px",padding:"10px 14px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <span style={{fontSize:"12px",fontWeight:"700",color:C.white}}>{s.fields?.Créneau?.replace("Matin (8h30 — 12h00)","🌅 Matin").replace("Après-midi (13h00 — 17h00)","🌇 Après-midi")}</span>
                      <span style={{fontSize:"10px",color:C.muted,marginLeft:"10px"}}>{s.fields?.Agence}</span>
                    </div>
                    <div style={{display:"flex",gap:"6px"}}>
                      {ticket?.Name && (
                        <button onClick={() => onOpenTicket(ticket.Name)} style={{background:C.orDim,border:"1px solid "+C.orBord,color:C.or,borderRadius:"6px",padding:"3px 8px",fontSize:"10px",cursor:"pointer"}}>Ouvrir</button>
                      )}
                      <button onClick={async () => {
                        await fetch('/api/airtable/Planning/'+s.id, {
                          method:'PATCH', headers:{'Content-Type':'application/json'},

                      <div style={{fontSize:"11px",color:"#6B7280"}}>{ticket?.Client || "Client inconnu"} · {s.fields?.Agence}</div>
                    </div>
                    {ticket?.Name ? (
                      <button onClick={() => { onOpenTicket(ticket.Name); setJourSelectionne(null); }}
                        style={{background:"#22C55E",color:"#111",border:"none",borderRadius:"6px",padding:"6px 10px",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>
                        Ouvrir
                      </button>

                      <span style={{fontSize:"10px",color:"#9CA3AF"}}>Sans ticket lié</span>
                    )}
                  </div>
                );
              })}
            </div>
            <button onClick={() => setJourSelectionne(null)} style={{marginTop:"14px",width:"100%",background:"#F3F4F6",border:"1px solid #E5E7EB",color:"#374151",borderRadius:"8px",padding:"8px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>Fermer</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Dashboard({ agenceAccess, onClose }) {
  const [tickets, setTickets] = React.useState([]);

  const [agenceFilter, setAgenceFilter] = React.useState(agenceAccess === "global" ? "global" : agenceAccess);
  const [vue, setVue] = React.useState("tickets");

  const [statutFilter, setStatutFilter] = React.useState("tous");
  const [urgentOnly, setUrgentOnly] = React.useState(false);
  const [messagesOnly, setMessagesOnly] = React.useState(false);
  const [openMessageTicketId, setOpenMessageTicketId] = React.useState(null);
  const [amandineOuverte, setAmandineOuverte] = React.useState(false);
  const [amandineEcoute, setAmandineEcoute] = React.useState(false);
  const [amandineEnCours, setAmandineEnCours] = React.useState(false);

  const [ikoHistorique, setIkoHistorique] = React.useState([]);
  const [amandineErreur, setAmandineErreur] = React.useState("");

  const [amandineTexte, setAmandineTexte] = React.useState("");
  const [sortBy, setSortBy] = React.useState("date");
  const [lastRefresh, setLastRefresh] = React.useState(null);
  const [showModalRdv, setShowModalRdv] = React.useState(false);
  const [rdvPrefillAgence, setRdvPrefillAgence] = React.useState(null);
  const [blocagePrefill, setBlocagePrefill] = React.useState(null); // {agence, dateDebut, dateFin, motif}
  const [annulationMotifPrefill, setAnnulationMotifPrefill] = React.useState("");
  const [showModalBlocage, setShowModalBlocage] = React.useState(false);
  const [showModalConcepteur, setShowModalConcepteur] = React.useState(false);
  const [debugInfo, setDebugInfo] = React.useState(null);
  const [debugOuvert, setDebugOuvert] = React.useState(false);
  const [, forcerRender] = React.useState(0);

  React.useEffect(() => {
    fetch('/api/airtable/Planning/' + CONFIG_RECORD_ID)
      .then(r => r.json())
      .then(json => {
        const n = json.fields?.["Nombre agences"];
        if (n) appliquerNombreAgences(n);
        const brut = json.fields?.["Config JSON"];
        if (brut) { try { appliquerConfigEntreprise(JSON.parse(brut)); } catch(e) {} }
        forcerRender(x => x + 1);
      })
      .catch(() => {});
    // Si un client est charge (?client=slug), ses couleurs/logo prennent
    // le pas sur la config demo generique ci-dessus.
    window.IKO_CLIENT_READY.then(() => {
      const info = window.IKO_CLIENT_INFO;
      if (!info) return;
      if (info["Nombre agences"]) appliquerNombreAgences(info["Nombre agences"]);
      appliquerConfigEntreprise({
        couleurAccent: info["Couleur principale"] || CONFIG_ENTREPRISE.couleurAccent,
        logoUrl: (info["Logo"] && info["Logo"][0] && info["Logo"][0].url) || CONFIG_ENTREPRISE.logoUrl,
        emailsTechnicien: CONFIG_ENTREPRISE.emailsTechnicien,
        techniciens: CONFIG_ENTREPRISE.techniciens,
      });
      forcerRender(x => x + 1);
    });
  }, []);
  const [showModalGestionDevis, setShowModalGestionDevis] = React.useState(false);
  const [showModalNotes, setShowModalNotes] = React.useState(false);
  const [successTicket, setSuccessTicket] = React.useState(null);
  const [modalAnnulation, setModalAnnulation] = React.useState(null);
  const [modalSuppression, setModalSuppression] = React.useState(null);
  const [modalSuppressionDefinitive, setModalSuppressionDefinitive] = React.useState(null);
  const [modalDevis, setModalDevis] = React.useState(null);
  const [exportDebut, setExportDebut] = React.useState("");
  const [exportFin, setExportFin] = React.useState("");
  const [notifs, setNotifs] = React.useState([]);
  const idsConnusRef = React.useRef(null);
  const audioCtxRef = React.useRef(null);
  const isFetchingRef = React.useRef(false);

  const jouerSon = () => {
    try {
      if (!audioCtxRef.current) {
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = audioCtxRef.current;
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(740, ctx.currentTime);
      o.frequency.setValueAtTime(988, ctx.currentTime + 0.12);
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      o.start(); o.stop(ctx.currentTime + 0.5);
      o.onended = () => { o.disconnect(); g.disconnect(); };
    } catch(e) {}
  };

  const charger = async () => {
    if (isFetchingRef.current) return;
    isFetchingRef.current = true;
    setLoading(true);
    try {
      await window.IKO_CLIENT_READY;
      let rawFilter = agenceFilter !== "global" ? '{Agence}="'+AGENCE_VERS_AIRTABLE[agenceFilter]+'"' : "";
      rawFilter = filtreAvecClient(rawFilter);
      let filter = rawFilter ? encodeURIComponent(rawFilter) : "";
      const url = '/api/airtable/Tickets SAV?'+(filter?'filterByFormula='+filter+'&':'')+'sort[0][field]=Name&sort[0][direction]=desc&maxRecords=200';
      const r = await fetch(url, {});
      const json = await r.json();
      const records = json.records||[];
      setTickets(records);
      setLastRefresh(new Date().toLocaleTimeString('fr-FR'));
      setDebugInfo({
        url, statut: r.status, nbResultats: records.length,
        rawFilter, agenceFilter, agenceMappee: AGENCE_VERS_AIRTABLE[agenceFilter],
        clientId: window.IKO_CLIENT_ID || "(aucun — ?client= non détecté)",
        erreurApi: json.error ? JSON.stringify(json.error) : null,
      });
    } catch(e) {
      console.error(e);
      setDebugInfo({ erreurJs: String(e) });
    }
    setLoading(false);
    isFetchingRef.current = false;
  };

  // Detection des nouveaux tickets (notifications en haut a droite) :
  // volontairement INDEPENDANTE du filtre agence choisi a l'ecran. Avant,
  // cette detection utilisait la liste deja filtree par agence : changer de
  // filtre (ex: Agence 1 -> Toutes agences) faisait passer plein de tickets
  // "jamais vus SOUS CE FILTRE" pour des tickets "nouveaux", declenchant une
  // avalanche de fausses notifications en haut a droite. On fait donc
  // toujours cette verification sur la liste COMPLETE, non filtree.
  const isCheckingNouveauxRef = React.useRef(false);
  const checkNouveaux = async () => {
    if (isCheckingNouveauxRef.current) return;
    isCheckingNouveauxRef.current = true;
    try {
      await window.IKO_CLIENT_READY;
      const cf = filtreAvecClient("");
      const fp = cf ? 'filterByFormula='+encodeURIComponent(cf)+'&' : '';
      const r = await fetch('/api/airtable/Tickets SAV?'+fp+'sort[0][field]=Name&sort[0][direction]=desc&maxRecords=200', {});
      const json = await r.json();
      const records = json.records||[];
      const idsActuels = new Set(records.map(t => t.id));
      if (idsConnusRef.current) {
        const nouveaux = records.filter(t => !idsConnusRef.current.has(t.id));
        if (nouveaux.length > 0) {
          jouerSon();
          const toasts = nouveaux.map(t => ({
            id: t.id + '-' + Date.now(),
            texte: '🆕 ' + (t.fields?.Name||'Nouveau ticket') + ' — ' + (t.fields?.Client||'Client inconnu') + ' (' + (t.fields?.Agence||'') + ')'
          }));
          setNotifs(prev => [...prev, ...toasts]);
          toasts.forEach(t => setTimeout(() => setNotifs(prev => prev.filter(n => n.id !== t.id)), 7000));
        }
      }
      idsConnusRef.current = idsActuels;
    } catch(e) { console.error(e); }
    isCheckingNouveauxRef.current = false;
  };

  React.useEffect(() => { charger(); }, [agenceFilter]);
  // Plus d'auto-rafraîchissement en tâche de fond (c'était toutes les ~3s,
  // ce qui épuise en quelques heures le quota Airtable du plan Free —
  // 1000 appels/mois). La liste se recharge au chargement de la page, au
  // changement de filtre agence, et via le bouton ↺ manuel. Les actions
  // (changer un statut, etc.) mettent déjà à jour l'affichage localement
  // sans requête supplémentaire.
  //
  // La détection de nouveaux tickets (notifications 🆕) reste en tâche de
  // fond mais à un intervalle bien plus large (~90-100s au lieu de ~3s) :
  // c'est la seule chose qui a vraiment besoin de tourner sans action de
  // l'utilisateur. Fermer l'onglet quand le dashboard n'est pas activement
  // utilisé reste le meilleur moyen d'économiser le quota.
  React.useEffect(() => {
    checkNouveaux();
    let timeoutId;
    const tick = () => {
      checkNouveaux();
      timeoutId = setTimeout(tick, 90000 + Math.random() * 10000);
    };
    timeoutId = setTimeout(tick, 90000 + Math.random() * 10000);
    return () => clearTimeout(timeoutId);
  }, []);

  const renvoyerMailTechnicien = (ticketId) => {
    if (!confirm('Renvoyer le mail au technicien pour le ticket ' + ticketId + ' ?')) return;
    fetch(WEBHOOK + '?action=renvoi_technicien&ticket=' + encodeURIComponent(ticketId))
      .then(() => alert('✅ Mail renvoyé au technicien !'))
      .catch(() => alert('❌ Erreur lors de l\'envoi'));
  };

  const renvoyerMailClient = (ticketId) => {
    if (!confirm('Renvoyer le mail de confirmation au client pour le ticket ' + ticketId + ' ?')) return;
    fetch(WEBHOOK + '?action=renvoi_client&ticket=' + encodeURIComponent(ticketId))
      .then(() => alert('✅ Mail renvoyé au client !'))
      .catch(() => alert('❌ Erreur lors de l\'envoi'));
  };

  const marquerMessageLu = async (ticket) => {
    setTickets(prev => prev.map(t => t.id===ticket.id?{...t,fields:{...t.fields,"Message client non lu":false}}:t));
    try {
      await fetch('/api/airtable/Tickets%20SAV/'+ticket.id, {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({fields:{"Message client non lu": false}})
      });
    } catch(e) { console.error(e); }

      }

  const repondreClient = async (ticket, texteReponse) => {
    const horodatage = new Date().toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const existant = ticket.fields?.["Réponse agence"] || "";
    const nouveauTexte = existant ? existant + '\n\n[' + horodatage + ']\n' + texteReponse : '[' + horodatage + ']\n' + texteReponse;
    setTickets(prev => prev.map(t => t.id===ticket.id?{...t,fields:{...t.fields,"Réponse agence":nouveauTexte,"Message client non lu":false}}:t));
    await fetch('/api/airtable/Tickets%20SAV/'+ticket.id, {
      method:'PATCH', headers:{'Content-Type':'application/json'},

    });
    fetch(WEBHOOK, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'reponse_agence', ticket: ticket.fields?.Name, message: texteReponse })
    }).catch(() => {});
  };

  // Jeu de données pour l'export : respecte agence + statut + recherche + plage de dates
  const getExportData = () => {
    return tickets.filter(t => {
      const matchAgence = agenceFilter==="global" || t.fields?.Agence===AGENCE_VERS_AIRTABLE[agenceFilter];
      const matchStatut = statutFilter==="tous" || (statutFilter==="devis" ? ["Devis à faire","Devis envoyé","Devis - Suivi","Devis - Attente fournisseur","Devis refusé"].includes(t.fields?.Statut) : t.fields?.Statut===statutFilter) || (!t.fields?.Statut&&statutFilter==="Nouveau");
      const matchUrgent = !urgentOnly || (t.fields?.Qualification === "Oui" && !isStatutClos(t.fields?.Statut));
      const q = search.toLowerCase();
      const matchSearch = !q || (t.fields?.Client||"").toLowerCase().includes(q) || (t.fields?.Name||"").toLowerCase().includes(q) || (t.fields?.Produit||"").toLowerCase().includes(q);
      const dateTicket = parseDateCreneau(t.fields?.Créneau);
      const matchDebut = !exportDebut || dateTicket >= new Date(exportDebut+'T00:00:00');
      const matchFin = !exportFin || dateTicket <= new Date(exportFin+'T23:59:59');
      return matchAgence && matchStatut && matchUrgent && matchSearch && matchDebut && matchFin;

    const mailBody = encodeURIComponent(
      `Export tickets SAV Iko Suite\n${ag} — ${periode} — ${data.length} ticket(s)\n\n` +
      data.map(t => `${t.fields?.Name||""} — ${t.fields?.Créneau||""} — ${t.fields?.Statut||"Nouveau"} — ${t.fields?.Agence||""} — ${t.fields?.Client||""} — ${t.fields?.Téléphone||""} — ${t.fields?.Produit||""} / ${t.fields?.Problème||""}`).join("\n")
    );
    const mailSubject = encodeURIComponent(`Export tickets SAV Iko Suite — ${ag}`);
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Export Iko SAV</title>
      <style>
        body{font-family:Arial,sans-serif;padding:24px;color:#111;}
        h1{color:#111;font-size:18px;margin-bottom:2px;}

      </tr></thead><tbody>${lignes}</tbody></table>

  // bascule sur l'onglet Tickets, isole le ticket via la recherche, puis
  // scroll + surligne sa carte. Utilisé par le pilotage vocal (action
  // "ouvrir_ticket") et par le calendrier annuel du Planning.
  const ouvrirTicket = (ref) => {
    const cible = tickets.find(x => x.id === ref || x.fields?.Name === ref);
    if (!cible) return;
    setVue('tickets');
    setStatutFilter('tous'); setUrgentOnly(false); setMessagesOnly(false);
    setSearch(cible.fields?.Name || '');
    setTimeout(() => {
      const el = document.getElementById('ticket-'+cible.id);
      if (el) {
        el.scrollIntoView({behavior:'smooth', block:'center'});
        el.classList.add('ticket-highlight');
        setTimeout(() => el.classList.remove('ticket-highlight'), 2200);
      }
    }, 150);
  };

  const updateStatus = async (id, newStatus) => {
    setTickets(prev => prev.map(t => t.id===id?{...t,fields:{...t.fields,Statut:newStatus}}:t));
    await fetch('/api/airtable/Tickets SAV/'+id, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fields:{Statut:newStatus}})
    });
  };

  // ---- Amandine vocale : ecoute, comprend, agit directement sur le dashboard ----
  // iOS Safari bloque silencieusement speechSynthesis.speak() si l'appel
  // n'est pas synchrone avec le geste de l'utilisateur (clic/tap). Comme
  // notre reponse vocale arrive apres un appel reseau (asynchrone), on
  // "debloque" l'audio des le clic avec un utterance quasi silencieux.
  const ikoAudioRef = React.useRef(null);
  const VOICE_ID_IKO = "pNInz6obpgDQGcFmaJgB";
  const SILENCE_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";

  const debloquerVoixIOS = () => {
    try {
      const a = ikoAudioRef.current;
      if (a) { a.src = SILENCE_WAV; a.play().catch(() => {}); }
    } catch (e) {}
    try {
      // window.speechSynthesis est une API distincte de <audio> : iOS exige
      // aussi un premier appel synchrone avec le geste utilisateur, sinon
      // les speak() suivants (déclenchés après un await fetch, donc de
      // façon asynchrone) sont silencieusement ignorés. On "amorce" donc
      // le moteur ici avec une syllabe quasi inaudible.
      if ('speechSynthesis' in window) {
        const amorce = new SpeechSynthesisUtterance(' ');
        amorce.volume = 0.01;
        amorce.lang = 'fr-FR';
        window.speechSynthesis.speak(amorce);
      }
    } catch (e) {}
  };

  // Repli local si l'API ElevenLabs échoue (quota/crédits épuisés, réseau...) :
  // on utilise la synthèse vocale native du navigateur, gratuite et sans API.
  // Qualité moindre, mais IKO reste audible dans tous les cas.
  const parlerNavigateurNatif = (texte) => {
    try {
      if (!('speechSynthesis' in window) || !texte) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = 'fr-FR';
      window.speechSynthesis.speak(u);
    } catch (e) {}
  };

  const parlerAmandine = async (texte) => {
    try {
      if (!texte) return;
      const r = await fetch('/api/tts', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texte, voice_id: VOICE_ID_IKO }),
      });
      if (!r.ok) { parlerNavigateurNatif(texte); return; }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = ikoAudioRef.current;
      if (a) { a.volume = 1.0; a.src = url; a.play().catch(() => parlerNavigateurNatif(texte)); }
    } catch (e) { parlerNavigateurNatif(texte); }
  };

  const executerActionsAmandine = (actions) => {
    (actions || []).forEach(a => {
      if (a.name === 'filtrer_agence') {
        setAgenceFilter(a.input.agence === 'toutes' ? 'global' : a.input.agence);
      } else if (a.name === 'rechercher') {
        setSearch(a.input.requete || '');
        setStatutFilter('tous'); setUrgentOnly(false); setMessagesOnly(false);
      } else if (a.name === 'changer_statut' && a.input.ticket_id) {
        updateStatus(a.input.ticket_id, a.input.nouveau_statut);
      } else if (a.name === 'filtrer_statut') {
        setStatutFilter(a.input.statut); setUrgentOnly(false); setMessagesOnly(false);
      } else if (a.name === 'ouvrir_ticket') {
        ouvrirTicket(a.input.ticket_id || a.input.numero);
      } else if (a.name === 'renvoyer_ticket') {
        const cible = tickets.find(x => x.id === a.input.ticket_id || x.fields?.Name === a.input.numero);
        if (!cible) return;
        if (a.input.destinataire === 'technicien') {
          renvoyerMailTechnicien(cible.fields?.Name);
        } else if (cible.fields?.["Pas de contact client"]) {
          setAmandineErreur("Impossible : ce client n'a pas de contact email/téléphone exploitable.");
        } else {
          renvoyerMailClient(cible.fields?.Name);
        }
      } else if (a.name === 'marquer_message_lu') {
        const cible = tickets.find(x => x.id === a.input.ticket_id || x.fields?.Name === a.input.numero);
        if (cible) marquerMessageLu(cible);
      } else if (a.name === 'repondre_client') {
        const cible = tickets.find(x => x.id === a.input.ticket_id || x.fields?.Name === a.input.numero);
        if (cible && a.input.message) repondreClient(cible, a.input.message);
      } else if (a.name === 'preparer_blocage_dates') {
        // Action multi-champs sur potentiellement de nombreux créneaux :
        // on ouvre le formulaire pré-rempli, la confirmation reste manuelle.
        setBlocagePrefill({
          agence: a.input.agence || null,
          dateDebut: a.input.date_debut || null,
          dateFin: a.input.date_fin || null,
          motif: a.input.motif || null,
        });
        setShowModalBlocage(true);
      } else if (a.name === 'ouvrir_nouveau_rdv') {
        setRdvPrefillAgence(a.input.agence || null);
        setShowModalRdv(true);
      } else if (a.name === 'preparer_annulation_ticket') {
        // Action irréversible : on ouvre la confirmation avec motif pré-rempli,
        // le clic de validation reste manuel.
        const cible = tickets.find(x => x.id === a.input.ticket_id || x.fields?.Name === a.input.numero);
        if (cible) { setAnnulationMotifPrefill(a.input.motif || ""); setModalAnnulation(cible); }
      } else if (a.name === 'preparer_suppression_ticket') {
        const cible = tickets.find(x => x.id === a.input.ticket_id || x.fields?.Name === a.input.numero);
        if (cible) setModalSuppression(cible);
      }
    });
  };

  const envoyerAmandine = async (transcript) => {
    setAmandineEnCours(true);
    setAmandineErreur("");
    try {
      const contexteTickets = tickets.slice(0, 150).map(t => ({
        id: t.id,
        numero: t.fields?.Name || "",
        client: t.fields?.Client || "",
        agence: t.fields?.Agence || "",
        statut: t.fields?.Statut || "Nouveau",
        produit: t.fields?.Produit || "",
      }));
      const r = await fetch('/api/chat-dashboard', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ message: transcript, tickets: contexteTickets, agenceActuelle: agenceFilter, historique: ikoHistorique.slice(-6) })
      });
      const data = await r.json();
      if (data.erreur) { setAmandineErreur(data.erreur); setAmandineEnCours(false); return; }
      executerActionsAmandine(data.actions || []);
      const texte = data.reponse || "C'est fait.";
      setAmandineDernier(texte);
      setIkoHistorique(prev => [...prev, { role: 'user', texte: transcript }, { role: 'assistant', texte }].slice(-8));
      parlerAmandine(texte);
    } catch (e) {
      setAmandineErreur("Connexion impossible. Réessayez.");
    }
    setAmandineEnCours(false);
  };

  // Enregistrement + transcription serveur (Whisper), en remplacement de
  // webkitSpeechRecognition (peu fiable sur WebKit iOS après le 1er usage,
  // marche/arrête au tap plutôt que sur détection de silence, pour rester
  // prévisible sur tous les navigateurs).
  const mediaRecorderRef = React.useRef(null);
  const audioChunksRef = React.useRef([]);

  const lancerEcouteAmandine = async () => {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      // Environnement trop ancien : on retombe sur la dictée clavier iOS.
      const champ = document.getElementById('ikoChampTexte');
      if (champ) champ.focus();
      return;
    }
    setAmandineErreur("");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
        : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      const recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      audioChunksRef.current = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunksRef.current.push(e.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        setAmandineEcoute(false);
        const blob = new Blob(audioChunksRef.current, { type: recorder.mimeType || mimeType || 'audio/webm' });
        if (blob.size < 800) {
          setAmandineErreur("Aucune voix détectée. Réessayez en parlant juste après avoir appuyé sur le micro.");
          return;
        }
        setAmandineEnCours(true);
        try {
          const r = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': blob.type || 'audio/webm' },
            body: blob,
          });
          const data = await r.json();
          if (!r.ok || data.erreur || !data.texte) {
            setAmandineErreur(data.erreur || "Je n'ai rien compris. Réessayez.");
            setAmandineEnCours(false);
            return;
          }
          setAmandineDernier(data.texte);
          envoyerAmandine(data.texte);
        } catch (e) {
          setAmandineErreur("Transcription impossible. Réessayez.");
          setAmandineEnCours(false);
        }
      };
      mediaRecorderRef.current = recorder;
      recorder.start();
      setAmandineEcoute(true);
      // Coupure de sécurité si l'utilisateur oublie de retaper sur le micro.
      setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 15000);
    } catch (e) {
      setAmandineEcoute(false);
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError') {
        setAmandineErreur("Micro refusé par le navigateur. Appuyez sur l'icône micro barrée à côté de l'adresse du site pour l'autoriser, puis réessayez.");
      } else if (e.name === 'NotFoundError') {
        setAmandineErreur("Aucun micro détecté sur cet appareil.");
      } else {
        setAmandineErreur("Problème micro (" + e.name + "). Utilisez le champ texte en attendant.");
      }
    }
  };

  const arreterEcouteAmandine = () => {
    if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
      mediaRecorderRef.current.stop();
    }
  };

  const confirmerAnnulation = async (ticket, motif) => {
    const fields = { Statut: "Annulé", Commentaire: "Annulé : " + motif.trim() };
    const planningId = ticket?.fields?.PlanningID;
    if (planningId) {
      try {
        await fetch('/api/airtable/Planning/'+planningId, {
          method:'PATCH', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({fields:{Statut:'Libre'}})
        });
      } catch(e) { console.error(e); }
    }
    setTickets(prev => prev.map(t => t.id===ticket.id?{...t,fields:{...t.fields,...fields}}:t));
    await fetch('/api/airtable/Tickets SAV/'+ticket.id, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fields})
    });
    setModalAnnulation(null);
  };

  const confirmerSuppression = async (ticket) => {
    const planningId = ticket?.fields?.PlanningID;
    if (planningId) {
      try {
        await fetch('/api/airtable/Planning/'+planningId, {
          method:'PATCH', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({fields:{Statut:'Libre'}})
        });
      } catch(e) { console.error(e); }
    }
    const fields = { Statut: "Supprimé" };
    setTickets(prev => prev.map(t => t.id===ticket.id?{...t,fields:{...t.fields,...fields}}:t));
    try {
      await fetch('/api/airtable/Tickets SAV/'+ticket.id, {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({fields})
      });
    } catch(e) { console.error(e); }
    setModalSuppression(null);
  };

  const confirmerSuppressionDefinitive = async (ticket) => {
    const planningId = ticket?.fields?.PlanningID;
    if (planningId) {
      try {
        await fetch('/api/airtable/Planning/'+planningId, {
          method:'PATCH', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({fields:{Statut:'Libre'}})
        });
      } catch(e) { console.error(e); }
    }
    try {
      await fetch('/api/airtable/Tickets SAV/'+ticket.id, { method:'DELETE' });
    } catch(e) { console.error(e); }
    setTickets(prev => prev.filter(t => t.id !== ticket.id));
    setModalSuppressionDefinitive(null);
  };

  const filtered = tickets.filter(t => {
    const matchAgence = agenceFilter==="global" || t.fields?.Agence===AGENCE_VERS_AIRTABLE[agenceFilter];
    const matchStatut = statutFilter==="tous" ? (t.fields?.Statut !== "Terminé" && t.fields?.Statut !== "Annulé" && t.fields?.Statut !== "Supprimé") : statutFilter==="archives" ? (t.fields?.Statut === "Annulé" || t.fields?.Statut === "Supprimé") : (statutFilter==="devis" ? ["Devis à faire","Devis envoyé","Devis - Suivi","Devis - Attente fournisseur","Devis refusé"].includes(t.fields?.Statut) : t.fields?.Statut===statutFilter) || (!t.fields?.Statut&&statutFilter==="Nouveau");
    const matchUrgent = !urgentOnly || (t.fields?.Qualification === "Oui" && !isStatutClos(t.fields?.Statut));
    const matchMessages = !messagesOnly || t.fields?.["Message client non lu"] || t.id === openMessageTicketId;
    const q = search.toLowerCase();
    const matchSearch = !q || (t.fields?.Client||"").toLowerCase().includes(q) || (t.fields?.Name||"").toLowerCase().includes(q) || (t.fields?.Produit||"").toLowerCase().includes(q);
    return matchAgence && matchStatut && matchUrgent && matchMessages && matchSearch;
  });

  const sortFn = (a,b) => {
    if (sortBy === "date") return parseDateCreneau(a.fields?.Créneau) - parseDateCreneau(b.fields?.Créneau);
    if (sortBy === "ticket") return (b.fields?.Name||"").localeCompare(a.fields?.Name||"");
    return 0;
  };

  // Vue "Tous" : actifs triés en haut, terminés/annulés triés séparément en bas
  let sorted;
  if (statutFilter === "tous") {
    const actifs = filtered.filter(t => !isStatutClos(t.fields?.Statut));
    const clos = filtered.filter(t => isStatutClos(t.fields?.Statut));
    sorted = [...actifs.sort(sortFn), ...clos.sort(sortFn)];
  } else {
    sorted = [...filtered].sort(sortFn);
  }

  const stats = {
    total: tickets.filter(t => t.fields?.Statut !== "Terminé" && t.fields?.Statut !== "Annulé" && t.fields?.Statut !== "Supprimé").length,
    urgent: tickets.filter(t => t.fields?.Qualification === "Oui" && !isStatutClos(t.fields?.Statut)).length,
    nouveau: tickets.filter(t => !t.fields?.Statut||t.fields?.Statut==="Nouveau").length,
    encours: tickets.filter(t => t.fields?.Statut==="En cours").length,
    termine: tickets.filter(t => t.fields?.Statut==="Terminé").length,
    annule: tickets.filter(t => t.fields?.Statut==="Annulé").length,
    supprime: tickets.filter(t => t.fields?.Statut==="Supprimé").length,
    devisEnAttente: tickets.filter(t => ["Devis à faire","Devis envoyé","Devis - Suivi","Devis - Attente fournisseur"].includes(t.fields?.Statut)).length,
    messagesNonLus: tickets.filter(t => t.fields?.["Message client non lu"]).length,
  };
  stats.archives = stats.annule + stats.supprime;
  const ticketsNotes = tickets.filter(t => typeof t.fields?.Note === "number");
  stats.noteMoyenne = ticketsNotes.length ? (ticketsNotes.reduce((s,t) => s + t.fields.Note, 0) / ticketsNotes.length) : null;
  stats.nbNotes = ticketsNotes.length;

  const byAgence = {};
  AGENCES.forEach(a => { byAgence[a] = tickets.filter(t => t.fields?.Agence===AGENCE_VERS_AIRTABLE[a] && !["Terminé","Annulé","Supprimé"].includes(t.fields?.Statut)).length; });

  if (vueMode === "vocal") {
    return (
      <div style={{position:"fixed",inset:0,background:"#0D0D0D",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:100}}>
        <audio ref={ikoAudioRef} style={{display:"none"}}/>
        <div style={{position:"absolute",top:"20px",left:"50%",transform:"translateX(-50%)",color:"#8a8a8a",fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase"}}>
          {agenceFilter === "global" ? "Toutes agences" : agenceFilter}
        </div>
        <div style={{width:"220px",height:"220px",borderRadius:"50%",
          background:"radial-gradient(circle at 35% 30%, #FFB067, #22C55E 55%, #7a3200 100%)",
          boxShadow:"0 0 90px rgba(34,197,94,0.45)",
          animation: amandineEcoute ? "ikoPulseRapide 1s ease-in-out infinite" : "ikoRespire 3.2s ease-in-out infinite"}}/>
        <div style={{marginTop:"32px",color:"#b8b8b8",fontSize:"14px",maxWidth:"320px",textAlign:"center",minHeight:"40px",lineHeight:"1.5"}}>
          {amandineEcoute ? "Je vous écoute... (relâchez le micro pour terminer)" : amandineEnCours ? "..." : amandineDernier ? amandineDernier : "Dites une commande à IKO : \"Filtre sur Agence 2\", \"Combien de tickets urgents ?\"..."}
        </div>
        {amandineErreur && <div style={{color:"#DC2626",fontSize:"12px",marginTop:"10px"}}>{amandineErreur}</div>}

        <div style={{marginTop:"26px",width:"90%",maxWidth:"380px",display:"flex",gap:"8px"}}>
          <input id="ikoChampTexte" type="text" value={amandineTexte}
            onChange={e => setAmandineTexte(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && amandineTexte.trim()) { debloquerVoixIOS(); envoyerAmandine(amandineTexte.trim()); setAmandineTexte(""); } }}
            placeholder="Tapez ou dictez (🎤 sur le clavier)"
            style={{flex:1,padding:"12px 14px",borderRadius:"10px",background:"#1a1a1a",border:"1px solid rgba(34,197,94,0.3)",color:"#fff",fontSize:"14px"}}/>
          <button onClick={() => { if (amandineTexte.trim()) { debloquerVoixIOS(); envoyerAmandine(amandineTexte.trim()); setAmandineTexte(""); } }}
            style={{padding:"12px 16px",borderRadius:"10px",background:"#22C55E",border:"none",color:"#111",fontWeight:"800",cursor:"pointer"}}>
            →
          </button>
        </div>

        <div style={{position:"fixed",bottom:"36px",left:"36px"}}>
          <button
            onPointerDown={() => { debloquerVoixIOS(); lancerEcouteAmandine(); }}
            onPointerUp={arreterEcouteAmandine}
            onPointerLeave={arreterEcouteAmandine}
            onPointerCancel={arreterEcouteAmandine}
            style={{width:"64px",height:"64px",borderRadius:"50%",background:amandineEcoute?"#DC2626":"#22C55E",border:"none",color:"#111",cursor:"pointer",fontSize:"26px",boxShadow:"0 6px 24px rgba(34,197,94,0.4)",touchAction:"none",userSelect:"none"}}>
            🎙️
          </button>
        </div>
        <div style={{position:"fixed",bottom:"36px",right:"36px"}}>
          <button onClick={() => setVueMode("tableau")}
            style={{padding:"16px 22px",borderRadius:"30px",background:"#1a1a1a",border:"1px solid rgba(34,197,94,0.35)",color:"#fff",cursor:"pointer",fontSize:"13px",fontWeight:"700"}}>
            📊 Voir le tableau
          </button>
        </div>
        <style>{`
          @keyframes ikoRespire{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
          @keyframes ikoPulseRapide{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
        `}</style>
      </div>
    );
  }

  return (
    <div style={{minHeight:"100vh",background:C.bg}}>
      {showModalRdv && (
        <ModalRdv
          agenceAccess={agenceFilter !== "global" ? agenceFilter : agenceAccess}
          initialAgence={rdvPrefillAgence}
          onClose={() => { setShowModalRdv(false); setRdvPrefillAgence(null); }}
          onSuccess={(num) => { setShowModalRdv(false); setRdvPrefillAgence(null); setSuccessTicket(num); charger(); }}
        />
      )}
      {showModalBlocage && (
        <ModalBlocage
          agenceAccess={agenceFilter !== "global" ? agenceFilter : agenceAccess}
          initialAgence={blocagePrefill?.agence}
          initialDateDebut={blocagePrefill?.dateDebut}
          initialDateFin={blocagePrefill?.dateFin}
          initialMotif={blocagePrefill?.motif}
          onClose={() => { setShowModalBlocage(false); setBlocagePrefill(null); }}
          onSuccess={(n) => { setShowModalBlocage(false); setBlocagePrefill(null); alert(n + " créneau(x) bloqué(s)."); charger(); }}
        />
      )}
      {showModalConcepteur && (
        <ModalConcepteur
          onClose={() => setShowModalConcepteur(false)}
          onSuccess={() => { setShowModalConcepteur(false); forcerRender(x => x + 1); }}
        />
      )}
      {showModalGestionDevis && (
        <ModalGestionDevis
          tickets={tickets}
          onClose={() => setShowModalGestionDevis(false)}
          onRefresh={charger}
        />
      )}
      {showModalNotes && (
        <ModalNotes
          tickets={tickets}
          onClose={() => setShowModalNotes(false)}
        />
      )}
      {successTicket && <ModalSuccess ticket={successTicket} onClose={() => setSuccessTicket(null)} />}
      {modalAnnulation && (
        <ModalAnnulation
          ticket={modalAnnulation}
          motifInitial={annulationMotifPrefill}
          onClose={() => { setModalAnnulation(null); setAnnulationMotifPrefill(""); }}
          onConfirm={confirmerAnnulation}
        />
      )}
      {modalSuppression && (
        <ModalSuppression
          ticket={modalSuppression}
          onClose={() => setModalSuppression(null)}
          onConfirm={confirmerSuppression}
        />
      )}
      {modalSuppressionDefinitive && (
        <ModalSuppressionDefinitive
          ticket={modalSuppressionDefinitive}
          onClose={() => setModalSuppressionDefinitive(null)}
          onConfirm={confirmerSuppressionDefinitive}
        />
      )}
      {modalDevis && (
        <ModalDevis
          ticket={modalDevis}
          onClose={() => setModalDevis(null)}
          onSent={() => { setModalDevis(null); charger(); }}
        />
      )}
      <div style={{position:"fixed",top:"16px",right:"16px",zIndex:2000,display:"flex",flexDirection:"column",gap:"8px",maxWidth:"320px"}}>
        {notifs.map(n => (
          <div key={n.id} style={{background:C.card,border:"1px solid "+C.orBord,borderLeft:"4px solid "+C.or,borderRadius:"10px",padding:"12px 14px",boxShadow:"0 8px 24px rgba(0,0,0,0.12)",color:C.white,fontSize:"12px",fontWeight:"600"}}>
            {n.texte}
          </div>
        ))}
      </div>

      <div style={{background:C.card,borderBottom:"1px solid "+C.border,padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
          <div style={{width:"96px",height:"46px",background:"#FFFFFF",borderRadius:"8px",display:"flex",alignItems:"center",justifyContent:"center",padding:"3px",boxSizing:"border-box"}}>
            <img src={CONFIG_ENTREPRISE.logoUrl || IKO_LOGO} alt="Iko" style={{width:"100%",height:"100%",objectFit:"contain"}}/>
          </div>
          <div>
            <div style={{fontSize:"13px",fontWeight:"700",color:C.muted}}>Dashboard SAV</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
          {lastRefresh && <span style={{fontSize:"10px",color:C.muted,display:"flex",alignItems:"center",gap:"4px"}}><span style={{width:"6px",height:"6px",background:"#22c55e",borderRadius:"50%",display:"inline-block"}}/>MAJ {lastRefresh}</span>}
          {stats.messagesNonLus > 0 && (
            <button onClick={() => { setMessagesOnly(!messagesOnly); setStatutFilter("tous"); setUrgentOnly(false); }}
              className={messagesOnly ? "" : "alert-blink"}
              title="Tickets avec un message client non lu"
              style={{background:"#DC2626",border:messagesOnly?"2px solid #fff":"none",boxShadow:messagesOnly?"0 0 0 2px #DC2626":"none",color:"#fff",borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"900",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>
              🔴 Messages clients <span style={{background:"#fff",color:"#DC2626",borderRadius:"10px",padding:"1px 7px",fontSize:"10px"}}>{stats.messagesNonLus}</span>
            </button>
          )}
          <button onClick={() => setShowModalGestionDevis(true)}
            style={{background:C.or,border:"none",color:"#111",borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"900",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>
            📋 Devis {stats.devisEnAttente > 0 && <span style={{background:"#0D0D0D",color:"#fff",borderRadius:"10px",padding:"1px 6px",fontSize:"10px"}}>{stats.devisEnAttente}</span>}
          </button>
          <button onClick={() => setShowModalRdv(true)} style={{background:C.or,border:"none",color:"#111",borderRadius:"8px",padding:"8px 16px",fontSize:"12px",fontWeight:"900",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>📞 + Nouveau RDV</button>
          <button onClick={() => setShowModalBlocage(true)} style={{background:"#fff",border:"1px solid "+C.border,color:C.white,borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"900",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>🔒 Bloquer dates</button>
          {/* Concepteur / Pilotage / Métreur retirés du bandeau : accès centralisé uniquement via le Module Contrôle (admin.html). */}
          <button onClick={charger} style={{background:C.orDim,border:"1px solid "+C.orBord,color:C.or,borderRadius:"8px",padding:"6px 14px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>↺</button>
          <div style={{width:"1px",height:"24px",background:C.border,margin:"0 4px"}}/>
          <button onClick={onClose} title="Fermer la session" style={{background:"rgba(220,38,38,0.08)",border:"1px solid rgba(220,38,38,0.25)",color:"rgba(220,38,38,0.85)",borderRadius:"8px",width:"30px",height:"30px",cursor:"pointer",fontSize:"14px",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>✕</button>
        </div>
      </div>

      <div style={{padding:"24px",maxWidth:"1200px",margin:"0 auto"}}>
        <div style={{position:"sticky",top:"73px",zIndex:60,background:C.bg,paddingBottom:"14px",boxShadow:"0 8px 12px -8px rgba(0,0,0,0.08)"}}>
        {agenceAccess === "global" && (
          <div style={{display:"flex",gap:"8px",marginBottom:"20px",flexWrap:"wrap"}}>
            {["global",...AGENCES].map(a => (
              <button key={a} onClick={() => setAgenceFilter(a)}
                style={{padding:"7px 16px",borderRadius:"20px",border:"1px solid "+(agenceFilter===a?C.or:C.border),background:agenceFilter===a?C.or:"transparent",color:agenceFilter===a?"#111":C.muted,fontSize:"12px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"6px"}}>
                {a==="global"?"🌐 Toutes agences":a}
                <span style={{background:"#2563EB",color:"#fff",borderRadius:"10px",padding:"1px 7px",fontSize:"10px",fontWeight:"900"}}>
                  {a==="global"?stats.total:byAgence[a]}
                </span>
              </button>
            ))}
          </div>
        )}

        <div style={{display:"flex",gap:"12px",marginBottom:"20px",flexWrap:"wrap"}}>
          <StatCard label="Total tickets" value={stats.total} accent
            active={statutFilter==="tous" && !urgentOnly && !messagesOnly}
            onClick={() => { setStatutFilter("tous"); setUrgentOnly(false); setMessagesOnly(false); }}/>
          <StatCard label="Urgents" value={stats.urgent} sub="à traiter en priorité" alert
            active={urgentOnly}
            onClick={() => { setUrgentOnly(!urgentOnly); setStatutFilter("tous"); setMessagesOnly(false); }}/>
          <StatCard label="Nouveaux" value={stats.nouveau}
            active={statutFilter==="Nouveau"}
            onClick={() => { setStatutFilter("Nouveau"); setUrgentOnly(false); setMessagesOnly(false); }}/>
          <StatCard label="En cours" value={stats.encours}
            active={statutFilter==="En cours"}
            onClick={() => { setStatutFilter("En cours"); setUrgentOnly(false); setMessagesOnly(false); }}/>
          <StatCard label="Terminés" value={stats.termine}
            active={statutFilter==="Terminé"}
            onClick={() => { setStatutFilter("Terminé"); setUrgentOnly(false); setMessagesOnly(false); }}/>
          <StatCard label="Archives" value={stats.archives} sub="annulés + supprimés"
            active={statutFilter==="archives"}
            onClick={() => { setStatutFilter("archives"); setUrgentOnly(false); setMessagesOnly(false); }}/>
          <StatCard label="Note client" value={stats.noteMoyenne ? "⭐ "+stats.noteMoyenne.toFixed(1) : "—"} sub={stats.nbNotes+" avis"} onClick={() => setShowModalNotes(true)}/>
        </div>

        <div style={{display:"flex",gap:"4px",marginBottom:"16px",background:C.card,borderRadius:"10px",padding:"4px",border:"1px solid "+C.border,width:"fit-content"}}>
          {[["tickets","🎫 Tickets"],["planning","📅 Planning"]].map(([v,l]) => (
            <button key={v} onClick={() => setVue(v)}
              style={{padding:"7px 18px",borderRadius:"7px",border:"none",background:vue===v?C.or:"transparent",color:vue===v?"#111":C.muted,fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>
              {l}
            </button>
          ))}
        </div>

        <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:"12px",padding:"14px 16px",marginBottom:"16px"}}>
          <div style={{fontSize:"12px",fontWeight:"700",color:C.white,marginBottom:"10px"}}>📤 Export (respecte les filtres agence/statut/recherche ci-dessous)</div>
          <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center"}}>
            <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
              <span style={{fontSize:"11px",color:C.muted}}>Du</span>
              <input type="date" value={exportDebut} onChange={e => setExportDebut(e.target.value)} style={{width:"140px"}}/>
              <span style={{fontSize:"11px",color:C.muted}}>au</span>
              <input type="date" value={exportFin} onChange={e => setExportFin(e.target.value)} style={{width:"140px"}}/>
              {(exportDebut||exportFin) && (
                <button onClick={() => { setExportDebut(""); setExportFin(""); }} style={{background:"none",border:"none",color:C.muted,fontSize:"11px",cursor:"pointer",textDecoration:"underline"}}>Effacer</button>
              )}
            </div>
            <div style={{display:"flex",gap:"8px",marginLeft:"auto"}}>
              <button onClick={exportExcel} style={{background:C.vertDim,border:"1px solid rgba(22,163,74,0.4)",color:C.vert,borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>📊 Excel</button>
              <button onClick={exportPDF} style={{background:C.orDim,border:"1px solid "+C.orBord,color:C.or,borderRadius:"8px",padding:"8px 14px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>🖨️ PDF</button>
            </div>
          </div>
        </div>

        {vue === "tickets" && (
            <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
              <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center",background:"#F3F4F6",border:"1px solid "+C.border,borderRadius:"10px",padding:"8px 12px"}}>
                <input placeholder="🔍 Rechercher client, ticket, produit..." value={search} onChange={e => setSearch(e.target.value)} style={{width:"240px"}}/>
                <span style={{fontSize:"11px",color:C.muted,fontWeight:"700",marginRight:"2px"}}>Trier :</span>
                {[["date","📅 Date"],["ticket","🔢 N° Ticket"]].map(([v,l]) => (
                  <button key={v} onClick={() => setSortBy(v)}
                    style={{padding:"6px 14px",borderRadius:"20px",border:"1px solid "+(sortBy===v?C.or:C.border),background:sortBy===v?C.orDim:"transparent",color:sortBy===v?C.or:C.muted,fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>
                    {l}
                  </button>
                ))}
                <span style={{fontSize:"11px",color:C.muted,marginLeft:"auto"}}>{sorted.length} ticket{sorted.length>1?"s":""}</span>
              </div>
            </div>
        )}
        </div>

        {vue === "tickets" && (
          <div style={{marginTop:"16px"}}>
            {loading && sorted.length===0 && <div style={{textAlign:"center",padding:"60px",color:C.muted}}>Chargement...</div>}
            {!loading && sorted.length===0 && (
              <div style={{textAlign:"center",padding:"60px",color:C.muted,border:"1px dashed "+C.border,borderRadius:"12px"}}>Aucun ticket trouvé</div>
            )}
            <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
              {sorted.map(t => <TicketRow key={t.id} t={t} onStatusChange={updateStatus} onAnnuler={setModalAnnulation} onSupprimer={setModalSuppression} onSupprimerDefinitivement={setModalSuppressionDefinitive} onRenvoyerMail={renvoyerMailTechnicien} onRenvoyerMailClient={renvoyerMailClient} onDevis={setModalDevis} onRepondreClient={repondreClient} onMarquerLu={marquerMessageLu} isMessagePanelOpen={openMessageTicketId===t.id} onToggleMessagePanel={() => setOpenMessageTicketId(prev => prev===t.id ? null : t.id)} onCloseMessagePanel={() => setOpenMessageTicketId(null)} onRefreshTicket={rafraichirTicketMessage}/>)}
            </div>
          </div>
        )}

        {vue === "planning" && <PlanningView agenceFilter={agenceFilter} onOpenTicket={ouvrirTicket}/>}
      </div>

      {/* Widget vocal IKO */}
      <audio ref={ikoAudioRef} style={{display:"none"}}/>
      <div style={{position:"fixed",bottom:"24px",right:"24px",zIndex:200,display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"10px"}}>
        {amandineOuverte && (
          <div style={{width:"280px",background:C.card,border:"1px solid "+C.orBord,borderRadius:"14px",padding:"16px",boxShadow:"0 10px 40px rgba(0,0,0,0.35)"}}>
            <div style={{fontSize:"12px",fontWeight:"800",color:C.or,marginBottom:"8px",letterSpacing:"1px"}}>IKO</div>
            <div style={{fontSize:"12px",color:C.muted,minHeight:"36px"}}>
              {amandineEcoute ? "Je vous écoute... (relâchez le micro pour terminer)" : amandineEnCours ? "..." : amandineDernier ? amandineDernier : "Dites par exemple : \"Filtre sur Agence 2\" ou \"Passe le ticket SAV-2026-1552 en terminé\"."}
            </div>
            {amandineErreur && <div style={{fontSize:"11px",color:C.rouge,marginTop:"6px"}}>{amandineErreur}</div>}
            <div style={{display:"flex",gap:"6px",marginTop:"10px"}}>
              <input type="text" value={amandineTexte}
                onChange={e => setAmandineTexte(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter" && amandineTexte.trim()) { debloquerVoixIOS(); envoyerAmandine(amandineTexte.trim()); setAmandineTexte(""); } }}
                placeholder="Tapez ou dictez (🎤 clavier)"
                style={{flex:1,padding:"8px 10px",borderRadius:"8px",background:"#1a1a1a",border:"1px solid "+C.orBord,color:"#fff",fontSize:"12px"}}/>
              <button onClick={() => { if (amandineTexte.trim()) { debloquerVoixIOS(); envoyerAmandine(amandineTexte.trim()); setAmandineTexte(""); } }}
                style={{padding:"8px 12px",borderRadius:"8px",background:C.or,border:"none",color:"#111",fontWeight:"800",cursor:"pointer"}}>→</button>
            </div>
          </div>
        )}
        <div style={{display:"flex",gap:"10px",alignItems:"center"}}>
          <button onClick={() => setVueMode("vocal")} title="Écran vocal IKO"
            style={{width:"36px",height:"36px",borderRadius:"50%",background:C.card,border:"1px solid "+C.orBord,color:C.or,cursor:"pointer",fontSize:"15px"}}>
            🔮
          </button>
          {amandineOuverte && (
            <button onClick={() => setAmandineOuverte(false)} style={{width:"36px",height:"36px",borderRadius:"50%",background:C.card,border:"1px solid "+C.border,color:C.muted,cursor:"pointer",fontSize:"14px"}}>✕</button>
          )}
          <button
            onPointerDown={() => { debloquerVoixIOS(); setAmandineOuverte(true); lancerEcouteAmandine(); }}
            onPointerUp={arreterEcouteAmandine}
            onPointerLeave={arreterEcouteAmandine}
            onPointerCancel={arreterEcouteAmandine}
            style={{width:"58px",height:"58px",borderRadius:"50%",background:amandineEcoute?C.rouge:"radial-gradient(circle at 35% 30%, #FFB067, #22C55E 55%, #7a3200 100%)",border:"none",color:"#111",cursor:"pointer",fontSize:"24px",boxShadow:"0 0 26px rgba(34,197,94,0.4)",animation:amandineEcoute?"pulse 1.2s infinite":"none",touchAction:"none",userSelect:"none"}}>
            🎙️
          </button>
        </div>
      </div>
      <style>{`@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
@keyframes clignoteUrgent{0%,100%{opacity:1;}50%{opacity:0.35;}}`}</style>

      <button onClick={() => setDebugOuvert(v => !v)}
        style={{position:"fixed",left:"12px",bottom:"12px",zIndex:9999,width:"38px",height:"38px",borderRadius:"50%",background:"#111",color:"#fff",border:"1px solid rgba(255,255,255,0.2)",fontSize:"16px",cursor:"pointer",boxShadow:"0 2px 10px rgba(0,0,0,0.3)"}}>
        🔧
      </button>
      {debugOuvert && (
        <div style={{position:"fixed",left:"12px",bottom:"58px",zIndex:9999,maxWidth:"90vw",width:"420px",maxHeight:"60vh",overflow:"auto",background:"#111",color:"#0f0",border:"1px solid rgba(255,255,255,0.2)",borderRadius:"10px",padding:"12px",fontFamily:"monospace",fontSize:"10.5px",whiteSpace:"pre-wrap",wordBreak:"break-all",boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>
          <div style={{color:"#fff",fontWeight:"700",marginBottom:"8px"}}>🔧 Diagnostic chargement tickets</div>
          {debugInfo ? JSON.stringify(debugInfo, null, 2) : "(pas encore chargé — attends le prochain rafraîchissement)"}
        </div>
      )}
    </div>
  );
}

function Login({ onLogin }) {
  const [pwd, setPwd] = React.useState("");
  const [error, setError] = React.useState(false);
  const [show, setShow] = React.useState(false);
  const tenter = () => {
    const access = PASSWORDS[pwd.trim()];
    if (access) { onLogin(access); }
    else { setError(true); setTimeout(() => setError(false), 2000); }
  };
  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",position:"relative"}}>
      <button onClick={() => window.location.href = "/"} title="Fermer"
        style={{position:"absolute",top:"20px",right:"20px",background:"rgba(220,38,38,0.08)",border:"1px solid rgba(220,38,38,0.25)",color:"rgba(220,38,38,0.85)",borderRadius:"8px",width:"34px",height:"34px",cursor:"pointer",fontSize:"16px",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
      <div style={{width:"100%",maxWidth:"340px"}}>
        <div style={{textAlign:"center",marginBottom:"36px"}}>
          <div style={{width:"190px",height:"100px",background:"#FFFFFF",borderRadius:"16px",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",boxShadow:"0 8px 32px rgba(218,178,57,0.3)",padding:"8px",boxSizing:"border-box"}}>
            <img src={CONFIG_ENTREPRISE.logoUrl || IKO_LOGO} alt="Iko" style={{width:"100%",height:"100%",objectFit:"contain"}}/>
          </div>
          <div style={{fontSize:"11px",color:C.muted,marginTop:"6px",letterSpacing:"2px",textTransform:"uppercase"}}>Dashboard SAV</div>
        </div>
        <div style={{background:C.card,border:"1px solid "+(error?"rgba(220,38,38,0.4)":C.orBord),borderRadius:"16px",padding:"24px"}}>
          <div style={{position:"relative",marginBottom:"14px"}}>
            <input type={show?"text":"password"} placeholder="Mot de passe agence" value={pwd}
              onChange={e => setPwd(e.target.value)} onKeyDown={e => e.key==="Enter"&&tenter()}
              style={{paddingRight:"40px",fontSize:"16px",textAlign:"center",letterSpacing:"2px"}}/>
            <button onClick={() => setShow(!show)} style={{position:"absolute",right:"12px",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:"16px",width:"auto",padding:"0"}}>
              {show?"🙈":"👁️"}
            </button>
          </div>
          {error && <div style={{fontSize:"11px",color:C.rouge,marginBottom:"10px",textAlign:"center"}}>Mot de passe incorrect</div>}
          <button onClick={tenter} style={{width:"100%",padding:"14px",background:C.or,color:"#111",border:"none",borderRadius:"10px",fontSize:"14px",fontWeight:"900",cursor:"pointer"}}>
            Accéder →
          </button>
        </div>
      </div>
    </div>
  );
}

function BlocageAcces() {
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'14px',padding:'24px',textAlign:'center',background:'#0A0A0A',color:'#F5F5F5',fontFamily:'-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif'}}>
      <div style={{fontSize:'40px'}}>🔒</div>
      <div style={{fontSize:'18px',fontWeight:700}}>Accès suspendu</div>
      <div style={{fontSize:'14px',opacity:0.75,maxWidth:'380px'}}>L'accès à cet espace est temporairement suspendu. Merci de contacter votre interlocuteur RSIA Conseil pour régulariser la situation.</div>
    </div>
  );
}

function App() {
  const [access, setAccess] = React.useState(null);
  const [bloque, setBloque] = React.useState(false);
  React.useEffect(() => {
    window.IKO_CLIENT_READY.then(() => {
      if (window.IKO_CLIENT_INFO && window.IKO_CLIENT_INFO["Accès bloqué"] === true) setBloque(true);
    });
  }, []);
  if (bloque) return <BlocageAcces/>;
  return access ? <Dashboard agenceAccess={access} onClose={() => setAccess(null)}/> : <Login onLogin={setAccess}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  // Enregistrement du service worker : rend la page installable
  // (icône écran d'accueil, plein écran) sur Android et iOS.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
