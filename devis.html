function CreneauPicker({ agenceVille, onSelect }) {
  const [typeCreneau, setTypeCreneau] = React.useState(null);
  const [dates, setDates] = React.useState([]);
  const [loading, setLoading] = React.useState(false);

  const CRENEAUX = [
    { id: "matin", label: "🌅 Matin", heure: "8h30 — 12h00", valeur: "Matin (8h30 — 12h00)" },
    { id: "apres_midi", label: "🌇 Après-midi", heure: "13h00 — 17h00", valeur: "Après-midi (13h00 — 17h00)" },
  ];
  const DELAI_MIN_JOURS = 7;

  const charger = async (c) => {
    setLoading(true); setDates([]);
    try {
      const f = encodeURIComponent('AND({Agence}="' + agenceVille + '",{Créneau}="' + c.valeur + '",{Statut}="Libre")');
      const url = '/api/airtable/Planning?filterByFormula=' + f + '&sort[0][field]=Date&sort[0][direction]=asc&maxRecords=60';
      const r = await fetch(url);
      const json = await r.json();
      const auPlusTot = new Date();
      auPlusTot.setDate(auPlusTot.getDate() + DELAI_MIN_JOURS);
      const auPlusTotStr = auPlusTot.toISOString().split('T')[0];
      const map = {};
      (json.records || []).forEach(rec => {
        const d = rec.fields.Date;
        if (d < auPlusTotStr) return;
        if (!map[d]) map[d] = { date: d, ids: [] };
        map[d].ids.push(rec.id);
      });
      setDates(Object.values(map).slice(0, 5));
    } catch(e) { console.error(e); }
    setLoading(false);
  };

  const choisir = async (dateInfo) => {
    const d = new Date(dateInfo.date + 'T12:00:00');
    const label = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    onSelect(typeCreneau.label + ' (' + typeCreneau.heure + ') \u2014 ' + label, dateInfo.ids[0]);
  };

  if (!typeCreneau) {
    return (
      <div style={{background:F.blanc,borderRadius:"12px",padding:"14px",border:"1px solid " + F.grisBord}}>
        <div style={{fontSize:"12px",fontWeight:"700",color:F.marine,marginBottom:"10px",borderLeft:"3px solid " + F.or,paddingLeft:"8px"}}>Quel créneau vous convient ?</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
          {CRENEAUX.map(c => (
            <button key={c.id} onClick={() => { setTypeCreneau(c); charger(c); }}
              style={{padding:"14px 10px",border:"2px solid " + F.grisBord,borderRadius:"12px",background:F.blanc,cursor:"pointer",textAlign:"center"}}>
              <div style={{fontSize:"13px",fontWeight:"700",color:F.marine}}>{c.label}</div>
              <div style={{fontSize:"11px",color:"#64748B",marginTop:"2px"}}>{c.heure}</div>
            </button>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div style={{background:F.blanc,borderRadius:"12px",padding:"14px",border:"1px solid " + F.grisBord}}>
      <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px"}}>
        <span style={{fontSize:"12px",color:F.or,fontWeight:"700"}}>{typeCreneau.label}</span>
        <button onClick={() => { setTypeCreneau(null); setDates([]); }}
          style={{fontSize:"11px",color:"#94A3B8",background:"none",border:"none",cursor:"pointer"}}>← Changer</button>
      </div>
      {loading && <div style={{textAlign:"center",padding:"16px",color:"#64748B",fontSize:"12px"}}>⏳ Chargement des disponibilités...</div>}
      {!loading && dates.length === 0 && (
        <div style={{textAlign:"center",padding:"16px",color:F.rouge,fontSize:"12px"}}>Aucune disponibilité. Essayez l'autre créneau.</div>
      )}
      {!loading && dates.length > 0 && (
        <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
          {dates.map((d, i) => {
            const dateObj = new Date(d.date + 'T12:00:00');
            const label = dateObj.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
            return (
              <button key={i} onClick={() => choisir(d)}
                style={{padding:"12px 14px",border:"2px solid " + F.grisBord,borderRadius:"10px",background:F.blanc,cursor:"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:"13px",fontWeight:"700",color:F.marine,textTransform:"capitalize"}}>{label}</div>
                <span style={{color:F.or,fontSize:"16px"}}>→</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function DevisItemiseView({ devisId }) {
  const [statutPage, setStatutPage] = React.useState("chargement"); // chargement|introuvable|attente|refuser|termine
  const [devis, setDevis] = React.useState(null);
  const [motifRefus, setMotifRefus] = React.useState("");
  const [saving, setSaving] = React.useState(false);
  const [resultat, setResultat] = React.useState(null); // 'accepte' | 'refuse'
  const [refreshing, setRefreshing] = React.useState(false);

  const charger = async () => {
    try {
      const r = await fetch('/api/airtable/Devis/' + devisId);
      if (!r.ok) { setStatutPage("introuvable"); return; }
      const d = await r.json();
      if (!d || !d.fields) { setStatutPage("introuvable"); return; }
      setDevis(d);
      if (d.fields["Devis refusé"]) { setResultat('refuse'); setStatutPage("termine"); }
      else if (d.fields.Statut === "Validé") { setResultat('accepte'); setStatutPage("termine"); }
      else { setStatutPage("attente"); }
    } catch(e) { setStatutPage("introuvable"); }
  };

  React.useEffect(() => { charger(); }, []);

  const refuser = async () => {
    setSaving(true);
    try {
      await fetch('/api/airtable/Devis/' + devisId, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { "Devis refusé": true, "Motif refus": motifRefus || '(sans motif précisé)' } })
      });
      setResultat('refuse'); setStatutPage("termine");
    } catch(e) { console.error(e); }
    setSaving(false);
  };

  const rafraichir = async () => { setRefreshing(true); await charger(); setRefreshing(false); };

  let lignes = [];
  try { lignes = JSON.parse(devis?.fields?.["Lignes devis (JSON)"] || "[]"); } catch(e){}

  return (
    <div style={{width:"100%",maxWidth:"480px"}}>
      <div style={{display:"flex",justifyContent:"center",marginBottom:"28px"}}>
        <img src={IKO_LOGO} alt="Iko" style={{width:"200px",height:"auto"}}/>
      </div>

      {statutPage === "chargement" && (
        <div style={{textAlign:"center",padding:"40px 0",color:"#64748B"}}>⏳ Chargement de votre devis...</div>
      )}

      {statutPage === "introuvable" && (
        <div style={{background:F.blanc,borderRadius:"14px",padding:"28px",textAlign:"center",border:"1px solid "+F.grisBord}}>
          <div style={{fontSize:"36px",marginBottom:"10px"}}>🔍</div>
          <div style={{fontSize:"15px",fontWeight:"700",color:F.marine,marginBottom:"6px"}}>Devis introuvable</div>
          <div style={{fontSize:"13px",color:"#64748B"}}>Le lien est invalide ou a expiré. Contactez votre agence pour plus d'informations.</div>
        </div>
      )}

      {statutPage === "attente" && devis && (
        <div style={{background:F.blanc,borderRadius:"14px",padding:"24px",border:"1px solid "+F.grisBord}}>
          <div style={{fontSize:"11px",color:F.or,fontWeight:"700",fontFamily:"monospace",marginBottom:"6px"}}>{devis.fields["N° devis"]}</div>
          <div style={{fontSize:"17px",fontWeight:"900",color:F.marine,marginBottom:"14px"}}>Votre devis SAV</div>

          <div style={{border:"1px solid "+F.grisBord,borderRadius:"10px",overflow:"hidden",marginBottom:"14px"}}>
            {lignes.map((l, i) => (
              <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"9px 12px",borderBottom:i<lignes.length-1?"1px solid "+F.grisBord:"none",fontSize:"12px"}}>
                <span>{l.designation} <span style={{color:"#94A3B8"}}>×{l.qte}</span></span>
                <span style={{fontWeight:"700"}}>{(l.totalHT||0).toFixed(2)} €</span>
              </div>
            ))}
          </div>

          <div style={{background:F.marine,borderRadius:"12px",padding:"16px",textAlign:"center",marginBottom:"18px"}}>
            <div style={{color:F.orClair,fontSize:"10px",fontWeight:"600",letterSpacing:"2px",marginBottom:"6px"}}>MONTANT TTC</div>
            <div style={{color:F.or,fontSize:"26px",fontWeight:"900"}}>{(devis.fields["Montant TTC"]||0).toFixed(2)} €</div>
          </div>

          {saving ? (
            <div style={{textAlign:"center",padding:"20px 0",color:"#64748B",fontSize:"13px"}}>⏳ Enregistrement en cours...</div>
          ) : devis.fields["Yousign Signer Link"] ? (
            <div>
              <a href={devis.fields["Yousign Signer Link"]} target="_blank" rel="noopener noreferrer"
                style={{display:"block",textAlign:"center",padding:"13px",background:F.or,color:"#111",borderRadius:"10px",fontSize:"13px",fontWeight:"900",textDecoration:"none",marginBottom:"10px"}}>
                ✍️ Signer électroniquement mon devis
              </a>
              <button onClick={rafraichir} disabled={refreshing}
                style={{width:"100%",padding:"10px",background:"#F3F4F6",color:"#374151",border:"1px solid #E2E2E2",borderRadius:"10px",fontSize:"12px",fontWeight:"700",cursor:refreshing?"not-allowed":"pointer",marginBottom:"10px"}}>
                {refreshing ? "⏳ Vérification..." : "🔄 J'ai signé, actualiser"}
              </button>
              <button onClick={() => setStatutPage("refuser")} style={{width:"100%",padding:"11px",background:"transparent",color:"#94A3B8",border:"none",fontSize:"12px",cursor:"pointer",textDecoration:"underline"}}>
                Je refuse ce devis
              </button>
            </div>
          ) : (
            <div style={{textAlign:"center",fontSize:"12px",color:"#94A3B8"}}>Signature électronique indisponible pour le moment — contactez votre agence.</div>
          )}
        </div>
      )}

      {statutPage === "refuser" && devis && (
        <div style={{background:F.blanc,borderRadius:"14px",padding:"24px",border:"1px solid "+F.grisBord}}>
          <button onClick={() => setStatutPage("attente")} style={{background:"none",border:"none",color:"#94A3B8",cursor:"pointer",fontSize:"12px",marginBottom:"14px"}}>← Retour</button>
          <div style={{fontSize:"15px",fontWeight:"900",color:F.marine,marginBottom:"10px"}}>❌ Refuser ce devis</div>
          <label style={{fontSize:"11px",fontWeight:"700",color:"#64748B",display:"block",marginBottom:"6px"}}>Motif (facultatif)</label>
          <textarea rows={3} placeholder="Ex : Trop cher, je préfère faire appel à quelqu'un d'autre..." value={motifRefus} onChange={e => setMotifRefus(e.target.value)} style={{resize:"none",marginBottom:"14px"}}/>
          <button onClick={refuser} disabled={saving}
            style={{width:"100%",padding:"13px",background:saving?"#D1D5DB":F.rouge,color:"#fff",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:saving?"not-allowed":"pointer"}}>
            {saving ? "⏳ Envoi..." : "Confirmer le refus"}
          </button>
        </div>
      )}

      {statutPage === "termine" && resultat === "accepte" && (
        <div style={{background:F.blanc,borderRadius:"14px",padding:"28px",textAlign:"center",border:"1px solid "+F.grisBord}}>
          <div style={{fontSize:"40px",marginBottom:"10px"}}>✅</div>
          <div style={{fontSize:"16px",fontWeight:"900",color:F.marine,marginBottom:"6px"}}>Devis signé, merci !</div>
          <div style={{fontSize:"13px",color:"#64748B",marginBottom:"14px"}}>
            {devis?.fields?.["Date intervention proposée"] ? "Votre intervention est planifiée :" : "Votre agence va vous recontacter pour planifier l'intervention."}
          </div>
          {devis?.fields?.["Date intervention proposée"] && (
            <div style={{background:F.marine,borderRadius:"10px",padding:"12px",color:F.or,fontWeight:"700",fontSize:"13px"}}>{devis.fields["Date intervention proposée"]}</div>
          )}
        </div>
      )}

      {statutPage === "termine" && resultat === "refuse" && (
        <div style={{background:F.blanc,borderRadius:"14px",padding:"28px",textAlign:"center",border:"1px solid "+F.grisBord}}>
          <div style={{fontSize:"40px",marginBottom:"10px"}}>👍</div>
          <div style={{fontSize:"16px",fontWeight:"900",color:F.marine,marginBottom:"6px"}}>Devis refusé</div>
          <div style={{fontSize:"13px",color:"#64748B"}}>Votre réponse a bien été transmise à l'agence. N'hésitez pas à nous recontacter si besoin.</div>
        </div>
      )}

      <div style={{textAlign:"center",marginTop:"24px",fontSize:"10px",color:"#94A3B8"}}>© Iko Suite — Solutions IA pour les PME du bâtiment</div>
    </div>
  );
}

function App() {
  const devisId = new URLSearchParams(window.location.search).get('devisId');
  if (devisId) {
    return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",padding:"24px 16px"}}><DevisItemiseView devisId={devisId}/></div>;
  }

  const [statutPage, setStatutPage] = React.useState("chargement"); // chargement|introuvable|attente|refuser|accepte_creneau|termine
  const [ticket, setTicket] = React.useState(null);
  const [motifRefus, setMotifRefus] = React.useState("");
  const [saving, setSaving] = React.useState(false);
  const [resultat, setResultat] = React.useState(null); // 'accepte' | 'refuse'
  const [creneauFinal, setCreneauFinal] = React.useState("");

  const token = new URLSearchParams(window.location.search).get('token');

  const charger = async () => {
    if (!token) { setStatutPage("introuvable"); return; }
    try {
      const f = encodeURIComponent('{Devis Token}="' + token + '"');
      const url = '/api/airtable/Tickets%20SAV?filterByFormula=' + f + '&maxRecords=1';
      const r = await fetch(url);
      const json = await r.json();
      if (!json.records || json.records.length === 0) { setStatutPage("introuvable"); return; }
      const t = json.records[0];
      setTicket(t);
      const statut = t.fields?.Statut;
      if (statut === "Devis refusé") { setResultat('refuse'); setStatutPage("termine"); }
      else if (statut === "Nouveau" || statut === "En cours") { setResultat('accepte'); setStatutPage("termine"); }
      else { setStatutPage("attente"); }
    } catch(e) { setStatutPage("introuvable"); }
  };

  React.useEffect(() => { charger(); }, []);

  const notifier = async (action, extra) => {
    try {
      await fetch(WEBHOOK, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          marque: 'iko', action,
          ticket: ticket.fields?.Name, nom: ticket.fields?.Client, "e-mail": ticket.fields?.Email || '',
          agence: ticket.fields?.Agence, produit: ticket.fields?.Produit, probleme: ticket.fields?.Problème,
          montant: ticket.fields?.["Montant devis"] || '', ...extra
        })
      });
    } catch(e) { console.error(e); }
  };

  const refuser = async () => {
    setSaving(true);
    try {
      await fetch('/api/airtable/Tickets%20SAV/' + ticket.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Statut: 'Devis refusé', Commentaire: 'Devis refusé par le client : ' + (motifRefus || '(sans motif précisé)') } })
      });
      await notifier('devis_refuse', { motif: motifRefus });
      setResultat('refuse');
      setStatutPage("termine");
    } catch(e) { console.error(e); }
    setSaving(false);
  };

  const surCreneauChoisi = async (creneauLabel, planningId) => {
    setSaving(true);
    try {
      await fetch('/api/airtable/Planning/' + planningId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Statut: 'Pris' } })
      });
      await fetch('/api/airtable/Tickets%20SAV/' + ticket.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Statut: 'Nouveau', Créneau: creneauLabel, PlanningID: planningId } })
      });
      await notifier('devis_accepte', { creneau: creneauLabel });
      setCreneauFinal(creneauLabel);
      setResultat('accepte');
      setStatutPage("termine");
    } catch(e) { console.error(e); }
    setSaving(false);
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",padding:"24px 16px"}}>
      <div style={{width:"100%",maxWidth:"480px"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:"28px"}}>
          <img src={IKO_LOGO} alt="Iko" style={{width:"200px",height:"auto"}}/>
        </div>

        {statutPage === "chargement" && (
          <div style={{textAlign:"center",padding:"40px 0",color:"#64748B"}}>⏳ Chargement de votre devis...</div>
        )}

        {statutPage === "introuvable" && (
          <div style={{background:F.blanc,borderRadius:"14px",padding:"28px",textAlign:"center",border:"1px solid "+F.grisBord}}>
            <div style={{fontSize:"36px",marginBottom:"10px"}}>🔍</div>
            <div style={{fontSize:"15px",fontWeight:"700",color:F.marine,marginBottom:"6px"}}>Devis introuvable</div>
            <div style={{fontSize:"13px",color:"#64748B"}}>Le lien est invalide ou a expiré. Contactez votre agence pour plus d'informations.</div>
          </div>
        )}

        {statutPage === "attente" && ticket && (
          <div style={{background:F.blanc,borderRadius:"14px",padding:"24px",border:"1px solid "+F.grisBord}}>
            <div style={{fontSize:"11px",color:F.or,fontWeight:"700",fontFamily:"monospace",marginBottom:"6px"}}>{ticket.fields?.Name}</div>
            <div style={{fontSize:"17px",fontWeight:"900",color:F.marine,marginBottom:"4px"}}>Votre devis SAV</div>
            <div style={{fontSize:"12px",color:"#64748B",marginBottom:"18px"}}>{ticket.fields?.Produit} — {ticket.fields?.Problème}</div>

            {ticket.fields?.Diagnostic && (
              <div style={{background:"#F3F4F6",borderRadius:"10px",padding:"12px 14px",marginBottom:"14px",fontSize:"12px",color:"#374151"}}>
                <div style={{fontWeight:"700",color:F.marine,marginBottom:"4px"}}>📋 Diagnostic de notre technicien</div>
                {ticket.fields.Diagnostic}
              </div>
            )}

            <div style={{background:F.marine,borderRadius:"12px",padding:"16px",textAlign:"center",marginBottom:"18px"}}>
              <div style={{color:F.orClair,fontSize:"10px",fontWeight:"600",letterSpacing:"2px",marginBottom:"6px"}}>MONTANT DU DEVIS</div>
              <div style={{color:F.or,fontSize:"26px",fontWeight:"900"}}>{ticket.fields?.["Montant devis"]}</div>
            </div>

            <DecisionZone ticket={ticket} onAccepterCreneau={surCreneauChoisi} onOuvrirRefus={() => setStatutPage("refuser")} saving={saving} onRefresh={charger}/>
          </div>
        )}

        {statutPage === "refuser" && ticket && (
          <div style={{background:F.blanc,borderRadius:"14px",padding:"24px",border:"1px solid "+F.grisBord}}>
            <button onClick={() => setStatutPage("attente")} style={{background:"none",border:"none",color:"#94A3B8",cursor:"pointer",fontSize:"12px",marginBottom:"14px"}}>← Retour</button>
            <div style={{fontSize:"15px",fontWeight:"900",color:F.marine,marginBottom:"10px"}}>❌ Refuser ce devis</div>
            <label style={{fontSize:"11px",fontWeight:"700",color:"#64748B",display:"block",marginBottom:"6px"}}>Motif (facultatif)</label>
            <textarea rows={3} placeholder="Ex : Trop cher, je préfère faire appel à quelqu'un d'autre..." value={motifRefus} onChange={e => setMotifRefus(e.target.value)} style={{resize:"none",marginBottom:"14px"}}/>
            <button onClick={refuser} disabled={saving}
              style={{width:"100%",padding:"13px",background:saving?"#D1D5DB":F.rouge,color:"#fff",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:saving?"not-allowed":"pointer"}}>
              {saving ? "⏳ Envoi..." : "Confirmer le refus"}
            </button>
          </div>
        )}

        {statutPage === "termine" && ticket && resultat === "accepte" && (
          <div style={{background:F.blanc,borderRadius:"14px",padding:"28px",textAlign:"center",border:"1px solid "+F.grisBord}}>
            <div style={{fontSize:"40px",marginBottom:"10px"}}>✅</div>
            <div style={{fontSize:"16px",fontWeight:"900",color:F.marine,marginBottom:"6px"}}>Devis accepté, RDV planifié !</div>
            <div style={{fontSize:"13px",color:"#64748B",marginBottom:"14px"}}>Notre technicien reviendra effectuer l'intervention :</div>
            <div style={{background:F.marine,borderRadius:"10px",padding:"12px",color:F.or,fontWeight:"700",fontSize:"13px"}}>{creneauFinal || ticket.fields?.Créneau}</div>
          </div>
        )}

        {statutPage === "termine" && resultat === "refuse" && (
          <div style={{background:F.blanc,borderRadius:"14px",padding:"28px",textAlign:"center",border:"1px solid "+F.grisBord}}>
            <div style={{fontSize:"40px",marginBottom:"10px"}}>👍</div>
            <div style={{fontSize:"16px",fontWeight:"900",color:F.marine,marginBottom:"6px"}}>Devis refusé</div>
            <div style={{fontSize:"13px",color:"#64748B"}}>Votre réponse a bien été transmise à l'agence. N'hésitez pas à nous recontacter si besoin.</div>
          </div>
        )}

        <div style={{textAlign:"center",marginTop:"24px",fontSize:"10px",color:"#94A3B8"}}>© Iko Suite — Solutions IA pour les PME du bâtiment</div>
      </div>
    </div>
  );
}

function DecisionZone({ ticket, onAccepterCreneau, onOuvrirRefus, saving, onRefresh }) {
  const [modeAcceptation, setModeAcceptation] = React.useState(false);
  const [refreshing, setRefreshing] = React.useState(false);

  if (saving) {
    return <div style={{textAlign:"center",padding:"20px 0",color:"#64748B",fontSize:"13px"}}>⏳ Enregistrement en cours...</div>;
  }

  const lienSignature = ticket.fields?.["Yousign Signer Link"];
  const devisSigne = !!ticket.fields?.["Devis Signé"];

  // Si une signature électronique est requise et pas encore effectuée,
  // on bloque l'accès direct au choix de créneau tant que le client n'a
  // pas signé sur Yousign (le webhook coche "Devis Signé" à la volée).
  if (lienSignature && !devisSigne) {
    const rafraichir = async () => {
      setRefreshing(true);
      await onRefresh();
      setRefreshing(false);
    };
    return (
      <div>
        <a href={lienSignature} target="_blank" rel="noopener noreferrer"
          style={{display:"block",textAlign:"center",padding:"13px",background:F.or,color:"#111",borderRadius:"10px",fontSize:"13px",fontWeight:"900",textDecoration:"none",marginBottom:"10px"}}>
          ✍️ Signer électroniquement mon devis
        </a>
        <button onClick={rafraichir} disabled={refreshing}
          style={{width:"100%",padding:"10px",background:"#F3F4F6",color:"#374151",border:"1px solid #E2E2E2",borderRadius:"10px",fontSize:"12px",fontWeight:"700",cursor:refreshing?"not-allowed":"pointer",marginBottom:"10px"}}>
          {refreshing ? "⏳ Vérification..." : "🔄 J'ai signé, actualiser"}
        </button>
        <button onClick={onOuvrirRefus} style={{width:"100%",padding:"11px",background:"transparent",color:"#94A3B8",border:"none",fontSize:"12px",cursor:"pointer",textDecoration:"underline"}}>
          Je refuse ce devis
        </button>
      </div>
    );
  }

  if (modeAcceptation) {
    return <CreneauPicker agenceVille={ticket.fields?.Agence} onSelect={onAccepterCreneau}/>;
  }

  return (
    <div style={{display:"flex",gap:"10px"}}>
      <button onClick={onOuvrirRefus} style={{flex:1,padding:"13px",background:"#F3F4F6",color:"#374151",border:"1px solid #E2E2E2",borderRadius:"10px",fontSize:"13px",fontWeight:"700",cursor:"pointer"}}>❌ Refuser</button>
      <button onClick={() => setModeAcceptation(true)} style={{flex:2,padding:"13px",background:F.or,color:"#111",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:"pointer"}}>✅ Accepter le devis</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
