<script>

<script type="text/babel">
const { useState } = React;

const F = {
  marine: "#0D0D0D", or: "#22C55E", orClair: "#F0DFA8",
  blanc: "#FFFFFF", grisClair: "#F5F5F5", grisBord: "#E5E5E5",
  rouge: "#DC2626", rougeClair: "#FEE2E2", vert: "#15803D", vertClair: "#F0FDF4",
  bleu: "#2563EB", bleuClair: "#EFF6FF", jaune: "#D97706", jauneClair: "#FFFBEB",
};

function parseMessageEntries(raw, sender) {
  if (!raw) return [];
  const parts = raw.split(/\n\n(?=\[\d{2}\/\d{2}\/\d{4} \d{2}:\d{2}\])/);
  return parts.map(part => {
    const m = part.match(/^\[(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})\]\n([\s\S]*)$/);
    if (!m) return { sender, dateLabel: '', text: part.trim(), sortKey: 0 };
    const [, dd, mm, yyyy, hh, min, text] = m;
    const sortKey = new Date(+yyyy, +mm - 1, +dd, +hh, +min).getTime();
    return { sender, dateLabel: dd + '/' + mm + ' ' + hh + ':' + min, text: text.trim(), sortKey };
  });
}

// Carte "choix de date" affichée comme un message de l'agence dans le fil SMS,
// quand Iko a detecte une demande de changement de date et trouve des dispos.
function PropositionDateBubble({ agenceVille, creneauId, moisSouhaite, onChoisir, enCours }) {
  const creneau = CRENEAUX.find(c => c.id === creneauId) || CRENEAUX[0];
  const [dates, setDates] = useState([]);
  const [loading, setLoading] = useState(true);

  React.useEffect(() => {
    let annule = false;
    (async () => {
      try {
        const f = encodeURIComponent('AND({Agence}="' + agenceVille + '",{Créneau}="' + creneau.valeur + '",{Statut}="Libre")');
        const url = '/api/airtable/Planning?filterByFormula=' + f + '&sort[0][field]=Date&sort[0][direction]=asc&maxRecords=60';
        const r = await fetch(url);
        const json = await r.json();
        const auPlusTot = new Date();
        auPlusTot.setDate(auPlusTot.getDate() + DELAI_MIN_JOURS);
        const auPlusTotStr = auPlusTot.toISOString().split('T')[0];
        const map = {};
        (json.records || []).forEach(rec => {
          const d = rec.fields.Date;
          if (!d || d < auPlusTotStr) return;
          if (moisSouhaite && d.slice(0, 7) !== moisSouhaite) return;
          if (!map[d]) map[d] = { date: d, ids: [] };
          map[d].ids.push(rec.id);
        });
        if (!annule) setDates(Object.values(map).slice(0, 3));
      } catch (e) { console.error(e); }
      if (!annule) setLoading(false);
    })();
    return () => { annule = true; };
  }, [creneauId, moisSouhaite]);

  return (
    <div style={{alignSelf:"flex-start",maxWidth:"85%",background:"#FFFFFF",border:"1px solid "+F.or,borderRadius:"18px 18px 18px 4px",padding:"10px 12px",boxShadow:"0 1px 2px rgba(0,0,0,0.08)"}}>
      <div style={{fontSize:"11px",fontWeight:"800",color:F.marine,marginBottom:"7px"}}>{creneau.label} ({creneau.heure}) — choisissez une date :</div>
      {loading && <div style={{fontSize:"11px",color:"#64748B"}}>⏳ Chargement des disponibilités…</div>}
      {!loading && dates.length === 0 && <div style={{fontSize:"11px",color:F.rouge}}>Plus de disponibilité pour l'instant, un conseiller va revenir vers vous.</div>}
      {!loading && dates.length > 0 && (
        <div style={{display:"flex",flexDirection:"column",gap:"5px"}}>
          {dates.map((d, i) => {
            const label = new Date(d.date + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
            return (
              <button key={i} disabled={enCours} onClick={() => onChoisir(creneau, d)}
                style={{padding:"9px 10px",border:"1px solid "+F.grisBord,borderRadius:"8px",background:F.grisClair,cursor:enCours?"default":"pointer",textAlign:"left",fontSize:"11px",fontWeight:"700",color:F.marine,textTransform:"capitalize",display:"flex",justifyContent:"space-between"}}>
                <span>{label}</span><span style={{color:F.or}}>→</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Module de conversation façon téléphone/SMS, dans le même esprit visuel
// que le dashboard agence : bulles iMessage, cadre de téléphone avec encoche.
function PhoneChat({ ticket, message, onChangeMessage, onEnvoyer, envoi, propositionEnAttente, propositionCreneau, propositionMois, onChoisirProposition, changeEnCours }) {
  const scrollRef = React.useRef(null);
  const entries = [
    ...parseMessageEntries(ticket.fields?.["Message client"], 'client'),
    ...parseMessageEntries(ticket.fields?.["Réponse agence"], 'agence'),
  ].sort((a, b) => a.sortKey - b.sortKey);
  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [entries.length, propositionEnAttente]);

  return (
    <div style={{background:"#0B0B0F",borderRadius:"36px",padding:"10px",boxShadow:"0 20px 50px rgba(0,0,0,0.25)",maxWidth:"340px",margin:"0 auto"}}>
      <div style={{position:"relative"}}>
        <div style={{position:"absolute",top:"0",left:"50%",transform:"translateX(-50%)",width:"110px",height:"22px",background:"#0B0B0F",borderRadius:"0 0 16px 16px",zIndex:2}}/>
        <div style={{background:"#ECE9E4",borderRadius:"28px",overflow:"hidden",display:"flex",flexDirection:"column",height:"600px"}}>
          <div style={{background:F.marine,padding:"20px 14px 10px",display:"flex",alignItems:"center",gap:"10px",flexShrink:0}}>
            <div style={{width:"30px",height:"30px",borderRadius:"50%",background:F.or,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"900",color:"#111",fontSize:"13px"}}>
              F
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{color:"#fff",fontSize:"12px",fontWeight:"700"}}>Agence Iko</div>
              <div style={{color:"rgba(255,255,255,0.5)",fontSize:"9px"}}>SMS · Suivi SAV</div>
            </div>
          </div>
          <div ref={scrollRef} style={{flex:1,overflowY:"auto",padding:"12px 10px",display:"flex",flexDirection:"column",gap:"7px"}}>
            {entries.length === 0 && (
              <div style={{textAlign:"center",color:"#9CA3AF",fontSize:"11px",marginTop:"24px"}}>Aucun message pour l'instant.<br/>Écrivez à votre agence ci-dessous.</div>
            )}
            {entries.map((e, i) => (
              <div key={i} style={{display:"flex",flexDirection:"column",alignItems:e.sender==='agence'?"flex-start":"flex-end"}}>
                <div style={{
                  maxWidth:"78%",
                  background:e.sender==='agence'?"#FFFFFF":"linear-gradient(135deg,#0A84FF,#0066DD)",
                  color:e.sender==='agence'?"#111":"#fff",
                  borderRadius:e.sender==='agence'?"18px 18px 18px 4px":"18px 18px 4px 18px",
                  padding:"8px 12px",fontSize:"12px",whiteSpace:"pre-wrap",lineHeight:"1.35",
                  boxShadow:"0 1px 2px rgba(0,0,0,0.08)"
                }}>
                  {e.text}
                </div>
                <span style={{fontSize:"8px",color:"#9CA3AF",marginTop:"2px",padding:"0 4px"}}>{e.dateLabel}</span>
              </div>
            ))}
            {propositionEnAttente && (
              <PropositionDateBubble agenceVille={ticket.fields?.Agence} creneauId={propositionCreneau} moisSouhaite={propositionMois} onChoisir={onChoisirProposition} enCours={changeEnCours}/>
            )}
          </div>
          <div style={{background:"#fff",borderTop:"1px solid #E5E7EB",padding:"9px",display:"flex",gap:"8px",alignItems:"center",flexShrink:0}}>
            <input value={message} onChange={e => onChangeMessage(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && message.trim()) onEnvoyer(); }}
              placeholder="Votre message..."
              style={{flex:1,border:"1px solid #E5E7EB",borderRadius:"18px",padding:"8px 13px",fontSize:"12px",outline:"none",background:"#F3F4F6"}}/>
            <button onClick={onEnvoyer} disabled={!message.trim()||envoi==='sending'}
              style={{width:"32px",height:"32px",borderRadius:"50%",background:message.trim()?"#0A84FF":"#D1D5DB",border:"none",color:"#fff",cursor:message.trim()?"pointer":"not-allowed",fontSize:"14px",flexShrink:0}}>
              ↑
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

const STATUT_STYLE = {
  "Nouveau": { color: F.bleu, bg: F.bleuClair },
  "En cours": { color: F.jaune, bg: F.jauneClair },
  "Devis à faire": { color: F.marine, bg: "rgba(0,26,66,0.08)" },
  "Devis envoyé": { color: F.marine, bg: "rgba(0,26,66,0.08)" },
  "Devis - Suivi": { color: F.marine, bg: "rgba(0,26,66,0.08)" },
  "Devis - Attente fournisseur": { color: F.marine, bg: "rgba(0,26,66,0.08)" },
  "Devis refusé": { color: F.rouge, bg: F.rougeClair },
  "Terminé": { color: F.vert, bg: F.vertClair },
  "Annulé": { color: "#6B7280", bg: "#F3F4F6" },
};

const isStatutClos = (statut) => statut === "Terminé" || statut === "Annulé";

const CRENEAUX = [
  { id: "matin", label: "🌅 Matin", heure: "8h30 — 12h00", valeur: "Matin (8h30 — 12h00)" },
  { id: "apres_midi", label: "🌇 Après-midi", heure: "13h00 — 17h00", valeur: "Après-midi (13h00 — 17h00)" },
];
const DELAI_MIN_JOURS = 7;

function ChangerDatePanel({ agenceVille, onChoisir, onFermer, appliqueEnCours, periodePreremplie }) {
  const preremplie = CRENEAUX.find(c => c.id === periodePreremplie) || null;
  const [typeCreneau, setTypeCreneau] = useState(preremplie);
  React.useEffect(() => { if (preremplie) charger(preremplie); }, []);
  const [dates, setDates] = useState([]);
  const [loadingDates, setLoadingDates] = useState(false);

  const charger = async (c) => {
    setLoadingDates(true);
    setDates([]);
    try {
      const f = encodeURIComponent('AND({Agence}="' + agenceVille + '",{Créneau}="' + c.valeur + '",{Statut}="Libre")');
      const url = '/api/airtable/Planning?filterByFormula=' + f + '&sort[0][field]=Date&sort[0][direction]=asc&maxRecords=60';
      const r = await fetch(url);
      const json = await r.json();
      const auPlusTot = new Date();
      auPlusTot.setDate(auPlusTot.getDate() + DELAI_MIN_JOURS);
      const auPlusTotStr = auPlusTot.toISOString().split('T')[0];
      const map = {};
      (json.records || []).forEach(rec => {
        const d = rec.fields.Date;
        if (d < auPlusTotStr) return;
        if (!map[d]) map[d] = { date: d, ids: [] };
        map[d].ids.push(rec.id);
      });
      setDates(Object.values(map).slice(0, 5));
    } catch (e) { console.error(e); }
    setLoadingDates(false);
  };

  return (
    <div style={{background:F.grisClair,borderRadius:"10px",padding:"14px",marginTop:"12px",border:"1px solid "+F.grisBord}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"}}>
        <span style={{fontSize:"12px",fontWeight:"800",color:F.marine}}>📅 Choisir une nouvelle date</span>
        <button onClick={onFermer} style={{background:"none",border:"none",color:"#9CA3AF",fontSize:"12px",cursor:"pointer"}}>✕ Fermer</button>
      </div>

      {!typeCreneau && (
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
          {CRENEAUX.map(c => (
            <button key={c.id} onClick={() => { setTypeCreneau(c); charger(c); }}
              style={{padding:"12px 10px",border:"2px solid "+F.grisBord,borderRadius:"10px",background:F.blanc,cursor:"pointer",textAlign:"center"}}>
              <div style={{fontSize:"12px",fontWeight:"700",color:F.marine}}>{c.label}</div>
              <div style={{fontSize:"10px",color:"#64748B",marginTop:"2px"}}>{c.heure}</div>
            </button>
          ))}
        </div>
      )}

      {typeCreneau && (
        <div>
          <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"8px"}}>
            <span style={{fontSize:"11px",color:F.or,fontWeight:"700"}}>{typeCreneau.label}</span>
            <button onClick={() => { setTypeCreneau(null); setDates([]); }}
              style={{fontSize:"10px",color:"#94A3B8",background:"none",border:"none",cursor:"pointer"}}>← Changer</button>
          </div>
          {loadingDates && <div style={{textAlign:"center",padding:"14px",color:"#64748B",fontSize:"12px"}}>⏳ Chargement…</div>}
          {!loadingDates && dates.length === 0 && (
            <div style={{textAlign:"center",padding:"14px",color:F.rouge,fontSize:"12px"}}>Aucune disponibilité. Essayez l'autre créneau.</div>
          )}
          {!loadingDates && dates.length > 0 && (
            <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
              {dates.map((d, i) => {
                const dateObj = new Date(d.date + 'T12:00:00');
                const label = dateObj.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
                return (
                  <button key={i} disabled={appliqueEnCours} onClick={() => onChoisir(typeCreneau, d)}
                    style={{padding:"11px 12px",border:"2px solid "+F.grisBord,borderRadius:"8px",background:F.blanc,cursor:appliqueEnCours?"default":"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:"12px",fontWeight:"700",color:F.marine,textTransform:"capitalize"}}>{label}</span>
                    <span style={{color:F.or,fontSize:"14px"}}>→</span>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [numero, setNumero] = useState("");
  const [loading, setLoading] = useState(false);
  const [erreur, setErreur] = useState("");
  const [ticket, setTicket] = useState(null);
  const [message, setMessage] = useState("");
  const [envoi, setEnvoi] = useState(null); // null | 'sending' | 'ok' | 'err'
  const [showAnnulerConfirm, setShowAnnulerConfirm] = useState(false);
  const [annulEnCours, setAnnulEnCours] = useState(false);
  const [annulErr, setAnnulErr] = useState(false);
  const [raisonAnnulation, setRaisonAnnulation] = useState("");
  const [raisonManquante, setRaisonManquante] = useState(false);
  const [showChanger, setShowChanger] = useState(false);
  const [changeEnCours, setChangeEnCours] = useState(false);
  const [changeErr, setChangeErr] = useState(false);
  const [changeOk, setChangeOk] = useState(false);

  // Rafraîchissement auto pour voir arriver les réponses de l'agence dans la
  // fenêtre SMS sans que le client ait à relancer sa recherche.
  // Délai aléatoire ~90-100s (re-tiré à chaque cycle) plutôt qu'un setInterval
  // fixe : évite que tous les clients ouverts en même temps tapent l'API
  // Airtable à la même seconde, et surtout économise le quota API (compte
  // Airtable démo en plan Free, 1000 appels/mois partagés entre plusieurs
  // bases — un cycle de 3s par onglet client ouvert épuisait le quota en
  // quelques heures).
  React.useEffect(() => {
    if (!ticket) return;
    let timeoutId;
    const tick = async () => {
      try {
        const resp = await fetch('/api/airtable/Tickets%20SAV/' + ticket.id);
        const data = await resp.json();
        if (data && data.fields) {
          setTicket(prev => prev ? { ...prev, fields: { ...prev.fields, ...data.fields } } : prev);
        }
      } catch (e) {}
      timeoutId = setTimeout(tick, 90000 + Math.random() * 10000);
    };
    timeoutId = setTimeout(tick, 90000 + Math.random() * 10000);
    return () => clearTimeout(timeoutId);
  }, [ticket?.id]);

  const rechercher = async () => {
    const num = numero.trim();
    if (!num) { setErreur("Merci de saisir votre numéro de ticket."); return; }
    setLoading(true); setErreur(""); setTicket(null); setEnvoi(null); setMessage("");
    try {
      const formula = encodeURIComponent('UPPER({Name})=UPPER("' + num.replace(/"/g, '') + '")');
      const resp = await fetch('/api/airtable/Tickets%20SAV?filterByFormula=' + formula + '&maxRecords=1');
      const data = await resp.json();
      if (data.records && data.records.length > 0) {
        const found = data.records[0];
        if (found.fields?.Statut === 'Annulé') {
          setErreur("Cette demande a été annulée. Merci d'effectuer une nouvelle demande SAV pour obtenir un nouveau numéro de suivi.");
        } else {
          const compteClientIdSuivi = (found.fields?.["Compte client"] || [])[0];
          let bloque = false;
          if (compteClientIdSuivi) {
            try {
              const respClient = await fetch('/api/airtable/Clients/' + compteClientIdSuivi);
              const dataClient = await respClient.json();
              bloque = dataClient?.fields?.["Accès bloqué"] === true;
            } catch (e) {}
          }
          if (bloque) {
            setErreur("Ce service est temporairement suspendu. Merci de contacter votre interlocuteur pour régulariser la situation.");
          } else {
            setTicket(found);
          }
        }
      } else {
        setErreur("Aucune demande trouvée avec ce numéro. Vérifiez le numéro reçu par e-mail (ex : SAV-2026-1234).");
      }
    } catch (e) {
      setErreur("Erreur de connexion. Réessayez dans un instant.");
    }
    setLoading(false);
  };

  const envoyerMessage = async () => {
    if (!message.trim() || !ticket) return;
    setEnvoi('sending');
    try {
      const texteMessage = message.trim();
      const horodatage = new Date().toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' });
      const existant = ticket.fields?.["Message client"] || "";
      const nouveauTexte = existant
        ? existant + '\n\n[' + horodatage + ']\n' + texteMessage
        : '[' + horodatage + ']\n' + texteMessage;
      const resp = await fetch('/api/airtable/Tickets%20SAV/' + ticket.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { "Message client": nouveauTexte, "Message client non lu": true } })
      });
      if (!resp.ok) throw new Error('patch failed');
      setTicket(prev => ({ ...prev, fields: { ...prev.fields, "Message client": nouveauTexte, "Message client non lu": true } }));
      setMessage("");
      setEnvoi('ok');
      // E-mail d'accuse de reception automatique au client (best-effort, ne bloque pas l'UI si ca echoue)
      fetch('https://hook.eu1.make.com/n3lwi92wldkf22jcemmjfem334p4mv6a', { // webhook démo isolé
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'message_client', ticket: ticket.fields?.Name, message: texteMessage })
      }).catch(() => {});

      // Detection auto d'intention (changement de date) : best-effort, ne bloque pas
      // l'UI. En cas de reussite, une proposition est ecrite dans "Reponse agence"
      // et signalee par "Proposition auto en attente" (relu au prochain rafraichissement).
      fetch('/api/detecter-demande-client', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticketId: ticket.id, texte: texteMessage, agence: ticket.fields?.Agence, creneauActuel: ticket.fields?.Créneau })
      }).catch(() => {});
    } catch (e) {
      setEnvoi('err');
    }
  };

  const nouvelleRecherche = () => {
    setTicket(null); setNumero(""); setErreur(""); setMessage(""); setEnvoi(null);
    setShowAnnulerConfirm(false); setShowChanger(false); setChangeOk(false);
    setRaisonAnnulation(""); setRaisonManquante(false);
  };

  const libererCreneauSiBesoin = async (planningId) => {
    if (!planningId) return;
    try {
      await fetch('/api/airtable/Planning/' + planningId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Statut: 'Libre' } })
      });
    } catch (e) { console.error(e); }
  };

  const annulerDemande = async () => {
    if (!ticket) return;
    const raison = raisonAnnulation.trim();
    if (!raison) { setRaisonManquante(true); return; }
    setRaisonManquante(false);
    setAnnulEnCours(true); setAnnulErr(false);
    try {
      await libererCreneauSiBesoin(ticket.fields?.PlanningID);
      const resp = await fetch('/api/airtable/Tickets%20SAV/' + ticket.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Statut: 'Annulé', 'Raison annulation': raison } })
      });
      if (!resp.ok) throw new Error('patch failed');
      setTicket(prev => ({ ...prev, fields: { ...prev.fields, Statut: 'Annulé', 'Raison annulation': raison } }));
      setShowAnnulerConfirm(false);
      setRaisonAnnulation("");
    } catch (e) {
      setAnnulErr(true);
    }
    setAnnulEnCours(false);
  };

  const appliquerNouvelleDate = async (typeCreneau, dateInfo) => {
    if (!ticket) return;
    setChangeEnCours(true); setChangeErr(false);
    try {
      const nouvelleId = dateInfo.ids[0];
      await fetch('/api/airtable/Planning/' + nouvelleId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Statut: 'Pris' } })
      });
      await libererCreneauSiBesoin(ticket.fields?.PlanningID);
      const d = new Date(dateInfo.date + 'T12:00:00');
      const label = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      const nouveauCreneau = typeCreneau.label + ' (' + typeCreneau.heure + ') — ' + label;
      const horodatage = new Date().toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' });
      const confirmation = 'Parfait, c\'est noté : votre nouvelle date d\'intervention est confirmée — ' + nouveauCreneau + '.';
      const reponseExistante = ticket.fields?.["Réponse agence"] || "";
      const nouvelleReponse = reponseExistante ? reponseExistante + '\n\n[' + horodatage + ']\n' + confirmation : '[' + horodatage + ']\n' + confirmation;
      const resp = await fetch('/api/airtable/Tickets%20SAV/' + ticket.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Créneau: nouveauCreneau, PlanningID: nouvelleId, Statut: 'Nouveau', "Proposition auto en attente": false, "Proposition auto créneau": "", "Proposition auto mois": "", "RDV modifié - notif technicien": true, "Réponse agence": nouvelleReponse } })
      });
      if (!resp.ok) throw new Error('patch failed');
      setTicket(prev => ({ ...prev, fields: { ...prev.fields, Créneau: nouveauCreneau, PlanningID: nouvelleId, Statut: 'Nouveau', "Proposition auto en attente": false, "Proposition auto créneau": "", "Proposition auto mois": "", "Réponse agence": nouvelleReponse } }));
      setShowChanger(false);
      setChangeOk(true);
    } catch (e) {
      setChangeErr(true);
    }
    setChangeEnCours(false);
  };

  const statut = ticket?.fields?.Statut || "Nouveau";
  const sc = STATUT_STYLE[statut] || STATUT_STYLE["Nouveau"];

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",padding:"0 0 40px"}}>
      <div style={{width:"100%",background:F.marine,padding:"18px 20px",display:"flex",alignItems:"center",gap:"12px"}}>
        <div style={{width:"42px",height:"42px",background:F.blanc,borderRadius:"10px",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,overflow:"hidden"}}>
          <img src="/icon-192.png" alt="Iko" style={{width:"100%",height:"100%",objectFit:"contain"}}/>
        </div>
        <div>
          <div style={{color:F.blanc,fontWeight:"900",fontSize:"16px"}}>Iko</div>
          <div style={{color:"rgba(255,255,255,0.5)",fontSize:"9px",letterSpacing:"1.5px",textTransform:"uppercase",marginTop:"2px"}}>Suivi de ma demande SAV</div>
        </div>
        <a href="index.html" style={{marginLeft:"auto",color:"rgba(255,255,255,0.7)",fontSize:"12px",textDecoration:"none",border:"1px solid rgba(255,255,255,0.25)",borderRadius:"8px",padding:"6px 12px"}}>← Retour</a>
      </div>

      <div style={{width:"100%",maxWidth:"520px",padding:"28px 20px"}}>
        {!ticket && (
          <div style={{background:F.blanc,border:"1px solid "+F.grisBord,borderRadius:"14px",padding:"28px 22px",boxShadow:"0 4px 20px rgba(0,0,0,0.05)"}}>
            <h1 style={{fontSize:"18px",color:F.marine,marginBottom:"6px"}}>Suivre ma demande SAV</h1>
            <p style={{fontSize:"12px",color:"#6B7280",marginBottom:"18px"}}>Saisissez le numéro de ticket reçu par e-mail lors de votre demande (ex : SAV-2026-1234).</p>
            <label style={{fontSize:"11px",fontWeight:"700",color:F.marine,display:"block",marginBottom:"6px"}}>N° de ticket</label>
            <input
              value={numero}
              onChange={e => setNumero(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && rechercher()}
              placeholder="SAV-2026-1234"
              style={{width:"100%",border:"1px solid "+F.grisBord,borderRadius:"8px",padding:"11px 12px",fontSize:"14px",fontWeight:"700",letterSpacing:"0.5px",color:F.marine,textTransform:"uppercase"}}
            />
            {erreur && <div style={{marginTop:"10px",fontSize:"12px",color:F.rouge,background:F.rougeClair,borderRadius:"8px",padding:"8px 10px"}}>{erreur}</div>}
            <button
              onClick={rechercher}
              disabled={loading}
              style={{marginTop:"16px",width:"100%",background:loading?"#B8951F":F.or,color:F.marine,border:"none",borderRadius:"10px",padding:"13px",fontWeight:"800",fontSize:"13px",cursor:loading?"default":"pointer"}}
            >
              {loading ? "Recherche…" : "🔍 Voir ma demande"}
            </button>
          </div>
        )}

        {ticket && (
          <div>
            <div style={{background:F.blanc,border:"1px solid "+F.grisBord,borderRadius:"14px",padding:"22px",boxShadow:"0 4px 20px rgba(0,0,0,0.05)",marginBottom:"16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap",marginBottom:"14px"}}>
                <span style={{fontSize:"13px",fontWeight:"900",color:F.or,fontFamily:"monospace"}}>{ticket.fields?.Name}</span>
                <span style={{fontSize:"10px",fontWeight:"800",color:sc.color,background:sc.bg,borderRadius:"20px",padding:"3px 10px"}}>{statut}</span>
              </div>

              <div style={{display:"flex",flexDirection:"column",gap:"9px"}}>
                {ticket.fields?.Produit && (
                  <div style={{fontSize:"12px",color:"#374151",display:"flex",gap:"8px"}}>
                    <span>📦</span><span><strong>Produit :</strong> {ticket.fields.Produit}</span>
                  </div>
                )}
                {ticket.fields?.["Problème"] && (
                  <div style={{fontSize:"12px",color:"#374151",display:"flex",gap:"8px"}}>
                    <span>🔧</span><span><strong>Problème :</strong> {ticket.fields["Problème"]}</span>
                  </div>
                )}
                {ticket.fields?.Créneau && (
                  <div style={{fontSize:"12px",color:"#374151",display:"flex",gap:"8px"}}>
                    <span>📅</span><span><strong>Date d'intervention :</strong> {ticket.fields.Créneau}</span>
                  </div>
                )}
                {ticket.fields?.Agence && (
                  <div style={{fontSize:"12px",color:"#374151",display:"flex",gap:"8px"}}>
                    <span>📍</span><span><strong>Agence :</strong> {ticket.fields.Agence}</span>
                  </div>
                )}
              </div>

              {ticket.fields?.Diagnostic && (
                <div style={{marginTop:"14px",background:"rgba(0,26,66,0.04)",border:"1px solid rgba(0,26,66,0.15)",borderRadius:"8px",padding:"10px 12px",fontSize:"12px",color:F.marine}}>
                  📋 <strong>Diagnostic technicien :</strong> {ticket.fields.Diagnostic}
                </div>
              )}
              {ticket.fields?.["Montant devis"] && (
                <div style={{marginTop:"10px",fontSize:"13px",color:F.marine}}>💶 Devis : <strong>{ticket.fields["Montant devis"]}</strong></div>
              )}
            </div>

            {!isStatutClos(statut) && (
              <div style={{background:F.blanc,border:"1px solid "+F.grisBord,borderRadius:"14px",padding:"22px",boxShadow:"0 4px 20px rgba(0,0,0,0.05)",marginBottom:"16px"}}>
                <h2 style={{fontSize:"14px",color:F.marine,marginBottom:"12px"}}>🛠️ Gérer ma demande</h2>

                {changeOk && <div style={{marginBottom:"10px",fontSize:"12px",color:F.vert,background:F.vertClair,borderRadius:"8px",padding:"8px 10px"}}>✅ Nouvelle date d'intervention confirmée.</div>}
                {changeErr && <div style={{marginBottom:"10px",fontSize:"12px",color:F.rouge,background:F.rougeClair,borderRadius:"8px",padding:"8px 10px"}}>⚠️ Erreur, réessayez.</div>}

                {!showChanger && !showAnnulerConfirm && (
                  <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
                    <button onClick={() => { setShowChanger(true); setChangeOk(false); }}
                      style={{width:"100%",background:F.grisClair,color:F.marine,border:"1px solid "+F.grisBord,borderRadius:"10px",padding:"12px",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
                      📅 Changer la date d'intervention
                    </button>
                    <button onClick={() => setShowAnnulerConfirm(true)}
                      style={{width:"100%",background:F.rougeClair,color:F.rouge,border:"1px solid rgba(220,38,38,0.3)",borderRadius:"10px",padding:"12px",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
                      ❌ Annuler ma demande
                    </button>
                  </div>
                )}

                {showChanger && (
                  <ChangerDatePanel
                    agenceVille={ticket.fields?.Agence}
                    onChoisir={appliquerNouvelleDate}
                    onFermer={() => setShowChanger(false)}
                    appliqueEnCours={changeEnCours}
                    periodePreremplie={ticket.fields?.["Proposition auto en attente"] ? ticket.fields?.["Proposition auto créneau"] : null}
                  />
                )}

                {showAnnulerConfirm && (
                  <div style={{background:F.rougeClair,border:"1px solid rgba(220,38,38,0.3)",borderRadius:"10px",padding:"14px"}}>
                    <p style={{fontSize:"12px",color:"#7F1D1D",marginBottom:"10px"}}>Confirmez-vous l'annulation de cette demande SAV ? Cette action libérera votre créneau.</p>
                    <label style={{fontSize:"11px",fontWeight:"700",color:"#7F1D1D",display:"block",marginBottom:"4px"}}>Motif de l'annulation *</label>
                    <textarea value={raisonAnnulation}
                      onChange={e => { setRaisonAnnulation(e.target.value); if (e.target.value.trim()) setRaisonManquante(false); }}
                      placeholder="Ex : intervention n'est plus nécessaire, changement de date impossible…"
                      rows={3}
                      style={{width:"100%",border:"1px solid "+(raisonManquante?F.rouge:F.grisBord),borderRadius:"8px",padding:"8px 10px",fontSize:"12px",fontFamily:"inherit",resize:"vertical",marginBottom:"8px"}}/>
                    {raisonManquante && <div style={{marginBottom:"10px",fontSize:"12px",color:F.rouge}}>⚠️ Merci d'indiquer un motif avant de confirmer.</div>}
                    {annulErr && <div style={{marginBottom:"10px",fontSize:"12px",color:F.rouge}}>⚠️ Erreur, réessayez.</div>}
                    <div style={{display:"flex",gap:"8px"}}>
                      <button onClick={() => { setShowAnnulerConfirm(false); setRaisonManquante(false); }} disabled={annulEnCours}
                        style={{flex:1,background:F.blanc,color:"#374151",border:"1px solid "+F.grisBord,borderRadius:"8px",padding:"10px",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
                        Retour
                      </button>
                      <button onClick={annulerDemande} disabled={annulEnCours || !raisonAnnulation.trim()}
                        style={{flex:1,background:F.rouge,color:F.blanc,border:"none",borderRadius:"8px",padding:"10px",fontWeight:"700",fontSize:"12px",cursor:(annulEnCours || !raisonAnnulation.trim())?"default":"pointer",opacity:(!raisonAnnulation.trim() && !annulEnCours)?0.55:1}}>
                        {annulEnCours ? "Annulation…" : "Confirmer l'annulation"}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            <div style={{background:F.blanc,border:"1px solid "+F.grisBord,borderRadius:"14px",padding:"22px",boxShadow:"0 4px 20px rgba(0,0,0,0.05)"}}>
              <h2 style={{fontSize:"14px",color:F.marine,marginBottom:"4px",textAlign:"center"}}>✉️ Échanger avec votre agence</h2>
              <p style={{fontSize:"11px",color:"#6B7280",marginBottom:"16px",textAlign:"center"}}>Vos messages sont transmis directement à l'agence en charge de votre dossier.</p>

              <PhoneChat
                ticket={ticket}
                message={message}
                onChangeMessage={setMessage}
                onEnvoyer={envoyerMessage}
                envoi={envoi}
                propositionEnAttente={!!ticket.fields?.["Proposition auto en attente"]}
                propositionCreneau={ticket.fields?.["Proposition auto créneau"]}
                propositionMois={ticket.fields?.["Proposition auto mois"]}
                onChoisirProposition={appliquerNouvelleDate}
                changeEnCours={changeEnCours}
              />

              {envoi === 'ok' && <div style={{marginTop:"10px",fontSize:"12px",color:F.vert,textAlign:"center"}}>✅ Message envoyé à l'agence.</div>}
              {envoi === 'err' && <div style={{marginTop:"10px",fontSize:"12px",color:F.rouge,textAlign:"center"}}>⚠️ Erreur d'envoi, réessayez.</div>}
            </div>

            <button onClick={nouvelleRecherche} style={{marginTop:"16px",width:"100%",background:"transparent",border:"1px solid "+F.grisBord,color:"#6B7280",borderRadius:"10px",padding:"11px",fontWeight:"700",fontSize:"12px",cursor:"pointer"}}>
              ↩ Rechercher un autre ticket
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
