const esc = (s) => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// ============================================================

//  Géométrie partagée entre le dessin interactif (modal),

// ============================================================

function grilleXs(o, Lmm) { return [0, ...(o.meneaux || []).map(Number).filter(n => n > 0).sort((a, b) => a - b), Lmm]; }
function grilleYs(o, Hmm) { return [0, ...(o.traverses || []).map(Number).filter(n => n > 0).sort((a, b) => a - b), Hmm]; }

// Récapitulatif des zones (numérotées de bas-gauche vers haut-droite, ligne par ligne)
function zonesRecap(o) {
  const Lmm = Number(o.largeur) || 0, Hmm = Number(o.hauteur) || 0;
  if (!Lmm || !Hmm) return [];
  const xs = grilleXs(o, Lmm), ys = grilleYs(o, Hmm);
  const out = []; let n = 1;
  for (let l = 0; l < ys.length - 1; l++)
    for (let c = 0; c < xs.length - 1; c++)
      out.push({ n: n++, col: c, lig: l, w: xs[c + 1] - xs[c], h: ys[l + 1] - ys[l], rempl: (o.zonesRempl || {})[c + "-" + l] || "Fixe" });
  return out;
}
function zonesTexte(o) {
  const zs = zonesRecap(o);
  if (zs.length <= 1 && (!zs[0] || zs[0].rempl === "Fixe")) return "";
  return zs.map(z => "Z" + z.n + " " + z.w + "×" + z.h + " : " + libelleRempl(z.rempl)).join(" · ");
}

// Vrai si au moins une zone du configurateur est un ouvrant à poignée
// (OF/OB). On se base sur les zones réelles, pas sur le "Type d'ouvrant" du
// haut — un fixe transformé en ouvrant via le configurateur doit lui aussi
// donner accès au champ hauteur de poignée.
function aUneZonePoignee(o) {
  return Object.values(o.zonesRempl || {}).some(r => r === "OF-G" || r === "OF-D" || r === "OB-G" || r === "OB-D");
}

// Géométrie du schéma : échelle, marges, épaisseur du dormant selon matériau/pose
function geomSchema(o, areaW, areaH, miroir) {
  const Lmm = Math.max(300, Number(o.largeur) || 1200);
  const Hmm = Math.max(300, Number(o.hauteur) || 1400);
  const ML = 54, MR = 46, MT = 18, MB = 56;
  const scale = Math.min(areaW / Lmm, areaH / Hmm);
  const W = Lmm * scale, H = Hmm * scale;
  let dtmm = gammeOf(o.materiau).dormant;                // largeur dormant selon la gamme
  if ((o.pose || "").includes("Applique")) dtmm = dtmm * 1.3;          // Applique = dormant élargi
  const dt = Math.max(4, dtmm * scale);
  const dv = Math.max(3, gammeOf(o.materiau).ouvrant * scale); // largeur ouvrant (vantail)
  const svgW = W + ML + MR, svgH = H + MT + MB;
  // Miroir horizontal = vue extérieure (on travaille toujours en vue
  // intérieure par défaut). Inverser ici, dans le calcul des coordonnées,
  // propage correctement à tout le dessin (texte compris, jamais retourné).
  const X = miroir ? (mm => ML + (Lmm - mm) * scale) : (mm => ML + mm * scale);
  const Y = (mm) => MT + (Hmm - mm) * scale;             // mm mesurés depuis le bas
  return { Lmm, Hmm, ML, MR, MT, MB, scale, W, H, dt, dv, svgW, svgH, X, Y, miroir: !!miroir, xs: grilleXs(o, Lmm), ys: grilleYs(o, Hmm) };
}

// Lignes du symbole d'un remplissage dans une boîte (pointe = côté charnières, vue intérieure)
function lignesSymbole(rempl, x, y, w, h) {
  const midY = y + h / 2, midX = x + w / 2;
  const L = [];
  if (rempl === "OF-G" || rempl === "OB-G") { L.push([x + w, y, x, midY]); L.push([x + w, y + h, x, midY]); }
  if (rempl === "OF-D" || rempl === "OB-D") { L.push([x, y, x + w, midY]); L.push([x, y + h, x + w, midY]); }
  if (rempl === "Soufflet" || rempl === "OB-G" || rempl === "OB-D") { L.push([x, y, midX, y + h]); L.push([x + w, y, midX, y + h]); }
  if (rempl === "Coul") {
    // Flèche horizontale = sens de coulissement (dessinée à la main, sans marker SVG)
    L.push([x + w * 0.2, midY, x + w * 0.8, midY]);
    L.push([x + w * 0.72, midY - h * 0.07, x + w * 0.8, midY]);
    L.push([x + w * 0.72, midY + h * 0.07, x + w * 0.8, midY]);
  }
  if (rempl === "Porte-G" || rempl === "Porte-D") {
    // Même principe pointe=poignée que OF (diagonale), + petit arc de
    // balayage près du coin charnière en bas pour distinguer une porte
    // d'une simple fenêtre (arc approximé par segments, pas de path SVG ici).
    const versDroite = rempl === "Porte-D";
    if (versDroite) { L.push([x, y, x + w, midY]); L.push([x, y + h, x + w, midY]); }
    else { L.push([x + w, y, x, midY]); L.push([x + w, y + h, x, midY]); }
    const xCharniere = versDroite ? x : x + w;
    const rArc = Math.min(w, h) * 0.28;
    const sens = versDroite ? 1 : -1;
    const nSeg = 6;
    let prev = [xCharniere, y + h];
    for (let i = 1; i <= nSeg; i++) {
      const ang = (Math.PI / 2) * (i / nSeg);
      const pt = [xCharniere + sens * rArc * Math.sin(ang), (y + h) - rArc * Math.cos(ang)];
      L.push([prev[0], prev[1], pt[0], pt[1]]);
      prev = pt;
    }
  }
  return L;
}

// Construit le schéma technique en chaîne SVG (sans poignées d'interaction).
// fixed=true : attributs width/height en px (nécessaire pour l'export canvas).
function buildSchemaSvgString(o, fixed, areaW, areaH, miroir) {
  const g = geomSchema(o, areaW || 440, areaH || 380, miroir);
  const s = [];
  // id unique pour ne jamais entrer en collision si deux schémas sont
  // affichés en même temps sur la même page (aperçu + configurateur ouvert).
  const gradId = 'vg' + Math.random().toString(36).slice(2, 9);
  s.push(
    '<defs><linearGradient id="' + gradId + '" x1="0%" y1="0%" x2="100%" y2="100%">' +
    '<stop offset="0%" stop-color="#EAF3FA"/>' +
    '<stop offset="45%" stop-color="#BFDCEE"/>' +
    '<stop offset="100%" stop-color="#7FB2D4"/>' +
    '</linearGradient></defs>'
  );
  const vitrageFill = 'url(#' + gradId + ')';
  const rect = (x, y, w, h, fill, stroke, sw, dash) =>
    s.push('<rect x="' + x + '" y="' + y + '" width="' + Math.max(0, w) + '" height="' + Math.max(0, h) + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '" stroke-linejoin="round"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>');
  const line = (x1, y1, x2, y2, stroke, sw, dash) =>
    s.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + stroke + '" stroke-width="' + sw + '" stroke-linecap="round"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>');
  const text = (x, y, t, fs, fill, anchor, transform) =>
    s.push('<text x="' + x + '" y="' + y + '" font-size="' + fs + '" font-family="Helvetica, Arial, sans-serif" font-weight="700" fill="' + fill + '" text-anchor="' + (anchor || 'middle') + '"' + (transform ? ' transform="' + transform + '"' : '') + '>' + esc(t) + '</text>');

  // Couleur réelle du profilé (respecte la teinte/RAL choisis) + contour
  // technique neutre pour que le trait reste lisible quelle que soit la teinte.
  const frameColor = couleurSchema(o);
  const contour = "#2B2B2B";

  // Repère en titre
  if ((o.repere || "").trim()) text(g.ML, g.MT - 5, o.repere.trim(), 11, C.white, 'start');
  if (g.miroir) text(g.X(g.Lmm / 2), g.MT - 5, "◀ VUE EXTÉRIEURE", 9, C.rouge, 'middle');

  // Aile de recouvrement en pose Rénovation
  if ((o.pose || "").startsWith("Rénovation")) {
    const a = Math.max(3, 30 * g.scale);
    rect(g.X(0) - a, g.Y(g.Hmm) - a, g.W + 2 * a, g.H + 2 * a, 'none', C.muted, 1.2);
  }

  // Dormant : bande extérieure à la couleur réelle du profilé, vitrage neutre
  // au centre (+ ligne médiane PVC en accent neutre).
  rect(g.X(0), g.Y(g.Hmm), g.W, g.H, frameColor, contour, 1.2);
  rect(g.X(0) + g.dt, g.Y(g.Hmm) + g.dt, g.W - 2 * g.dt, g.H - 2 * g.dt, vitrageFill, contour, 1.2);
  if (o.materiau !== "Alu") {
    const d2 = g.dt * 0.5;
    rect(g.X(0) + d2, g.Y(g.Hmm) + d2, g.W - 2 * d2, g.H - 2 * d2, 'none', contour, 0.6);
  }

  // Zones : cadre ouvrant réel (vantail) + symbole, ou "F" pour les fixes.
  // Les zones fixes adjacentes dont la frontière commune (meneau OU
  // traverse) est coupée sont fusionnées en une seule zone continue — union-
  // find sur la grille, rendu une seule fois par groupe (boîte englobante).
  const nCols = g.xs.length - 1, nRows = g.ys.length - 1;
  const idxCell = (c, l) => l * nCols + c;
  const parent = Array.from({ length: nCols * nRows }, (_, i) => i);
  const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const union = (i, j) => { const ri = find(i), rj = find(j); if (ri !== rj) parent[ri] = rj; };
  const meneauActif = (mm, l) => !((o.meneauxCoupures || {})[mm] || []).includes(l);
  const traverseActive = (mm, c) => !((o.traversesCoupures || {})[mm] || []).includes(c);
  for (let l = 0; l < nRows; l++) {
    const y0 = g.ys[l], y1 = g.ys[l + 1];
    for (let c = 0; c < nCols; c++) {
      const r = (o.zonesRempl || {})[c + "-" + l] || "Fixe";
      if (r !== "Fixe") continue;
      if (c + 1 < nCols) {
        const rD = (o.zonesRempl || {})[(c + 1) + "-" + l] || "Fixe";
        if (rD === "Fixe" && !meneauActif(g.xs[c + 1], l)) union(idxCell(c, l), idxCell(c + 1, l));
      }
      if (l + 1 < nRows) {
        const rH = (o.zonesRempl || {})[c + "-" + (l + 1)] || "Fixe";
        if (rH === "Fixe" && !traverseActive(g.ys[l + 1], c)) union(idxCell(c, l), idxCell(c, l + 1));
      }
    }
  }
  const bounds = {};
  for (let l = 0; l < nRows; l++) {
    for (let c = 0; c < nCols; c++) {
      if (((o.zonesRempl || {})[c + "-" + l] || "Fixe") !== "Fixe") continue;
      const root = find(idxCell(c, l));
      if (!bounds[root]) bounds[root] = { cMin: c, cMax: c, lMin: l, lMax: l, cle: c + "-" + l };
      else {
        const b = bounds[root];
        if (c < b.cMin) b.cMin = c; if (c > b.cMax) b.cMax = c;
        if (l < b.lMin) b.lMin = l; if (l > b.lMax) b.lMax = l;
      }
    }
  }
  const dejaDessine = new Set();

  for (let l = 0; l < nRows; l++) {
    for (let c = 0; c < nCols; c++) {
      const r = (o.zonesRempl || {})[c + "-" + l] || "Fixe";
      let x0, x1, y0, y1, cle;
      if (r === "Fixe") {
        const root = find(idxCell(c, l));
        if (dejaDessine.has(root)) continue;
        dejaDessine.add(root);
        const b = bounds[root];
        x0 = g.xs[b.cMin]; x1 = g.xs[b.cMax + 1];
        y0 = g.ys[b.lMin]; y1 = g.ys[b.lMax + 1];
        cle = b.cle; // clé de la cellule représentante (vitrage/petit bois de tout le groupe)
      } else {
        x0 = g.xs[c]; x1 = g.xs[c + 1]; y0 = g.ys[l]; y1 = g.ys[l + 1];
        cle = c + "-" + l;
      }
      const px = g.X(x0), py = g.Y(y1);
      const pw = (x1 - x0) * g.scale, ph = (y1 - y0) * g.scale;
      const estPanneau = !!((o.zonesVitrage || {})[cle] || {}).panneau;
      const pc = Math.min(Math.max(0.7, 15 * g.scale), pw / 6, ph / 6); // parclose : ~15mm réels
      let glassX = px, glassY = py, glassW = pw, glassH = ph;
      if (r === "Fixe") {
        if (estPanneau) {
          rect(px, py, pw, ph, frameColor, contour, 1);
          text(px + pw / 2, py + ph / 2 + 4, "panneau", Math.min(11, ph / 5, pw / 22), "#ffffffaa");
        } else {
          text(px + pw / 2, py + ph / 2 + 4, "fixe", Math.min(13, ph / 4, pw / 20), "#8a97a8");
        }
        // Parclose : fin liseré tenant le vitrage/panneau dans le dormant
        rect(px + pc, py + pc, pw - 2 * pc, ph - 2 * pc, 'none', contour, 0.6);
      } else {
        // Vantail = même construction que le dormant (bande de profilé colorée
        // + vitrage visible au centre, ou panneau opaque si réglé ainsi),
        // pour garder la même apparence que les zones fixes.
        const iv = Math.min(g.dv, pw / 3, ph / 3);
        rect(px, py, pw, ph, frameColor, contour, 1.1);
        rect(px + iv, py + iv, pw - 2 * iv, ph - 2 * iv, estPanneau ? frameColor : vitrageFill, contour, 1);
        glassX = px + iv; glassY = py + iv; glassW = pw - 2 * iv; glassH = ph - 2 * iv;
        // Parclose : fin liseré tenant le vitrage/panneau dans l'ouvrant,
        // 3e niveau imbriqué (dormant → ouvrant → parclose → vitrage).
        const pc2 = Math.min(pc, glassW / 5, glassH / 5);
        rect(glassX + pc2, glassY + pc2, glassW - 2 * pc2, glassH - 2 * pc2, 'none', contour, 0.6);
        const iSym = iv * 1.5;
        lignesSymbole(r, px + iSym, py + iSym, pw - 2 * iSym, ph - 2 * iSym)
          .forEach(li => line(li[0], li[1], li[2], li[3], contour, 1.3, "6,4"));
      }
      // Petits bois (couleur menuiserie) — décoratifs, uniquement sur du
      // vitrage réel (pas de sens sur un panneau opaque déjà plein).
      if (!estPanneau) {
        const pb = (o.zonesPetitBois || {})[cle];
        if (pb && ((pb.vBars && pb.vBars.length) || (pb.hBars && pb.hBars.length))) {
          const lp = Math.max(1.2, (pb.largeur || 18) * g.scale);
          (pb.vBars || []).forEach(mm => {
            const bx = glassX + (Number(mm) || 0) * g.scale;
            rect(bx - lp / 2, glassY, lp, glassH, frameColor, contour, 0.6);
          });
          (pb.hBars || []).forEach(mm => {
            const by = glassY + glassH - (Number(mm) || 0) * g.scale;
            rect(glassX, by - lp / 2, glassW, lp, frameColor, contour, 0.6);
          });
        }
      }
    }
  }

  // Hauteur de poignée : trait de cote + levier doré, par zone — chaque
  // ouvrant a sa propre hauteur (o.hauteursPoignee, clé "col-lig"), avec
  // repli sur o.hauteurPoignee (valeur globale/historique) si la zone n'a
  // pas encore de valeur propre.
  for (let l = 0; l < g.ys.length - 1; l++) {
    for (let c = 0; c < g.xs.length - 1; c++) {
      const r = (o.zonesRempl || {})[c + "-" + l] || "Fixe";
      if (r !== "OF-G" && r !== "OF-D" && r !== "OB-G" && r !== "OB-D" && r !== "Porte-G" && r !== "Porte-D") continue;
      const cle = c + "-" + l;
      if ((o.ouvrantsSecondaires || {})[cle]) continue; // ouvrant secondaire d'une paire : pas de poignée dessinée
      const hpEntry = (o.hauteursPoignee || {})[cle] ?? o.hauteurPoignee;
      const estDefinie = hpEntry != null && hpEntry !== "" && Number(hpEntry) > 0;
      const y0 = g.ys[l], y1 = g.ys[l + 1];
      // Sans valeur réglée : poignée quand même dessinée (grisée) à mi-hauteur
      // de la zone, pour un rendu complet — jamais de cote inventée affichée.
      const hp = estDefinie ? Math.max(y0 + 1, Math.min(y1 - 1, Number(hpEntry))) : (y0 + y1) / 2;
      const yhp = g.Y(hp);
      const x0 = g.xs[c], x1 = g.xs[c + 1];
      const px0 = g.X(x0), px1 = g.X(x1);
      const poigneeADroite = r.endsWith("-D"); // la poignée est du même côté que la pointe du symbole (charnières à l'opposé)
      const lp = Math.max(10, Math.min(22, (x1 - x0) * g.scale * 0.22));
      const xEdge = poigneeADroite ? px1 - lp : px0;

      if (estDefinie) {
        // Trait + étiquette de cote, limités à cette zone uniquement
        s.push('<line x1="' + px0 + '" y1="' + yhp + '" x2="' + px1 + '" y2="' + yhp + '" stroke="' + C.or + '" stroke-width="1.3" stroke-dasharray="5,3"/>');
        s.push('<rect x="' + xEdge + '" y="' + (yhp - 2.4) + '" width="' + lp + '" height="4.8" rx="1.6" fill="' + C.or + '" stroke="' + contour + '" stroke-width="0.6"/>');
        text((px0 + px1) / 2, yhp - 6, "🔑 " + Math.round(hp), 8, C.cote, 'middle');
      } else {
        // Poignée grisée, non définie — pas de cote associée
        s.push('<rect x="' + xEdge + '" y="' + (yhp - 2.4) + '" width="' + lp + '" height="4.8" rx="1.6" fill="#B9BFC8" stroke="' + contour + '" stroke-width="0.6"/>');
      }
    }
  }

  // Meneaux et traverses (barres de dormant, même couleur que le reste du
  // profilé), dessinés segment par segment — pleins par défaut, chaque
  // segment (entre deux traverses pour un meneau, entre deux meneaux pour une
  // traverse) peut être coupé indépendamment, n'importe où, pas seulement aux
  // extrémités (meneauxCoupures / traversesCoupures : liste d'index coupés).
  (o.meneaux || []).map(Number).filter(n => n > 0).forEach(m => {
    for (let l = 0; l < nRows; l++) {
      if (!meneauActif(m, l)) continue;
      rect(g.X(m) - g.dt / 2, g.Y(g.ys[l + 1]), g.dt, g.Y(g.ys[l]) - g.Y(g.ys[l + 1]), frameColor, contour, 1.2);
    }
  });
  (o.traverses || []).map(Number).filter(n => n > 0).forEach(t => {
    for (let c = 0; c < nCols; c++) {
      if (!traverseActive(t, c)) continue;
      rect(g.X(g.xs[c]), g.Y(t) - g.dt / 2, g.X(g.xs[c + 1]) - g.X(g.xs[c]), g.dt, frameColor, contour, 1.2);
    }
  });

  // Cotes largeur : segments (si divisions) + totale
  const coteH = (x1, x2, y, label, fs) => {
    line(x1, y - 4, x1, y + 4, C.cote, 1); line(x2, y - 4, x2, y + 4, C.cote, 1); line(x1, y, x2, y, C.cote, 1);
    text((x1 + x2) / 2, y + fs + 3, label, fs, C.cote);
  };
  const coteV = (y1, y2, x, label, fs) => {
    line(x - 4, y1, x + 4, y1, C.cote, 1); line(x - 4, y2, x + 4, y2, C.cote, 1); line(x, y1, x, y2, C.cote, 1);
    const cy = (y1 + y2) / 2;
    text(x - 5, cy, label, fs, C.cote, 'middle', 'rotate(-90 ' + (x - 5) + ' ' + cy + ')');
  };
  if (g.xs.length > 2) g.xs.slice(0, -1).forEach((x0, i) => coteH(g.X(x0), g.X(g.xs[i + 1]), g.MT + g.H + 12, String(g.xs[i + 1] - x0), 9));
  coteH(g.X(0), g.X(g.Lmm), g.MT + g.H + (g.xs.length > 2 ? 32 : 16), g.Lmm + " mm", 11);
  if (g.ys.length > 2) g.ys.slice(0, -1).forEach((y0, i) => coteV(g.Y(g.ys[i + 1]), g.Y(y0), g.ML - 14, String(g.ys[i + 1] - y0), 9));
  coteV(g.Y(g.Hmm), g.Y(0), g.ML - (g.ys.length > 2 ? 34 : 18), g.Hmm + " mm", 11);

  const dims = fixed ? 'width="' + g.svgW + '" height="' + g.svgH + '"' : 'width="100%"';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + g.svgW + ' ' + g.svgH + '" ' + dims + '>' + s.join('') + '</svg>';
}

// Conversion SVG -> PNG dataURL (résolution x3, fond blanc)
function svgVersPng(svgStr, wPx, hPx) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = 3;
      const cv = document.createElement('canvas');
      cv.width = Math.round(wPx * k); cv.height = Math.round(hPx * k);
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      resolve(cv.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  });
}

// Descripteur JSON du configurateur (v1 + clés additives : materiau, pose, zonesRempl)
function descripteurConfig(o) {
  return {
    repere: (o.repere || "").trim(),
    largeur: Number(o.largeur) || 0,
    hauteur: Number(o.hauteur) || 0,
    materiau: o.materiau || "",
    pose: o.pose || "",
    pieceAppui: o.pieceAppui || "",
    couleur: {
      teintePvc: o.teintePvc || "", capotAlu: !!o.capotAlu, ralCapot: o.ralCapot || "", finitionCapot: o.finitionCapot || "",
      ralAlu: o.ralAlu || "", finitionAlu: o.finitionAlu || "",
    },
    meneaux: (o.meneaux || []).map(Number).filter(n => n > 0).sort((a, b) => a - b),
    traverses: (o.traverses || []).map(Number).filter(n => n > 0).sort((a, b) => a - b),
    zonesRempl: o.zonesRempl || {},
    hauteursPoignee: o.hauteursPoignee || {},
    zonesVitrage: o.zonesVitrage || {},
    zonesPetitBois: o.zonesPetitBois || {},
    meneauxCoupures: o.meneauxCoupures || {},
    ouvrantsSecondaires: o.ouvrantsSecondaires || {},
    traversesCoupures: o.traversesCoupures || {},
    zones: zonesRecap(o).map(z => ({ colonne: z.col + 1, ligne: z.lig + 1, largeur: z.w, hauteur: z.h, remplissage: z.rempl })),
  };
}

// ---- Aperçu miniature d'un remplissage (picker de zone) ----
function MiniRempl({ rempl, size }) {
  const s = size || 48;
  const lignes = lignesSymbole(rempl, 3, 3, 58, 42);
  return (
    <svg viewBox="0 0 64 48" width={s} height={s * 0.75}>
      <rect x="3" y="3" width="58" height="42" fill={C.vitre} stroke={C.white} strokeWidth="2.5" strokeLinejoin="round"/>
      {lignes.map((l, i) => <line key={i} x1={l[0]} y1={l[1]} x2={l[2]} y2={l[3]} stroke={C.white} strokeWidth="2" strokeLinecap="round"/>)}
      {rempl === "Fixe" && <text x="32" y="28" fontSize="12" fontWeight="800" fill={C.muted} textAnchor="middle">F</text>}
    </svg>
  );
}

// ---- Picker de remplissage d'une zone ----
// Types de remplissage qui ont une poignée réglable (OF/OB uniquement).
const REMPLISSAGES_POIGNEE = ["OF-G", "OF-D", "OB-G", "OB-D", "Porte-G", "Porte-D"];

// Fenêtre hauteur de poignée, réutilisée à deux endroits : quand on choisit
// un ouvrant dans le configurateur (ZonePicker) ET quand on choisit un type
// à poignée directement via "Type d'ouvrant" en haut (OuvertureModal). Montre
// un aperçu du dessin en direct avec le levier doré, pour que la
// représentation soit visible pendant la saisie (demande explicite).
function HauteurPoigneeModal({ o, contexte, currentHp, estPorte, onValider, onClose }) {
  const [hp, setHp] = React.useState(currentHp || "");
  const valider = () => { if (hp) onValider(hp); onClose(); };
  const previewO = { ...o, hauteurPoignee: hp || 0 };
  const svgStr = (o.largeur && o.hauteur) ? buildSchemaSvgString(previewO, false, 320, 240) : null;
  const presets = estPorte ? ["980", "1045"] : ["150", "200", "300", "500"];

  return (
    <div style={{position:"fixed",inset:0,zIndex:6000,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"flex-end",justifyContent:"center"}}
      onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:"#fff",borderRadius:"16px 16px 0 0",width:"560px",maxWidth:"100%",padding:"18px 18px 26px",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
          <h2 style={{fontSize:"14px",color:C.white,fontWeight:"900"}}>🔑 Hauteur de poignée</h2>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:"18px",color:C.muted,cursor:"pointer"}}>✕</button>
        </div>
        <div style={{fontSize:"11px",color:C.muted,marginBottom:"12px"}}>{contexte} À quelle hauteur (depuis le bas) se trouve la poignée ?</div>
        {svgStr && (
          <div style={{border:"1.5px solid "+C.border,borderRadius:"10px",padding:"6px",marginBottom:"12px",display:"flex",justifyContent:"center"}}
            dangerouslySetInnerHTML={{ __html: svgStr }}/>
        )}
        <input type="number" inputMode="numeric" autoFocus value={hp} onChange={e => setHp(e.target.value)} placeholder="ex : 1050" style={{marginBottom:"8px",fontSize:"16px"}}/>
        <div style={{display:"flex",gap:"6px",marginBottom:"14px"}}>
          {presets.map(v => (
            <button key={v} type="button" onClick={() => setHp(v)}
              style={{flex:1,padding:"7px",background:hp===v?C.orDim:"#fff",border:"1.5px solid "+(hp===v?C.orBord:C.border),color:hp===v?"#8a6d1f":C.muted,borderRadius:"7px",fontWeight:"700",fontSize:"11px",cursor:"pointer"}}>
              {v}
            </button>
          ))}
        </div>
        <div style={{display:"flex",gap:"8px"}}>
          <button type="button" onClick={onClose} style={{flex:1,padding:"12px",background:"#fff",border:"1.5px solid "+C.border,color:C.muted,borderRadius:"10px",fontWeight:"800",fontSize:"12px",cursor:"pointer"}}>Passer</button>
          <button type="button" onClick={valider} style={{flex:2,padding:"12px",background:C.or,color:"#111",border:"none",borderRadius:"10px",fontWeight:"900",fontSize:"13px",cursor:"pointer"}}>Valider</button>
        </div>
      </div>
    </div>
  );
}

function ZonePicker({ o, zoneKey, current, hauteursPoignee, zonesVitrage, zonesPetitBois, zoneWmm, zoneHmm, ouvrantsSecondaires, onSelect, onSetHpZone, onSetVitrageZone, onSetPbZone, onSplit2, onSetSecondaire, onClose }) {
  const [modeHp, setModeHp] = React.useState(false); // affiche la fenêtre hauteur poignée (nouvelle sélection ou modification)
  const [choisi, setChoisi] = React.useState(current);

  const choisir = (v) => {
    onSelect(v);
    setChoisi(v);
    if (REMPLISSAGES_POIGNEE.includes(v)) { setModeHp(true); return; } // étape 2 : demander la hauteur
    onClose();
  };

  const hpActuelle = (hauteursPoignee || {})[zoneKey] ?? o.hauteurPoignee;
  const vZone = (zonesVitrage || {})[zoneKey] || {};
  const pbZone = (zonesPetitBois || {})[zoneKey] || { largeur: 18, vBars: [], hBars: [] };
  const ECART_PB = 60; // écart mini entre deux petits bois, plus fin qu'entre meneaux

  const ajouterBarre = (axe) => {
    const dim = axe === 'v' ? zoneWmm : zoneHmm;
    const liste = (axe === 'v' ? pbZone.vBars : pbZone.hBars) || [];
    const bornes = [0, ...liste.slice().sort((a, b) => a - b), dim];
    for (let i = 0; i < bornes.length - 1; i++) {
      if (bornes[i + 1] - bornes[i] >= ECART_PB * 2) {
        const v = Math.round((bornes[i] + bornes[i + 1]) / 2);
        onSetPbZone(zoneKey, axe === 'v' ? { vBars: [...liste, v] } : { hBars: [...liste, v] });
        return;
      }
    }
    alert("Plus de place pour un petit bois dans cette zone.");
  };
  const majBarre = (axe, i, val) => {
    const v = Math.round(Number(val) || 0);
    const liste = ((axe === 'v' ? pbZone.vBars : pbZone.hBars) || []).map((b, idx) => idx === i ? v : b);
    onSetPbZone(zoneKey, axe === 'v' ? { vBars: liste } : { hBars: liste });
  };
  const supprBarre = (axe, i) => {
    const liste = ((axe === 'v' ? pbZone.vBars : pbZone.hBars) || []).filter((_, idx) => idx !== i);
    onSetPbZone(zoneKey, axe === 'v' ? { vBars: liste } : { hBars: liste });
  };
  const egaliserBarres = (axe) => {
    const dim = axe === 'v' ? zoneWmm : zoneHmm;
    const liste = (axe === 'v' ? pbZone.vBars : pbZone.hBars) || [];
    if (liste.length === 0) return;
    const n = liste.length + 1, pas = dim / n;
    const nouvelles = []; for (let i = 1; i < n; i++) nouvelles.push(Math.round(pas * i));
    onSetPbZone(zoneKey, axe === 'v' ? { vBars: nouvelles } : { hBars: nouvelles });
  };

  if (modeHp) {
    return (
      <HauteurPoigneeModal o={o} currentHp={hpActuelle} estPorte={(choisi || "").startsWith("Porte")} onValider={(v) => onSetHpZone(zoneKey, v)} onClose={onClose}
        contexte={"Zone réglée en " + libelleRempl(choisi) + "."}/>
    );
  }

  return (
    <div style={{position:"fixed",inset:0,zIndex:5000,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"flex-end",justifyContent:"center"}}
      onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:"#fff",borderRadius:"16px 16px 0 0",width:"560px",maxWidth:"100%",padding:"18px 18px 26px",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
          <h2 style={{fontSize:"14px",color:C.white,fontWeight:"900"}}>🪟 Remplissage de la zone</h2>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:"18px",color:C.muted,cursor:"pointer"}}>✕</button>
        </div>
        {o.largeur && o.hauteur && (
          <div style={{border:"1.5px solid "+C.orBord,borderRadius:"10px",padding:"6px",marginBottom:"14px",display:"flex",justifyContent:"center"}}
            dangerouslySetInnerHTML={{ __html: buildSchemaSvgString(o, false, 280, 200) }}/>
        )}
        <div style={{display:"flex",gap:"8px",marginBottom:"14px"}}>
          <button type="button" onClick={() => onSplit2("OF-D", "OF-G")}
            style={{flex:1,padding:"10px 6px",background:C.orDim,border:"1.5px solid "+C.orBord,color:"#8a6d1f",borderRadius:"9px",fontWeight:"800",fontSize:"11px",cursor:"pointer"}}>
            🪟 2 vantaux (fenêtre)
          </button>
          <button type="button" onClick={() => onSplit2("Porte-D", "Porte-G")}
            style={{flex:1,padding:"10px 6px",background:C.orDim,border:"1.5px solid "+C.orBord,color:"#8a6d1f",borderRadius:"9px",fontWeight:"800",fontSize:"11px",cursor:"pointer"}}>
            🚪 2 vantaux (porte-fenêtre)
          </button>
        </div>
        <div style={{fontSize:"9.5px",color:C.muted,textAlign:"center",marginBottom:"12px"}}>Scinde cette zone en 2, tirants se rejoignant au centre — ou choisis un remplissage simple ci-dessous.</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:"8px",marginBottom:"10px"}}>
          {REMPLISSAGES.map(r => (
            <button key={r.v} type="button" onClick={() => choisir(r.v)}
              style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"5px",padding:"10px 4px",borderRadius:"10px",cursor:"pointer",
                border:"1.5px solid " + (current === r.v ? C.or : C.border), background: current === r.v ? C.orDim : "#fff"}}>
              <MiniRempl rempl={r.v} size={52}/>
              <span style={{fontSize:"10px",fontWeight:"700",color:current === r.v ? C.white : C.muted,textAlign:"center",lineHeight:"1.2"}}>{r.l}</span>
            </button>
          ))}
        </div>
        {REMPLISSAGES_POIGNEE.includes(current) && (
          <>
            <button type="button" onClick={() => setModeHp(true)}
              style={{width:"100%",padding:"11px",background:C.orDim,border:"1.5px solid "+C.orBord,color:"#8a6d1f",borderRadius:"9px",fontWeight:"800",fontSize:"12px",cursor:"pointer",marginBottom:"8px"}}>
              🔑 {hpActuelle ? "Modifier la hauteur de poignée (" + hpActuelle + " mm)" : "Régler la hauteur de poignée"}
            </button>
            <label onClick={() => onSetSecondaire(zoneKey, !((ouvrantsSecondaires || {})[zoneKey]))}
              style={{display:"flex",alignItems:"center",gap:"8px",padding:"9px 12px",borderRadius:"8px",cursor:"pointer",marginBottom:"14px",
                border:"1.5px solid "+C.border, background:"#fff",fontSize:"11px",fontWeight:"700",color:C.muted}}>
              <input type="checkbox" checked={!(ouvrantsSecondaires || {})[zoneKey]} onChange={() => {}} style={{width:"14px",accentColor:C.or}}/>
              Poignée visible sur cette zone (décoche si c'est l'ouvrant secondaire d'une paire)
            </label>
          </>
        )}

        <div style={{borderTop:"1px solid "+C.border,paddingTop:"14px",marginBottom:"14px"}}>
          <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Remplissage de cette zone</label>
          <label onClick={() => onSetVitrageZone(zoneKey, { panneau: !vZone.panneau })}
            style={{display:"flex",alignItems:"center",gap:"8px",padding:"9px 12px",borderRadius:"8px",cursor:"pointer",marginBottom: vZone.panneau ? "0" : "10px",
              border:"1.5px solid "+(vZone.panneau?C.or:C.border), background:vZone.panneau?C.orDim:"#fff",fontSize:"12px",fontWeight:"700",color:vZone.panneau?C.white:C.muted}}>
            <input type="checkbox" checked={!!vZone.panneau} onChange={() => {}} style={{width:"14px",accentColor:C.or}}/>
            Panneau opaque 28mm (couleur menuiserie), au lieu du vitrage
          </label>
          {!vZone.panneau && (
            <select value={vZone.type || ""} onChange={e => onSetVitrageZone(zoneKey, { type: e.target.value })}>
              <option value="">Type de vitrage — sélectionner</option>
              {TYPES_VITRAGE.filter(v => v !== "Autre").map(v => <option key={v} value={v}>{v}</option>)}
            </select>
          )}
        </div>

        {!vZone.panneau && zoneWmm > 0 && zoneHmm > 0 && (
          <div style={{borderTop:"1px solid "+C.border,paddingTop:"14px"}}>
            <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"8px"}}>🪵 Petits bois (couleur menuiserie)</label>
            <ChoiceButtons label="Largeur (mm)" value={String(pbZone.largeur || 18)} onChange={v => onSetPbZone(zoneKey, { largeur: Number(v) })} choices={["10","18","26","45"]}/>
            <div style={{display:"flex",gap:"8px",marginBottom:"10px"}}>
              <button type="button" onClick={() => ajouterBarre('v')} style={{flex:1,padding:"9px",background:C.orDim,border:"1.5px solid "+C.orBord,color:"#8a6d1f",borderRadius:"8px",fontWeight:"800",fontSize:"11px",cursor:"pointer"}}>┃ + Vertical</button>
              <button type="button" onClick={() => ajouterBarre('h')} style={{flex:1,padding:"9px",background:C.orDim,border:"1.5px solid "+C.orBord,color:"#8a6d1f",borderRadius:"8px",fontWeight:"800",fontSize:"11px",cursor:"pointer"}}>━ + Horizontal</button>
            </div>
            {(pbZone.vBars || []).length > 0 && (
              <div style={{display:"flex",justifyContent:"flex-end",marginBottom:"4px"}}>
                <button type="button" onClick={() => egaliserBarres('v')} style={{padding:"4px 8px",background:C.bleuDim,border:"1px solid rgba(37,99,235,0.3)",color:C.bleu,borderRadius:"6px",fontSize:"9.5px",fontWeight:"800",cursor:"pointer"}}>⚖️ Égaliser verticaux</button>
              </div>
            )}
            {(pbZone.vBars || []).map((b, i) => (
              <div key={"pv"+i} style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px"}}>
                <span style={{fontSize:"10px",color:C.muted,width:"58px",flexShrink:0}}>┃ Vert. {i+1}</span>
                <input type="number" inputMode="numeric" value={b} onChange={e => majBarre('v', i, e.target.value)} style={{flex:1}}/>
                <span style={{fontSize:"10px",color:C.muted,flexShrink:0}}>mm</span>
                <button type="button" onClick={() => supprBarre('v', i)} style={{background:C.rougeDim,border:"1px solid rgba(220,38,38,0.25)",color:C.rouge,borderRadius:"7px",padding:"5px 9px",fontSize:"11px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>✕</button>
              </div>
            ))}
            {(pbZone.hBars || []).length > 0 && (
              <div style={{display:"flex",justifyContent:"flex-end",marginBottom:"4px"}}>
                <button type="button" onClick={() => egaliserBarres('h')} style={{padding:"4px 8px",background:C.bleuDim,border:"1px solid rgba(37,99,235,0.3)",color:C.bleu,borderRadius:"6px",fontSize:"9.5px",fontWeight:"800",cursor:"pointer"}}>⚖️ Égaliser horizontaux</button>
              </div>
            )}
            {(pbZone.hBars || []).map((b, i) => (
              <div key={"ph"+i} style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px"}}>
                <span style={{fontSize:"10px",color:C.muted,width:"58px",flexShrink:0}}>━ Horiz. {i+1}</span>
                <input type="number" inputMode="numeric" value={b} onChange={e => majBarre('h', i, e.target.value)} style={{flex:1}}/>
                <span style={{fontSize:"10px",color:C.muted,flexShrink:0}}>mm</span>
                <button type="button" onClick={() => supprBarre('h', i)} style={{background:C.rougeDim,border:"1px solid rgba(220,38,38,0.25)",color:C.rouge,borderRadius:"7px",padding:"5px 9px",fontSize:"11px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>✕</button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ---- CONFIGURATEUR (remplace l'ancien TraverseModal) ----
// Dessin statique (chaîne SVG partagée avec les exports) + couche
// d'interaction transparente par-dessus : tap zone = remplissage,
// glisser une poignée dorée = déplacer meneau / traverse.
function ConfigurateurModal({ o, set, onClose }) {
  const [drag, setDrag] = React.useState(null); // { kind:'m'|'t', index }
  const [picker, setPicker] = React.useState(null); // { col, lig }
  const [vw, setVw] = React.useState(window.innerWidth);
  const [vueExt, setVueExt] = React.useState(false); // false = vue intérieure (référence), true = vue extérieure (miroir)
  const overlayRef = React.useRef(null);

  React.useEffect(() => {
    const onResize = () => setVw(window.innerWidth);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  const areaW = Math.min(520, vw - 70) - 70;
  const areaH = Math.max(240, Math.round(window.innerHeight * 0.42));
  const g = geomSchema(o, areaW, areaH, vueExt);
  const svgStr = buildSchemaSvgString(o, true, areaW, areaH, vueExt);
  const meneaux = o.meneaux || [], traverses = o.traverses || [];

  const majDivision = (kind, i, val) => {
    const v = Math.round(Number(val) || 0);
    if (kind === 'm') set('meneaux', meneaux.map((m, idx) => idx === i ? v : m));
    else set('traverses', traverses.map((t, idx) => idx === i ? v : t));
  };
  const supprDivision = (kind, i) => {
    if (!avertirSiZonesConfigurees()) return;
    if (kind === 'm') set('meneaux', meneaux.filter((_, idx) => idx !== i));
    else set('traverses', traverses.filter((_, idx) => idx !== i));
  };
  // Avertit si des zones sont déjà configurées avant toute action qui ajoute
  // une division (décale les index de colonne/ligne des zones suivantes).
  // Retourne true si on peut continuer (rien à signaler, ou confirmé).
  const avertirSiZonesConfigurees = () => {
    const zonesConfigurees = Object.values(o.zonesRempl || {}).some(v => v && v !== "Fixe")
      || Object.keys(o.zonesVitrage || {}).length > 0 || Object.keys(o.zonesPetitBois || {}).length > 0;
    if (!zonesConfigurees) return true;
    return confirm("Des zones sont déjà configurées (ouvrant, vitrage, petit bois...). Ajouter une division maintenant peut décaler ces réglages sur la mauvaise case.\n\nMieux vaut ajouter toutes tes divisions D'ABORD, et configurer les zones EN DERNIER.\n\nContinuer quand même ?");
  };

  const ajouter = (kind) => {
    if (!avertirSiZonesConfigurees()) return;
    const bornes = kind === 'm' ? g.xs : g.ys;
    for (let i = 0; i < bornes.length - 1; i++) {
      if (bornes[i + 1] - bornes[i] >= ECART_MIN * 2) {
        const v = Math.round((bornes[i] + bornes[i + 1]) / 2);
        if (kind === 'm') set('meneaux', [...meneaux, v]); else set('traverses', [...traverses, v]);
        return;
      }
    }
    alert("Plus de place (écart mini " + ECART_MIN + " mm).");
  };

  // Raccourci "2 vantaux" : scinde LA zone touchée en deux (ajoute un meneau
  // pile au milieu de cette zone) et règle les deux moitiés d'un coup — même
  // résultat que faire + Meneau puis régler chaque côté à la main, protégé
  // par le même avertissement.
  const scinderZone = (col, lig, valGauche, valDroit) => {
    if (!avertirSiZonesConfigurees()) return;
    const x0 = g.xs[col], x1 = g.xs[col + 1];
    if (x1 - x0 < ECART_MIN * 2) { alert("Zone trop étroite pour 2 vantaux (mini " + (ECART_MIN * 2) + " mm)."); return; }
    const nv = Math.round((x0 + x1) / 2);
    set('meneaux', [...meneaux, nv]);
    set('zonesRempl', Object.assign({}, o.zonesRempl || {}, { [col + "-" + lig]: valGauche, [(col + 1) + "-" + lig]: valDroit }));
    // Ouvrant principal à droite par défaut (une seule poignée) — l'ouvrant
    // gauche devient secondaire, modifiable ensuite dans le picker de chaque zone.
    set('ouvrantsSecondaires', Object.assign({}, o.ouvrantsSecondaires || {}, { [col + "-" + lig]: true }));
    setPicker(null);
  };

  // Égalise les segments (répartition uniforme) — ne change ni le nombre ni
  // l'ordre des divisions, donc aucun risque de décalage des zones déjà
  // configurées, contrairement à ajouter/scinder.
  const egaliserLargeurs = () => {
    if (meneaux.length === 0) { alert("Aucun meneau à égaliser."); return; }
    const n = meneaux.length + 1, pas = g.Lmm / n;
    const nouvelles = []; for (let i = 1; i < n; i++) nouvelles.push(Math.round(pas * i));
    set('meneaux', nouvelles);
  };
  const egaliserHauteurs = () => {
    if (traverses.length === 0) { alert("Aucune traverse à égaliser."); return; }
    const n = traverses.length + 1, pas = g.Hmm / n;
    const nouvelles = []; for (let i = 1; i < n; i++) nouvelles.push(Math.round(pas * i));
    set('traverses', nouvelles);
  };

  // Coupe/rétablit un segment précis d'un meneau (ligne l) ou d'une traverse
  // (colonne c) — clic direct sur le morceau concerné dans le dessin. Aucun
  // meneau/traverse n'est coupé par défaut, c'est un choix explicite au clic.
  const toggleSegmentMeneau = (mVal, l) => {
    const liste = (o.meneauxCoupures || {})[mVal] || [];
    const next = liste.includes(l) ? liste.filter(x => x !== l) : [...liste, l];
    set('meneauxCoupures', Object.assign({}, o.meneauxCoupures || {}, { [mVal]: next }));
  };
  const toggleSegmentTraverse = (tVal, c) => {
    const liste = (o.traversesCoupures || {})[tVal] || [];
    const next = liste.includes(c) ? liste.filter(x => x !== c) : [...liste, c];
    set('traversesCoupures', Object.assign({}, o.traversesCoupures || {}, { [tVal]: next }));
  };

  const pointerToMm = (e) => {
    const rect = overlayRef.current.getBoundingClientRect();
    const pxX = e.clientX - rect.left - g.ML;
    return {
      x: Math.round(g.miroir ? g.Lmm - pxX / g.scale : pxX / g.scale),
      y: Math.round(g.Hmm - (e.clientY - rect.top - g.MT) / g.scale),
    };
  };
  const onMove = (e) => {
    if (!drag) return;
    const p = pointerToMm(e);
    if (drag.kind === 'm') {
      const tri = meneaux.map(Number).sort((a, b) => a - b);
      const pos = tri.indexOf(Number(meneaux[drag.index]));
      const lo = (pos > 0 ? tri[pos - 1] : 0) + ECART_MIN;
      const hi = (pos < tri.length - 1 ? tri[pos + 1] : g.Lmm) - ECART_MIN;
      majDivision('m', drag.index, Math.max(lo, Math.min(hi, p.x)));
    } else {
      const tri = traverses.map(Number).sort((a, b) => a - b);
      const pos = tri.indexOf(Number(traverses[drag.index]));
      const lo = (pos > 0 ? tri[pos - 1] : 0) + ECART_MIN;
      const hi = (pos < tri.length - 1 ? tri[pos + 1] : g.Hmm) - ECART_MIN;
      majDivision('t', drag.index, Math.max(lo, Math.min(hi, p.y)));
    }
  };

  const btn = (bg, color, bord) => ({ padding: "9px 13px", background: bg, color, border: bord ? "1.5px solid " + bord : "none", borderRadius: "9px", fontSize: "12px", fontWeight: "800", cursor: "pointer" });

  // Édition rapide d'une cote de segment en tapant directement sur le chiffre
  // dans le dessin. Règle simple et générale, valable pour n'importe quel
  // nombre de divisions : modifier un segment déplace la division à SA
  // DROITE ; pour le tout dernier segment (pas de division à droite, juste
  // le bord du cadre), ça déplace celle de gauche à la place. Bornée par
  // l'écart mini pour ne jamais faire se croiser deux divisions.
  const editerSegmentH = (i) => {
    if (meneaux.length === 0) return;
    const val = Math.round(g.xs[i + 1] - g.xs[i]);
    const nv = prompt("Nouvelle valeur pour ce segment (mm) :", String(val));
    if (nv === null) return;
    const n = Math.round(Number(nv));
    if (!n || n <= 0) return;
    const dernier = i === g.xs.length - 2;
    if (!dernier) {
      // Déplace la division à droite du segment, borne par la division encore plus à droite
      const idx = meneaux.findIndex(m => Number(m) === g.xs[i + 1]);
      const hi = g.xs[i + 2] - ECART_MIN;
      majDivision('m', idx, Math.max(g.xs[i] + ECART_MIN, Math.min(hi, g.xs[i] + n)));
    } else {
      // Dernier segment : déplace la division à gauche, bornée par celle encore plus à gauche
      const idx = meneaux.findIndex(m => Number(m) === g.xs[i]);
      const lo = g.xs[i - 1] + ECART_MIN;
      majDivision('m', idx, Math.max(lo, Math.min(g.Lmm - ECART_MIN, g.Lmm - n)));
    }
  };
  const editerSegmentV = (i) => {
    if (traverses.length === 0) return;
    const val = Math.round(g.ys[i + 1] - g.ys[i]);
    const nv = prompt("Nouvelle valeur pour ce segment (mm) :", String(val));
    if (nv === null) return;
    const n = Math.round(Number(nv));
    if (!n || n <= 0) return;
    const dernier = i === g.ys.length - 2;
    if (!dernier) {
      const idx = traverses.findIndex(t => Number(t) === g.ys[i + 1]);
      const hi = g.ys[i + 2] - ECART_MIN;
      majDivision('t', idx, Math.max(g.ys[i] + ECART_MIN, Math.min(hi, g.ys[i] + n)));
    } else {
      const idx = traverses.findIndex(t => Number(t) === g.ys[i]);
      const lo = g.ys[i - 1] + ECART_MIN;
      majDivision('t', idx, Math.max(lo, Math.min(g.Hmm - ECART_MIN, g.Hmm - n)));
    }
  };

  return (
    <div style={{position:"fixed",inset:0,zIndex:4000,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",padding:"14px"}}
      onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:"#fff",borderRadius:"16px",width:"620px",maxWidth:"100%",maxHeight:"94vh",overflowY:"auto",padding:"20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
          <h2 style={{fontSize:"15px",color:C.white,fontWeight:"900"}}>📐 Configurateur — {o.materiau}{o.pose ? " · " + o.pose : ""}</h2>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:"18px",color:C.muted,cursor:"pointer"}}>✕</button>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"10px"}}>
          <div>
            <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"5px"}}>Largeur (mm)</label>
            <input type="number" inputMode="numeric" value={o.largeur} onChange={e => set('largeur', e.target.value)}/>
          </div>
          <div>
            <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"5px"}}>Hauteur (mm)</label>
            <input type="number" inputMode="numeric" value={o.hauteur} onChange={e => set('hauteur', e.target.value)}/>
          </div>
        </div>

        <div style={{display:"flex",gap:"8px",marginBottom:"10px"}}>
          <button type="button" onClick={() => ajouter('m')} style={btn(C.orDim, "#8a6d1f", C.orBord)}>┃ + Meneau</button>
          <button type="button" onClick={() => ajouter('t')} style={btn(C.orDim, "#8a6d1f", C.orBord)}>━ + Traverse</button>
          <div style={{flex:1}}/>
          <button type="button" onClick={() => setVueExt(!vueExt)}
            style={btn(vueExt ? C.rougeDim : "#fff", vueExt ? C.rouge : C.muted, vueExt ? "rgba(220,38,38,0.3)" : C.border)}>
            {vueExt ? "🔄 Vue extérieure" : "🔄 Vue intérieure"}
          </button>
        </div>

        {/* Dessin statique + couche d'interaction */}
        <div style={{display:"flex",justifyContent:"center",marginBottom:"6px"}}>
          <div style={{position:"relative",width:g.svgW,height:g.svgH,maxWidth:"100%"}}>
            <div dangerouslySetInnerHTML={{ __html: svgStr }}/>
            <svg ref={overlayRef} width={g.svgW} height={g.svgH}
              style={{position:"absolute",inset:0,touchAction:"none"}}
              onPointerMove={onMove} onPointerUp={() => setDrag(null)} onPointerLeave={() => setDrag(null)}>
              {/* Zones cliquables */}
              {g.ys.slice(0, -1).map((y0, l) => g.xs.slice(0, -1).map((x0, c) => {
                const x1 = g.xs[c + 1], y1 = g.ys[l + 1];
                return (
                  <rect key={c + "-" + l} x={g.X(x0)} y={g.Y(y1)} width={(x1 - x0) * g.scale} height={(y1 - y0) * g.scale}
                    fill="transparent" style={{cursor:"pointer"}} onClick={() => setPicker({ col: c, lig: l })}/>
                );
              }))}
              {/* Meneaux : un rect cliquable par segment (ligne) pour couper/rétablir
                  ce morceau précis, + une poignée de glisser réduite au centre. */}
              {meneaux.map((m, i) => {
                const mVal = Number(m) || 0;
                const px = g.X(mVal);
                const cy = g.MT + g.H / 2;
                const nRowsLoc = g.ys.length - 1;
                return (
                  <g key={"m" + i}>
                    {Array.from({ length: nRowsLoc }).map((_, l) => {
                      const yTop = g.Y(g.ys[l + 1]), yBot = g.Y(g.ys[l]);
                      const actif = !((o.meneauxCoupures || {})[mVal] || []).includes(l);
                      return (
                        <rect key={"seg" + l} x={px - Math.max(14, g.dt)} y={yTop} width={Math.max(28, g.dt * 2)} height={yBot - yTop}
                          fill={actif ? "transparent" : "rgba(220,38,38,0.12)"}
                          stroke={actif ? "none" : "#DC2626"} strokeWidth={actif ? 0 : 1} strokeDasharray={actif ? "" : "4,3"}
                          style={{cursor:"pointer"}} onClick={() => toggleSegmentMeneau(mVal, l)}/>
                      );
                    })}
                    <rect x={px - Math.max(15, g.dt)} y={cy - 22} width={Math.max(30, g.dt * 2)} height={44} fill="transparent"
                      style={{cursor:"ew-resize"}} onPointerDown={(e) => { e.preventDefault(); setDrag({ kind: 'm', index: i }); }}/>
                    <circle cx={px} cy={cy} r="9" fill={C.or} opacity="0.92" style={{pointerEvents:"none"}}/>
                    <text x={px} y={cy + 3.5} fontSize="10" fontWeight="900" fill={C.white} textAnchor="middle" style={{pointerEvents:"none"}}>⇔</text>
                  </g>
                );
              })}
              {/* Traverses : idem, un rect cliquable par segment (colonne). */}
              {traverses.map((t, i) => {
                const tVal = Number(t) || 0;
                const py = g.Y(tVal);
                const cx = g.ML + g.W / 2;
                const nColsLoc = g.xs.length - 1;
                return (
                  <g key={"t" + i}>
                    {Array.from({ length: nColsLoc }).map((_, c) => {
                      const xLeft = g.X(g.xs[c]), xRight = g.X(g.xs[c + 1]);
                      const actif = !((o.traversesCoupures || {})[tVal] || []).includes(c);
                      return (
                        <rect key={"seg" + c} x={xLeft} y={py - Math.max(14, g.dt)} width={xRight - xLeft} height={Math.max(28, g.dt * 2)}
                          fill={actif ? "transparent" : "rgba(220,38,38,0.12)"}
                          stroke={actif ? "none" : "#DC2626"} strokeWidth={actif ? 0 : 1} strokeDasharray={actif ? "" : "4,3"}
                          style={{cursor:"pointer"}} onClick={() => toggleSegmentTraverse(tVal, c)}/>
                      );
                    })}
                    <rect x={cx - 22} y={py - Math.max(15, g.dt)} width={44} height={Math.max(30, g.dt * 2)} fill="transparent"
                      style={{cursor:"ns-resize"}} onPointerDown={(e) => { e.preventDefault(); setDrag({ kind: 't', index: i }); }}/>
                    <circle cx={cx} cy={py} r="9" fill={C.or} opacity="0.92" style={{pointerEvents:"none"}}/>
                    <text x={cx} y={py + 3.5} fontSize="10" fontWeight="900" fill={C.white} textAnchor="middle" style={{pointerEvents:"none"}}>⇕</text>
                  </g>
                );
              })}
              {/* Cotes de segment cliquables — tous les segments, pas
                  seulement les bords (règle générale ci-dessus). */}
              {meneaux.length > 0 && g.xs.slice(0, -1).map((x0, i) => {
                const cx = (g.X(x0) + g.X(g.xs[i + 1])) / 2;
                const cy = g.MT + g.H + 12;
                return (
                  <rect key={"chx" + i} x={cx - 20} y={cy - 10} width={40} height={20} rx={5} fill="transparent"
                    style={{cursor:"pointer"}} onClick={() => editerSegmentH(i)}/>
                );
              })}
              {traverses.length > 0 && g.ys.slice(0, -1).map((y0, i) => {
                const cy = (g.Y(y0) + g.Y(g.ys[i + 1])) / 2;
                const cx = g.ML - 14;
                return (
                  <rect key={"chy" + i} x={cx - 14} y={cy - 20} width={28} height={40} rx={5} fill="transparent"
                    style={{cursor:"pointer"}} onClick={() => editerSegmentV(i)}/>
                );
              })}
            </svg>
          </div>
        </div>
        <div style={{fontSize:"10px",color:C.muted,textAlign:"center",marginBottom:"12px",lineHeight:"1.5"}}>
          👆 Touche une zone pour choisir son ouvrant · glisse les poignées dorées.<br/>
          Convention : la pointe du symbole indique le côté de la poignée (charnières à l'opposé), vue intérieure.<br/>
          ⚠️ Ajoute toutes tes divisions <b>d'abord</b>, configure les zones <b>en dernier</b> — dans cet ordre, aucun décalage possible.
        </div>

        {/* Edition précise des divisions */}
        {(meneaux.length > 0 || traverses.length > 0) && (
          <div style={{border:"1px solid "+C.border,borderRadius:"10px",padding:"12px",marginBottom:"14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
              <div style={{fontSize:"11px",fontWeight:"800",color:C.white}}>Position exacte des divisions</div>
              <div style={{display:"flex",gap:"6px"}}>
                {meneaux.length > 0 && (
                  <button type="button" onClick={egaliserLargeurs} title="Répartit les largeurs uniformément"
                    style={{padding:"5px 9px",background:C.bleuDim,border:"1px solid rgba(37,99,235,0.3)",color:C.bleu,borderRadius:"7px",fontSize:"10px",fontWeight:"800",cursor:"pointer"}}>⚖️ Largeurs</button>
                )}
                {traverses.length > 0 && (
                  <button type="button" onClick={egaliserHauteurs} title="Répartit les hauteurs uniformément"
                    style={{padding:"5px 9px",background:C.bleuDim,border:"1px solid rgba(37,99,235,0.3)",color:C.bleu,borderRadius:"7px",fontSize:"10px",fontWeight:"800",cursor:"pointer"}}>⚖️ Hauteurs</button>
                )}
              </div>
            </div>
            {meneaux.map((m, i) => {
              const mVal = Number(m) || 0;
              const coupes = ((o.meneauxCoupures || {})[mVal] || []).length;
              return (
                <div key={"em" + i} style={{marginBottom:"8px",paddingBottom:"8px",borderBottom: traverses.length > 0 ? "1px dashed "+C.border : "none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                    <span style={{fontSize:"11px",color:C.muted,width:"108px",flexShrink:0}}>┃ Meneau {i + 1} (dep. gauche)</span>
                    <input type="number" inputMode="numeric" value={m} onChange={e => majDivision('m', i, e.target.value)} style={{flex:1}}/>
                    <span style={{fontSize:"11px",color:C.muted,flexShrink:0}}>mm</span>
                    <button type="button" onClick={() => supprDivision('m', i)} style={{background:C.rougeDim,border:"1px solid rgba(220,38,38,0.25)",color:C.rouge,borderRadius:"7px",padding:"6px 9px",fontSize:"11px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>✕</button>
                  </div>
                  {traverses.length > 0 && (
                    <div style={{marginTop:"6px",marginLeft:"116px",display:"flex",alignItems:"center",gap:"8px"}}>
                      <span style={{fontSize:"10px",color:coupes?"#DC2626":C.muted}}>
                        {coupes ? "✂️ " + coupes + " morceau" + (coupes>1?"x":"") + " coupé" + (coupes>1?"s":"") + " — tape sur le dessin pour ajuster" : "Plein — tape un morceau sur le dessin pour le couper"}
                      </span>
                      {coupes > 0 && (
                        <button type="button" onClick={() => set('meneauxCoupures', Object.assign({}, o.meneauxCoupures || {}, { [mVal]: [] }))}
                          style={{padding:"4px 8px",background:C.rougeDim,border:"1px solid rgba(220,38,38,0.25)",color:C.rouge,borderRadius:"6px",fontSize:"9.5px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>Tout réactiver</button>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
            {traverses.map((t, i) => {
              const tVal = Number(t) || 0;
              const coupes = ((o.traversesCoupures || {})[tVal] || []).length;
              return (
                <div key={"et" + i} style={{marginBottom:"8px",paddingBottom:"8px",borderBottom: meneaux.length > 0 ? "1px dashed "+C.border : "none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                    <span style={{fontSize:"11px",color:C.muted,width:"108px",flexShrink:0}}>━ Traverse {i + 1} (dep. bas)</span>
                    <input type="number" inputMode="numeric" value={t} onChange={e => majDivision('t', i, e.target.value)} style={{flex:1}}/>
                    <span style={{fontSize:"11px",color:C.muted,flexShrink:0}}>mm</span>
                    <button type="button" onClick={() => supprDivision('t', i)} style={{background:C.rougeDim,border:"1px solid rgba(220,38,38,0.25)",color:C.rouge,borderRadius:"7px",padding:"6px 9px",fontSize:"11px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>✕</button>
                  </div>
                  {meneaux.length > 0 && (
                    <div style={{marginTop:"6px",marginLeft:"116px",display:"flex",alignItems:"center",gap:"8px"}}>
                      <span style={{fontSize:"10px",color:coupes?"#DC2626":C.muted}}>
                        {coupes ? "✂️ " + coupes + " morceau" + (coupes>1?"x":"") + " coupé" + (coupes>1?"s":"") + " — tape sur le dessin pour ajuster" : "Pleine — tape un morceau sur le dessin pour le couper"}
                      </span>
                      {coupes > 0 && (
                        <button type="button" onClick={() => set('traversesCoupures', Object.assign({}, o.traversesCoupures || {}, { [tVal]: [] }))}
                          style={{padding:"4px 8px",background:C.rougeDim,border:"1px solid rgba(220,38,38,0.25)",color:C.rouge,borderRadius:"6px",fontSize:"9.5px",fontWeight:"700",cursor:"pointer",flexShrink:0}}>Tout réactiver</button>
                      )}
                    </div>

                </div>
              );
            })}
          </div>
        )}

        <button onClick={onClose} style={{width:"100%",padding:"12px",background:C.white,color:"#fff",border:"none",borderRadius:"10px",fontWeight:"900",fontSize:"13px",cursor:"pointer"}}>
          Valider et fermer
        </button>
      </div>

      {picker && (
        <ZonePicker o={o} zoneKey={picker.col + "-" + picker.lig} current={(o.zonesRempl || {})[picker.col + "-" + picker.lig] || "Fixe"}
          hauteursPoignee={o.hauteursPoignee} zonesVitrage={o.zonesVitrage} zonesPetitBois={o.zonesPetitBois} ouvrantsSecondaires={o.ouvrantsSecondaires}
          zoneWmm={g.xs[picker.col + 1] - g.xs[picker.col]} zoneHmm={g.ys[picker.lig + 1] - g.ys[picker.lig]}
          onSelect={(v) => set('zonesRempl', Object.assign({}, o.zonesRempl || {}, { [picker.col + "-" + picker.lig]: v }))}
          onSetHpZone={(key, v) => set('hauteursPoignee', Object.assign({}, o.hauteursPoignee || {}, { [key]: v }))}
          onSetVitrageZone={(key, patch) => set('zonesVitrage', Object.assign({}, o.zonesVitrage || {}, { [key]: Object.assign({}, (o.zonesVitrage || {})[key], patch) }))}
          onSetPbZone={(key, patch) => set('zonesPetitBois', Object.assign({}, o.zonesPetitBois || {}, { [key]: Object.assign({ largeur: 18, vBars: [], hBars: [] }, (o.zonesPetitBois || {})[key], patch) }))}
          onSplit2={(valGauche, valDroit) => scinderZone(picker.col, picker.lig, valGauche, valDroit)}
          onSetSecondaire={(key, val) => set('ouvrantsSecondaires', Object.assign({}, o.ouvrantsSecondaires || {}, { [key]: val }))}
          onClose={() => setPicker(null)}/>
      )}
    </div>
  );
}

// PDF : schéma du configurateur inséré pour chaque ouverture cotée (async)
// Dessine une carte "ouverture" dans le PDF (position x,y, taille w,h en mm).
// Ordre demandé : repère, dimension, image, quantité, couleur, puis le reste
// des options en compact en dessous.
async function dessinerCarteOuverture(doc, index, o, x, y, w, h) {
  doc.setDrawColor(226, 226, 226); doc.setLineWidth(0.3);
  doc.rect(x, y, w, h);
  doc.setFillColor(0, 26, 66);
  doc.rect(x, y, w, 6.5, 'F');
  doc.setTextColor(218, 178, 57); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
  doc.text((index + 1) + '. ' + (o.repere || o.type), x + 2.5, y + 4.6);

  const padX = x + 3;
  const rowTop = y + 9.5;
  const rowH = 34; // hauteur réservée à la ligne image + infos clés

  // Image (schéma du configurateur), bornée en largeur ET hauteur pour ne
  // jamais déborder sur la colonne d'infos ni la ligne suivante.
  let imgW = 0;
  if (o.largeur && o.hauteur) {
    try {
      const g = geomSchema(o, 300, 220);
      const ratio = g.svgW / g.svgH;
      let iw, ih;
      if (ratio >= 1) { iw = 38; ih = 38 / ratio; } else { ih = rowH - 2; iw = ih * ratio; }
      imgW = iw;
      const png = await svgVersPng(buildSchemaSvgString(o, true, 300, 220), g.svgW, g.svgH);
      doc.addImage(png, 'PNG', padX, rowTop, iw, ih);
    } catch (e) { /* pas de schéma dispo : on continue sans bloquer */ }
  }

  // Infos clés à droite de l'image : dimension, quantité, couleur.
  const xInfo = padX + (imgW > 0 ? imgW + 3.5 : 0);
  const wInfo = (x + w - 3) - xInfo;
  let yInfo = rowTop + 3.5;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8.2); doc.setTextColor(0, 26, 66);
  doc.text(o.type + (o.pose ? ' · ' + o.pose : ''), xInfo, yInfo, { maxWidth: wInfo }); yInfo += 4.3;
  doc.setFontSize(7.6);
  const infoLigne = (label, val) => {
    doc.setFont('helvetica', 'bold'); doc.setTextColor(90, 90, 90); doc.text(label, xInfo, yInfo);
    doc.setFont('helvetica', 'normal'); doc.setTextColor(20, 20, 20);
    const txt = doc.splitTextToSize(String(val || '—'), wInfo - 13);
    doc.text(txt, xInfo + 13, yInfo);
    yInfo += Math.max(3.6, txt.length * 3.6);
  };
  infoLigne('Dim.', (o.largeur || '—') + '×' + (o.hauteur || '—') + ' mm');
  infoLigne('Qté', o.quantite || '1');
  infoLigne('Couleur', o.couleur || '—');

  // Séparateur puis le reste des options, en compact, tronqué proprement si
  // la carte est trop petite pour tout afficher (mieux vaut couper net que
  // déborder sur la carte suivante).
  let yy = y + 9.5 + rowH;
  doc.setDrawColor(235, 235, 235); doc.setLineWidth(0.25);
  doc.line(padX, yy, x + w - 3, yy); yy += 3;

  const menStr = (o.meneaux && o.meneaux.filter(Boolean).length) ? o.meneaux.filter(Boolean).map(m => m + ' mm').join(' / ') : null;
  const autres = [
    ['Traverse(s)', (o.traverses && o.traverses.filter(Boolean).length) ? o.traverses.filter(Boolean).map(t => t + ' mm').join(' / ') : null],
    ['Meneau(x)', menStr],
    ['Vitrage', o.vitrage],
    ['Dormant', o.dormant],
    ['Options standard', (o.optionsStandard && o.optionsStandard.length) ? o.optionsStandard.join(', ') : null],
    ['Serrure', o.serrure], ['Cylindre', (o.cylindreSecu && o.cylindreSecu.length) ? o.cylindreSecu.join(', ') : null],
    ['Hauteur poignée', o.hauteurPoignee ? o.hauteurPoignee + ' mm' : null],
    ['Ventilation', o.ventilation], ['Type volet', o.typeVolet],
    ['Options', o.options], ['Note', o.note],
  ];
  const yLimite = y + h - 2.5;
  doc.setFontSize(7.2);
  for (const [label, val] of autres) {
    if (!val) continue;
    if (yy > yLimite - 3) { doc.setFont('helvetica', 'italic'); doc.setTextColor(150, 150, 150); doc.text('… voir PDF complet', padX, yy); break; }
    doc.setFont('helvetica', 'bold'); doc.setTextColor(90, 90, 90); doc.text(label + ' :', padX, yy);
    doc.setFont('helvetica', 'normal'); doc.setTextColor(20, 20, 20);
    const txt = doc.splitTextToSize(String(val), (x + w - 3) - (padX + 24));
    doc.text(txt.slice(0, 2), padX + 24, yy); // max 2 lignes par champ pour ne pas déborder
    yy += Math.max(3.4, Math.min(txt.length, 2) * 3.4);
  }
}

// PDF principal : grille de 4 cartes (2×2) par page A4 portrait, dans l'ordre
// demandé (repère, dimension, image, quantité, couleur, puis reste des
// options). En-tête de page : N° dossier, client, fiche, agence.
async function genererPdfMetre(fiche, ouvertures) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const M = 10, PAGE_W = 210, PAGE_H = 297, GAP = 5, COLS = 2, ROWS = 2;
  const cardW = (PAGE_W - 2 * M - GAP) / COLS;
  const gridTop = M + 18;
  const cardH = (PAGE_H - gridTop - M - GAP) / ROWS;

  const dessinerHeaderPage = () => {
    let y = M + 4;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(0, 26, 66);
    doc.text('RSIA IKO — Fiche de prise de côtes', M, y); y += 4.5;
    doc.setDrawColor(218, 178, 57); doc.setLineWidth(0.6);
    doc.line(M, y, PAGE_W - M, y); y += 4;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.6); doc.setTextColor(20, 20, 20);
    const champs = [];
    if (fiche.numeroDossier) champs.push('N° dossier : ' + fiche.numeroDossier);
    champs.push('Client : ' + (fiche.client || '—'));
    champs.push('Fiche : ' + fiche.numero);
    champs.push('Agence : ' + (fiche.agence || '—'));
    doc.text(champs.join('     ·     '), M, y);
  };

  for (let i = 0; i < ouvertures.length; i++) {
    const posInPage = i % (COLS * ROWS);
    if (posInPage === 0) {
      if (i > 0) doc.addPage();
      dessinerHeaderPage();
    }
    const col = posInPage % COLS, row = Math.floor(posInPage / COLS);
    const cx = M + col * (cardW + GAP);
    const cy = gridTop + row * (cardH + GAP);
    await dessinerCarteOuverture(doc, i, ouvertures[i], cx, cy, cardW, cardH);
  }
  if (ouvertures.length === 0) dessinerHeaderPage();

  doc.save((fiche.numero || 'fiche-metre') + '.pdf');
}

// ============================================================
//                RÉSUMÉ BE (synthétique, saisie rapide)
// Contrairement à genererPdfMetre (exhaustif, destiné à l'atelier de
// fabrication), ce document ne garde que ce dont le BE a besoin pour sa
// saisie : couleur, hauteur de poignée, schéma. Compact, tient sur peu de
// pages même avec beaucoup d'ouvertures.
// ============================================================

// Construit le document (sans l'exporter) pour pouvoir le réutiliser à la
// fois pour l'impression (aperçu navigateur) et l'enregistrement (téléchargement).
async function construireResumeBE(fiche, ouvertures) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const marge = 16;
  let y = 20;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
  doc.setTextColor(0, 26, 66);
  doc.text('RSIA IKO — Résumé BE', marge, y); y += 5.5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90, 90, 90);
  doc.text('Saisie rapide — couleur, hauteur poignée, schéma', marge, y); y += 5;
  doc.setDrawColor(218, 178, 57); doc.setLineWidth(0.7);
  doc.line(marge, y, 210 - marge, y); y += 7;

  doc.setFontSize(9.5); doc.setTextColor(20, 20, 20);
  const ligne = (label, valeur) => {
    doc.setFont('helvetica', 'bold'); doc.text(label, marge, y);
    doc.setFont('helvetica', 'normal'); doc.text(String(valeur || '—'), marge + 26, y);
    y += 5;
  };
  ligne('Fiche :', fiche.numero);
  if (fiche.numeroDossier) ligne('N° dossier :', fiche.numeroDossier);
  ligne('Client :', fiche.client + (fiche.adresse ? ' — ' + fiche.adresse : ''));
  ligne('Agence :', fiche.agence);
  y += 2;

  const THUMB = 34; // largeur du schéma en mm, volontairement petit (synthétique)
  for (let i = 0; i < ouvertures.length; i++) {
    const o = ouvertures[i];
    const g = geomSchema(o, 300, 220);
    const thumbH = THUMB * g.svgH / g.svgW;
    const blocH = Math.max(thumbH + 4, 22);
    if (y + blocH > 280) { doc.addPage(); y = 20; }

    doc.setDrawColor(226, 226, 226); doc.setLineWidth(0.3);
    doc.rect(marge, y, 210 - 2 * marge, blocH);

    if (o.largeur && o.hauteur) {
      try {
        const png = await svgVersPng(buildSchemaSvgString(o, true, 300, 220), g.svgW, g.svgH);
        doc.addImage(png, 'PNG', marge + 3, y + 2, THUMB, thumbH);
      } catch (e) { /* pas de schéma dispo, on continue sans bloquer */ }
    }

    const xText = marge + THUMB + 10;
    let yy = y + 6;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(0, 26, 66);
    doc.text((i + 1) + '. ' + (o.repere || o.type), xText, yy); yy += 5.5;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(20, 20, 20);
    doc.text(o.type + ' · ' + o.materiau + (o.pose ? ' · ' + o.pose : '') + ' · ' + (o.largeur || '—') + '×' + (o.hauteur || '—') + ' mm', xText, yy); yy += 5;
    doc.setFont('helvetica', 'bold'); doc.text('Couleur : ', xText, yy);
    doc.setFont('helvetica', 'normal'); doc.text(o.couleur || '—', xText + 16, yy); yy += 5;
    doc.setFont('helvetica', 'bold'); doc.text('Hauteur poignée : ', xText, yy);
    doc.setFont('helvetica', 'normal'); doc.text(o.hauteurPoignee ? o.hauteurPoignee + ' mm' : '—', xText + 32, yy);

    y += blocH + 4;
  }

  return doc;
}

// ---- LOGIN ----
// Authentification : session Auth #003 (api/verif-securite?action=session),
// remplace l'ancienne table PASSWORDS (mots de passe en dur, supprimée).
// La selection d'agence reste une VRAIE logique metier (liste AGENCES,
// filtre des fiches par agence, cf. Metreur/FicheMetre plus bas) - elle
// n'est plus utilisee comme preuve d'identite : elle n'apparait qu'APRES
// une session valide, et n'est plus un champ "mot de passe" mais un choix.
function Login({ onLogin }) {
  const [etat, setEtat] = React.useState("verification"); // verification | choix-agence | refuse | erreur
  const [role, setRole] = React.useState(null);
  const [agenceChoisie, setAgenceChoisie] = React.useState(AGENCES[0]);

  React.useEffect(() => {
    fetch('/api/verif-securite?action=session')
      .then(r => {
        if (r.status === 401) {
          window.location.href = "/auth-login.html?retour=" + encodeURIComponent("/metreur.html");
          return null;
        }
        return r.json().then(json => ({ status: r.status, json }));
      })
      .then(res => {
        if (!res) return; // redirection deja en cours
        if (res.status !== 200) { setEtat("erreur"); return; }
        const r = res.json.role;
        setRole(r);
        if (r === "SUPER_ADMIN_IKO") {
          onLogin("global"); // acces global, identique a l'ancien mot de passe maitre
        } else if (r === "TECHNICIEN") {
          setEtat("choix-agence");
        } else {
          setEtat("refuse");
        }
      })
      .catch(() => setEtat("erreur"));
  }, []);

  if (etat === "verification") {
    return (
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
        <div style={{fontSize:"13px",color:C.muted}}>Vérification de la session…</div>
      </div>
    );
  }

  if (etat === "erreur") {
    return (
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:"13px",color:C.rouge,marginBottom:"12px"}}>Erreur de vérification de session.</div>
          <button onClick={() => window.location.href = "/auth-login.html?retour=" + encodeURIComponent("/metreur.html")}
            style={{padding:"12px 20px",background:C.or,color:"#111",border:"none",borderRadius:"10px",fontSize:"13px",fontWeight:"900",cursor:"pointer"}}>
            Se reconnecter
          </button>
        </div>
      </div>
    );
  }

  if (etat === "refuse") {
    return (
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
        <div style={{textAlign:"center",maxWidth:"320px"}}>
          <div style={{fontSize:"13px",color:C.rouge,marginBottom:"8px",fontWeight:"700"}}>Accès refusé</div>
          <div style={{fontSize:"12px",color:C.muted}}>Votre compte n'a pas les droits nécessaires pour accéder au module Métreur.</div>
        </div>
      </div>
    );
  }

  // etat === "choix-agence" (role TECHNICIEN) : choix metier, pas un mot de passe.
  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",position:"relative"}}>
      <div style={{width:"100%",maxWidth:"340px"}}>
        <div style={{textAlign:"center",marginBottom:"36px"}}>
          <div style={{width:"190px",height:"100px",background:"#FFFFFF",borderRadius:"16px",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",boxShadow:"0 8px 32px rgba(218,178,57,0.3)",padding:"8px",boxSizing:"border-box"}}>
            <span style={{fontSize:"26px",fontWeight:"900",color:"#111111",letterSpacing:"1px"}}>RSIA IKO</span>
          </div>
          <div style={{fontSize:"11px",color:C.muted,marginTop:"6px",letterSpacing:"2px",textTransform:"uppercase"}}>📐 Module Métreur</div>
        </div>
        <div style={{background:C.card,border:"1px solid "+C.orBord,borderRadius:"16px",padding:"24px"}}>
          <div style={{fontSize:"12px",color:C.muted,marginBottom:"10px",textAlign:"center"}}>Choisissez votre agence</div>
          <select value={agenceChoisie} onChange={e => setAgenceChoisie(e.target.value)} style={{marginBottom:"14px"}}>
            {AGENCES.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
          <button onClick={() => onLogin(agenceChoisie)} style={{width:"100%",padding:"14px",background:C.or,color:"#111",border:"none",borderRadius:"10px",fontSize:"14px",fontWeight:"900",cursor:"pointer"}}>
            Accéder →
          </button>
        </div>
      </div>
    </div>
  );
}
