function FicheMetre({ agenceAccess, ficheInit, onBack }) {
  const [fiche, setFiche] = React.useState(ficheInit.fiche);
  const [ouvertures, setOuvertures] = React.useState(ficheInit.ouvertures || []);
  const [modalOuverture, setModalOuverture] = React.useState(null); // { index } ou { index: -1 } pour ajout
  const [saving, setSaving] = React.useState(false);
  const [sending, setSending] = React.useState(false);
  const [sendingBE, setSendingBE] = React.useState(false);
  const [statutMsg, setStatutMsg] = React.useState("");
  const [toiseOuvert, setToiseOuvert] = React.useState(false);
  const [toiseEcoute, setToiseEcoute] = React.useState(false);
  const [toiseEnCours, setToiseEnCours] = React.useState(false);
  const [toiseDernier, setToiseDernier] = React.useState("");
  const [toiseHistorique, setToiseHistorique] = React.useState([]);
  const [toiseErreur, setToiseErreur] = React.useState("");
  const [toiseTexte, setToiseTexte] = React.useState("");
  const [vueMode, setVueMode] = React.useState("vocal");

  const setF = (k, v) => setFiche(prev => ({ ...prev, [k]: v }));

  const ajouterOuverture = (o) => {
    setOuvertures(prev => modalOuverture.index === -1 ? [...prev, o] : prev.map((x,i) => i===modalOuverture.index ? o : x));
    setModalOuverture(null);
  };
  const supprimerOuverture = (i) => {
    if (!confirm("Supprimer cette ouverture ?")) return;
    setOuvertures(prev => prev.filter((_,idx) => idx!==i));
  };

  // ---- Toise, l'assistante vocale du métreur ----
  const toiseAudioRef = React.useRef(null);
  const VOICE_ID_TOISE = "ErXwobaYiN019PkySvjV";
  const SILENCE_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";

  const debloquerVoixIOS = () => {
    try {
      const a = toiseAudioRef.current;
      if (a) { a.src = SILENCE_WAV; a.play().catch(() => {}); }
    } catch (e) {}
  };

  const parlerToise = async (texte) => {
    try {
      if (!texte) return;
      const r = await fetch('/api/tts', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texte, voice_id: VOICE_ID_TOISE }),
      });
      if (!r.ok) return;
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = toiseAudioRef.current;
      if (a) { a.volume = 1.0; a.src = url; a.play().catch(() => {}); }
    } catch (e) {}
  };

  // Traduit les libelles francais dictes par Toise vers les codes internes
  // du configurateur graphique (memes codes que TYPE_ZONES plus haut).
  const REMPLISSAGE_VERS_CODE = {
    "Fixe": "Fixe",
    "Ouvrant à la française gauche": "OF-G",
    "Ouvrant à la française droite": "OF-D",
    "Oscillo-battant gauche": "OB-G",
    "Oscillo-battant droite": "OB-D",
    "Coulissant": "Coul",
    "Porte gauche": "Porte-G",
    "Porte droite": "Porte-D",
    "Soufflet": "Soufflet",
  };

  const executerActionsToise = (actions) => {
    (actions || []).forEach(a => {
      if (a.name === 'renseigner_fiche') {
        setFiche(prev => ({
          ...prev,
          ...(a.input.client ? { client: a.input.client } : {}),
          ...(a.input.adresse ? { adresse: a.input.adresse } : {}),
          ...(a.input.telephone ? { telephone: a.input.telephone } : {}),
          ...(a.input.numeroDossier ? { numeroDossier: a.input.numeroDossier } : {}),
        }));
      } else if (a.name === 'ajouter_ouverture') {
        const i = a.input;
        const nouvelleOuverture = {
          type: i.type || "",
          pose: i.pose || "",
          largeur: i.largeur || "",
          hauteur: i.hauteur || "",
          couleur: i.couleur || "",
          vitrage: i.vitrage || "",
          note: i.note || "",
          suspect: !!i._suspect,
        };
        // Ensemble composé dicté : traduit meneaux/traverses/zones vers le
        // format attendu par le configurateur graphique existant.
        if (i.type === "Ensemble composé") {
          if (Array.isArray(i.meneaux) && i.meneaux.length) nouvelleOuverture.meneaux = i.meneaux.map(Number);
          if (Array.isArray(i.traverses) && i.traverses.length) nouvelleOuverture.traverses = i.traverses.map(Number);
          if (Array.isArray(i.zones) && i.zones.length) {
            const zonesRempl = {};
            i.zones.forEach(z => {
              const code = REMPLISSAGE_VERS_CODE[z.remplissage] || "Fixe";
              zonesRempl[z.colonne + "-" + z.ligne] = code;
            });
            nouvelleOuverture.zonesRempl = zonesRempl;
          }
        }
        setOuvertures(prev => [...prev, { ...nouvelleOuverture, repere: i.repere || ("P" + (prev.length + 1)) }]);
      } else if (a.name === 'modifier_ouverture') {
        const i = a.input;
        setOuvertures(prev => prev.map(o => {
          if (o.repere !== i.repere) return o;
          const maj = { ...o, suspect: !!i._suspect };
          ['largeur', 'hauteur', 'couleur', 'vitrage', 'type', 'pose', 'note'].forEach(champ => {
            if (i[champ] !== undefined && i[champ] !== null && i[champ] !== "") maj[champ] = i[champ];
          });
          return maj;
        }));
      }
    });
  };

  const [toisePhoto, setToisePhoto] = React.useState(null);

  const [toiseFileAttente, setToiseFileAttente] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('toiseFileAttente') || '[]'); } catch (e) { return []; }
  });
  const [toiseHorsLigne, setToiseHorsLigne] = React.useState(!navigator.onLine);

  const sauvegarderFileAttente = (file) => {
    setToiseFileAttente(file);
    try { localStorage.setItem('toiseFileAttente', JSON.stringify(file)); } catch (e) {}
  };

  React.useEffect(() => {
    const surEnLigne = () => { setToiseHorsLigne(false); resynchroniserToise(); };
    const surHorsLigne = () => setToiseHorsLigne(true);
    window.addEventListener('online', surEnLigne);
    window.addEventListener('offline', surHorsLigne);
    if (navigator.onLine && toiseFileAttente.length) resynchroniserToise();
    return () => {
      window.removeEventListener('online', surEnLigne);
      window.removeEventListener('offline', surHorsLigne);
    };
    // eslint-disable-next-line
  }, []);

  const resynchroniserToise = async () => {
    let file;
    try { file = JSON.parse(localStorage.getItem('toiseFileAttente') || '[]'); } catch (e) { file = []; }
    if (!file.length) return;
    setToiseDernier("Reconnexion... envoi de " + file.length + " mesure(s) en attente.");
    for (let i = 0; i < file.length; i++) {
      try {
        await envoyerToise(file[i].transcript, file[i].imageBase64, true);
        // Succes : on retire cet element precis de la file persistee.
        const restante = file.slice(i + 1);
        sauvegarderFileAttente(restante);
      } catch (e) {
        // Echec (toujours hors ligne, ou erreur reseau) : on arrete la
        // resynchronisation ici, le reste repartira au prochain "online".
        break;
      }
    }
  };

  const envoyerToise = async (transcript, imageBase64, depuisFileAttente) => {
    if (!navigator.onLine && !depuisFileAttente) {
      // Hors ligne : on met de cote plutot que d'echouer silencieusement.
      // Le metreur continue son chantier, tout part des que le reseau revient.
      const item = { transcript, imageBase64, horodatage: Date.now() };
      const nouvelleFile = [...toiseFileAttente, item];
      sauvegarderFileAttente(nouvelleFile);
      setToiseDernier("Hors ligne : mesure mise en attente, elle partira automatiquement dès que le réseau revient.");
      setToisePhoto(null);
      return;
    }
    setToiseEnCours(true);
    setToiseErreur("");
    try {
      const contexteOuvertures = ouvertures.map(o => ({
        repere: o.repere, type: o.type, pose: o.pose, largeur: o.largeur, hauteur: o.hauteur, couleur: o.couleur, vitrage: o.vitrage,
      }));
      const r = await fetch('/api/chat-metreur', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          message: transcript,
          image: imageBase64 || undefined,
          fiche: { client: fiche.client, adresse: fiche.adresse, telephone: fiche.telephone, numeroDossier: fiche.numeroDossier },
          ouvertures: contexteOuvertures,
          historique: toiseHistorique.slice(-6),
        })
      });
      const data = await r.json();
      if (data.erreur) { setToiseErreur(data.erreur); setToiseEnCours(false); return; }
      executerActionsToise(data.actions || []);
      const texte = data.reponse || "C'est noté.";
      setToiseDernier(texte);
      setToiseHistorique(prev => [...prev, { role: 'user', texte: transcript || "(photo)" }, { role: 'assistant', texte }].slice(-8));
      parlerToise(texte);
      // Confirmation visuelle : si une mesure a ete lue sur cette photo, on
      // garde la photo affichee avec la valeur lue en incrustation, pour
      // que le metreur puisse verifier d'un coup d'oeil avant qu'elle ne
      // disparaisse (au lieu de faire confiance a l'oreille seule).
      const actionMesure = (data.actions || []).find(a => (a.name === 'ajouter_ouverture' || a.name === 'modifier_ouverture') && a.input?.largeur && a.input?.hauteur);
      if (imageBase64 && actionMesure) {
        setToisePhotoConfirmee({ dataUrl: imageBase64, largeur: actionMesure.input.largeur, hauteur: actionMesure.input.hauteur, repere: actionMesure.input.repere || "", suspect: !!actionMesure.input._suspect });
        setToisePhoto(null);
      } else {
        setToisePhoto(null);
      }
    } catch (e) {
      if (!navigator.onLine) {
        const item = { transcript, imageBase64, horodatage: Date.now() };
        sauvegarderFileAttente([...toiseFileAttente, item]);
        setToiseDernier("Connexion perdue : mesure mise en attente.");
      } else {
        setToiseErreur("Connexion impossible. Réessayez.");
      }
    }
    setToiseEnCours(false);
  };

  // Analyse rapide de qualite (nettete + luminosite) sur une petite version
  // de l'image, pour avertir avant envoi si la photo risque d'etre
  // illisible (flou, trop sombre, surexposee) plutot que de laisser Toise
  // se planter en silence ou halluciner une mesure.
  const analyserQualitePhoto = (canvas) => {
    const taille = 150;
    const petit = document.createElement('canvas');
    petit.width = taille; petit.height = taille;
    const pctx = petit.getContext('2d');
    pctx.drawImage(canvas, 0, 0, taille, taille);
    const data = pctx.getImageData(0, 0, taille, taille).data;

    const gris = new Float32Array(taille * taille);
    let sommeLum = 0;
    for (let i = 0; i < taille * taille; i++) {
      const l = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
      gris[i] = l;
      sommeLum += l;
    }
    const luminositeMoyenne = sommeLum / (taille * taille);

    let sommeVar = 0, n = 0;
    for (let y = 1; y < taille - 1; y++) {
      for (let x = 1; x < taille - 1; x++) {
        const idx = y * taille + x;
        const lap = 4 * gris[idx] - gris[idx - 1] - gris[idx + 1] - gris[idx - taille] - gris[idx + taille];
        sommeVar += lap * lap;
        n++;
      }
    }
    const nettete = sommeVar / n;

    const alertes = [];
    if (luminositeMoyenne < 45) alertes.push("Photo trop sombre");
    else if (luminositeMoyenne > 235) alertes.push("Photo surexposée");
    if (nettete < 80) alertes.push("Photo floue");
    return { ok: alertes.length === 0, alertes };
  };

  const compresserPhoto = (fichier) => new Promise((resolve, reject) => {
    const img = new Image();
    const lecteurTemp = new FileReader();
    lecteurTemp.onload = () => {
      img.onload = () => {
        // Redimensionne (max 1600px de large) et recompresse en JPEG qualite
        // 0.75 : suffisant pour lire une graduation de metre ruban, tout en
        // restant tres largement sous la limite de requete Vercel (4,5 Mo).
        const echelle = Math.min(1, 1600 / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * echelle);
        canvas.height = Math.round(img.height * echelle);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const qualite = analyserQualitePhoto(canvas);
        resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.75), qualite });
      };
      img.onerror = reject;
      img.src = lecteurTemp.result;
    };
    lecteurTemp.onerror = reject;
    lecteurTemp.readAsDataURL(fichier);
  });

  const [toiseAlerteQualite, setToiseAlerteQualite] = React.useState(null);
  const [toisePhotoEnAttente, setToisePhotoEnAttente] = React.useState(null);
  const [toisePhotoConfirmee, setToisePhotoConfirmee] = React.useState(null);

  const capturerPhotoToise = async (fichier) => {
    if (!fichier) return;
    try {
      const { dataUrl, qualite } = await compresserPhoto(fichier);
      if (!qualite.ok) {
        // Ne bloque pas : previent et laisse le metreur decider (souvent
        // pressé sur chantier, une fausse alerte ne doit pas lui forcer
        // une reprise de photo inutile).
        setToisePhoto(dataUrl);
        setToisePhotoEnAttente({ dataUrl, texte: toiseTexte.trim() });
        setToiseAlerteQualite(qualite.alertes.join(" · "));
        return;
      }
      setToisePhoto(dataUrl);
      debloquerVoixIOS();
      const texteAccompagnant = toiseTexte.trim();
      envoyerToise(texteAccompagnant, dataUrl);
      setToiseTexte("");
    } catch (e) {
      setToiseErreur("Impossible de traiter la photo. Réessayez.");
    }
  };

  const lancerEcouteToise = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      const champ = document.getElementById('toiseChampTexte');
      if (champ) champ.focus();
      return;
    }
    const reco = new SR();
    reco.lang = 'fr-FR';
    reco.continuous = false;
    reco.interimResults = false;
    reco.onstart = () => { setToiseEcoute(true); setToiseErreur(""); };
    reco.onerror = (e) => {
      setToiseEcoute(false);
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        setToiseErreur("Micro refusé par le navigateur. Appuyez sur l'icône micro barrée à côté de l'adresse du site pour l'autoriser, puis réessayez.");
      } else if (e.error === 'no-speech') {
        setToiseErreur("Aucune voix détectée. Réessayez en parlant juste après avoir appuyé sur le micro.");
      } else if (e.error === 'audio-capture') {
        setToiseErreur("Aucun micro détecté sur cet appareil.");
      } else {
        setToiseErreur("Problème micro (" + e.error + "). Utilisez le champ texte en attendant.");
      }
    };
    reco.onend = () => setToiseEcoute(false);
    reco.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      setToiseDernier(transcript);
      envoyerToise(transcript);
    };
    reco.start();
  };

  // Enregistre la fiche (+ ouvertures pas encore synchronisées) dans Airtable.
  const sauvegarder = async (statutFinal) => {
    setSaving(true);
    try {
      let ficheId = fiche.airtableId;
      const ficheFields = {
        "Name": fiche.numero,
        "N° dossier": fiche.numeroDossier,
        "Client": fiche.client,
        "Adresse": fiche.adresse,
        "Téléphone": fiche.telephone,
        "Agence": fiche.agence,
        "Métreur": fiche.metreur,
        "Date métrage": fiche.date,
        "Note générale": fiche.noteGenerale,
        "Statut": statutFinal || "Brouillon",
      };
      if (statutFinal === "Envoyé à l'atelier") {
        ficheFields["Envoyé le"] = new Date().toISOString();
      }
      if (!ficheId) {
        const resp = await fetch('/api/airtable/' + encodeURIComponent(TABLE_METRES), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: ficheFields })
        });
        const data = await resp.json();
        ficheId = data.id;
        setFiche(prev => ({ ...prev, airtableId: ficheId }));
      } else {
        await fetch('/api/airtable/' + encodeURIComponent(TABLE_METRES) + '/' + ficheId, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: ficheFields })
        });
      }

      const nouvellesOuvertures = [...ouvertures];
      for (let i = 0; i < nouvellesOuvertures.length; i++) {
        const o = nouvellesOuvertures[i];
        const ouvertureFields = {
          "Repère": o.repere, "Métré": [ficheId], "Type": o.type, "Matériau": o.materiau,
          "Largeur mm": Number(o.largeur) || null, "Hauteur mm": Number(o.hauteur) || null,
          "Couleur / RAL": o.couleur, "Vitrage": o.vitrage, "Options": o.options, "Note": o.note,
          "Traverses (mm)": (o.traverses || []).filter(Boolean).join(", "),
          "Meneaux (mm)": (o.meneaux || []).filter(Boolean).join(", "),
          "Pose": o.pose || null,
          "Configurateur JSON": JSON.stringify(descripteurConfig(o)),
          "Options standard": o.optionsStandard || [],
          "Dormant": o.dormant || null,
          "Couleur intérieure": o.couleurInt || "", "Couleur extérieure": o.couleurExt || "",
          "Quantité": Number(o.quantite) || null,
          "Serrure": o.serrure || null, "Cylindre sécu": o.cylindreSecu || [], "Patte fixation neuf": o.patteFixationNeuf || null,
          "Dormant traverse Haut": o.dormantTrHaut || "", "Dormant traverse Bas": o.dormantTrBas || "",
          "Dormant montant Gauche": o.dormantMtGauche || "", "Dormant montant Droit": o.dormantMtDroit || "",
          "Hauteur poignée": Number(o.hauteurPoignee) || null, "Axe meneaux": o.axeMeneaux || "",
          "Appui seuil balai": o.appuiSeuilBalai || "", "Réf. 4319": o.ref4319 || null, "Calage dormant / habillage": o.calageDormantHabillage || "",
          "Petit bois": o.petitBois || "", "Remplissage bas": o.remplBas || null,
          "Ventilation": o.ventilation || null, "Type volet": o.typeVolet || null,
          "Délignage ailes intérieur": o.delignageInt || null, "Délignage ailes extérieur": o.delignageExt || null,
          "Tapée": o.tapee || null, "Plat - coupe intérieure": o.platCoupe || null, "Plat - dimensions": o.platDimensions || "",
          "Cornière": o.corniere || "", "Cornière appui seuil": o.corniereAppuiSeuil || "",
        };
        if (o.airtableId) {
          await fetch('/api/airtable/' + encodeURIComponent(TABLE_OUVERTURES) + '/' + o.airtableId, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fields: ouvertureFields })
          });
        } else {
          const resp = await fetch('/api/airtable/' + encodeURIComponent(TABLE_OUVERTURES), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fields: ouvertureFields })
          });
          const data = await resp.json();
          nouvellesOuvertures[i] = { ...o, airtableId: data.id };
        }
      }
      setOuvertures(nouvellesOuvertures);
      return ficheId;
    } finally {
      setSaving(false);
    }
  };

  const enregistrerBrouillon = async () => {
    await sauvegarder("Brouillon");
    setStatutMsg("✅ Brouillon enregistré.");
    setTimeout(() => setStatutMsg(""), 2500);
  };

  const envoyerAtelier = async () => {
    if (ouvertures.length === 0) { alert("Ajoute au moins une ouverture avant l'envoi."); return; }
    setSending(true);
    try {
      await sauvegarder("Envoyé à l'atelier");
      // Schémas PNG du configurateur pour chaque ouverture cotée
      let schemas = [];
      try {
        schemas = await Promise.all(
          ouvertures.filter(o => o.largeur && o.hauteur).map(async (o) => {
            const g = geomSchema(o, 440, 380);
            const png = await svgVersPng(buildSchemaSvgString(o, true, 440, 380), g.svgW, g.svgH);
            return { repere: o.repere || o.type, png };
          })
        );
      } catch (e) { schemas = []; }
      await fetch(WEBHOOK, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'metreur_envoye',
          fiche: fiche.numero, nom: fiche.client, adresse: fiche.adresse, agence: fiche.agence,
          metreur: fiche.metreur, dateMetrage: fiche.date,
          ouverturesHtml: buildOuverturesHtml(ouvertures),
          schemas: schemas,
        })
      });
      setStatutMsg("✅ Fiche envoyée à l'atelier par email.");
    } catch (e) {
      setStatutMsg("⚠️ Erreur lors de l'envoi.");
    } finally {
      setSending(false);
      setTimeout(() => setStatutMsg(""), 4000);
    }
  };

  // Envoie le résumé synthétique au BE par email. Réutilise le même webhook
  // Make que l'envoi atelier, avec une action distincte ('resume_be_envoye')
  // pour permettre de brancher un routage différent côté scénario Make.
  // ⚠️ L'adresse email du BE destinataire doit être configurée côté Make —
  // ce code envoie la donnée, pas la destination finale.
  const envoyerResumeBE = async () => {
    if (ouvertures.length === 0) { alert("Ajoute au moins une ouverture avant l'envoi."); return; }
    setSendingBE(true);
    try {
      await sauvegarder(fiche.statut || "Brouillon");
      let schemas = [];
      try {
        schemas = await Promise.all(
          ouvertures.filter(o => o.largeur && o.hauteur).map(async (o) => {
            const g = geomSchema(o, 300, 220);
            const png = await svgVersPng(buildSchemaSvgString(o, true, 300, 220), g.svgW, g.svgH);
            return { repere: o.repere || o.type, png };
          })
        );
      } catch (e) { schemas = []; }
      await fetch(WEBHOOK, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'resume_be_envoye',
          fiche: fiche.numero, numeroDossier: fiche.numeroDossier, nom: fiche.client, adresse: fiche.adresse, agence: fiche.agence,
          metreur: fiche.metreur, dateMetrage: fiche.date,
          resumeHtml: htmlResumeBE(ouvertures),
          schemas: schemas,
        })
      });
      setStatutMsg("✅ Résumé envoyé au BE par email.");
    } catch (e) {
      setStatutMsg("⚠️ Erreur lors de l'envoi au BE.");
    } finally {
      setSendingBE(false);
      setTimeout(() => setStatutMsg(""), 4000);
    }
  };

  const valideFiche = fiche.client.trim() && fiche.adresse.trim();

  if (vueMode === "vocal") {
    return (
      <div style={{position:"fixed",inset:0,background:"#0D0D0D",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:100}}>
        <audio ref={toiseAudioRef} style={{display:"none"}}/>
        <div style={{position:"absolute",top:"20px",left:"50%",transform:"translateX(-50%)",color:"#8a8a8a",fontSize:"12px",letterSpacing:"2px",textTransform:"uppercase"}}>
          {fiche.client ? fiche.client : "Nouvelle fiche"}
        </div>
        <div style={{width:"220px",height:"220px",borderRadius:"50%",
          background:"radial-gradient(circle at 35% 30%, #E8D4B0, #C9A876 55%, #8a6d1f 100%)",
          boxShadow:"0 0 90px rgba(255,107,0,0.3)",
          animation: toiseEcoute ? "pulseToiseEcran 1s ease-in-out infinite" : "respireToise 3.2s ease-in-out infinite"}}/>
        <div style={{marginTop:"32px",color:"#b8b8b8",fontSize:"14px",maxWidth:"340px",textAlign:"center",minHeight:"40px",lineHeight:"1.5"}}>
          {toiseEcoute ? "Je vous écoute..." : toiseEnCours ? "..." : toiseDernier ? toiseDernier : "Dictez à Toise : \"Fenêtre P1, 120 par 100, blanc, double vitrage\"..."}
        </div>
        {toisePhotoConfirmee && (
          <div style={{marginTop:"14px",width:"90%",maxWidth:"320px",position:"relative",borderRadius:"14px",overflow:"hidden",border:"2px solid "+(toisePhotoConfirmee.suspect?"#DC2626":"#C9A876")}}>
            <img src={toisePhotoConfirmee.dataUrl} style={{width:"100%",display:"block"}} alt="Mesure"/>
            <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,rgba(0,0,0,0.85))",padding:"20px 12px 10px",display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
              <div>
                {toisePhotoConfirmee.repere && <div style={{color:"#C9A876",fontSize:"10px",fontWeight:"800"}}>{toisePhotoConfirmee.repere}</div>}
                <div style={{color:"#fff",fontSize:"16px",fontWeight:"900"}}>{toisePhotoConfirmee.largeur} × {toisePhotoConfirmee.hauteur} mm</div>
              </div>
              {toisePhotoConfirmee.suspect && <div style={{color:"#DC2626",fontSize:"10px",fontWeight:"800"}}>⚠️ à vérifier</div>}
            </div>
            <button onClick={() => setToisePhotoConfirmee(null)}
              style={{position:"absolute",top:8,right:8,width:"26px",height:"26px",borderRadius:"50%",background:"rgba(0,0,0,0.6)",border:"none",color:"#fff",fontSize:"13px",cursor:"pointer"}}>✕</button>
          </div>
        )}
        {(toiseHorsLigne || toiseFileAttente.length > 0) && (
          <div style={{marginTop:"10px",display:"flex",alignItems:"center",gap:"6px",background:toiseHorsLigne?"rgba(220,38,38,0.12)":"rgba(255,107,0,0.12)",border:"1px solid "+(toiseHorsLigne?"rgba(220,38,38,0.35)":"rgba(255,107,0,0.35)"),borderRadius:"20px",padding:"5px 12px",fontSize:"11px",fontWeight:"700",color:toiseHorsLigne?"#DC2626":"#FF6B00"}}>
            {toiseHorsLigne ? "📡 Hors ligne" : "🔄 Synchronisation"}
            {toiseFileAttente.length > 0 ? " · " + toiseFileAttente.length + " en attente" : ""}
          </div>
        )}
        {toiseErreur && <div style={{color:"#DC2626",fontSize:"12px",marginTop:"10px"}}>{toiseErreur}</div>}
        {toiseAlerteQualite && (
          <div style={{marginTop:"12px",width:"90%",maxWidth:"380px",background:"rgba(220,38,38,0.1)",border:"1px solid rgba(220,38,38,0.35)",borderRadius:"10px",padding:"10px 14px"}}>
            <div style={{color:"#DC2626",fontSize:"12px",fontWeight:"700"}}>⚠️ {toiseAlerteQualite}</div>
            <div style={{color:"#999",fontSize:"11px",marginTop:"2px"}}>La lecture de la mesure risque d'être imprécise.</div>
            <div style={{display:"flex",gap:"8px",marginTop:"8px"}}>
              <button onClick={() => {
                setToiseAlerteQualite(null);
                debloquerVoixIOS();
                if (toisePhotoEnAttente) envoyerToise(toisePhotoEnAttente.texte, toisePhotoEnAttente.dataUrl);

// ---- LISTE DES FICHES ----
function Metreur({ agenceAccess, onClose }) {
  const [fiches, setFiches] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [ouverte, setOuverte] = React.useState(null); // { fiche, ouvertures } ou null

  const charger = async () => {
    setLoading(true);
    try {
      const filtre = agenceAccess !== "global" ? '?filterByFormula=' + encodeURIComponent('{Agence}="' + agenceAccess + '"') + '&sort[0][field]=Date métrage&sort[0][direction]=desc' : '?sort[0][field]=Date métrage&sort[0][direction]=desc';
      const resp = await fetch('/api/airtable/' + encodeURIComponent(TABLE_METRES) + filtre);
      const data = await resp.json();
      setFiches(data.records || []);
    } catch (e) { console.error(e); }
    setLoading(false);
  };
  React.useEffect(() => { charger(); }, [agenceAccess]);

  const nouvelleFiche = () => {
    setOuverte({
      fiche: {
        numero: genererNumero(), numeroDossier: "", client: "", adresse: "", telephone: "",
        agence: agenceAccess !== "global" ? agenceAccess : AGENCES[0],
        metreur: "", date: new Date().toISOString().split('T')[0], noteGenerale: "", airtableId: null, statut: "Brouillon",
      },
      ouvertures: [],
    });
  };

  const ouvrirFiche = async (record) => {
    setLoading(true);
    try {
      const formula = encodeURIComponent('FIND("' + record.fields.Name + '", ARRAYJOIN({Métré}))');
      const resp = await fetch('/api/airtable/' + encodeURIComponent(TABLE_OUVERTURES) + '?filterByFormula=' + formula);
      const data = await resp.json();
      const ouvertures = (data.records || []).map(r => {
        let zonesRempl = {}, cCouleur = {}, cHp = {}, cVitrage = {}, cPb = {}, cMc = {}, cOs = {}, cPa = "", cTc = {};
        try {
          const cj = JSON.parse(r.fields["Configurateur JSON"] || "{}");
          zonesRempl = cj.zonesRempl || {};
          cCouleur = cj.couleur || {};
          cHp = cj.hauteursPoignee || {};
          cVitrage = cj.zonesVitrage || {};
          cPb = cj.zonesPetitBois || {};
          cMc = cj.meneauxCoupures || {};
          cOs = cj.ouvrantsSecondaires || {};
          cPa = cj.pieceAppui || "";
          cTc = cj.traversesCoupures || {};
        } catch (e) { zonesRempl = {}; cCouleur = {}; cHp = {}; cVitrage = {}; cPb = {}; cMc = {}; cOs = {}; cPa = ""; cTc = {}; }
        return {
          airtableId: r.id, repere: r.fields["Repère"] || "", type: r.fields["Type"] || "OB1", materiau: r.fields["Matériau"] || "PVC",
          pose: r.fields["Pose"] || "",
          largeur: r.fields["Largeur mm"] || "", hauteur: r.fields["Hauteur mm"] || "", couleur: r.fields["Couleur / RAL"] || "",
          teintePvc: cCouleur.teintePvc || "", capotAlu: !!cCouleur.capotAlu, ralCapot: cCouleur.ralCapot || "", finitionCapot: cCouleur.finitionCapot || "",
          ralAlu: cCouleur.ralAlu || "", finitionAlu: cCouleur.finitionAlu || "",
          vitrage: r.fields["Vitrage"] || "", options: r.fields["Options"] || "", note: r.fields["Note"] || "",
          traverses: (r.fields["Traverses (mm)"] || "").split(",").map(s => s.trim()).filter(Boolean),
          meneaux: (r.fields["Meneaux (mm)"] || "").split(",").map(s => s.trim()).filter(Boolean),
          zonesRempl: zonesRempl,
          hauteursPoignee: cHp,
          zonesVitrage: cVitrage,
          zonesPetitBois: cPb,
          meneauxCoupures: cMc,
          ouvrantsSecondaires: cOs,
          pieceAppui: cPa,
          traversesCoupures: cTc,
          optionsStandard: r.fields["Options standard"] || [],
          dormant: r.fields["Dormant"] || "",
          couleurInt: r.fields["Couleur intérieure"] || "", couleurExt: r.fields["Couleur extérieure"] || "",
          quantite: r.fields["Quantité"] || "",
          serrure: r.fields["Serrure"] || "", cylindreSecu: r.fields["Cylindre sécu"] || [], patteFixationNeuf: r.fields["Patte fixation neuf"] || "",
          dormantTrHaut: r.fields["Dormant traverse Haut"] || "", dormantTrBas: r.fields["Dormant traverse Bas"] || "",
          dormantMtGauche: r.fields["Dormant montant Gauche"] || "", dormantMtDroit: r.fields["Dormant montant Droit"] || "",
          hauteurPoignee: r.fields["Hauteur poignée"] || "", axeMeneaux: r.fields["Axe meneaux"] || "",
          appuiSeuilBalai: r.fields["Appui seuil balai"] || "", ref4319: r.fields["Réf. 4319"] || "", calageDormantHabillage: r.fields["Calage dormant / habillage"] || "",
          petitBois: r.fields["Petit bois"] || "", remplBas: r.fields["Remplissage bas"] || "",
          ventilation: r.fields["Ventilation"] || "", typeVolet: r.fields["Type volet"] || "",
          delignageInt: r.fields["Délignage ailes intérieur"] || "", delignageExt: r.fields["Délignage ailes extérieur"] || "",
          tapee: r.fields["Tapée"] || "", platCoupe: r.fields["Plat - coupe intérieure"] || "", platDimensions: r.fields["Plat - dimensions"] || "",
          corniere: r.fields["Cornière"] || "", corniereAppuiSeuil: r.fields["Cornière appui seuil"] || "",
        };
      });
      setOuverte({
        fiche: {
          numero: record.fields.Name, numeroDossier: record.fields["N° dossier"] || "", client: record.fields.Client || "", adresse: record.fields.Adresse || "",
          telephone: record.fields["Téléphone"] || "", agence: record.fields.Agence || AGENCES[0],
          metreur: record.fields["Métreur"] || "", date: record.fields["Date métrage"] || "",
          noteGenerale: record.fields["Note générale"] || "", airtableId: record.id, statut: record.fields.Statut || "Brouillon",
        },
        ouvertures,
      });
    } catch (e) { console.error(e); }
    setLoading(false);
  };

  if (ouverte) {
    return (
      <div style={{minHeight:"100vh",background:C.bg}}>
        <Header agenceAccess={agenceAccess} onClose={onClose}/>
        <FicheMetre agenceAccess={agenceAccess} ficheInit={ouverte} onBack={() => { setOuverte(null); charger(); }}/>
      </div>
    );
  }

  return (
    <div style={{minHeight:"100vh",background:C.bg}}>
      <Header agenceAccess={agenceAccess} onClose={onClose}/>
      <div style={{maxWidth:"760px",margin:"0 auto",padding:"20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}>
          <h2 style={{fontSize:"15px",color:C.white,fontWeight:"900"}}>📐 Fiches métré</h2>
          <button onClick={nouvelleFiche} style={{background:C.or,color:"#111",border:"none",borderRadius:"8px",padding:"10px 18px",fontSize:"12px",fontWeight:"900",cursor:"pointer"}}>
            + Nouvelle fiche
          </button>
        </div>
        {loading && <div style={{textAlign:"center",color:C.muted,fontSize:"12px",padding:"30px"}}>Chargement...</div>}
        {!loading && fiches.length === 0 && (
          <div style={{textAlign:"center",color:C.muted,fontSize:"12px",padding:"30px",background:C.card,border:"1px dashed "+C.border,borderRadius:"12px"}}>
            Aucune fiche pour l'instant. Clique sur "+ Nouvelle fiche" pour commencer.
          </div>
        )}
        <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
          {fiches.map(f => (
            <div key={f.id} onClick={() => ouvrirFiche(f)} style={{background:C.card,border:"1px solid "+C.border,borderRadius:"10px",padding:"12px 16px",display:"flex",alignItems:"center",gap:"12px",cursor:"pointer"}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"3px"}}>
                  <span style={{fontSize:"12px",fontWeight:"900",color:C.or,fontFamily:"monospace"}}>{f.fields.Name}</span>
                  <span style={{fontSize:"10px",fontWeight:"800",padding:"2px 8px",borderRadius:"20px",background:f.fields.Statut==="Envoyé à l'atelier"?C.vertDim:C.orDim,color:f.fields.Statut==="Envoyé à l'atelier"?C.vert:"#8a6d1f"}}>{f.fields.Statut||"Brouillon"}</span>
                </div>
                <div style={{fontSize:"12px",color:C.text}}>{f.fields.Client} — {f.fields.Adresse}</div>
                <div style={{fontSize:"10px",color:C.muted}}>{f.fields.Agence} · {f.fields["Date métrage"]}{f.fields["N° dossier"] ? " · Dossier " + f.fields["N° dossier"] : ""}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Header({ agenceAccess, onClose }) {
  return (
    <div style={{background:C.card,borderBottom:"1px solid "+C.border,padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
      <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
        <div style={{width:"96px",height:"46px",background:"#FFFFFF",borderRadius:"8px",display:"flex",alignItems:"center",justifyContent:"center",padding:"3px",boxSizing:"border-box"}}>
          <span style={{fontSize:"13px",fontWeight:"900",color:"#111111",letterSpacing:"0.5px"}}>RSIA IKO</span>
        </div>
        <div style={{fontSize:"13px",fontWeight:"700",color:C.muted}}>Module Métreur {agenceAccess !== "global" ? "— " + agenceAccess : ""}</div>
      </div>
      <button onClick={onClose} title="Fermer la session" style={{background:"rgba(220,38,38,0.08)",border:"1px solid rgba(220,38,38,0.25)",color:"rgba(220,38,38,0.85)",borderRadius:"8px",width:"30px",height:"30px",cursor:"pointer",fontSize:"14px",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
    </div>
  );
}

function App() {
  const [access, setAccess] = React.useState(null);
  const deconnecter = async () => {
    try {
      await fetch('/api/verif-securite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'logout' }),
      });
    } catch (e) {
      // Meme en cas d'erreur reseau, on redirige quand meme : mieux vaut
      // renvoyer vers l'ecran de connexion que de laisser un etat incertain.
    }
    window.location.href = "/auth-login.html";
  };
  return access ? <Metreur agenceAccess={access} onClose={deconnecter}/> : <Login onLogin={setAccess}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
