  var _fetch = window.fetch;
  window.fetch = function(url, opts) {

      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers || {}, { "X-App-Secret": APP_SECRET });

})();

const F = { marine: "#0D0D0D", or: "#FF6B00", blanc: "#FFFFFF", grisBord: "#E5E5E5" };

function App() {
  const [statutPage, setStatutPage] = React.useState("chargement");
  const [ticket, setTicket] = React.useState(null);
  const [note, setNote] = React.useState(0);
  const [noteHover, setNoteHover] = React.useState(0);
  const [commentaire, setCommentaire] = React.useState("");
  const [saving, setSaving] = React.useState(false);
  const [lienGoogle, setLienGoogle] = React.useState("");

  const token = new URLSearchParams(window.location.search).get('token');

  const charger = async () => {
    if (!token) { setStatutPage("introuvable"); return; }
    try {
      const f = encodeURIComponent('{Note Token}="' + token + '"');
      const url = '/api/airtable/Tickets%20SAV?filterByFormula=' + f + '&maxRecords=1';
      const r = await fetch(url);
      const json = await r.json();
      if (!json.records || json.records.length === 0) { setStatutPage("introuvable"); return; }
      const t = json.records[0];
      const compteClientIdAvis = (t.fields?.["Compte client"] || [])[0];
      if (compteClientIdAvis) {
        try {
          const respClient = await fetch('/api/airtable/Clients/' + compteClientIdAvis);
          const dataClient = await respClient.json();
          if (dataClient?.fields?.["Accès bloqué"] === true) { setStatutPage("bloque"); return; }
          if (/^https?:\/\//.test(dataClient?.fields?.["Lien avis Google"] || "")) setLienGoogle(dataClient.fields["Lien avis Google"]);
        } catch (e) {}
      }
      setTicket(t);
      if (typeof t.fields?.Note === "number") { setStatutPage("deja_note"); }
      else { setStatutPage("attente"); }
    } catch(e) { setStatutPage("introuvable"); }
  };

  React.useEffect(() => { charger(); }, []);

  const envoyer = async () => {
    if (note === 0) return;
    setSaving(true);
    try {
      await fetch('/api/airtable/Tickets%20SAV/' + ticket.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Note: note, "Note Commentaire": commentaire } })
      });
      setStatutPage("termine");
    } catch(e) { console.error(e); }
    setSaving(false);
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",padding:"24px 16px"}}>
      <div style={{width:"100%",maxWidth:"440px"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:"28px"}}>
          <img src={IKO_LOGO} alt="Iko" style={{width:"200px",height:"auto"}}/>
        </div>

        {statutPage === "chargement" && (
          <div style={{textAlign:"center",padding:"40px 0",color:"#64748B"}}>⏳ Chargement...</div>
        )}

        {statutPage === "introuvable" && (
          <div style={{background:F.blanc,borderRadius:"14px",padding:"28px",textAlign:"center",border:"1px solid "+F.grisBord}}>
            <div style={{fontSize:"36px",marginBottom:"10px"}}>🔍</div>
            <div style={{fontSize:"15px",fontWeight:"700",color:F.marine,marginBottom:"6px"}}>Lien invalide</div>
            <div style={{fontSize:"13px",color:"#64748B"}}>Ce lien de notation n'est plus valide ou a expiré.</div>
          </div>
        )}

        {statutPage === "bloque" && (
          <div style={{background:F.blanc,borderRadius:"14px",padding:"28px",textAlign:"center",border:"1px solid "+F.grisBord}}>
            <div style={{fontSize:"36px",marginBottom:"10px"}}>🔒</div>
            <div style={{fontSize:"15px",fontWeight:"700",color:F.marine,marginBottom:"6px"}}>Service temporairement suspendu</div>
            <div style={{fontSize:"13px",color:"#64748B"}}>Merci de contacter votre interlocuteur pour régulariser la situation.</div>
          </div>
        )}

        {statutPage === "attente" && ticket && (
          <div style={{background:F.blanc,borderRadius:"14px",padding:"28px",border:"1px solid "+F.grisBord}}>
            <div style={{textAlign:"center",marginBottom:"20px"}}>
              <div style={{fontSize:"16px",fontWeight:"900",color:F.marine,marginBottom:"6px"}}>Votre avis compte pour nous !</div>
              <div style={{fontSize:"13px",color:"#64748B"}}>Comment s'est passée votre intervention SAV ?</div>
              <div style={{fontSize:"11px",color:"#94A3B8",marginTop:"6px"}}>{ticket.fields?.Produit} — {ticket.fields?.Problème}</div>
            </div>

            <div style={{display:"flex",justifyContent:"center",gap:"6px",marginBottom:"22px"}}>
              {[1,2,3,4,5].map(n => (
                <button key={n} onClick={() => setNote(n)}
                  onMouseEnter={() => setNoteHover(n)} onMouseLeave={() => setNoteHover(0)}
                  style={{background:"none",border:"none",cursor:"pointer",fontSize:"38px",padding:"2px",lineHeight:1}}>
                  {(noteHover || note) >= n ? "⭐" : "☆"}
                </button>
              ))}
            </div>

            <label style={{fontSize:"11px",fontWeight:"700",color:"#64748B",display:"block",marginBottom:"6px"}}>Un commentaire ? (facultatif)</label>
            <textarea rows={3} placeholder="Ex : Technicien ponctuel et efficace..." value={commentaire} onChange={e => setCommentaire(e.target.value)} style={{resize:"none",marginBottom:"18px"}}/>

            <button onClick={envoyer} disabled={saving || note === 0}
              style={{width:"100%",padding:"14px",background:saving||note===0?"#D1D5DB":F.or,color:"#111",border:"none",borderRadius:"10px",fontSize:"14px",fontWeight:"900",cursor:saving||note===0?"not-allowed":"pointer"}}>
              {saving ? "⏳ Envoi..." : "Envoyer mon avis"}
            </button>
          </div>
        )}

        {statutPage === "termine" && (
          <div style={{background:F.blanc,borderRadius:"14px",padding:"28px",textAlign:"center",border:"1px solid "+F.grisBord}}>
            <div style={{fontSize:"40px",marginBottom:"10px"}}>🙏</div>
            <div style={{fontSize:"16px",fontWeight:"900",color:F.marine,marginBottom:"6px"}}>Merci pour votre avis !</div>
            <div style={{fontSize:"13px",color:"#64748B"}}>Il nous aide à améliorer notre service.</div>
            {note >= 4 && lienGoogle && (
              <div style={{marginTop:"18px"}}>
                <div style={{fontSize:"13px",color:F.marine,fontWeight:"700",marginBottom:"10px"}}>Content de notre intervention ? Un avis Google nous aiderait beaucoup :</div>
                <a href={lienGoogle} target="_blank" rel="noopener noreferrer"
                  style={{display:"block",textDecoration:"none",padding:"14px",background:F.or,color:"#fff",borderRadius:"10px",fontSize:"14px",fontWeight:"900"}}>⭐ Laisser un avis sur Google</a>
              </div>
            )}
            {note <= 2 && (
              <div style={{marginTop:"16px",fontSize:"13px",color:F.marine,fontWeight:"700"}}>Nous sommes désolés. Notre équipe va vous recontacter rapidement pour trouver une solution.</div>
            )}
          </div>
        )}

        {statutPage === "deja_note" && ticket && (
          <div style={{background:F.blanc,borderRadius:"14px",padding:"28px",textAlign:"center",border:"1px solid "+F.grisBord}}>
            <div style={{fontSize:"40px",marginBottom:"10px"}}>✅</div>
            <div style={{fontSize:"16px",fontWeight:"900",color:F.marine,marginBottom:"10px"}}>Vous avez déjà noté cette intervention</div>
            <div style={{fontSize:"28px",marginBottom:"6px"}}>{"⭐".repeat(ticket.fields.Note)}{"☆".repeat(5-ticket.fields.Note)}</div>
            <div style={{fontSize:"13px",color:"#64748B"}}>Merci pour votre retour !</div>
          </div>
        )}

        <div style={{textAlign:"center",marginTop:"24px",fontSize:"10px",color:"#94A3B8"}}>© Iko Suite — Solutions IA pour les PME du bâtiment</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
