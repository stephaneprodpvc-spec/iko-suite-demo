<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Iko Suite — Connexion (test isolé)</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/primitives.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--iko-bg); font-family: var(--iko-font);
  }
  .carte {
    width: 100%; max-width: 360px; background: var(--iko-surface);
    backdrop-filter: var(--iko-blur); -webkit-backdrop-filter: var(--iko-blur);
    border: 1px solid var(--iko-border); border-radius: var(--iko-radius-lg);
    box-shadow: var(--iko-shadow-card); padding: var(--iko-space-6) var(--iko-space-5);
  }
  h1 { font-size: var(--iko-text-sm); text-transform: uppercase; letter-spacing: 2px; color: var(--iko-text-secondary); text-align: center; margin: 0 0 var(--iko-space-5); }
  input {
    width: 100%; min-height: var(--iko-touch-min); padding: 0 var(--iko-space-3); margin-bottom: var(--iko-space-3);
    background: rgba(255,255,255,0.04); border: 1px solid var(--iko-border);
    border-radius: var(--iko-radius-md); color: var(--iko-text); font-size: 16px;
  }
  input::placeholder { color: var(--iko-text-tertiary); }
  input:focus { outline: none; border-color: var(--iko-accent); box-shadow: var(--iko-shadow-focus); }
  button {
    width: 100%; min-height: var(--iko-touch-min); border: 1px solid transparent; font-family: var(--iko-font);
    border-radius: var(--iko-radius-md); font-weight: 800; font-size: var(--iko-text-sm); cursor: pointer; margin-top: var(--iko-space-2);
  }
  .btn-primary { background: var(--iko-accent); color: var(--iko-text-on-accent); }
  .btn-secondary { background: var(--iko-surface); border-color: var(--iko-border); color: var(--iko-text); }
  .btn-danger { background: transparent; border-color: var(--iko-border); color: var(--iko-danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { min-height: 18px; font-size: var(--iko-text-xs); color: var(--iko-danger); text-align: center; margin-top: var(--iko-space-2); }
  .etat { font-size: var(--iko-text-xs); color: var(--iko-success); text-align: center; margin-top: var(--iko-space-4); white-space: pre-wrap; }
  .note { font-size: 10px; color: var(--iko-text-tertiary); text-align: center; margin-top: var(--iko-space-5); line-height: 1.5; }
</style>
</head>
<body>
  <div class="carte">
    <h1>Iko Suite — Test Auth (isolé)</h1>
    <input id="identifiant" type="email" placeholder="Identifiant (email)" autocomplete="username" />
    <input id="motDePasse" type="password" placeholder="Mot de passe" autocomplete="current-password" />
    <button id="btnLogin" class="btn-primary">Se connecter</button>
    <button id="btnSession" class="btn-secondary">Vérifier la session</button>
    <button id="btnLogout" class="btn-danger">Se déconnecter</button>
    <div class="msg" id="msg"></div>
    <div class="etat" id="etat"></div>
    <div class="note">
      Page isolée de test — non reliée à admin.html / dashboard.html / technicien.html.
      Nécessite la table Airtable "Utilisateurs" (à créer par Stéphane) pour fonctionner
      contre de vraies données.
    </div>
  </div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg'), etat = $('etat');

  function afficherMsg(texte) { msg.textContent = texte || ''; }
  function afficherEtat(obj) { etat.textContent = obj ? JSON.stringify(obj, null, 2) : ''; }

  // Protection anti "open redirect" : n'accepte qu'un chemin local relatif,
  // commencant par un seul "/", vers un fichier .html connu de l'app, sans
  // schema ("http://", "https://", "javascript:"...) ni "//" (qui serait
  // interprete comme une redirection vers un autre domaine), ni "\".
  function retourSurEstSur(valeur) {
    if (!valeur || valeur.length > 200) return false;
    if (valeur.indexOf('\\') !== -1) return false;
    if (valeur.slice(0, 2) === '//') return false;
    return /^\/[A-Za-z0-9_\-\/]*\.html(\?[A-Za-z0-9_\-=&%.]*)?$/.test(valeur);
  }

  function retourDemande() {
    var brut = new URLSearchParams(window.location.search).get('retour');
    return retourSurEstSur(brut) ? brut : null;
  }

  async function appel(action, methode) {
    var opts = { method: methode, headers: { 'Content-Type': 'application/json' } };
    var url = '/api/verif-securite';
    if (methode === 'POST') {
      opts.body = JSON.stringify({ action: action, identifiant: $('identifiant').value, motDePasse: $('motDePasse').value });
    } else {
      url += '?action=' + action;
    }
    var r = await fetch(url, opts);
    var json = await r.json().catch(function () { return {}; });
    return { status: r.status, json: json };
  }

  $('btnLogin').addEventListener('click', async function () {
    afficherMsg(''); afficherEtat(null);
    var res = await appel('login', 'POST');
    if (res.status === 200) {
      var retour = retourDemande();
      if (retour) {
        afficherEtat(Object.assign({}, res.json, { redirection: retour }));
        window.location.href = retour;
        return;
      }
      afficherEtat(res.json);
    }
    else { afficherMsg(res.json.erreur || 'Erreur.'); }
  });

  $('btnSession').addEventListener('click', async function () {
    afficherMsg(''); afficherEtat(null);
    var res = await appel('session', 'GET');
    if (res.status === 200) { afficherEtat(res.json); }
    else { afficherMsg(res.json.erreur || 'Session invalide.'); }
  });

  $('btnLogout').addEventListener('click', async function () {
    afficherMsg(''); afficherEtat(null);
    var res = await appel('logout', 'POST');
    afficherEtat(res.json);
  });
})();
</script>
</body>
</html>
