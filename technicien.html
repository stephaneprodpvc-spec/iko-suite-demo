// Ajoute un secret partage sur tous les appels au proxy Airtable, pour
// empecher un acces direct a l'API sans passer par cette page (voir
// api/airtable-proxy.js pour le detail et les limites de cette protection).
(function() {
  var APP_SECRET = "97960bb3f41d75c71ba3e831a7acb90ab324549734e27d6a";
  var _fetch = window.fetch;
  window.fetch = function(url, opts) {
    if (typeof url === "string" && url.indexOf("/api/airtable") === 0) {
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers || {}, { "X-App-Secret": APP_SECRET });
    }
    return _fetch(url, opts);
  };
})();

window.IKO_CLIENT_ID = null;
window.IKO_CLIENT_INFO = null;
window.IKO_ROLE = null;
window.IKO_USER_ID = null;
window.IKO_ACCES_REFUSE = false;
window.IKO_CLIENT_READY = (async function () {
  try {
    var resSession = await fetch('/api/verif-securite?action=session');
    if (resSession.status === 401) {
      window.location.href = "/auth-login.html?retour=" + encodeURIComponent("/technicien.html");
      return null;
    }
    var session = await resSession.json();
    window.IKO_ROLE = session.role;
    // session.userId = ID Airtable de l'utilisateur connecte (table
    // Utilisateurs), directement exploitable comme valeur du champ lien
    // "Technicien" sur Interventions SAV. Absent pour SUPER_ADMIN_IKO en
    // navigation ?client=slug (pas de compte technicien associe) : les
    // interventions crees dans ce cas n'auront pas de technicien lie,
    // gere plus bas (creerInterventionAuto).
    window.IKO_USER_ID = session.userId || null;
    if (session.role !== "SUPER_ADMIN_IKO" && session.role !== "TECHNICIEN" && session.role !== "TENANT_ADMIN") {
      window.IKO_ACCES_REFUSE = true;
      return null;
    }

    if (session.role === "TECHNICIEN" || session.role === "TENANT_ADMIN") {
      // tenantId de la session = seule autorite. ?client=slug n'a plus
      // aucun pouvoir d'autorisation pour ce role.
      if (!session.tenantId) { window.IKO_ACCES_REFUSE = true; return null; }
      var rTenant = await fetch('/api/airtable/Clients/' + session.tenantId, {});
      if (!rTenant.ok) { window.IKO_ACCES_REFUSE = true; return null; }
      var recTenant = await rTenant.json();
      window.IKO_CLIENT_ID = recTenant.id;
      window.IKO_CLIENT_INFO = recTenant.fields || {};
      return recTenant.id;
    }

    // SUPER_ADMIN_IKO : ?client=slug = confort de navigation uniquement.
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('client');
    if (slug) { localStorage.setItem('iko_client_slug', slug); }
    else { slug = localStorage.getItem('iko_client_slug'); }
    if (!slug) return null;
    var formule = encodeURIComponent('{Slug}="' + slug + '"');
    var r = await fetch('/api/airtable/Clients?filterByFormula=' + formule + '&maxRecords=1', {});
    var json = await r.json();
    var rec = (json.records || [])[0];
    if (!rec) return null;
    window.IKO_CLIENT_ID = rec.id;
    window.IKO_CLIENT_INFO = rec.fields || {};
    return rec.id;
  } catch (e) { return null; }
})();
</script>

// Même compte/preset Cloudinary que index.html (dvbh3llqq / rsia_sav_unsigned,

const CLOUDINARY_CLOUD = 'dvbh3llqq';
const CLOUDINARY_PRESET = 'rsia_sav_unsigned';

async function compresserImageTech(file) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/')) { resolve(file); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        const maxDim = 1920;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => {
          resolve(new File([blob], file.name, { type: 'image/jpeg' }));
        }, 'image/jpeg', 0.8);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadCloudinaryTech(file) {
  const compressed = await compresserImageTech(file);
  const formData = new FormData();
  formData.append('file', compressed);
  formData.append('upload_preset', CLOUDINARY_PRESET);
  formData.append('folder', 'iko-suite-sav');
  const resp = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/auto/upload', { method: 'POST', body: formData });
  const data = await resp.json();
  return data.secure_url;
}

function tauxTvaVersDecimal(label) {
  if (!label) return 0.20;
  const m = String(label).match(/([\d.,]+)/);
  return m ? parseFloat(m[1].replace(',', '.')) / 100 : 0.20;
}

async function resoudreClientDepuisAgenceTech(agenceLabel) {
  // Le client est deja connu via le boot ?client=slug (window.IKO_CLIENT_*) ;
  // on ne va chercher dans Agences que l'ID d'agence (facultatif, pour lier
  // le devis a la bonne agence — non bloquant si les agences n'ont pas ete
  // renommees depuis "Nouvelle agence").
  const clientId = window.IKO_CLIENT_ID;
  const clientNom = window.IKO_CLIENT_INFO && window.IKO_CLIENT_INFO["Nom client"];
  if (!clientId || !clientNom) return null;
  let agenceId = null;
  try {
    const fA = encodeURIComponent('{Nom agence}="' + agenceLabel + '"');
    const rA = await fetch('/api/airtable/Agences?filterByFormula=' + fA + '&maxRecords=1');
    const jA = await rA.json();
    agenceId = (jA.records || [])[0]?.id || null;
  } catch(e) {}
  return { agenceId, clientId, clientNom };
}

async function chargerCatalogueDevisTech(clientNom) {
  // ARRAYJOIN() sur un lien renvoie le nom affiche, jamais l'ID (confirme en prod).
  const nomEchappe = String(clientNom).replace(/"/g, '\\"');
  const formule = 'FIND("' + nomEchappe + '", ARRAYJOIN({Client}))';
  const [rProd, rMo, rMep] = await Promise.all([
    fetch('/api/airtable/Catalogue%20Produits?filterByFormula=' + encodeURIComponent(formule)),
    fetch('/api/airtable/Grille%20Main%20d%27%C5%93uvre?filterByFormula=' + encodeURIComponent(formule)),
    fetch('/api/airtable/Mise%20en%20page%20Devis?filterByFormula=' + encodeURIComponent(formule)),
  ]);
  const [jProd, jMo, jMep] = await Promise.all([rProd.json(), rMo.json(), rMep.json()]);
  const mepRec = (jMep.records || [])[0];
  let identite = {}, assurance = {}, marges = {}, elementsGraphiques = [];
  try { identite = JSON.parse(mepRec?.fields?.["Identité entreprise (JSON)"] || "{}"); } catch(e){}
  try { assurance = JSON.parse(mepRec?.fields?.["Assurance décennale (JSON)"] || "{}"); } catch(e){}
  try { marges = JSON.parse(mepRec?.fields?.["Marges"] || "{}"); } catch(e){}
  try {
    const els = JSON.parse(mepRec?.fields?.["Éléments graphiques (JSON)"] || "[]");
    if (Array.isArray(els)) elementsGraphiques = els;
  } catch(e){}
  return {
    produits: jProd.records || [],
    mo: jMo.records || [],
    mep: {
      couleur: mepRec?.fields?.["Couleur primaire"] || "#FF6B00",
      piedPage: mepRec?.fields?.["Texte pied de page"] || "",
      dureeValidite: mepRec?.fields?.["Durée validité devis (jours)"] || 30,
      logoUrl: (mepRec?.fields?.["Logo"]?.[0]?.url) || identite.logoUrl || "",
      logoX: identite.logoX != null ? identite.logoX : 18,
      logoY: identite.logoY != null ? identite.logoY : 14,
      logoW: identite.logoW != null ? identite.logoW : 30,
      margeHaut: marges.haut != null ? marges.haut : 20,
      margeBas: marges.bas != null ? marges.bas : 20,
      margeGauche: marges.gauche != null ? marges.gauche : 18,
      margeDroite: marges.droite != null ? marges.droite : 18,
      identite, assurance, elements: elementsGraphiques,
    }
  };
}

async function chargerImageEnDataUrlTech(url) {
  if (!url) return null;
  try {
    const res = await fetch(url);
    const blob = await res.blob();

/* ---- Éléments graphiques du configurateur (formes/traits/images) — identique à l'aperçu admin.html ---- */
function hexVersRgbTech(hex, secours) {
  hex = String(hex || secours || '#111111').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex, 16);
  if (isNaN(num)) return [17, 17, 17];
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
}

async function dessinerElementsGraphiquesTech(doc, elements) {
  if (!Array.isArray(elements) || !elements.length) return;
  const tries = elements.filter(el => el && el.visible !== false).sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));
  for (const el of tries) {
    try {
      if (el.type === 'rect' || el.type === 'circle') {
        const [dr, dg, db] = hexVersRgbTech(el.stroke);
        doc.setDrawColor(dr, dg, db);
        doc.setLineWidth(el.strokeWidth != null ? el.strokeWidth : 1);
        const aRemplir = el.fill && el.fill !== 'none';
        if (aRemplir) { const [fr, fg, fb] = hexVersRgbTech(el.fill); doc.setFillColor(fr, fg, fb); }
        const style = aRemplir ? 'FD' : 'S';
        if (el.type === 'rect') {
          doc.rect(el.x, el.y, el.w, el.h, style);
        } else {
          doc.ellipse(el.x + el.w / 2, el.y + el.h / 2, el.w / 2, el.h / 2, style);
        }
      } else if (el.type === 'line') {
        const [dr, dg, db] = hexVersRgbTech(el.stroke);
        doc.setDrawColor(dr, dg, db);
        doc.setLineWidth(el.strokeWidth != null ? el.strokeWidth : 2);
        doc.line(el.x1, el.y1, el.x2, el.y2);
        if (el.arrowEnd) {
          const angle = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
          const taille = 3;
          const p1x = el.x2 - taille * Math.cos(angle - Math.PI / 7), p1y = el.y2 - taille * Math.sin(angle - Math.PI / 7);
          const p2x = el.x2 - taille * Math.cos(angle + Math.PI / 7), p2y = el.y2 - taille * Math.sin(angle + Math.PI / 7);
          doc.setFillColor(dr, dg, db);
          doc.triangle(el.x2, el.y2, p1x, p1y, p2x, p2y, 'F');
        }
      } else if (el.type === 'image' && el.url) {
        const info = await chargerImageEnDataUrlTech(el.url);
        if (info && info.url) {
          try { doc.addImage(info.url, 'JPEG', el.x, el.y, el.w, el.h, undefined, 'FAST'); }
          catch (e) { try { doc.addImage(info.url, 'PNG', el.x, el.y, el.w, el.h, undefined, 'FAST'); } catch (e2) {} }
        }
      }
    } catch (e) { /* un élément mal formé ne doit pas bloquer le reste du PDF */ }
  }
}

async function creerDemandeSignatureYousignTech(pdfBlob, nomFichier, personneNom, email, telephone) {
  const reqRes = await fetch('/api/yousign/signature_requests', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: nomFichier, delivery_mode: 'none', timezone: 'Europe/Paris' })
  });
  if (!reqRes.ok) throw new Error('Yousign: création de la demande échouée');
  const signatureRequest = await reqRes.json();
  const srId = signatureRequest.id;

  const form = new FormData();
  form.append('file', pdfBlob, nomFichier + '.pdf');
  form.append('nature', 'signable_document');
  form.append('parse_anchors', 'false');
  const docRes = await fetch('/api/yousign/signature_requests/' + srId + '/documents', { method: 'POST', body: form });
  if (!docRes.ok) throw new Error('Yousign: envoi du document échoué');
  const document = await docRes.json();

  const nomParts = (personneNom || 'Client Iko Suite').trim().split(/\s+/);
  const firstName = nomParts.length > 1 ? nomParts.slice(0, -1).join(' ') : 'Client';
  const lastName = nomParts.length > 1 ? nomParts[nomParts.length - 1] : nomParts[0];
  const telValide = telephone && /^(\+33|0)[1-9](\d{2}){4}$/.test(String(telephone).replace(/[\s.-]/g, ''));

  const signerRes = await fetch('/api/yousign/signature_requests/' + srId + '/signers', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      info: { first_name: firstName, last_name: lastName, email, phone_number: telValide ? String(telephone).replace(/[\s.-]/g, '') : undefined, locale: 'fr' },
      signature_level: 'electronic_signature', signature_authentication_mode: 'no_otp',
      fields: [{ document_id: document.id, type: 'signature', page: 1, x: 60, y: 700 }]
    })
  });
  if (!signerRes.ok) throw new Error('Yousign: ajout du signataire échoué');
  const signer = await signerRes.json();
  const signerId = signer.id;

  await fetch('/api/yousign/signature_requests/' + srId + '/activate', { method: 'POST' });

  let lienSignature = '';
  for (let tentative = 0; tentative < 4 && !lienSignature; tentative++) {
    if (tentative > 0) await new Promise(r => setTimeout(r, 800));
    try {
      const signerFraisRes = await fetch('/api/yousign/signature_requests/' + srId + '/signers/' + signerId);
      if (signerFraisRes.ok) {
        const signerFrais = await signerFraisRes.json();
        lienSignature = signerFrais.signature_link || signerFrais.signature_url || signerFrais.signature_link_url || '';
      }
    } catch(e) {}
  }

  return { signatureRequestId: srId, lienSignature };
}

  doc.text('Total TVA : ' + (montantTTC - montantHT).toFixed(2) + ' €', 210 - mR, y, { align: 'right' }); y += 5.5;
  doc.setFont('helvetica', 'bold'); doc.setTextColor(20, 20, 20);
  doc.text('Total TTC : ' + montantTTC.toFixed(2) + ' €', 210 - mR, y, { align: 'right' }); y += 10;

  // Conditions de règlement (bloc visible, avec montant de l'acompte quand il y en a un)
  if (y > 297 - mBas - 60) { doc.addPage(); y = mHaut; }
  const condTxt = mep.conditionsPaiement || 'Acompte de 30 % à la commande, solde à la fin des travaux';
  const pctM = condTxt.match(/(\d+)\s*%/);
  const lignesCond = [condTxt + '.'];
  if (pctM) {
    const ac = montantTTC * Number(pctM[1]) / 100;
    lignesCond.push('Acompte à la commande : ' + ac.toFixed(2) + ' € TTC  ·  Solde : ' + (montantTTC - ac).toFixed(2) + ' € TTC');
  }
  if (facture) lignesCond.push(facture.statutPaiement === 'Payé' ? ('Facture acquittée' + (facture.datePaiement ? ' le ' + String(facture.datePaiement).split('-').reverse().join('/') : '') + '.') : 'Règlement attendu avant le ' + String(facture.echeance || '').split('-').reverse().join('/') + '.');
  const hCond = 8 + lignesCond.length * 4.5;
  doc.setFillColor(255, 243, 235); doc.rect(mL, y, largeurUtile, hCond, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(194, 65, 12);
  doc.text('CONDITIONS DE RÈGLEMENT', mL + 4, y + 5);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(40, 40, 40);
  lignesCond.forEach((t, i) => doc.text(t, mL + 4, y + 10 + i * 4.5, { maxWidth: largeurUtile - 8 }));
  y += hCond + 6;

  doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(130, 130, 130);
  const assurance = mep.assurance || {};
  const mentions = [
    'SIRET ' + (identite.siret || '—') + '  ·  RCS ' + (identite.rcs || '—') + '  ·  TVA intracom. ' + (identite.tva || '—'),
    'Assurance décennale : ' + (assurance.assureur || '—') + (assurance.numPolice ? ' — police n° ' + assurance.numPolice : '') + (assurance.zone ? ' — zone : ' + assurance.zone : ''),
    facture ? 'En cas de retard de paiement : pénalité de 3 fois le taux d\'intérêt légal et indemnité forfaitaire de recouvrement de 40 €. Pas d\'escompte pour paiement anticipé.' : 'Devis valable ' + (mep.dureeValidite || 30) + ' jours à compter de sa date d\'émission. Bon pour accord — signature électronique ci-après.',
  ];
  doc.text(mentions, mL, 297 - mBas - 15);
  const pied = rendrePiedPageRiche(mep.piedPage);
  if (pied) {
    doc.setFontSize(6.5); doc.setTextColor(160, 160, 160);
    doc.setFont('helvetica', pied.gras && pied.italique ? 'bolditalic' : pied.gras ? 'bold' : pied.italique ? 'italic' : 'normal');
    const xPied = pied.align === 'left' ? mL : pied.align === 'right' ? 210 - mR : 105;
    doc.text(pied.texte, xPied, 297 - mBas, { align: pied.align });
    doc.setFont('helvetica', 'normal');
  }

  // Pages annexes (Phase 3 configurateur) : schémas/photos placés sur page > 0 dans l'éditeur
  const pagesAnnexes = {};
  (mep.elements || []).forEach(function(el){
    const p = el.page || 0;
    if (p > 0) { (pagesAnnexes[p] = pagesAnnexes[p] || []).push(el); }
  });
  const numerosAnnexes = Object.keys(pagesAnnexes).map(Number).sort((a, b) => a - b);
  for (const p of numerosAnnexes) {
    doc.addPage();
    await dessinerElementsGraphiques(doc, pagesAnnexes[p]);
  }

  return doc.output('blob');
}

async function creerDemandeSignatureYousign(pdfBlob, nomFichier, personneNom, email, telephone) {
  const reqRes = await fetch('/api/yousign/signature_requests', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: nomFichier, delivery_mode: 'none', timezone: 'Europe/Paris' })
  });
  if (!reqRes.ok) {
    const detail = await reqRes.text().catch(() => '');
    throw new Error('Yousign: création de la demande échouée (HTTP ' + reqRes.status + ') ' + detail.slice(0, 300));
  }
  const signatureRequest = await reqRes.json();
  const srId = signatureRequest.id;

  const form = new FormData();
  form.append('file', pdfBlob, nomFichier + '.pdf');
  form.append('nature', 'signable_document');
  form.append('parse_anchors', 'false');
  const docRes = await fetch('/api/yousign/signature_requests/' + srId + '/documents', { method: 'POST', body: form });
  if (!docRes.ok) {
    const detail = await docRes.text().catch(() => '');
    throw new Error('Yousign: envoi du document échoué (HTTP ' + docRes.status + ') ' + detail.slice(0, 300));
  }
  const document = await docRes.json();

  const nomParts = (personneNom || 'Client Iko Suite').trim().split(/\s+/);
  const firstName = nomParts.length > 1 ? nomParts.slice(0, -1).join(' ') : 'Client';
  const lastName = nomParts.length > 1 ? nomParts[nomParts.length - 1] : nomParts[0];
  const telValide = telephone && /^(\+33|0)[1-9](\d{2}){4}$/.test(String(telephone).replace(/[\s.-]/g, ''));

  const signerRes = await fetch('/api/yousign/signature_requests/' + srId + '/signers', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      info: { first_name: firstName, last_name: lastName, email, phone_number: telValide ? String(telephone).replace(/[\s.-]/g, '') : undefined, locale: 'fr' },
      signature_level: 'electronic_signature',
      signature_authentication_mode: 'no_otp',
      fields: [{ document_id: document.id, type: 'signature', page: 1, x: 60, y: 700 }]
    })
  });
  if (!signerRes.ok) {
    const detail = await signerRes.text().catch(() => '');
    throw new Error('Yousign: ajout du signataire échoué (HTTP ' + signerRes.status + ') ' + detail.slice(0, 300));
  }
  const signer = await signerRes.json();
  const signerId = signer.id;

  await fetch('/api/yousign/signature_requests/' + srId + '/activate', { method: 'POST' });

  // signature_link peut mettre un instant a etre genere cote Yousign. On
  // tente une seule fois rapidement ici (ne bloque pas l'envoi du devis) ;
  // si absent, devis.html le recuperera lui-meme a l'ouverture (via
  // Yousign Request ID + Yousign Signer ID stockes sur le devis), quel
  // que soit le delai reel de Yousign.
  let lienSignature = '';
  try {
    const signerFraisRes = await fetch('/api/yousign/signature_requests/' + srId + '/signers/' + signerId);
    if (signerFraisRes.ok) {
      const signerFrais = await signerFraisRes.json();
      lienSignature = signerFrais.signature_link || '';
    }
  } catch(e) {}

  return { signatureRequestId: srId, signerId, lienSignature };
}

  if (!id.raisonSociale) {
    Object.assign(id, { raisonSociale: "IKO DEMO — Menuiserie", formeJuridique: "SAS", adresse: "12 rue de l'Atelier, 59000 Lille", siret: id.siret || "000 000 000 00000 (démo)", rcs: id.rcs || "Lille (démo)", tva: id.tva || "FR00 000000000 (démo)" });
  }
  if (!as.assureur) Object.assign(as, { assureur: "Assureur (démo)", numPolice: "DEMO-0000", zone: "France métropolitaine" });

function LigneDevisEditeur({ produits, mo, lignes, ticket, onAjouter, onSupprimer, demo }) {
  const [choix, setChoix] = React.useState("");
  const [qte, setQte] = React.useState(1);
  const refListe = React.useRef(null);
  const [dernierAjout, setDernierAjout] = React.useState("");
  const onAjouterVisible = (l) => {
    onAjouter(l);
    setDernierAjout("✓ Ajouté : " + l.designation + " ×" + l.qte);
    setTimeout(() => { try { refListe.current && refListe.current.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch(e){} }, 80);
    setTimeout(() => setDernierAjout(""), 3500);
  };
  const [libreOuvert, setLibreOuvert] = React.useState(false);
  const [libre, setLibre] = React.useState({ designation: "", prix: "", qte: 1, tva: "0.2" });
  const ajouterLibre = () => {
    const pu = Number(String(libre.prix).replace(",", "."));
    const q = Number(libre.qte) || 1;
    if (!libre.designation.trim() || !(pu >= 0) || libre.prix === "") return;
    const taux = Number(libre.tva);
    const totalHT = q * pu;
    onAjouterVisible({ designation: libre.designation.trim(), qte: q, puHT: pu, tauxTva: taux, totalHT, totalTTC: totalHT * (1 + taux) });
    setLibre({ designation: "", prix: "", qte: 1, tva: libre.tva });
  };

  // ---- Suggestion IA (mode "devis_suggestion") ----
  // Meme principe que le Bloc 2C deja livre cote technicien/Max
  // (technicien.html / api/chat-technicien.js) : le catalogue reel deja
  // charge (produits/mo) est envoye au serveur qui revalide chaque
  // catalogue_id renvoye par l'IA. Ajout ligne par ligne apres validation
  // manuelle, jamais d'ecriture automatique.
  const [suggestionsDevis, setSuggestionsDevis] = React.useState(null);
  const [elementsSansCorrespondance, setElementsSansCorrespondance] = React.useState([]);
  const [chargementSuggestions, setChargementSuggestions] = React.useState(false);
  const [erreurSuggestion, setErreurSuggestion] = React.useState("");
  // Devis assisté depuis SAV V1 : quantité "à confirmer" (l.quantite === null,
  // jamais inventée côté serveur) saisie ici par le responsable avant de
  // pouvoir ajouter la ligne — jamais de valeur par défaut silencieuse.
  const [qteAConfirmer, setQteAConfirmer] = React.useState({});

  const demanderSuggestionsDevis = async () => {
    if (!produits.length && !mo.length) return;
    setChargementSuggestions(true);
    setErreurSuggestion("");
    setSuggestionsDevis(null);
    setElementsSansCorrespondance([]);
    setQteAConfirmer({});
    try {
      const catalogueEnvoye = [
        ...produits.map(p => ({ id: p.id, type: 'produit', designation: p.fields?.["Désignation"] || '', prix: p.fields?.["Prix unitaire HT"] || 0 })),
        ...mo.map(m => ({ id: m.id, type: 'mo', designation: m.fields?.["Type d'action"] || '', prix: m.fields?.["Prix forfait HT"] || m.fields?.["Taux horaire HT"] || 0 })),
      ];
      const r = await fetch('/api/chat-dashboard', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'devis_suggestion',
          // Diagnostic technicien déjà enregistré sur le ticket (si présent) :
          // réutilisé tel quel, aucun nouvel appel Airtable.
          ticket: { produit: ticket?.fields?.Produit || '', probleme: ticket?.fields?.Problème || '', diagnostic: ticket?.fields?.Diagnostic || '' },
          catalogue: catalogueEnvoye,
        }),
      });
      const data = await r.json();
      if (r.ok && !data.erreur) {
        setSuggestionsDevis(data.lignes || []);
        setElementsSansCorrespondance(data.elements_sans_correspondance || []);
      } else {
        setErreurSuggestion((data && data.erreur) || ("IKO n'a pas pu répondre (code " + r.status + "). Réessaie dans un instant."));
      }
    } catch (e) { setErreurSuggestion("IKO est injoignable pour le moment. Réessaie, ou ajoute les lignes à la main."); }
    setChargementSuggestions(false);
  };

  const ajouterLigneSuggeree = (l) => {
    // Quantité connue (fournie par IKO à partir du contexte) OU confirmée
    // manuellement ci-dessous par le responsable : jamais une valeur
    // par défaut inventée si elle n'a jamais été renseignée.
    const quantiteFinale = l.quantite != null ? l.quantite : Number(qteAConfirmer[l.catalogue_id]);
    if (!quantiteFinale || quantiteFinale <= 0) return;
    const produitSource = produits.find(p => p.id === l.catalogue_id);
    const tauxTva = l.type === 'produit' ? tauxTvaVersDecimal(produitSource?.fields?.["Taux TVA"]) : 0.20;
    const totalHT = quantiteFinale * l.prix;
    onAjouterVisible({ designation: l.designation, qte: quantiteFinale, puHT: l.prix, tauxTva, totalHT, totalTTC: totalHT * (1 + tauxTva) });
    setSuggestionsDevis(prev => (prev || []).filter(x => x.catalogue_id !== l.catalogue_id));
  };

  const ajouter = () => {
    if (!choix) return;
    const [type, id] = choix.split('|');
    const source = type === 'produit' ? produits.find(p => p.id === id) : mo.find(m => m.id === id);
    if (!source) return;
    const f = source.fields || {};
    const designation = type === 'produit' ? (f["Désignation"] || '—') : (f["Type d'action"] || '—');
    const puHT = type === 'produit' ? (f["Prix unitaire HT"] || 0) : (f["Prix forfait HT"] || f["Taux horaire HT"] || 0);
    const tauxTva = type === 'produit' ? tauxTvaVersDecimal(f["Taux TVA"]) : 0.20;
    const totalHT = (Number(qte) || 1) * puHT;
    onAjouterVisible({ designation, qte: Number(qte) || 1, puHT, tauxTva, totalHT, totalTTC: totalHT * (1 + tauxTva) });
    setChoix(""); setQte(1);
  };

  const total = lignes.reduce((s, l) => s + (l.totalHT || 0), 0);

  return (
    <div style={{marginBottom:"14px"}}>
      <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Lignes du devis {demo ? "(catalogue démo)" : "(catalogue du client)"}</label>
      {lignes.length === 0 && (
        <div style={{border:"1px dashed "+C.border,borderRadius:"8px",padding:"12px",textAlign:"center",fontSize:"12px",color:C.muted,marginBottom:"10px"}}>Aucune ligne pour le moment — ajoute une prestation ci-dessous.</div>
      )}
      <div ref={refListe}/>
      {lignes.length > 0 && (
        <div style={{border:"1px solid "+C.border,borderRadius:"8px",overflow:"hidden",marginBottom:"6px"}}>
          {lignes.map((l, i) => (
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderBottom:i<lignes.length-1?"1px solid "+C.border:"none",fontSize:"12px"}}>
              <span>{l.designation} <span style={{color:C.muted}}>×{l.qte}</span></span>
              <span style={{display:"flex",alignItems:"center",gap:"10px"}}>
                <b>{l.totalHT.toFixed(2)} €</b>
                <span onClick={() => onSupprimer(i)} style={{cursor:"pointer",color:C.muted}}>✕</span>
              </span>
            </div>
          ))}
        </div>
      )}
      <div style={{textAlign:"right",fontSize:"12px",color:C.muted}}>Total HT : {total.toFixed(2)} € · TVA : {(lignes.reduce((s,l)=>s+((l.totalTTC!=null?l.totalTTC:l.totalHT*1.2)-l.totalHT),0)).toFixed(2)} €</div>
      <div style={{textAlign:"right",fontSize:"14px",fontWeight:"900",color:C.white}}>Total TTC : {(lignes.reduce((s,l)=>s+(l.totalTTC!=null?l.totalTTC:l.totalHT*1.2),0)).toFixed(2)} €</div>
      <div style={{position:"sticky",bottom:0,zIndex:5,margin:"10px 0 0",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"8px",background:"#FEFEFE",border:"1px solid "+C.orBord,borderRadius:"10px",padding:"8px 12px",fontSize:"12px",fontWeight:"800",color:C.white}}>
        <span>🧾 {lignes.length} ligne{lignes.length>1?"s":""} dans le devis</span>
        {dernierAjout ? <span style={{color:"#15803D"}}>{dernierAjout}</span> : <span>Total TTC : {(lignes.reduce((s,l)=>s+(l.totalTTC!=null?l.totalTTC:l.totalHT*1.2),0)).toFixed(2)} €</span>}
      </div>
      <div style={{fontSize:"11px",fontWeight:"700",color:C.muted,margin:"14px 0 6px"}}>➕ Ajouter une prestation</div>
      <div style={{background:"rgba(0,0,0,0.03)",border:"1px solid "+C.border,borderRadius:"10px",padding:"10px"}}>
      {(produits.length > 0 || mo.length > 0) && (
        <>
          <button type="button" onClick={demanderSuggestionsDevis} disabled={chargementSuggestions}
            style={{width:"100%",padding:"8px",marginBottom:"8px",borderRadius:"8px",background:"rgba(var(--iko-primary-rgb),0.1)",border:"1px solid var(--iko-primary)",color:"var(--iko-primary)",fontSize:"11px",fontWeight:"700",cursor:chargementSuggestions?"not-allowed":"pointer"}}>
            {chargementSuggestions ? "⏳ IKO prépare la proposition..." : "🧾 Laisser IKO proposer des lignes (selon le problème du ticket)"}
          </button>
          {erreurSuggestion && <div style={{fontSize:"11px",color:C.rouge,marginBottom:"8px"}}>⚠️ {erreurSuggestion}</div>}
          {suggestionsDevis && (
            <div style={{marginBottom:"8px",fontSize:"10px",color:C.muted}}>
              🔎 Éléments identifiés : {ticket?.fields?.Produit || "produit non précisé"} — {ticket?.fields?.Problème || "problème non précisé"}
              {ticket?.fields?.Diagnostic && " — diagnostic déjà enregistré"}
            </div>
          )}
          {suggestionsDevis && suggestionsDevis.length === 0 && elementsSansCorrespondance.length === 0 && (
            <div style={{fontSize:"10px",color:C.muted,marginBottom:"8px",fontStyle:"italic"}}>Informations insuffisantes pour proposer une ligne de devis sur ce ticket.</div>
          )}
          {suggestionsDevis && suggestionsDevis.length > 0 && (
            <div style={{marginBottom:"8px",display:"flex",flexDirection:"column",gap:"5px"}}>
              <div style={{fontSize:"10px",fontWeight:"700",color:C.muted}}>Lignes proposées :</div>
              {suggestionsDevis.map(l => {
                const quantiteInconnue = l.quantite == null;
                const quantiteSaisie = Number(qteAConfirmer[l.catalogue_id]);
                const ajoutPossible = !quantiteInconnue || quantiteSaisie > 0;
                return (
                  <div key={l.catalogue_id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"6px",fontSize:"10px",background:"rgba(var(--iko-primary-rgb),0.06)",borderRadius:"6px",padding:"6px 8px"}}>
                    <div>
                      <b>{l.designation}</b> ×{quantiteInconnue ? (
                        <input type="number" min="1" placeholder="?" value={qteAConfirmer[l.catalogue_id] || ""}
                          onChange={e => setQteAConfirmer(prev => ({...prev, [l.catalogue_id]: e.target.value}))}
                          style={{width:"46px",fontSize:"10px",padding:"2px 4px",marginLeft:"2px"}}/>
                      ) : l.quantite} — {Number(l.prix).toFixed(2)} €
                      {quantiteInconnue && <span style={{color:"var(--iko-primary)",fontWeight:"700",marginLeft:"4px"}}>Quantité à confirmer</span>}
                      {l.justification && <div style={{color:C.muted,fontStyle:"italic",marginTop:"2px"}}>{l.justification}</div>}
                    </div>
                    <button type="button" onClick={() => ajouterLigneSuggeree(l)} disabled={!ajoutPossible}
                      style={{flexShrink:0,padding:"5px 10px",borderRadius:"6px",background:ajoutPossible?"var(--iko-primary)":"#D1D5DB",color:"var(--iko-dark)",border:"none",fontWeight:"800",cursor:ajoutPossible?"pointer":"not-allowed",fontSize:"10px"}}>
                      + Ajouter au devis
                    </button>
                  </div>
                );
              })}
            </div>
          )}
          {elementsSansCorrespondance.length > 0 && (
            <div style={{marginBottom:"8px",background:"rgba(var(--iko-primary-rgb),0.1)",border:"1px solid var(--iko-primary)",borderRadius:"6px",padding:"6px 8px"}}>
              <div style={{fontSize:"10px",fontWeight:"700",color:"var(--iko-primary-fonce)",marginBottom:"3px"}}>⚠️ Éléments à confirmer (hors catalogue)</div>
              {elementsSansCorrespondance.map((e, i) => (
                <div key={i} style={{fontSize:"10px",color:"var(--iko-primary-fonce)"}}>· {e}</div>
              ))}
            </div>
          )}
        </>
      )}
      <div style={{display:"flex",gap:"8px",marginBottom:"10px"}}>
        <select value={choix} onChange={e => setChoix(e.target.value)} style={{flex:1}}>
          <option value="">— Ajouter une ligne —</option>
          {produits.length > 0 && <optgroup label="Produits">
            {produits.map(p => <option key={p.id} value={"produit|"+p.id}>{p.fields?.["Désignation"]} — {(p.fields?.["Prix unitaire HT"]||0).toFixed(2)} € HT</option>)}
          </optgroup>}
          {mo.length > 0 && <optgroup label="Main d'œuvre">
            {mo.map(m => <option key={m.id} value={"mo|"+m.id}>{m.fields?.["Type d'action"]} — {(m.fields?.["Prix forfait HT"]||m.fields?.["Taux horaire HT"]||0).toFixed(2)} € HT</option>)}
          </optgroup>}
        </select>
        <input type="number" min="1" value={qte} onChange={e => setQte(e.target.value)} style={{width:"60px"}}/>
        <button type="button" onClick={ajouter} style={{padding:"0 14px",background:"#F3F4F6",border:"1px solid "+C.border,borderRadius:"8px",cursor:"pointer",fontSize:"13px",fontWeight:"700"}}>+</button>
      </div>
      {demo && (

function ModalDevis({ ticket, onClose, onSent }) {
  const [chargement, setChargement] = React.useState(true);
  const [catalogue, setCatalogue] = React.useState({ produits: [], mo: [], mep: null });
  const [clientInfo, setClientInfo] = React.useState(null);
  const [demoCat, setDemoCat] = React.useState(false);
  const [etape, setEtape] = React.useState("edition");
  const [apercuUrl, setApercuUrl] = React.useState(null);
  const [conditions, setConditions] = React.useState("Acompte de 30 % à la commande, solde à la fin des travaux");
  const [validite, setValidite] = React.useState(30);
  const [numeroDevis] = React.useState(() => "DEV-" + new Date().getFullYear() + "-" + Math.floor(1000 + Math.random() * 9000));
  const [lignes, setLignes] = React.useState([]);
  const [email, setEmail] = React.useState(ticket.fields?.Email || "");
  const [message, setMessage] = React.useState("");
  const [saving, setSaving] = React.useState(false);
  const [error, setError] = React.useState("");
  const [envoye, setEnvoye] = React.useState(false);
  const [debugEnvoi, setDebugEnvoi] = React.useState(null);

  React.useEffect(() => {
    (async () => {
      let cat = { produits: [], mo: [], mep: null };
      try {
        const resolu = await resoudreClientDepuisAgence(ticket.fields?.Agence);
        if (resolu) {
          setClientInfo(resolu);
          cat = await chargerCatalogueDevis(resolu.clientNom);
        }
      } catch(e) { console.error(e); }
      // IKO DEMO (pas de ?client=) : catalogue menuiserie de démonstration si rien n'est configuré.
      const estDemo = !new URLSearchParams(window.location.search).get('client');
      if (estDemo && !cat.produits.length && !cat.mo.length) {
        cat = { ...cat, ...CATALOGUE_DEMO_IKO };
        setDemoCat(true);

      setCatalogue(cat);
      setChargement(false);
    })();
  }, []);

  const mepEffectif = () => mepAvecDefauts({ ...(catalogue.mep || {}), conditionsPaiement: conditions, dureeValidite: validite }, demoCat);
  const clientPdf = () => {
    const cpMatch = (ticket.fields?.Adresse || "").match(/\b\d{5}\b/);
    return { nom: ticket.fields?.Client, adresse: ticket.fields?.Adresse || "", cp: cpMatch ? cpMatch[0] : "" };
  };
  const voirApercu = async () => {
    setError("");
    if (!lignes.length) { setError("Ajoute au moins une ligne au devis."); return; }
    setSaving(true);
    try {
      const blob = await genererPdfDevis({ numero: numeroDevis, ticket, client: clientPdf(), lignes, montantHT, montantTTC, mep: mepEffectif() });
      if (apercuUrl) URL.revokeObjectURL(apercuUrl);
      setApercuUrl(URL.createObjectURL(blob));
      setEtape("apercu");
    } catch(e) { console.error(e); setError("Impossible de générer l'aperçu : " + (e && e.message || e)); }
    setSaving(false);
  };

  const genererToken = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
  const emailValide = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  const montantHT = lignes.reduce((s, l) => s + (l.totalHT || 0), 0);

  const envoyer = async () => {

    setSaving(true); setError("");
    const diag = { devisId: null, pdfGenere: false, yousignOk: false, yousignErreur: null, ticketMisAJour: false, webhookStatut: null, webhookErreur: null, lienDevis: null };
    try {
      const numero = numeroDevis;

      const devisRes = await fetch('/api/airtable/Devis', {

      diag.devisId = devisRec.id;

      const pdfBlob = await genererPdfDevis({ numero, ticket, client, lignes, montantHT, montantTTC, mep });

      let yousignFields = {};

      // Compatibilité avec le pipeline existant (ModalGestionDevis, badges, filtres par Statut de ticket).

      diag.ticketMisAJour = ticketPatchRes.ok;

      }

      const lienDevis = window.location.origin + '/devis.html?devisId=' + devisRec.id;
      diag.lienDevis = lienDevis;
      try {

            marque: 'iko', action: 'devis_envoye',

          })
        });

      } catch (webhookErr) {
        diag.webhookErreur = String(webhookErr && webhookErr.message || webhookErr);
      }

      setDebugEnvoi(diag);
      setEnvoye(true);
    } catch(e) {
      console.error(e);
      diag.erreurFatale = String(e && e.message || e);
      setDebugEnvoi(diag);
      setError("Erreur lors de l'envoi — détail dans le diagnostic ci-dessous.");
    }
    setSaving(false);
  };

  if (envoye) {
    return (
      <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>

            <div style={{background:C.rougeDim,border:"1px solid rgba(var(--iko-erreur-rgb),0.3)",borderRadius:"8px",padding:"8px 12px",fontSize:"11px",color:C.rouge,marginBottom:"14px"}}>
              ⚠️ Yousign a échoué ({debugEnvoi?.yousignErreur}) — le devis est créé mais sans lien de signature.

  }

  return (

const CAUSES_SAV = ["Défaut produit","Erreur de pose","Réglage","Casse transport","Usure normale","Mauvaise utilisation client","Pièce défectueuse","Malfaçon fabrication","SAV préventif","Autre"];

// Zone de signature tactile (doigt, stylet ou souris) — identique sur téléphone, tablette et PC.
function SignaturePad({ onChange }) {
  const ref = React.useRef(null);
  const dessine = React.useRef(false);
  const [vide, setVide] = React.useState(true);
  React.useEffect(() => {
    const c = ref.current; if (!c) return;
    const dpr = window.devicePixelRatio || 1;
    c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
    const ctx = c.getContext("2d"); ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111";
  }, []);
  const pos = (e) => { const r = ref.current.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const debut = (e) => { e.preventDefault(); ref.current.setPointerCapture(e.pointerId); dessine.current = true; const p = pos(e); const ctx = ref.current.getContext("2d"); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke(); };
  const trace = (e) => { if (!dessine.current) return; e.preventDefault(); const p = pos(e); const ctx = ref.current.getContext("2d"); ctx.lineTo(p.x, p.y); ctx.stroke(); };
  const fin = () => { if (!dessine.current) return; dessine.current = false; setVide(false); onChange(ref.current.toDataURL("image/png")); };
  const effacer = () => { const c = ref.current; c.getContext("2d").clearRect(0, 0, c.width, c.height); setVide(true); onChange(null); };
  return (
    <div>
      <div style={{position:"relative",background:"#fff",border:"1.5px dashed rgba(255,107,0,0.6)",borderRadius:"12px",height:"130px",overflow:"hidden"}}>
        <canvas ref={ref} onPointerDown={debut} onPointerMove={trace} onPointerUp={fin} onPointerCancel={fin}
          style={{width:"100%",height:"100%",touchAction:"none",display:"block"}}/>
        {vide && <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",color:"#9CA3AF",fontSize:"12px",pointerEvents:"none"}}>✍️ Le client signe ici avec le doigt</div>}
      </div>
      {!vide && <button type="button" onClick={effacer} style={{marginTop:"6px",background:"none",border:"none",color:"#6B7280",fontSize:"11px",textDecoration:"underline",cursor:"pointer"}}>Effacer la signature</button>}
    </div>
  );
}

// Bloc affiché à la fin d'une intervention : alimente les analyses « coût du SAV » et le bon d'intervention signé.
function BlocClotureTerrain({ cause, setCause, duree, setDuree, coutPieces, setCoutPieces, setSignature }) {
  const lib = { fontSize:"11px", color:"#6B7280", display:"block", marginBottom:"6px", fontWeight:"700" };
  return (
    <div style={{marginBottom:"14px"}}>
      <label style={lib}>Cause du SAV</label>
      <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"12px"}}>
        {CAUSES_SAV.map(c => (
          <button key={c} type="button" onClick={() => setCause(cause === c ? "" : c)}
            style={{padding:"7px 10px",borderRadius:"16px",fontSize:"11px",fontWeight:"700",cursor:"pointer",
              border:"1px solid " + (cause === c ? "#FF6B00" : "rgba(0,0,0,0.15)"),
              background: cause === c ? "linear-gradient(180deg, rgba(255,150,60,0.97), rgba(255,107,0,0.9))" : "rgba(255,255,255,0.7)",
              color: cause === c ? "#fff" : "#374151"}}>{c}</button>
        ))}
      </div>
      <div style={{display:"flex",gap:"10px",marginBottom:"12px"}}>
        <div style={{flex:1}}>
          <label style={lib}>Durée sur place (min)</label>
          <input type="number" inputMode="numeric" min="0" value={duree} onChange={e => setDuree(e.target.value)} placeholder="Ex : 45"/>
        </div>
        <div style={{flex:1}}>
          <label style={lib}>Pièces utilisées (€ HT)</label>
          <input type="number" inputMode="decimal" min="0" step="0.01" value={coutPieces} onChange={e => setCoutPieces(e.target.value)} placeholder="Ex : 18.50"/>
        </div>
      </div>
      <label style={lib}>Signature du client (bon d'intervention)</label>
      <SignaturePad onChange={setSignature}/>
      <div style={{fontSize:"10px",color:"#6B7280",marginTop:"6px"}}>Un bon d'intervention PDF signé est généré et envoyé au client à la validation.</div>
    </div>
  );
}

// Bon d'intervention PDF (preuve de passage). Renvoie un Blob, ou null si jsPDF est indisponible.
function genererBonIntervention({ ticket, cause, duree, coutPieces, commentaire, diagnostic, signature, modePaiement }) {
  if (!window.jspdf) return null;
  const { jsPDF } = window.jspdf;

// Géocodage gratuit via OpenStreetMap Nominatim (léger usage interne, pas de clé requise)
const geocodeCache = {};
async function geocodeAddress(address) {
  if (!address || !address.trim()) return null;
  if (geocodeCache[address]) return geocodeCache[address];
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q=' + encodeURIComponent(address);
    const r = await fetch(url, { headers: { 'Accept-Language': 'fr' } });
    const json = await r.json();
    if (json && json[0]) {
      const coord = { lat: parseFloat(json[0].lat), lon: parseFloat(json[0].lon) };
      geocodeCache[address] = coord;
      return coord;
    }
  } catch(e) { console.error('geocode error', e); }
  return null;
}
function pause(ms) { return new Promise(res => setTimeout(res, ms)); }

function haversine(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function optimiserOrdre(start, stops) {
  // Plus proche voisin
  const remaining = stops.slice();
  const order = [];
  let current = start;
  while (remaining.length) {
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((s, i) => {
      const d = haversine(current, s.coord);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    });
    const next = remaining.splice(bestIdx, 1)[0];
    order.push(next);
    current = next.coord;
  }
  // Amélioration 2-opt
  const totalDist = (route) => {
    let d = haversine(start, route[0].coord);
    for (let i = 0; i < route.length - 1; i++) d += haversine(route[i].coord, route[i+1].coord);
    return d;
  };
  let route = order;
  let improved = true;
  let guard = 0;
  while (improved && guard < 200) {
    improved = false;
    guard++;
    for (let i = 0; i < route.length - 1; i++) {
      for (let j = i + 1; j < route.length; j++) {
        const newRoute = route.slice(0,i).concat(route.slice(i,j+1).reverse(), route.slice(j+1));
        if (totalDist(newRoute) < totalDist(route) - 0.01) { route = newRoute; improved = true; }
      }
    }
  }
  return route;
}

// "Agence 1..N" selon "Nombre agences". null = pas de client -> repli demo inchange.
async function chargerNomsAgencesClient() {
  const info = window.IKO_CLIENT_INFO;
  const clientId = window.IKO_CLIENT_ID;
  if (!info || !clientId) return null;
  const nbBrut = parseInt(info["Nombre agences"], 10);
  const plafond = Math.max(1, Math.min(10, nbBrut || 10));
  let noms = [];
  try {
    if (info["Nom client"]) {
      const f = 'AND(FIND("' + String(info["Nom client"]).replace(/"/g, '') + '", ARRAYJOIN({Client})), {Actif}=1)';
      const r = await fetch('/api/airtable/Agences?filterByFormula=' + encodeURIComponent(f) + '&maxRecords=50');
      const j = await r.json();
      noms = (j.records || [])
        .filter(a => Array.isArray(a.fields["Client"]) && a.fields["Client"].includes(clientId) && a.fields["Nom agence"])
        .map(a => a.fields["Nom agence"])
        .sort((x, y) => String(x).localeCompare(String(y), "fr", { numeric: true })); // ordre naturel : Agence 1, 2, 3… (et non l'ordre de saisie Airtable)
    }
  } catch (e) {}
  if (!noms.length && nbBrut) noms = Array.from({ length: plafond }, (_, i) => "Agence " + (i + 1));
  return noms.length ? noms.slice(0, plafond) : null;
}

function filtreAvecClient(baseFormula) {
  var nom = window.IKO_CLIENT_INFO && window.IKO_CLIENT_INFO["Nom client"];
  if (!nom) return baseFormula;
  var clause = 'FIND("' + String(nom).replace(/"/g, '\\"') + '", ARRAYJOIN({Compte client}))';

// Jumeau numerique : cherche l'historique des ouvertures mesurees/posees
// pour le client donne, pour que Max le connaisse deja sans que le client
// ait a tout redecrire sur place. Remontee au niveau module (Bloc 1) pour
// etre partagee par Technicien (widget vocal general) et DiagnosticMaxCard
// (diagnostic sur ticket ouvert dans ModalAction).
async function chercherHistoriqueClientMax(nomClient) {
  if (!nomClient) return null;
  try {
    const formuleFiche = "FIND(LOWER(\"" + nomClient.replace(/"/g, '\\"') + "\"),LOWER({Client}))";
    const rFiches = await fetch('/api/airtable/' + encodeURIComponent("Métrés") +
      '?filterByFormula=' + encodeURIComponent(formuleFiche) + '&sort[0][field]=Date&sort[0][direction]=desc&maxRecords=2');
    const jsonFiches = await rFiches.json();
    if (!rFiches.ok || !jsonFiches.records || jsonFiches.records.length === 0) return null;

    const dossiers = [];
    for (const fiche of jsonFiches.records) {
      const formuleOuv = "FIND(\"" + fiche.id + "\",ARRAYJOIN({Métré}))";
      const rOuv = await fetch('/api/airtable/' + encodeURIComponent("Ouvertures Métré") +
        '?filterByFormula=' + encodeURIComponent(formuleOuv) + '&maxRecords=20');
      const jsonOuv = await rOuv.json();
      const ouvertures = (jsonOuv.records || []).map(o => ({
        repere: o.fields["Repère"] || "", type: o.fields["Type"] || "", pose: o.fields["Pose"] || "",
        dimensions: (o.fields["Largeur mm"] || "?") + "x" + (o.fields["Hauteur mm"] || "?") + " mm",
        couleur: o.fields["Couleur / RAL"] || "",
      }));
      dossiers.push({ adresse: fiche.fields["Adresse"] || "", date_mesure: fiche.fields["Date"] || "", ouvertures });
    }
    return dossiers.length ? dossiers : null;
  } catch (e) {
    return null;
  }
}

// Bloc 3 - axe E : historique des tickets SAV precedents du meme client

async function chercherHistoriqueTicketsClientMax(nomClient, idTicketActuel) {
  if (!nomClient) return [];
  try {
    const formule = "FIND(LOWER(\"" + nomClient.replace(/"/g, '\\"') + "\"),LOWER({Client}))";
    const r = await fetch('/api/airtable/tenant/Tickets%20SAV?filterByFormula=' + encodeURIComponent(formule) +
      '&sort[0][field]=Créneau&sort[0][direction]=desc&maxRecords=6');
    const json = await r.json();
    if (!r.ok || !json.records) return [];
    return json.records
      .filter(t => t.id !== idTicketActuel)

      .map(t => ({
        date: t.fields?.["Créneau"] || "",

        statut: t.fields?.Statut || "",
        diagnostic: t.fields?.["IKO Diagnostic"] || t.fields?.Diagnostic || "",
      }));
  } catch (e) {
    return [];
  }
}
