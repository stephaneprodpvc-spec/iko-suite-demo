// Géocodage gratuit via OpenStreetMap Nominatim (léger usage interne, pas de clé requise)
const geocodeCache = {};
async function geocodeAddress(address) {
  if (!address || !address.trim()) return null;
  if (geocodeCache[address]) return geocodeCache[address];
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q=' + encodeURIComponent(address);
    const r = await fetch(url, { headers: { 'Accept-Language': 'fr' } });
    const json = await r.json();
    if (json && json[0]) {
      const coord = { lat: parseFloat(json[0].lat), lon: parseFloat(json[0].lon) };
      geocodeCache[address] = coord;
      return coord;
    }
  } catch(e) { console.error('geocode error', e); }
  return null;
}
function pause(ms) { return new Promise(res => setTimeout(res, ms)); }

function haversine(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function optimiserOrdre(start, stops) {
  // Plus proche voisin
  const remaining = stops.slice();
  const order = [];
  let current = start;
  while (remaining.length) {
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((s, i) => {
      const d = haversine(current, s.coord);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    });
    const next = remaining.splice(bestIdx, 1)[0];
    order.push(next);
    current = next.coord;
  }
  // Amélioration 2-opt
  const totalDist = (route) => {
    let d = haversine(start, route[0].coord);
    for (let i = 0; i < route.length - 1; i++) d += haversine(route[i].coord, route[i+1].coord);
    return d;
  };
  let route = order;
  let improved = true;
  let guard = 0;
  while (improved && guard < 200) {
    improved = false;
    guard++;
    for (let i = 0; i < route.length - 1; i++) {
      for (let j = i + 1; j < route.length; j++) {
        const newRoute = route.slice(0,i).concat(route.slice(i,j+1).reverse(), route.slice(j+1));
        if (totalDist(newRoute) < totalDist(route) - 0.01) { route = newRoute; improved = true; }
      }
    }
  }
  return route;
}

function ModalAction({ ticket, onClose, onDone }) {
  const [mode, setMode] = React.useState(ticket.fields?.Statut === "Devis envoyé" ? "debloquer" : null);
  const [commentaire, setCommentaire] = React.useState("");
  const [newDate, setNewDate] = React.useState("");
  const [newCreneau, setNewCreneau] = React.useState("Matin (8h30 — 12h00)");
  const [saving, setSaving] = React.useState(false);
  const [tags, setTags] = React.useState([]);
  const [explication, setExplication] = React.useState("");
  const today = new Date().toISOString().split('T')[0];

  const TAGS_DEVIS = [
    "Pièce détachée à commander",
    "Intervention complémentaire nécessaire",
    "Dommage plus important que prévu",
    "Matériel spécifique requis",
    "Autre",
  ];
  const toggleTag = (t) => setTags(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]);

  const confirmer = async () => {
    if (mode === "replanifier" && !newDate) return;
    if (mode === "debloquer" && !newDate) return;
    if (mode === "annuler" && !commentaire.trim()) return;
    if (mode === "devis" && !explication.trim()) return;
    setSaving(true);
    try {
      const fields = {};
      let dateLabelDeblocage = "";
      let noteToken = "";
      if (mode === "terminer") {
        fields.Statut = "Terminé";
        if (commentaire) fields.Commentaire = commentaire;
        noteToken = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
        fields["Note Token"] = noteToken;
      } else if (mode === "annuler") {
        fields.Statut = "Annulé";
        fields.Commentaire = "Annulé : " + commentaire;
        const planningId = ticket.fields?.PlanningID;
        if (planningId) {
          await fetch('/api/airtable/Planning/'+planningId, {
            method:'PATCH',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({fields:{Statut:'Libre'}})
          });
        }
      } else if (mode === "devis") {
        fields.Statut = "Devis à faire";
        const tagsTexte = tags.length ? "[" + tags.join(" · ") + "]\n" : "";
        fields.Diagnostic = tagsTexte + explication;
      } else if (mode === "debloquer") {
        const dateLabel = new Date(newDate+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
        dateLabelDeblocage = newCreneau + ' — ' + dateLabel;
        fields.Statut = "Nouveau";
        fields["Créneau"] = dateLabelDeblocage;
        fields.Commentaire = "Créneau débloqué par le technicien (intervention avancée)" + (commentaire ? " : " + commentaire : "");
      } else {
        fields.Statut = "En cours";

      await fetch('/api/airtable/Tickets%20SAV/'+ticket.id, {
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({fields})
      });
      if (mode === "debloquer") {

function ItineraireModal({ agence, tickets, onClose }) {
  const dernierDepartKey = 'iko_dernier_depart_' + agence;
  const [startAddress, setStartAddress] = React.useState(() => {
    try { return localStorage.getItem(dernierDepartKey) || AGENCE_ADRESSES[agence] || ""; }
    catch(e) { return AGENCE_ADRESSES[agence] || ""; }
  });
  const [step, setStep] = React.useState("form"); // form | loading | result | error
  const [errorMsg, setErrorMsg] = React.useState("");
  const [route, setRoute] = React.useState([]);
  const [mapsUrl, setMapsUrl] = React.useState("");
  const [nbFailed, setNbFailed] = React.useState(0);
  const [gpsLoading, setGpsLoading] = React.useState(false);
  const [departLabel, setDepartLabel] = React.useState("");

  const eligibles = tickets.filter(t => {
    const s = t.fields?.Statut || "Nouveau";
    return s !== "Terminé" && s !== "Annulé" && t.fields?.Adresse && t.fields.Adresse.trim();
  });

  const lancerCalcul = async (startCoord, label) => {
    setDepartLabel(label);
    const stops = [];
    let failed = 0;
    for (const t of eligibles) {
      const fullAddr = t.fields.Adresse + (t.fields.Agence ? ', ' + t.fields.Agence.replace(/\s*\(\d+\)/,'') : '') + ', France';
      const coord = await geocodeAddress(fullAddr);
      if (coord) stops.push({ ticket: t, coord });
      else failed++;
      await pause(1100);
    }
    setNbFailed(failed);
    if (stops.length === 0) { setStep("form"); setErrorMsg("Aucune adresse n'a pu être localisée."); return; }
    const optimized = optimiserOrdre(startCoord, stops);
    setRoute(optimized);
    const originStr = label.startsWith('📍') ? (startCoord.lat + ',' + startCoord.lon) : encodeURIComponent(label);
    const destStr = encodeURIComponent(optimized[optimized.length-1].ticket.fields.Adresse);
    const waypoints = optimized.slice(0, -1).map(s => encodeURIComponent(s.ticket.fields.Adresse)).join('|');
    setMapsUrl('https://www.google.com/maps/dir/?api=1&origin=' + originStr + '&destination=' + destStr + (waypoints ? '&waypoints=' + waypoints : '') + '&travelmode=driving');
    setStep("result");
  };

  const calculer = async () => {
    if (!startAddress.trim()) { setErrorMsg("Indique une adresse de départ."); return; }
    if (eligibles.length === 0) { setErrorMsg("Aucune intervention avec adresse dans cette liste."); return; }
    setStep("loading"); setErrorMsg("");
    const startCoord = await geocodeAddress(startAddress);
    if (!startCoord) { setStep("form"); setErrorMsg("Adresse de départ introuvable, précise-la (ville + code postal)."); return; }
    try { localStorage.setItem(dernierDepartKey, startAddress); } catch(e) {}
    await pause(1100);
    await lancerCalcul(startCoord, startAddress);
  };

  const calculerDepuisGPS = () => {
    if (eligibles.length === 0) { setErrorMsg("Aucune intervention avec adresse dans cette liste."); return; }
    if (!navigator.geolocation) { setErrorMsg("La géolocalisation n'est pas disponible sur cet appareil."); return; }
    setGpsLoading(true); setErrorMsg("");
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        setGpsLoading(false);
        setStep("loading");
        const coord = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        await lancerCalcul(coord, "📍 Ma position actuelle");
      },
      (err) => {
        setGpsLoading(false);
        setErrorMsg("Impossible de récupérer ta position (autorise la géolocalisation dans les réglages du navigateur).");
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const imprimer = () => {
    const lignes = route.map((s, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${s.ticket.fields?.["Créneau"]||""}</td>
        <td>${s.ticket.fields?.Name||""}</td>
        <td>${s.ticket.fields?.Client||""}</td>
        <td>${s.ticket.fields?.Adresse||""}</td>
        <td>${s.ticket.fields?.["Téléphone"]||""}</td>
      </tr>`).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Itinéraire — ${agence}</title>
      <style>
        body{font-family:Arial,sans-serif;padding:24px;color:#111;}
        h1{font-size:18px;margin-bottom:2px;}
        .sub{color:#666;font-size:11px;margin-bottom:16px;}
        table{width:100%;border-collapse:collapse;font-size:11px;}
        th{background:#0D0D0D;color:#fff;text-align:left;padding:7px 9px;}
        td{border-bottom:1px solid #ddd;padding:7px 9px;vertical-align:top;}
        tr:nth-child(even){background:#f7f7f7;}
        .footer{margin-top:16px;font-size:9px;color:#999;}
        .toolbar{display:flex;gap:10px;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #F0DFA8;flex-wrap:wrap;}
        .toolbar button, .toolbar a{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:700;padding:11px 20px;border-radius:10px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;line-height:1;}
        .btn-close{background:#F3F4F6;color:#374151;border:1px solid #E2E2E2 !important;}
        .btn-print{background:#0D0D0D;color:#fff;box-shadow:0 2px 10px rgba(0,26,66,0.25);}
        @media print { @page { size: landscape; margin: 12mm; } .toolbar{display:none;} }
      </style></head><body>
      <div class="toolbar">
        <button class="btn-close" onclick="window.close()"><span>←</span><span>Fermer</span></button>
        <button class="btn-print" onclick="window.print()"><span>🖨️</span><span>Imprimer / PDF</span></button>
      </div>
      <h1>Iko Suite — Itinéraire optimisé</h1>
      <div class="sub">${agence} — Départ : ${departLabel} — ${route.length} arrêt(s)</div>
      <table><thead><tr>
        <th>#</th><th>Créneau</th><th>N° Ticket</th><th>Client</th><th>Adresse</th><th>Téléphone</th>
      </tr></thead><tbody>${lignes}</tbody></table>
      <div class="footer">Iko Suite — Itinéraire calculé automatiquement (ordre indicatif, à ajuster selon le trafic)</div>
      </body></html>`;
    const w = window.open('', '_blank');
    w.document.write(html);
    w.document.close();
  };

  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal-box">
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"16px"}}>
          <div>
            <div style={{fontSize:"16px",fontWeight:"900",color:C.white}}>🗺️ Itinéraire optimisé</div>
            <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{eligibles.length} intervention(s) dans cette liste</div>
          </div>
          <button onClick={onClose} style={{background:"#F3F4F6",border:"1px solid "+C.border,color:C.muted,borderRadius:"8px",width:"30px",height:"30px",cursor:"pointer",fontSize:"16px"}}>✕</button>
        </div>

        {step === "form" && (
          <>
            <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Point de départ</label>
            <input value={startAddress} onChange={e => setStartAddress(e.target.value)} placeholder="Adresse de l'agence ou point de départ"/>
            <div style={{fontSize:"10px",color:C.muted,marginTop:"6px",marginBottom:"6px"}}>Retient automatiquement ton dernier point de départ (domicile, chantier, agence...) — modifiable à chaque fois.</div>
            {AGENCE_ADRESSES[agence] && startAddress !== AGENCE_ADRESSES[agence] && (
              <button onClick={() => setStartAddress(AGENCE_ADRESSES[agence])} style={{background:"none",border:"none",color:C.or,fontSize:"10px",cursor:"pointer",textDecoration:"underline",padding:0,marginBottom:"14px",display:"block"}}>↺ Repartir de l'adresse de l'agence</button>
            )}

const MOIS = {janvier:1,février:2,mars:3,avril:4,mai:5,juin:6,juillet:7,août:8,septembre:9,octobre:10,novembre:11,décembre:12};
const parseDateCreneau = (creneau) => {
  if (!creneau) return null;
  const match = creneau.match(/(\d+)\s+(\w+)(?:\s+(\d{4}))?/g);
  if (!match) return null;
  const last = match[match.length-1];
  const parts = last.match(/(\d+)\s+(\w+)(?:\s+(\d{4}))?/);
  if (!parts) return null;
  const day = parseInt(parts[1]);
  const month = MOIS[parts[2].toLowerCase()];
  if (!month) return null;
  const year = parts[3] ? parseInt(parts[3]) : new Date().getFullYear();
  return new Date(year, month-1, day);
};

function Technicien({ agence, onClose }) {
  const [tickets, setTickets] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [onglet, setOnglet] = React.useState("aujourd_hui");
  const [selectedTicket, setSelectedTicket] = React.useState(null);
  const [itineraireOpen, setItineraireOpen] = React.useState(false);
  const [noteOpen, setNoteOpen] = React.useState(false);
  const [lastRefresh, setLastRefresh] = React.useState(null);
  const [maxOuvert, setMaxOuvert] = React.useState(false);
  const [maxEcoute, setMaxEcoute] = React.useState(false);
  const [maxEnCours, setMaxEnCours] = React.useState(false);
  const [maxDernier, setMaxDernier] = React.useState("");
  const [maxErreur, setMaxErreur] = React.useState("");
  const [maxTexte, setMaxTexte] = React.useState("");

  const charger = async () => {
    setLoading(true);
    try {
      const filter = encodeURIComponent('{Agence}="'+agence+'"');
      const url = '/api/airtable/Tickets%20SAV?filterByFormula='+filter+'&sort[0][field]=Name&sort[0][direction]=desc&maxRecords=100';
      const r = await fetch(url, {});
      const json = await r.json();
      setTickets(json.records||[]);
      setLastRefresh(new Date().toLocaleTimeString('fr-FR'));
    } catch(e) { console.error(e); }
    setLoading(false);
  };

  React.useEffect(() => { charger(); }, [agence]);

  const todayStr = new Date().toLocaleDateString('fr-FR');
  const todayLong = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

  const filtrer = (t) => {
    const creneau = (t.fields?.["Créneau"] || "").toLowerCase();
    const statut = t.fields?.Statut || "Nouveau";
    if (onglet === "aujourd_hui") return (creneau.includes(todayStr) || creneau.includes(todayLong.toLowerCase())) && statut !== "Terminé" && statut !== "Annulé";
    if (onglet === "a_venir") return statut !== "Terminé" && statut !== "Annulé";
    if (onglet === "urgent") return t.fields?.Qualification === "Oui" && statut !== "Terminé" && statut !== "Annulé";
    if (onglet === "devis") return statut === "Devis à faire" || statut === "Devis envoyé" || statut === "Devis refusé";
    if (onglet === "termines") return statut === "Terminé";
    if (onglet === "annules") return statut === "Annulé";
    return true;
  };

  const filtered = tickets.filter(filtrer);
  const nbAujourdhui = tickets.filter(t => { const c=(t.fields?.["Créneau"]||"").toLowerCase(); return c.includes(todayStr)||c.includes(todayLong.toLowerCase()); }).length;
  const nbAVenir = tickets.filter(t => { const s=t.fields?.Statut||"Nouveau"; return s!=="Terminé"&&s!=="Annulé"; }).length;
  const nbUrgent = tickets.filter(t => { const s=t.fields?.Statut||"Nouveau"; return t.fields?.Qualification==="Oui" && s!=="Terminé" && s!=="Annulé"; }).length;
  const nbDevisAttente = tickets.filter(t => t.fields?.Statut==="Devis à faire"||t.fields?.Statut==="Devis envoyé").length;
  const notesAgence = tickets.filter(t => typeof t.fields?.Note === "number");
  const moyenneAgence = notesAgence.length ? (notesAgence.reduce((s,t) => s + t.fields.Note, 0) / notesAgence.length) : null;
  const nbTermines = tickets.filter(t => t.fields?.Statut==="Terminé").length;
  const nbAnnules = tickets.filter(t => t.fields?.Statut==="Annulé").length;
  const agenceShort = agence.replace(/ \(\d+\)/,"");

  const imprimerSemaine = () => {
    const now = new Date();
    const jourSemaine = now.getDay();
    const decalageLundi = jourSemaine === 0 ? -6 : 1 - jourSemaine;
    const lundi = new Date(now); lundi.setDate(now.getDate() + decalageLundi); lundi.setHours(0,0,0,0);
    const dimanche = new Date(lundi); dimanche.setDate(lundi.getDate() + 6); dimanche.setHours(23,59,59,999);

    const semaine = tickets
      .filter(t => t.fields?.Statut !== "Annulé")
      .map(t => ({ t, date: parseDateCreneau(t.fields?.["Créneau"]) }))
      .filter(x => x.date && x.date >= lundi && x.date <= dimanche)
      .sort((a,b) => a.date - b.date);

    const fmtJour = (d) => d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
    const lignes = semaine.map(({t}) => `
      <tr>
        <td>${t.fields?.["Créneau"]||""}</td>
        <td>${t.fields?.Name||""}</td>
        <td>${t.fields?.Client||""}</td>
        <td>${t.fields?.Adresse||""}</td>
        <td>${t.fields?.["Téléphone"]||""}</td>
        <td>${t.fields?.Produit||""} — ${t.fields?.["Problème"]||""}</td>
      </tr>`).join("");
    const mailBody = encodeURIComponent(
      `Planning technicien — ${agenceShort}\nSemaine du ${fmtJour(lundi)} au ${fmtJour(dimanche)}\n\n` +
      semaine.map(({t}) => `${t.fields?.["Créneau"]||""} — ${t.fields?.Name||""} — ${t.fields?.Client||""} — ${t.fields?.Adresse||""} — ${t.fields?.["Téléphone"]||""} — ${t.fields?.Produit||""} / ${t.fields?.["Problème"]||""}`).join("\n")
    );
    const mailSubject = encodeURIComponent(`Planning technicien — ${agenceShort} — Semaine du ${fmtJour(lundi)}`);
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Ma semaine — ${agenceShort}</title>
      <style>
        body{font-family:Arial,sans-serif;padding:24px;color:#111;}
        h1{font-size:18px;margin-bottom:2px;}
        .sub{color:#666;font-size:11px;margin-bottom:16px;}
        table{width:100%;border-collapse:collapse;font-size:10px;}
        th{background:#111;color:#fff;text-align:left;padding:6px 8px;}
        td{border-bottom:1px solid #ddd;padding:6px 8px;vertical-align:top;}
        tr:nth-child(even){background:#f7f7f7;}
        .footer{margin-top:16px;font-size:9px;color:#999;}
        .toolbar{display:flex;gap:10px;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #F0DFA8;flex-wrap:wrap;}
        .toolbar button, .toolbar a{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:700;padding:11px 20px;border-radius:10px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;line-height:1;}
        .btn-close{background:#F3F4F6;color:#374151;border:1px solid #E2E2E2 !important;}
        .btn-print{background:#0D0D0D;color:#fff;box-shadow:0 2px 10px rgba(0,26,66,0.25);}
        .btn-mail{background:#FF6B00;color:#111;box-shadow:0 2px 10px rgba(218,178,57,0.35);}
        @media print { @page { size: landscape; margin: 12mm; } .toolbar{display:none;} }
      </style></head><body>
      <div class="toolbar">
        <button class="btn-close" onclick="window.close()"><span>←</span><span>Fermer</span></button>
        <button class="btn-print" onclick="window.print()"><span>🖨️</span><span>Imprimer / PDF</span></button>
        <a class="btn-mail" href="mailto:?subject=${mailSubject}&body=${mailBody}"><span>📧</span><span>Envoyer par email</span></a>
      </div>
      <h1>Iko Suite — Planning technicien</h1>
      <div class="sub">${agenceShort} — Semaine du ${fmtJour(lundi)} au ${fmtJour(dimanche)} — ${semaine.length} intervention(s)</div>
      <table><thead><tr>
        <th>Créneau</th><th>N° Ticket</th><th>Client</th><th>Adresse</th><th>Téléphone</th><th>Produit / Problème</th>
      </tr></thead><tbody>${lignes || '<tr><td colspan="6" style="text-align:center;color:#999;">Aucune intervention cette semaine</td></tr>'}</tbody></table>
      <div class="footer">Iko Suite — Document généré automatiquement</div>
      </body></html>`;
    const w = window.open('', '_blank');
    w.document.write(html);
    w.document.close();
  };

  // ---- Max, l'assistant vocal du technicien ----
  const debloquerVoixIOS = () => {
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  };

  const parlerMax = (texte) => {
    try {
      if (!texte || !('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = 'fr-FR';
      u.rate = 1.02;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  };

  const executerActionsMax = (actions) => {
    (actions || []).forEach(a => {
      if (a.name === 'filtrer_onglet') {
        setOnglet(a.input.onglet);
      } else if (a.name === 'ouvrir_itineraire') {
        setItineraireOpen(true);
      } else if (a.name === 'ouvrir_ticket' && a.input.ticket_id) {
        const t = tickets.find(x => x.id === a.input.ticket_id);
        if (t) setSelectedTicket(t);
      }
    });
  };

  const envoyerMax = async (transcript) => {
    setMaxEnCours(true);
    setMaxErreur("");
    try {
      const contexteTickets = tickets.slice(0, 100).map(t => ({
        id: t.id,
        numero: t.fields?.Name || "",
        client: t.fields?.Client || "",
        statut: t.fields?.Statut || "",
        produit: t.fields?.Produit || "",
        creneau: t.fields?.Créneau || "",
        urgent: t.fields?.Qualification === "Oui",
      }));
      const r = await fetch('/api/chat-technicien', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ message: transcript, tickets: contexteTickets, ongletActuel: onglet })
      });
      const data = await r.json();
      if (data.erreur) { setMaxErreur(data.erreur); setMaxEnCours(false); return; }
      executerActionsMax(data.actions || []);
      const texte = data.reponse || "C'est fait.";
      setMaxDernier(texte);
      parlerMax(texte);
    } catch (e) {
      setMaxErreur("Connexion impossible. Réessayez.");
    }
    setMaxEnCours(false);
  };

  const lancerEcouteMax = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      const champ = document.getElementById('maxChampTexte');
      if (champ) champ.focus();
      return;
    }
    const reco = new SR();
    reco.lang = 'fr-FR';
    reco.continuous = false;
    reco.interimResults = false;
    reco.onstart = () => { setMaxEcoute(true); setMaxErreur(""); };
    reco.onerror = () => setMaxEcoute(false);
    reco.onend = () => setMaxEcoute(false);
    reco.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      setMaxDernier(transcript);
      envoyerMax(transcript);
    };
    reco.start();
  };

  return (
    <div style={{minHeight:"100vh",background:C.bg,maxWidth:"600px",margin:"0 auto"}}>
      {selectedTicket && (
        <ModalAction ticket={selectedTicket} onClose={() => setSelectedTicket(null)} onDone={() => { setSelectedTicket(null); charger(); }}/>
      )}
      {itineraireOpen && (
        <ItineraireModal agence={agence} tickets={filtered} onClose={() => setItineraireOpen(false)}/>
      )}
      <div style={{background:C.card,borderBottom:"1px solid "+C.border,padding:"14px 20px 10px",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
            <div style={{width:"100px",height:"48px",background:"#FFFFFF",borderRadius:"10px",display:"flex",alignItems:"center",justifyContent:"center",padding:"3px",boxSizing:"border-box"}}>
              <img src={IKO_LOGO} alt="Iko" style={{width:"100%",height:"100%",objectFit:"contain"}}/>
            </div>
            <div>
              <div style={{fontSize:"13px",fontWeight:"700",color:C.muted}}>Technicien</div>
              <div style={{fontSize:"11px",color:C.or,marginTop:"1px",fontWeight:"700"}}>📍 {agenceShort}</div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
            <button onClick={charger} title="Rafraîchir" style={{background:C.orDim,border:"1px solid "+C.orBord,color:C.or,borderRadius:"8px",width:"30px",height:"30px",fontSize:"13px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>↺</button>
            <button onClick={onClose} title="Fermer la session" style={{background:"rgba(220,38,38,0.08)",border:"1px solid rgba(220,38,38,0.25)",color:"rgba(220,38,38,0.85)",borderRadius:"8px",width:"30px",height:"30px",cursor:"pointer",fontSize:"14px",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>✕</button>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"6px",marginTop:"10px",flexWrap:"wrap"}}>
          <button onClick={imprimerSemaine} title="Imprimer ma semaine" style={{background:C.orDim,border:"1px solid "+C.orBord,color:C.or,borderRadius:"8px",padding:"0 12px",height:"30px",fontSize:"11px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px",whiteSpace:"nowrap",flexShrink:0}}>🖨️ Ma semaine</button>
            <button onClick={() => setItineraireOpen(true)} title="Itinéraire optimisé" style={{background:"#0D0D0D",border:"1px solid #0D0D0D",color:"#fff",borderRadius:"8px",padding:"0 12px",height:"30px",fontSize:"11px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px",whiteSpace:"nowrap",flexShrink:0}}>🗺️ Itinéraire</button>
            <button onClick={() => setOnglet("devis")} title="Devis en attente" style={{background:onglet==="devis"?"#FF6B00":"rgba(218,178,57,0.12)",border:"1px solid #FF6B00",color:onglet==="devis"?"#111":"#8a6d1f",borderRadius:"8px",padding:"0 12px",height:"30px",fontSize:"11px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px",whiteSpace:"nowrap",flexShrink:0}}>
              📋 Devis {nbDevisAttente > 0 && <span style={{background:onglet==="devis"?"#0D0D0D":"#FF6B00",color:"#fff",borderRadius:"10px",padding:"0 5px",fontSize:"10px"}}>{nbDevisAttente}</span>}
            </button>
            <button onClick={() => setNoteOpen(true)} title="Ma note client" style={{background:"rgba(217,119,6,0.12)",border:"1px solid #FF6B00",color:"#8a5a06",borderRadius:"8px",padding:"0 12px",height:"30px",fontSize:"11px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px",whiteSpace:"nowrap",flexShrink:0}}>
              ⭐ {moyenneAgence ? moyenneAgence.toFixed(1) : "—"}
            </button>
            {noteOpen && (
              <div className="modal-overlay" onClick={e => e.target===e.currentTarget && setNoteOpen(false)}>
                <div className="modal-box" style={{textAlign:"center"}}>
                  <div style={{fontSize:"14px",fontWeight:"900",color:C.white,marginBottom:"14px"}}>⭐ Note client — {agenceShort}</div>
                  {moyenneAgence ? (
                    <>
                      <div style={{fontSize:"40px",fontWeight:"900",color:"#FF6B00",marginBottom:"6px"}}>{moyenneAgence.toFixed(1)} / 5</div>
                      <div style={{fontSize:"20px",marginBottom:"10px"}}>{"⭐".repeat(Math.round(moyenneAgence))}{"☆".repeat(5-Math.round(moyenneAgence))}</div>
                      <div style={{fontSize:"11px",color:C.muted,marginBottom:"18px"}}>Basé sur {notesAgence.length} avis client{notesAgence.length>1?"s":""}</div>
                      <div style={{display:"flex",flexDirection:"column",gap:"8px",maxHeight:"220px",overflowY:"auto",textAlign:"left"}}>
                        {notesAgence.filter(t => t.fields?.["Note Commentaire"]).slice(0,5).map(t => (
                          <div key={t.id} style={{background:C.card2,border:"1px solid "+C.border,borderRadius:"8px",padding:"8px 10px",fontSize:"11px"}}>
                            <div style={{color:"#FF6B00",marginBottom:"3px"}}>{"⭐".repeat(t.fields.Note)}</div>
                            <div style={{color:C.muted,fontStyle:"italic"}}>{t.fields["Note Commentaire"]}</div>
                          </div>
                        ))}
                      </div>
                    </>
                  ) : (
                    <div style={{fontSize:"12px",color:C.muted,padding:"20px 0"}}>Aucun avis client pour le moment.</div>
                  )}
                  <button onClick={() => setNoteOpen(false)} style={{width:"100%",marginTop:"16px",padding:"11px",background:"transparent",color:C.muted,border:"1px solid "+C.border,borderRadius:"10px",fontSize:"12px",cursor:"pointer"}}>Fermer</button>
                </div>
              </div>
            )}
        </div>
        <div style={{display:"flex",gap:"6px",marginTop:"12px",flexWrap:"wrap"}}>
          {[["aujourd_hui","Aujourd'hui",nbAujourdhui],["a_venir","À venir",nbAVenir],["urgent","⚡ Urgent",nbUrgent],["termines","Terminés",nbTermines],["annules","Annulés",nbAnnules]].map(([id,label,count]) => (
            <div key={id} onClick={() => setOnglet(id)}
              style={{flex:"1",minWidth:"78px",background:onglet===id?C.orDim:"#FFFFFF",border:"2px solid "+(onglet===id?C.or:C.border),borderRadius:"10px",padding:"8px 6px",cursor:"pointer",textAlign:"center",transition:"border-color 0.15s"}}>
              <div style={{fontSize:"20px",fontWeight:"900",color:onglet===id?C.or:C.white,fontFamily:"monospace",lineHeight:1}}>{count}</div>
              <div style={{fontSize:"10px",fontWeight:"700",color:onglet===id?C.or:C.muted,marginTop:"2px",whiteSpace:"nowrap"}}>{label}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{padding:"16px"}}>
        {loading && <div style={{textAlign:"center",padding:"60px",color:C.muted}}>Chargement...</div>}
        {!loading && filtered.length===0 && (
          <div style={{textAlign:"center",padding:"60px 20px",color:C.muted}}>
            <div style={{fontSize:"40px",marginBottom:"12px"}}>{onglet==="aujourd_hui"?"🎉":onglet==="urgent"?"✅":onglet==="devis"?"📋":onglet==="termines"?"📋":onglet==="annules"?"🚫":"📭"}</div>
            <div style={{fontSize:"14px",fontWeight:"700",color:C.text}}>
              {onglet==="aujourd_hui"?"Aucune intervention aujourd'hui":onglet==="urgent"?"Aucune intervention urgente":onglet==="devis"?"Aucun devis en attente":onglet==="termines"?"Aucune intervention terminée":onglet==="annules"?"Aucune intervention annulée":"Aucune intervention à venir"}
            </div>
          </div>
        )}
        <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
          {filtered.map(t => <TicketCard key={t.id} ticket={t} onAction={setSelectedTicket}/>)}
        </div>
        {lastRefresh && <div style={{textAlign:"center",fontSize:"9px",color:C.muted,marginTop:"20px"}}>Dernière mise à jour : {lastRefresh}</div>}
      </div>

      {/* Widget vocal Max */}
      <div style={{position:"fixed",bottom:"24px",right:"24px",zIndex:200,display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"10px"}}>
        {maxOuvert && (
          <div style={{width:"270px",background:C.card,border:"1px solid "+C.border,borderRadius:"14px",padding:"16px",boxShadow:"0 10px 40px rgba(0,0,0,0.35)"}}>
            <div style={{fontSize:"12px",fontWeight:"800",color:"#fff",marginBottom:"8px",letterSpacing:"1px"}}>MAX</div>
            <div style={{fontSize:"12px",color:C.muted,minHeight:"36px"}}>
              {maxEcoute ? "Je vous écoute..." : maxEnCours ? "..." : maxDernier ? maxDernier : "Dites par exemple : \"Montre les urgents\" ou \"Ouvre l'itinéraire\"."}
            </div>
            {maxErreur && <div style={{fontSize:"11px",color:C.rouge,marginTop:"6px"}}>{maxErreur}</div>}
            <div style={{display:"flex",gap:"6px",marginTop:"10px"}}>
              <input id="maxChampTexte" type="text" value={maxTexte}
                onChange={e => setMaxTexte(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter" && maxTexte.trim()) { debloquerVoixIOS(); envoyerMax(maxTexte.trim()); setMaxTexte(""); } }}
                placeholder="Tapez ou dictez (🎤 clavier)"
                style={{flex:1,padding:"8px 10px",borderRadius:"8px",background:"#0D0D0D",border:"1px solid "+C.border,color:"#fff",fontSize:"12px"}}/>
              <button onClick={() => { if (maxTexte.trim()) { debloquerVoixIOS(); envoyerMax(maxTexte.trim()); setMaxTexte(""); } }}
                style={{padding:"8px 12px",borderRadius:"8px",background:"#fff",border:"none",color:"#111",fontWeight:"800",cursor:"pointer"}}>→</button>
            </div>
          </div>
        )}
        <div style={{display:"flex",gap:"10px",alignItems:"center"}}>
          {maxOuvert && (
            <button onClick={() => setMaxOuvert(false)} style={{width:"36px",height:"36px",borderRadius:"50%",background:C.card,border:"1px solid "+C.border,color:C.muted,cursor:"pointer",fontSize:"14px"}}>✕</button>
          )}
          <button onClick={() => { debloquerVoixIOS(); setMaxOuvert(true); lancerEcouteMax(); }}
            style={{width:"58px",height:"58px",borderRadius:"50%",background:"radial-gradient(circle at 35% 30%, #4a4a4a, #0D0D0D 55%, #000000 100%)",border:"2px solid #FF6B00",color:"#fff",cursor:"pointer",fontSize:"24px",boxShadow:"0 0 26px rgba(255,107,0,0.35)",animation:maxEcoute?"pulseMax 1.2s infinite":"none"}}>
            🎙️
          </button>
        </div>
      </div>
      <style>{`@keyframes pulseMax{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}`}</style>
    </div>
  );
}

function Login({ onLogin }) {
  const [pwd, setPwd] = React.useState("");
  const [error, setError] = React.useState(false);
  const [show, setShow] = React.useState(false);

  const tenter = () => {
    const agence = PASSWORDS[pwd.trim()];
    if (agence) { onLogin(agence); }
    else { setError(true); setTimeout(() => setError(false), 2000); }
  };

  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",position:"relative"}}>
      <button onClick={() => window.location.href = "/"} title="Fermer"
        style={{position:"absolute",top:"20px",right:"20px",background:"rgba(220,38,38,0.08)",border:"1px solid rgba(220,38,38,0.25)",color:"rgba(220,38,38,0.85)",borderRadius:"8px",width:"34px",height:"34px",cursor:"pointer",fontSize:"16px",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
      <div style={{width:"100%",maxWidth:"340px"}}>
        <div style={{textAlign:"center",marginBottom:"36px"}}>
          <div style={{width:"190px",height:"100px",background:"#FFFFFF",borderRadius:"16px",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",boxShadow:"0 8px 32px rgba(218,178,57,0.3)",padding:"8px",boxSizing:"border-box"}}>
            <img src={IKO_LOGO} alt="Iko" style={{width:"100%",height:"100%",objectFit:"contain"}}/>
          </div>
          <div style={{fontSize:"11px",color:C.muted,marginTop:"6px",letterSpacing:"2px",textTransform:"uppercase"}}>Espace Technicien</div>
        </div>
        <div style={{background:C.card,border:"1px solid "+(error?"rgba(220,38,38,0.4)":C.orBord),borderRadius:"16px",padding:"24px"}}>
          <div style={{position:"relative",marginBottom:"14px"}}>
            <input type={show?"text":"password"} placeholder="Code agence" value={pwd}
              onChange={e => setPwd(e.target.value)} onKeyDown={e => e.key==="Enter"&&tenter()}
              style={{paddingRight:"40px",fontSize:"16px",textAlign:"center",letterSpacing:"2px"}}/>
            <button onClick={() => setShow(!show)} style={{position:"absolute",right:"12px",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:"16px",width:"auto",padding:"0"}}>
              {show?"🙈":"👁️"}
            </button>
          </div>
          {error && <div style={{fontSize:"11px",color:C.rouge,marginBottom:"10px",textAlign:"center"}}>Code incorrect</div>}
          <button onClick={tenter} style={{width:"100%",padding:"14px",background:C.or,color:"#111",border:"none",borderRadius:"10px",fontSize:"14px",fontWeight:"900",cursor:"pointer"}}>
            Accéder →
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [agence, setAgence] = React.useState(null);
  return agence ? <Technicien agence={agence} onClose={() => setAgence(null)}/> : <Login onLogin={setAgence}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
