function Login({ onLogin }) {
  const [etat, setEtat] = React.useState("verification"); // verification | choix-agence | refuse
  const [agenceChoisie, setAgenceChoisie] = React.useState(AGENCES_DEFAUT[0]);

  React.useEffect(() => {
    window.IKO_CLIENT_READY.then(() => {
      if (window.IKO_ACCES_REFUSE) { setEtat("refuse"); return; }
      if (window.IKO_ROLE === "SUPER_ADMIN_IKO") { onLogin("global"); return; }
      // Agences du client (1 a 10). Une seule : pas de choix, selection automatique.
      chargerAgencesTech().then(liste => {
        if (liste.length === 1) { onLogin(liste[0]); return; }
        setAgenceChoisie(liste[0]);
        setEtat("choix-agence"); // TECHNICIEN : choix metier, pas une authentification
      });
    });
  }, []);

  if (etat === "verification") {
    return (
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
        <div style={{fontSize:"13px",color:C.muted}}>Vérification de la session…</div>
      </div>
    );
  }

  if (etat === "refuse") {
    return (
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
        <div style={{textAlign:"center",maxWidth:"320px"}}>
          <div style={{fontSize:"13px",color:C.rouge,marginBottom:"8px",fontWeight:"700"}}>Accès refusé</div>
          <div style={{fontSize:"12px",color:C.muted}}>Votre compte n'a pas les droits nécessaires pour accéder à l'Espace Technicien.</div>
        </div>
      </div>
    );
  }

  // etat === "choix-agence" : choix metier post-authentification, pas un mot de passe.
  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",position:"relative"}}>
      <div style={{width:"100%",maxWidth:"340px"}}>
        <div style={{textAlign:"center",marginBottom:"36px"}}>
          <div style={{width:"190px",height:"100px",background:"#FFFFFF",borderRadius:"16px",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",boxShadow:"0 8px 32px rgba(var(--iko-primary-rgb),0.3)",padding:"8px",boxSizing:"border-box"}}>
            <img data-iko-logo src={CONFIG_ENTREPRISE.logoUrl || IKO_LOGO} alt="Iko" style={{width:"100%",height:"100%",objectFit:"contain"}}/>
          </div>
          <div style={{fontSize:"11px",color:C.muted,marginTop:"6px",letterSpacing:"2px",textTransform:"uppercase"}}>Espace Technicien</div>
        </div>
        <div style={{background:C.card,border:"1px solid "+C.orBord,borderRadius:"16px",padding:"24px"}}>
          <div style={{fontSize:"12px",color:C.muted,marginBottom:"10px",textAlign:"center"}}>Choisissez votre agence</div>
          <select value={agenceChoisie} onChange={e => setAgenceChoisie(e.target.value)} style={{marginBottom:"14px"}}>
            {AGENCES_DEFAUT.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
          <button onClick={() => onLogin(agenceChoisie)} style={{width:"100%",padding:"14px",background:C.or,color:"var(--iko-dark)",border:"none",borderRadius:"10px",fontSize:"14px",fontWeight:"900",cursor:"pointer"}}>
            Accéder →
          </button>
        </div>
      </div>
    </div>
  );
}

function BlocageAcces() {
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'14px',padding:'24px',textAlign:'center',background:'#0A0A0A',color:'var(--iko-bg-clair)',fontFamily:'-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif'}}>
      <div style={{fontSize:'40px'}}>🔒</div>
      <div style={{fontSize:'18px',fontWeight:700}}>Accès suspendu</div>
      <div style={{fontSize:'14px',opacity:0.75,maxWidth:'380px'}}>L'accès à cet espace est temporairement suspendu. Merci de contacter votre interlocuteur RSIA Conseil pour régulariser la situation.</div>
    </div>
  );
}

function App() {
  const [agence, setAgence] = React.useState(null);
  const [bloque, setBloque] = React.useState(false);
  React.useEffect(() => {
    window.IKO_CLIENT_READY.then(() => {
      if (window.IKO_CLIENT_INFO && window.IKO_CLIENT_INFO["Accès bloqué"] === true) setBloque(true);
    });
  }, []);
  if (bloque) return <BlocageAcces/>;
  return agence ? <Technicien agence={agence} onClose={() => setAgence(null)}/> : <Login onLogin={setAgence}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

<script>

<script>
  // Bandeau "Installer l'appli" + bandeau "Hors ligne" (technicien)
  (function () {
    var K = 'ikoInstallMasque';
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    var ua = navigator.userAgent || '';
    var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var evt = null;
    function masque() { try { return localStorage.getItem(K) === '1'; } catch (e) { return false; } }
    function style(el, css) { el.style.cssText = css; }
    var base = 'position:fixed;left:12px;right:12px;z-index:9999;border-radius:16px;padding:12px 14px;font:600 13px -apple-system,Segoe UI,sans-serif;color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);';
    var inst = null;
    function montrerInstall(contenu, avecBouton, force) {
      if (inst) fermer();
      if (!force && (standalone || masque())) return;
      inst = document.createElement('div');
      style(inst, base + 'bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(20,20,22,.94);border:1px solid rgba(255,107,0,.6);');
      var t = document.createElement('div'); t.style.flex = '1'; t.innerHTML = contenu; inst.appendChild(t);
      if (avecBouton) {
        var b = document.createElement('button'); b.textContent = 'Installer';
        style(b, 'background:linear-gradient(180deg,#ff963c,#ff6b00);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:800;font-size:13px;');
        b.onclick = function () { if (evt) { evt.prompt(); evt.userChoice.finally(function () { evt = null; fermer(); }); } };
        inst.appendChild(b);
      }
      var x = document.createElement('button'); x.textContent = '✕'; x.setAttribute('aria-label', 'Fermer');
      style(x, 'background:transparent;color:#fff;border:0;font-size:18px;padding:6px;');
      x.onclick = function () { fermer(); };
      inst.appendChild(x);
      document.body.appendChild(inst);
    }
    function fermer() { if (inst && inst.parentNode) inst.parentNode.removeChild(inst); inst = null; }
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); evt = e; });
    window.addEventListener('appinstalled', function () { standalone = true; fermer(); });
    // Appelée par l'icône 📲 de l'en-tête
    window.ikoInstaller = function () {
      if (standalone) { montrerInstall('✅ <b>L\'appli est déjà installée</b> sur cet appareil.', false, true); return; }
      if (evt) { evt.prompt(); evt.userChoice.finally(function () { evt = null; }); return; }
      if (ios) montrerInstall('📲 <b>Installer sur iPhone / iPad</b><br>1. Ouvrez cette page dans <b>Safari</b> (pas dans Mail ou une autre appli).<br>2. Touchez <b>Partager</b> (carré avec une flèche).<br>3. Choisissez <b>« Sur l\'écran d\'accueil »</b>.', false, true);
      else montrerInstall('📲 <b>Installer l\'appli</b><br>Dans le menu du navigateur (⋮ ou icône dans la barre d\'adresse), choisissez <b>« Installer l\'application »</b> ou <b>« Ajouter à l\'écran d\'accueil »</b>.', false, true);
    };
    var off = null;
    function majReseau() {
      if (!navigator.onLine) {
        if (off) return;
        off = document.createElement('div');
        style(off, base + 'top:calc(8px + env(safe-area-inset-top));background:#0D0D0D;border:1px solid #FF6B00;justify-content:center;');
        off.textContent = '📡 Hors ligne : les données déjà chargées restent visibles. Les saisies reprennent dès que le réseau revient.';
        document.body.appendChild(off);
      } else if (off) { off.parentNode.removeChild(off); off = null; }
    }
    window.addEventListener('online', majReseau); window.addEventListener('offline', majReseau);
    window.addEventListener('load', majReseau);
  })();
</script>
