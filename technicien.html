                  <b style={{color:"var(--iko-bg-sombre)",fontSize:"11px"}}>🎯 Actions suggérées par IKO</b>
                  {resultat.actions_suggerees.map((a, i) => (
                    <div key={i} style={{background:"#fff",border:"1px solid rgba(0,0,0,0.08)",borderRadius:"8px",padding:"8px",display:"flex",flexDirection:"column",gap:"3px"}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"6px"}}>
                        <span style={{fontSize:"11px",fontWeight:"700",color:C.text}}>{a.action}</span>
                        <span style={{fontSize:"9px",fontWeight:"700",color:COULEURS_PRIORITE_ACTION[a.priorite]||C.muted,whiteSpace:"nowrap"}}>
                          {LABELS_PRIORITE_ACTION[a.priorite] || "Priorité faible"}
                        </span>
                      </div>
                      {a.justification && <div style={{fontSize:"10px",color:C.muted}}>{a.justification}</div>}
                      {a.verification && <div style={{fontSize:"10px",color:"#8a8a8a",fontStyle:"italic"}}>À vérifier avant d'agir : {a.verification}</div>}
                    </div>
                  ))}
                  <div style={{fontSize:"9px",color:C.muted,fontStyle:"italic"}}>Suggestions IKO — à vérifier, le technicien décide.</div>
                </div>
              )}
              <button type="button" onClick={garderDiagnostic} disabled={enregistrementDiagEnCours}
                style={{marginTop:"4px",padding:"7px 12px",borderRadius:"8px",background:enregistrementDiagEnCours?"#D1D5DB":"var(--iko-bg-sombre)",color:"#fff",border:"none",fontSize:"11px",fontWeight:"700",cursor:enregistrementDiagEnCours?"not-allowed":"pointer",alignSelf:"flex-start"}}>
                {enregistrementDiagEnCours ? "⏳..." : diagnosticGarde ? "📌 Mettre à jour le diagnostic gardé" : "📌 Garder ce diagnostic"}
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Bloc 4 - point 4 : bloc compte-rendu (dictée + structuration Max) extrait
// en composant purement présentationnel, réutilisé en mode "terminer" ET
// "devis_place" — évite de dupliquer une seconde fois cette UI. L'état et
// la logique restent centralisés dans ModalAction (props uniquement ici).
function BlocCompteRenduMax({ commentaire, setCommentaire, placeholder, rows,
  enregistrementCREnCours, dicterCompteRendu, arreterDicteeCompteRendu,
  texteDicteBrut, setTexteDicteBrut, structurationEnCours, structurerCompteRendu,
  compteRenduStructure, utiliserCompteRenduStructure }) {
  return (
    <div style={{marginBottom:"14px"}}>
      <label style={{fontSize:"11px",color:C.muted,display:"block",marginBottom:"6px",fontWeight:"700"}}>Commentaire (facultatif)</label>
      <textarea rows={rows || 3} placeholder={placeholder}
        value={commentaire} onChange={e => setCommentaire(e.target.value)} style={{resize:"none"}}/>
      <button type="button" onClick={enregistrementCREnCours ? arreterDicteeCompteRendu : dicterCompteRendu}
        style={{marginTop:"6px",padding:"7px 12px",borderRadius:"8px",background:enregistrementCREnCours?"var(--iko-erreur)":"var(--iko-bg-sombre)",color:"#fff",border:"none",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>
        {enregistrementCREnCours ? "⏹️ Arrêter la dictée" : "🎙️ Dicter le compte-rendu"}
      </button>
      {texteDicteBrut && (
        <div style={{marginTop:"10px"}}>
          <label style={{fontSize:"10px",color:C.muted,display:"block",marginBottom:"4px",fontWeight:"700"}}>Texte dicté (toujours visible, modifiable)</label>
          <textarea rows={2} value={texteDicteBrut} onChange={e => setTexteDicteBrut(e.target.value)} style={{resize:"none",fontSize:"11px"}}/>
          <button type="button" onClick={structurerCompteRendu} disabled={structurationEnCours}
            style={{marginTop:"6px",padding:"7px 12px",borderRadius:"8px",background:structurationEnCours?"#D1D5DB":"var(--iko-primary)",color:"var(--iko-dark)",border:"none",fontSize:"11px",fontWeight:"800",cursor:structurationEnCours?"not-allowed":"pointer"}}>
            {structurationEnCours ? "⏳ Structuration..." : "🧠 Structurer avec Max"}
          </button>
        </div>
      )}
      {compteRenduStructure && (
        <div style={{marginTop:"10px",border:"1px solid rgba(var(--iko-primary-rgb),0.3)",borderRadius:"8px",padding:"10px",fontSize:"11px",display:"flex",flexDirection:"column",gap:"4px"}}>
          {compteRenduStructure.fait_constate && <div><b>Constat</b> · {compteRenduStructure.fait_constate}</div>}
          {compteRenduStructure.diagnostic && <div><b>Diagnostic</b> · {compteRenduStructure.diagnostic}</div>}
          {compteRenduStructure.intervention_realisee && <div><b>Intervention réalisée</b> · {compteRenduStructure.intervention_realisee}</div>}
          {compteRenduStructure.piece_action_necessaire && <div><b>Pièce/action</b> · {compteRenduStructure.piece_action_necessaire}</div>}
          {compteRenduStructure.resultat && <div><b>Résultat</b> · {compteRenduStructure.resultat}</div>}
          {compteRenduStructure.suite_a_donner && <div><b>Suite à donner</b> · {compteRenduStructure.suite_a_donner}</div>}
          <button type="button" onClick={utiliserCompteRenduStructure}
            style={{marginTop:"4px",padding:"7px 12px",borderRadius:"8px",background:"var(--iko-bg-sombre)",color:"#fff",border:"none",fontSize:"11px",fontWeight:"700",cursor:"pointer"}}>
            ✓ Utiliser ce texte pour le commentaire
          </button>
        </div>
      )}
    </div>
  );
}

function ModalAction({ ticket, onClose, onDone }) {
  const [mode, setMode] = React.useState(ticket.fields?.Statut === "Devis envoyé" ? "debloquer" : null);
  // Bloc 4 - point 1 : state du diagnostic remonté ici (au lieu de rester
  // interne à DiagnosticMaxCard) pour pouvoir le fusionner dans le PATCH de
  // confirmer() si le technicien clôture sans avoir cliqué "Garder" manuellement.
  const [resultatDiagnostic, setResultatDiagnostic] = React.useState(null);
  const [diagnosticGarde, setDiagnosticGarde] = React.useState(!!ticket.fields?.["IKO Utilisé"]);
  const [commentaire, setCommentaire] = React.useState("");
  const [pieceTexte, setPieceTexte] = React.useState("");
  const [newDate, setNewDate] = React.useState("");
  const [newCreneau, setNewCreneau] = React.useState("Matin (8h30 — 12h00)");
  const [saving, setSaving] = React.useState(false);
  const [erreurFermeture, setErreurFermeture] = React.useState("");
  const [tags, setTags] = React.useState([]);
  const [explication, setExplication] = React.useState("");
  const today = new Date().toISOString().split('T')[0];

  // Frais diagnostic (cas client non garanti + non existant + technicien
  // sans le matériel sur place) : montant paramétré par client pro dans le
  // Poste de pilotage (window.IKO_CLIENT_INFO, déjà chargé au boot, aucun
  // fetch supplémentaire). Déduit automatiquement du devis si accepté plus
  // tard (géré côté yousign-webhook.js).
  const nonGarantiTicket = /^non/i.test((ticket.fields?.Garantie || "").trim());
  const [clientExistantDevis, setClientExistantDevis] = React.useState(ticket.fields?.["Client existant"] !== false);
  const montantDiagnostic = Number(window.IKO_CLIENT_INFO?.["Montant diagnostic HT"]) || 0;
  const fraisDiagnosticApplicable = nonGarantiTicket && !clientExistantDevis && montantDiagnostic > 0;

  // Devis auto (Iko) : proposé au moment de valider l'intervention. Le
  // technicien peut piocher dans le catalogue du client, et si des lignes
  // sont ajoutées, le devis est généré et envoyé au client automatiquement
  // (PDF + Yousign), sans passer par l'agence.
  const [catalogueAuto, setCatalogueAuto] = React.useState({ produits: [], mo: [], mep: null });
  const [clientInfoAuto, setClientInfoAuto] = React.useState(null);
  const [demoAuto, setDemoAuto] = React.useState(false);
  const [chargementCatalogueAuto, setChargementCatalogueAuto] = React.useState(false);
  const [lignesAuto, setLignesAuto] = React.useState([]);
  const [choixLigneAuto, setChoixLigneAuto] = React.useState("");
  const [qteLigneAuto, setQteLigneAuto] = React.useState(1);
  const [emailAuto, setEmailAuto] = React.useState(ticket.fields?.Email || "");
  const [modePaiementPlace, setModePaiementPlace] = React.useState("");
  const [causeSav, setCauseSav] = React.useState("");
  const [dureeMin, setDureeMin] = React.useState("");
  const [coutPieces, setCoutPieces] = React.useState("");
  const [signatureClient, setSignatureClient] = React.useState(null);

  // ---- Bloc 3 - axe B : photo terrain ----
  // Réutilise l'infrastructure Cloudinary existante (même compte/preset que
  // index.html, voir uploadCloudinaryTech plus haut) : aucun nouveau flux.
  // Concatène simplement la nouvelle URL au champ "Photos" existant, comme
  // le fait déjà le portail client.
  const [photoEnCoursUpload, setPhotoEnCoursUpload] = React.useState(false);
  const [progressionPhotos, setProgressionPhotos] = React.useState(null);
  const [erreurPhoto, setErreurPhoto] = React.useState("");
  const [photosTicket, setPhotosTicket] = React.useState(ticket.fields?.Photos || "");

  // ---- Bloc 3 - axe G : analyse automatique de la photo SAV ----
  // Déclenchée juste après un upload réussi (voir ajouterPhotosTerrain plus
  // bas), sur la dernière photo ajoutée uniquement. Complète le diagnostic
  // Max existant, ne l'exécute jamais ni ne le remplace : aucune écriture
  // Airtable ici, lecture seule affichée au technicien.
  const [analysePhotoResultat, setAnalysePhotoResultat] = React.useState(null);
  const [analysePhotoEnCours, setAnalysePhotoEnCours] = React.useState(false);
  const [erreurAnalysePhoto, setErreurAnalysePhoto] = React.useState("");

  const analyserPhotoAjoutee = async (url) => {
    if (!url) return;
    setAnalysePhotoEnCours(true); setErreurAnalysePhoto(""); setAnalysePhotoResultat(null);
    try {
      const r = await fetch('/api/chat-technicien', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'analyser_photo',
          photoUrl: url,
          contexte: {
            produit: ticket.fields?.Produit || "",
            probleme: ticket.fields?.["Problème"] || "",
            diagnosticExistant: ticket.fields?.Diagnostic || ticket.fields?.["IKO Diagnostic"] || "",
            metier: metierEntrepriseLocal(),
          },
        }),
      });
      const data = await r.json();
      if (!r.ok || data.erreur) { setErreurAnalysePhoto(data.erreur || "Analyse indisponible."); setAnalysePhotoEnCours(false); return; }
      setAnalysePhotoResultat(data);
    } catch (e) {
      setErreurAnalysePhoto("Connexion impossible. Réessayez.");
    }
    setAnalysePhotoEnCours(false);
  };

  // Amélioration UX terrain : plusieurs photos en un seul tap (au lieu de
  // répéter "Ajouter une photo" une fois par photo). Réutilise telle
  // quelle uploadCloudinaryTech (inchangée) pour chaque fichier, puis fait
  // UNE SEULE écriture Airtable groupée à la fin — pas d'écriture en
  // parallèle qui s'écraseraient entre elles (chaque PATCH remplacerait
  // Photos en entier avec une valeur de base déjà obsolète).
  const ajouterPhotosTerrain = async (fichiers) => {
    const liste = Array.from(fichiers || []).filter(Boolean);
    if (!liste.length) return;
    setErreurPhoto(""); setPhotoEnCoursUpload(true);
    try {
      const urls = [];
      for (let i = 0; i < liste.length; i++) {
        setProgressionPhotos(liste.length > 1 ? { fait: i, total: liste.length } : null);
        const url = await uploadCloudinaryTech(liste[i]);
        if (url) urls.push(url);
      }
      setProgressionPhotos(null);
      if (!urls.length) throw new Error("upload échoué");
      const nouvelleValeur = photosTicket ? photosTicket + ',' + urls.join(',') : urls.join(',');
      const r = await fetch('/api/airtable/tenant/Tickets%20SAV/' + ticket.id, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Photos: nouvelleValeur } }),
      });
      if (!r.ok) throw new Error("écriture échouée");
      setPhotosTicket(nouvelleValeur);
      ticket.fields.Photos = nouvelleValeur; // reflet immédiat pour DiagnosticMaxCard, sans re-fetch du ticket
      analyserPhotoAjoutee(urls[urls.length - 1]); // non bloquant, n'affecte jamais l'upload lui-même
    } catch (e) {
      setErreurPhoto("Envoi de la ou des photo(s) impossible. Réessayez.");
      setProgressionPhotos(null);
    }
    setPhotoEnCoursUpload(false);
  };

  // ---- Bloc 2B : compte-rendu vocal structuré (mode "terminer") ----
  // Réutilise l'infrastructure existante MediaRecorder -> /api/tts (comme
  // le widget Max). Le texte dicté brut reste toujours visible/modifiable.
  // Structuration sur demande explicite uniquement, aucune écriture
  // automatique dans Commentaire — confirmer() n'est pas modifiée.
  const [texteDicteBrut, setTexteDicteBrut] = React.useState("");
  const [enregistrementCREnCours, setEnregistrementCREnCours] = React.useState(false);
  const [structurationEnCours, setStructurationEnCours] = React.useState(false);
  const [compteRenduStructure, setCompteRenduStructure] = React.useState(null);
  const recorderCRRef = React.useRef(null);
  const chunksCRRef = React.useRef([]);

  const dicterCompteRendu = async () => {
    if (!navigator.mediaDevices || !window.MediaRecorder) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
        : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      const recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      chunksCRRef.current = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunksCRRef.current.push(e.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        setEnregistrementCREnCours(false);
        const blob = new Blob(chunksCRRef.current, { type: recorder.mimeType || mimeType || 'audio/webm' });
        if (blob.size < 800) return;
        try {
          const r = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': blob.type || 'audio/webm' }, body: blob });
          const data = await r.json();
          if (r.ok && data.texte) setTexteDicteBrut(prev => (prev ? prev + " " : "") + data.texte);
        } catch (e) {}
      };
      recorderCRRef.current = recorder;
      recorder.start();
      setEnregistrementCREnCours(true);
      setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 30000);
    } catch (e) { setEnregistrementCREnCours(false); }
  };
  const arreterDicteeCompteRendu = () => {
    if (recorderCRRef.current && recorderCRRef.current.state === 'recording') recorderCRRef.current.stop();
  };

  const structurerCompteRendu = async () => {
    if (!texteDicteBrut.trim()) return;
    setStructurationEnCours(true);
    try {
      const r = await fetch('/api/chat-technicien', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'structurer_compte_rendu', texteDicte: texteDicteBrut.trim() }),
      });
      const data = await r.json();
      if (r.ok && !data.erreur) setCompteRenduStructure(data);
    } catch (e) {}
    setStructurationEnCours(false);
  };

  // Écriture dans Commentaire uniquement sur validation explicite du
  // technicien (clic). confirmer() reste inchangée : elle lit simplement
  // le state "commentaire" comme avant.
  const utiliserCompteRenduStructure = () => {
    if (!compteRenduStructure) return;
    const parties = [];
    if (compteRenduStructure.fait_constate) parties.push("Constat : " + compteRenduStructure.fait_constate);
    if (compteRenduStructure.diagnostic) parties.push("Diagnostic : " + compteRenduStructure.diagnostic);
    if (compteRenduStructure.intervention_realisee) parties.push("Intervention réalisée : " + compteRenduStructure.intervention_realisee);
    if (compteRenduStructure.piece_action_necessaire) parties.push("Pièce/action : " + compteRenduStructure.piece_action_necessaire);
    if (compteRenduStructure.resultat) parties.push("Résultat : " + compteRenduStructure.resultat);
    if (compteRenduStructure.suite_a_donner) parties.push("Suite à donner : " + compteRenduStructure.suite_a_donner);
    setCommentaire(parties.join("\n"));
  };

  // ---- Bloc 2C : suggestions de lignes de devis (mode "devis_place") ----
  // Le catalogue réel est déjà chargé (catalogueAuto). Ajout UNE PAR UNE
  // après validation du technicien, jamais de devis complet automatique.
  const [suggestionsDevis, setSuggestionsDevis] = React.useState(null);
  const [chargementSuggestionsDevis, setChargementSuggestionsDevis] = React.useState(false);

  const demanderSuggestionsDevis = async () => {
    if (!catalogueAuto.produits.length && !catalogueAuto.mo.length) return;
    setChargementSuggestionsDevis(true);
    setSuggestionsDevis(null);
    try {
      const catalogueEnvoye = [
        ...catalogueAuto.produits.map(p => ({ id: p.id, type: 'produit', designation: p.fields?.["Désignation"] || '', prix: p.fields?.["Prix unitaire HT"] || 0 })),
        ...catalogueAuto.mo.map(m => ({ id: m.id, type: 'mo', designation: m.fields?.["Type d'action"] || '', prix: m.fields?.["Prix forfait HT"] || m.fields?.["Taux horaire HT"] || 0 })),
      ];
      const r = await fetch('/api/chat-technicien', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'devis_suggestion',
          ticket: { produit: ticket.fields?.Produit || '', probleme: ticket.fields?.["Problème"] || '' },
          catalogue: catalogueEnvoye,
        }),
      });
      const data = await r.json();
      if (r.ok && !data.erreur) setSuggestionsDevis(data.lignes || []);
    } catch (e) {}
    setChargementSuggestionsDevis(false);
  };

  const ajouterLigneSuggeree = (ligne) => {
    const produitSource = catalogueAuto.produits.find(p => p.id === ligne.catalogue_id);
    const tauxTva = ligne.type === 'produit' ? tauxTvaVersDecimal(produitSource?.fields?.["Taux TVA"]) : 0.20;
    const totalHT = (ligne.quantite || 1) * ligne.prix;
    setLignesAuto(prev => [...prev, { designation: ligne.designation, qte: ligne.quantite || 1, puHT: ligne.prix, tauxTva, totalHT, totalTTC: totalHT * (1 + tauxTva) }]);
    setSuggestionsDevis(prev => (prev || []).filter(l => l.catalogue_id !== ligne.catalogue_id));
  };

  React.useEffect(() => {
    if (mode !== "devis_place" || catalogueAuto.mep !== null || catalogueAuto.produits.length || catalogueAuto.mo.length) return;
    setChargementCatalogueAuto(true);
    (async () => {
      let cat = { produits: [], mo: [], mep: null };
      try {
        const resolu = await resoudreClientDepuisAgenceTech(ticket.fields?.Agence);
        if (resolu) {
          setClientInfoAuto(resolu);
          cat = await chargerCatalogueDevisTech(resolu.clientNom);
        }
      } catch(e) { console.error(e); }
      // IKO DEMO (pas de ?client=) : catalogue menuiserie de démonstration si rien n'est configuré.
      const estDemo = !new URLSearchParams(window.location.search).get('client');
      if (estDemo && !cat.produits.length && !cat.mo.length) {
        cat = { ...cat, ...CATALOGUE_DEMO_IKO, mep: cat.mep || {} };
        setDemoAuto(true);
      }
      setCatalogueAuto(cat);
      setChargementCatalogueAuto(false);
    })();
  }, [mode]);

  const ajouterLigneAuto = () => {
    if (!choixLigneAuto) return;
    const [type, id] = choixLigneAuto.split('|');
    const source = type === 'produit' ? catalogueAuto.produits.find(p => p.id === id) : catalogueAuto.mo.find(m => m.id === id);
    if (!source) return;
    const f = source.fields || {};
    const designation = type === 'produit' ? (f["Désignation"] || '—') : (f["Type d'action"] || '—');
    const puHT = type === 'produit' ? (f["Prix unitaire HT"] || 0) : (f["Prix forfait HT"] || f["Taux horaire HT"] || 0);
    const tauxTva = type === 'produit' ? tauxTvaVersDecimal(f["Taux TVA"]) : 0.20;
    const totalHT = (Number(qteLigneAuto) || 1) * puHT;
    setLignesAuto([...lignesAuto, { designation, qte: Number(qteLigneAuto) || 1, puHT, tauxTva, totalHT, totalTTC: totalHT * (1 + tauxTva) }]);
    setChoixLigneAuto(""); setQteLigneAuto(1);
  };

  const TAGS_DEVIS = [
    "Pièce détachée à commander",
    "Intervention complémentaire nécessaire",
    "Dommage plus important que prévu",
    "Matériel spécifique requis",
    "Autre",
  ];
  const toggleTag = (t) => setTags(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]);

  const envoyerDevisAuto = async () => {
    const emailValide = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailAuto.trim());
    if (!lignesAuto.length || !emailValide || (!clientInfoAuto && !demoAuto)) return;
    const numero = "DEV-" + new Date().getFullYear() + "-" + Math.floor(1000 + Math.random() * 9000);
    const montantHT = lignesAuto.reduce((s, l) => s + (l.totalHT || 0), 0);
    const montantTTC = lignesAuto.reduce((s, l) => s + (l.totalTTC != null ? l.totalTTC : l.totalHT * 1.2), 0);
    const cpMatch = (ticket.fields?.Adresse || "").match(/\b\d{5}\b/);
    const client = { nom: ticket.fields?.Client, adresse: ticket.fields?.Adresse || "", cp: cpMatch ? cpMatch[0] : "" };
    const mep = mepAvecDefauts({ ...(catalogueAuto.mep || {}) }, demoAuto);

    const champsDevis = {
      "N° devis": numero, "Ticket lié": [ticket.id],
      "Nom client": client.nom, "Adresse client": client.adresse, "CP client": client.cp,
      "Lignes devis (JSON)": JSON.stringify(lignesAuto), "Montant HT": montantHT, "Montant TTC": montantTTC,
      "Statut": "Envoyé", "Mode": "Auto Iko",
    };
    if (clientInfoAuto?.clientId) champsDevis["Client"] = [clientInfoAuto.clientId];
    if (clientInfoAuto?.agenceId) champsDevis["Agence"] = [clientInfoAuto.agenceId];

    const devisRes = await fetch('/api/airtable/Devis', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records: [{ fields: champsDevis }] })
    });
    const devisJson = await devisRes.json();
    const devisRec = devisJson.records?.[0];
    if (!devisRec) throw new Error("Création du devis auto échouée.");

    const pdfBlob = await genererPdfDevis({ numero, ticket, client, lignes: lignesAuto, montantHT, montantTTC, mep });

    let yousignFields = {};
    try {
      const { signatureRequestId, lienSignature } = await creerDemandeSignatureYousignTech(pdfBlob, numero, client.nom, emailAuto.trim(), ticket.fields?.Téléphone);
      yousignFields = { "Yousign Request ID": signatureRequestId, "Yousign Signer Link": lienSignature };
    } catch (yousignErr) {
      console.error('Yousign indisponible, devis auto créé sans signature électronique :', yousignErr);
    }
    await fetch('/api/airtable/Devis/' + devisRec.id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: yousignFields })
    });

    await fetch('/api/airtable/tenant/Tickets%20SAV/' + ticket.id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { "Montant devis": Math.round(montantTTC * 100) / 100, Email: emailAuto.trim() } })
    });

    const lienDevis = window.location.origin + '/devis.html?devisId=' + devisRec.id;
    await fetch(WEBHOOK, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        marque: 'iko', action: 'devis_auto_envoye',
        ticket: ticket.fields?.Name, nom: ticket.fields?.Client, "e-mail": emailAuto.trim(),
        agence: ticket.fields?.Agence, produit: ticket.fields?.Produit, probleme: ticket.fields?.Problème,
        montant: montantTTC.toFixed(2) + ' €', lien: lienDevis
      })
    });
  };

  // Bloc Interventions SAV : cree automatiquement une ligne "passage
  // technicien" pour les modes qui representent une visite reelle. Exclu
  // volontairement : "annuler" (pas de passage garanti) et "debloquer"
  // (changement administratif de creneau, pas une visite). Aucune
  // donnee inventee : duree et couts restent vides quand ils ne sont pas
  // reellement connus (seul devis_place a des couts reels, via les
  // lignes du devis sur place deja saisies).
  const creerInterventionAuto = async (mode, diagnosticTexte) => {
    const STATUT_PAR_MODE = {
      terminer: "Résolu",
      devis_place: "Résolu",
      replanifier: "Non résolu - RDV à reprogrammer",
      devis: "Non résolu - pièce à commander",
      piece: "Non résolu - pièce à commander",
    };
    const statutIntervention = STATUT_PAR_MODE[mode];
    if (!statutIntervention) return { ok: true, skip: true }; // mode sans intervention (annuler, debloquer) : rien à créer, pas une erreur
    // Name (champ primaire d'Interventions SAV) doit TOUJOURS etre rempli :
    // le rollup "Nb Passages Technicien" sur Tickets SAV est un
    // COUNTA(Name) - un Name vide n'est pas compte par COUNTA, ce qui
    // laisserait le compteur bloque a 0 meme avec des interventions
    // reelles. Verifie en conditions reelles sur Airtable avant ce
    // correctif (creation + suppression d'un enregistrement de test).
    const fieldsIntervention = {
      "Name": "INT-" + (ticket.fields?.Name || ticket.id) + "-" + Date.now().toString(36).toUpperCase(),
      "Ticket SAV": [ticket.id],
      "Date intervention": new Date().toISOString().slice(0, 10),
      "Statut intervention": statutIntervention,
    };
    if (/^rec[A-Za-z0-9]{14}$/.test(window.IKO_USER_ID || "")) fieldsIntervention["Technicien"] = [window.IKO_USER_ID]; // ignoré si ce n'est pas un vrai identifiant Airtable (session démo/admin)
    if (diagnosticTexte) fieldsIntervention["Constat / Diagnostic"] = diagnosticTexte;
    if ((mode === "terminer" || mode === "devis_place") && Number(dureeMin) > 0) fieldsIntervention["Durée (min)"] = Number(dureeMin);
    if ((mode === "terminer" || mode === "devis_place") && Number(coutPieces) > 0) fieldsIntervention["Coût pièces"] = Number(coutPieces);
    // Compte client est stampe cote serveur (AUTH #008) : jamais envoye
    // depuis le navigateur.
    // NB : lignesAuto (devis sur place) ne conserve pas la distinction
    // produit / main d'oeuvre a ce stade du code (deja agregees en
    // lignes de devis) : impossible de repartir Coût pièces / Coût main
    // d'oeuvre de facon fiable sans inventer une regle absente du modele
    // de donnees. On laisse volontairement ces deux champs vides plutot
    // que de deviner une repartition — a completer manuellement dans
    // Airtable si le detail est necessaire, ou par une evolution future
    // qui typera chaque ligne a la source.
    try {
      const r = await fetch('/api/airtable/tenant/Interventions%20SAV', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: fieldsIntervention }),
      });
      if (!r.ok) {
        // Correctif A4 : une reponse HTTP 4xx/5xx ne leve PAS d'exception
        // avec fetch — sans cette verification explicite, une intervention
        // refusee cote serveur (ticket introuvable, tenant invalide, erreur
        // Airtable...) passait totalement inapercue. On journalise le
        // detail retourne par le serveur et on remonte un resultat clair
        // a confirmer(), qui decide de l'affichage.
        let detail = "";
        try { const data = await r.json(); const e1 = data?.error; detail = typeof e1 === "string" ? e1 : (e1?.message || (e1 ? JSON.stringify(e1) : "")); if (data?.details && typeof data.details === "string") detail += " " + data.details; } catch (e) { /* corps non-JSON, ignore */ }
        console.error('Échec création intervention SAV — HTTP ' + r.status + (detail ? ' : ' + detail : ''));
        return { ok: false, statut: r.status, detail };
      }
      return { ok: true };
    } catch (e) {
      // Erreur reseau (pas de reponse HTTP du tout) : distincte du cas
      // ci-dessus, journalisee separement mais remontee de la meme facon.
      console.error('Erreur réseau lors de la création de l’intervention SAV', e);
      return { ok: false, statut: null, detail: String(e) };
    }
  };

  const confirmer = async () => {
    if (mode === "replanifier" && !newDate) return;
    if (mode === "debloquer" && !newDate) return;
    if (mode === "annuler" && !commentaire.trim()) return;
    if (mode === "devis" && !explication.trim()) return;
    if (mode === "piece" && !pieceTexte.trim()) return;
    if (mode === "devis_place" && (!lignesAuto.length || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailAuto.trim()) || !modePaiementPlace)) return;
    setSaving(true); setErreurFermeture("");
    try {
      const fields = {};
      let dateLabelDeblocage = "";
      let noteToken = "";
      if (mode === "terminer") {
        fields.Statut = "Terminé";
        if (commentaire) fields.Commentaire = commentaire;
        noteToken = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
        fields["Note Token"] = noteToken;
      } else if (mode === "devis_place") {
        fields.Statut = "Terminé";
        fields["Mode paiement"] = ({ "CB":"CB", "Chèque":"CHEQUE", "Virement":"VIREMENT", "Signature électronique":"SIGNATURE" })[modePaiementPlace] || modePaiementPlace;
        if (commentaire) fields.Commentaire = commentaire;
        noteToken = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
        fields["Note Token"] = noteToken;
      } else if (mode === "annuler") {
        fields.Statut = "Annulé";
        fields.Commentaire = "Annulé : " + commentaire;
        const planningId = ticket.fields?.PlanningID;
        if (planningId) {
          await fetch('/api/airtable/Planning/'+planningId, {
            method:'PATCH',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({fields:{Statut:'Libre'}})
          });
        }
      } else if (mode === "piece") {
        fields.Statut = "Attente pièce";
        fields["Pièce à commander"] = pieceTexte.trim();
        fields["Commande pièce"] = "À commander";
        if (commentaire) fields.Commentaire = "Pièce à commander : " + commentaire;
      } else if (mode === "devis") {
        fields.Statut = "Devis à faire";
        const tagsTexte = tags.length ? "[" + tags.join(" · ") + "]\n" : "";
        fields.Diagnostic = tagsTexte + explication;
        if (nonGarantiTicket) {
          fields["Client existant"] = clientExistantDevis;
          if (fraisDiagnosticApplicable) {
            fields["Frais diagnostic facturés"] = montantDiagnostic;
            fields["Frais diagnostic déduits"] = false;
          }
        }
      } else if (mode === "debloquer") {
        const dateLabel = new Date(newDate+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
        dateLabelDeblocage = newCreneau + ' — ' + dateLabel;
        fields.Statut = "Nouveau";
        fields["Créneau"] = dateLabelDeblocage;
        fields.Commentaire = "Créneau débloqué par le technicien (intervention avancée)" + (commentaire ? " : " + commentaire : "");
      } else {
        fields.Statut = "Nouveau"; // même statut que lorsque le client change sa date : le nouveau RDV est à (re)faire
        const dateLabel = new Date(newDate+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
        fields["Créneau"] = newCreneau + ' — ' + dateLabel;
        if (commentaire) fields.Commentaire = "Replanifié : " + commentaire;
      }
      // Bloc 4 - point 1 : si un diagnostic Max a été généré mais jamais
      // gardé manuellement, on l'inclut dans ce même PATCH de clôture — un
      // seul appel Airtable, et le diagnostic n'est plus perdu par oubli.
      // Ne touche rien si déjà gardé manuellement (ne pas écraser un texte
      // éventuellement mis à jour entre-temps).
      if ((mode === "terminer" || mode === "devis_place") && causeSav) fields["Cause SAV"] = causeSav;
      if ((mode === "terminer" || mode === "devis_place") && resultatDiagnostic && !diagnosticGarde) {
        fields["IKO Diagnostic"] = formaterTexteDiagnosticMax(resultatDiagnostic);
        fields["IKO Diagnostic Date"] = new Date().toISOString();
        fields["IKO Utilisé"] = true;
      }
      const rFermeture = await fetch('/api/airtable/tenant/Tickets%20SAV/'+ticket.id, {
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({fields})
      });
      if (!rFermeture.ok) {
        // Correctif A5 : si le PATCH de fermeture du ticket lui-même
        // échoue côté serveur, on doit s'arrêter ici — ni créer
        // d'intervention (le ticket n'est pas réellement fermé), ni
        // appeler onDone (qui fermerait la modale en laissant croire à
        // une fermeture réussie). Le technicien reste sur l'écran, voit
        // l'erreur, et peut réessayer.
        let detailFermeture = "";
        try { const dataFermeture = await rFermeture.json(); const e0 = dataFermeture?.error; detailFermeture = typeof e0 === "string" ? e0 : (e0?.message || (e0 ? JSON.stringify(e0) : "")); } catch (e) { /* corps non-JSON, ignore */ }
        console.error('Échec fermeture ticket SAV — HTTP ' + rFermeture.status + (detailFermeture ? ' : ' + detailFermeture : ''));
        setErreurFermeture("La fermeture du ticket a échoué (" + rFermeture.status + "). Réessayez." + (detailFermeture ? " — " + detailFermeture : ""));
        setSaving(false);
        return;
      }
      // Cohérence du planning : quand le technicien déplace le rendez-vous, l'ancien
      // créneau doit être libéré et le nouveau réservé (comme côté client/tableau de bord),
      // sinon l'agenda reste faux et le même créneau peut être reproposé à un autre client.
      if (mode === "piece" && ticket.fields?.PlanningID) {
        try {
          await fetch('/api/airtable/Planning/' + ticket.fields.PlanningID, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ fields: { Statut: 'Libre' } }) });
          await fetch('/api/airtable/tenant/Tickets%20SAV/' + ticket.id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ fields: { PlanningID: "" } }) });
        } catch (e) { console.error('Libération du créneau (pièce)', e); }
      }
      if ((mode === "replanifier" || mode === "debloquer") && newDate) {
        try {
          const ancienPlanningId = ticket.fields?.PlanningID || "";
          let nouveauPlanningId = "";
          if (window.IKO_creneaux) {
            const libres = await window.IKO_creneaux.charger({ agence: ticket.fields?.Agence, creneau: newCreneau, date: newDate, admin: 1, clientId: window.IKO_CLIENT_ID });
            if (libres.length) nouveauPlanningId = libres[0].id;
          }
          if (nouveauPlanningId && nouveauPlanningId !== ancienPlanningId) {
            await fetch('/api/airtable/Planning/' + nouveauPlanningId, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ fields: { Statut: 'Pris' } }) });
          }
          if (ancienPlanningId && ancienPlanningId !== nouveauPlanningId) {
            await fetch('/api/airtable/Planning/' + ancienPlanningId, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ fields: { Statut: 'Libre' } }) });
          }
          if (ancienPlanningId !== nouveauPlanningId) {
            await fetch('/api/airtable/tenant/Tickets%20SAV/' + ticket.id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ fields: { PlanningID: nouveauPlanningId } }) });
          }
        } catch (e) { console.error('Mise à jour du planning après déplacement', e); }
      }
      // Creation de l'intervention SAV (passage technicien) : apres le
      // PATCH du ticket, avant les effets secondaires (email, webhook),
      // pour ne pas retarder la fermeture du ticket si Airtable est lent.
      let diagnosticTexte = "";
      if (mode === "terminer" || mode === "devis_place") {
        diagnosticTexte = resultatDiagnostic ? formaterTexteDiagnosticMax(resultatDiagnostic) : (commentaire || "");
      } else if (mode === "replanifier") {
        diagnosticTexte = commentaire || "";
      } else if (mode === "piece") {
        diagnosticTexte = "Pièce à commander : " + pieceTexte.trim() + (commentaire ? "\n" + commentaire : "");
      } else if (mode === "devis") {
        diagnosticTexte = fields.Diagnostic || "";
      }
      const resultatIntervention = await creerInterventionAuto(mode, diagnosticTexte);
      if (!resultatIntervention.ok) {
        // Correctif A4 : le ticket EST fermé avec succès a ce stade — on ne
        // bloque donc pas le technicien, mais on ne doit surtout pas lui
        // laisser croire que l'intervention a été enregistrée. La modale
        // se ferme juste après (onDone), donc un state React ne serait pas
        // vu à temps : window.alert garantit que le technicien voit
        // l'avertissement avant de passer au ticket suivant.
        window.alert(
          "Le ticket est fermé, mais l'enregistrement de l'intervention (passage technicien) a échoué" +
          (resultatIntervention.statut ? " (erreur " + resultatIntervention.statut + ")" : " (erreur réseau)") +
          (resultatIntervention.detail ? " : " + resultatIntervention.detail : "") +
          ". Signalez-le si besoin — les statistiques SAV de ce ticket seront incomplètes."
        );
      }
      if (mode === "replanifier" && ticket.fields?.Email) {
        try {
          await fetch(WEBHOOK, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              marque: 'iko', action: 'renvoi_client',
              ticket: ticket.fields?.Name, "e-mail": ticket.fields?.Email,
            })
          });
        } catch(e) { console.error(e); }
      }
      if (mode === "piece") {
        try {
          await fetch(WEBHOOK, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ marque: 'iko', action: 'piece_a_commander', ticket: ticket.fields?.Name, nom: ticket.fields?.Client, "e-mail": ticket.fields?.Email || '', agence: ticket.fields?.Agence, piece: pieceTexte.trim() })
          });
        } catch(e) { console.error(e); }
      }
      if (mode === "debloquer") {
        try {
          await fetch(WEBHOOK, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              marque: 'iko', action: 'devis_deblocage',
              ticket: ticket.fields?.Name, nom: ticket.fields?.Client, "e-mail": ticket.fields?.Email || '',
              agence: ticket.fields?.Agence, produit: ticket.fields?.Produit, probleme: ticket.fields?.Problème,
              montant: ticket.fields?.["Montant devis"] || '', creneau: dateLabelDeblocage
            })
          });
        } catch(e) { console.error(e); }
      }
      if (mode === "devis_place" && lignesAuto.length > 0) {
        try { await envoyerDevisAuto(); } catch(e) { console.error('Erreur devis auto', e); }
      }
      let lienBon = "";
      if (mode === "terminer" || mode === "devis_place") {
        try {
          const blobBon = genererBonIntervention({ ticket, cause: causeSav, duree: dureeMin, coutPieces, commentaire, diagnostic: diagnosticTexte, signature: signatureClient, modePaiement: mode === "devis_place" ? modePaiementPlace : "" });
          if (blobBon) {
            lienBon = await uploadCloudinaryTech(new File([blobBon], "bon-" + (ticket.fields?.Name || ticket.id) + ".pdf", { type: "application/pdf" }));
            if (lienBon) {
              await fetch('/api/airtable/tenant/Tickets%20SAV/' + ticket.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: { "Bon intervention URL": lienBon } }) });
            }
          }
        } catch (e) { console.error("Bon d'intervention non généré", e); lienBon = ""; }
      }
      if ((mode === "terminer" || mode === "devis_place") && ticket.fields?.Email) {
        try {
          const lienNote = window.location.origin + '/avis.html?token=' + noteToken;
          await fetch(WEBHOOK, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              marque: 'iko', action: 'demande_note',
              ticket: ticket.fields?.Name, nom: ticket.fields?.Client, "e-mail": ticket.fields?.Email,
              agence: ticket.fields?.Agence, produit: ticket.fields?.Produit, probleme: ticket.fields?.Problème,
              lien: lienNote, lien_bon_intervention: lienBon
            })
          });
        } catch(e) { console.error(e); }
      }
      onDone(mode);
    } catch(e) { console.error(e); }
    setSaving(false);
  };

  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal-box">
        <div style={{width:"36px",height:"4px",background:"#D1D5DB",borderRadius:"2px",margin:"0 auto 20px"}}/>
        <div style={{marginBottom:"20px"}}>
          <div style={{fontSize:"11px",color:C.or,fontWeight:"700",fontFamily:"monospace",marginBottom:"4px"}}>{ticket.fields?.Name}</div>
          <div style={{fontSize:"16px",fontWeight:"900",color:C.white}}>{ticket.fields?.Client}</div>
          <div style={{fontSize:"12px",color:C.muted,marginTop:"3px"}}>{ticket.fields?.Produit} · {ticket.fields?.["Problème"]}</div>
          <div style={{fontSize:"12px",color:C.text,marginTop:"6px"}}>📅 {ticket.fields?.["Créneau"]}</div>
          {ticket.fields?.Adresse && <div style={{fontSize:"12px",color:C.muted,marginTop:"2px"}}>📍 {ticket.fields?.Adresse}</div>}
          {erreurFermeture && (
            <div style={{marginTop:"8px",padding:"8px 10px",background:"rgba(var(--iko-erreur-rgb),0.1)",border:"1px solid var(--iko-erreur)",borderRadius:"8px",fontSize:"11px",color:"var(--iko-erreur)",fontWeight:"700"}}>
              ⚠️ {erreurFermeture}
            </div>
          )}
          <div style={{marginTop:"10px"}}>
            <input id={"photoTerrain-" + ticket.id} type="file" accept="image/*" capture="environment" multiple style={{display:"none"}}
              onChange={e => { const f = Array.from(e.target.files || []); e.target.value = ""; if (f.length) ajouterPhotosTerrain(f); }}/>
            <label htmlFor={"photoTerrain-" + ticket.id}
              style={{display:"flex",alignItems:"center",justifyContent:"center",width:"100%",padding:"14px",borderRadius:"12px",background:photoEnCoursUpload?"#D1D5DB":"rgba(var(--iko-primary-rgb),0.1)",border:"2px solid var(--iko-primary)",color:"var(--iko-primary)",fontSize:"14px",fontWeight:"900",cursor:photoEnCoursUpload?"not-allowed":"pointer"}}>
              {photoEnCoursUpload ? (progressionPhotos ? "⏳ Envoi " + (progressionPhotos.fait + 1) + "/" + progressionPhotos.total + "..." : "⏳ Envoi...") : "📷 Ajouter des photos"}
            </label>
            {photosTicket && <div style={{fontSize:"11px",color:C.muted,marginTop:"6px",textAlign:"center"}}>{photosTicket.split(",").filter(Boolean).length} photo(s) sur ce ticket</div>}
          </div>
          {erreurPhoto && <div style={{fontSize:"11px",color:"var(--iko-erreur)",marginTop:"6px"}}>{erreurPhoto}</div>}
          {analysePhotoEnCours && <div style={{fontSize:"11px",color:C.muted,marginTop:"8px",textAlign:"center"}}>⏳ Max regarde la photo...</div>}
          {erreurAnalysePhoto && <div style={{fontSize:"11px",color:"var(--iko-erreur)",marginTop:"8px"}}>{erreurAnalysePhoto}</div>}
          {analysePhotoResultat && (
            <div style={{marginTop:"10px",border:"1px solid rgba(var(--iko-primary-rgb),0.3)",borderRadius:"10px",padding:"10px 12px",fontSize:"11px",color:C.text,display:"flex",flexDirection:"column",gap:"5px",background:"rgba(var(--iko-primary-rgb),0.04)"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <span style={{fontSize:"11px",fontWeight:"800",color:"var(--iko-primary)"}}>📷 Lecture rapide de la photo</span>
                {analysePhotoResultat.confiance && (
                  <span style={{fontSize:"10px",fontWeight:"700",color:COULEURS_CONFIANCE_MAX[analysePhotoResultat.confiance]||C.muted,border:"1px solid "+(COULEURS_CONFIANCE_MAX[analysePhotoResultat.confiance]||C.muted),borderRadius:"10px",padding:"2px 7px"}}>
                    {LABELS_CONFIANCE_MAX[analysePhotoResultat.confiance] || "Confiance moyenne"}
                  </span>
                )}
              </div>
              {analysePhotoResultat.limites ? (
                <div style={{color:"var(--iko-primary)"}}>⚠️ {analysePhotoResultat.limites}</div>
              ) : (
                <>
                  {analysePhotoResultat.elements_visibles && <div><b>Éléments visibles</b> · {analysePhotoResultat.elements_visibles}</div>}
                  {analysePhotoResultat.anomalie_dommage && <div><b>Anomalie/dommage</b> · {analysePhotoResultat.anomalie_dommage}</div>}
                  {analysePhotoResultat.zone_concernee && <div><b>Zone concernée</b> · {analysePhotoResultat.zone_concernee}</div>}
                  {analysePhotoResultat.indices_diagnostic && <div><b>Indices diagnostic</b> · {analysePhotoResultat.indices_diagnostic}</div>}
                  {analysePhotoResultat.recommandation && <div style={{fontStyle:"italic",color:C.muted}}>💡 {analysePhotoResultat.recommandation}</div>}
                </>
              )}
            </div>
          )}
        </div>
        <DiagnosticMaxCard ticket={ticket} resultat={resultatDiagnostic} setResultat={setResultatDiagnostic}
          diagnosticGarde={diagnosticGarde} setDiagnosticGarde={setDiagnosticGarde}
          analysePhotoExistante={analysePhotoResultat}/>
        {!mode && (
          <>
            <div style={{fontSize:"12px",color:C.muted,marginBottom:"12px",textAlign:"center"}}>Que souhaitez-vous faire ?</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}}>
              <button onClick={() => setMode("terminer")}
                style={{padding:"20px 16px",background:C.vertDim,border:"2px solid rgba(var(--iko-primary-rgb),0.4)",borderRadius:"14px",color:C.vert,cursor:"pointer",textAlign:"center"}}>
                <div style={{fontSize:"28px",marginBottom:"6px",color:"var(--iko-primary)",fontWeight:"900"}}>✓</div>
                <div style={{fontSize:"13px",fontWeight:"900"}}>SAV terminé</div>
                <div style={{fontSize:"10px",color:"rgba(var(--iko-primary-rgb),0.7)",marginTop:"3px"}}>Intervention réalisée</div>
              </button>
              <button onClick={() => setMode("replanifier")}
                style={{padding:"20px 16px",background:C.jauneDim,border:"2px solid rgba(var(--iko-statut-attention-rgb),0.4)",borderRadius:"14px",color:C.jaune,cursor:"pointer",textAlign:"center"}}>
                <div style={{fontSize:"28px",marginBottom:"6px"}}>🔄</div>
                <div style={{fontSize:"13px",fontWeight:"900"}}>Replanifier</div>
                <div style={{fontSize:"10px",color:"rgba(var(--iko-statut-attention-rgb),0.7)",marginTop:"3px"}}>Choisir une autre date</div>
              </button>

function ItineraireModal({ agence, tickets, onClose }) {
  const dernierDepartKey = 'iko_dernier_depart_' + agence;
  const [startAddress, setStartAddress] = React.useState(() => {
    try { return localStorage.getItem(dernierDepartKey) || AGENCE_ADRESSES[agence] || ""; }
    catch(e) { return AGENCE_ADRESSES[agence] || ""; }
  });
  const [step, setStep] = React.useState("form"); // form | loading | result | error
  const [errorMsg, setErrorMsg] = React.useState("");
  const [route, setRoute] = React.useState([]);
  const [mapsUrl, setMapsUrl] = React.useState("");
  const [nbFailed, setNbFailed] = React.useState(0);
  const [gpsLoading, setGpsLoading] = React.useState(false);
  const [departLabel, setDepartLabel] = React.useState("");

  const eligibles = tickets.filter(t => {
    const s = t.fields?.Statut || "Nouveau";
    return s !== "Terminé" && s !== "Annulé" && t.fields?.Adresse && t.fields.Adresse.trim();
  });

  const lancerCalcul = async (startCoord, label) => {
    setDepartLabel(label);
    const stops = [];
    let failed = 0;
    for (const t of eligibles) {
      const fullAddr = t.fields.Adresse + (t.fields.Agence ? ', ' + t.fields.Agence.replace(/\s*\(\d+\)/,'') : '') + ', France';
      const coord = await geocodeAddress(fullAddr);
      if (coord) stops.push({ ticket: t, coord });
      else failed++;
      await pause(1100);
    }
    setNbFailed(failed);
    if (stops.length === 0) { setStep("form"); setErrorMsg("Aucune adresse n'a pu être localisée."); return; }
    const optimized = optimiserOrdre(startCoord, stops);
    setRoute(optimized);
    const originStr = label.startsWith('📍') ? (startCoord.lat + ',' + startCoord.lon) : encodeURIComponent(label);
    const destStr = encodeURIComponent(optimized[optimized.length-1].ticket.fields.Adresse);
    const waypoints = optimized.slice(0, -1).map(s => encodeURIComponent(s.ticket.fields.Adresse)).join('|');
    setMapsUrl('https://www.google.com/maps/dir/?api=1&origin=' + originStr + '&destination=' + destStr + (waypoints ? '&waypoints=' + waypoints : '') + '&travelmode=driving');
    setStep("result");
  };

  const calculer = async () => {
    if (!startAddress.trim()) { setErrorMsg("Indique une adresse de départ."); return; }
    if (eligibles.length === 0) { setErrorMsg("Aucune intervention avec adresse dans cette liste."); return; }
    setStep("loading"); setErrorMsg("");
    const startCoord = await geocodeAddress(startAddress);
    if (!startCoord) { setStep("form"); setErrorMsg("Adresse de départ introuvable, précise-la (ville + code postal)."); return; }
    try { localStorage.setItem(dernierDepartKey, startAddress); } catch(e) {}
    await pause(1100);
    await lancerCalcul(startCoord, startAddress);
  };

  const calculerDepuisGPS = () => {
    if (eligibles.length === 0) { setErrorMsg("Aucune intervention avec adresse dans cette liste."); return; }
    if (!navigator.geolocation) { setErrorMsg("La géolocalisation n'est pas disponible sur cet appareil."); return; }
    setGpsLoading(true); setErrorMsg("");
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        setGpsLoading(false);
        setStep("loading");
        const coord = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        await lancerCalcul(coord, "📍 Ma position actuelle");
      },
      (err) => {
        setGpsLoading(false);
        setErrorMsg("Impossible de récupérer ta position (autorise la géolocalisation dans les réglages du navigateur).");
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const imprimer = () => {
    const lignes = route.map((s, i) => `
      <tr>
        <td>${i+1}</td>

        <td>${s.ticket.fields?.Client||""}</td>
        <td>${s.ticket.fields?.Adresse||""}</td>

      </tr>`).join("");

        body{font-family:Arial,sans-serif;padding:24px;color:#111;}
        h1{font-size:18px;margin-bottom:2px;}

        td{border-bottom:1px solid #ddd;padding:7px 9px;vertical-align:top;}
        tr:nth-child(even){background:#f7f7f7;}
        .footer{margin-top:16px;font-size:9px;color:#999;}
        .toolbar{display:flex;gap:10px;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #FFD9BF;flex-wrap:wrap;}
        .toolbar button, .toolbar a{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:700;padding:11px 20px;border-radius:10px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;line-height:1;}
        .btn-close{background:#F3F4F6;color:#374151;border:1px solid #E2E2E2 !important;}
        .btn-print{background:#0D0D0D;color:#fff;box-shadow:0 2px 10px rgba(17,17,17,0.25);}
        @media print { @page { size: landscape; margin: 12mm; } .toolbar{display:none;} }
      </style></head><body>
      <div class="toolbar">
        <button class="btn-close" onclick="window.close()"><span>←</span><span>Fermer</span></button>
        <button class="btn-print" onclick="window.print()"><span>🖨️</span><span>Imprimer / PDF</span></button>
      </div>
      <h1>Iko Suite — Itinéraire optimisé</h1>
      <div class="sub">${agence} — Départ : ${departLabel} — ${route.length} arrêt(s)</div>
      <table><thead><tr>
        <th>#</th><th>Créneau</th><th>N° Ticket</th><th>Client</th><th>Adresse</th><th>Téléphone</th>
      </tr></thead><tbody>${lignes}</tbody></table>
      <div class="footer">Iko Suite — Itinéraire calculé automatiquement (ordre indicatif, à ajuster selon le trafic)</div>
      </body></html>`;
    const w = window.open('', '_blank');
    w.document.write(html);
    w.document.close();
  };

  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>

          <div>
            <div style={{fontSize:"16px",fontWeight:"900",color:C.white}}>🗺️ Itinéraire optimisé</div>
            <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{eligibles.length} intervention(s) dans cette liste</div>
          </div>
          <button onClick={onClose} style={{background:"#F3F4F6",border:"1px solid "+C.border,color:C.muted,borderRadius:"8px",width:"30px",height:"30px",cursor:"pointer",fontSize:"16px"}}>✕</button>
        </div>

        {step === "form" && (
          <>
            <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Point de départ</label>
            <input value={startAddress} onChange={e => setStartAddress(e.target.value)} placeholder="Adresse de l'agence ou point de départ"/>
            <div style={{fontSize:"10px",color:C.muted,marginTop:"6px",marginBottom:"6px"}}>Retient automatiquement ton dernier point de départ (domicile, chantier, agence...) — modifiable à chaque fois.</div>
            {AGENCE_ADRESSES[agence] && startAddress !== AGENCE_ADRESSES[agence] && (
              <button onClick={() => setStartAddress(AGENCE_ADRESSES[agence])} style={{background:"none",border:"none",color:C.or,fontSize:"10px",cursor:"pointer",textDecoration:"underline",padding:0,marginBottom:"14px",display:"block"}}>↺ Repartir de l'adresse de l'agence</button>

const MOIS = {janvier:1,février:2,mars:3,avril:4,mai:5,juin:6,juillet:7,août:8,septembre:9,octobre:10,novembre:11,décembre:12};
const parseDateCreneau = (creneau) => {
  if (!creneau) return null;
  // Correctif : \w+ ne matche pas les caractères accentués en JS (février,
  // août, décembre tombaient silencieusement en échec de parsing du mois).
  // \p{L}+ (avec le flag u) matche toute lettre Unicode, accentuée ou non.
  const match = creneau.match(/(\d+)\s+(\p{L}+)(?:\s+(\d{4}))?/gu);
  if (!match) return null;
  const last = match[match.length-1];
  const parts = last.match(/(\d+)\s+(\p{L}+)(?:\s+(\d{4}))?/u);
  if (!parts) return null;
  const day = parseInt(parts[1]);
  const month = MOIS[parts[2].toLowerCase()];
  if (!month) return null;
  const year = parts[3] ? parseInt(parts[3]) : new Date().getFullYear();
  return new Date(year, month-1, day);
};

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

function Technicien({ agence, onClose }) {
  const [tickets, setTickets] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [onglet, setOnglet] = React.useState("aujourd_hui");
  const [selectedTicket, setSelectedTicket] = React.useState(null);
  const [ticketDevis, setTicketDevis] = React.useState(null);
  const [appInstallee, setAppInstallee] = React.useState(() => {
    try { return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; } catch(e) { return false; }
  });
  React.useEffect(() => {
    const f = () => setAppInstallee(true);
    window.addEventListener('appinstalled', f);
    return () => window.removeEventListener('appinstalled', f);
  }, []);
  const [itineraireOpen, setItineraireOpen] = React.useState(false);
  const [noteOpen, setNoteOpen] = React.useState(false);
  const [lastRefresh, setLastRefresh] = React.useState(null);
  const [maxOuvert, setMaxOuvert] = React.useState(false);
  const [maxEcoute, setMaxEcoute] = React.useState(false);
  const [maxEnCours, setMaxEnCours] = React.useState(false);
  const [maxDernier, setMaxDernier] = React.useState("");
  const [maxHistorique, setMaxHistorique] = React.useState([]);
  const [maxErreur, setMaxErreur] = React.useState("");
  const [maxTexte, setMaxTexte] = React.useState("");
  const [vueMode, setVueMode] = React.useState("vocal");
  const [, forcerRenderTech] = React.useState(0);

  // Abonnement push : une seule fois par appareil/agence, silencieux si
  // refusé ou non supporté (iOS < 16.4 notamment). L'agence sert de clé de
  // ciblage côté serveur (voir api/push.js).
  React.useEffect(() => {
    (async () => {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        if (Notification.permission === 'denied') return;
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          const perm = await Notification.requestPermission();
          if (perm !== 'granted') return;
          const keyRes = await fetch('/api/airtable/push');
          const { publicKey } = await keyRes.json();
          if (!publicKey) return;
          sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(publicKey) });
        }
        await fetch('/api/airtable/push', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subscribe: true, agence, subscription: sub.toJSON() }),
        });
      } catch (e) { /* silencieux : la notif n'est qu'un confort, pas un bloquant */ }
    })();
  }, [agence]);

  React.useEffect(() => {
    window.IKO_CLIENT_READY.then(() => {
      const info = window.IKO_CLIENT_INFO;
      if (!info) return;
      appliquerConfigEntreprise({
        couleurAccent: info["Couleur principale"],
        logoUrl: (info["Logo"] && info["Logo"][0] && info["Logo"][0].url) || "",
      });
      // Adresse propre au client (reglee depuis le poste de pilotage) :
      // sert de point de depart par defaut pour toutes les agences de ce
      // client, a la place des adresses de demo codees en dur.
      const adresseClient = info["Adresse"];
      if (adresseClient) {
        Object.keys(AGENCE_ADRESSES).forEach(a => { AGENCE_ADRESSES[a] = adresseClient; });
      }
      forcerRenderTech(x => x + 1);
    });
  }, []);

  const charger = async () => {
    setLoading(true);
    try {
      await window.IKO_CLIENT_READY;
      const rawFilter = filtreAvecClient(agence === "global" || !agence ? "" : '{Agence}="' + agence + '"');
      const filter = rawFilter ? "&filterByFormula=" + encodeURIComponent(rawFilter) : "";
      const url = '/api/airtable/tenant/Tickets%20SAV?sort[0][field]=Name&sort[0][direction]=desc&maxRecords=100' + filter;
      const r = await fetch(url, {});
      const json = await r.json();
      setTickets(json.records||[]);
      setLastRefresh(new Date().toLocaleTimeString('fr-FR'));
    } catch(e) { console.error(e); }
    setLoading(false);
  };

  React.useEffect(() => { charger(); }, [agence]);

  // Rafraîchissement auto : capte les RDV validés par le client (suivi.html)
  // et les RDV ajoutés manuellement (même circuit, table Tickets SAV).
  // ~90-100s (au lieu de 30s) pour économiser le quota API Airtable (compte
  // démo en plan Free, 1000 appels/mois partagés entre plusieurs bases).
  React.useEffect(() => {
    const id = setInterval(charger, 90000 + Math.random() * 10000);
    return () => clearInterval(id);
  }, [agence]);

  const acquitterRdv = async (ticket) => {
    setTickets(prev => prev.map(t => t.id===ticket.id ? {...t, fields:{...t.fields, "RDV modifié - notif technicien": false}} : t));
    try {
      await fetch('/api/airtable/tenant/Tickets%20SAV/'+ticket.id, {
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({fields:{"RDV modifié - notif technicien": false}})
      });
    } catch(e) { console.error(e); }
  };

  // « Je pars » : enregistre l'heure d'arrivée estimée (visible dans le suivi du client) et prévient le client
  // par le webhook (le SMS / e-mail part via le scénario Make, avec le lien de suivi personnel).
  const partirEnRoute = async (ticket, minutes) => {
    const maintenant = new Date();
    const arrivee = new Date(maintenant.getTime() + minutes * 60000);
    const champs = { "En route depuis": maintenant.toISOString(), "Arrivée estimée": arrivee.toISOString() };
    setTickets(prev => prev.map(t => t.id === ticket.id ? { ...t, fields: { ...t.fields, ...champs } } : t));
    try {
      await fetch('/api/airtable/tenant/Tickets%20SAV/' + ticket.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: champs }) });
      await fetch(WEBHOOK, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          marque: 'iko', action: 'technicien_en_route',
          ticket: ticket.fields?.Name, nom: ticket.fields?.Client, "e-mail": ticket.fields?.Email || '', tel: ticket.fields?.["Téléphone"] || '',
          agence: ticket.fields?.Agence, minutes, arrivee: arrivee.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' })
        })
      });
    } catch (e) { console.error(e); }
  };

  const [lienAgenda, setLienAgenda] = React.useState("");
  const [agendaCopie, setAgendaCopie] = React.useState(false);
  const [erreurAgenda, setErreurAgenda] = React.useState("");
  const obtenirLienAgenda = async () => {
    setErreurAgenda("");
    try {
      const r = await fetch('/api/agenda?lien=1&agence=' + encodeURIComponent(agenceShort));
      const j = await r.json();
      if (!r.ok || !j.url) throw new Error(j.error || "indisponible");
      setLienAgenda(j.url);
    } catch (e) { setErreurAgenda("Impossible de générer le lien d'agenda pour l'instant."); }
  };

  const todayStr = new Date().toLocaleDateString('fr-FR');
  const todayLong = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

  const filtrer = (t) => {
    const creneau = (t.fields?.["Créneau"] || "").toLowerCase();
    const statut = t.fields?.Statut || "Nouveau";
    if (onglet === "aujourd_hui") return (creneau.includes(todayStr) || creneau.includes(todayLong.toLowerCase())) && statut !== "Terminé" && statut !== "Annulé";
    if (onglet === "a_venir") return statut !== "Terminé" && statut !== "Annulé";
    if (onglet === "urgent") return t.fields?.Qualification === "Oui" && statut !== "Terminé" && statut !== "Annulé";
    if (onglet === "devis") return statut === "Devis à faire" || statut === "Devis envoyé" || statut === "Devis refusé";
    if (onglet === "termines") return statut === "Terminé";
    if (onglet === "annules") return statut === "Annulé";
    return true;
  };

  const filtered = tickets.filter(filtrer);
  const nbAujourdhui = tickets.filter(t => { const c=(t.fields?.["Créneau"]||"").toLowerCase(); return c.includes(todayStr)||c.includes(todayLong.toLowerCase()); }).length;
  const nbAVenir = tickets.filter(t => { const s=t.fields?.Statut||"Nouveau"; return s!=="Terminé"&&s!=="Annulé"; }).length;
  const nbUrgent = tickets.filter(t => { const s=t.fields?.Statut||"Nouveau"; return t.fields?.Qualification==="Oui" && s!=="Terminé" && s!=="Annulé"; }).length;
  const nbDevisAttente = tickets.filter(t => t.fields?.Statut==="Devis à faire"||t.fields?.Statut==="Devis envoyé").length;
  const notesAgence = tickets.filter(t => typeof t.fields?.Note === "number");
  const moyenneAgence = notesAgence.length ? (notesAgence.reduce((s,t) => s + t.fields.Note, 0) / notesAgence.length) : null;
  const nbTermines = tickets.filter(t => t.fields?.Statut==="Terminé").length;
  const nbAnnules = tickets.filter(t => t.fields?.Statut==="Annulé").length;
  const agenceShort = agence.replace(/ \(\d+\)/,"");

  const imprimerSemaine = () => {
    const now = new Date();
    const jourSemaine = now.getDay();
    const decalageLundi = jourSemaine === 0 ? -6 : 1 - jourSemaine;
    const lundi = new Date(now); lundi.setDate(now.getDate() + decalageLundi); lundi.setHours(0,0,0,0);
    const dimanche = new Date(lundi); dimanche.setDate(lundi.getDate() + 6); dimanche.setHours(23,59,59,999);

    const semaine = tickets
      .filter(t => t.fields?.Statut !== "Annulé")
      .map(t => ({ t, date: parseDateCreneau(t.fields?.["Créneau"]) }))
      .filter(x => x.date && x.date >= lundi && x.date <= dimanche)
      .sort((a,b) => a.date - b.date);

    const fmtJour = (d) => d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
    const lignes = semaine.map(({t}) => `
      <tr>
        <td>${t.fields?.["Créneau"]||""}</td>
        <td>${t.fields?.Name||""}</td>
        <td>${t.fields?.Client||""}</td>
        <td>${t.fields?.Adresse||""}</td>
        <td>${t.fields?.["Téléphone"]||""}</td>
        <td>${t.fields?.Produit||""} — ${t.fields?.["Problème"]||""}</td>
      </tr>`).join("");
    const mailBody = encodeURIComponent(
      `Planning technicien — ${agenceShort}\nSemaine du ${fmtJour(lundi)} au ${fmtJour(dimanche)}\n\n` +
      semaine.map(({t}) => `${t.fields?.["Créneau"]||""} — ${t.fields?.Name||""} — ${t.fields?.Client||""} — ${t.fields?.Adresse||""} — ${t.fields?.["Téléphone"]||""} — ${t.fields?.Produit||""} / ${t.fields?.["Problème"]||""}`).join("\n")
    );
    const mailSubject = encodeURIComponent(`Planning technicien — ${agenceShort} — Semaine du ${fmtJour(lundi)}`);
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Ma semaine — ${agenceShort}</title>
      <style>
        body{font-family:Arial,sans-serif;padding:24px;color:#111;}
        h1{font-size:18px;margin-bottom:2px;}
        .sub{color:#666;font-size:11px;margin-bottom:16px;}
        table{width:100%;border-collapse:collapse;font-size:10px;}
        th{background:#111;color:#fff;text-align:left;padding:6px 8px;}
        td{border-bottom:1px solid #ddd;padding:6px 8px;vertical-align:top;}
        tr:nth-child(even){background:#f7f7f7;}
        .footer{margin-top:16px;font-size:9px;color:#999;}
        .toolbar{display:flex;gap:10px;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #FFD9BF;flex-wrap:wrap;}
        .toolbar button, .toolbar a{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:700;padding:11px 20px;border-radius:10px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;line-height:1;}
        .btn-close{background:#F3F4F6;color:#374151;border:1px solid #E2E2E2 !important;}
        .btn-print{background:#0D0D0D;color:#fff;box-shadow:0 2px 10px rgba(17,17,17,0.25);}
        .btn-mail{background:#FF6B00;color:#111;box-shadow:0 2px 10px rgba(255,107,0,0.35);}
        @media print { @page { size: landscape; margin: 12mm; } .toolbar{display:none;} }
      </style></head><body>
      <div class="toolbar">
        <button class="btn-close" onclick="window.close()"><span>←</span><span>Fermer</span></button>
        <button class="btn-print" onclick="window.print()"><span>🖨️</span><span>Imprimer / PDF</span></button>
        <a class="btn-mail" href="mailto:?subject=${mailSubject}&body=${mailBody}"><span>📧</span><span>Envoyer par email</span></a>
      </div>
      <h1>Iko Suite — Planning technicien</h1>
      <div class="sub">${agenceShort} — Semaine du ${fmtJour(lundi)} au ${fmtJour(dimanche)} — ${semaine.length} intervention(s)</div>
      <table><thead><tr>
        <th>Créneau</th><th>N° Ticket</th><th>Client</th><th>Adresse</th><th>Téléphone</th><th>Produit / Problème</th>
      </tr></thead><tbody>${lignes || '<tr><td colspan="6" style="text-align:center;color:#999;">Aucune intervention cette semaine</td></tr>'}</tbody></table>
      <div class="footer">Iko Suite — Document généré automatiquement</div>
      </body></html>`;
    const w = window.open('', '_blank');
    w.document.write(html);
    w.document.close();
  };

  // ---- Max, l'assistant vocal du technicien ----
  const maxAudioRef = React.useRef(null);
  const VOICE_ID_MAX = "fMikjf4u2qBd4gPl7yuw";
  const SILENCE_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";

  const debloquerVoixIOS = () => {
    try {
      const a = maxAudioRef.current;
      if (a) { a.src = SILENCE_WAV; a.play().catch(() => {}); }
    } catch (e) {}
    try {
      // Amorce synchrone requise par iOS pour que speechSynthesis.speak()
      // fonctionne plus tard, une fois appelé après un await (asynchrone).
      if ('speechSynthesis' in window) {
        const amorce = new SpeechSynthesisUtterance(' ');
        amorce.volume = 0.01;
        amorce.lang = 'fr-FR';
        window.speechSynthesis.speak(amorce);
      }
    } catch (e) {}
  };

  // Repli local si ElevenLabs échoue (quota/crédits épuisés, réseau...) :
  // Max reste audible via la synthèse vocale native du navigateur.
  const parlerNavigateurNatifMax = (texte) => {
    try {
      if (!('speechSynthesis' in window) || !texte) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = 'fr-FR';
      window.speechSynthesis.speak(u);
    } catch (e) {}
  };

  const parlerMax = async (texte) => {
    try {
      if (!texte) return;
      const r = await fetch('/api/tts', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texte, voice_id: VOICE_ID_MAX }),
      });
      if (!r.ok) { parlerNavigateurNatifMax(texte); return; }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = maxAudioRef.current;
      if (a) { a.volume = 1.0; a.src = url; a.play().catch(() => parlerNavigateurNatifMax(texte)); }
    } catch (e) { parlerNavigateurNatifMax(texte); }
  };

  const executerActionsMax = (actions) => {
    (actions || []).forEach(a => {
      if (a.name === 'filtrer_onglet') {
        setOnglet(a.input.onglet);
      } else if (a.name === 'ouvrir_itineraire') {
        setItineraireOpen(true);
      } else if (a.name === 'ouvrir_ticket' && a.input.ticket_id) {
        const t = tickets.find(x => x.id === a.input.ticket_id);
        if (t) setSelectedTicket(t);
      }
    });
  };

  // chercherHistoriqueClientMax est maintenant definie au niveau module
  // (Bloc 1), partagee avec DiagnosticMaxCard — voir plus haut dans le fichier.

  const envoyerMax = async (transcript) => {
    setMaxEnCours(true);
    setMaxErreur("");
    try {
      const contexteTickets = tickets.slice(0, 100).map(t => ({
        id: t.id,
        numero: t.fields?.Name || "",
        client: t.fields?.Client || "",
        statut: t.fields?.Statut || "",
        produit: t.fields?.Produit || "",
        creneau: t.fields?.Créneau || "",
        urgent: t.fields?.Qualification === "Oui",
      }));
      const historiqueClient = selectedTicket ? await chercherHistoriqueClientMax(selectedTicket.fields?.Client) : null;
      const r = await fetch('/api/chat-technicien', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ message: transcript, tickets: contexteTickets, ongletActuel: onglet, historique: maxHistorique.slice(-6), historiqueClient, connaissance: connaissanceEntrepriseLocale(), metier: metierEntrepriseLocal(), analyticsSAV: window.AnalyticsSAV.resumerAnalyticsSAV(window.AnalyticsSAV.calculerAnalyticsSAV(tickets), tickets.length, window.AnalyticsSAV.calculerCroisementsSAV(tickets)), nomAssistant: nomMaxLocal() })
      });
      const data = await r.json();
      if (data.erreur) { setMaxErreur(data.erreur); setMaxEnCours(false); return; }
      executerActionsMax(data.actions || []);
      const texte = data.reponse || "C'est fait.";
      setMaxDernier(texte);
      setMaxHistorique(prev => [...prev, { role: 'user', texte: transcript }, { role: 'assistant', texte }].slice(-8));
      parlerMax(texte);
    } catch (e) {
      setMaxErreur("Connexion impossible. Réessayez.");
    }
    setMaxEnCours(false);
  };

  // Enregistrement + transcription serveur (Whisper), en remplacement de
  // webkitSpeechRecognition (peu fiable sur WebKit iOS après le 1er usage).
  // Marche/arrête au tap (appuyer/relâcher), même correctif que dashboard.html.
  const maxRecorderRef = React.useRef(null);
  const maxChunksRef = React.useRef([]);
  const maxDebutEnregRef = React.useRef(0);
  const DUREE_MIN_ENREG_MS = 600;

  const lancerEcouteMax = async () => {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      const champ = document.getElementById('maxChampTexte');
      if (champ) champ.focus();
      return;
    }
    setMaxErreur("");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
        : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      const recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      maxChunksRef.current = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) maxChunksRef.current.push(e.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        setMaxEcoute(false);
        const blob = new Blob(maxChunksRef.current, { type: recorder.mimeType || mimeType || 'audio/webm' });
        if (blob.size < 800) {
          setMaxErreur("Aucune voix détectée. Réessayez en parlant juste après avoir appuyé sur le micro.");
          return;
        }
        setMaxEnCours(true);
        try {
          const r = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': blob.type || 'audio/webm' },
            body: blob,
          });
          const data = await r.json();
          if (!r.ok || data.erreur || !data.texte) {
            setMaxErreur(data.erreur || "Je n'ai rien compris. Réessayez.");
            setMaxEnCours(false);
            return;
          }
          setMaxDernier(data.texte);
          envoyerMax(data.texte);
        } catch (e) {
          setMaxErreur("Transcription impossible. Réessayez.");
          setMaxEnCours(false);
        }
      };
      maxRecorderRef.current = recorder;
      recorder.start();
      maxDebutEnregRef.current = Date.now();
      setMaxEcoute(true);
      setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 15000);
    } catch (e) {
      setMaxEcoute(false);
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError') {
        setMaxErreur("Micro refusé par le navigateur. Appuyez sur l'icône micro barrée à côté de l'adresse du site pour l'autoriser, puis réessayez.");
      } else if (e.name === 'NotFoundError') {
        setMaxErreur("Aucun micro détecté sur cet appareil.");
      } else {
        setMaxErreur("Problème micro (" + e.name + "). Utilisez le champ texte en attendant.");
      }
    }
  };

  const arreterEcouteMax = () => {
    if (!maxRecorderRef.current || maxRecorderRef.current.state !== 'recording') return;
    const ecoule = Date.now() - maxDebutEnregRef.current;
    const restant = DUREE_MIN_ENREG_MS - ecoule;
    if (restant > 0) {
      setTimeout(() => {
        if (maxRecorderRef.current && maxRecorderRef.current.state === 'recording') {
          maxRecorderRef.current.stop();
        }
      }, restant);
    } else {
      maxRecorderRef.current.stop();
    }
  };

  if (vueMode === "vocal") {
    return (
      <div style={{position:"fixed",inset:0,background:"var(--iko-bg-sombre)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:100,WebkitUserSelect:"none",userSelect:"none",WebkitTouchCallout:"none"}}
        onContextMenu={e => e.preventDefault()}>
        <audio ref={maxAudioRef} style={{display:"none"}}/>
        <div style={{width:"220px",height:"220px",borderRadius:"50%",
          background:"radial-gradient(circle at 35% 30%, var(--iko-primary-pale), var(--iko-primary) 55%, var(--iko-primary-fonce) 100%)",
          boxShadow:"0 0 90px rgba(var(--iko-primary-rgb),0.35)",
          animation: maxEcoute ? "pulseMaxEcran 1s ease-in-out infinite" : "respireMax 3.2s ease-in-out infinite"}}/>
        <div style={{marginTop:"32px",color:"#b8b8b8",fontSize:"14px",maxWidth:"320px",textAlign:"center",minHeight:"40px",lineHeight:"1.5",padding:"0 16px"}}>
          {maxEcoute ? "Je vous écoute... (relâchez le micro pour terminer)" : maxEnCours ? "..." : maxDernier ? maxDernier : `Dites une commande à ${nomMaxLocal()} : "Montre les urgents", "Ouvre l'itinéraire"...`}
        </div>
        {maxErreur && <div style={{color:"var(--iko-erreur)",fontSize:"12px",marginTop:"10px",padding:"0 16px",textAlign:"center"}}>{maxErreur}</div>}

        <div style={{marginTop:"26px",width:"90%",maxWidth:"460px",display:"flex",flexDirection:"column",gap:"16px",alignItems:"center"}}>
          <div style={{display:"flex",gap:"10px",alignItems:"center",width:"100%"}}>
          <button
            onPointerDown={() => { debloquerVoixIOS(); lancerEcouteMax(); }}
            onPointerUp={arreterEcouteMax}
