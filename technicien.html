// Ajoute un secret partage sur tous les appels au proxy Airtable, pour
// empecher un acces direct a l'API sans passer par cette page (voir
// api/airtable-proxy.js pour le detail et les limites de cette protection).
(function() {
  var APP_SECRET = "97960bb3f41d75c71ba3e831a7acb90ab324549734e27d6a";
  var _fetch = window.fetch;
  window.fetch = function(url, opts) {
    if (typeof url === "string" && url.indexOf("/api/airtable") === 0) {
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers || {}, { "X-App-Secret": APP_SECRET });
    }
    return _fetch(url, opts);
  };
})();

window.IKO_CLIENT_ID = null;
window.IKO_CLIENT_INFO = null;
window.IKO_ROLE = null;
window.IKO_ACCES_REFUSE = false;
window.IKO_CLIENT_READY = (async function () {
  try {
    var resSession = await fetch('/api/verif-securite?action=session');
    if (resSession.status === 401) {
      window.location.href = "/auth-login.html?retour=" + encodeURIComponent("/technicien.html");
      return null;
    }
    var session = await resSession.json();
    window.IKO_ROLE = session.role;
    if (session.role !== "SUPER_ADMIN_IKO" && session.role !== "TECHNICIEN") {
      window.IKO_ACCES_REFUSE = true;
      return null;
    }

    if (session.role === "TECHNICIEN") {
      // tenantId de la session = seule autorite. ?client=slug n'a plus
      // aucun pouvoir d'autorisation pour ce role.
      if (!session.tenantId) { window.IKO_ACCES_REFUSE = true; return null; }
      var rTenant = await fetch('/api/airtable/Clients/' + session.tenantId, {});
      if (!rTenant.ok) { window.IKO_ACCES_REFUSE = true; return null; }
      var recTenant = await rTenant.json();
      window.IKO_CLIENT_ID = recTenant.id;
      window.IKO_CLIENT_INFO = recTenant.fields || {};
      return recTenant.id;
    }

    // SUPER_ADMIN_IKO : ?client=slug = confort de navigation uniquement.
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('client');
    if (slug) { localStorage.setItem('iko_client_slug', slug); }
    else { slug = localStorage.getItem('iko_client_slug'); }
    if (!slug) return null;
    var formule = encodeURIComponent('{Slug}="' + slug + '"');
    var r = await fetch('/api/airtable/Clients?filterByFormula=' + formule + '&maxRecords=1', {});
    var json = await r.json();
    var rec = (json.records || [])[0];
    if (!rec) return null;
    window.IKO_CLIENT_ID = rec.id;
    window.IKO_CLIENT_INFO = rec.fields || {};
    return rec.id;
  } catch (e) { return null; }
})();
</script>

// Même compte/preset Cloudinary que index.html (dvbh3llqq / rsia_sav_unsigned,

// en cas d'évolution.
const CLOUDINARY_CLOUD = 'dvbh3llqq';
const CLOUDINARY_PRESET = 'rsia_sav_unsigned';

async function compresserImageTech(file) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/')) { resolve(file); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        const maxDim = 1920;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => {
          resolve(new File([blob], file.name, { type: 'image/jpeg' }));
        }, 'image/jpeg', 0.8);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadCloudinaryTech(file) {
  const compressed = await compresserImageTech(file);
  const formData = new FormData();
  formData.append('file', compressed);
  formData.append('upload_preset', CLOUDINARY_PRESET);
  formData.append('folder', 'iko-suite-sav');
  const resp = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/auto/upload', { method: 'POST', body: formData });
  const data = await resp.json();
  return data.secure_url;
}

function tauxTvaVersDecimal(label) {
  if (!label) return 0.20;
  const m = String(label).match(/([\d.,]+)/);
  return m ? parseFloat(m[1].replace(',', '.')) / 100 : 0.20;
}

async function resoudreClientDepuisAgenceTech(agenceLabel) {
  // Le client est deja connu via le boot ?client=slug (window.IKO_CLIENT_*) ;
  // on ne va chercher dans Agences que l'ID d'agence (facultatif, pour lier
  // le devis a la bonne agence — non bloquant si les agences n'ont pas ete
  // renommees depuis "Nouvelle agence").
  const clientId = window.IKO_CLIENT_ID;
  const clientNom = window.IKO_CLIENT_INFO && window.IKO_CLIENT_INFO["Nom client"];
  if (!clientId || !clientNom) return null;
  let agenceId = null;
  try {
    const fA = encodeURIComponent('{Nom agence}="' + agenceLabel + '"');
    const rA = await fetch('/api/airtable/Agences?filterByFormula=' + fA + '&maxRecords=1');
    const jA = await rA.json();
    agenceId = (jA.records || [])[0]?.id || null;
  } catch(e) {}
  return { agenceId, clientId, clientNom };
}

async function chargerCatalogueDevisTech(clientNom) {
  // ARRAYJOIN() sur un lien renvoie le nom affiche, jamais l'ID (confirme en prod).
  const nomEchappe = String(clientNom).replace(/"/g, '\\"');
  const formule = 'FIND("' + nomEchappe + '", ARRAYJOIN({Client}))';
  const [rProd, rMo, rMep] = await Promise.all([
    fetch('/api/airtable/Catalogue%20Produits?filterByFormula=' + encodeURIComponent(formule)),
    fetch('/api/airtable/Grille%20Main%20d%27%C5%93uvre?filterByFormula=' + encodeURIComponent(formule)),
    fetch('/api/airtable/Mise%20en%20page%20Devis?filterByFormula=' + encodeURIComponent(formule)),
  ]);
  const [jProd, jMo, jMep] = await Promise.all([rProd.json(), rMo.json(), rMep.json()]);

async function chargerImageEnDataUrlTech(url) {
  if (!url) return null;
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    const dataUrl = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
    if (!dataUrl) return null;
    const ratio = await new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : null);
      img.onerror = () => resolve(null);
      img.src = dataUrl;
    });
    return { url: dataUrl, ratio };
  } catch(e) { return null; }
}

function rendrePiedPageRicheTech(html) {
  if (!html) return null;
  const gras = /<(b|strong)[ >]/i.test(html);
  const italique = /<(i|em)[ >]/i.test(html);
  let align = 'center';
  if (/text-align:\s*right/i.test(html)) align = 'right';
  else if (/text-align:\s*left/i.test(html)) align = 'left';
  const texte = html.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/gi, ' ').replace(/\s+/g, ' ').trim();
  if (!texte) return null;
  return { texte, gras, italique, align };
}

function hexVersRgbTech(hex, secours) {
  hex = String(hex || secours || '#111111').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex, 16);
  if (isNaN(num)) return [17, 17, 17];
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
}

async function dessinerElementsGraphiquesTech(doc, elements) {
  if (!Array.isArray(elements) || !elements.length) return;
  const tries = elements.filter(el => el && el.visible !== false).sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));
  for (const el of tries) {
    try {
      if (el.type === 'rect' || el.type === 'circle') {
        const [dr, dg, db] = hexVersRgbTech(el.stroke);
        doc.setDrawColor(dr, dg, db);
        doc.setLineWidth(el.strokeWidth != null ? el.strokeWidth : 1);
        const aRemplir = el.fill && el.fill !== 'none';
        if (aRemplir) { const [fr, fg, fb] = hexVersRgbTech(el.fill); doc.setFillColor(fr, fg, fb); }
        const style = aRemplir ? 'FD' : 'S';
        if (el.type === 'rect') {
          doc.rect(el.x, el.y, el.w, el.h, style);
        } else {
          doc.ellipse(el.x + el.w / 2, el.y + el.h / 2, el.w / 2, el.h / 2, style);
        }
      } else if (el.type === 'line') {
        const [dr, dg, db] = hexVersRgbTech(el.stroke);
        doc.setDrawColor(dr, dg, db);
        doc.setLineWidth(el.strokeWidth != null ? el.strokeWidth : 2);
        doc.line(el.x1, el.y1, el.x2, el.y2);
        if (el.arrowEnd) {
          const angle = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
          const taille = 3;
          const p1x = el.x2 - taille * Math.cos(angle - Math.PI / 7), p1y = el.y2 - taille * Math.sin(angle - Math.PI / 7);
          const p2x = el.x2 - taille * Math.cos(angle + Math.PI / 7), p2y = el.y2 - taille * Math.sin(angle + Math.PI / 7);
          doc.setFillColor(dr, dg, db);
          doc.triangle(el.x2, el.y2, p1x, p1y, p2x, p2y, 'F');
        }
      } else if (el.type === 'image' && el.url) {
        const info = await chargerImageEnDataUrlTech(el.url);
        if (info && info.url) {
          try { doc.addImage(info.url, 'JPEG', el.x, el.y, el.w, el.h, undefined, 'FAST'); }
          catch (e) { try { doc.addImage(info.url, 'PNG', el.x, el.y, el.w, el.h, undefined, 'FAST'); } catch (e2) {} }
        }
      }
    } catch (e) { /* un élément mal formé ne doit pas bloquer le reste du PDF */ }
  }
}

async function creerDemandeSignatureYousignTech(pdfBlob, nomFichier, personneNom, email, telephone) {
  const reqRes = await fetch('/api/yousign/signature_requests', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: nomFichier, delivery_mode: 'none', timezone: 'Europe/Paris' })
  });
  if (!reqRes.ok) throw new Error('Yousign: création de la demande échouée');
  const signatureRequest = await reqRes.json();
  const srId = signatureRequest.id;

  const form = new FormData();
  form.append('file', pdfBlob, nomFichier + '.pdf');
  form.append('nature', 'signable_document');
  form.append('parse_anchors', 'false');
  const docRes = await fetch('/api/yousign/signature_requests/' + srId + '/documents', { method: 'POST', body: form });
  if (!docRes.ok) throw new Error('Yousign: envoi du document échoué');
  const document = await docRes.json();

  const nomParts = (personneNom || 'Client Iko Suite').trim().split(/\s+/);
  const firstName = nomParts.length > 1 ? nomParts.slice(0, -1).join(' ') : 'Client';
  const lastName = nomParts.length > 1 ? nomParts[nomParts.length - 1] : nomParts[0];
  const telValide = telephone && /^(\+33|0)[1-9](\d{2}){4}$/.test(String(telephone).replace(/[\s.-]/g, ''));

  const signerRes = await fetch('/api/yousign/signature_requests/' + srId + '/signers', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      info: { first_name: firstName, last_name: lastName, email, phone_number: telValide ? String(telephone).replace(/[\s.-]/g, '') : undefined, locale: 'fr' },
      signature_level: 'electronic_signature', signature_authentication_mode: 'no_otp',
      fields: [{ document_id: document.id, type: 'signature', page: 1, x: 60, y: 700 }]
    })
  });
  if (!signerRes.ok) throw new Error('Yousign: ajout du signataire échoué');
  const signer = await signerRes.json();
  const signerId = signer.id;

  await fetch('/api/yousign/signature_requests/' + srId + '/activate', { method: 'POST' });

  let lienSignature = '';
  for (let tentative = 0; tentative < 4 && !lienSignature; tentative++) {
    if (tentative > 0) await new Promise(r => setTimeout(r, 800));
    try {
      const signerFraisRes = await fetch('/api/yousign/signature_requests/' + srId + '/signers/' + signerId);
      if (signerFraisRes.ok) {
        const signerFrais = await signerFraisRes.json();
        lienSignature = signerFrais.signature_link || signerFrais.signature_url || signerFrais.signature_link_url || '';
      }
    } catch(e) {}
  }

  return { signatureRequestId: srId, lienSignature };
}

// Géocodage gratuit via OpenStreetMap Nominatim (léger usage interne, pas de clé requise)
const geocodeCache = {};
async function geocodeAddress(address) {
  if (!address || !address.trim()) return null;
  if (geocodeCache[address]) return geocodeCache[address];
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q=' + encodeURIComponent(address);
    const r = await fetch(url, { headers: { 'Accept-Language': 'fr' } });
    const json = await r.json();
    if (json && json[0]) {
      const coord = { lat: parseFloat(json[0].lat), lon: parseFloat(json[0].lon) };
      geocodeCache[address] = coord;
      return coord;
    }
  } catch(e) { console.error('geocode error', e); }
  return null;
}
function pause(ms) { return new Promise(res => setTimeout(res, ms)); }

function haversine(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function optimiserOrdre(start, stops) {
  // Plus proche voisin
  const remaining = stops.slice();
  const order = [];
  let current = start;
  while (remaining.length) {
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((s, i) => {
      const d = haversine(current, s.coord);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    });
    const next = remaining.splice(bestIdx, 1)[0];
    order.push(next);
    current = next.coord;
  }
  // Amélioration 2-opt
  const totalDist = (route) => {
    let d = haversine(start, route[0].coord);
    for (let i = 0; i < route.length - 1; i++) d += haversine(route[i].coord, route[i+1].coord);
    return d;
  };
  let route = order;
  let improved = true;
  let guard = 0;
  while (improved && guard < 200) {
    improved = false;
    guard++;
    for (let i = 0; i < route.length - 1; i++) {
      for (let j = i + 1; j < route.length; j++) {
        const newRoute = route.slice(0,i).concat(route.slice(i,j+1).reverse(), route.slice(j+1));
        if (totalDist(newRoute) < totalDist(route) - 0.01) { route = newRoute; improved = true; }
      }
    }
  }
  return route;
}

// Jumeau numerique : cherche l'historique des ouvertures mesurees/posees
// pour le client donne, pour que Max le connaisse deja sans que le client
// ait a tout redecrire sur place. Remontee au niveau module (Bloc 1) pour
// etre partagee par Technicien (widget vocal general) et DiagnosticMaxCard
// (diagnostic sur ticket ouvert dans ModalAction).
async function chercherHistoriqueClientMax(nomClient) {
  if (!nomClient) return null;
  try {
    const formuleFiche = "FIND(LOWER(\"" + nomClient.replace(/"/g, '\\"') + "\"),LOWER({Client}))";
    const rFiches = await fetch('/api/airtable/' + encodeURIComponent("Métrés") +
      '?filterByFormula=' + encodeURIComponent(formuleFiche) + '&sort[0][field]=Date&sort[0][direction]=desc&maxRecords=2');
    const jsonFiches = await rFiches.json();
    if (!rFiches.ok || !jsonFiches.records || jsonFiches.records.length === 0) return null;

    const dossiers = [];
    for (const fiche of jsonFiches.records) {
      const formuleOuv = "FIND(\"" + fiche.id + "\",ARRAYJOIN({Métré}))";
      const rOuv = await fetch('/api/airtable/' + encodeURIComponent("Ouvertures Métré") +
        '?filterByFormula=' + encodeURIComponent(formuleOuv) + '&maxRecords=20');
      const jsonOuv = await rOuv.json();
      const ouvertures = (jsonOuv.records || []).map(o => ({
        repere: o.fields["Repère"] || "", type: o.fields["Type"] || "", pose: o.fields["Pose"] || "",
        dimensions: (o.fields["Largeur mm"] || "?") + "x" + (o.fields["Hauteur mm"] || "?") + " mm",
        couleur: o.fields["Couleur / RAL"] || "",
      }));
      dossiers.push({ adresse: fiche.fields["Adresse"] || "", date_mesure: fiche.fields["Date"] || "", ouvertures });
    }
    return dossiers.length ? dossiers : null;
  } catch (e) {
    return null;
  }
}

  if (!nomClient) return [];

    const formule = "FIND(LOWER(\"" + nomClient.replace(/"/g, '\\"') + "\"),LOWER({Client}))";
    const r = await fetch('/api/airtable/Tickets%20SAV?filterByFormula=' + encodeURIComponent(formule) +
      '&sort[0][field]=Créneau&sort[0][direction]=desc&maxRecords=6');
    const json = await r.json();
    if (!r.ok || !json.records) return [];
    return json.records
      .filter(t => t.id !== idTicketActuel)
      .slice(0, 3)
      .map(t => ({
        date: t.fields?.["Créneau"] || "",
        produit: t.fields?.Produit || "",
        probleme: t.fields?.["Problème"] || "",
        statut: t.fields?.Statut || "",
        diagnostic: t.fields?.["IKO Diagnostic"] || t.fields?.Diagnostic || "",
      }));
  } catch (e) {
    return [];
  }
}

// ==================== Bloc 1 : DiagnosticMaxCard ====================
// Carte lecture seule affichee quand un ticket est ouvert. Le technicien

const LABELS_ACTION_MAX = {
  terminer: "SAV terminé", devis: "Devis", devis_place: "Devis sur place",
  replanifier: "Replanifier", annuler: "Annuler le RDV",
};

const LABELS_CONFIANCE_MAX = { faible: "Confiance faible", moyenne: "Confiance moyenne", elevee: "Confiance élevée" };
const COULEURS_CONFIANCE_MAX = { faible: "#DC2626", moyenne: "#DAB239", elevee: "#22C55E" };
const SEUIL_RDV_MODIFIE_JOURS = 2; // extension Bloc 5, même seuil que dashboard.html

// Bloc 4 - point 1 : fonction partagée entre DiagnosticMaxCard (sauvegarde
// manuelle) et ModalAction.confirmer() (fusion automatique à la clôture),
// pour ne jamais dupliquer le format du texte enregistré dans "IKO Diagnostic".
function formaterTexteDiagnosticMax(resultat) {
  return (LABELS_CONFIANCE_MAX[resultat.confiance] || "Confiance moyenne") + "\n\n" +
    "FAIT : " + (resultat.fait || "—") + "\n" +
    "SIGNAL : " + (resultat.signal || "—") + "\n" +
    "PISTE : " + (resultat.piste || "—") + "\n" +

}

      const r = await fetch('/api/chat-technicien', {

          {photosUrls.length > 0 && (
            <label style={{display:"flex",alignItems:"center",gap:"6px",fontSize:"11px",color:C.muted,marginTop:"6px"}}>

            <div style={{marginTop:"10px",fontSize:"11px",color:C.text,display:"flex",flexDirection:"column",gap:"6px"}}>
              {resultat.confiance && (
                <div style={{display:"inline-flex",alignSelf:"flex-start",alignItems:"center",gap:"5px",background:"#fff",border:"1px solid "+(COULEURS_CONFIANCE_MAX[resultat.confiance]||C.muted),borderRadius:"10px",padding:"2px 8px",fontSize:"10px",fontWeight:"700",color:COULEURS_CONFIANCE_MAX[resultat.confiance]||C.muted}}>

              {resultat.piste && <div><b style={{color:"#8a8a8a"}}>PISTE · </b>{resultat.piste}</div>}
              {resultat.proposition && <div><b style={{color:"#0D0D0D"}}>PROPOSITION · </b>{resultat.proposition}</div>}

              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ModalAction({ ticket, onClose, onDone }) {
  const [mode, setMode] = React.useState(ticket.fields?.Statut === "Devis envoyé" ? "debloquer" : null);
  // Bloc 4 - point 1 : state du diagnostic remonté ici (au lieu de rester
  // interne à DiagnosticMaxCard) pour pouvoir le fusionner dans le PATCH de
  // confirmer() si le technicien clôture sans avoir cliqué "Garder" manuellement.
  const [resultatDiagnostic, setResultatDiagnostic] = React.useState(null);
  const [diagnosticGarde, setDiagnosticGarde] = React.useState(!!ticket.fields?.["IKO Utilisé"]);
  const [commentaire, setCommentaire] = React.useState("");
  const [newDate, setNewDate] = React.useState("");
  const [newCreneau, setNewCreneau] = React.useState("Matin (8h30 — 12h00)");
  const [saving, setSaving] = React.useState(false);
  const [tags, setTags] = React.useState([]);
  const [explication, setExplication] = React.useState("");
  const today = new Date().toISOString().split('T')[0];

  // Frais diagnostic (cas client non garanti + non existant + technicien
  // sans le matériel sur place) : montant paramétré par client pro dans le
  // Poste de pilotage (window.IKO_CLIENT_INFO, déjà chargé au boot, aucun
  // fetch supplémentaire). Déduit automatiquement du devis si accepté plus
  // tard (géré côté yousign-webhook.js).
  const nonGarantiTicket = /^non/i.test((ticket.fields?.Garantie || "").trim());
  const [clientExistantDevis, setClientExistantDevis] = React.useState(ticket.fields?.["Client existant"] !== false);
  const montantDiagnostic = Number(window.IKO_CLIENT_INFO?.["Montant diagnostic HT"]) || 0;
  const fraisDiagnosticApplicable = nonGarantiTicket && !clientExistantDevis && montantDiagnostic > 0;

  // Devis auto (Iko) : proposé au moment de valider l'intervention. Le
  // technicien peut piocher dans le catalogue du client, et si des lignes
  // sont ajoutées, le devis est généré et envoyé au client automatiquement
  // (PDF + Yousign), sans passer par l'agence.
  const [catalogueAuto, setCatalogueAuto] = React.useState({ produits: [], mo: [], mep: null });
  const [clientInfoAuto, setClientInfoAuto] = React.useState(null);
  const [chargementCatalogueAuto, setChargementCatalogueAuto] = React.useState(false);
  const [lignesAuto, setLignesAuto] = React.useState([]);
  const [choixLigneAuto, setChoixLigneAuto] = React.useState("");
  const [qteLigneAuto, setQteLigneAuto] = React.useState(1);
  const [emailAuto, setEmailAuto] = React.useState(ticket.fields?.Email || "");
  const [modePaiementPlace, setModePaiementPlace] = React.useState("");

  // ---- Bloc 3 - axe B : photo terrain ----
  // Réutilise l'infrastructure Cloudinary existante (même compte/preset que
  // index.html, voir uploadCloudinaryTech plus haut) : aucun nouveau flux.
  // Concatène simplement la nouvelle URL au champ "Photos" existant, comme
  // le fait déjà le portail client.
  const [photoEnCoursUpload, setPhotoEnCoursUpload] = React.useState(false);
  const [erreurPhoto, setErreurPhoto] = React.useState("");
  const [photosTicket, setPhotosTicket] = React.useState(ticket.fields?.Photos || "");

  const ajouterPhotoTerrain = async (fichier) => {
    if (!fichier) return;
    setErreurPhoto(""); setPhotoEnCoursUpload(true);
    try {
      const url = await uploadCloudinaryTech(fichier);
      if (!url) throw new Error("upload échoué");
      const nouvelleValeur = photosTicket ? photosTicket + ',' + url : url;
      const r = await fetch('/api/airtable/Tickets%20SAV/' + ticket.id, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Photos: nouvelleValeur } }),
      });
      if (!r.ok) throw new Error("écriture échouée");
      setPhotosTicket(nouvelleValeur);
      ticket.fields.Photos = nouvelleValeur; // reflet immédiat pour DiagnosticMaxCard, sans re-fetch du ticket
    } catch (e) {
      setErreurPhoto("Envoi de la photo impossible. Réessayez.");
    }
    setPhotoEnCoursUpload(false);
  };

  // ---- Bloc 2B : compte-rendu vocal structuré (mode "terminer") ----
  // Réutilise l'infrastructure existante MediaRecorder -> /api/tts (comme
  // le widget Max). Le texte dicté brut reste toujours visible/modifiable.
  // Structuration sur demande explicite uniquement, aucune écriture
  // automatique dans Commentaire — confirmer() n'est pas modifiée.
  const [texteDicteBrut, setTexteDicteBrut] = React.useState("");
  const [enregistrementCREnCours, setEnregistrementCREnCours] = React.useState(false);
  const [structurationEnCours, setStructurationEnCours] = React.useState(false);
  const [compteRenduStructure, setCompteRenduStructure] = React.useState(null);
  const recorderCRRef = React.useRef(null);
  const chunksCRRef = React.useRef([]);

  const dicterCompteRendu = async () => {
    if (!navigator.mediaDevices || !window.MediaRecorder) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
        : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      const recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      chunksCRRef.current = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunksCRRef.current.push(e.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        setEnregistrementCREnCours(false);
        const blob = new Blob(chunksCRRef.current, { type: recorder.mimeType || mimeType || 'audio/webm' });
        if (blob.size < 800) return;
        try {
          const r = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': blob.type || 'audio/webm' }, body: blob });
          const data = await r.json();
          if (r.ok && data.texte) setTexteDicteBrut(prev => (prev ? prev + " " : "") + data.texte);
        } catch (e) {}
      };
      recorderCRRef.current = recorder;
      recorder.start();
      setEnregistrementCREnCours(true);
      setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 30000);
    } catch (e) { setEnregistrementCREnCours(false); }
  };
  const arreterDicteeCompteRendu = () => {
    if (recorderCRRef.current && recorderCRRef.current.state === 'recording') recorderCRRef.current.stop();
  };

  const structurerCompteRendu = async () => {
    if (!texteDicteBrut.trim()) return;
    setStructurationEnCours(true);
    try {
      const r = await fetch('/api/chat-technicien', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'structurer_compte_rendu', texteDicte: texteDicteBrut.trim() }),
      });
      const data = await r.json();
      if (r.ok && !data.erreur) setCompteRenduStructure(data);
    } catch (e) {}
    setStructurationEnCours(false);
  };

  // Écriture dans Commentaire uniquement sur validation explicite du
  // technicien (clic). confirmer() reste inchangée : elle lit simplement
  // le state "commentaire" comme avant.
  const utiliserCompteRenduStructure = () => {
    if (!compteRenduStructure) return;
    const parties = [];
    if (compteRenduStructure.fait_constate) parties.push("Fait constaté : " + compteRenduStructure.fait_constate);
    if (compteRenduStructure.intervention_realisee) parties.push("Intervention réalisée : " + compteRenduStructure.intervention_realisee);
    if (compteRenduStructure.piece_action_necessaire) parties.push("Pièce/action nécessaire : " + compteRenduStructure.piece_action_necessaire);
    if (compteRenduStructure.suite_a_donner) parties.push("Suite à donner : " + compteRenduStructure.suite_a_donner);
    setCommentaire(parties.join("\n"));
  };

  // ---- Bloc 2C : suggestions de lignes de devis (mode "devis_place") ----
  // Le catalogue réel est déjà chargé (catalogueAuto). Ajout UNE PAR UNE
  // après validation du technicien, jamais de devis complet automatique.
  const [suggestionsDevis, setSuggestionsDevis] = React.useState(null);
  const [chargementSuggestionsDevis, setChargementSuggestionsDevis] = React.useState(false);

  const demanderSuggestionsDevis = async () => {
    if (!catalogueAuto.produits.length && !catalogueAuto.mo.length) return;
    setChargementSuggestionsDevis(true);
    setSuggestionsDevis(null);
    try {
      const catalogueEnvoye = [
        ...catalogueAuto.produits.map(p => ({ id: p.id, type: 'produit', designation: p.fields?.["Désignation"] || '', prix: p.fields?.["Prix unitaire HT"] || 0 })),
        ...catalogueAuto.mo.map(m => ({ id: m.id, type: 'mo', designation: m.fields?.["Type d'action"] || '', prix: m.fields?.["Prix forfait HT"] || m.fields?.["Taux horaire HT"] || 0 })),
      ];
      const r = await fetch('/api/chat-technicien', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'devis_suggestion',
          ticket: { produit: ticket.fields?.Produit || '', probleme: ticket.fields?.["Problème"] || '' },
          catalogue: catalogueEnvoye,
        }),
      });
      const data = await r.json();
      if (r.ok && !data.erreur) setSuggestionsDevis(data.lignes || []);
    } catch (e) {}
    setChargementSuggestionsDevis(false);
  };

  const ajouterLigneSuggeree = (ligne) => {
    const produitSource = catalogueAuto.produits.find(p => p.id === ligne.catalogue_id);
    const tauxTva = ligne.type === 'produit' ? tauxTvaVersDecimal(produitSource?.fields?.["Taux TVA"]) : 0.20;
    const totalHT = (ligne.quantite || 1) * ligne.prix;
    setLignesAuto(prev => [...prev, { designation: ligne.designation, qte: ligne.quantite || 1, puHT: ligne.prix, tauxTva, totalHT, totalTTC: totalHT * (1 + tauxTva) }]);
    setSuggestionsDevis(prev => (prev || []).filter(l => l.catalogue_id !== ligne.catalogue_id));
  };

  React.useEffect(() => {
    if (mode !== "devis_place" || catalogueAuto.mep !== null) return;
    setChargementCatalogueAuto(true);
    (async () => {
      try {
        const resolu = await resoudreClientDepuisAgenceTech(ticket.fields?.Agence);
        if (resolu) {
          setClientInfoAuto(resolu);
          const cat = await chargerCatalogueDevisTech(resolu.clientNom);
          setCatalogueAuto(cat);
        }
      } catch(e) { console.error(e); }
      setChargementCatalogueAuto(false);
    })();
  }, [mode]);

  const ajouterLigneAuto = () => {
    if (!choixLigneAuto) return;
    const [type, id] = choixLigneAuto.split('|');
    const source = type === 'produit' ? catalogueAuto.produits.find(p => p.id === id) : catalogueAuto.mo.find(m => m.id === id);
    if (!source) return;
    const f = source.fields || {};
    const designation = type === 'produit' ? (f["Désignation"] || '—') : (f["Type d'action"] || '—');
    const puHT = type === 'produit' ? (f["Prix unitaire HT"] || 0) : (f["Prix forfait HT"] || f["Taux horaire HT"] || 0);
    const tauxTva = type === 'produit' ? tauxTvaVersDecimal(f["Taux TVA"]) : 0.20;
    const totalHT = (Number(qteLigneAuto) || 1) * puHT;
    setLignesAuto([...lignesAuto, { designation, qte: Number(qteLigneAuto) || 1, puHT, tauxTva, totalHT, totalTTC: totalHT * (1 + tauxTva) }]);
    setChoixLigneAuto(""); setQteLigneAuto(1);
  };

  const TAGS_DEVIS = [
    "Pièce détachée à commander",
    "Intervention complémentaire nécessaire",
    "Dommage plus important que prévu",
    "Matériel spécifique requis",
    "Autre",
  ];
  const toggleTag = (t) => setTags(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]);

  const envoyerDevisAuto = async () => {
    const emailValide = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailAuto.trim());
    if (!lignesAuto.length || !emailValide || !clientInfoAuto) return;
    const numero = "DEV-" + new Date().getFullYear() + "-" + Math.floor(1000 + Math.random() * 9000);
    const montantHT = lignesAuto.reduce((s, l) => s + (l.totalHT || 0), 0);
    const montantTTC = lignesAuto.reduce((s, l) => s + (l.totalTTC != null ? l.totalTTC : l.totalHT * 1.2), 0);
    const cpMatch = (ticket.fields?.Adresse || "").match(/\b\d{5}\b/);
    const client = { nom: ticket.fields?.Client, adresse: ticket.fields?.Adresse || "", cp: cpMatch ? cpMatch[0] : "" };
    const mep = catalogueAuto.mep || { identite: {}, assurance: {}, piedPage: "", dureeValidite: 30 };

    const champsDevis = {
      "N° devis": numero, "Ticket lié": [ticket.id], "Client": [clientInfoAuto.clientId],
      "Nom client": client.nom, "Adresse client": client.adresse, "CP client": client.cp,
      "Lignes devis (JSON)": JSON.stringify(lignesAuto), "Montant HT": montantHT, "Montant TTC": montantTTC,
      "Statut": "Envoyé", "Mode": "Auto Iko",
    };
    if (clientInfoAuto.agenceId) champsDevis["Agence"] = [clientInfoAuto.agenceId];

    const devisRes = await fetch('/api/airtable/Devis', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records: [{ fields: champsDevis }] })
    });
    const devisJson = await devisRes.json();
    const devisRec = devisJson.records?.[0];
    if (!devisRec) throw new Error("Création du devis auto échouée.");

    const pdfBlob = await genererPdfDevisTech({ numero, ticket, client, lignes: lignesAuto, montantHT, montantTTC, mep });

    let yousignFields = {};
    try {
      const { signatureRequestId, lienSignature } = await creerDemandeSignatureYousignTech(pdfBlob, numero, client.nom, emailAuto.trim(), ticket.fields?.Téléphone);
      yousignFields = { "Yousign Request ID": signatureRequestId, "Yousign Signer Link": lienSignature };
    } catch (yousignErr) {
      console.error('Yousign indisponible, devis auto créé sans signature électronique :', yousignErr);
    }
    await fetch('/api/airtable/Devis/' + devisRec.id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: yousignFields })
    });

    await fetch('/api/airtable/Tickets%20SAV/' + ticket.id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: { "Montant devis": Math.round(montantTTC * 100) / 100, Email: emailAuto.trim() } })
    });

    const lienDevis = window.location.origin + '/devis.html?devisId=' + devisRec.id;
    await fetch(WEBHOOK, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        marque: 'iko', action: 'devis_auto_envoye',
        ticket: ticket.fields?.Name, nom: ticket.fields?.Client, "e-mail": emailAuto.trim(),
        agence: ticket.fields?.Agence, produit: ticket.fields?.Produit, probleme: ticket.fields?.Problème,
        montant: montantTTC.toFixed(2) + ' €', lien: lienDevis
      })
    });
  };

  const confirmer = async () => {
    if (mode === "replanifier" && !newDate) return;
    if (mode === "debloquer" && !newDate) return;
    if (mode === "annuler" && !commentaire.trim()) return;
    if (mode === "devis" && !explication.trim()) return;
    if (mode === "devis_place" && (!lignesAuto.length || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailAuto.trim()) || !modePaiementPlace)) return;
    setSaving(true);
    try {
      const fields = {};
      let dateLabelDeblocage = "";
      let noteToken = "";
      if (mode === "terminer") {
        fields.Statut = "Terminé";
        if (commentaire) fields.Commentaire = commentaire;
        noteToken = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
        fields["Note Token"] = noteToken;
      } else if (mode === "devis_place") {
        fields.Statut = "Terminé";
        fields["Mode paiement"] = modePaiementPlace;
        if (commentaire) fields.Commentaire = commentaire;
        noteToken = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
        fields["Note Token"] = noteToken;
      } else if (mode === "annuler") {
        fields.Statut = "Annulé";
        fields.Commentaire = "Annulé : " + commentaire;
        const planningId = ticket.fields?.PlanningID;
        if (planningId) {
          await fetch('/api/airtable/Planning/'+planningId, {
            method:'PATCH',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({fields:{Statut:'Libre'}})
          });
        }
      } else if (mode === "devis") {
        fields.Statut = "Devis à faire";
        const tagsTexte = tags.length ? "[" + tags.join(" · ") + "]\n" : "";
        fields.Diagnostic = tagsTexte + explication;
        if (nonGarantiTicket) {
          fields["Client existant"] = clientExistantDevis;
          if (fraisDiagnosticApplicable) {
            fields["Frais diagnostic facturés"] = montantDiagnostic;
            fields["Frais diagnostic déduits"] = false;
          }
        }
      } else if (mode === "debloquer") {
        const dateLabel = new Date(newDate+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
        dateLabelDeblocage = newCreneau + ' — ' + dateLabel;
        fields.Statut = "Nouveau";
        fields["Créneau"] = dateLabelDeblocage;
        fields.Commentaire = "Créneau débloqué par le technicien (intervention avancée)" + (commentaire ? " : " + commentaire : "");
      } else {
        fields.Statut = "En cours";
        const dateLabel = new Date(newDate+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
        fields["Créneau"] = newCreneau + ' — ' + dateLabel;
        if (commentaire) fields.Commentaire = "Replanifié : " + commentaire;
      }
      // Bloc 4 - point 1 : si un diagnostic Max a été généré mais jamais
      // gardé manuellement, on l'inclut dans ce même PATCH de clôture — un
      // seul appel Airtable, et le diagnostic n'est plus perdu par oubli.
      // Ne touche rien si déjà gardé manuellement (ne pas écraser un texte
      // éventuellement mis à jour entre-temps).
      if ((mode === "terminer" || mode === "devis_place") && resultatDiagnostic && !diagnosticGarde) {
        fields["IKO Diagnostic"] = formaterTexteDiagnosticMax(resultatDiagnostic);
        fields["IKO Diagnostic Date"] = new Date().toISOString();
        fields["IKO Utilisé"] = true;
      }
      await fetch('/api/airtable/Tickets%20SAV/'+ticket.id, {
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({fields})
      });
      if (mode === "replanifier" && ticket.fields?.Email) {
        try {
          await fetch(WEBHOOK, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              marque: 'iko', action: 'renvoi_client',
              ticket: ticket.fields?.Name, "e-mail": ticket.fields?.Email,
            })
          });
        } catch(e) { console.error(e); }
      }
      if (mode === "debloquer") {
        try {
          await fetch(WEBHOOK, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              marque: 'iko', action: 'devis_deblocage',
              ticket: ticket.fields?.Name, nom: ticket.fields?.Client, "e-mail": ticket.fields?.Email || '',
              agence: ticket.fields?.Agence, produit: ticket.fields?.Produit, probleme: ticket.fields?.Problème,
              montant: ticket.fields?.["Montant devis"] || '', creneau: dateLabelDeblocage
            })
          });
        } catch(e) { console.error(e); }
      }
      if (mode === "devis_place" && lignesAuto.length > 0) {
        try { await envoyerDevisAuto(); } catch(e) { console.error('Erreur devis auto', e); }
      }
      if ((mode === "terminer" || mode === "devis_place") && ticket.fields?.Email) {
        try {
          const lienNote = window.location.origin + '/avis.html?token=' + noteToken;
          await fetch(WEBHOOK, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              marque: 'iko', action: 'demande_note',
              ticket: ticket.fields?.Name, nom: ticket.fields?.Client, "e-mail": ticket.fields?.Email,
              agence: ticket.fields?.Agence, produit: ticket.fields?.Produit, probleme: ticket.fields?.Problème,
              lien: lienNote
            })
          });
        } catch(e) { console.error(e); }
      }
      onDone(mode);
    } catch(e) { console.error(e); }
    setSaving(false);
  };

  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal-box">
        <div style={{width:"36px",height:"4px",background:"#D1D5DB",borderRadius:"2px",margin:"0 auto 20px"}}/>
        <div style={{marginBottom:"20px"}}>
          <div style={{fontSize:"11px",color:C.or,fontWeight:"700",fontFamily:"monospace",marginBottom:"4px"}}>{ticket.fields?.Name}</div>
          <div style={{fontSize:"16px",fontWeight:"900",color:C.white}}>{ticket.fields?.Client}</div>
          <div style={{fontSize:"12px",color:C.muted,marginTop:"3px"}}>{ticket.fields?.Produit} · {ticket.fields?.["Problème"]}</div>
          <div style={{fontSize:"12px",color:C.text,marginTop:"6px"}}>📅 {ticket.fields?.["Créneau"]}</div>
          {ticket.fields?.Adresse && <div style={{fontSize:"12px",color:C.muted,marginTop:"2px"}}>📍 {ticket.fields?.Adresse}</div>}
          <div style={{display:"flex",alignItems:"center",gap:"8px",marginTop:"8px"}}>
            <input id={"photoTerrain-" + ticket.id} type="file" accept="image/*" capture="environment" style={{display:"none"}}
              onChange={e => { const f = e.target.files?.[0]; e.target.value = ""; if (f) ajouterPhotoTerrain(f); }}/>
            <label htmlFor={"photoTerrain-" + ticket.id}
              style={{padding:"6px 10px",borderRadius:"8px",background:photoEnCoursUpload?"#D1D5DB":"rgba(34,197,94,0.1)",border:"1px solid #22C55E",color:"#16A34A",fontSize:"11px",fontWeight:"700",cursor:photoEnCoursUpload?"not-allowed":"pointer"}}>
              {photoEnCoursUpload ? "⏳ Envoi..." : "📷 Ajouter une photo"}
            </label>
            {photosTicket && <span style={{fontSize:"10px",color:C.muted}}>{photosTicket.split(",").filter(Boolean).length} photo(s) sur ce ticket</span>}
          </div>
          {erreurPhoto && <div style={{fontSize:"11px",color:"#DC2626",marginTop:"6px"}}>{erreurPhoto}</div>}
        </div>
        <DiagnosticMaxCard ticket={ticket} resultat={resultatDiagnostic} setResultat={setResultatDiagnostic}
          diagnosticGarde={diagnosticGarde} setDiagnosticGarde={setDiagnosticGarde}/>
        {!mode && (
          <>
            <div style={{fontSize:"12px",color:C.muted,marginBottom:"12px",textAlign:"center"}}>Que souhaitez-vous faire ?</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}}>
              <button onClick={() => setMode("terminer")}
                style={{padding:"20px 16px",background:C.vertDim,border:"2px solid rgba(22,163,74,0.4)",borderRadius:"14px",color:C.vert,cursor:"pointer",textAlign:"center"}}>
                <div style={{fontSize:"28px",marginBottom:"6px"}}>✅</div>
                <div style={{fontSize:"13px",fontWeight:"900"}}>SAV terminé</div>
                <div style={{fontSize:"10px",color:"rgba(22,163,74,0.7)",marginTop:"3px"}}>Intervention réalisée</div>
              </button>
              <button onClick={() => setMode("replanifier")}
                style={{padding:"20px 16px",background:C.jauneDim,border:"2px solid rgba(217,119,6,0.4)",borderRadius:"14px",color:C.jaune,cursor:"pointer",textAlign:"center"}}>
                <div style={{fontSize:"28px",marginBottom:"6px"}}>🔄</div>
                <div style={{fontSize:"13px",fontWeight:"900"}}>Replanifier</div>
                <div style={{fontSize:"10px",color:"rgba(217,119,6,0.7)",marginTop:"3px"}}>Choisir une autre date</div>
              </button>
            </div>
            <button onClick={() => setMode("devis_choix")}
              style={{width:"100%",padding:"14px",background:"rgba(0,26,66,0.06)",border:"2px solid rgba(0,26,66,0.3)",borderRadius:"14px",color:"#0D0D0D",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:"10px",marginBottom:"10px"}}>
              <span style={{fontSize:"20px"}}>💶</span>
              <div style={{textAlign:"left"}}>
                <div style={{fontSize:"13px",fontWeight:"900"}}>Devis</div>
                <div style={{fontSize:"10px",color:"rgba(0,26,66,0.7)"}}>Client payant</div>
              </div>
            </button>
            <button onClick={() => setMode("annuler")}
              style={{width:"100%",padding:"14px",background:C.rougeDim,border:"2px solid rgba(220,38,38,0.4)",borderRadius:"14px",color:C.rouge,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:"10px",marginBottom:"10px"}}>
              <span style={{fontSize:"20px"}}>❌</span>
              <div style={{textAlign:"left"}}>
                <div style={{fontSize:"13px",fontWeight:"900"}}>Annuler le RDV</div>
                <div style={{fontSize:"10px",color:"rgba(220,38,38,0.7)"}}>Client absent / annulation</div>
              </div>
            </button>
            <button onClick={onClose}
              style={{width:"100%",padding:"11px",background:"transparent",color:C.muted,border:"1px solid "+C.border,borderRadius:"10px",fontSize:"12px",cursor:"pointer"}}>
              Fermer
            </button>
          </>
        )}
        {mode === "devis_choix" && (
          <>
            <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"16px"}}>
              <button onClick={() => setMode(null)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:"18px"}}>←</button>
              <span style={{fontSize:"14px",fontWeight:"700",color:C.white}}>💶 Devis</span>
            </div>
            <div style={{fontSize:"12px",color:C.muted,marginBottom:"14px",textAlign:"center"}}>As-tu le matériel disponible pour le poser aujourd'hui ?</div>
            <button onClick={() => setMode("devis_place")}
              style={{width:"100%",padding:"16px",background:C.vertDim,border:"2px solid rgba(22,163,74,0.4)",borderRadius:"14px",color:C.vert,cursor:"pointer",textAlign:"center",marginBottom:"10px"}}>
              <div style={{fontSize:"13px",fontWeight:"900"}}>✅ Oui, j'ai le matériel</div>
              <div style={{fontSize:"10px",color:"rgba(22,163,74,0.7)",marginTop:"3px"}}>Devis + signature immédiate sur place</div>
            </button>
            <button onClick={() => setMode("devis")}
              style={{width:"100%",padding:"16px",background:"rgba(0,26,66,0.06)",border:"2px solid rgba(0,26,66,0.3)",borderRadius:"14px",color:"#0D0D0D",cursor:"pointer",textAlign:"center",marginBottom:"10px"}}>
              <div style={{fontSize:"13px",fontWeight:"900"}}>📋 Non, réparation impossible sur place</div>
              <div style={{fontSize:"10px",color:"rgba(0,26,66,0.7)",marginTop:"3px"}}>Diagnostic transmis, devis établi ensuite</div>
            </button>
          </>
        )}
        {mode === "terminer" && (
          <>
            <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"16px"}}>
              <button onClick={() => setMode(null)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:"18px"}}>←</button>
              <span style={{fontSize:"14px",fontWeight:"700",color:C.white}}>✅ Valider l'intervention</span>
            </div>
            <div style={{background:C.vertDim,border:"1px solid rgba(22,163,74,0.3)",borderRadius:"10px",padding:"10px 14px",marginBottom:"14px",fontSize:"12px",color:C.vert}}>
              Intervention sous garantie — rien à facturer au client.
            </div>
            <BlocCompteRenduMax commentaire={commentaire} setCommentaire={setCommentaire}
              placeholder="Ex : Joint remplacé, fenêtre fonctionnelle. Client satisfait." rows={3}
              enregistrementCREnCours={enregistrementCREnCours} dicterCompteRendu={dicterCompteRendu} arreterDicteeCompteRendu={arreterDicteeCompteRendu}
              texteDicteBrut={texteDicteBrut} setTexteDicteBrut={setTexteDicteBrut}
              structurationEnCours={structurationEnCours} structurerCompteRendu={structurerCompteRendu}
              compteRenduStructure={compteRenduStructure} utiliserCompteRenduStructure={utiliserCompteRenduStructure}/>
            <button onClick={confirmer} disabled={saving}
              style={{width:"100%",padding:"14px",background:saving?"#D1D5DB":C.vert,color:saving?C.muted:"#fff",border:"none",borderRadius:"12px",fontSize:"14px",fontWeight:"900",cursor:saving?"not-allowed":"pointer"}}>
              {saving ? "⏳ Enregistrement..." : "✅ Confirmer — SAV terminé"}
            </button>
          </>
        )}
        {mode === "devis_place" && (
          <>
            <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"16px"}}>
              <button onClick={() => setMode(null)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:"18px"}}>←</button>
              <span style={{fontSize:"14px",fontWeight:"700",color:C.white}}>💶 Devis sur place</span>
            </div>
            <div style={{background:C.vertDim,border:"1px solid rgba(22,163,74,0.3)",borderRadius:"10px",padding:"10px 14px",marginBottom:"14px",fontSize:"12px",color:C.vert}}>
              Sélectionnez les pièces/actions posées, faites signer le client, encaissez, puis intervenez.
            </div>

            <div style={{border:"1px solid "+C.border,borderRadius:"10px",padding:"12px",marginBottom:"14px"}}>
              <label style={{fontSize:"11px",color:C.muted,display:"block",marginBottom:"8px",fontWeight:"700"}}>💶 Pièces/actions facturées *</label>
              {chargementCatalogueAuto && <div style={{fontSize:"11px",color:C.muted}}>⏳ Chargement du catalogue...</div>}
              {!chargementCatalogueAuto && !clientInfoAuto && (
                <div style={{fontSize:"11px",color:C.muted,fontStyle:"italic"}}>Catalogue indisponible pour ce client.</div>
              )}
              {!chargementCatalogueAuto && clientInfoAuto && (
                <>
                  <button type="button" onClick={demanderSuggestionsDevis} disabled={chargementSuggestionsDevis}
                    style={{width:"100%",padding:"8px",marginBottom:"8px",borderRadius:"8px",background:"rgba(34,197,94,0.1)",border:"1px solid #22C55E",color:"#16A34A",fontSize:"11px",fontWeight:"700",cursor:chargementSuggestionsDevis?"not-allowed":"pointer"}}>
                    {chargementSuggestionsDevis ? "⏳ Max réfléchit..." : "🧠 Suggestions Max"}
                  </button>
                  {suggestionsDevis && suggestionsDevis.length === 0 && (
                    <div style={{fontSize:"10px",color:C.muted,marginBottom:"8px",fontStyle:"italic"}}>Aucune suggestion pertinente pour ce ticket.</div>
                  )}
                  {suggestionsDevis && suggestionsDevis.length > 0 && (
                    <div style={{marginBottom:"8px",display:"flex",flexDirection:"column",gap:"5px"}}>
                      {suggestionsDevis.map(l => (
                        <div key={l.catalogue_id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"6px",fontSize:"10px",background:"rgba(34,197,94,0.06)",borderRadius:"6px",padding:"6px 8px"}}>
                          <div>
                            <b>{l.designation}</b> ×{l.quantite} — {Number(l.prix).toFixed(2)} €
                            {l.justification && <div style={{color:C.muted,fontStyle:"italic",marginTop:"2px"}}>{l.justification}</div>}
                          </div>
                          <button type="button" onClick={() => ajouterLigneSuggeree(l)}
                            style={{flexShrink:0,padding:"5px 10px",borderRadius:"6px",background:"#22C55E",color:"#111",border:"none",fontWeight:"800",cursor:"pointer",fontSize:"10px"}}>
                            + Ajouter
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{display:"flex",gap:"6px",marginBottom:"8px"}}>
                    <select value={choixLigneAuto} onChange={e => setChoixLigneAuto(e.target.value)} style={{flex:1,fontSize:"12px"}}>
                      <option value="">— Ajouter une ligne —</option>
                      {catalogueAuto.produits.length > 0 && <optgroup label="Produits">
                        {catalogueAuto.produits.map(p => <option key={p.id} value={"produit|"+p.id}>{p.fields?.["Désignation"]} — {(p.fields?.["Prix unitaire HT"]||0).toFixed(2)} €</option>)}
                      </optgroup>}
                      {catalogueAuto.mo.length > 0 && <optgroup label="Main d'œuvre">
                        {catalogueAuto.mo.map(m => <option key={m.id} value={"mo|"+m.id}>{m.fields?.["Type d'action"]} — {(m.fields?.["Prix forfait HT"]||m.fields?.["Taux horaire HT"]||0).toFixed(2)} €</option>)}
                      </optgroup>}
                    </select>
                    <input type="number" min="1" value={qteLigneAuto} onChange={e => setQteLigneAuto(e.target.value)} style={{width:"50px",fontSize:"12px"}}/>
                    <button type="button" onClick={ajouterLigneAuto} style={{padding:"0 12px",background:C.card2,border:"1px solid "+C.border,borderRadius:"8px",cursor:"pointer",fontWeight:"700"}}>+</button>
                  </div>
                  {lignesAuto.length > 0 && (
                    <div style={{borderTop:"1px solid "+C.border,paddingTop:"8px",marginBottom:"8px"}}>
                      {lignesAuto.map((l, i) => (
                        <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:"11px",padding:"3px 0"}}>
                          <span>{l.designation} ×{l.qte}</span>
                          <span>{l.totalHT.toFixed(2)} € <span onClick={() => setLignesAuto(lignesAuto.filter((_,idx)=>idx!==i))} style={{cursor:"pointer",color:C.muted,marginLeft:"6px"}}>✕</span></span>
                        </div>
                      ))}
                    </div>
                  )}
                  {!lignesAuto.length && <div style={{fontSize:"10px",color:C.muted}}>Ajoutez au moins une ligne pour générer le devis.</div>}
                </>
              )}
            </div>

            <div style={{marginBottom:"14px"}}>
              <label style={{fontSize:"11px",color:C.muted,display:"block",marginBottom:"6px",fontWeight:"700"}}>Email client *</label>
              <input type="email" value={emailAuto} onChange={e => setEmailAuto(e.target.value)} placeholder="client@exemple.fr" style={{fontSize:"12px"}}/>
              <div style={{fontSize:"10px",color:C.muted,marginTop:"4px"}}>Le devis (PDF + signature électronique) sera envoyé et proposé à la signature immédiatement.</div>
            </div>

            <div style={{marginBottom:"14px"}}>
              <label style={{fontSize:"11px",color:C.muted,display:"block",marginBottom:"8px",fontWeight:"700"}}>Mode de règlement du client *</label>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>

function ItineraireModal({ agence, tickets, onClose }) {
  const dernierDepartKey = 'iko_dernier_depart_' + agence;
  const [startAddress, setStartAddress] = React.useState(() => {
    try { return localStorage.getItem(dernierDepartKey) || AGENCE_ADRESSES[agence] || ""; }
    catch(e) { return AGENCE_ADRESSES[agence] || ""; }
  });
  const [step, setStep] = React.useState("form"); // form | loading | result | error
  const [errorMsg, setErrorMsg] = React.useState("");
  const [route, setRoute] = React.useState([]);
  const [mapsUrl, setMapsUrl] = React.useState("");
  const [nbFailed, setNbFailed] = React.useState(0);
  const [gpsLoading, setGpsLoading] = React.useState(false);
  const [departLabel, setDepartLabel] = React.useState("");

  const eligibles = tickets.filter(t => {
    const s = t.fields?.Statut || "Nouveau";
    return s !== "Terminé" && s !== "Annulé" && t.fields?.Adresse && t.fields.Adresse.trim();
  });

  const lancerCalcul = async (startCoord, label) => {
    setDepartLabel(label);
    const stops = [];
    let failed = 0;
    for (const t of eligibles) {
      const fullAddr = t.fields.Adresse + (t.fields.Agence ? ', ' + t.fields.Agence.replace(/\s*\(\d+\)/,'') : '') + ', France';
      const coord = await geocodeAddress(fullAddr);
      if (coord) stops.push({ ticket: t, coord });
      else failed++;
      await pause(1100);
    }
    setNbFailed(failed);
    if (stops.length === 0) { setStep("form"); setErrorMsg("Aucune adresse n'a pu être localisée."); return; }
    const optimized = optimiserOrdre(startCoord, stops);
    setRoute(optimized);
    const originStr = label.startsWith('📍') ? (startCoord.lat + ',' + startCoord.lon) : encodeURIComponent(label);
    const destStr = encodeURIComponent(optimized[optimized.length-1].ticket.fields.Adresse);
    const waypoints = optimized.slice(0, -1).map(s => encodeURIComponent(s.ticket.fields.Adresse)).join('|');
    setMapsUrl('https://www.google.com/maps/dir/?api=1&origin=' + originStr + '&destination=' + destStr + (waypoints ? '&waypoints=' + waypoints : '') + '&travelmode=driving');
    setStep("result");
  };

  const calculer = async () => {
    if (!startAddress.trim()) { setErrorMsg("Indique une adresse de départ."); return; }
    if (eligibles.length === 0) { setErrorMsg("Aucune intervention avec adresse dans cette liste."); return; }
    setStep("loading"); setErrorMsg("");
    const startCoord = await geocodeAddress(startAddress);
    if (!startCoord) { setStep("form"); setErrorMsg("Adresse de départ introuvable, précise-la (ville + code postal)."); return; }
    try { localStorage.setItem(dernierDepartKey, startAddress); } catch(e) {}
    await pause(1100);
    await lancerCalcul(startCoord, startAddress);
  };

  const calculerDepuisGPS = () => {
    if (eligibles.length === 0) { setErrorMsg("Aucune intervention avec adresse dans cette liste."); return; }
    if (!navigator.geolocation) { setErrorMsg("La géolocalisation n'est pas disponible sur cet appareil."); return; }
    setGpsLoading(true); setErrorMsg("");
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        setGpsLoading(false);
        setStep("loading");
        const coord = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        await lancerCalcul(coord, "📍 Ma position actuelle");
      },
      (err) => {
        setGpsLoading(false);
        setErrorMsg("Impossible de récupérer ta position (autorise la géolocalisation dans les réglages du navigateur).");
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const imprimer = () => {
    const lignes = route.map((s, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${s.ticket.fields?.["Créneau"]||""}</td>
        <td>${s.ticket.fields?.Name||""}</td>
        <td>${s.ticket.fields?.Client||""}</td>
        <td>${s.ticket.fields?.Adresse||""}</td>
        <td>${s.ticket.fields?.["Téléphone"]||""}</td>
      </tr>`).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Itinéraire — ${agence}</title>
      <style>
        body{font-family:Arial,sans-serif;padding:24px;color:#111;}
        h1{font-size:18px;margin-bottom:2px;}
        .sub{color:#666;font-size:11px;margin-bottom:16px;}
        table{width:100%;border-collapse:collapse;font-size:11px;}
        th{background:#0D0D0D;color:#fff;text-align:left;padding:7px 9px;}
        td{border-bottom:1px solid #ddd;padding:7px 9px;vertical-align:top;}
        tr:nth-child(even){background:#f7f7f7;}
        .footer{margin-top:16px;font-size:9px;color:#999;}
        .toolbar{display:flex;gap:10px;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #F0DFA8;flex-wrap:wrap;}
        .toolbar button, .toolbar a{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;font-weight:700;padding:11px 20px;border-radius:10px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;line-height:1;}
        .btn-close{background:#F3F4F6;color:#374151;border:1px solid #E2E2E2 !important;}
        .btn-print{background:#0D0D0D;color:#fff;box-shadow:0 2px 10px rgba(0,26,66,0.25);}
        @media print { @page { size: landscape; margin: 12mm; } .toolbar{display:none;} }
      </style></head><body>
      <div class="toolbar">
        <button class="btn-close" onclick="window.close()"><span>←</span><span>Fermer</span></button>
        <button class="btn-print" onclick="window.print()"><span>🖨️</span><span>Imprimer / PDF</span></button>
      </div>
      <h1>Iko Suite — Itinéraire optimisé</h1>
      <div class="sub">${agence} — Départ : ${departLabel} — ${route.length} arrêt(s)</div>
      <table><thead><tr>
        <th>#</th><th>Créneau</th><th>N° Ticket</th><th>Client</th><th>Adresse</th><th>Téléphone</th>
      </tr></thead><tbody>${lignes}</tbody></table>
      <div class="footer">Iko Suite — Itinéraire calculé automatiquement (ordre indicatif, à ajuster selon le trafic)</div>
      </body></html>`;
    const w = window.open('', '_blank');
    w.document.write(html);
    w.document.close();
  };

  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal-box">
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"16px"}}>
          <div>
            <div style={{fontSize:"16px",fontWeight:"900",color:C.white}}>🗺️ Itinéraire optimisé</div>
            <div style={{fontSize:"11px",color:C.muted,marginTop:"2px"}}>{eligibles.length} intervention(s) dans cette liste</div>
          </div>
          <button onClick={onClose} style={{background:"#F3F4F6",border:"1px solid "+C.border,color:C.muted,borderRadius:"8px",width:"30px",height:"30px",cursor:"pointer",fontSize:"16px"}}>✕</button>
        </div>

        {step === "form" && (
          <>
            <label style={{fontSize:"11px",fontWeight:"700",color:C.muted,display:"block",marginBottom:"6px"}}>Point de départ</label>
            <input value={startAddress} onChange={e => setStartAddress(e.target.value)} placeholder="Adresse de l'agence ou point de départ"/>
            <div style={{fontSize:"10px",color:C.muted,marginTop:"6px",marginBottom:"6px"}}>Retient automatiquement ton dernier point de départ (domicile, chantier, agence...) — modifiable à chaque fois.</div>
            {AGENCE_ADRESSES[agence] && startAddress !== AGENCE_ADRESSES[agence] && (
              <button onClick={() => setStartAddress(AGENCE_ADRESSES[agence])} style={{background:"none",border:"none",color:C.or,fontSize:"10px",cursor:"pointer",textDecoration:"underline",padding:0,marginBottom:"14px",display:"block"}}>↺ Repartir de l'adresse de l'agence</button>
            )}
            {errorMsg && <div style={{background:C.rougeDim,border:"1px solid rgba(220,38,38,0.3)",borderRadius:"8px",padding:"10px 14px",fontSize:"12px",color:C.rouge,marginBottom:"14px"}}>{errorMsg}</div>}
            <button onClick={calculer} disabled={eligibles.length===0}
              style={{width:"100%",padding:"14px",background:eligibles.length===0?"#D1D5DB":C.or,color:"#111",border:"none",borderRadius:"12px",fontSize:"14px",fontWeight:"900",cursor:eligibles.length===0?"not-allowed":"pointer"}}>
              🧭 Calculer l'itinéraire
            </button>
            <div style={{display:"flex",alignItems:"center",gap:"10px",margin:"14px 0"}}>
              <div style={{flex:1,height:"1px",background:C.border}}/>
              <span style={{fontSize:"10px",color:C.muted}}>ou</span>
              <div style={{flex:1,height:"1px",background:C.border}}/>
            </div>
            <button onClick={calculerDepuisGPS} disabled={eligibles.length===0||gpsLoading}
              style={{width:"100%",padding:"14px",background:"#FFFFFF",color:"#0D0D0D",border:"2px solid #0D0D0D",borderRadius:"12px",fontSize:"14px",fontWeight:"900",cursor:eligibles.length===0?"not-allowed":"pointer"}}>
              {gpsLoading ? "⏳ Localisation..." : "📍 Utiliser ma position actuelle"}
            </button>
            <div style={{fontSize:"10px",color:C.muted,marginTop:"6px",textAlign:"center"}}>Pratique si tu n'es pas parti de chez toi ou de l'agence.</div>
          </>
        )}

        {step === "loading" && (
          <div style={{textAlign:"center",padding:"30px 0"}}>
            <div style={{fontSize:"28px",marginBottom:"10px"}}>⏳</div>
            <div style={{fontSize:"13px",color:C.text,fontWeight:"600"}}>Localisation des adresses...</div>
            <div style={{fontSize:"11px",color:C.muted,marginTop:"4px"}}>Ça peut prendre quelques secondes (service de géolocalisation gratuit)</div>
          </div>
        )}

        {step === "result" && (
          <>
            {nbFailed > 0 && (
              <div style={{background:C.jauneDim,border:"1px solid rgba(217,119,6,0.3)",borderRadius:"8px",padding:"8px 12px",fontSize:"11px",color:C.jaune,marginBottom:"12px"}}>
                ⚠️ {nbFailed} adresse(s) n'ont pas pu être localisée(s) et sont exclues de l'itinéraire.
              </div>
            )}
            <div style={{display:"flex",flexDirection:"column",gap:"8px",marginBottom:"16px",maxHeight:"320px",overflowY:"auto"}}>
              {route.map((s, i) => (
                <div key={s.ticket.id} style={{display:"flex",gap:"10px",background:"#F8FAFC",border:"1px solid "+C.border,borderRadius:"10px",padding:"10px 12px"}}>
                  <div style={{width:"24px",height:"24px",borderRadius:"50%",background:C.or,color:"#111",fontWeight:"900",fontSize:"12px",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</div>
                  <div style={{flex:1,minWidth:0}}>

const MOIS = {janvier:1,février:2,mars:3,avril:4,mai:5,juin:6,juillet:7,août:8,septembre:9,octobre:10,novembre:11,décembre:12};
const parseDateCreneau = (creneau) => {
  if (!creneau) return null;
  // Correctif : \w+ ne matche pas les caractères accentués en JS (février,
  // août, décembre tombaient silencieusement en échec de parsing du mois).
  // \p{L}+ (avec le flag u) matche toute lettre Unicode, accentuée ou non.
  const match = creneau.match(/(\d+)\s+(\p{L}+)(?:\s+(\d{4}))?/gu);
  if (!match) return null;
  const last = match[match.length-1];
  const parts = last.match(/(\d+)\s+(\p{L}+)(?:\s+(\d{4}))?/u);
  if (!parts) return null;
  const day = parseInt(parts[1]);
  const month = MOIS[parts[2].toLowerCase()];
  if (!month) return null;
  const year = parts[3] ? parseInt(parts[3]) : new Date().getFullYear();
  return new Date(year, month-1, day);
};

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

  // ciblage côté serveur (voir api/push.js).
  React.useEffect(() => {
    (async () => {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        if (Notification.permission === 'denied') return;
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          const perm = await Notification.requestPermission();
          if (perm !== 'granted') return;
          const keyRes = await fetch('/api/airtable/push');
          const { publicKey } = await keyRes.json();
          if (!publicKey) return;
          sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(publicKey) });
        }
        await fetch('/api/airtable/push', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subscribe: true, agence, subscription: sub.toJSON() }),
        });
      } catch (e) { /* silencieux : la notif n'est qu'un confort, pas un bloquant */ }
    })();

    } catch (e) {}
  };

  // Repli local si ElevenLabs échoue (quota/crédits épuisés, réseau...) :
  // Max reste audible via la synthèse vocale native du navigateur.
  const parlerNavigateurNatifMax = (texte) => {
    try {
      if (!('speechSynthesis' in window) || !texte) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texte);
      u.lang = 'fr-FR';
      window.speechSynthesis.speak(u);
    } catch (e) {}
  };

  const parlerMax = async (texte) => {
    try {
      if (!texte) return;
      const r = await fetch('/api/tts', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texte, voice_id: VOICE_ID_MAX }),
      });
      if (!r.ok) { parlerNavigateurNatifMax(texte); return; }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = maxAudioRef.current;
      if (a) { a.volume = 1.0; a.src = url; a.play().catch(() => parlerNavigateurNatifMax(texte)); }
    } catch (e) { parlerNavigateurNatifMax(texte); }
  };

  const executerActionsMax = (actions) => {
    (actions || []).forEach(a => {
      if (a.name === 'filtrer_onglet') {
        setOnglet(a.input.onglet);
      } else if (a.name === 'ouvrir_itineraire') {
        setItineraireOpen(true);
      } else if (a.name === 'ouvrir_ticket' && a.input.ticket_id) {
        const t = tickets.find(x => x.id === a.input.ticket_id);
        if (t) setSelectedTicket(t);
      }
    });
  };

  // chercherHistoriqueClientMax est maintenant definie au niveau module
  // (Bloc 1), partagee avec DiagnosticMaxCard — voir plus haut dans le fichier.

  const envoyerMax = async (transcript) => {
    setMaxEnCours(true);
    setMaxErreur("");
    try {
      const contexteTickets = tickets.slice(0, 100).map(t => ({
        id: t.id,
        numero: t.fields?.Name || "",
        client: t.fields?.Client || "",
        statut: t.fields?.Statut || "",
        produit: t.fields?.Produit || "",
        creneau: t.fields?.Créneau || "",
        urgent: t.fields?.Qualification === "Oui",
      }));
      const historiqueClient = selectedTicket ? await chercherHistoriqueClientMax(selectedTicket.fields?.Client) : null;
      const r = await fetch('/api/chat-technicien', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ message: transcript, tickets: contexteTickets, ongletActuel: onglet, historique: maxHistorique.slice(-6), historiqueClient })
      });
      const data = await r.json();
      if (data.erreur) { setMaxErreur(data.erreur); setMaxEnCours(false); return; }
      executerActionsMax(data.actions || []);
      const texte = data.reponse || "C'est fait.";
      setMaxDernier(texte);
      setMaxHistorique(prev => [...prev, { role: 'user', texte: transcript }, { role: 'assistant', texte }].slice(-8));
      parlerMax(texte);
    } catch (e) {
      setMaxErreur("Connexion impossible. Réessayez.");
    }
    setMaxEnCours(false);
  };

  // Enregistrement + transcription serveur (Whisper), en remplacement de
  // webkitSpeechRecognition (peu fiable sur WebKit iOS après le 1er usage).
  // Marche/arrête au tap (appuyer/relâcher), même correctif que dashboard.html.
  const maxRecorderRef = React.useRef(null);
  const maxChunksRef = React.useRef([]);
  const maxDebutEnregRef = React.useRef(0);
  const DUREE_MIN_ENREG_MS = 600;

  const lancerEcouteMax = async () => {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      const champ = document.getElementById('maxChampTexte');
      if (champ) champ.focus();
      return;
    }
    setMaxErreur("");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
        : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      const recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      maxChunksRef.current = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) maxChunksRef.current.push(e.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        setMaxEcoute(false);
        const blob = new Blob(maxChunksRef.current, { type: recorder.mimeType || mimeType || 'audio/webm' });
        if (blob.size < 800) {
          setMaxErreur("Aucune voix détectée. Réessayez en parlant juste après avoir appuyé sur le micro.");
          return;
        }
        setMaxEnCours(true);
        try {
          const r = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': blob.type || 'audio/webm' },
            body: blob,
          });
          const data = await r.json();
          if (!r.ok || data.erreur || !data.texte) {
            setMaxErreur(data.erreur || "Je n'ai rien compris. Réessayez.");
            setMaxEnCours(false);
            return;
          }
          setMaxDernier(data.texte);
          envoyerMax(data.texte);
        } catch (e) {
          setMaxErreur("Transcription impossible. Réessayez.");
          setMaxEnCours(false);
        }
      };
      maxRecorderRef.current = recorder;
      recorder.start();
      maxDebutEnregRef.current = Date.now();
      setMaxEcoute(true);
      setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 15000);
    } catch (e) {
      setMaxEcoute(false);
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError') {
        setMaxErreur("Micro refusé par le navigateur. Appuyez sur l'icône micro barrée à côté de l'adresse du site pour l'autoriser, puis réessayez.");
      } else if (e.name === 'NotFoundError') {
        setMaxErreur("Aucun micro détecté sur cet appareil.");
      } else {
        setMaxErreur("Problème micro (" + e.name + "). Utilisez le champ texte en attendant.");
      }
    }
  };

  const arreterEcouteMax = () => {
    if (!maxRecorderRef.current || maxRecorderRef.current.state !== 'recording') return;
    const ecoule = Date.now() - maxDebutEnregRef.current;
    const restant = DUREE_MIN_ENREG_MS - ecoule;
    if (restant > 0) {
      setTimeout(() => {
        if (maxRecorderRef.current && maxRecorderRef.current.state === 'recording') {
          maxRecorderRef.current.stop();
        }
      }, restant);
    } else {
      maxRecorderRef.current.stop();
    }
  };

  if (vueMode === "vocal") {
    return (

        onContextMenu={e => e.preventDefault()}>

          📋 Mes tickets
        </button>
