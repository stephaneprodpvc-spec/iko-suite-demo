          background:"radial-gradient(circle at 35% 30%, #4a4a4a, #0D0D0D 55%, #000000 100%)",
          border:"2px solid #22C55E",
          boxShadow:"0 0 90px rgba(34,197,94,0.35)",
          animation: maxEcoute ? "pulseMaxEcran 1s ease-in-out infinite" : "respireMax 3.2s ease-in-out infinite"}}/>
        <div style={{marginTop:"32px",color:"#b8b8b8",fontSize:"14px",maxWidth:"320px",textAlign:"center",minHeight:"40px",lineHeight:"1.5",padding:"0 16px"}}>
          {maxEcoute ? "Je vous écoute... (relâchez le micro pour terminer)" : maxEnCours ? "..." : maxDernier ? maxDernier : "Dites une commande à Max : \"Montre les urgents\", \"Ouvre l'itinéraire\"..."}
        </div>
        {maxErreur && <div style={{color:"#DC2626",fontSize:"12px",marginTop:"10px",padding:"0 16px",textAlign:"center"}}>{maxErreur}</div>}

        <div style={{position:"fixed",bottom:"28px",left:"16px",right:"16px",display:"flex",gap:"10px",alignItems:"center"}}>
          <input id="maxChampTexte" type="text" value={maxTexte}
            onChange={e => setMaxTexte(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && maxTexte.trim()) { debloquerVoixIOS(); envoyerMax(maxTexte.trim()); setMaxTexte(""); } }}
            placeholder="Tapez ou dictez..."
            style={{flex:1,minWidth:0,padding:"14px",borderRadius:"12px",background:"#1a1a1a",border:"1px solid rgba(34,197,94,0.3)",color:"#fff",fontSize:"14px"}}/>
          <button onClick={() => { if (maxTexte.trim()) { debloquerVoixIOS(); envoyerMax(maxTexte.trim()); setMaxTexte(""); } }}
            style={{flexShrink:0,width:"48px",height:"48px",borderRadius:"12px",background:"#22C55E",border:"none",color:"#111",fontWeight:"800",cursor:"pointer",fontSize:"18px"}}>
            →
          </button>
          <button
            onPointerDown={() => { debloquerVoixIOS(); lancerEcouteMax(); }}
            onPointerUp={arreterEcouteMax}
            onPointerLeave={arreterEcouteMax}
            onPointerCancel={arreterEcouteMax}
            style={{flexShrink:0,width:"48px",height:"48px",borderRadius:"50%",background:maxEcoute?"#DC2626":"radial-gradient(circle at 35% 30%, #4a4a4a, #0D0D0D 55%, #000000 100%)",border:"2px solid #22C55E",color:"#fff",cursor:"pointer",fontSize:"20px",boxShadow:"0 6px 24px rgba(34,197,94,0.35)",touchAction:"none",userSelect:"none"}}>
            🎙️
          </button>
        </div>
        <style>{`
          @keyframes respireMax{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
          @keyframes pulseMaxEcran{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
        `}</style>
      </div>
    );
  }

  return (
    <div style={{minHeight:"100vh",background:C.bg,maxWidth:"600px",margin:"0 auto"}}>
      {selectedTicket && (
        <ModalAction ticket={selectedTicket} onClose={() => setSelectedTicket(null)} onDone={() => { setSelectedTicket(null); charger(); }}/>
      )}
      {itineraireOpen && (
        <ItineraireModal agence={agence} tickets={filtered} onClose={() => setItineraireOpen(false)}/>
      )}
      <div style={{background:C.card,borderBottom:"1px solid "+C.border,padding:"14px 20px 10px",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
            <div style={{width:"100px",height:"48px",background:"#FFFFFF",borderRadius:"10px",display:"flex",alignItems:"center",justifyContent:"center",padding:"3px",boxSizing:"border-box"}}>
              <img src={CONFIG_ENTREPRISE.logoUrl || IKO_LOGO} alt="Iko" style={{width:"100%",height:"100%",objectFit:"contain"}}/>
            </div>
            <div>
              <div style={{fontSize:"13px",fontWeight:"700",color:C.muted}}>Technicien</div>
              <div style={{fontSize:"11px",color:C.or,marginTop:"1px",fontWeight:"700"}}>📍 {agenceShort}</div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
            <button onClick={charger} title="Rafraîchir" style={{background:C.orDim,border:"1px solid "+C.orBord,color:C.or,borderRadius:"8px",width:"30px",height:"30px",fontSize:"13px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>↺</button>
            <button onClick={onClose} title="Fermer la session" style={{background:"rgba(220,38,38,0.08)",border:"1px solid rgba(220,38,38,0.25)",color:"rgba(220,38,38,0.85)",borderRadius:"8px",width:"30px",height:"30px",cursor:"pointer",fontSize:"14px",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>✕</button>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"6px",marginTop:"10px",flexWrap:"wrap"}}>
          <button onClick={imprimerSemaine} title="Imprimer ma semaine" style={{background:C.orDim,border:"1px solid "+C.orBord,color:C.or,borderRadius:"8px",padding:"0 12px",height:"30px",fontSize:"11px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px",whiteSpace:"nowrap",flexShrink:0}}>🖨️ Ma semaine</button>
            <button onClick={() => setItineraireOpen(true)} title="Itinéraire optimisé" style={{background:"#0D0D0D",border:"1px solid #0D0D0D",color:"#fff",borderRadius:"8px",padding:"0 12px",height:"30px",fontSize:"11px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px",whiteSpace:"nowrap",flexShrink:0}}>🗺️ Itinéraire</button>
            <button onClick={() => setOnglet("devis")} title="Devis en attente" style={{background:onglet==="devis"?"#22C55E":"rgba(218,178,57,0.12)",border:"1px solid #22C55E",color:onglet==="devis"?"#111":"#8a6d1f",borderRadius:"8px",padding:"0 12px",height:"30px",fontSize:"11px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px",whiteSpace:"nowrap",flexShrink:0}}>
              📋 Devis {nbDevisAttente > 0 && <span style={{background:onglet==="devis"?"#0D0D0D":"#22C55E",color:"#fff",borderRadius:"10px",padding:"0 5px",fontSize:"10px"}}>{nbDevisAttente}</span>}
            </button>
            <button onClick={() => setNoteOpen(true)} title="Ma note client" style={{background:"rgba(217,119,6,0.12)",border:"1px solid #22C55E",color:"#8a5a06",borderRadius:"8px",padding:"0 12px",height:"30px",fontSize:"11px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:"5px",whiteSpace:"nowrap",flexShrink:0}}>
              ⭐ {moyenneAgence ? moyenneAgence.toFixed(1) : "—"}

            {noteOpen && (
              <div className="modal-overlay" onClick={e => e.target===e.currentTarget && setNoteOpen(false)}>
                <div className="modal-box" style={{textAlign:"center"}}>
                  <div style={{fontSize:"14px",fontWeight:"900",color:C.white,marginBottom:"14px"}}>⭐ Note client — {agenceShort}</div>
                  {moyenneAgence ? (
                    <>
                      <div style={{fontSize:"40px",fontWeight:"900",color:"#22C55E",marginBottom:"6px"}}>{moyenneAgence.toFixed(1)} / 5</div>
                      <div style={{fontSize:"20px",marginBottom:"10px"}}>{"⭐".repeat(Math.round(moyenneAgence))}{"☆".repeat(5-Math.round(moyenneAgence))}</div>
                      <div style={{fontSize:"11px",color:C.muted,marginBottom:"18px"}}>Basé sur {notesAgence.length} avis client{notesAgence.length>1?"s":""}</div>
                      <div style={{display:"flex",flexDirection:"column",gap:"8px",maxHeight:"220px",overflowY:"auto",textAlign:"left"}}>

                            <div style={{color:"#22C55E",marginBottom:"3px"}}>{"⭐".repeat(t.fields.Note)}</div>

                    <div style={{fontSize:"12px",color:C.muted,padding:"20px 0"}}>Aucun avis client pour le moment.</div>

                  <button onClick={() => setNoteOpen(false)} style={{width:"100%",marginTop:"16px",padding:"11px",background:"transparent",color:C.muted,border:"1px solid "+C.border,borderRadius:"10px",fontSize:"12px",cursor:"pointer"}}>Fermer</button>
                </div>

        </div>
        <div style={{display:"flex",gap:"6px",marginTop:"12px",flexWrap:"wrap"}}>
          {[["aujourd_hui","Aujourd'hui",nbAujourdhui],["a_venir","À venir",nbAVenir],["urgent","⚡ Urgent",nbUrgent],["termines","Terminés",nbTermines],["annules","Annulés",nbAnnules]].map(([id,label,count]) => (

              <div style={{fontSize:"20px",fontWeight:"900",color:onglet===id?C.or:C.white,fontFamily:"monospace",lineHeight:1}}>{count}</div>

        {!loading && filtered.length===0 && (

            <div style={{fontSize:"14px",fontWeight:"700",color:C.text}}>
              {onglet==="aujourd_hui"?"Aucune intervention aujourd'hui":onglet==="urgent"?"Aucune intervention urgente":onglet==="devis"?"Aucun devis en attente":onglet==="termines"?"Aucune intervention terminée":onglet==="annules"?"Aucune intervention annulée":"Aucune intervention à venir"}
            </div>

        <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
          {filtered.map(t => <TicketCard key={t.id} ticket={t} onAction={setSelectedTicket} onAcquitterRdv={acquitterRdv}/>)}
        </div>
        {lastRefresh && <div style={{textAlign:"center",fontSize:"9px",color:C.muted,marginTop:"20px"}}>Dernière mise à jour : {lastRefresh}</div>}

      {/* Widget vocal Max */}
      <audio ref={maxAudioRef} style={{display:"none"}}/>
      <div style={{position:"fixed",bottom:"24px",right:"24px",zIndex:200,display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"10px",WebkitUserSelect:"none",userSelect:"none",WebkitTouchCallout:"none"}}
        onContextMenu={e => e.preventDefault()}>
        {maxOuvert && (
          <div style={{width:"270px",background:C.card,border:"1px solid "+C.border,borderRadius:"14px",padding:"16px",boxShadow:"0 10px 40px rgba(0,0,0,0.35)"}}>
            <div style={{fontSize:"12px",fontWeight:"800",color:"#fff",marginBottom:"8px",letterSpacing:"1px"}}>MAX</div>
            <div style={{fontSize:"12px",color:C.muted,minHeight:"36px"}}>

          <button onClick={() => setVueMode("vocal")} title="Écran vocal Max"
            style={{width:"36px",height:"36px",borderRadius:"50%",background:C.card,border:"2px solid #22C55E",color:"#22C55E",cursor:"pointer",fontSize:"15px"}}>
            🔮

          <button
            onPointerDown={() => { debloquerVoixIOS(); setMaxOuvert(true); lancerEcouteMax(); }}
            onPointerUp={arreterEcouteMax}
            onPointerLeave={arreterEcouteMax}
            onPointerCancel={arreterEcouteMax}
            style={{width:"58px",height:"58px",borderRadius:"50%",background:"radial-gradient(circle at 35% 30%, #4a4a4a, #0D0D0D 55%, #000000 100%)",border:"2px solid #22C55E",color:"#fff",cursor:"pointer",fontSize:"24px",boxShadow:"0 0 26px rgba(34,197,94,0.35)",animation:maxEcoute?"pulseMax 1.2s infinite":"none",touchAction:"none",userSelect:"none"}}>
            🎙️
          </button>
        </div>
      </div>
      <style>{`@keyframes pulseMax{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
@keyframes clignoteUrgent{0%,100%{opacity:1;}50%{opacity:0.35;}}`}</style>
    </div>
  );
}

function Login({ onLogin }) {
  const [etat, setEtat] = React.useState("verification"); // verification | choix-agence | refuse
  const [agenceChoisie, setAgenceChoisie] = React.useState(AGENCES_DEFAUT[0]);

  React.useEffect(() => {
    window.IKO_CLIENT_READY.then(() => {
      if (window.IKO_ACCES_REFUSE) { setEtat("refuse"); return; }
      if (window.IKO_ROLE === "SUPER_ADMIN_IKO") { onLogin("global"); return; }
      setEtat("choix-agence"); // TECHNICIEN : choix metier, pas une authentification
    });
  }, []);

  if (etat === "verification") {
    return (
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
        <div style={{fontSize:"13px",color:C.muted}}>Vérification de la session…</div>
      </div>
    );
  }

  if (etat === "refuse") {
    return (
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
        <div style={{textAlign:"center",maxWidth:"320px"}}>
          <div style={{fontSize:"13px",color:C.rouge,marginBottom:"8px",fontWeight:"700"}}>Accès refusé</div>
          <div style={{fontSize:"12px",color:C.muted}}>Votre compte n'a pas les droits nécessaires pour accéder à l'Espace Technicien.</div>
        </div>
      </div>
    );
  }

  // etat === "choix-agence" : choix metier post-authentification, pas un mot de passe.
  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",position:"relative"}}>
      <div style={{width:"100%",maxWidth:"340px"}}>
        <div style={{textAlign:"center",marginBottom:"36px"}}>
          <div style={{width:"190px",height:"100px",background:"#FFFFFF",borderRadius:"16px",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",boxShadow:"0 8px 32px rgba(218,178,57,0.3)",padding:"8px",boxSizing:"border-box"}}>
            <img src={CONFIG_ENTREPRISE.logoUrl || IKO_LOGO} alt="Iko" style={{width:"100%",height:"100%",objectFit:"contain"}}/>
          </div>
          <div style={{fontSize:"11px",color:C.muted,marginTop:"6px",letterSpacing:"2px",textTransform:"uppercase"}}>Espace Technicien</div>
        </div>
        <div style={{background:C.card,border:"1px solid "+C.orBord,borderRadius:"16px",padding:"24px"}}>
          <div style={{fontSize:"12px",color:C.muted,marginBottom:"10px",textAlign:"center"}}>Choisissez votre agence</div>
          <select value={agenceChoisie} onChange={e => setAgenceChoisie(e.target.value)} style={{marginBottom:"14px"}}>
            {AGENCES_DEFAUT.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
          <button onClick={() => onLogin(agenceChoisie)} style={{width:"100%",padding:"14px",background:C.or,color:"#111",border:"none",borderRadius:"10px",fontSize:"14px",fontWeight:"900",cursor:"pointer"}}>
            Accéder →
          </button>
        </div>
      </div>
    </div>
  );
}

function BlocageAcces() {
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'14px',padding:'24px',textAlign:'center',background:'#0A0A0A',color:'#F5F5F5',fontFamily:'-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif'}}>
      <div style={{fontSize:'40px'}}>🔒</div>
      <div style={{fontSize:'18px',fontWeight:700}}>Accès suspendu</div>
      <div style={{fontSize:'14px',opacity:0.75,maxWidth:'380px'}}>L'accès à cet espace est temporairement suspendu. Merci de contacter votre interlocuteur RSIA Conseil pour régulariser la situation.</div>
    </div>
  );
}

function App() {
  const [agence, setAgence] = React.useState(null);
  const [bloque, setBloque] = React.useState(false);
  React.useEffect(() => {
    window.IKO_CLIENT_READY.then(() => {
      if (window.IKO_CLIENT_INFO && window.IKO_CLIENT_INFO["Accès bloqué"] === true) setBloque(true);
    });
  }, []);
  if (bloque) return <BlocageAcces/>;
  return agence ? <Technicien agence={agence} onClose={() => setAgence(null)}/> : <Login onLogin={setAgence}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  // Enregistrement du service worker : rend la page installable
  // (icône écran d'accueil, plein écran) sur Android et iOS.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
