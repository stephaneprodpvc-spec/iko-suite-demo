<script>
// Detection Android, la plus tot possible (avant tout style/layout), pour
// pouvoir cibler UNIQUEMENT Android avec des ajustements CSS sans toucher
// au rendu PC / tablette (iPad) / iPhone qui sont deja corrects.
if (/Android/i.test(navigator.userAgent)) document.documentElement.classList.add('is-android');
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #F5F5F5; min-height: 100vh; }
#rsia-widget-actions {
  position: fixed; bottom: 28px; right: 28px; z-index: 9999;
  display: flex; align-items: center; gap: 12px;
}
#rsia-widget-actions a.secondary-link {
  height: 58px; padding: 0 28px; background: #111111; border: none;
  border-radius: 34px; display: flex; align-items: center; gap: 10px;
  color: #FFFFFF; font-weight: 700; font-size: 17px; text-decoration: none;
  box-shadow: 0 6px 28px rgba(0,0,0,0.5); transition: transform 0.2s; white-space: nowrap;
  font-family: 'Segoe UI', sans-serif; letter-spacing: 0.3px;
}
#rsia-widget-actions a.secondary-link:hover { transform: scale(1.04); }
#rsia-widget-btn {
  position: static; bottom: auto; right: auto; height: 58px; padding: 0 28px;
  background: #111111; border-radius: 34px; display: flex; align-items: center;
  justify-content: center; gap: 10px; cursor: pointer;
  box-shadow: 0 6px 28px rgba(0,0,0,0.5); border: none;
  transition: transform 0.2s; font-family: 'Segoe UI', sans-serif;
  font-size: 17px; font-weight: 700; color: white; white-space: nowrap; letter-spacing: 0.3px;
}
#rsia-widget-btn:hover { transform: scale(1.04); }
#rsia-widget-btn svg { width: 24px; height: 24px; flex-shrink: 0; }
#rsia-widget-panel {
  position: fixed; bottom: 84px; right: 24px; width: 400px; height: 620px;
  border-radius: 18px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.22);
  z-index: 9998; display: none; flex-direction: column; background: #F5F5F5;
}
#rsia-widget-panel.open { display: flex; }
/* Le bouton "Suivi de ma demande" ne doit apparaitre que sur la page
   d'accueil, pas pendant que le client remplit le formulaire de demande. */
#rsia-widget-panel.open ~ #rsia-widget-actions a.secondary-link { display: none; }
@media (max-width: 700px) {
  #rsia-widget-actions { bottom: 16px; right: 16px; left: 16px; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
  #rsia-widget-actions a.secondary-link { height: 50px; padding: 0 20px; font-size: 14px; }
  #rsia-widget-btn { height: 50px; padding: 0 20px; font-size: 14px; }
  /* 100vh sur Chrome Android = hauteur de l'ecran SANS la barre d'adresse
     (le pire cas), ce qui deborde sous la barre visible et rend le bas du
     panneau (bouton d'envoi, champ de saisie) inaccessible. 100dvh suit la
     hauteur REELLEMENT visible et se met a jour quand la barre apparait/
     disparait. Fallback 100vh conserve pour les tres vieux navigateurs qui
     ignorent dvh (Safari iPad n'est pas concerne : il ne passe jamais par
     cette regle car il depasse 700px de large). */
  #rsia-widget-panel { bottom: 0; right: 0; width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; }
}
/* Android uniquement : les deux boutons ("Suivi de ma demande" + "Demande
   SAV") passaient a la ligne (l'un sous l'autre) faute de place ; on les
   resserre pour qu'ils restent cote a cote. PC / tablette / iPhone ne sont
   pas concernes par cette regle. */
@media (max-width: 700px) {
  .is-android #rsia-widget-actions { flex-wrap: nowrap; gap: 6px; }
  .is-android #rsia-widget-actions a.secondary-link { height: 46px; padding: 0 12px; font-size: 12px; white-space: nowrap; }
  .is-android #rsia-widget-btn { height: 46px; padding: 0 12px; font-size: 12px; white-space: nowrap; }
}
</style>
</head>

<div id="stef-gate" style="position:fixed;inset:0;z-index:999999;background:#F5F5F5;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;padding:24px;box-sizing:border-box;">
  <div style="width:100%;max-width:340px;">
    <div style="text-align:center;margin-bottom:36px;">
      <div style="width:190px;height:100px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 32px rgba(218,178,57,.3);padding:8px;box-sizing:border-box;">
        <img src="/falliero-logo.png" alt="Falliero" style="width:100%;height:100%;object-fit:contain;" />
      </div>
      <div style="color:#5B6472;font-size:11px;margin-top:6px;letter-spacing:2px;text-transform:uppercase;">Espace SAV</div>
    </div>
    <div style="background:#fff;border:1px solid rgba(218,178,57,.3);border-radius:16px;padding:24px;box-sizing:border-box;">
      <input id="stef-gate-pw" type="password" placeholder="Mot de passe" autocomplete="off" style="width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;text-align:center;letter-spacing:2px;margin-bottom:10px;" />
      <div id="stef-gate-err" style="color:#dc2626;font-size:11px;min-height:16px;margin-bottom:8px;text-align:center;"></div>
      <button id="stef-gate-btn" style="width:100%;padding:14px;background:#DAB239;color:#111;border:none;border-radius:10px;font-weight:900;font-size:14px;cursor:pointer;">Entrer</button>
    </div>
  </div>
</div>
<script>
(function(){
  var TEMP_PASSWORD = "admin";
  var gate = document.getElementById('stef-gate');
  var pw = document.getElementById('stef-gate-pw');
  var err = document.getElementById('stef-gate-err');
  var btn = document.getElementById('stef-gate-btn');
  function tryEnter(){
    if (window.Stef && typeof window.Stef.enter === 'function') { window.Stef.enter(); }
    else { setTimeout(tryEnter, 150); }
  }
  function submit(){
    if (pw.value === TEMP_PASSWORD) {
      sessionStorage.setItem('stefGateUnlocked', '1');
      gate.remove();
      tryEnter();
    } else {
      err.textContent = "Mot de passe incorrect.";
      pw.value = '';
      pw.focus();
    }
  }
  // Un vrai rafraichissement (F5 / bouton actualiser) doit TOUJOURS
  // redemander le mot de passe : c'est aussi le geste utilisateur (clic sur
  // "Entrer") qui autorise le navigateur a jouer la voix de Stef. En sautant
  // le mot de passe sur un refresh, "tryEnter()" partait sans aucun geste
  // utilisateur recent -> le navigateur bloquait silencieusement le son.
  // On ne saute donc le mot de passe QUE pour une navigation normale
  // (ex: le bouton "Retour" de suivi.html), pas pour un reload.
  var navEntries = (window.performance && performance.getEntriesByType) ? performance.getEntriesByType('navigation') : [];
  var isReload = navEntries && navEntries.length && navEntries[0].type === 'reload';
  if (!isReload && sessionStorage.getItem('stefGateUnlocked') === '1') {
    gate.remove();
    tryEnter();
  } else {
    sessionStorage.removeItem('stefGateUnlocked');
    btn.addEventListener('click', submit);
    pw.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
    setTimeout(function(){ pw.focus(); }, 100);
  }
})();
</script>

<script>
let widgetOpen = false;
let reactMounted = false;
  let amandineOpen = false;
  function toggleAmandine() {
    amandineOpen = !amandineOpen;
    const p = document.getElementById('amandine-widget-panel');
    p.style.display = amandineOpen ? 'block' : 'none';
  }
    

function toggleWidget() {
  widgetOpen = !widgetOpen;
  const panel = document.getElementById('rsia-widget-panel');
  const iconChat = document.getElementById('icon-chat');
  const iconClose = document.getElementById('icon-close');
  const btnLabel = document.getElementById('btn-label');
  if (widgetOpen) {
    panel.classList.add('open');
    iconChat.style.display = 'none';
    btnLabel.style.display = 'none';
    iconClose.style.display = 'block';
    if (!reactMounted) {
      reactMounted = true;
      setTimeout(function() { mountChatbot(); }, 50);
    }
  } else {
    panel.classList.remove('open');
    iconChat.style.display = 'block';
    btnLabel.style.display = 'inline';
    iconClose.style.display = 'none';
    if (window.__rsiaReset) window.__rsiaReset();
  }
}
</script>

async function compresserImage(file) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/')) { resolve(file); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        const maxDim = 1920;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => {
          resolve(new File([blob], file.name, { type: 'image/jpeg' }));
        }, 'image/jpeg', 0.8);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadCloudinary(file) {
  const compressed = await compresserImage(file);
  const formData = new FormData();
  formData.append('file', compressed);
  formData.append('upload_preset', CLOUDINARY_PRESET);
  formData.append('folder', 'falliero-sav');
  const resp = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/auto/upload', { method: 'POST', body: formData });
  const data = await resp.json();
  return data.secure_url;
}

async function envoyerWebhook(data) {
  const resp = await fetch('https://hook.eu1.make.com/xczscdk40wh653mmnxnx7x63kawjcgx4', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
  });
  if (!resp.ok) throw new Error('Erreur webhook');
  return true;
}

function CreneauPicker({ agenceVille, onSelect }) {
  const [typeCreneau, setTypeCreneau] = React.useState(null);
  const [dates, setDates] = React.useState([]);
  const [loading, setLoading] = React.useState(false);

  const CRENEAUX = [
    { id: "matin", label: "🌅 Matin", heure: "8h30 — 12h00", valeur: "Matin (8h30 — 12h00)" },
    { id: "apres_midi", label: "🌇 Après-midi", heure: "13h00 — 17h00", valeur: "Après-midi (13h00 — 17h00)" },
  ];

  const DELAI_MIN_JOURS = 7;

  const charger = async (c) => {
    setLoading(true);
    setDates([]);
    try {
      const f = encodeURIComponent('AND({Agence}="' + agenceVille + '",{Créneau}="' + c.valeur + '",{Statut}="Libre")');
      const url = '/api/airtable/Planning?filterByFormula=' + f + '&sort[0][field]=Date&sort[0][direction]=asc&maxRecords=60';
      const r = await fetch(url, { });
      const json = await r.json();
      const auPlusTot = new Date();
      auPlusTot.setDate(auPlusTot.getDate() + DELAI_MIN_JOURS);
      const auPlusTotStr = auPlusTot.toISOString().split('T')[0];
      const map = {};
      (json.records || []).forEach(rec => {
        const d = rec.fields.Date;
        if (d < auPlusTotStr) return;
        if (!map[d]) map[d] = { date: d, ids: [] };
        map[d].ids.push(rec.id);
      });
      setDates(Object.values(map).slice(0, 5));
    } catch(e) { console.error(e); }
    setLoading(false);
  };

  const choisir = async (dateInfo) => {
    try {
      await fetch('/api/airtable/Planning/' + dateInfo.ids[0], {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { Statut: 'Pris' } })
      });
    } catch(e) { console.error(e); }
    const d = new Date(dateInfo.date + 'T12:00:00');
    const label = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    onSelect(typeCreneau.label + ' (' + typeCreneau.heure + ') \u2014 ' + label, dateInfo.ids[0]);
  };

  if (!typeCreneau) {
    return (
      <div style={{background:F.blanc,borderRadius:"12px",padding:"12px 14px",border:"1px solid " + F.grisBord}}>
        <div style={{fontSize:"11px",fontWeight:"700",color:F.marine,marginBottom:"10px",borderLeft:"3px solid " + F.or,paddingLeft:"8px"}}>Quel créneau vous convient ?</div>
        <div style={{fontSize:"10px",color:"#64748B",marginBottom:"10px"}}>Matin ou après-midi ?</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
          {CRENEAUX.map(c => (
            <button key={c.id} onClick={() => { setTypeCreneau(c); charger(c); }}
              style={{padding:"14px 10px",border:"2px solid " + F.grisBord,borderRadius:"12px",background:F.blanc,cursor:"pointer",textAlign:"center"}}>
              <div style={{fontSize:"12px",fontWeight:"700",color:F.marine}}>{c.label}</div>
              <div style={{fontSize:"11px",color:"#64748B",marginTop:"2px"}}>{c.heure}</div>
            </button>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div style={{background:F.blanc,borderRadius:"12px",padding:"12px 14px",border:"1px solid " + F.grisBord}}>
      <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"8px"}}>
        <span style={{fontSize:"11px",color:F.or,fontWeight:"700"}}>{typeCreneau.label}</span>
        <button onClick={() => { setTypeCreneau(null); setDates([]); }}
          style={{fontSize:"10px",color:"#94A3B8",background:"none",border:"none",cursor:"pointer"}}>← Changer</button>
      </div>
      <div style={{fontSize:"10px",color:"#94A3B8",marginBottom:"10px"}}>Premières disponibilités à partir d'une semaine</div>
      {loading && <div style={{textAlign:"center",padding:"16px",color:"#64748B",fontSize:"12px"}}>⏳ Chargement des disponibilités...</div>}
      {!loading && dates.length === 0 && (
        <div style={{textAlign:"center",padding:"16px",color:F.rouge,fontSize:"12px"}}>Aucune disponibilité. Essayez l'autre créneau.</div>
      )}
      {!loading && dates.length > 0 && (
        <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
          {dates.map((d, i) => {
            const dateObj = new Date(d.date + 'T12:00:00');
            const label = dateObj.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
            return (
              <button key={i} onClick={() => choisir(d)}
                style={{padding:"12px 14px",border:"2px solid " + F.grisBord,borderRadius:"10px",background:F.blanc,cursor:"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:"12px",fontWeight:"700",color:F.marine,textTransform:"capitalize"}}>{label}</div>
                <span style={{color:F.or,fontSize:"16px"}}>→</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

                {[{key:"nom",label:"Nom et prénom",ph:"Ex : Jean Dupont",type:"text"},{key:"adresse",label:"Adresse (n° et rue)",ph:"Ex : 12 rue des Lilas",type:"text"}].map(f => (
                  <div key={f.key} style={{marginBottom:"8px"}}>
                    <label style={{fontSize:"10px",fontWeight:"600",color:"#64748B",display:"block",marginBottom:"3px"}}>{f.label} *</label>
                    <input type={f.type} placeholder={f.ph} value={client[f.key]} onChange={e => setClient({...client,[f.key]:e.target.value})}
                      style={{width:"100%",padding:"8px 10px",border:"1.5px solid " + (erreurs[f.key]?F.rouge:F.grisBord),borderRadius:"8px",fontSize:"12px",boxSizing:"border-box",outline:"none"}} />
                    {erreurs[f.key] && <span style={{fontSize:"10px",color:F.rouge}}>Champ obligatoire</span>}
                  </div>
                ))}
                <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:"8px",marginBottom:"8px"}}>
                  <div>
                    <label style={{fontSize:"10px",fontWeight:"600",color:"#64748B",display:"block",marginBottom:"3px"}}>Code postal *</label>
                    <input type="text" inputMode="numeric" maxLength={5} placeholder="65000" value={client.codePostal} onChange={e => setClient({...client,codePostal:e.target.value.replace(/\D/g,'')})}
                      style={{width:"100%",padding:"8px 10px",border:"1.5px solid " + (erreurs.codePostal?F.rouge:F.grisBord),borderRadius:"8px",fontSize:"12px",boxSizing:"border-box",outline:"none"}} />
                    {erreurs.codePostal && <span style={{fontSize:"10px",color:F.rouge}}>5 chiffres requis</span>}
                  </div>
                  <div>
                    <label style={{fontSize:"10px",fontWeight:"600",color:"#64748B",display:"block",marginBottom:"3px"}}>Ville *</label>
                    <input type="text" placeholder="Tarbes" value={client.ville} onChange={e => setClient({...client,ville:e.target.value})}
                      style={{width:"100%",padding:"8px 10px",border:"1.5px solid " + (erreurs.ville?F.rouge:F.grisBord),borderRadius:"8px",fontSize:"12px",boxSizing:"border-box",outline:"none"}} />
                    {erreurs.ville && <span style={{fontSize:"10px",color:F.rouge}}>Champ obligatoire</span>}
                  </div>
                </div>
                {[{key:"tel",label:"Téléphone",ph:"Ex : 06 12 34 56 78",type:"tel"},{key:"email",label:"Email",ph:"Ex : jean.dupont@gmail.com",type:"email"}].map(f => (
                  <div key={f.key} style={{marginBottom:"8px"}}>
                    <label style={{fontSize:"10px",fontWeight:"600",color:"#64748B",display:"block",marginBottom:"3px"}}>{f.label} *</label>
                    <input type={f.type} placeholder={f.ph} value={client[f.key]} onChange={e => setClient({...client,[f.key]:e.target.value})}
                      style={{width:"100%",padding:"8px 10px",border:"1.5px solid " + (erreurs[f.key]?F.rouge:F.grisBord),borderRadius:"8px",fontSize:"12px",boxSizing:"border-box",outline:"none"}} />
                    {erreurs[f.key] && <span style={{fontSize:"10px",color:F.rouge}}>Champ obligatoire</span>}
                  </div>
                ))}
                <button onClick={() => { if (validerInfos()) setEtape("produit"); }}
                  style={{width:"100%",padding:"11px",background:F.marine,color:F.blanc,border:"2px solid " + F.or,borderRadius:"10px",fontSize:"12px",fontWeight:"700",cursor:"pointer",marginTop:"4px"}}>
                  Continuer →
                </button>
              </div>
            )}
          </>
        )}

        {etape === "produit" && (
          <>
            <div style={{background:F.vertClair,border:"1px solid #86EFAC",borderRadius:"10px",padding:"8px 12px",fontSize:"11px"}}>
              <div style={{fontWeight:"700",color:F.marine}}>👤 {client.nom}</div>
              <div style={{color:"#475569",fontSize:"10px"}}>{agence?.ville}</div>
            </div>
            <div style={{display:"flex",gap:"8px",alignItems:"flex-end"}}>
              <div style={{width:"30px",height:"30px",background:F.marine,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:"700",color:F.blanc,flexShrink:0,border:"2px solid " + F.or}}>S</div>
              <div style={{background:F.blanc,borderRadius:"16px 16px 16px 4px",padding:"10px 14px",fontSize:"12px",boxShadow:"0 1px 4px rgba(0,0,0,0.08)",border:"1px solid " + F.grisBord}}>
                Quel produit est concerné ?
              </div>
            </div>
            {PRODUITS.map(p => (
              <button key={p.id} onClick={() => { setProduit(p); setSousType(null); setEtape(p.sousTypes ? "sous_type" : "probleme"); }}
                style={{background:F.blanc,border:"2px solid " + F.grisBord,borderRadius:"10px",padding:"11px 14px",fontSize:"12px",fontWeight:"600",color:F.marine,cursor:"pointer",textAlign:"left",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>
                {p.label}
              </button>
            ))}
          </>
        )}

        {etape === "sous_type" && (
          <>
            <div style={{display:"flex",gap:"8px",alignItems:"flex-end"}}>
              <div style={{width:"30px",height:"30px",background:F.marine,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:"700",color:F.blanc,flexShrink:0,border:"2px solid " + F.or}}>S</div>
              <div style={{background:F.blanc,borderRadius:"16px 16px 16px 4px",padding:"10px 14px",fontSize:"12px",boxShadow:"0 1px 4px rgba(0,0,0,0.08)",border:"1px solid " + F.grisBord}}>
                Quel type de porte de garage ?
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px"}}>
              {produit?.sousTypes?.map(st => (
                <button key={st} onClick={() => { setSousType(st); setEtape("probleme"); }}
                  style={{background:F.blanc,border:"2px solid " + F.grisBord,borderRadius:"12px",padding:"16px 8px",fontSize:"12px",fontWeight:"700",color:F.marine,cursor:"pointer",textAlign:"center"}}>
                  {st}
                </button>
              ))}
            </div>
          </>
        )}

        {etape === "probleme" && (
          <>
            <div style={{display:"flex",gap:"8px",alignItems:"flex-end"}}>
              <div style={{width:"30px",height:"30px",background:F.marine,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:"700",color:F.blanc,flexShrink:0,border:"2px solid " + F.or}}>S</div>
              <div style={{background:F.blanc,borderRadius:"16px 16px 16px 4px",padding:"10px 14px",fontSize:"12px",boxShadow:"0 1px 4px rgba(0,0,0,0.08)",border:"1px solid " + F.grisBord}}>
                Quel est le problème avec votre <strong style={{color:F.marine}}>{produit?.label.substring(2).trim()}</strong> ?
              </div>
            </div>
            {produit?.pb.map(p => (
              <button key={p.id} onClick={() => { setProbleme(p); setEtape("photos"); }}
                style={{background:F.blanc,border:"2px solid " + (p.urgent?"#FCA5A5":F.grisBord),borderRadius:"10px",padding:"10px 14px",fontSize:"12px",fontWeight:"600",color:F.marine,cursor:"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>
                <span>{p.label}</span>
                {p.urgent && <span style={{background:F.rougeClair,color:F.rouge,fontSize:"9px",fontWeight:"700",padding:"2px 7px",borderRadius:"20px",marginLeft:"8px",flexShrink:0}}>URGENT</span>}
              </button>
            ))}
          </>
        )}

        {etape === "photos" && (
          <div style={{background:F.blanc,borderRadius:"12px",padding:"12px 14px",border:"1px solid " + F.grisBord}}>
            <div style={{fontSize:"11px",fontWeight:"700",color:F.marine,marginBottom:"8px",borderLeft:"3px solid " + F.or,paddingLeft:"8px"}}>
              📎 Photos ou documents (facultatif)
            </div>
            <div style={{fontSize:"11px",color:"#64748B",marginBottom:"12px"}}>
              Joignez une photo du problème, votre facture ou tout document utile.
            </div>
            <label style={{display:"block",border:"2px dashed " + F.or,borderRadius:"10px",padding:"20px",textAlign:"center",cursor:"pointer",background:"#FFFDF5"}}>
              <input type="file" multiple accept="image/*,.pdf,.jpg,.jpeg,.png" style={{display:"none"}}
                onChange={e => { const files = Array.from(e.target.files); setPhotos(prev => [...prev, ...files].slice(0, 5)); }}/>
              <div style={{fontSize:"28px",marginBottom:"6px"}}>📷</div>
              <div style={{fontSize:"12px",fontWeight:"700",color:F.or}}>Appuyer pour ajouter</div>
              <div style={{fontSize:"10px",color:"#94A3B8",marginTop:"3px"}}>Photos, facture PDF — max 5 fichiers</div>
            </label>
            {photos.length > 0 && (
              <div style={{marginTop:"10px",display:"flex",flexDirection:"column",gap:"6px"}}>
                {photos.map((f,i) => (
                  <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"#F8FAFC",borderRadius:"8px",padding:"7px 10px",border:"1px solid " + F.grisBord}}>
                    <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                      <span style={{fontSize:"16px"}}>{f.type.includes('pdf') ? '📄' : '🖼️'}</span>
                      <span style={{fontSize:"11px",color:F.marine,fontWeight:"600"}}>{f.name}</span>
                    </div>
                    <button onClick={() => setPhotos(prev => prev.filter((_,j) => j!==i))}
                      style={{background:"none",border:"none",color:"#94A3B8",cursor:"pointer",fontSize:"16px",padding:"0"}}>✕</button>
                  </div>
                ))}
              </div>
            )}
            <button onClick={() => setEtape("creneau")}
              style={{width:"100%",marginTop:"12px",padding:"11px",background:F.marine,color:F.blanc,border:"2px solid " + F.or,borderRadius:"10px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}}>
              {photos.length > 0 ? "Continuer (" + photos.length + " fichier" + (photos.length>1?'s':'') + ") →" : "Passer cette étape →"}
            </button>
          </div>
        )}

        {etape === "creneau" && agence && (
          <CreneauPicker agenceVille={agence.ville} onSelect={(c, pid) => { setCreneau(c); setPlanningId(pid); setEtape("recapitulatif"); }} />
        )}

        {etape === "recapitulatif" && (
          <>
            <div style={{background:F.blanc,borderRadius:"12px",border:"2px solid " + F.or,overflow:"hidden"}}>
              <div style={{background:F.marine,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{color:F.blanc,fontWeight:"700",fontSize:"12px"}}>Récapitulatif de votre demande SAV</span>
                {probleme?.urgent && <span style={{background:F.rouge,color:F.blanc,fontSize:"9px",fontWeight:"700",padding:"2px 7px",borderRadius:"10px"}}>URGENT</span>}
              </div>
              <div style={{padding:"12px 14px"}}>
                {[
                  ["Agence", agence?.ville],
                  ["Client", client.nom],
                  ["Téléphone", client.tel],
                  ["Email", client.email],
                  ["Adresse", adresseComplete],
                  ["Garantie", garantie===true?"Oui — Facture " + facture:(garantie===false?"Non / Hors garantie":"N/A")],
                  ...(factureFichier ? [["Facture jointe", "📎 " + factureFichier.name]] : []),
                  ["Produit", produit?.label+(sousType?" — "+sousType:"")],
                  ["Problème", probleme?.label],
                  ["Créneau", creneau],
                ].map(([lbl,val],i) => (
                  <div key={i} style={{display:"flex",gap:"8px",padding:"6px 0",borderBottom:"1px solid " + F.grisBord}}>
                    <span style={{fontSize:"10px",fontWeight:"700",color:"#64748B",minWidth:"80px",flexShrink:0}}>{lbl}</span>
                    <span style={{fontSize:"11px",color:F.marine}}>{val}</span>
                  </div>
                ))}
              </div>
            </div>
            <button onClick={confirmer} disabled={sending}
              style={{width:"100%",padding:"13px",background:sending?"#64748B":F.marine,color:F.blanc,border:"2px solid " + F.or,borderRadius:"10px",fontSize:"13px",fontWeight:"700",cursor:sending?"not-allowed":"pointer"}}>
              {sending ? "⏳ Envoi en cours..." : "✅ Confirmer et envoyer ma demande"}
            </button>
          </>
        )}

        {etape === "merci" && (
          <>
            <div style={{textAlign:"center",padding:"16px 0"}}>
              <div style={{fontSize:"36px",marginBottom:"10px"}}>✅</div>
              <div style={{fontSize:"18px",fontWeight:"900",color:F.marine,marginBottom:"4px"}}>Demande envoyée !</div>
              <div style={{fontSize:"12px",color:"#64748B"}}>Votre demande SAV a bien été prise en compte.</div>
            </div>
            <div style={{background:F.marine,borderRadius:"12px",padding:"14px",textAlign:"center",border:"2px solid " + F.or}}>
              <div style={{color:F.orClair,fontSize:"10px",fontWeight:"600",marginBottom:"6px",letterSpacing:"2px"}}>VOTRE NUMÉRO DE TICKET</div>
              <div style={{color:F.or,fontSize:"24px",fontWeight:"900",letterSpacing:"2px",fontFamily:"monospace"}}>{ticket}</div>
              <div style={{color:"rgba(255,255,255,0.4)",fontSize:"10px",marginTop:"4px"}}>Conservez ce numéro pour le suivi</div>
            </div>
            {envoi === 'ok' && (
              <div style={{background:F.vertClair,border:"1px solid #86EFAC",borderRadius:"9px",padding:"8px 12px",fontSize:"11px",color:F.vert,fontWeight:"600"}}>
                ✅ Ticket enregistré — notification envoyée à l'agence
              </div>
            )}
            {envoi === 'err' && (
              <div style={{background:F.rougeClair,border:"1px solid #FCA5A5",borderRadius:"9px",padding:"8px 12px",fontSize:"11px",color:F.rouge,fontWeight:"600"}}>
                ⚠️ Ticket créé — erreur d'envoi, contactez l'agence directement
              </div>
            )}
            <div style={{background:probleme?.urgent?F.rougeClair:F.vertClair,border:"1px solid " + (probleme?.urgent?"#FCA5A5":"#86EFAC"),borderRadius:"10px",padding:"10px 14px"}}>
              <div style={{fontWeight:"700",fontSize:"12px",color:F.marine}}>
                {probleme?.urgent?"⚡ Intervention sous 24-48h":"🕐 Intervention sous 5-10 jours ouvrés"}
              </div>
              <div style={{fontSize:"11px",color:"#475569",marginTop:"2px"}}>Créneau : {creneau}</div>
            </div>
            <button onClick={reset}
              style={{width:"100%",padding:"11px",background:F.blanc,color:F.marine,border:"2px solid " + F.grisBord,borderRadius:"10px",fontSize:"12px",fontWeight:"600",cursor:"pointer"}}>
              Faire une nouvelle demande SAV
            </button>
          </>
        )}

        <div ref={bottomRef} />
      </div>

      <div style={{background:F.marine,padding:"6px 14px",textAlign:"center",flexShrink:0}}>
        <span style={{color:F.or,fontSize:"9px",opacity:0.8}}>© Falliero — Solutions IA pour les PME du bâtiment</span>
      </div>
    </div>
  );
}

function mountChatbot() {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}


</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('SW enregistré'))
      .catch(e => console.log('SW erreur', e));
  });
}
</script>
<!-- Import map STATIQUE (presente des le chargement de la page, avant tout
     script module) : necessaire pour que le personnage 3D Stef se charge de
     facon fiable sur les navigateurs Android plus anciens ou les webviews
     embarquees (WhatsApp, Facebook, Instagram, etc.), qui ne supportent
     souvent que les import maps statiques et pas celles injectees
     dynamiquement en JavaScript (ce que faisait stef-widget.js jusqu'ici,
     en secours seulement desormais). -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script>
// Bascule de test : ajouter ?stef=video ou ?stef=video2 a l'URL charge la
// variante correspondante a la place du personnage 3D (stef-widget.js).
// Sans le parametre, comportement de production inchange (personnage 3D).
// Pour revenir en arriere definitivement, il suffit de supprimer ce bloc
// et de remettre la ligne <script type="module" src="stef-widget.js?v=3">.
(function(){
  var useVideo2 = /(?:^|[?&])stef=video2(?:&|$)/.test(location.search);
  var useVideo = !useVideo2 && /(?:^|[?&])stef=video(?:&|$)/.test(location.search);
  var s = document.createElement('script');
  s.type = 'module';
  s.src = useVideo2 ? 'stef-widget-video-2.js?v=17' : (useVideo ? 'stef-widget-video.js?v=1' : 'stef-widget.js?v=3');
  document.body.appendChild(s);
})();
</script>
